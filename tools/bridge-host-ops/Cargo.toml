[package]
name = "bridge-host-ops"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
default-run = "bridge-host-ops"

[workspace]
resolver = "3"

[target.'cfg(windows)'.dev-dependencies]
device-domain = { path = "../../crates/device-domain" }
profile-platform-primitives = { path = "../../crates/primitives" }
windows-device-key = { path = "../../platform/windows-device-key" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
