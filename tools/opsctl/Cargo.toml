[package]
name = "opsctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]
members = ["core"]
resolver = "3"

[dependencies]
opsctl-core = { path = "core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_json_canonicalizer = "=0.3.2"
sha2 = { version = "=0.11.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
