name: AR-10 Acceptance Closeout Once

on:
  push:
    branches:
      - agent/ar10-acceptance-closeout

permissions:
  contents: write

concurrency:
  group: ar10-acceptance-closeout-once
  cancel-in-progress: false

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar10-acceptance-closeout
          fetch-depth: 0

      - name: Advance canonical program to accepted AR-10 and current AR-11
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')
          AR10_HEAD = 'c7f8ac9704433d3e52d3b79f985c9ac60aa068db'
          AR10_MERGE = '7ab5edf583f541d08ff732624af25881d430d427'
          AR10_ACCEPTANCE = 'docs/evidence/2026-08-19-ar10-final-acceptance.json'
          AR11_ISSUE = 372

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return text
                  raise SystemExit(f'{label}: expected text not found: {old!r}')
              return text.replace(old, new, 1)

          def replace_block(text: str, start: str, end: str, replacement: str, label: str) -> str:
              left = text.find(start)
              if left < 0:
                  raise SystemExit(f'{label}: start marker not found: {start}')
              right = text.find(end, left + len(start))
              if right < 0:
                  raise SystemExit(f'{label}: end marker not found: {end}')
              return text[:left] + replacement.rstrip() + '\n\n' + text[right:]

          # 1) AR-10 runtime authority becomes accepted only after the guarded implementation merge+reread.
          authority_path = ROOT / 'architecture/runtime-cutover-ar10.json'
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          if authority.get('status') not in {'AR10_IMPLEMENTED_PENDING_ACCEPTANCE', 'accepted'}:
              raise SystemExit('unexpected AR-10 runtime authority state')
          authority['status'] = 'accepted'
          authority['acceptance'] = {
              'evidence': AR10_ACCEPTANCE,
              'implementation_pr': 371,
              'exact_green_head': AR10_HEAD,
              'implementation_merge': AR10_MERGE,
              'implementation_main_reread': AR10_MERGE,
              'applicable_permanent_workflows': '16/16',
              'behind_by': 0,
              'blocking_reviews': 0,
              'unresolved_review_threads': 0,
              'hosted_required_status_contexts': 23,
              'production_mutation': False,
          }
          evidence = authority['repository_acceptance_evidence']
          evidence.update({
              'real_camoufox_cold_launch': 'ACCEPTED_EXACT_GREEN_HEAD',
              'cookie_and_localstorage_persistence': 'ACCEPTED_EXACT_GREEN_HEAD',
              'cross_generation_isolation': 'ACCEPTED_EXACT_GREEN_HEAD',
              'identity_mismatch_fail_closed': 'ACCEPTED_EXACT_GREEN_HEAD',
              'bridge_to_real_camoufox_chain': 'ACCEPTED_EXACT_GREEN_HEAD',
              'windows_profile_bridge_regression': 'ACCEPTED_EXACT_GREEN_HEAD',
              'managed_runtime_failure_matrix': 'ACCEPTED_EXACT_GREEN_HEAD',
              'firefox_writer_lock_failure_matrix': 'ACCEPTED_EXACT_GREEN_HEAD',
              'hosted_camoufox_required_checks': 'ACCEPTED_MAIN_23_REQUIRED_CONTEXTS',
          })
          authority_path.write_text(json.dumps(authority, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          # 2) Status/transition generator. Keep accepted AR-8/AR-9 provenance, advance only the current program projection.
          status_path = ROOT / 'scripts/generate-ar8-completion-status.py'
          text = status_path.read_text(encoding='utf-8')
          text = replace_once(text,
              '"""Deterministically project accepted AR-9 and current AR-10 into canonical status authorities."""',
              '"""Deterministically project accepted AR-10 and current AR-11 into canonical status authorities."""',
              'status docstring')
          text = replace_once(text,
              'AR10_IMPLEMENTATION_STATUS = "active_issue_266_ar9_accepted_ar10_current"',
              'AR10_PR = 371\nAR10_EXACT_GREEN_HEAD = "' + AR10_HEAD + '"\nAR10_IMPLEMENTATION_MERGE = "' + AR10_MERGE + '"\nAR10_ACCEPTANCE_EVIDENCE = "' + AR10_ACCEPTANCE + '"\nAR11_ISSUE = 372\nAR10_IMPLEMENTATION_STATUS = "active_issue_266_ar10_accepted_ar11_current"',
              'status constants')

          delivery = '''def delivery_map(base: dict[str, object]) -> dict[str, object]:
              value = copy.deepcopy(base)
              value["accepted_checkpoint"] = "AR-10"
              value["current_work"] = "AR-11"
              value["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-10",
                  "current_subslice": "AR-11",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR10_CLOSEOUT",
              }
              value["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-10",
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar10_accepted": True,
                  "acceptance_evidence": AR10_ACCEPTANCE_EVIDENCE,
              }
              value["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              value["next_gate"] = {
                  "id": "AR-11_ACCEPTANCE",
                  "issue": AR11_ISSUE,
                  "on_success": "AR-12_BECOMES_CURRENT",
              }
              value["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar9_blocked": False,
                  "ar10_accepted": True,
                  "ar10_blocked": False,
                  "ar11_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return value
          '''
          text = replace_block(text, 'def delivery_map(', 'def ar8_acceptance(', delivery, 'delivery_map')

          acceptance_funcs = '''def ar10_acceptance() -> dict[str, object]:
              return {
                  "issue": AR10_ISSUE,
                  "implementation_pr": AR10_PR,
                  "exact_green_head": AR10_EXACT_GREEN_HEAD,
                  "implementation_merge": AR10_IMPLEMENTATION_MERGE,
                  "applicable_permanent_workflows": "16/16",
                  "behind_by": 0,
                  "blocking_reviews": 0,
                  "unresolved_review_threads": 0,
                  "accepted_main_reread": AR10_IMPLEMENTATION_MERGE,
                  "evidence": AR10_ACCEPTANCE_EVIDENCE,
                  "metadata_only": True,
                  "production_mutation": False,
              }

          def ar11_projection() -> dict[str, object]:
              return {
                  "tracking_issue": AR11_ISSUE,
                  "name": "AR-11 — Release-set / Promotion Architecture",
                  "authority": "docs/ARCHITECTURE_REBASELINE_V3_PLAN.md",
                  "status": "current",
                  "production_mutation": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
              }
          '''
          text = replace_block(text, 'def ar10_projection(', 'def project_status(', acceptance_funcs, 'AR10/AR11 functions')

          project_status = '''def project_status() -> dict[str, object]:
              payload = json.loads(BASE_STATUS.read_text(encoding="utf-8"))
              current = payload["current"]
              program = current["architecture_program"]
              accepted_slices = list(program.get("accepted_slices", []))
              for accepted in ("AR-8", "AR-9", "AR-10"):
                  if accepted not in accepted_slices:
                      accepted_slices.append(accepted)
              program["accepted_slices"] = accepted_slices
              program["current_slice"] = "AR-11"
              program["next_slice_after_acceptance"] = "AR-12"
              program["ar8_progress"] = ar8_progress(projection_fields=False)
              program["ar8_acceptance"] = ar8_acceptance()
              program.pop("ar9_current", None)
              program["ar9_acceptance"] = ar9_acceptance()
              program.pop("ar10_current", None)
              program["ar10_acceptance"] = ar10_acceptance()
              program["ar11_current"] = ar11_projection()
              program["subject_domain_authorities"] = {
                  "credential_authority": "architecture/credential-authority.json",
                  "credential_registry_provenance": "architecture/credential-authority-ar8b.json",
                  "credential_lifecycle": "architecture/credential-lifecycle.json",
                  "operator_contract": "architecture/operator-contract.json",
                  "profile_security": "architecture/profile-security.json",
                  "architecture_map": "architecture/README.md",
              }
              current["current_delivery_map"] = delivery_map(current["current_delivery_map"])
              current["architecture_complete"] = False
              current["production_core_gate"] = "BLOCKED"
              current["next_repository_step"] = {
                  "name": "AR-11 — Release-set / Promotion Architecture",
                  "status": "current",
                  "tracking_issue": AR11_ISSUE,
                  "program_tracking_issue": 266,
                  "authority": "docs/ARCHITECTURE_REBASELINE_V3_PLAN.md",
                  "previous_acceptance_evidence": AR10_ACCEPTANCE_EVIDENCE,
              }
              payload.setdefault("implementation", {})["architecture_rebaseline_v3"] = AR10_IMPLEMENTATION_STATUS
              payload["production_ready"] = False
              payload["as_of"] = "2026-08-19"
              return payload
          '''
          text = replace_block(text, 'def project_status(', 'def project_transition(', project_status, 'project_status')

          project_transition = '''def project_transition() -> dict[str, object]:
              payload = json.loads(BASE_TRANSITION.read_text(encoding="utf-8"))
              payload["status"] = "ACTIVE_AFTER_AR10_ACCEPTANCE"
              payload["current_slice"] = "AR-11"
              payload["next_slice_after_acceptance"] = "AR-12"
              accepted_slices = list(payload.get("accepted_slices", []))
              for accepted in ("AR-8", "AR-9", "AR-10"):
                  if accepted not in accepted_slices:
                      accepted_slices.append(accepted)
              payload["accepted_slices"] = accepted_slices
              payload["ar8_progress"] = ar8_progress(projection_fields=True)
              payload["ar8_acceptance"] = ar8_acceptance()
              payload.pop("ar9_current", None)
              payload["ar9_acceptance"] = ar9_acceptance()
              payload.pop("ar10_current", None)
              payload["ar10_acceptance"] = ar10_acceptance()
              payload["ar11_current"] = ar11_projection()
              payload["current_delivery_map"] = delivery_map(payload["current_delivery_map"])
              policy = payload["architecture_inventory_policy"]
              policy["ar8_current_subject_projection"] = "architecture/inventory.json::subject_domain_authorities"
              policy["ar8_current_composition_root"] = "architecture/credential-authority.json"
              policy["ar8b_registry_role"] = "IMMUTABLE_ACCEPTED_PROVENANCE_DATASET"
              policy["ar9_d1_evolution_projection"] = AR9_PROJECTION
              policy["ar9_d1_evolution_source"] = AR9_AUTHORITY
              policy["ar9_acceptance_evidence"] = AR9_ACCEPTANCE_EVIDENCE
              policy["ar10_runtime_cutover_projection"] = AR10_PROJECTION
              policy["ar10_runtime_cutover_source"] = AR10_AUTHORITY
              policy["ar10_acceptance_evidence"] = AR10_ACCEPTANCE_EVIDENCE
              app = payload.get("application_architecture", {})
              app["program_handoff_status"] = "AR10_ACCEPTED_AR11_CURRENT"
              app["program_next_required_subslice"] = "AR-11"
              return payload
          '''
          text = replace_block(text, 'def project_transition(', 'def serialized(', project_transition, 'project_transition')

          validate = '''def validate(status: dict[str, object], transition: dict[str, object]) -> None:
              current = status["current"]
              program = current["architecture_program"]
              if program.get("current_slice") != "AR-11" or "AR-10" not in program.get("accepted_slices", []):
                  raise ValueError("program must advance to AR-11 only after accepted AR-10")
              if program.get("ar8_progress") != ar8_progress(projection_fields=False):
                  raise ValueError("docs/status.json accepted AR-8 progress drifted")
              if transition.get("ar8_progress") != ar8_progress(projection_fields=True):
                  raise ValueError("architecture transition accepted AR-8 progress drifted")
              if program.get("ar9_acceptance") != ar9_acceptance() or transition.get("ar9_acceptance") != ar9_acceptance():
                  raise ValueError("status and transition AR-9 acceptance projection drifted")
              if program.get("ar10_acceptance") != ar10_acceptance() or transition.get("ar10_acceptance") != ar10_acceptance():
                  raise ValueError("status and transition AR-10 acceptance projection drifted")
              if program.get("ar11_current") != ar11_projection() or transition.get("ar11_current") != ar11_projection():
                  raise ValueError("status and transition AR-11 current projection drifted")
              expected_delivery = current["current_delivery_map"]
              if expected_delivery != transition.get("current_delivery_map"):
                  raise ValueError("status and transition CURRENT_DELIVERY_MAP projections must match exactly")
              if expected_delivery.get("next_gate", {}).get("issue") != AR11_ISSUE:
                  raise ValueError("AR-11 acceptance gate must point to implementation issue #372")
              invariants = expected_delivery.get("invariants", {})
              required = {
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar9_blocked": False,
                  "ar10_accepted": True,
                  "ar10_blocked": False,
                  "ar11_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              }
              for key, wanted in required.items():
                  if invariants.get(key) != wanted:
                      raise ValueError(f"CURRENT_DELIVERY_MAP invariant {key} drifted")
              if status.get("implementation", {}).get("architecture_rebaseline_v3") != AR10_IMPLEMENTATION_STATUS:
                  raise ValueError("implementation architecture-program status drifted from accepted AR-10/current AR-11")
              if current.get("architecture_complete") is not False:
                  raise ValueError("architecture must remain incomplete during AR-11")
              if current.get("production_core_gate") != "BLOCKED" or status.get("production_ready") is not False:
                  raise ValueError("production gates must remain fail-closed during AR-11")
          '''
          text = replace_block(text, 'def validate(', 'def main(', validate, 'validate')

          main_func = '''def main() -> int:
              parser = argparse.ArgumentParser()
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--write", action="store_true")
              mode.add_argument("--check", action="store_true")
              mode.add_argument("--self-test", action="store_true")
              args = parser.parse_args()
              expected_status = project_status()
              expected_transition = project_transition()
              validate(expected_status, expected_transition)
              if args.write:
                  STATUS.write_text(serialized(expected_status), encoding="utf-8", newline="\\n")
                  TRANSITION.write_text(serialized(expected_transition), encoding="utf-8", newline="\\n")
                  print("Wrote accepted AR-10 status/transition and current AR-11 projections.")
              elif args.check:
                  actual_status = json.loads(STATUS.read_text(encoding="utf-8"))
                  actual_transition = json.loads(TRANSITION.read_text(encoding="utf-8"))
                  validate(actual_status, actual_transition)
                  if actual_status != expected_status or actual_transition != expected_transition:
                      raise SystemExit("accepted AR-10/current AR-11 status/transition projections are stale; run --write")
                  print("AR-10 accepted-main status/transition and current AR-11 projection are current while production remains blocked.")
              else:
                  negative = copy.deepcopy(expected_status)
                  negative["current"]["current_delivery_map"]["invariants"]["production_core_gate"] = "AUTHORIZED"
                  try:
                      validate(negative, expected_transition)
                  except ValueError:
                      print("Post-AR-10 premature production authorization fixture rejected as expected.")
                  else:
                      raise SystemExit("premature production authorization negative fixture unexpectedly passed")
                  stale_issue = copy.deepcopy(expected_status)
                  stale_issue["current"]["current_delivery_map"]["next_gate"]["issue"] = AR10_ISSUE
                  try:
                      validate(stale_issue, expected_transition)
                  except ValueError:
                      print("Stale AR-10 acceptance issue projection rejected as expected.")
                  else:
                      raise SystemExit("stale AR-10 acceptance issue negative fixture unexpectedly passed")
                  stale_block = copy.deepcopy(expected_status)
                  stale_block["current"]["current_delivery_map"]["invariants"]["ar10_blocked"] = True
                  try:
                      validate(stale_block, expected_transition)
                  except ValueError:
                      print("Contradictory accepted-and-blocked AR-10 projection rejected as expected.")
                  else:
                      raise SystemExit("accepted-and-blocked AR-10 negative fixture unexpectedly passed")
              return 0
          '''
          text = replace_block(text, 'def main(', 'if __name__ == "__main__":', main_func, 'main')
          text = text.replace('AR-9 accepted/current AR-10 projection failed:', 'AR-10 accepted/current AR-11 projection failed:')
          status_path.write_text(text, encoding='utf-8', newline='\n')

          # 3) Canonical inventory generator: accepted AR-10/current AR-11 and accepted runtime projection.
          inv_path = ROOT / 'scripts/generate-architecture-inventory.py'
          inv = inv_path.read_text(encoding='utf-8')
          replacements = [
              ('"""Generate canonical inventory after accepted AR-9 and during AR-10."""', '"""Generate canonical inventory after accepted AR-10 and during AR-11."""'),
              ('AR9_ACCEPTANCE_EVIDENCE = "docs/evidence/2026-08-19-ar9-final-acceptance.json"', 'AR9_ACCEPTANCE_EVIDENCE = "docs/evidence/2026-08-19-ar9-final-acceptance.json"\nAR10_ACCEPTANCE_EVIDENCE = "' + AR10_ACCEPTANCE + '"\nAR11_ISSUE = 372'),
              ('engine.CURRENT_SLICE = "AR-10"', 'engine.CURRENT_SLICE = "AR-11"'),
              ('engine.NEXT_SLICE = "AR-11"', 'engine.NEXT_SLICE = "AR-12"'),
              ('engine.CURRENT_DELIVERY_CHECKPOINT = "AR-9"', 'engine.CURRENT_DELIVERY_CHECKPOINT = "AR-10"'),
              ('for accepted in ("AR-8", "AR-9"):', 'for accepted in ("AR-8", "AR-9", "AR-10"):'),
              ('"role": "CURRENT_AR10_RUNTIME_CUTOVER_PROJECTION",', '"role": "ACCEPTED_AR10_RUNTIME_CUTOVER_PROJECTION",\n        "acceptance_evidence": AR10_ACCEPTANCE_EVIDENCE,'),
              ('documentation["ar9_acceptance_evidence"] = AR9_ACCEPTANCE_EVIDENCE', 'documentation["ar9_acceptance_evidence"] = AR9_ACCEPTANCE_EVIDENCE\n    documentation["ar10_acceptance_evidence"] = AR10_ACCEPTANCE_EVIDENCE'),
              ('Wrote architecture/inventory.json with accepted AR-9 and current AR-10 runtime-cutover projection.', 'Wrote architecture/inventory.json with accepted AR-10 runtime-cutover and current AR-11 projection.'),
              ('Architecture inventory projects accepted AR-9 and current AR-10 runtime cutover while production remains blocked.', 'Architecture inventory projects accepted AR-10 runtime cutover and current AR-11 while production remains blocked.'),
          ]
          for old, new in replacements:
              inv = replace_once(inv, old, new, 'inventory generator')
          inv = replace_once(inv,
              'if authority.get("production_mutation") is not False:',
              'if authority.get("status") != "accepted":\n        raise ValueError("AR-10 runtime cutover authority must be accepted after accepted main")\n    if authority.get("production_mutation") is not False:',
              'runtime accepted status')
          inv_delivery = '''def completion_delivery_map() -> dict[str, object]:
              value = legacy_delivery_map()
              value["accepted_checkpoint"] = "AR-10"
              value["current_work"] = "AR-11"
              value["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-10",
                  "current_subslice": "AR-11",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR10_CLOSEOUT",
              }
              value["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-10",
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar10_accepted": True,
                  "acceptance_evidence": AR10_ACCEPTANCE_EVIDENCE,
              }
              value["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              value["next_gate"] = {"id": "AR-11_ACCEPTANCE", "issue": AR11_ISSUE, "on_success": "AR-12_BECOMES_CURRENT"}
              value["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar9_blocked": False,
                  "ar10_accepted": True,
                  "ar10_blocked": False,
                  "ar11_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return value
          '''
          inv = replace_block(inv, 'def completion_delivery_map(', 'def completion_progress(', inv_delivery, 'inventory delivery')
          inv_path.write_text(inv, encoding='utf-8', newline='\n')

          # 4) AR-10 policy gate now requires accepted authority and exact final evidence.
          gate_path = ROOT / 'scripts/check-ar10-runtime-cutover.py'
          gate = gate_path.read_text(encoding='utf-8')
          gate = replace_once(gate,
              'AR10_EVIDENCE = Path("docs/ARCHITECTURE_REBASELINE_V3_AR10.md")',
              'AR10_EVIDENCE = Path("docs/ARCHITECTURE_REBASELINE_V3_AR10.md")\nAR10_ACCEPTANCE_EVIDENCE = Path("' + AR10_ACCEPTANCE + '")',
              'AR10 gate evidence constant')
          gate = replace_once(gate,
              'if authority.get("schema_version") != 1 or authority.get("status") != "AR10_IMPLEMENTED_PENDING_ACCEPTANCE":\n        fail("AR-10 runtime-cutover machine authority has invalid state")',
              'if authority.get("schema_version") != 1 or authority.get("status") != "accepted":\n        fail("AR-10 runtime-cutover machine authority must be accepted after guarded merge")',
              'AR10 gate accepted state')
          gate = replace_once(gate,
              '    read_regular(root, AR10_EVIDENCE)',
              '    read_regular(root, AR10_EVIDENCE)\n    acceptance = json.loads(read_regular(root, AR10_ACCEPTANCE_EVIDENCE))\n    if acceptance.get("kind") != "AR10_FINAL_ACCEPTANCE" or acceptance.get("implementation_merge") != "' + AR10_MERGE + '":\n        fail("AR-10 final acceptance evidence identity drifted")\n    if acceptance.get("applicable_permanent_workflows") != "16/16" or acceptance.get("production_mutation") is not False:\n        fail("AR-10 final acceptance evidence is incomplete or production-mutating")',
              'AR10 gate final evidence')
          gate_path.write_text(gate, encoding='utf-8', newline='\n')

          # 5) Current documentation authority wrapper follows accepted AR-10/current AR-11.
          doc_path = ROOT / 'scripts/check-documentation-authority.py'
          doc = doc_path.read_text(encoding='utf-8')
          doc = replace_once(doc,
              '"""Current documentation authority checker after accepted AR-9 and during AR-10."""',
              '"""Current documentation authority checker after accepted AR-10 and during AR-11."""',
              'doc checker docstring')
          doc = replace_once(doc,
              'AR10_EVIDENCE = Path("docs/ARCHITECTURE_REBASELINE_V3_AR10.md")',
              'AR10_EVIDENCE = Path("docs/ARCHITECTURE_REBASELINE_V3_AR10.md")\nAR10_ACCEPTANCE_EVIDENCE = Path("' + AR10_ACCEPTANCE + '")\nAR11_ISSUE = 372',
              'doc constants')
          for old, new in [
              ('legacy.CURRENT_SLICE = "AR-10"', 'legacy.CURRENT_SLICE = "AR-11"'),
              ('legacy.NEXT_SLICE = "AR-11"', 'legacy.NEXT_SLICE = "AR-12"'),
              ('legacy.CURRENT_DELIVERY_CHECKPOINT = "AR-9"', 'legacy.CURRENT_DELIVERY_CHECKPOINT = "AR-10"'),
              ('for accepted in ("AR-8", "AR-9"):', 'for accepted in ("AR-8", "AR-9", "AR-10"):'),
              ('    AR10_EVIDENCE,\n):', '    AR10_EVIDENCE,\n    AR10_ACCEPTANCE_EVIDENCE,\n):'),
          ]:
              doc = replace_once(doc, old, new, 'doc checker settings')
          doc_delivery = '''def expected_current_delivery_map() -> dict[str, object]:
              base = legacy_expected_current_delivery_map()
              base["accepted_checkpoint"] = "AR-10"
              base["current_work"] = "AR-11"
              base["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-10",
                  "current_subslice": "AR-11",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR10_CLOSEOUT",
              }
              base["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-10",
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar10_accepted": True,
                  "acceptance_evidence": AR10_ACCEPTANCE_EVIDENCE.as_posix(),
              }
              base["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              base["next_gate"] = {
                  "id": "AR-11_ACCEPTANCE",
                  "issue": AR11_ISSUE,
                  "on_success": "AR-12_BECOMES_CURRENT",
              }
              base["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_accepted": True,
                  "ar9_blocked": False,
                  "ar10_accepted": True,
                  "ar10_blocked": False,
                  "ar11_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return base
          '''
          doc = replace_block(doc, 'def expected_current_delivery_map(', 'def validate_ar8_progress(', doc_delivery, 'doc delivery')

          doc_ar10 = '''def validate_ar10_runtime_authority(root: Path) -> None:
              source = load_json(root, AR10_AUTHORITY)
              if (
                  source.get("kind") != "RUNTIME_CUTOVER_AUTHORITY"
                  or source.get("schema_version") != 1
                  or source.get("status") != "accepted"
                  or source.get("owning_slice") != "AR-10"
                  or source.get("owning_issue") != AR10_ISSUE
                  or source.get("completion_pr") != 371
              ):
                  raise ValueError("AR-10 runtime-cutover accepted source authority identity/state drifted")
              for key, wanted in {
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
                  "legacy_executables_remaining": 0,
              }.items():
                  if source.get(key) != wanted:
                      raise ValueError(f"AR-10 runtime-cutover source {key} drifted")
              if source.get("real_runtime", {}).get("production_certified") is not False:
                  raise ValueError("AR-10 repository integration must not masquerade as production certification")
              acceptance = source.get("acceptance")
              if not isinstance(acceptance, dict) or acceptance.get("implementation_merge") != "''' + AR10_MERGE + '''":
                  raise ValueError("AR-10 runtime authority lost guarded-merge acceptance provenance")
              evidence = load_json(root, AR10_ACCEPTANCE_EVIDENCE)
              exact = {
                  "kind": "AR10_FINAL_ACCEPTANCE",
                  "accepted_program_checkpoint": "AR-10",
                  "tracking_issue": AR10_ISSUE,
                  "implementation_pr": 371,
                  "implementation_exact_green_head": "''' + AR10_HEAD + '''",
                  "implementation_merge": "''' + AR10_MERGE + '''",
                  "implementation_main_reread": "''' + AR10_MERGE + '''",
                  "applicable_permanent_workflows": "16/16",
                  "failed_workflows": 0,
                  "pending_workflows": 0,
                  "behind_by": 0,
                  "blocking_reviews": 0,
                  "unresolved_review_threads": 0,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_authorized": False,
                  "production_enabled": False,
                  "production_mutation": False,
                  "next_slice": "AR-11",
                  "next_slice_issue": AR11_ISSUE,
              }
              for key, wanted in exact.items():
                  if evidence.get(key) != wanted:
                      raise ValueError(f"AR-10 final acceptance evidence {key} drifted")

              inventory = load_json(root, Path("architecture/inventory.json"))
              projection = inventory.get("runtime_cutover")
              if not isinstance(projection, dict):
                  raise ValueError("canonical inventory lost AR-10 runtime_cutover projection")
              if (
                  projection.get("source_authority") != AR10_AUTHORITY.as_posix()
                  or projection.get("source_status") != "accepted"
                  or projection.get("acceptance_evidence") != AR10_ACCEPTANCE_EVIDENCE.as_posix()
                  or projection.get("tracking_issue") != AR10_ISSUE
                  or projection.get("legacy_executables_remaining") != 0
              ):
                  raise ValueError("canonical inventory accepted AR-10 runtime-cutover projection identity drifted")
              for key, wanted in {
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              }.items():
                  if projection.get(key) != wanted:
                      raise ValueError(f"canonical inventory AR-10 runtime projection {key} drifted")
          '''
          doc = replace_block(doc, 'def validate_ar10_runtime_authority(', 'def validate_current_human_projection(', doc_ar10, 'doc AR10 authority')

          human = '''def validate_current_human_projection(root: Path) -> None:
              required = {
                  "README.md": (
                      "Current accepted checkpoint:** AR-10",
                      "Current implementation:** AR-11",
                      "COMPLETE THROUGH AR-10",
                      "AR-11 acceptance",
                  ),
                  "docs/README.md": (
                      "Current accepted checkpoint:** AR-10",
                      "Current implementation:** AR-11",
                      "COMPLETE THROUGH AR-10",
                      "AR-11 acceptance",
                  ),
                  "docs/INDEX.md": (
                      "AR-10 is accepted",
                      "AR-11 is the current implementation slice",
                      "COMPLETE THROUGH AR-10",
                  ),
                  "docs/DEVELOPMENT_PLAN.md": (
                      "Current accepted architecture checkpoint:** AR-10",
                      "Current implementation:** AR-11",
                      "AR-10  Runtime and Historical Executable Simplification",
                      "AR-11  Release-set / Promotion Architecture",
                      "COMPLETE THROUGH AR-10",
                  ),
                  "docs/ARCHITECTURE_REBASELINE_V3_PLAN.md": (
                      "Current accepted architecture checkpoint:** AR-10",
                      "Current implementation:** AR-11",
                      "AR-10  Runtime and Historical Executable Simplification",
                      "AR-11  Release-set / Promotion Architecture",
                      "Binding `opsctl` evolution contract",
                  ),
                  "docs/DEVELOPER_CAPABILITY_MATRIX.md": (
                      "AR-10 source is accepted on `main`; AR-11 is the current architecture slice.",
                      "COMPLETE THROUGH AR-10",
                      "AR-11 acceptance",
                      "production_ready=false",
                  ),
              }
              for relative, markers in required.items():
                  text = (root / relative).read_text(encoding="utf-8")
                  for marker in markers:
                      if marker not in text:
                          raise ValueError(f"{relative} missing accepted/current architecture marker: {marker}")
          '''
          doc = replace_block(doc, 'def validate_current_human_projection(', 'def validate(root:', human, 'doc human projection')
          doc_path.write_text(doc, encoding='utf-8', newline='\n')

          # 6) Human projections. Replace only current-authority markers, never history/evidence files.
          replacements_by_file = {
              'README.md': [
                  ('Current accepted checkpoint:** AR-9', 'Current accepted checkpoint:** AR-10'),
                  ('Current implementation:** AR-10', 'Current implementation:** AR-11'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
                  ('AR-10 acceptance', 'AR-11 acceptance'),
              ],
              'docs/README.md': [
                  ('Current accepted checkpoint:** AR-9', 'Current accepted checkpoint:** AR-10'),
                  ('Current implementation:** AR-10', 'Current implementation:** AR-11'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
                  ('AR-10 acceptance', 'AR-11 acceptance'),
              ],
              'docs/INDEX.md': [
                  ('AR-9 is accepted', 'AR-10 is accepted'),
                  ('AR-10 is the current implementation slice', 'AR-11 is the current implementation slice'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
              ],
              'docs/DEVELOPMENT_PLAN.md': [
                  ('Current accepted architecture checkpoint:** AR-9', 'Current accepted architecture checkpoint:** AR-10'),
                  ('Current implementation:** AR-10', 'Current implementation:** AR-11'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
                  ('AR-10 acceptance', 'AR-11 acceptance'),
                  ('AR-10  Runtime and Historical Executable Simplification              CURRENT', 'AR-10  Runtime and Historical Executable Simplification              DONE / ACCEPTED'),
                  ('AR-11  Release-set / Promotion Architecture', 'AR-11  Release-set / Promotion Architecture                           CURRENT'),
              ],
              'docs/ARCHITECTURE_REBASELINE_V3_PLAN.md': [
                  ('Current accepted architecture checkpoint:** AR-9', 'Current accepted architecture checkpoint:** AR-10'),
                  ('Current implementation:** AR-10', 'Current implementation:** AR-11'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
                  ('AR-10 acceptance', 'AR-11 acceptance'),
                  ('AR-10  Runtime and Historical Executable Simplification              CURRENT', 'AR-10  Runtime and Historical Executable Simplification              DONE / ACCEPTED'),
                  ('AR-11  Release-set / Promotion Architecture', 'AR-11  Release-set / Promotion Architecture                           CURRENT'),
                  ('AR-9 source is accepted on `main`; AR-10 is the current architecture slice.', 'AR-10 source is accepted on `main`; AR-11 is the current architecture slice.'),
              ],
              'docs/DEVELOPER_CAPABILITY_MATRIX.md': [
                  ('AR-9 source is accepted on `main`; AR-10 is the current architecture slice.', 'AR-10 source is accepted on `main`; AR-11 is the current architecture slice.'),
                  ('COMPLETE THROUGH AR-9', 'COMPLETE THROUGH AR-10'),
                  ('AR-10 acceptance', 'AR-11 acceptance'),
              ],
          }
          for relative, pairs in replacements_by_file.items():
              path = ROOT / relative
              body = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  body = replace_once(body, old, new, relative)
              path.write_text(body, encoding='utf-8', newline='\n')

          # Make the authority paragraph explicitly bind the accepted implementation merge and current AR-11 issue.
          plan_path = ROOT / 'docs/ARCHITECTURE_REBASELINE_V3_PLAN.md'
          plan = plan_path.read_text(encoding='utf-8')
          old = 'AR-9 is the latest accepted checkpoint, accepted through PR #367 / accepted main `5933a5e30a534209138485556b4a895706af765a` with repository evidence in `docs/evidence/2026-08-19-ar9-final-acceptance.json`.'
          new = 'AR-10 is the latest accepted checkpoint, accepted through PR #371 / accepted main `' + AR10_MERGE + '` with repository evidence in `' + AR10_ACCEPTANCE + '`; AR-11 is current under issue #372.'
          plan = replace_once(plan, old, new, 'plan authority paragraph')
          plan_path.write_text(plan, encoding='utf-8', newline='\n')

          # Append immutable human acceptance summary once.
          ar10_doc = ROOT / 'docs/ARCHITECTURE_REBASELINE_V3_AR10.md'
          ar10_text = ar10_doc.read_text(encoding='utf-8')
          marker = '## Final acceptance — 2026-08-19'
          if marker not in ar10_text:
              ar10_text += f'''\n\n{marker}\n\nAR-10 is accepted. Implementation PR #371 was exact-head green at `{AR10_HEAD}` across 16/16 permanent workflows, merged by guarded squash to accepted `main` `{AR10_MERGE}`, and reread from that accepted main. Live `main` protection preserves the accepted AR-7 required-check baseline and additionally requires `Real Camoufox cold-launch proof` plus `Profile Bridge Windows regression` (23 required contexts total).\n\nThe accepted runtime path is the native Profile Bridge -> bounded typed/versioned IPC -> real pinned Camouhost/Camoufox persistent-context chain. Persistent browser state, generation-stable fingerprint identity, OS-level Firefox writer ownership, rollback/ambiguous-close behavior, IPC malformed/oversized/replay rejection, zero remaining AR-10 historical direct executables, and zero `opsctl` production child-process spawn authority are permanent regression evidence.\n\nAcceptance does **not** authorize production: `architecture_complete=false`, `production_core_gate=BLOCKED`, `production_ready=false`, `production_mutation=false`. AR-11 — Release-set / Promotion Architecture is current under issue #372; AR-12 follows only after AR-11 acceptance. Canonical machine evidence is `{AR10_ACCEPTANCE}`.\n'''
              ar10_doc.write_text(ar10_text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate canonical JSON projections
        run: |
          python scripts/generate-ar8-completion-status.py --write
          python scripts/generate-architecture-inventory.py --write

      - name: Validate accepted AR-10/current AR-11 authorities
        run: |
          python -m py_compile scripts/generate-ar8-completion-status.py scripts/generate-architecture-inventory.py scripts/check-documentation-authority.py scripts/check-ar10-runtime-cutover.py
          python scripts/generate-ar8-completion-status.py --check
          python scripts/generate-ar8-completion-status.py --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-documentation-authority.py
          python scripts/check-documentation-authority.py --self-test
          python scripts/check-ar10-runtime-cutover.py --closeout
          git diff --check

      - name: Commit deterministic acceptance closeout
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            architecture/runtime-cutover-ar10.json \
            architecture/inventory.json \
            architecture/architecture-rebaseline-v3-transition.json \
            scripts/generate-ar8-completion-status.py \
            scripts/generate-architecture-inventory.py \
            scripts/check-documentation-authority.py \
            scripts/check-ar10-runtime-cutover.py \
            docs/status.json \
            README.md \
            docs/README.md \
            docs/INDEX.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/ARCHITECTURE_REBASELINE_V3_PLAN.md \
            docs/DEVELOPER_CAPABILITY_MATRIX.md \
            docs/ARCHITECTURE_REBASELINE_V3_AR10.md
          git commit -m 'Accept AR-10 and advance AR-11'
          git push origin HEAD:agent/ar10-acceptance-closeout
