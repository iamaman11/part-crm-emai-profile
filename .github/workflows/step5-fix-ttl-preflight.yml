name: Temporary Step 5 TTL Preflight Fix

on:
  push:
    branches:
      - repository-step-5-profile-coordinator

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-5-profile-coordinator

      - name: Apply idempotent TTL preflight patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("crates/session-domain/src/coordinator.rs")
          text = path.read_text(encoding="utf-8")

          heartbeat = '''    fn heartbeat(
        &mut self,
        session_id: &SessionId,
        epoch: u64,
        fencing_token: &FencingToken,
        now: UnixMillis,
    ) -> Result<CoordinatorOutcome, CoordinatorError> {
        if !matches!(
            self.status,
            CoordinatorStatus::Active | CoordinatorStatus::Draining
        ) {
            return Err(CoordinatorError::NoActiveLease);
        }
        let lease = self
            .active_lease
            .as_ref()
            .ok_or(CoordinatorError::NoActiveLease)?;
        if !lease.accepts_writer(session_id, epoch, fencing_token) {
            return Err(CoordinatorError::StaleWriter);
        }
        if now < lease.last_heartbeat_at {
            return Err(CoordinatorError::ReorderedHeartbeat);
        }
        if let Some(outcome) = self.timeout_if_due(now) {
            return Ok(outcome);
        }

        let proposed_idle = add_millis(now, self.config.idle_timeout_ms)?;
        let lease = self
            .active_lease
            .as_mut()
            .ok_or(CoordinatorError::NoActiveLease)?;
        lease.last_heartbeat_at = now;
        lease.idle_expires_at = if proposed_idle < lease.hard_expires_at {
            proposed_idle
        } else {
            lease.hard_expires_at
        };
        Ok(CoordinatorOutcome::HeartbeatAccepted {
            idle_expires_at: lease.idle_expires_at,
        })
    }

'''
          release = '''    fn release(
        &mut self,
        session_id: &SessionId,
        epoch: u64,
        fencing_token: &FencingToken,
        disposition: ReleaseDisposition,
        now: UnixMillis,
    ) -> Result<CoordinatorOutcome, CoordinatorError> {
        let lease = self
            .active_lease
            .as_ref()
            .ok_or(CoordinatorError::NoActiveLease)?;
        if !lease.accepts_writer(session_id, epoch, fencing_token) {
            return Err(CoordinatorError::StaleWriter);
        }
        if let Some(outcome) = self.timeout_if_due(now) {
            return Ok(outcome);
        }

        self.active_lease = None;
        self.pending_intent = None;
        self.drain_deadline = None;
        self.status = match disposition {
            ReleaseDisposition::Clean => CoordinatorStatus::Idle,
            ReleaseDisposition::Dirty => CoordinatorStatus::Dirty,
            ReleaseDisposition::Uncertain => CoordinatorStatus::Uncertain,
        };
        Ok(CoordinatorOutcome::Released { disposition })
    }

'''
          begin_drain = '''    fn begin_drain(&mut self, now: UnixMillis) -> Result<CoordinatorOutcome, CoordinatorError> {
        if self.status != CoordinatorStatus::Active || self.active_lease.is_none() {
            return Err(CoordinatorError::NoActiveLease);
        }
        if let Some(outcome) = self.timeout_if_due(now) {
            return Ok(outcome);
        }
        let deadline = add_millis(now, self.config.drain_timeout_ms)?;
        self.status = CoordinatorStatus::Draining;
        self.drain_deadline = Some(deadline);
        Ok(CoordinatorOutcome::DrainStarted { deadline })
    }

'''
          tick_and_helper = '''    fn tick(&mut self, now: UnixMillis) -> Result<CoordinatorOutcome, CoordinatorError> {
        if let Some(intent) = &self.pending_intent
            && now >= intent.expires_at
        {
            self.pending_intent = None;
            return Ok(CoordinatorOutcome::LaunchIntentExpired);
        }
        Ok(self
            .timeout_if_due(now)
            .unwrap_or(CoordinatorOutcome::NoChange))
    }

    fn timeout_if_due(&mut self, now: UnixMillis) -> Option<CoordinatorOutcome> {
        let lease = self.active_lease.as_ref()?;
        let kind = if self.status == CoordinatorStatus::Draining
            && self.drain_deadline.is_some_and(|deadline| now >= deadline)
        {
            Some(TimeoutKind::Drain)
        } else if now >= lease.hard_expires_at {
            Some(TimeoutKind::Hard)
        } else if now >= lease.idle_expires_at {
            Some(TimeoutKind::Idle)
        } else {
            None
        }?;

        self.active_lease = None;
        self.pending_intent = None;
        self.drain_deadline = None;
        self.status = CoordinatorStatus::Uncertain;
        Some(CoordinatorOutcome::TimedOut { kind })
    }

'''

          replacements = [
              (r"    fn heartbeat\(.*?(?=    fn release\()", heartbeat),
              (r"    fn release\(.*?(?=    fn begin_drain\()", release),
              (r"    fn begin_drain\(.*?(?=    fn tick\()", begin_drain),
              (r"    fn tick\(.*?(?=    fn mark_recovered\()", tick_and_helper),
          ]
          for pattern, replacement in replacements:
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"failed coordinator replacement: {pattern}")

          if "fn late_clean_release_becomes_uncertain" not in text:
              marker = "    #[test]\n    fn drain_timeout_never_reports_a_clean_release"
              test = '''    #[test]
    fn late_clean_release_becomes_uncertain() -> Result<(), Box<dyn std::error::Error>> {
        let mut state = coordinator()?;
        issue(&mut state, 1, 1, 10)?;
        claim(&mut state, 2, 2, 11, "fence_01JCOORDINATOR")?;
        let release = state.apply(envelope(
            "idem_late_release_01JCOORDINATOR",
            3,
            3,
            CoordinatorCommand::Release {
                session_id: SessionId::parse("session_01JCOORDINATOR")?,
                epoch: 1,
                fencing_token: FencingToken::parse("fence_01JCOORDINATOR")?,
                disposition: ReleaseDisposition::Clean,
                now: UnixMillis::new(21),
            },
        )?)?;
        assert_eq!(
            release.outcome(),
            &CoordinatorOutcome::TimedOut {
                kind: TimeoutKind::Idle
            }
        );
        assert_eq!(state.status(), CoordinatorStatus::Uncertain);
        Ok(())
    }

    #[test]
    fn drain_timeout_never_reports_a_clean_release'''
              if marker not in text:
                  raise SystemExit("failed late-release test insertion")
              text = text.replace(marker, test, 1)

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          rm .github/workflows/step5-fix-ttl-preflight.yml

      - name: Commit TTL fix and workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/session-domain/src/coordinator.rs .github/workflows/step5-fix-ttl-preflight.yml
          git commit -m "Step 5: enforce lease TTL before writer transitions"
          git push origin HEAD:repository-step-5-profile-coordinator
