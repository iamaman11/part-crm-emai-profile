name: React UI Evidence Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'react-ui-composition' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Sync evidence-scoped documentation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status_path = Path('docs/status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['as_of'] = '2026-08-07'
          status['implementation']['frontend'] = 'candidate_pr_64_repository_local_react_operator_ui'
          status['implementation']['mailbox_operations'] = 'accepted_pr_60_repaired_pr_62_composed_synthetic'
          status['evidence']['frontend_candidate'] = 'pr_64_node_24_19_0_npm_11_17_0_frontend_gate_run_31207221527'
          status['evidence']['mailbox_composition'] = 'accepted_pr_62_head_80d5da1239595c2562752307d2e48a7b14a0ba3e_quality_run_31204097542'
          assert status['implementation']['production_code'] is False
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          index_path = Path('docs/TEST_EVIDENCE_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('**Дата:** 2026-08-06', '**Дата:** 2026-08-07', 1)
          step10 = '| Repository Step 10 / PR #33 | accepted bounded synthetic evidence | required/optional/prohibited certification policy, deterministic matrix/vector, privacy-safe support output, typed device grant journal, exact preverified update/health identity, rollback/fail-closed state and Linux/Windows/WASM gates | real fingerprint certification, physical second device, production unwrap, cryptographic signature verification, trusted signing or production readiness |'
          additions = step10 + "\n" + '| Mailbox composition / PR #60 + repair PR #62 | accepted repository-local composed/synthetic evidence | D1 mailbox binding/job persistence, secret-handle-only request DTOs, idempotency/audit/outbox, Worker API routes, metadata-only synthetic provider path, adapter/native/WASM/release compilation | real Gmail/IMAP/browser execution, mailbox contents, production scheduler/provider evidence or production readiness |' + "\n" + '| React operator UI / PR #64 | candidate repository-local composed evidence; acceptance pending final exact-head merge | Node 24.19.0/npm 11.17.0 exact runtime, locked React/Vite/TypeScript workspace, same-origin API/problem boundary, neutral disclosure, high-impact confirmation, strict TS/tests/build and Static Assets gate | deployed Cloudflare Access UI, real Bridge/custom-URI onboarding, real providers, missing backend list APIs or production readiness |'
          if '| Mailbox composition / PR #60 + repair PR #62 |' not in index:
              index = index.replace(step10, additions, 1)

          marker = '## 2. Required Permanent CI Evidence'
          detail = '''### Post-roadmap Mailbox Composition Evidence\n\n- accepted composition: issue #56 / PR #60, followed by forward-only repair issue #61 / PR #62;\n- repair accepted source head: `80d5da1239595c2562752307d2e48a7b14a0ba3e`;\n- squash merge establishing repaired composed state: `497953bf67af1c40fd35da465106f93b0a68685d`;\n- exact-head Quality Gate run: `31204097542`, conclusion `success`;\n- Repository Quality Audit Gate run: `31204098505`, conclusion `success`;\n- Profile Generation regression run: `31204096927`, conclusion `success`;\n- adapter mailbox suite was compiled/executed and Worker native/WASM/release composition passed;\n- real mailbox providers, mailbox payload processing and production scheduling were not involved.\n\n### React Operator UI Candidate Evidence\n\n- tracking: issue #63 / draft PR #64; acceptance on `main` is still pending final exact-head CI and squash merge;\n- runtime pins: Node `24.19.0`, npm `11.17.0`; lockfile is authoritative and clean install uses `npm ci`;\n- candidate Frontend Gate run `31207221527`, conclusion `success`;\n- the lane passed exact runtime checks, clean install, application-source credential-persistence scan, strict TypeScript, 7 unit tests, Vite production build and Static Assets output verification;\n- component/API tests cover same-origin transport, problem normalization, neutral resource disclosure, session success/error and destructive-action confirmation;\n- no Cloudflare production deployment, real device onboarding, real provider execution or user data was involved;\n- this entry records candidate evidence only and does not promote `production_ready`.\n\n'''
          if '### React Operator UI Candidate Evidence' not in index:
              index = index.replace(marker, detail + marker, 1)
          index_path.write_text(index, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit documentation
        run: |
          rm .github/workflows/react-ui-evidence-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/TEST_EVIDENCE_INDEX.md .github/workflows/react-ui-evidence-sync.yml
          git commit -m "Sync React UI candidate evidence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
