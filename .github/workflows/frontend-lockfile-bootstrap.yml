name: Frontend Lockfile Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'react-ui-composition'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce npm version
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Generate exact frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only

      - name: Commit lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "Lock frontend dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Clean install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build
