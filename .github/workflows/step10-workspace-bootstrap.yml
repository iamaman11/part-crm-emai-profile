name: Step 10 Workspace Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step10-workspace-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-10-certification-multi-device
          persist-credentials: true

      - name: Register and correct Step 10 workspace boundary
        run: |
          python scripts/bootstrap-step10.py
          python scripts/fix-step10-clippy.py

      - name: Remove temporary bootstrap files
        run: git rm .github/workflows/step10-workspace-bootstrap.yml scripts/bootstrap-step10.py scripts/fix-step10-clippy.py .step10-workspace-trigger

      - name: Format and resolve workspace lock
        run: |
          cargo fmt --all
          cargo check -p certification-domain

      - name: Verify Step 10 boundary
        run: |
          python -m py_compile scripts/check-step10-certification.py scripts/check-architecture.py
          python scripts/check-architecture.py
          python scripts/check-step10-certification.py
          if python scripts/check-step10-certification.py --root tests/certification/fixtures/raw-signal-output; then
            echo "Raw-signal output fixture unexpectedly passed." >&2
            exit 1
          fi
          cargo clippy --locked -p certification-domain --all-targets -- -D warnings
          cargo test --locked -p certification-domain
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p certification-domain --target wasm32-unknown-unknown

      - name: Commit verified Step 10 workspace
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 10: implement synthetic certification contracts"
          git fetch origin repository-step-10-certification-multi-device
          git rebase origin/repository-step-10-certification-multi-device
          git push origin HEAD:repository-step-10-certification-multi-device
