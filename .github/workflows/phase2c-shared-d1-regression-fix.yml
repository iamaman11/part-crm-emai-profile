# Temporary branch-only validator; delete after validated test commit lands.
name: Phase 2C Shared D1 Regression Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2c-client-merge-assignment-ui
          persist-credentials: true
      - name: Replace legacy direct assignment-history fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/test-d1-schema.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_foreign_keys_status_and_uniqueness_are_enforced(')
          end = text.index('\ndef test_cross_tenant_commands_are_rejected', start)
          replacement = '''def test_foreign_keys_status_and_uniqueness_are_enforced(
              connection: sqlite3.Connection,
          ) -> None:
              expect_integrity_error(
                  lambda: connection.execute(
                      """
                      INSERT INTO browser_profiles (
                          tenant_id, profile_id, status, version,
                          created_by_actor_id, updated_by_actor_id, created_at_ms, updated_at_ms
                      ) VALUES (?, 'profile_missing_owner', 'DRAFT', 1, 'actor_missing', 'actor_missing', 40, 40)
                      """,
                      (TENANT_A,),
                  )
              )
              connection.rollback()

              expect_integrity_error(
                  lambda: connection.execute(
                      """
                      INSERT INTO profile_assignment_commands (
                          tenant_id, command_id, command_actor_id, assignment_id,
                          profile_id, client_id, expected_profile_version, reason, executed_at_ms
                      ) VALUES (?, 'cmd_assignment_cross_tenant', ?, 'assignment_cross_tenant',
                                ?, ?, 1, 'invalid tenant link', 50)
                      """,
                      (TENANT_A, OWNER_A, PROFILE_A, CLIENT_B),
                  ),
                  "assignment_client_not_active",
              )
              connection.rollback()

              connection.execute(
                  "UPDATE clients SET status = 'ARCHIVED', version = 2 WHERE tenant_id = ? AND client_id = ?",
                  (TENANT_A, CLIENT_A),
              )
              expect_integrity_error(
                  lambda: connection.execute(
                      """
                      INSERT INTO profile_assignment_commands (
                          tenant_id, command_id, command_actor_id, assignment_id,
                          profile_id, client_id, expected_profile_version, reason, executed_at_ms
                      ) VALUES (?, 'cmd_assignment_archived', ?, 'assignment_archived',
                                ?, ?, 1, 'archived client', 60)
                      """,
                      (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),
                  ),
                  "assignment_client_not_active",
              )
              connection.rollback()
              connection.execute(
                  "UPDATE clients SET status = 'ACTIVE' WHERE tenant_id = ? AND client_id = ?",
                  (TENANT_A, CLIENT_A),
              )
              connection.commit()

              expect_integrity_error(
                  lambda: connection.execute(
                      """
                      INSERT INTO client_contact_points (
                          tenant_id, client_id, contact_point_id, kind, status,
                          normalization_version, protection_version,
                          ciphertext, nonce, encryption_key_version,
                          exact_lookup_token, lookup_key_version,
                          created_by_actor_id, updated_by_actor_id,
                          created_at_ms, updated_at_ms
                      ) VALUES (
                          ?, ?, 'contact_cross_tenant', 'EMAIL', 'ACTIVE',
                          1, 1, ?, ?, 1, ?, 1, ?, ?, 65, 65
                      )
                      """,
                      (
                          TENANT_A,
                          CLIENT_B,
                          bytes([0xA5]) * 48,
                          bytes([0x5A]) * 24,
                          bytes(range(32)),
                          OWNER_A,
                          OWNER_A,
                      ),
                  ),
                  "client_contact_client_not_active",
              )
              connection.rollback()

              connection.execute(
                  """
                  INSERT INTO profile_assignment_commands (
                      tenant_id, command_id, command_actor_id, assignment_id,
                      profile_id, client_id, expected_profile_version, reason, executed_at_ms
                  ) VALUES (?, 'cmd_assignment_primary_one', ?, 'assignment_primary_one',
                            ?, ?, 1, 'primary assignment', 70)
                  """,
                  (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),
              )
              connection.commit()
              expect_integrity_error(
                  lambda: connection.execute(
                      """
                      INSERT INTO profile_assignment_commands (
                          tenant_id, command_id, command_actor_id, assignment_id,
                          profile_id, client_id, expected_profile_version, reason, executed_at_ms
                      ) VALUES (?, 'cmd_assignment_primary_two', ?, 'assignment_primary_two',
                                ?, ?, 2, 'duplicate active assignment', 71)
                      """,
                      (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),
                  ),
                  "profile_assignment_same_client",
              )
              connection.rollback()
              active_assignments = connection.execute(
                  """
                  SELECT COUNT(*) AS value
                  FROM profile_client_assignments
                  WHERE tenant_id = ? AND profile_id = ? AND closed_at_ms IS NULL
                  """,
                  (TENANT_A, PROFILE_A),
              ).fetchone()["value"]
              assert active_assignments == 1
              assert (
                  connection.execute(
                      "SELECT COUNT(*) FROM profile_grants WHERE tenant_id = ? AND profile_id = ?",
                      (TENANT_A, PROFILE_A),
                  ).fetchone()[0]
                  == 0
              )
              assert (
                  connection.execute(
                      "SELECT COUNT(*) FROM client_grants WHERE tenant_id = ? AND client_id = ?",
                      (TENANT_A, CLIENT_A),
                  ).fetchone()[0]
                  == 0
              )
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
      - name: Run shared D1 invariant suite
        run: python scripts/test-d1-schema.py
      - name: Run Phase 2C D1 proof
        run: python scripts/test-phase2c-client-merge-assignment.py
      - name: Commit validated shared-test evolution
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/test-d1-schema.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2C: evolve shared assignment D1 fixtures to governed commands'
          git push origin HEAD:phase2c-client-merge-assignment-ui
