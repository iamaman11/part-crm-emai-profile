name: Phase 2C Shared D1 Regression Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2c-client-merge-assignment-ui
          persist-credentials: true
      - name: Patch legacy direct assignment-history fixtures
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/test-d1-schema.py')
          text = path.read_text(encoding='utf-8')

          def replace_block(start_marker: str, end_marker: str, replacement: str) -> None:
              global text
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = text[:start] + replacement + text[end:]

          replace_block(
              '''        expect_integrity_error(\n            lambda: connection.execute(\n                """\n                INSERT INTO profile_client_assignments (\n                    tenant_id, assignment_id, profile_id, client_id,\n                    assigned_by_actor_id, assigned_at_ms, reason\n                ) VALUES (?, 'assignment_cross_tenant', ?, ?, ?, 50, 'invalid tenant link')\n                """,\n                (TENANT_A, PROFILE_A, CLIENT_B, OWNER_A),\n            ),\n            "assignment_client_not_active",\n        )\n        connection.rollback()\n''',
              '''\n        connection.execute(\n            "UPDATE clients SET status = 'ARCHIVED', version = 2 WHERE tenant_id = ? AND client_id = ?",''',
              '''        expect_integrity_error(\n            lambda: connection.execute(\n                """\n                INSERT INTO profile_assignment_commands (\n                    tenant_id, command_id, command_actor_id, assignment_id,\n                    profile_id, client_id, expected_profile_version, reason, executed_at_ms\n                ) VALUES (?, 'cmd_assignment_cross_tenant', ?, 'assignment_cross_tenant',\n                          ?, ?, 1, 'invalid tenant link', 50)\n                """,\n                (TENANT_A, OWNER_A, PROFILE_A, CLIENT_B),\n            ),\n            "assignment_client_not_active",\n        )\n        connection.rollback()\n''',
          )

          replace_block(
              '''        expect_integrity_error(\n            lambda: connection.execute(\n                """\n                INSERT INTO profile_client_assignments (\n                    tenant_id, assignment_id, profile_id, client_id,\n                    assigned_by_actor_id, assigned_at_ms, reason\n                ) VALUES (?, 'assignment_archived', ?, ?, ?, 60, 'archived client')\n                """,\n                (TENANT_A, PROFILE_A, CLIENT_A, OWNER_A),\n            ),\n            "assignment_client_not_active",\n        )\n        connection.rollback()\n''',
              '''\n        connection.execute(\n            "UPDATE clients SET status = 'ACTIVE' WHERE tenant_id = ? AND client_id = ?",''',
              '''        expect_integrity_error(\n            lambda: connection.execute(\n                """\n                INSERT INTO profile_assignment_commands (\n                    tenant_id, command_id, command_actor_id, assignment_id,\n                    profile_id, client_id, expected_profile_version, reason, executed_at_ms\n                ) VALUES (?, 'cmd_assignment_archived', ?, 'assignment_archived',\n                          ?, ?, 1, 'archived client', 60)\n                """,\n                (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),\n            ),\n            "assignment_client_not_active",\n        )\n        connection.rollback()\n''',
          )

          start = text.index("        connection.execute(\n            \"\"\"\n            INSERT INTO profile_client_assignments (\n", text.index("assignment_primary_one")) if False else -1
          marker = "        connection.execute(\n            \"\"\"\n            INSERT INTO profile_client_assignments (\n"
          search_from = text.index("connection.commit()", text.index("UPDATE clients SET status = 'ACTIVE'"))
          start = text.index(marker, search_from)
          end = text.index("\n        assert (\n            connection.execute(\n                \"SELECT COUNT(*) FROM profile_grants", start)
          replacement = '''        connection.execute(\n            """\n            INSERT INTO profile_assignment_commands (\n                tenant_id, command_id, command_actor_id, assignment_id,\n                profile_id, client_id, expected_profile_version, reason, executed_at_ms\n            ) VALUES (?, 'cmd_assignment_primary_one', ?, 'assignment_primary_one',\n                      ?, ?, 1, 'primary assignment', 70)\n            """,\n            (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),\n        )\n        connection.commit()\n        expect_integrity_error(\n            lambda: connection.execute(\n                """\n                INSERT INTO profile_assignment_commands (\n                    tenant_id, command_id, command_actor_id, assignment_id,\n                    profile_id, client_id, expected_profile_version, reason, executed_at_ms\n                ) VALUES (?, 'cmd_assignment_primary_two', ?, 'assignment_primary_two',\n                          ?, ?, 2, 'duplicate active assignment', 71)\n                """,\n                (TENANT_A, OWNER_A, PROFILE_A, CLIENT_A),\n            ),\n            "profile_assignment_same_client",\n        )\n        connection.rollback()\n        active_assignments = connection.execute(\n            """\n            SELECT COUNT(*) AS value\n            FROM profile_client_assignments\n            WHERE tenant_id = ? AND profile_id = ? AND closed_at_ms IS NULL\n            """,\n            (TENANT_A, PROFILE_A),\n        ).fetchone()["value"]\n        assert active_assignments == 1\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
      - name: Run shared D1 invariant suite
        run: python scripts/test-d1-schema.py
      - name: Run Phase 2C D1 proof
        run: python scripts/test-phase2c-client-merge-assignment.py
      - name: Commit validated shared-test evolution
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/test-d1-schema.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2C: evolve shared assignment D1 fixtures to governed commands'
          git push origin HEAD:phase2c-client-merge-assignment-ui
