name: AR-4C Composition Helper

on:
  push:
    branches:
      - ar4c-outbound-mail-composition

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ar4c-outbound-mail-composition
      - name: Wire composition-owned outbound mail module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/control-plane-worker/src/composition.rs')
          text = path.read_text(encoding='utf-8')
          marker = '#[cfg(not(target_arch = "wasm32"))]\nuse application_ports::clients::{'
          insertion = 'mod outbound_mail;\n\npub use outbound_mail::{\n    ClientMailOutboundProvider, client_mail_outbound_provider, outbound_mail_intent_repository,\n};\n\n' + marker
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one composition insertion marker')
          path.write_text(text.replace(marker, insertion, 1), encoding='utf-8', newline='\n')
          PY
          rm apps/control-plane-worker/src/client_mail_send/provider.rs
      - name: Commit runtime composition extraction
        shell: bash
        run: |
          set -euo pipefail
          git add apps/control-plane-worker/src/composition.rs \
                  apps/control-plane-worker/src/client_mail_send/provider.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AR-4C route outbound mail wiring through composition root'
          git push origin HEAD:ar4c-outbound-mail-composition
