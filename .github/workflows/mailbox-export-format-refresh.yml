name: Mailbox Export Format Refresh

on:
  push:
    branches:
      - mailbox-adapter-export-repair

permissions:
  contents: write

jobs:
  format-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: mailbox-adapter-export-repair
          fetch-depth: 0

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Format workspace and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/mailbox-export-format-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format exposed mailbox adapters"
          git push origin HEAD:mailbox-adapter-export-repair
