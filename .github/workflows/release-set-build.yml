name: Release Set Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-set-build-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cloud-components:
    name: Build immutable cloud components once
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove accepted-main build authority and v2 contract
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node .github/scripts/release-architecture-ar11.mjs
          python scripts/release-set-ar11.py self-test

      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: |
          npm install --global npm@11.17.0
          test "$(npm --version)" = 11.17.0
          npm ci

      - name: Build immutable control-plane bits
        run: |
          set -euo pipefail
          cargo install worker-build --version 0.8.5 --locked
          (cd apps/control-plane-worker && worker-build --release)
          (cd frontend && npm run build)
          python scripts/cloudflare-release.py build \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref refs/heads/main \
            --source-event push \
            --authority accepted-main

      - name: Build immutable resolver bits
        run: |
          set -euo pipefail
          (cd apps/mailbox-secret-resolver-worker && worker-build --release)
          python scripts/mailbox-secret-resolver-release.py build \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY"

      - name: Stage exact component archives and manifests
        run: |
          set -euo pipefail
          mkdir -p artifacts/ar11-cloud-components
          mapfile -t control_archives < <(find artifacts/cloudflare-release -maxdepth 1 -type f -name '*.tar' -print)
          mapfile -t control_manifests < <(find artifacts/cloudflare-release -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print)
          mapfile -t resolver_archives < <(find artifacts/mailbox-secret-resolver-release -maxdepth 1 -type f -name '*.tar' -print)
          mapfile -t resolver_manifests < <(find artifacts/mailbox-secret-resolver-release -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print)
          test "${#control_archives[@]}" -eq 1
          test "${#control_manifests[@]}" -eq 1
          test "${#resolver_archives[@]}" -eq 1
          test "${#resolver_manifests[@]}" -eq 1
          cp "${control_archives[0]}" artifacts/ar11-cloud-components/control-plane.tar
          cp "${control_manifests[0]}" artifacts/ar11-cloud-components/control-plane-manifest.json
          cp "${resolver_archives[0]}" artifacts/ar11-cloud-components/secret-resolver.tar
          cp "${resolver_manifests[0]}" artifacts/ar11-cloud-components/secret-resolver-manifest.json
          python scripts/cloudflare-release.py verify-archive \
            --archive artifacts/ar11-cloud-components/control-plane.tar \
            --expected-source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY" --authority accepted-main
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive artifacts/ar11-cloud-components/secret-resolver.tar \
            --expected-source-sha "$SOURCE_SHA"

      - name: Upload CI transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-cloud-components-${{ github.sha }}
          path: artifacts/ar11-cloud-components
          if-no-files-found: error
          retention-days: 7

  profile-bridge:
    name: Build immutable Windows Profile Bridge component
    runs-on: windows-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove accepted-main source
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'push') { throw 'Release Set build requires main push' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release Set build requires main' }
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'source SHA mismatch' }

      - name: Build exact Profile Bridge executable
        run: cargo build --locked --release -p profile-bridge

      - name: Create deterministic self-describing Profile Bridge v2 package
        shell: pwsh
        run: |
          python scripts/release-set-ar11.py profile-bridge-package `
            --source-sha "$env:SOURCE_SHA" `
            --executable target/release/profile-bridge.exe `
            --archive artifacts/ar11-profile-bridge/profile-bridge.zip `
            --manifest artifacts/ar11-profile-bridge/profile-bridge-manifest.json

      - name: Upload CI transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-profile-bridge-${{ github.sha }}
          path: artifacts/ar11-profile-bridge
          if-no-files-found: error
          retention-days: 7

  historical-cloud-components:
    name: Build previous accepted-main cloud components for v2 rehearsal
    runs-on: ubuntu-latest
    env:
      CURRENT_SHA: ${{ github.sha }}
      HISTORICAL_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout exact current policy source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize untouched previous protected-main source
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"
          [[ "$HISTORICAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$HISTORICAL_SHA" != 0000000000000000000000000000000000000000
          historical_root="$RUNNER_TEMP/historical-source"
          git worktree add --detach "$historical_root" "$HISTORICAL_SHA"
          test "$(git -C "$historical_root" rev-parse HEAD)" = "$HISTORICAL_SHA"
          git -C "$historical_root" diff --exit-code
          echo "HISTORICAL_ROOT=$historical_root" >> "$GITHUB_ENV"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Build immutable historical control-plane and resolver bits
        run: |
          set -euo pipefail
          cargo install worker-build --version 0.8.5 --locked
          npm install --global npm@11.17.0
          (cd "$HISTORICAL_ROOT/frontend" && npm ci && npm run build)
          (cd "$HISTORICAL_ROOT/apps/control-plane-worker" && worker-build --release)
          (cd "$HISTORICAL_ROOT/apps/mailbox-secret-resolver-worker" && worker-build --release)
          (cd "$HISTORICAL_ROOT" && python scripts/cloudflare-release.py build \
            --source-sha "$HISTORICAL_SHA" --repository "$GITHUB_REPOSITORY" \
            --source-ref refs/heads/main --source-event push --authority accepted-main)
          (cd "$HISTORICAL_ROOT" && python scripts/mailbox-secret-resolver-release.py build \
            --source-sha "$HISTORICAL_SHA" --repository "$GITHUB_REPOSITORY")

      - name: Stage and verify historical component transport
        run: |
          set -euo pipefail
          output="artifacts/ar11-historical-cloud-components"
          mkdir -p "$output"
          mapfile -t control_archives < <(find "$HISTORICAL_ROOT/artifacts/cloudflare-release" -maxdepth 1 -type f -name '*.tar' -print)
          mapfile -t control_manifests < <(find "$HISTORICAL_ROOT/artifacts/cloudflare-release" -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print)
          mapfile -t resolver_archives < <(find "$HISTORICAL_ROOT/artifacts/mailbox-secret-resolver-release" -maxdepth 1 -type f -name '*.tar' -print)
          mapfile -t resolver_manifests < <(find "$HISTORICAL_ROOT/artifacts/mailbox-secret-resolver-release" -mindepth 2 -maxdepth 2 -type f -name 'release-manifest.json' -print)
          test "${#control_archives[@]}" -eq 1
          test "${#control_manifests[@]}" -eq 1
          test "${#resolver_archives[@]}" -eq 1
          test "${#resolver_manifests[@]}" -eq 1
          cp "${control_archives[0]}" "$output/control-plane.tar"
          cp "${control_manifests[0]}" "$output/control-plane-manifest.json"
          cp "${resolver_archives[0]}" "$output/secret-resolver.tar"
          cp "${resolver_manifests[0]}" "$output/secret-resolver-manifest.json"
          (cd "$HISTORICAL_ROOT" && python scripts/cloudflare-release.py verify-archive \
            --archive "$GITHUB_WORKSPACE/$output/control-plane.tar" \
            --expected-source-sha "$HISTORICAL_SHA" --repository "$GITHUB_REPOSITORY" --authority accepted-main)
          (cd "$HISTORICAL_ROOT" && python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "$GITHUB_WORKSPACE/$output/secret-resolver.tar" \
            --expected-source-sha "$HISTORICAL_SHA")
          git -C "$HISTORICAL_ROOT" diff --exit-code

      - name: Upload historical cloud CI transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-historical-cloud-components-${{ github.event.before }}
          path: artifacts/ar11-historical-cloud-components
          if-no-files-found: error
          retention-days: 7

  historical-profile-bridge:
    name: Build previous accepted-main Profile Bridge for v2 rehearsal
    runs-on: windows-latest
    env:
      CURRENT_SHA: ${{ github.sha }}
      HISTORICAL_SHA: ${{ github.event.before }}
    steps:
      - name: Checkout exact current policy source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize untouched previous protected-main source
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'push') { throw 'historical Release Set build requires main push' }
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'historical Release Set build requires main' }
          if ((git rev-parse HEAD).Trim() -ne $env:CURRENT_SHA) { throw 'current source SHA mismatch' }
          if ($env:HISTORICAL_SHA -notmatch '^[0-9a-f]{40}$' -or $env:HISTORICAL_SHA -eq ('0' * 40)) { throw 'invalid previous main SHA' }
          $historicalRoot = Join-Path $env:RUNNER_TEMP 'historical-source'
          git worktree add --detach $historicalRoot $env:HISTORICAL_SHA
          if ((git -C $historicalRoot rev-parse HEAD).Trim() -ne $env:HISTORICAL_SHA) { throw 'historical source SHA mismatch' }
          git -C $historicalRoot diff --exit-code
          "HISTORICAL_ROOT=$historicalRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build exact historical Profile Bridge executable
        shell: pwsh
        run: |
          Push-Location $env:HISTORICAL_ROOT
          try {
            cargo build --locked --release -p profile-bridge
          } finally {
            Pop-Location
          }
          git -C $env:HISTORICAL_ROOT diff --exit-code

      - name: Package historical executable with current deterministic v2 envelope
        shell: pwsh
        run: |
          python scripts/release-set-ar11.py profile-bridge-package `
            --source-sha "$env:HISTORICAL_SHA" `
            --executable "$env:HISTORICAL_ROOT/target/release/profile-bridge.exe" `
            --archive artifacts/ar11-historical-profile-bridge/profile-bridge.zip `
            --manifest artifacts/ar11-historical-profile-bridge/profile-bridge-manifest.json

      - name: Upload historical Profile Bridge CI transport only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-historical-profile-bridge-${{ github.event.before }}
          path: artifacts/ar11-historical-profile-bridge
          if-no-files-found: error
          retention-days: 7

  assemble-publish:
    name: Verify and publish durable immutable Release Set v2
    needs: [cloud-components, profile-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release-set.outputs.release_id }}
      source_sha: ${{ github.sha }}
    env:
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download exact component CI transport
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: ar11-*-${{ github.sha }}
          path: artifacts/ar11-inputs
          merge-multiple: true

      - name: Assemble and verify one content-addressed Release Set v2
        id: release-set
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/release-set-ar11.py build \
            --source-sha "$SOURCE_SHA" \
            --control-archive artifacts/ar11-inputs/control-plane.tar \
            --control-manifest artifacts/ar11-inputs/control-plane-manifest.json \
            --resolver-archive artifacts/ar11-inputs/secret-resolver.tar \
            --resolver-manifest artifacts/ar11-inputs/secret-resolver-manifest.json \
            --profile-bridge-archive artifacts/ar11-inputs/profile-bridge.zip \
            --profile-bridge-manifest artifacts/ar11-inputs/profile-bridge-manifest.json \
            --output-root artifacts/release-sets > "$RUNNER_TEMP/release-set-path"
          release_dir="$(tail -n 1 "$RUNNER_TEMP/release-set-path")"
          test -d "$release_dir"
          release_id="$(jq -r '.release_set_id' "$release_dir/release-set.json")"
          [[ "$release_id" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          test "$release_dir" = "artifacts/release-sets/$release_id"

          policy_dir="$RUNNER_TEMP/release-policy-input"
          mkdir -p "$policy_dir"
          cp "$release_dir/release-set.json" "$policy_dir/release-set.json"
          branch_json="$RUNNER_TEMP/protected-main.json"
          compare_json="$RUNNER_TEMP/accepted-source-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$branch_json"
          main_sha="$(jq -r '.commit.sha' "$branch_json")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$main_sha" > "$compare_json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-set-id "$release_id" \
            --source-sha "$SOURCE_SHA" \
            --branch-json "$branch_json" \
            --compare-json "$compare_json" \
            --output "$policy_dir/accepted-source-evidence.json"

          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root . --artifact-root "$release_dir" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 2 and .source_accepted == true and .mutation_executed == false' >/dev/null
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "accepted_source_evidence=$policy_dir/accepted-source-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Publish once or prove byte-identical replay
        env:
          RELEASE_DIR: ${{ steps.release-set.outputs.release_dir }}
          RELEASE_ID: ${{ steps.release-set.outputs.release_id }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$asset_dir"
          cp "$RELEASE_DIR/release-set.json" "$asset_dir/release-set.json"
          cp "$RELEASE_DIR/components/"* "$asset_dir/"
          test "$(find "$asset_dir" -maxdepth 1 -type f | wc -l)" -eq 5
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-release"
            mkdir -p "$existing"
            gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for file in "$asset_dir"/*; do
              name="$(basename "$file")"
              test -f "$existing/$name"
              cmp --silent "$file" "$existing/$name"
            done
            test "$(find "$existing" -maxdepth 1 -type f | wc -l)" -eq 5
          else
            gh release create "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "$RELEASE_ID" \
              --notes "Immutable AR-11 Release Set v2 built once from accepted main $SOURCE_SHA."
            gh release upload "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" "$asset_dir"/*
          fi

      - name: Upload metadata-only CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-set-evidence-${{ steps.release-set.outputs.release_id }}
          path: |
            ${{ steps.release-set.outputs.release_dir }}/release-set.json
            ${{ steps.release-set.outputs.accepted_source_evidence }}
          if-no-files-found: error
          retention-days: 30

  historical-assemble-publish:
    name: Verify and publish previous accepted-main as durable Release Set v2
    needs: [historical-cloud-components, historical-profile-bridge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release-set.outputs.release_id }}
      source_sha: ${{ github.event.before }}
    env:
      CURRENT_SHA: ${{ github.sha }}
      HISTORICAL_SHA: ${{ github.event.before }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact current policy source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize untouched historical source and prove protected-main ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CURRENT_SHA"
          [[ "$HISTORICAL_SHA" =~ ^[0-9a-f]{40}$ ]]
          historical_root="$RUNNER_TEMP/historical-source"
          git worktree add --detach "$historical_root" "$HISTORICAL_SHA"
          test "$(git -C "$historical_root" rev-parse HEAD)" = "$HISTORICAL_SHA"
          git -C "$historical_root" diff --exit-code
          compare_json="$RUNNER_TEMP/historical-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$HISTORICAL_SHA...$CURRENT_SHA" > "$compare_json"
          test "$(jq -r '.merge_base_commit.sha' "$compare_json")" = "$HISTORICAL_SHA"
          test "$(jq -r '.behind_by' "$compare_json")" = 0
          echo "HISTORICAL_ROOT=$historical_root" >> "$GITHUB_ENV"

      - name: Download exact historical component CI transport
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: ar11-historical-*-${{ github.event.before }}
          path: artifacts/ar11-historical-inputs
          merge-multiple: true

      - name: Assemble historical source with current v2 packaging policy only
        id: release-set
        run: |
          set -euo pipefail
          packaging_root="$RUNNER_TEMP/historical-packaging-root"
          cp -a "$HISTORICAL_ROOT/." "$packaging_root/"
          mkdir -p "$packaging_root/scripts" "$packaging_root/architecture"
          cp scripts/release-set-ar11.py "$packaging_root/scripts/release-set-ar11.py"
          cp architecture/release-set-v2.json "$packaging_root/architecture/release-set-v2.json"
          git -C "$HISTORICAL_ROOT" diff --exit-code

          python "$packaging_root/scripts/release-set-ar11.py" build \
            --source-sha "$HISTORICAL_SHA" \
            --control-archive "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/control-plane.tar" \
            --control-manifest "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/control-plane-manifest.json" \
            --resolver-archive "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/secret-resolver.tar" \
            --resolver-manifest "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/secret-resolver-manifest.json" \
            --profile-bridge-archive "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/profile-bridge.zip" \
            --profile-bridge-manifest "$GITHUB_WORKSPACE/artifacts/ar11-historical-inputs/profile-bridge-manifest.json" \
            --output-root "$RUNNER_TEMP/historical-release-sets" > "$RUNNER_TEMP/historical-release-set-path"
          release_dir="$(tail -n 1 "$RUNNER_TEMP/historical-release-set-path")"
          test -d "$release_dir"
          release_id="$(jq -r '.release_set_id' "$release_dir/release-set.json")"
          [[ "$release_id" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          test "$(jq -r '.source.commit_sha' "$release_dir/release-set.json")" = "$HISTORICAL_SHA"

          policy_dir="$RUNNER_TEMP/historical-policy-input"
          mkdir -p "$policy_dir"
          cp "$release_dir/release-set.json" "$policy_dir/release-set.json"
          branch_json="$RUNNER_TEMP/protected-main.json"
          compare_json="$RUNNER_TEMP/accepted-source-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$branch_json"
          main_sha="$(jq -r '.commit.sha' "$branch_json")"
          test "$main_sha" = "$CURRENT_SHA"
          gh api "repos/$GITHUB_REPOSITORY/compare/$HISTORICAL_SHA...$main_sha" > "$compare_json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" --release-set-id "$release_id" \
            --source-sha "$HISTORICAL_SHA" --branch-json "$branch_json" \
            --compare-json "$compare_json" --output "$policy_dir/accepted-source-evidence.json"

          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root "$HISTORICAL_ROOT" --artifact-root "$release_dir" \
            | tee "$RUNNER_TEMP/historical-release-verify.json" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 2 and .source_accepted == true and .mutation_executed == false' >/dev/null
          git -C "$HISTORICAL_ROOT" diff --exit-code
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "accepted_source_evidence=$policy_dir/accepted-source-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Publish historical v2 once or prove byte-identical replay
        env:
          RELEASE_DIR: ${{ steps.release-set.outputs.release_dir }}
          RELEASE_ID: ${{ steps.release-set.outputs.release_id }}
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/historical-release-assets"
          mkdir -p "$asset_dir"
          cp "$RELEASE_DIR/release-set.json" "$asset_dir/release-set.json"
          cp "$RELEASE_DIR/components/"* "$asset_dir/"
          test "$(find "$asset_dir" -maxdepth 1 -type f | wc -l)" -eq 5
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$RUNNER_TEMP/existing-historical-release"
            mkdir -p "$existing"
            gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --dir "$existing"
            for file in "$asset_dir"/*; do
              name="$(basename "$file")"
              test -f "$existing/$name"
              cmp --silent "$file" "$existing/$name"
            done
            test "$(find "$existing" -maxdepth 1 -type f | wc -l)" -eq 5
          else
            gh release create "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" --target "$HISTORICAL_SHA" \
              --title "$RELEASE_ID" \
              --notes "Immutable AR-11 Release Set v2 backfill from exact previously accepted main $HISTORICAL_SHA for FC-6 rollback rehearsal."
            gh release upload "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" "$asset_dir"/*
          fi

      - name: Upload historical metadata-only CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-set-evidence-${{ steps.release-set.outputs.release_id }}
          path: |
            ${{ steps.release-set.outputs.release_dir }}/release-set.json
            ${{ steps.release-set.outputs.accepted_source_evidence }}
            ${{ runner.temp }}/historical-release-verify.json
          if-no-files-found: error
          retention-days: 30

  release-pair-evidence:
    name: Bind durable older/newer v2 rehearsal pair
    needs: [assemble-publish, historical-assemble-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Prove pair identity and emit metadata-only evidence
        env:
          OLDER_RELEASE_SET_ID: ${{ needs.historical-assemble-publish.outputs.release_id }}
          OLDER_SOURCE_SHA: ${{ needs.historical-assemble-publish.outputs.source_sha }}
          NEWER_RELEASE_SET_ID: ${{ needs.assemble-publish.outputs.release_id }}
          NEWER_SOURCE_SHA: ${{ needs.assemble-publish.outputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$OLDER_RELEASE_SET_ID" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          [[ "$NEWER_RELEASE_SET_ID" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          [[ "$OLDER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$NEWER_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$OLDER_RELEASE_SET_ID" != "$NEWER_RELEASE_SET_ID"
          test "$OLDER_SOURCE_SHA" != "$NEWER_SOURCE_SHA"
          jq -n \
            --arg older_release_set_id "$OLDER_RELEASE_SET_ID" \
            --arg older_source_sha "$OLDER_SOURCE_SHA" \
            --arg newer_release_set_id "$NEWER_RELEASE_SET_ID" \
            --arg newer_source_sha "$NEWER_SOURCE_SHA" \
            '{schema_version:1,kind:"AR11_RELEASE_SET_V2_REHEARSAL_PAIR",older_release_set_id:$older_release_set_id,older_source_sha:$older_source_sha,newer_release_set_id:$newer_release_set_id,newer_source_sha:$newer_source_sha,production_mutation:false}' \
            > "$RUNNER_TEMP/release-pair.json"

      - name: Upload bounded pair transport for staging rehearsal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-release-set-pair-${{ github.sha }}
          path: ${{ runner.temp }}/release-pair.json
          if-no-files-found: error
          retention-days: 30
