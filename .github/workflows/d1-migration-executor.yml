name: Protected D1 Migration Executor

run-name: D1 authorization=${{ inputs.authorization_digest || inputs.expected_release_set_id || inputs.restore_authorization_comment_id || 'none' }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment; production is intentionally unavailable in AR-11
        required: true
        type: choice
        options:
          - staging
      source_sha:
        description: Exact accepted-main source SHA
        required: true
        type: string
      operation_mode:
        description: Protected D1 effect mode
        required: false
        default: migration
        type: choice
        options:
          - migration
          - time_travel_restore
      restore_authorization_comment_id:
        description: Exact OWNER authorization comment for one-shot Time Travel restore
        required: false
        default: ''
        type: string
      component:
        description: D1 component
        required: true
        type: choice
        options:
          - catalog
          - resolver
      account_id:
        description: Exact Cloudflare account ID for staging
        required: true
        type: string
      database_name:
        description: Exact existing D1 database name
        required: true
        type: string
      database_id:
        description: Exact existing D1 database UUID
        required: true
        type: string
      target_release_manifest_json:
        description: Exact target component release manifest JSON
        required: true
        type: string
      current_release_manifest_json:
        description: Exact current component release manifest JSON
        required: true
        type: string
      known_good_release_manifest_json:
        description: Exact last-known-good component release manifest JSON
        required: true
        type: string
      preconditions_json:
        description: Ordinary D1 preconditions or exact Phase-C contract-transition evidence
        required: false
        default: '{}'
        type: string
      transition_mode:
        description: D1 transition mode
        required: false
        default: ordinary
        type: choice
        options:
          - ordinary
          - contract
      expected_release_set_id:
        description: Exact deployed Release Set identity; required for contract mode
        required: false
        default: ''
        type: string
      prepared_transaction_run_id:
        description: Exact successful D1 Migration Prepare run carrying the immutable ordinary transaction
        required: false
        default: ''
        type: string
      prepared_transaction_run_attempt:
        description: Exact prepare run attempt that published the immutable ordinary transaction artifact
        required: false
        default: ''
        type: string
      transaction_id:
        description: Exact immutable ordinary TRANSACTION_ID
        required: false
        default: ''
        type: string
      authorization_digest:
        description: SHA-256 of the exact canonical ordinary transaction authorization JSON
        required: false
        default: ''
        type: string
      transaction_authorization_json:
        description: Strict secret-free transaction-scoped authorization JSON for the ordinary transaction
        required: false
        default: ''
        type: string
      mutation_authorized:
        description: Explicitly authorize this staging migration mutation
        required: true
        default: false
        type: boolean
      confirmation:
        description: Exact mutation confirmation string
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: read

concurrency:
  group: release-set-promotion-staging
  cancel-in-progress: false

jobs:
  authorize:
    if: inputs.operation_mode == 'migration'
    name: Validate D1 mutation inputs before protected Environment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMPONENT: ${{ inputs.component }}
      DATABASE_ID: ${{ inputs.database_id }}
      TRANSITION_MODE: ${{ inputs.transition_mode }}
      EXPECTED_RELEASE_SET_ID: ${{ inputs.expected_release_set_id }}
      PREPARED_TRANSACTION_RUN_ID: ${{ inputs.prepared_transaction_run_id }}
      PREPARED_TRANSACTION_RUN_ATTEMPT: ${{ inputs.prepared_transaction_run_attempt }}
      TRANSACTION_ID: ${{ inputs.transaction_id }}
      AUTHORIZATION_DIGEST: ${{ inputs.authorization_digest }}
      TRANSACTION_AUTHORIZATION_JSON: ${{ inputs.transaction_authorization_json }}
      MUTATION_AUTHORIZED: ${{ inputs.mutation_authorized }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Fail closed before any Environment binding
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$TARGET_ENVIRONMENT" = "staging"
          test "$COMPONENT" = "catalog" || test "$COMPONENT" = "resolver"
          test "$TRANSITION_MODE" = "ordinary" || test "$TRANSITION_MODE" = "contract"
          test "$MUTATION_AUTHORIZED" = "true"
          test -n "$SOURCE_SHA"
          test -n "$DATABASE_ID"
          if [ "$TRANSITION_MODE" = ordinary ]; then
            test "$GITHUB_RUN_ATTEMPT" = "1"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID"
            [[ "$PREPARED_TRANSACTION_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$PREPARED_TRANSACTION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$TRANSACTION_ID" =~ ^[0-9a-f]{64}$ ]]
            [[ "$AUTHORIZATION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            test -n "$TRANSACTION_AUTHORIZATION_JSON"
          else
            test "$COMPONENT" = "catalog"
            test -n "$EXPECTED_RELEASE_SET_ID"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID:contract:$EXPECTED_RELEASE_SET_ID"
          fi

      - name: Bind ordinary authorization to immutable GitHub provenance
        if: inputs.transition_mode == 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_meta="$RUNNER_TEMP/d1-authorization-meta.json"
          auth_comment="$RUNNER_TEMP/d1-authorization-comment.json"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ['TRANSACTION_AUTHORIZATION_JSON']

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          try:
              value = json.loads(raw, object_pairs_hook=strict_object)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit(f'authorization payload is not strict JSON: {exc}')
          if not isinstance(value, dict):
              raise SystemExit('authorization payload must be one JSON object')
          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          if raw != canonical:
              raise SystemExit('authorization payload must be exact canonical compact sorted JSON')
          actual_digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          if actual_digest != os.environ['AUTHORIZATION_DIGEST']:
              raise SystemExit('authorization_digest does not equal SHA-256 of exact canonical authorization JSON')
          expected_keys = {
              'schema_version',
              'transaction_id',
              'target',
              'phase',
              'authorized_provider_effects',
              'issued_at_unix_seconds',
              'expires_at_unix_seconds',
              'observation_fresh_until_unix_seconds',
              'authorization_reference',
          }
          if set(value) != expected_keys:
              raise SystemExit('authorization payload fields do not match the exact v1 typed contract')
          reference = value.get('authorization_reference')
          if not isinstance(reference, str):
              raise SystemExit('authorization_reference must be a GitHub issue comment URL')
          repository = re.escape(os.environ['GITHUB_REPOSITORY'])
          match = re.fullmatch(
              rf'https://github\.com/{repository}/issues/([1-9][0-9]*)#issuecomment-([1-9][0-9]*)',
              reference,
          )
          if match is None:
              raise SystemExit('authorization_reference must identify an issue comment in this repository')
          meta = {
              'authorization_digest': actual_digest,
              'authorization_reference': reference,
              'issue_number': int(match.group(1)),
              'comment_id': int(match.group(2)),
              'issued_at_unix_seconds': value.get('issued_at_unix_seconds'),
              'expires_at_unix_seconds': value.get('expires_at_unix_seconds'),
          }
          Path(os.environ['RUNNER_TEMP'], 'd1-authorization-meta.json').write_text(
              json.dumps(meta, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
          comment_id="$(jq -r '.comment_id' "$auth_meta")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" > "$auth_comment"
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP'])
          meta = json.loads((root / 'd1-authorization-meta.json').read_text(encoding='utf-8'))
          comment = json.loads((root / 'd1-authorization-comment.json').read_text(encoding='utf-8'))
          raw = os.environ['TRANSACTION_AUTHORIZATION_JSON']
          value = json.loads(raw)
          intent = {
              'schema_version': value['schema_version'],
              'transaction_id': value['transaction_id'],
              'target': value['target'],
              'phase': value['phase'],
              'authorized_provider_effects': value['authorized_provider_effects'],
              'issued_at_unix_seconds': value['issued_at_unix_seconds'],
              'expires_at_unix_seconds': value['expires_at_unix_seconds'],
              'observation_fresh_until_unix_seconds': value['observation_fresh_until_unix_seconds'],
          }
          intent_canonical = json.dumps(intent, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          expected_body = f'D1_TRANSACTION_AUTHORIZATION_V1\n{intent_canonical}'
          if not isinstance(comment.get('body'), str) or comment['body'].strip() != expected_body:
              raise SystemExit('authorization reference comment body does not contain the exact constructible transaction intent')
          if comment.get('html_url') != meta['authorization_reference']:
              raise SystemExit('authorization reference URL does not equal fetched comment html_url')
          expected_issue_url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{meta['issue_number']}"
          if comment.get('issue_url') != expected_issue_url:
              raise SystemExit('authorization comment issue provenance drifted')
          if comment.get('author_association') != 'OWNER':
              raise SystemExit('transaction authorization must be recorded by repository OWNER')
          created_at = comment.get('created_at')
          updated_at = comment.get('updated_at')
          if not isinstance(created_at, str) or updated_at != created_at:
              raise SystemExit('transaction authorization comment must be immutable after creation')
          created_epoch = int(datetime.fromisoformat(created_at.replace('Z', '+00:00')).timestamp())
          issued_at = meta.get('issued_at_unix_seconds')
          expires_at = meta.get('expires_at_unix_seconds')
          if not isinstance(issued_at, int) or not isinstance(expires_at, int):
              raise SystemExit('authorization timestamps must be integers')
          if created_epoch < issued_at or created_epoch > expires_at:
              raise SystemExit('authorization comment must be durably recorded inside its declared validity window')
          PY

          expected_title="D1 authorization=$AUTHORIZATION_DIGEST"
          current_run="$RUNNER_TEMP/current-d1-executor-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$current_run"
          jq -e \
            --arg title "$expected_title" \
            --arg source "$SOURCE_SHA" \
            --argjson number "$GITHUB_RUN_NUMBER" \
            '.path == ".github/workflows/d1-migration-executor.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $source and .display_title == $title and .run_number == $number and .run_attempt == 1' \
            "$current_run" >/dev/null

  migrate:
    if: inputs.operation_mode == 'migration'
    needs: authorize
    name: staging / ${{ inputs.component }} / exact D1 migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMPONENT: ${{ inputs.component }}
      DATABASE_NAME: ${{ inputs.database_name }}
      DATABASE_ID: ${{ inputs.database_id }}
      TARGET_RELEASE_MANIFEST_JSON: ${{ inputs.target_release_manifest_json }}
      CURRENT_RELEASE_MANIFEST_JSON: ${{ inputs.current_release_manifest_json }}
      KNOWN_GOOD_RELEASE_MANIFEST_JSON: ${{ inputs.known_good_release_manifest_json }}
      PRECONDITIONS_JSON: ${{ inputs.preconditions_json }}
      TRANSITION_MODE: ${{ inputs.transition_mode }}
      EXPECTED_RELEASE_SET_ID: ${{ inputs.expected_release_set_id }}
      PREPARED_TRANSACTION_RUN_ID: ${{ inputs.prepared_transaction_run_id }}
      PREPARED_TRANSACTION_RUN_ATTEMPT: ${{ inputs.prepared_transaction_run_attempt }}
      TRANSACTION_ID: ${{ inputs.transaction_id }}
      AUTHORIZATION_DIGEST: ${{ inputs.authorization_digest }}
      TRANSACTION_AUTHORIZATION_JSON: ${{ inputs.transaction_authorization_json }}
      MUTATION_AUTHORIZED: ${{ inputs.mutation_authorized }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Reject non-main, non-exact, production, or disabled mutation authority
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$TARGET_ENVIRONMENT" = "staging"
          test "$COMPONENT" = "catalog" || test "$COMPONENT" = "resolver"
          test "$TRANSITION_MODE" = "ordinary" || test "$TRANSITION_MODE" = "contract"
          test "$MUTATION_AUTHORIZED" = "true"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_ACCOUNT_ID" = "${{ inputs.account_id }}"
          if [ "$TRANSITION_MODE" = ordinary ]; then
            test "$GITHUB_RUN_ATTEMPT" = "1"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID"
            [[ "$PREPARED_TRANSACTION_RUN_ID" =~ ^[0-9]+$ ]]
            [[ "$PREPARED_TRANSACTION_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$TRANSACTION_ID" =~ ^[0-9a-f]{64}$ ]]
            [[ "$AUTHORIZATION_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            test -n "$TRANSACTION_AUTHORIZATION_JSON"
          else
            test "$COMPONENT" = catalog
            test -n "$EXPECTED_RELEASE_SET_ID"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID:contract:$EXPECTED_RELEASE_SET_ID"
          fi

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checked-out source and staging-only authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TARGET_ENVIRONMENT" = staging

      - name: Set up pinned Node and npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce exact provider executor and native policy engine
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"
          test "$(npx --yes wrangler@4.94.0 --version)" = "4.94.0"
          python scripts/d1-executor-plan.py self-test
          python scripts/d1-gate-diagnostics.py self-test
          python scripts/d1-prepare.py self-test
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID python scripts/check-opsctl-readonly.py
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-executor-admission
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-execution-control

      - name: Load immutable prepared transaction and verify typed executor admission
        if: inputs.transition_mode == 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/d1-migration/prepared-transaction
          run_json="$RUNNER_TEMP/d1-prepared-transaction-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_TRANSACTION_RUN_ID" > "$run_json"
          jq -e \
            --arg source "$SOURCE_SHA" \
            --argjson attempt "$PREPARED_TRANSACTION_RUN_ATTEMPT" \
            '.path == ".github/workflows/d1-migration-prepare.yml" and .event == "workflow_dispatch" and .head_sha == $source and .status == "completed" and .conclusion == "success" and .run_attempt == $attempt' \
            "$run_json" >/dev/null
          artifact_name="d1-transaction-$COMPONENT-$PREPARED_TRANSACTION_RUN_ID-$PREPARED_TRANSACTION_RUN_ATTEMPT"
          gh run download "$PREPARED_TRANSACTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir artifacts/d1-migration/prepared-transaction
          test -f artifacts/d1-migration/prepared-transaction/transaction.json
          test "$(find artifacts/d1-migration/prepared-transaction -type f | wc -l)" -eq 1
          cp artifacts/d1-migration/prepared-transaction/transaction.json artifacts/d1-migration/transaction.json
          printf '%s\n' "$TRANSACTION_AUTHORIZATION_JSON" > artifacts/d1-migration/transaction-authorization.json
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          evaluated_at="$(date -u +%s)"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-executor-admission \
              --transaction-json artifacts/d1-migration/transaction.json \
              --authorization-json artifacts/d1-migration/transaction-authorization.json \
              --evaluated-at-unix-seconds "$evaluated_at" \
              --expected-transaction-id "$TRANSACTION_ID" \
              --expected-source-sha "$SOURCE_SHA" \
              --expected-tree-sha "$tree_sha" \
              --expected-environment "$TARGET_ENVIRONMENT" \
              --expected-account-id "$CLOUDFLARE_ACCOUNT_ID" \
              --expected-database-name "$DATABASE_NAME" \
              --expected-database-id "$DATABASE_ID" \
              --expected-phase ORDINARY \
              > artifacts/d1-migration/executor-admission.json
          jq -e \
            --arg transaction_id "$TRANSACTION_ID" \
            --arg authorization_digest "$AUTHORIZATION_DIGEST" \
            --arg source "$SOURCE_SHA" \
            --arg tree "$tree_sha" \
            --arg component "$COMPONENT" \
            '.schema_version == 1 and .status == "EXECUTOR_ADMISSION_VERIFIED" and .mode == "read-only" and .authorization_consumed == false and .mutation_executed == false and .provider_mutation_executed == false and .transaction_id == $transaction_id and .authorization_digest == $authorization_digest and .source_sha == $source and .tree_sha == $tree and .phase == "ORDINARY" and (.execution_plan | .schema_version == 1 and .command == "d1 plan" and .mode == "read-only" and .mutation_executed == false and .component == $component and .allowed == true and (.apply_required == ((.planned_migrations | length) > 0)) and (.planned_migrations | type == "array") and (.planned_migration_digests | type == "array") and ((.planned_migration_digests | length) == (.planned_migrations | length)))' \
            artifacts/d1-migration/executor-admission.json >/dev/null

      - name: Persist typed executor admission evidence
        if: always() && inputs.transition_mode == 'ordinary' && hashFiles('artifacts/d1-migration/executor-admission.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-executor-admission-${{ inputs.authorization_digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/executor-admission.json
          if-no-files-found: error
          retention-days: 30

      - name: Prove ordinary transaction authorization has not been consumed
        if: inputs.transition_mode == 'ordinary'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="D1 authorization=$AUTHORIZATION_DIGEST"
          consumption_step="Consume ordinary transaction authorization"
          prior_runs="$RUNNER_TEMP/prior-d1-authorization-runs.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -s --arg title "$expected_title" --argjson current_number "$GITHUB_RUN_NUMBER" \
              '[.[].workflow_runs[] | select(.display_title == $title and .run_number < $current_number) | .id] | unique' \
              > "$prior_runs"
          consumed=0
          while IFS= read -r run_id; do
            jobs_json="$RUNNER_TEMP/prior-d1-authorization-jobs-$run_id.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$jobs_json"
            hits="$(
              jq -s --arg step "$consumption_step" \
                '[.[].jobs[]? | .steps[]? | select(.name == $step and .conclusion == "success")] | length' \
                "$jobs_json"
            )"
            if [ "$hits" -gt 0 ]; then
              consumed=1
              break
            fi
          done < <(jq -r '.[]' "$prior_runs")
          test "$consumed" -eq 0
          mkdir -p artifacts/d1-migration
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              'schema_version': 1,
              'status': 'AUTHORIZATION_CONSUMPTION_READY',
              'transaction_id': os.environ['TRANSACTION_ID'],
              'authorization_digest': os.environ['AUTHORIZATION_DIGEST'],
              'source_sha': os.environ['SOURCE_SHA'],
              'executor_run_id': os.environ['GITHUB_RUN_ID'],
              'executor_run_number': os.environ['GITHUB_RUN_NUMBER'],
              'executor_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'provider_mutation_executed': False,
          }
          Path('artifacts/d1-migration/authorization-consumption.json').write_text(
              json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Consume ordinary transaction authorization
        if: inputs.transition_mode == 'ordinary'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-authorization-consumption-${{ inputs.authorization_digest }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/authorization-consumption.json
          if-no-files-found: error
          retention-days: 30

      - name: Create typed target fence lease
        run: |
          set -euo pipefail
          mkdir -p artifacts/d1-migration
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          ordinary = os.environ['TRANSITION_MODE'] == 'ordinary'
          value = {
              'schema_version': 1,
              'target': {
                  'environment': os.environ['TARGET_ENVIRONMENT'],
                  'account_id': os.environ['CLOUDFLARE_ACCOUNT_ID'],
                  'database_name': os.environ['DATABASE_NAME'],
                  'database_id': os.environ['DATABASE_ID'],
              },
              'phase': 'ORDINARY' if ordinary else 'CONTRACT',
              'operation_identity': os.environ['TRANSACTION_ID'] if ordinary else os.environ['EXPECTED_RELEASE_SET_ID'],
              'transaction_id': os.environ['TRANSACTION_ID'] if ordinary else None,
              'authorization_digest': os.environ['AUTHORIZATION_DIGEST'] if ordinary else None,
              'source_sha': os.environ['SOURCE_SHA'],
              'executor_run_id': int(os.environ['GITHUB_RUN_ID']),
              'fence_epoch': int(os.environ['GITHUB_RUN_NUMBER']),
              'run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'acquired_at_unix_seconds': int(time.time()),
          }
          Path('artifacts/d1-migration/target-fence-input.json').write_text(
              json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control acquire-fence \
              --input artifacts/d1-migration/target-fence-input.json \
              > artifacts/d1-migration/target-fence-lease.json
          operation_identity="$TRANSACTION_ID"
          expected_phase=ORDINARY
          if [ "$TRANSITION_MODE" = contract ]; then
            operation_identity="$EXPECTED_RELEASE_SET_ID"
            expected_phase=CONTRACT
          fi
          jq -e \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg database_name "$DATABASE_NAME" \
            --arg database_id "$DATABASE_ID" \
            --arg phase "$expected_phase" \
            --arg operation_identity "$operation_identity" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson executor_run_id "$GITHUB_RUN_ID" \
            --argjson fence_epoch "$GITHUB_RUN_NUMBER" \
            '.schema_version == 1 and .status == "TARGET_FENCE_ACQUIRED" and .target.environment == $environment and .target.account_id == $account_id and .target.database_name == $database_name and .target.database_id == $database_id and .phase == $phase and .operation_identity == $operation_identity and .source_sha == $source_sha and .executor_run_id == $executor_run_id and .fence_epoch == $fence_epoch and .run_attempt == 1 and (.fence_id | test("^[0-9a-f]{64}$"))' \
            artifacts/d1-migration/target-fence-lease.json >/dev/null
          if [ "$TRANSITION_MODE" = ordinary ]; then
            jq -e \
              --arg transaction_id "$TRANSACTION_ID" \
              --arg authorization_digest "$AUTHORIZATION_DIGEST" \
              '.transaction_id == $transaction_id and .authorization_digest == $authorization_digest' \
              artifacts/d1-migration/target-fence-lease.json >/dev/null
          else
            jq -e '.transaction_id == null and .authorization_digest == null' artifacts/d1-migration/target-fence-lease.json >/dev/null
          fi

      - name: Acquire durable target fence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-target-fence-${{ github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/target-fence-lease.json
          if-no-files-found: error
          retention-days: 30

      - name: Initialize execution receipt after durable target fence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/d1-migration')
          lease = json.loads((root / 'target-fence-lease.json').read_text(encoding='utf-8'))
          if os.environ['TRANSITION_MODE'] == 'ordinary':
              transaction = json.loads((root / 'transaction.json').read_text(encoding='utf-8'))
              recovery = transaction.get('transaction_plan', {}).get('recovery_strategy')
              if not isinstance(recovery, str) or not recovery:
                  raise SystemExit('ordinary transaction must project transaction_plan.recovery_strategy')
          else:
              recovery = 'FAIL_FORWARD_ONLY'
          seed = {
              'schema_version': 1,
              'target': lease['target'],
              'phase': lease['phase'],
              'operation_identity': lease['operation_identity'],
              'transaction_id': lease['transaction_id'],
              'authorization_digest': lease['authorization_digest'],
              'source_sha': lease['source_sha'],
              'recovery_strategy': recovery,
              'fence': lease,
          }
          (root / 'execution-receipt-seed.json').write_text(
              json.dumps(seed, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY
          receipt_time="$(date -u +%s)"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control initialize-receipt \
              --seed artifacts/d1-migration/execution-receipt-seed.json \
              --prepared-at-unix-seconds "$receipt_time" \
              --authorized-at-unix-seconds "$receipt_time" \
              > artifacts/d1-migration/execution-receipt.json
          jq -e \
            --arg source "$SOURCE_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson fence_epoch "$GITHUB_RUN_NUMBER" \
            '.schema_version == 1 and .source_sha == $source and .executor_run_id == $run_id and .fence_epoch == $fence_epoch and (.receipt_id | test("^[0-9a-f]{64}$")) and (.events | length) == 2 and .events[0].kind == "PREPARED" and .events[1].kind == "AUTHORIZED"' \
            artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Persist initial execution receipt snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-execution-receipt-${{ github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}-initial
          path: artifacts/d1-migration/execution-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Materialize exact metadata inputs and bounded provider config
        run: |
          set -euo pipefail
          mkdir -p artifacts/d1-migration
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('artifacts/d1-migration')
          documents = {
              'target-release.json': os.environ['TARGET_RELEASE_MANIFEST_JSON'],
              'current-release.json': os.environ['CURRENT_RELEASE_MANIFEST_JSON'],
              'known-good-release.json': os.environ['KNOWN_GOOD_RELEASE_MANIFEST_JSON'],
              'preconditions.json': os.environ['PRECONDITIONS_JSON'],
          }
          for name, raw in documents.items():
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit(f'{name} must contain exactly one JSON object')
              (out / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          binding = {'catalog': 'CATALOG_DB', 'resolver': 'RESOLVER_DB'}[os.environ['COMPONENT']
          ]
          config = {
              'name': 'd1-migration-executor',
              'main': '../../tests/d1-runtime/worker.mjs',
              'compatibility_date': '2026-08-05',
              'account_id': os.environ['CLOUDFLARE_ACCOUNT_ID'],
              'd1_databases': [{
                  'binding': binding,
                  'database_name': os.environ['DATABASE_NAME'],
                  'database_id': os.environ['DATABASE_ID'],
                  'migrations_dir': 'migrations-bounded',
              }],
          }
          (out / 'wrangler.json').write_text(json.dumps(config, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          (out / 'context.json').write_text(json.dumps({
              'schema_version': 2,
              'source_sha': os.environ['SOURCE_SHA'],
              'environment': os.environ['TARGET_ENVIRONMENT'],
              'component': os.environ['COMPONENT'],
              'database_name': os.environ['DATABASE_NAME'],
              'database_id': os.environ['DATABASE_ID'],
              'transition_mode': os.environ['TRANSITION_MODE'],
              'expected_release_set_id': os.environ['EXPECTED_RELEASE_SET_ID'] or None,
              'transaction_id': os.environ['TRANSACTION_ID'] or None,
              'authorization_digest': os.environ['AUTHORIZATION_DIGEST'] or None,
              'prepared_transaction_run_id': os.environ['PREPARED_TRANSACTION_RUN_ID'] or None,
              'prepared_transaction_run_attempt': os.environ['PREPARED_TRANSACTION_RUN_ATTEMPT'] or None,
              'executor_run_id': os.environ['GITHUB_RUN_ID'],
              'executor_run_number': os.environ['GITHUB_RUN_NUMBER'],
              'executor_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'mutation_authorized': True,
              'automatic_restore_allowed': False,
              'resource_auto_provisioning_allowed': False,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            > artifacts/d1-migration/repository.json

      - name: Verify exact remote database identity with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/provider-identity.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('artifacts/d1-migration/provider-identity.json').read_text())
          expected = {os.environ['DATABASE_NAME'], os.environ['DATABASE_ID']}
          def paired(item):
              if isinstance(item, dict):
                  values = {value for value in item.values() if isinstance(value, str)}
                  return expected.issubset(values) or any(paired(value) for value in item.values())
              if isinstance(item, list):
                  return any(paired(value) for value in item)
              return False
          assert paired(value), 'provider identity does not contain exact database name and UUID in one object'
          PY

      - name: Read remote migration ledger with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-before.json

      - name: Normalize and classify remote ledger with credential-free opsctl
        run: |
          set -euo pipefail
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status \
            --component "$COMPONENT" --ledger-json artifacts/d1-migration/ledger-before.json \
            > artifacts/d1-migration/status-before.json

      - name: Consume sealed ordinary plan and run fresh compatibility or contract gates
        id: policy
        run: |
          set -euo pipefail
          diagnostics="artifacts/d1-migration/d1-gate-diagnostics.jsonl"
          : > "$diagnostics"

          if [ "$TRANSITION_MODE" = ordinary ]; then
            jq -e \
              --arg component "$COMPONENT" \
              '.status == "EXECUTOR_ADMISSION_VERIFIED" and (.execution_plan | .schema_version == 1 and .command == "d1 plan" and .mode == "read-only" and .mutation_executed == false and .component == $component and .allowed == true and (.apply_required == ((.planned_migrations | length) > 0)) and (.planned_migrations | type == "array") and (.planned_migration_digests | type == "array") and ((.planned_migration_digests | length) == (.planned_migrations | length)))' \
              artifacts/d1-migration/executor-admission.json >/dev/null
            jq '.execution_plan' artifacts/d1-migration/executor-admission.json > artifacts/d1-migration/plan.json
          else
            set +e
            evaluated_at="$(date -u +%s)"
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet \
              --manifest-path tools/opsctl/Cargo.toml --example d1-contract-transition -- \
              --root . \
              --ledger-json artifacts/d1-migration/ledger-before.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              --evidence-json artifacts/d1-migration/preconditions.json \
              --evaluated-at-unix-seconds "$evaluated_at" \
              --expected-source-sha "$SOURCE_SHA" \
              --expected-release-set-id "$EXPECTED_RELEASE_SET_ID" \
              > artifacts/d1-migration/plan.json
            plan_rc=$?
            set -e
            if [ "$plan_rc" -ne 0 ]; then
              python scripts/d1-gate-diagnostics.py record \
                --diagnostics "$diagnostics" \
                --gate contract-transition-plan-command \
                --reason-code D1_CONTRACT_TRANSITION_PLAN_COMMAND_FAILED \
                --exit-code "$plan_rc" \
                --detail 'credential-free contract-transition plan command returned non-zero'
              exit "$plan_rc"
            fi
          fi

          set +e
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 compatibility \
            --component "$COMPONENT" \
            --ledger-json artifacts/d1-migration/ledger-before.json \
            --release-manifest artifacts/d1-migration/target-release.json \
            > artifacts/d1-migration/compatibility.json
          compatibility_rc=$?
          set -e
          if [ "$compatibility_rc" -ne 0 ]; then
            python scripts/d1-gate-diagnostics.py record \
              --diagnostics "$diagnostics" \
              --gate compatibility-command \
              --reason-code D1_COMPATIBILITY_COMMAND_FAILED \
              --exit-code "$compatibility_rc" \
              --detail 'credential-free compatibility command returned non-zero'
            exit "$compatibility_rc"
          fi

          python scripts/d1-gate-diagnostics.py evaluate \
            --plan artifacts/d1-migration/plan.json \
            --compatibility artifacts/d1-migration/compatibility.json \
            --diagnostics "$diagnostics" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload metadata-only D1 gate diagnostics on policy failure
        if: failure() && steps.policy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-gate-diagnostics-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/d1-gate-diagnostics.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Materialize exactly authorized planned_migrations from typed successor projection
        run: |
          set -euo pipefail
          digest_args=()
          if [ "$TRANSITION_MODE" = ordinary ]; then
            digest_args+=(--require-plan-digests)
          fi
          python scripts/d1-executor-plan.py materialize \
            --repo-root . \
            --repository artifacts/d1-migration/repository.json \
            --plan artifacts/d1-migration/plan.json \
            --ledger artifacts/d1-migration/ledger-before.json \
            --component "$COMPONENT" \
            --mode "$TRANSITION_MODE" \
            --output-dir artifacts/d1-migration/migrations-bounded \
            --expected-pending artifacts/d1-migration/expected-pending.json \
            --normalized-ledger artifacts/d1-migration/ledger-before-names.json \
            "${digest_args[@]}"
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('artifacts/d1-migration/ledger-before-names.json').read_text())
          planned = json.loads(Path('artifacts/d1-migration/expected-pending.json').read_text())
          Path('artifacts/d1-migration/expected-after.json').write_text(
              json.dumps(before + planned, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Compare Wrangler pending list to exact authorized plan with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 migrations list "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/wrangler-pending-before.txt
          python scripts/d1-executor-plan.py verify-pending \
            --expected artifacts/d1-migration/expected-pending.json \
            --wrangler-output artifacts/d1-migration/wrangler-pending-before.txt

      - name: Capture metadata-only pre-migration Time Travel bookmark with observe credential
        if: steps.policy.outputs.apply_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/pre-migration-bookmark.json

      - name: Verify typed target fence immediately before provider mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          newer_runs="$RUNNER_TEMP/d1-target-fence-newer-runs.json"
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -s --argjson current_number "$GITHUB_RUN_NUMBER" \
              '[.[].workflow_runs[] | select(.run_number > $current_number) | {id, run_number}] | unique_by(.id)' \
              > "$newer_runs"
          leases_jsonl="$RUNNER_TEMP/d1-target-fence-observed-leases.jsonl"
          : > "$leases_jsonl"
          while IFS=$'\t' read -r run_id run_number; do
            jobs_json="$RUNNER_TEMP/d1-target-fence-jobs-$run_id.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" |
              jq -s '[.[].jobs[]?]' > "$jobs_json"
            hits="$(jq --arg step 'Acquire durable target fence' '[.[] | .steps[]? | select(.name == $step and .conclusion == "success")] | length' "$jobs_json")"
            if [ "$hits" -eq 0 ]; then
              continue
            fi
            test "$hits" -eq 1
            artifact_name="d1-target-fence-$run_number-$run_id-1"
            artifacts_json="$RUNNER_TEMP/d1-target-fence-artifacts-$run_id.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" |
              jq -s '[.[].artifacts[]?]' > "$artifacts_json"
            jq -e --arg name "$artifact_name" '[.[] | select(.name == $name and .expired == false)] | length == 1' "$artifacts_json" >/dev/null
            lease_dir="$RUNNER_TEMP/d1-target-fence-lease-$run_id"
            rm -rf "$lease_dir"
            mkdir -p "$lease_dir"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$lease_dir"
            test -f "$lease_dir/target-fence-lease.json"
            test "$(find "$lease_dir" -type f | wc -l)" -eq 1
            jq -c '.' "$lease_dir/target-fence-lease.json" >> "$leases_jsonl"
          done < <(jq -r '.[] | [.id, .run_number] | @tsv' "$newer_runs")
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          leases_path = Path(os.environ['RUNNER_TEMP'], 'd1-target-fence-observed-leases.jsonl')
          leases = []
          for line in leases_path.read_text(encoding='utf-8').splitlines():
              value = json.loads(line)
              if not isinstance(value, dict):
                  raise SystemExit('observed target fence lease must be one JSON object')
              leases.append(value)
          observation = {
              'schema_version': 1,
              'observed_at_unix_seconds': int(time.time()),
              'history_complete': True,
              'current_marker_succeeded': True,
              'current_executor_run_id': int(os.environ['GITHUB_RUN_ID']),
              'current_fence_epoch': int(os.environ['GITHUB_RUN_NUMBER']),
              'observed_acquired_leases': leases,
          }
          Path('artifacts/d1-migration/target-fence-observation.json').write_text(
              json.dumps(observation, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8'
          )
          PY
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control verify-fence \
              --lease artifacts/d1-migration/target-fence-lease.json \
              --observation artifacts/d1-migration/target-fence-observation.json \
              > artifacts/d1-migration/target-fence-verification.json
          fence_id="$(jq -r '.fence_id' artifacts/d1-migration/target-fence-lease.json)"
          operation_identity="$TRANSACTION_ID"
          if [ "$TRANSITION_MODE" = contract ]; then
            operation_identity="$EXPECTED_RELEASE_SET_ID"
          fi
          jq -e \
            --arg fence_id "$fence_id" \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg database_name "$DATABASE_NAME" \
            --arg database_id "$DATABASE_ID" \
            --arg operation_identity "$operation_identity" \
            --argjson executor_run_id "$GITHUB_RUN_ID" \
            --argjson fence_epoch "$GITHUB_RUN_NUMBER" \
            '.schema_version == 1 and .status == "TARGET_FENCE_VERIFIED" and .fence_id == $fence_id and .target.environment == $environment and .target.account_id == $account_id and .target.database_name == $database_name and .target.database_id == $database_id and .operation_identity == $operation_identity and .executor_run_id == $executor_run_id and .fence_epoch == $fence_epoch' \
            artifacts/d1-migration/target-fence-verification.json >/dev/null

      - name: Append PREWRITE_FENCE_PASS to execution receipt
        run: |
          set -euo pipefail
          event_time="$(date -u +%s)"
          jq -n --argjson occurred "$event_time" \
            '{kind:"PREWRITE_FENCE_PASS",occurred_at_unix_seconds:$occurred,migration_id:null}' \
            > artifacts/d1-migration/execution-receipt-event.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
              --receipt artifacts/d1-migration/execution-receipt.json \
              --event artifacts/d1-migration/execution-receipt-event.json \
              > artifacts/d1-migration/execution-receipt.next.json
          mv artifacts/d1-migration/execution-receipt.next.json artifacts/d1-migration/execution-receipt.json
          jq -e '.events[-1].kind == "PREWRITE_FENCE_PASS"' artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Revalidate exact ledger fence with observe credential
        if: steps.policy.outputs.apply_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/provider-identity-fence.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('artifacts/d1-migration/provider-identity-fence.json').read_text())
          expected = {os.environ['DATABASE_NAME'], os.environ['DATABASE_ID']}
          def paired(item):
              if isinstance(item, dict):
                  values = {value for value in item.values() if isinstance(value, str)}
                  return expected.issubset(values) or any(paired(value) for value in item.values())
              if isinstance(item, list):
                  return any(paired(value) for value in item)
              return False
          assert paired(value), 'provider identity drifted before mutation'
          PY
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-fence.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status \
            --component "$COMPONENT" --ledger-json artifacts/d1-migration/ledger-fence.json \
            > artifacts/d1-migration/status-fence.json
          cmp --silent artifacts/d1-migration/status-before.json artifacts/d1-migration/status-fence.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-migration/ledger-fence.json \
            --output artifacts/d1-migration/ledger-fence-names.json
          cmp --silent artifacts/d1-migration/ledger-before-names.json artifacts/d1-migration/ledger-fence-names.json
          npx --yes wrangler@4.94.0 d1 migrations list "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/wrangler-pending-fence.txt
          python scripts/d1-executor-plan.py verify-pending \
            --expected artifacts/d1-migration/expected-pending.json \
            --wrangler-output artifacts/d1-migration/wrangler-pending-fence.txt

      - name: Append MUTATION_STARTED to execution receipt
        if: steps.policy.outputs.apply_required == 'true'
        run: |
          set -euo pipefail
          event_time="$(date -u +%s)"
          jq -n --argjson occurred "$event_time" \
            '{kind:"MUTATION_STARTED",occurred_at_unix_seconds:$occurred,migration_id:null}' \
            > artifacts/d1-migration/execution-receipt-event.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
              --receipt artifacts/d1-migration/execution-receipt.json \
              --event artifacts/d1-migration/execution-receipt-event.json \
              > artifacts/d1-migration/execution-receipt.next.json
          mv artifacts/d1-migration/execution-receipt.next.json artifacts/d1-migration/execution-receipt.json
          jq -e '.events[-1].kind == "MUTATION_STARTED"' artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Persist MUTATION_STARTED execution receipt snapshot
        if: steps.policy.outputs.apply_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-execution-receipt-${{ github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}-mutation-started
          path: artifacts/d1-migration/execution-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Apply planned migrations with deploy credential
        if: steps.policy.outputs.apply_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.94.0 d1 migrations apply "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false

      - name: Append mechanically known MIGRATION_APPLIED events
        if: steps.policy.outputs.apply_required == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r migration_id; do
            test -n "$migration_id"
            event_time="$(date -u +%s)"
            jq -n --argjson occurred "$event_time" --arg migration_id "$migration_id" \
              '{kind:"MIGRATION_APPLIED",occurred_at_unix_seconds:$occurred,migration_id:$migration_id}' \
              > artifacts/d1-migration/execution-receipt-event.json
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
                --receipt artifacts/d1-migration/execution-receipt.json \
                --event artifacts/d1-migration/execution-receipt-event.json \
                > artifacts/d1-migration/execution-receipt.next.json
            mv artifacts/d1-migration/execution-receipt.next.json artifacts/d1-migration/execution-receipt.json
          done < <(jq -r '.[]' artifacts/d1-migration/expected-pending.json)
          jq -e \
            --slurpfile expected artifacts/d1-migration/expected-pending.json \
            '[.events[] | select(.kind == "MIGRATION_APPLIED") | .migration_id] == $expected[0]' \
            artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Persist applied migration execution receipt snapshot
        if: steps.policy.outputs.apply_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-execution-receipt-${{ github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}-applied
          path: artifacts/d1-migration/execution-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Reread remote ledger with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-after.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-migration/ledger-after.json \
            --output artifacts/d1-migration/ledger-after-names.json
          cmp --silent artifacts/d1-migration/expected-after.json artifacts/d1-migration/ledger-after-names.json

      - name: Append POST_OBSERVED to execution receipt
        run: |
          set -euo pipefail
          event_time="$(date -u +%s)"
          jq -n --argjson occurred "$event_time" \
            '{kind:"POST_OBSERVED",occurred_at_unix_seconds:$occurred,migration_id:null}' \
            > artifacts/d1-migration/execution-receipt-event.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
              --receipt artifacts/d1-migration/execution-receipt.json \
              --event artifacts/d1-migration/execution-receipt-event.json \
              > artifacts/d1-migration/execution-receipt.next.json
          mv artifacts/d1-migration/execution-receipt.next.json artifacts/d1-migration/execution-receipt.json
          jq -e '.events[-1].kind == "POST_OBSERVED"' artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Require exact target through credential-free opsctl verify
        run: |
          set -euo pipefail
          if [ "$TRANSITION_MODE" = ordinary ]; then
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 verify \
              --component "$COMPONENT" \
              --ledger-json artifacts/d1-migration/ledger-after.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              > artifacts/d1-migration/verify.json
            jq -e '.ledger_state == "EXACT" and .decision == "SAFE" and .allowed == true and .mutation_executed == false' \
              artifacts/d1-migration/verify.json >/dev/null
          else
            evaluated_at="$(date -u +%s)"
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet \
              --manifest-path tools/opsctl/Cargo.toml --example d1-contract-transition -- \
              --root . \
              --ledger-json artifacts/d1-migration/ledger-before.json \
              --post-ledger-json artifacts/d1-migration/ledger-after.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              --evidence-json artifacts/d1-migration/preconditions.json \
              --evaluated-at-unix-seconds "$evaluated_at" \
              --expected-source-sha "$SOURCE_SHA" \
              --expected-release-set-id "$EXPECTED_RELEASE_SET_ID" \
              > artifacts/d1-migration/verify.json
            jq -e '.command == "d1 contract-transition verify" and .predecessor_ledger_state == "EXACT" and .ledger_state == "EXACT" and .decision == "SAFE" and .predecessor_revision == "0031_device_binding_governance.sql" and .remote_revision == "0032_pas2_payload_fingerprint_contract.sql" and .runtime_target_revision == "0031_device_binding_governance.sql" and .supported_schema_min == "0031_device_binding_governance.sql" and .supported_schema_max == "0032_pas2_payload_fingerprint_contract.sql" and .transition_migrations == ["0032_pas2_payload_fingerprint_contract.sql"] and .planned_migrations == [] and .recovery_strategy == "FAIL_FORWARD_ONLY" and .allowed == true and .mutation_executed == false' \
              artifacts/d1-migration/verify.json >/dev/null
          fi

      - name: Verify post-apply database invariants with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json --command "PRAGMA foreign_key_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/foreign-key-check.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json --command "PRAGMA quick_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/quick-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          fk = json.loads(Path('artifacts/d1-migration/foreign-key-check.json').read_text())
          quick = json.loads(Path('artifacts/d1-migration/quick-check.json').read_text())
          assert len(fk) == 1 and fk[0]['success'] is True and fk[0]['results'] == [], fk
          assert len(quick) == 1 and quick[0]['success'] is True, quick
          rows = quick[0]['results']
          assert len(rows) == 1 and list(rows[0].values()) == ['ok'], quick
          PY

      - name: Complete execution receipt after verified post-state
        run: |
          set -euo pipefail
          for event_kind in VERIFIED COMPLETED; do
            event_time="$(date -u +%s)"
            jq -n --arg kind "$event_kind" --argjson occurred "$event_time" \
              '{kind:$kind,occurred_at_unix_seconds:$occurred,migration_id:null}' \
              > artifacts/d1-migration/execution-receipt-event.json
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
                --receipt artifacts/d1-migration/execution-receipt.json \
                --event artifacts/d1-migration/execution-receipt-event.json \
                > artifacts/d1-migration/execution-receipt.next.json
            mv artifacts/d1-migration/execution-receipt.next.json artifacts/d1-migration/execution-receipt.json
          done
          jq -e '.events[-2].kind == "VERIFIED" and .events[-1].kind == "COMPLETED"' artifacts/d1-migration/execution-receipt.json >/dev/null

      - name: Terminalize execution receipt fail closed
        if: always()
        run: |
          set -euo pipefail
          receipt=artifacts/d1-migration/execution-receipt.json
          if [ ! -f "$receipt" ]; then
            exit 0
          fi
          append_event() {
            kind="$1"
            event_time="$(date -u +%s)"
            jq -n --arg kind "$kind" --argjson occurred "$event_time" \
              '{kind:$kind,occurred_at_unix_seconds:$occurred,migration_id:null}' \
              > artifacts/d1-migration/execution-receipt-event.json
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              tools/opsctl/target/debug/examples/d1-execution-control append-receipt \
                --receipt "$receipt" \
                --event artifacts/d1-migration/execution-receipt-event.json \
                > artifacts/d1-migration/execution-receipt.next.json
            mv artifacts/d1-migration/execution-receipt.next.json "$receipt"
          }
          last_kind="$(jq -r '.events[-1].kind' "$receipt")"
          case "$last_kind" in
            AUTHORIZED)
              append_event PREWRITE_ABORTED
              append_event FAILED_NO_EFFECT
              ;;
            PREWRITE_FENCE_PASS)
              append_event FAILED_NO_EFFECT
              ;;
            MUTATION_STARTED|MIGRATION_APPLIED|POST_OBSERVED)
              append_event RECOVERY_REQUIRED
              ;;
            VERIFIED)
              append_event COMPLETED
              ;;
            COMPLETED|RECOVERY_REQUIRED|FAILED_NO_EFFECT)
              ;;
            *)
              echo "unclassified execution receipt terminalization state: $last_kind" >&2
              exit 1
              ;;
          esac
          jq -e '.events[-1].kind == "COMPLETED" or .events[-1].kind == "RECOVERY_REQUIRED" or .events[-1].kind == "FAILED_NO_EFFECT"' "$receipt" >/dev/null

      - name: Persist terminal execution receipt snapshot
        if: always() && hashFiles('artifacts/d1-migration/execution-receipt.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-execution-receipt-${{ github.run_number }}-${{ github.run_id }}-${{ github.run_attempt }}-terminal
          path: artifacts/d1-migration/execution-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Build metadata-only migration evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('artifacts/d1-migration')
          def load(name, optional=False):
              path = root / name
              if optional and not path.exists():
                  return None
              return json.loads(path.read_text(encoding='utf-8'))
          def digest(name, optional=False):
              path = root / name
              if optional and not path.exists():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()
          plan = load('plan.json')
          receipt = load('execution-receipt.json')
          if receipt['events'][-1]['kind'] != 'COMPLETED':
              raise SystemExit('successful migration evidence requires terminal COMPLETED execution receipt')
          evidence = {
              'schema_version': 3,
              'evidence_kind': 'protected-d1-migration-execution',
              'context': load('context.json'),
              'executor_admission': load('executor-admission.json', optional=True),
              'target_fence': load('target-fence-lease.json'),
              'target_fence_verification': load('target-fence-verification.json'),
              'execution_receipt': receipt,
              'execution_receipt_id': receipt['receipt_id'],
              'provider_identity': load('provider-identity.json'),
              'status_before': load('status-before.json'),
              'status_fence': load('status-fence.json', optional=True),
              'plan': plan,
              'compatibility': load('compatibility.json'),
              'expected_pending_migrations': load('expected-pending.json'),
              'wrangler_pending_before_sha256': digest('wrangler-pending-before.txt'),
              'wrangler_pending_fence_sha256': digest('wrangler-pending-fence.txt', optional=True),
              'pre_migration_bookmark': load('pre-migration-bookmark.json', optional=True),
              'ledger_before': load('ledger-before.json'),
              'ledger_after': load('ledger-after.json'),
              'verify': load('verify.json'),
              'foreign_key_check': load('foreign-key-check.json'),
              'quick_check': load('quick-check.json'),
              'provider_mutation_executed': bool(plan.get('planned_migrations')),
              'automatic_restore_executed': False,
              'secret_material_recorded': False,
          }
          (root / 'evidence.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          for sensitive in (
              'wrangler.json', 'target-release.json', 'current-release.json', 'known-good-release.json',
              'preconditions.json', 'ledger-fence.json', 'provider-identity-fence.json',
              'transaction-authorization.json', 'target-fence-input.json', 'target-fence-observation.json',
              'execution-receipt-seed.json', 'execution-receipt-event.json', 'execution-receipt.next.json',
          ):
              (root / sensitive).unlink(missing_ok=True)
          PY

      - name: Upload metadata-only D1 migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-migration-evidence-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/evidence.json
          if-no-files-found: error
          retention-days: 30

  authorize_restore:
    if: inputs.operation_mode == 'time_travel_restore'
    name: Validate one-shot D1 Time Travel restore authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      AUTHORIZATION_COMMENT_ID: ${{ inputs.restore_authorization_comment_id }}
      MUTATION_AUTHORIZED: ${{ inputs.mutation_authorized }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Fail closed before any restore Environment binding
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$TARGET_ENVIRONMENT" = staging
          test "$MUTATION_AUTHORIZED" = true
          test "$GITHUB_RUN_ATTEMPT" = 1
          [[ "$AUTHORIZATION_COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
          test "$CONFIRMATION" = "$SOURCE_SHA:staging:time_travel_restore:$AUTHORIZATION_COMMENT_ID"

      - name: Bind restore authorization to immutable OWNER comment and exact accepted source
        id: restore_auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/d1-time-travel-restore-auth"
          rm -rf "$root"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTHORIZATION_COMMENT_ID" > "$root/comment.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/266" > "$root/tracker.json"
          gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" > "$root/commit.json"
          python - "$root" "$GITHUB_OUTPUT" <<'PY_AUTH'
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          comment = json.loads((root / 'comment.json').read_text(encoding='utf-8'))
          tracker = json.loads((root / 'tracker.json').read_text(encoding='utf-8'))
          commit = json.loads((root / 'commit.json').read_text(encoding='utf-8'))
          owner = os.environ['GITHUB_REPOSITORY_OWNER']
          repository = os.environ['GITHUB_REPOSITORY']
          source = os.environ['SOURCE_SHA']

          tracker_body = tracker.get('body')
          if not isinstance(tracker_body, str):
              raise SystemExit('live stage pointer body missing')
          current = re.findall(r'^CURRENT_STAGE_ISSUE = #([1-9][0-9]*)$', tracker_body, flags=re.MULTILINE)
          if len(current) != 1:
              raise SystemExit('CURRENT_STAGE_ISSUE missing or ambiguous')
          expected_issue_url = f'https://api.github.com/repos/{repository}/issues/{current[0]}'
          if comment.get('issue_url') != expected_issue_url:
              raise SystemExit('restore authorization is not on CURRENT stage issue')
          if (comment.get('user') or {}).get('login') != owner or comment.get('author_association') != 'OWNER':
              raise SystemExit('restore authorization must be recorded by repository OWNER')
          created_at = comment.get('created_at')
          if not isinstance(created_at, str) or comment.get('updated_at') != created_at:
              raise SystemExit('restore authorization comment must be immutable')
          body = comment.get('body')
          if not isinstance(body, str):
              raise SystemExit('restore authorization comment body missing')
          lines = body.strip().splitlines()
          if len(lines) != 2 or lines[0] != 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_V1':
              raise SystemExit('restore authorization must use exact two-line V1 envelope')
          raw = lines[1]

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          try:
              value = json.loads(raw, object_pairs_hook=strict_object)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit(f'invalid strict restore authorization JSON: {exc}')
          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          if raw != canonical:
              raise SystemExit('restore authorization JSON must be exact canonical compact sorted JSON')
          expected_keys = {
              'schema_version', 'source_sha', 'source_tree_sha', 'target',
              'restore_timestamp_unix_seconds', 'restore_bookmark',
              'expected_pre_restore_ledger', 'expected_post_restore_ledger',
              'authorized_provider_effects', 'forbidden_provider_effects', 'observation',
          }
          if set(value) != expected_keys or value.get('schema_version') != 1:
              raise SystemExit('restore authorization fields/schema mismatch')
          if value.get('source_sha') != source:
              raise SystemExit('restore authorization source_sha mismatch')
          tree_sha = (commit.get('tree') or {}).get('sha')
          if value.get('source_tree_sha') != tree_sha:
              raise SystemExit('restore authorization source_tree_sha mismatch')
          target = value.get('target')
          if not isinstance(target, dict) or set(target) != {'environment','component','account_id','database_name','database_id'}:
              raise SystemExit('restore target contract mismatch')
          if target.get('environment') != 'staging' or target.get('component') != 'catalog':
              raise SystemExit('restore target must be staging catalog')
          for key in ('account_id', 'database_name', 'database_id'):
              if not isinstance(target.get(key), str) or not target[key]:
                  raise SystemExit(f'restore target {key} missing')
          timestamp = value.get('restore_timestamp_unix_seconds')
          bookmark = value.get('restore_bookmark')
          if not isinstance(timestamp, int) or timestamp <= 0:
              raise SystemExit('restore timestamp invalid')
          if not isinstance(bookmark, str) or re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}', bookmark) is None:
              raise SystemExit('restore bookmark format invalid')
          pre = value.get('expected_pre_restore_ledger')
          post = value.get('expected_post_restore_ledger')
          for label, ledger in (('pre', pre), ('post', post)):
              if not isinstance(ledger, list) or not ledger or len(ledger) != len(set(ledger)):
                  raise SystemExit(f'{label} restore ledger invalid')
              if not all(isinstance(item, str) and re.fullmatch(r'[0-9]{4}_[a-z0-9_]+\.sql', item) for item in ledger):
                  raise SystemExit(f'{label} restore ledger item invalid')
          if len(post) >= len(pre) or pre[:len(post)] != post:
              raise SystemExit('post-restore ledger must be strict prefix of pre-restore ledger')
          if value.get('authorized_provider_effects') != ['D1_TIME_TRAVEL_RESTORE_ONLY']:
              raise SystemExit('restore effect scope mismatch')
          if value.get('forbidden_provider_effects') != ['D1_CREATE','D1_DELETE','D1_MIGRATION_APPLY','D1_TIME_TRAVEL_SECOND_RESTORE','PRODUCTION_MUTATION']:
              raise SystemExit('restore forbidden-effect contract mismatch')
          observation = value.get('observation')
          if not isinstance(observation, dict) or set(observation) != {'run_id','artifact_id','artifact_digest','lookup_json_sha256'}:
              raise SystemExit('restore observation contract mismatch')
          if not isinstance(observation.get('run_id'), int) or not isinstance(observation.get('artifact_id'), int):
              raise SystemExit('restore observation ids invalid')
          if not isinstance(observation.get('artifact_digest'), str) or re.fullmatch(r'sha256:[0-9a-f]{64}', observation['artifact_digest']) is None:
              raise SystemExit('restore observation artifact digest invalid')
          if not isinstance(observation.get('lookup_json_sha256'), str) or re.fullmatch(r'[0-9a-f]{64}', observation['lookup_json_sha256']) is None:
              raise SystemExit('restore observation JSON digest invalid')

          digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          validated = {
              'schema_version': 1,
              'kind': 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_VALIDATED',
              'authorization_comment_id': int(os.environ['AUTHORIZATION_COMMENT_ID']),
              'authorization_digest': digest,
              'authorization_comment_url': comment.get('html_url'),
              'intent': value,
              'provider_mutation_executed': False,
          }
          (root / 'validated-authorization.json').write_text(
              json.dumps(validated, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f'authorization_digest={digest}\n')
          PY_AUTH

      - name: Prove restore authorization has not been consumed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_title="D1 authorization=$AUTHORIZATION_COMMENT_ID"
          prior="$RUNNER_TEMP/prior-restore-runs.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/runs?event=workflow_dispatch&per_page=100" |
            jq -s --arg title "$expected_title" --argjson current "$GITHUB_RUN_NUMBER" \
              '[.[].workflow_runs[] | select(.display_title == $title and .run_number < $current) | .id] | unique' > "$prior"
          while IFS= read -r run_id; do
            jobs="$RUNNER_TEMP/prior-restore-jobs-$run_id.json"
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" |
              jq -s '[.[].jobs[]?]' > "$jobs"
            hits="$(jq '[.[] | .steps[]? | select(.name == "Consume Time Travel restore authorization" and .conclusion == "success")] | length' "$jobs")"
            if [ "$hits" -ne 0 ]; then
              echo 'restore authorization already consumed' >&2
              exit 1
            fi
          done < <(jq -r '.[]' "$prior")

      - name: Persist validated restore authorization evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-time-travel-restore-authorization-${{ inputs.restore_authorization_comment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d1-time-travel-restore-auth/validated-authorization.json
          if-no-files-found: error
          retention-days: 30

  restore:
    if: inputs.operation_mode == 'time_travel_restore'
    needs: authorize_restore
    name: staging / exact D1 Time Travel restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      AUTHORIZATION_COMMENT_ID: ${{ inputs.restore_authorization_comment_id }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download validated restore authorization
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: d1-time-travel-restore-authorization-${{ inputs.restore_authorization_comment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-time-travel-restore

      - name: Load exact restore envelope and verify accepted source
        run: |
          set -euo pipefail
          auth=artifacts/d1-time-travel-restore/validated-authorization.json
          test -f "$auth"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          test "$(jq -r '.intent.source_tree_sha' "$auth")" = "$tree_sha"
          jq '.intent.expected_pre_restore_ledger' "$auth" > artifacts/d1-time-travel-restore/expected-pre-ledger.json
          jq '.intent.expected_post_restore_ledger' "$auth" > artifacts/d1-time-travel-restore/expected-post-ledger.json
          {
            echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r '.intent.target.account_id' "$auth")"
            echo "DATABASE_NAME=$(jq -r '.intent.target.database_name' "$auth")"
            echo "DATABASE_ID=$(jq -r '.intent.target.database_id' "$auth")"
            echo "RESTORE_TIMESTAMP=$(jq -r '.intent.restore_timestamp_unix_seconds' "$auth")"
            echo "RESTORE_BOOKMARK=$(jq -r '.intent.restore_bookmark' "$auth")"
            echo "AUTHORIZATION_DIGEST=$(jq -r '.authorization_digest' "$auth")"
          } >> "$GITHUB_ENV"

      - name: Set up pinned Node for exact provider tooling
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Materialize exact isolated target provider config
        run: |
          set -euo pipefail
          npm install --global npm@11.17.0
          test "$(node --version)" = v24.19.0
          test "$(npm --version)" = 11.17.0
          test "$(npx --yes wrangler@4.94.0 --version)" = 4.94.0
          jq -n --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" --arg id "$DATABASE_ID" \
            '{name:"d1-time-travel-restore",compatibility_date:"2026-08-15",account_id:$account,d1_databases:[{binding:"D1_REHEARSAL_DB",database_name:$name,database_id:$id}]}' \
            > artifacts/d1-time-travel-restore/wrangler.json

      - name: Fresh pre-write provider identity, ledger, diagnostics and bookmark proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          cfg=artifacts/d1-time-travel-restore/wrangler.json
          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" --config "$cfg" --json \
            --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/provider-identity.json
          python - <<'PY_ID'
          import json, os
          from pathlib import Path
          value = json.loads(Path('artifacts/d1-time-travel-restore/provider-identity.json').read_text())
          expected = {os.environ['DATABASE_NAME'], os.environ['DATABASE_ID']}
          def paired(item):
              if isinstance(item, dict):
                  values = {v for v in item.values() if isinstance(v, str)}
                  return expected.issubset(values) or any(paired(v) for v in item.values())
              if isinstance(item, list):
                  return any(paired(v) for v in item)
              return False
          if not paired(value):
              raise SystemExit('fresh provider identity mismatch')
          PY_ID
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/ledger-before.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-time-travel-restore/ledger-before.json \
            --output artifacts/d1-time-travel-restore/ledger-before-names.json
          cmp --silent artifacts/d1-time-travel-restore/expected-pre-ledger.json artifacts/d1-time-travel-restore/ledger-before-names.json
          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" --config "$cfg" --json \
            --timestamp "$RESTORE_TIMESTAMP" --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-time-travel-restore/bookmark-proof.json
          jq -e --arg bookmark "$RESTORE_BOOKMARK" '.bookmark == $bookmark' artifacts/d1-time-travel-restore/bookmark-proof.json >/dev/null
          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" --config "$cfg" --json \
            --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/pre-restore-current-bookmark.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "PRAGMA foreign_key_check" --json --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-time-travel-restore/foreign-key-before.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "PRAGMA quick_check" --json --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-time-travel-restore/quick-before.json
          jq -e 'length == 1 and .[0].success == true and .[0].results == []' artifacts/d1-time-travel-restore/foreign-key-before.json >/dev/null
          jq -e 'length == 1 and .[0].success == true and (.[0].results | length) == 1 and (.[0].results[0] | to_entries | map(.value)) == ["ok"]' artifacts/d1-time-travel-restore/quick-before.json >/dev/null

      - name: Consume Time Travel restore authorization
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          jq -n --arg kind D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_CONSUMPTION --arg source "$SOURCE_SHA" \
            --arg comment "$AUTHORIZATION_COMMENT_ID" --arg digest "$AUTHORIZATION_DIGEST" \
            --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" --arg id "$DATABASE_ID" \
            --arg bookmark "$RESTORE_BOOKMARK" --argjson timestamp "$RESTORE_TIMESTAMP" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson consumed "$now" \
            '{schema_version:1,kind:$kind,source_sha:$source,authorization_comment_id:($comment|tonumber),authorization_digest:$digest,target:{environment:"staging",account_id:$account,database_name:$name,database_id:$id},restore_timestamp_unix_seconds:$timestamp,restore_bookmark:$bookmark,executor_run_id:$run_id,run_attempt:$run_attempt,consumed_at_unix_seconds:$consumed,provider_mutation_executed:false}' \
            > artifacts/d1-time-travel-restore/authorization-consumption.json

      - name: Persist one-shot restore authorization consumption
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-time-travel-restore-authorization-consumption-${{ inputs.restore_authorization_comment_id }}
          path: artifacts/d1-time-travel-restore/authorization-consumption.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist restore MUTATION_STARTED receipt
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          jq -n --arg status MUTATION_STARTED --arg source "$SOURCE_SHA" --arg comment "$AUTHORIZATION_COMMENT_ID" \
            --arg digest "$AUTHORIZATION_DIGEST" --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" \
            --arg id "$DATABASE_ID" --arg bookmark "$RESTORE_BOOKMARK" --argjson timestamp "$RESTORE_TIMESTAMP" \
            --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson started "$now" \
            '{schema_version:1,kind:"D1_TIME_TRAVEL_RESTORE_RECEIPT_V1",status:$status,source_sha:$source,authorization_comment_id:($comment|tonumber),authorization_digest:$digest,target:{environment:"staging",account_id:$account,database_name:$name,database_id:$id},restore_timestamp_unix_seconds:$timestamp,restore_bookmark:$bookmark,executor_run_id:$run_id,run_attempt:$run_attempt,mutation_started_at_unix_seconds:$started,provider_mutation_executed:false,migration_apply_executed:false,production_mutation:false,second_restore_executed:false}' \
            > artifacts/d1-time-travel-restore/receipt.json

      - name: Restore exact D1 bookmark with deploy credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/time_travel/restore?bookmark=$RESTORE_BOOKMARK"
          code="$(curl --silent --show-error --request POST \
            --output artifacts/d1-time-travel-restore/restore-result.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")"
          test "$code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result.bookmark | type == "string") and (.result.bookmark | length > 0) and (.result.previous_bookmark | type == "string") and (.result.previous_bookmark | length > 0)' \
            artifacts/d1-time-travel-restore/restore-result.json >/dev/null
          jq '.provider_mutation_executed=true' artifacts/d1-time-travel-restore/receipt.json \
            > artifacts/d1-time-travel-restore/receipt.next.json
          mv artifacts/d1-time-travel-restore/receipt.next.json artifacts/d1-time-travel-restore/receipt.json

      - name: Fresh post-restore ledger and diagnostics proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          cfg=artifacts/d1-time-travel-restore/wrangler.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/ledger-after.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-time-travel-restore/ledger-after.json \
            --output artifacts/d1-time-travel-restore/ledger-after-names.json
          cmp --silent artifacts/d1-time-travel-restore/expected-post-ledger.json artifacts/d1-time-travel-restore/ledger-after-names.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "PRAGMA foreign_key_check" --json --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-time-travel-restore/foreign-key-after.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" \
            --command "PRAGMA quick_check" --json --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-time-travel-restore/quick-after.json
          jq -e 'length == 1 and .[0].success == true and .[0].results == []' artifacts/d1-time-travel-restore/foreign-key-after.json >/dev/null
          jq -e 'length == 1 and .[0].success == true and (.[0].results | length) == 1 and (.[0].results[0] | to_entries | map(.value)) == ["ok"]' artifacts/d1-time-travel-restore/quick-after.json >/dev/null
          now="$(date -u +%s)"
          previous="$(jq -r '.result.previous_bookmark' artifacts/d1-time-travel-restore/restore-result.json)"
          jq --arg status COMPLETED --arg previous "$previous" --argjson completed "$now" \
            '.status=$status | .previous_bookmark=$previous | .completed_at_unix_seconds=$completed | .provider_mutation_executed=true' \
            artifacts/d1-time-travel-restore/receipt.json > artifacts/d1-time-travel-restore/receipt.next.json
          mv artifacts/d1-time-travel-restore/receipt.next.json artifacts/d1-time-travel-restore/receipt.json

      - name: Terminalize restore receipt fail closed
        if: always()
        run: |
          set -euo pipefail
          receipt=artifacts/d1-time-travel-restore/receipt.json
          if [ ! -f "$receipt" ]; then exit 0; fi
          status="$(jq -r '.status' "$receipt")"
          if [ "$status" = MUTATION_STARTED ]; then
            now="$(date -u +%s)"
            jq --arg status RECOVERY_REQUIRED --argjson failed "$now" '.status=$status | .failed_at_unix_seconds=$failed' "$receipt" \
              > artifacts/d1-time-travel-restore/receipt.next.json
            mv artifacts/d1-time-travel-restore/receipt.next.json "$receipt"
          fi
          jq -e '.status == "COMPLETED" or .status == "RECOVERY_REQUIRED"' "$receipt" >/dev/null

      - name: Persist terminal Time Travel restore receipt
        if: always() && hashFiles('artifacts/d1-time-travel-restore/receipt.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-time-travel-restore-receipt-${{ inputs.restore_authorization_comment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/d1-time-travel-restore/receipt.json
            artifacts/d1-time-travel-restore/ledger-before-names.json
            artifacts/d1-time-travel-restore/ledger-after-names.json
            artifacts/d1-time-travel-restore/restore-result.json
          if-no-files-found: error
          retention-days: 30
