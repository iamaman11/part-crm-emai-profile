name: Protected D1 Migration Executor

on:
  workflow_call:
    inputs:
      environment:
        description: Exact protected target environment; AR-11 permits staging only
        required: true
        type: string
      source_sha:
        description: Exact accepted-main source SHA
        required: true
        type: string
      component:
        description: catalog or resolver
        required: true
        type: string
      account_id:
        description: Exact Cloudflare account ID for staging
        required: true
        type: string
      database_name:
        description: Exact existing D1 database name
        required: true
        type: string
      database_id:
        description: Exact existing D1 database UUID
        required: true
        type: string
      target_release_manifest_json:
        description: Exact target component release manifest JSON
        required: true
        type: string
      current_release_manifest_json:
        description: Exact currently deployed component release manifest JSON
        required: true
        type: string
      known_good_release_manifest_json:
        description: Exact last-known-good component release manifest JSON
        required: true
        type: string
      preconditions_json:
        description: Ordinary D1 preconditions or exact Phase-C contract-transition evidence
        required: false
        default: '{}'
        type: string
      transition_mode:
        description: ordinary or the separately governed contract transition
        required: false
        default: ordinary
        type: string
      expected_release_set_id:
        description: Exact deployed Release Set identity; required only for contract transition
        required: false
        default: ''
        type: string
      mutation_authorized:
        description: Explicit caller authorization for the staging migration mutation
        required: true
        type: boolean
      confirmation:
        description: Ordinary source:environment:component:database_id; contract additionally binds mode and Release Set
        required: true
        type: string
    secrets:
      CLOUDFLARE_OBSERVE_API_TOKEN:
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment; production is intentionally unavailable in AR-11
        required: true
        type: choice
        options:
          - staging
      source_sha:
        description: Exact accepted-main source SHA
        required: true
        type: string
      component:
        description: D1 component
        required: true
        type: choice
        options:
          - catalog
          - resolver
      account_id:
        description: Exact Cloudflare account ID for staging
        required: true
        type: string
      database_name:
        description: Exact existing D1 database name
        required: true
        type: string
      database_id:
        description: Exact existing D1 database UUID
        required: true
        type: string
      target_release_manifest_json:
        description: Exact target component release manifest JSON
        required: true
        type: string
      current_release_manifest_json:
        description: Exact current component release manifest JSON
        required: true
        type: string
      known_good_release_manifest_json:
        description: Exact last-known-good component release manifest JSON
        required: true
        type: string
      preconditions_json:
        description: Ordinary D1 preconditions or exact Phase-C contract-transition evidence
        required: false
        default: '{}'
        type: string
      transition_mode:
        description: D1 transition mode
        required: false
        default: ordinary
        type: choice
        options:
          - ordinary
          - contract
      expected_release_set_id:
        description: Exact deployed Release Set identity; required for contract mode
        required: false
        default: ''
        type: string
      mutation_authorized:
        description: Explicitly authorize this staging migration mutation
        required: true
        default: false
        type: boolean
      confirmation:
        description: Exact mutation confirmation string
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-set-promotion-staging
  cancel-in-progress: false

jobs:
  authorize:
    name: Validate D1 mutation inputs before protected Environment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMPONENT: ${{ inputs.component }}
      DATABASE_ID: ${{ inputs.database_id }}
      TRANSITION_MODE: ${{ inputs.transition_mode }}
      EXPECTED_RELEASE_SET_ID: ${{ inputs.expected_release_set_id }}
      MUTATION_AUTHORIZED: ${{ inputs.mutation_authorized }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Fail closed before any Environment binding
        run: |
          set -euo pipefail
          test "$TARGET_ENVIRONMENT" = "staging"
          test "$COMPONENT" = "catalog" || test "$COMPONENT" = "resolver"
          test "$TRANSITION_MODE" = "ordinary" || test "$TRANSITION_MODE" = "contract"
          test "$MUTATION_AUTHORIZED" = "true"
          test -n "$SOURCE_SHA"
          test -n "$DATABASE_ID"
          if [ "$TRANSITION_MODE" = ordinary ]; then
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID"
          else
            test "$COMPONENT" = "catalog"
            test -n "$EXPECTED_RELEASE_SET_ID"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID:contract:$EXPECTED_RELEASE_SET_ID"
          fi

  migrate:
    needs: authorize
    name: staging / ${{ inputs.component }} / exact D1 migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      COMPONENT: ${{ inputs.component }}
      DATABASE_NAME: ${{ inputs.database_name }}
      DATABASE_ID: ${{ inputs.database_id }}
      TARGET_RELEASE_MANIFEST_JSON: ${{ inputs.target_release_manifest_json }}
      CURRENT_RELEASE_MANIFEST_JSON: ${{ inputs.current_release_manifest_json }}
      KNOWN_GOOD_RELEASE_MANIFEST_JSON: ${{ inputs.known_good_release_manifest_json }}
      PRECONDITIONS_JSON: ${{ inputs.preconditions_json }}
      TRANSITION_MODE: ${{ inputs.transition_mode }}
      EXPECTED_RELEASE_SET_ID: ${{ inputs.expected_release_set_id }}
      MUTATION_AUTHORIZED: ${{ inputs.mutation_authorized }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Reject non-main, non-exact, production, or disabled mutation authority
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$TARGET_ENVIRONMENT" = "staging"
          test "$COMPONENT" = "catalog" || test "$COMPONENT" = "resolver"
          test "$TRANSITION_MODE" = "ordinary" || test "$TRANSITION_MODE" = "contract"
          test "$MUTATION_AUTHORIZED" = "true"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test "$CLOUDFLARE_ACCOUNT_ID" = "${{ inputs.account_id }}"
          if [ "$TRANSITION_MODE" = ordinary ]; then
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID"
          else
            test "$COMPONENT" = catalog
            test -n "$EXPECTED_RELEASE_SET_ID"
            test "$CONFIRMATION" = "$SOURCE_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID:contract:$EXPECTED_RELEASE_SET_ID"
          fi

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checked-out source and staging-only authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TARGET_ENVIRONMENT" = staging

      - name: Set up pinned Node and npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce exact provider executor and native policy engine
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"
          test "$(npx --yes wrangler@4.94.0 --version)" = "4.94.0"
          python scripts/d1-executor-plan.py self-test
          python scripts/d1-gate-diagnostics.py self-test
          python scripts/d1-prepare.py self-test
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID python scripts/check-opsctl-readonly.py
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo build --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Materialize exact metadata inputs and bounded provider config
        run: |
          set -euo pipefail
          mkdir -p artifacts/d1-migration
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path('artifacts/d1-migration')
          documents = {
              'target-release.json': os.environ['TARGET_RELEASE_MANIFEST_JSON'],
              'current-release.json': os.environ['CURRENT_RELEASE_MANIFEST_JSON'],
              'known-good-release.json': os.environ['KNOWN_GOOD_RELEASE_MANIFEST_JSON'],
              'preconditions.json': os.environ['PRECONDITIONS_JSON'],
          }
          for name, raw in documents.items():
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise SystemExit(f'{name} must contain exactly one JSON object')
              (out / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          binding = {'catalog': 'CATALOG_DB', 'resolver': 'RESOLVER_DB'}[os.environ['COMPONENT']]
          config = {
              'name': 'd1-migration-executor',
              'main': '../../tests/d1-runtime/worker.mjs',
              'compatibility_date': '2026-08-05',
              'account_id': os.environ['CLOUDFLARE_ACCOUNT_ID'],
              'd1_databases': [{
                  'binding': binding,
                  'database_name': os.environ['DATABASE_NAME'],
                  'database_id': os.environ['DATABASE_ID'],
                  'migrations_dir': 'migrations-bounded',
              }],
          }
          (out / 'wrangler.json').write_text(json.dumps(config, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          (out / 'context.json').write_text(json.dumps({
              'schema_version': 2,
              'source_sha': os.environ['SOURCE_SHA'],
              'environment': os.environ['TARGET_ENVIRONMENT'],
              'component': os.environ['COMPONENT'],
              'database_name': os.environ['DATABASE_NAME'],
              'database_id': os.environ['DATABASE_ID'],
              'transition_mode': os.environ['TRANSITION_MODE'],
              'expected_release_set_id': os.environ['EXPECTED_RELEASE_SET_ID'] or None,
              'mutation_authorized': True,
              'automatic_restore_allowed': False,
              'resource_auto_provisioning_allowed': False,
          }, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            > artifacts/d1-migration/repository.json

      - name: Verify exact remote database identity with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/provider-identity.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('artifacts/d1-migration/provider-identity.json').read_text())
          expected = {os.environ['DATABASE_NAME'], os.environ['DATABASE_ID']}
          def paired(item):
              if isinstance(item, dict):
                  values = {value for value in item.values() if isinstance(value, str)}
                  return expected.issubset(values) or any(paired(value) for value in item.values())
              if isinstance(item, list):
                  return any(paired(value) for value in item)
              return False
          assert paired(value), 'provider identity does not contain exact database name and UUID in one object'
          PY

      - name: Read remote migration ledger with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-before.json

      - name: Normalize and classify remote ledger with credential-free opsctl
        run: |
          set -euo pipefail
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status \
            --component "$COMPONENT" --ledger-json artifacts/d1-migration/ledger-before.json \
            > artifacts/d1-migration/status-before.json

      - name: Run credential-free native plan, compatibility, and rollback-blocker gates
        id: policy
        run: |
          set -euo pipefail
          diagnostics="artifacts/d1-migration/d1-gate-diagnostics.jsonl"
          : > "$diagnostics"

          if [ "$TRANSITION_MODE" = ordinary ]; then
            set +e
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
              python scripts/d1-prepare.py prepare \
                --opsctl tools/opsctl/target/debug/opsctl \
                --root . \
                --component "$COMPONENT" \
                --ledger-json artifacts/d1-migration/ledger-before.json \
                --release-manifest artifacts/d1-migration/target-release.json \
                --current-manifest artifacts/d1-migration/current-release.json \
                --known-good-manifest artifacts/d1-migration/known-good-release.json \
                --preconditions-json artifacts/d1-migration/preconditions.json \
                --output artifacts/d1-migration/prepare.json
            plan_rc=$?
            set -e
            if [ "$plan_rc" -ne 0 ]; then
              python scripts/d1-gate-diagnostics.py record \
                --diagnostics "$diagnostics" \
                --gate native-plan-command \
                --reason-code D1_NATIVE_PLAN_COMMAND_FAILED \
                --exit-code "$plan_rc" \
                --detail 'credential-free prepare wrapping ordinary d1 plan blocked; exact inner cause is preserved in prepare.json'
              exit "$plan_rc"
            fi
            jq -e '.status == "PREPARE_READY" and .authorization_consumed == false and .mutation_executed == false and .provider_mutation_executed == false' \
              artifacts/d1-migration/prepare.json >/dev/null
            jq -e '.plan != null and .compatibility != null' artifacts/d1-migration/prepare.json >/dev/null
            jq '.plan' artifacts/d1-migration/prepare.json > artifacts/d1-migration/plan.json
            jq '.compatibility' artifacts/d1-migration/prepare.json > artifacts/d1-migration/compatibility.json
          else
            set +e
            evaluated_at="$(date -u +%s)"
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet \
              --manifest-path tools/opsctl/Cargo.toml --example d1-contract-transition -- \
              --root . \
              --ledger-json artifacts/d1-migration/ledger-before.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              --evidence-json artifacts/d1-migration/preconditions.json \
              --evaluated-at-unix-seconds "$evaluated_at" \
              --expected-source-sha "$SOURCE_SHA" \
              --expected-release-set-id "$EXPECTED_RELEASE_SET_ID" \
              > artifacts/d1-migration/plan.json
            plan_rc=$?
            set -e
            if [ "$plan_rc" -ne 0 ]; then
              python scripts/d1-gate-diagnostics.py record \
                --diagnostics "$diagnostics" \
                --gate contract-transition-plan-command \
                --reason-code D1_CONTRACT_TRANSITION_PLAN_COMMAND_FAILED \
                --exit-code "$plan_rc" \
                --detail 'credential-free contract-transition plan command returned non-zero'
              exit "$plan_rc"
            fi

            set +e
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 compatibility \
              --component "$COMPONENT" \
              --ledger-json artifacts/d1-migration/ledger-before.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              > artifacts/d1-migration/compatibility.json
            compatibility_rc=$?
            set -e
            if [ "$compatibility_rc" -ne 0 ]; then
              python scripts/d1-gate-diagnostics.py record \
                --diagnostics "$diagnostics" \
                --gate compatibility-command \
                --reason-code D1_COMPATIBILITY_COMMAND_FAILED \
                --exit-code "$compatibility_rc" \
                --detail 'credential-free compatibility command returned non-zero'
              exit "$compatibility_rc"
            fi
          fi

          python scripts/d1-gate-diagnostics.py evaluate \
            --plan artifacts/d1-migration/plan.json \
            --compatibility artifacts/d1-migration/compatibility.json \
            --diagnostics "$diagnostics" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload typed D1 prepare evidence on ordinary policy failure
        if: inputs.transition_mode == 'ordinary' && failure() && steps.policy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-prepare-blocked-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/prepare.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload metadata-only D1 gate diagnostics on policy failure
        if: failure() && steps.policy.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-gate-diagnostics-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/d1-gate-diagnostics.jsonl
          if-no-files-found: error
          retention-days: 30

      - name: Materialize exactly native planned_migrations from typed successor projection
        run: |
          set -euo pipefail
          python scripts/d1-executor-plan.py materialize \
            --repo-root . \
            --repository artifacts/d1-migration/repository.json \
            --plan artifacts/d1-migration/plan.json \
            --ledger artifacts/d1-migration/ledger-before.json \
            --component "$COMPONENT" \
            --mode "$TRANSITION_MODE" \
            --output-dir artifacts/d1-migration/migrations-bounded \
            --expected-pending artifacts/d1-migration/expected-pending.json \
            --normalized-ledger artifacts/d1-migration/ledger-before-names.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('artifacts/d1-migration/ledger-before-names.json').read_text())
          planned = json.loads(Path('artifacts/d1-migration/expected-pending.json').read_text())
          Path('artifacts/d1-migration/expected-after.json').write_text(
              json.dumps(before + planned, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Compare Wrangler pending list to exact native plan with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 migrations list "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/wrangler-pending-before.txt
          python scripts/d1-executor-plan.py verify-pending \
            --expected artifacts/d1-migration/expected-pending.json \
            --wrangler-output artifacts/d1-migration/wrangler-pending-before.txt

      - name: Capture metadata-only pre-migration Time Travel bookmark with observe credential
        if: steps.policy.outputs.apply_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/pre-migration-bookmark.json

      - name: Revalidate exact ledger fence and apply planned migrations with deploy credential
        if: steps.policy.outputs.apply_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" \
            --config artifacts/d1-migration/wrangler.json --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/provider-identity-fence.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          value = json.loads(Path('artifacts/d1-migration/provider-identity-fence.json').read_text())
          expected = {os.environ['DATABASE_NAME'], os.environ['DATABASE_ID']}
          def paired(item):
              if isinstance(item, dict):
                  values = {value for value in item.values() if isinstance(value, str)}
                  return expected.issubset(values) or any(paired(value) for value in item.values())
              if isinstance(item, list):
                  return any(paired(value) for value in item)
              return False
          assert paired(value), 'provider identity drifted before mutation'
          PY
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-fence.json
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status \
            --component "$COMPONENT" --ledger-json artifacts/d1-migration/ledger-fence.json \
            > artifacts/d1-migration/status-fence.json
          cmp --silent artifacts/d1-migration/status-before.json artifacts/d1-migration/status-fence.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-migration/ledger-fence.json \
            --output artifacts/d1-migration/ledger-fence-names.json
          cmp --silent artifacts/d1-migration/ledger-before-names.json artifacts/d1-migration/ledger-fence-names.json
          npx --yes wrangler@4.94.0 d1 migrations list "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/wrangler-pending-fence.txt
          python scripts/d1-executor-plan.py verify-pending \
            --expected artifacts/d1-migration/expected-pending.json \
            --wrangler-output artifacts/d1-migration/wrangler-pending-fence.txt
          npx --yes wrangler@4.94.0 d1 migrations apply "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --experimental-provision=false --experimental-auto-create=false

      - name: Reread remote ledger with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json \
            --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/ledger-after.json
          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger artifacts/d1-migration/ledger-after.json \
            --output artifacts/d1-migration/ledger-after-names.json
          cmp --silent artifacts/d1-migration/expected-after.json artifacts/d1-migration/ledger-after-names.json

      - name: Require exact target through credential-free opsctl verify
        run: |
          set -euo pipefail
          if [ "$TRANSITION_MODE" = ordinary ]; then
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 verify \
              --component "$COMPONENT" \
              --ledger-json artifacts/d1-migration/ledger-after.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              > artifacts/d1-migration/verify.json
            jq -e '.ledger_state == "EXACT" and .decision == "SAFE" and .allowed == true and .mutation_executed == false' \
              artifacts/d1-migration/verify.json >/dev/null
          else
            evaluated_at="$(date -u +%s)"
            env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID cargo run --locked --quiet \
              --manifest-path tools/opsctl/Cargo.toml --example d1-contract-transition -- \
              --root . \
              --ledger-json artifacts/d1-migration/ledger-before.json \
              --post-ledger-json artifacts/d1-migration/ledger-after.json \
              --release-manifest artifacts/d1-migration/target-release.json \
              --evidence-json artifacts/d1-migration/preconditions.json \
              --evaluated-at-unix-seconds "$evaluated_at" \
              --expected-source-sha "$SOURCE_SHA" \
              --expected-release-set-id "$EXPECTED_RELEASE_SET_ID" \
              > artifacts/d1-migration/verify.json
            jq -e '.command == "d1 contract-transition verify" and .predecessor_ledger_state == "EXACT" and .ledger_state == "EXACT" and .decision == "SAFE" and .predecessor_revision == "0031_device_binding_governance.sql" and .remote_revision == "0032_pas2_payload_fingerprint_contract.sql" and .runtime_target_revision == "0031_device_binding_governance.sql" and .supported_schema_min == "0031_device_binding_governance.sql" and .supported_schema_max == "0032_pas2_payload_fingerprint_contract.sql" and .transition_migrations == ["0032_pas2_payload_fingerprint_contract.sql"] and .planned_migrations == [] and .recovery_strategy == "FAIL_FORWARD_ONLY" and .allowed == true and .mutation_executed == false' \
              artifacts/d1-migration/verify.json >/dev/null
          fi

      - name: Verify post-apply database invariants with observe credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json --command "PRAGMA foreign_key_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/foreign-key-check.json
          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote \
            --config artifacts/d1-migration/wrangler.json --command "PRAGMA integrity_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > artifacts/d1-migration/integrity-check.json
          python - <<'PY'
          import json
          from pathlib import Path
          fk = json.loads(Path('artifacts/d1-migration/foreign-key-check.json').read_text())
          integrity = json.loads(Path('artifacts/d1-migration/integrity-check.json').read_text())
          assert len(fk) == 1 and fk[0]['success'] is True and fk[0]['results'] == [], fk
          assert len(integrity) == 1 and integrity[0]['success'] is True, integrity
          rows = integrity[0]['results']
          assert len(rows) == 1 and list(rows[0].values()) == ['ok'], integrity
          PY

      - name: Build metadata-only migration evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          root = Path('artifacts/d1-migration')
          def load(name, optional=False):
              path = root / name
              if optional and not path.exists():
                  return None
              return json.loads(path.read_text(encoding='utf-8'))
          def digest(name, optional=False):
              path = root / name
              if optional and not path.exists():
                  return None
              return hashlib.sha256(path.read_bytes()).hexdigest()
          plan = load('plan.json')
          evidence = {
              'schema_version': 2,
              'evidence_kind': 'protected-d1-migration-execution',
              'context': load('context.json'),
              'provider_identity': load('provider-identity.json'),
              'status_before': load('status-before.json'),
              'status_fence': load('status-fence.json', optional=True),
              'plan': plan,
              'compatibility': load('compatibility.json'),
              'expected_pending_migrations': load('expected-pending.json'),
              'wrangler_pending_before_sha256': digest('wrangler-pending-before.txt'),
              'wrangler_pending_fence_sha256': digest('wrangler-pending-fence.txt', optional=True),
              'pre_migration_bookmark': load('pre-migration-bookmark.json', optional=True),
              'ledger_before': load('ledger-before.json'),
              'ledger_after': load('ledger-after.json'),
              'verify': load('verify.json'),
              'foreign_key_check': load('foreign-key-check.json'),
              'integrity_check': load('integrity-check.json'),
              'provider_mutation_executed': bool(plan.get('planned_migrations')),
              'automatic_restore_executed': False,
              'secret_material_recorded': False,
          }
          (root / 'evidence.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          for sensitive in (
              'wrangler.json', 'target-release.json', 'current-release.json', 'known-good-release.json',
              'preconditions.json', 'ledger-fence.json', 'provider-identity-fence.json',
          ):
              (root / sensitive).unlink(missing_ok=True)
          PY

      - name: Upload metadata-only D1 migration evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-migration-evidence-${{ inputs.environment }}-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-migration/evidence.json
          if-no-files-found: error
          retention-days: 30