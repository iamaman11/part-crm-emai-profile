name: AR-8C Staging Provider Bootstrap

on:
  pull_request:
    paths:
      - '.github/scripts/ar8-staging-provider-bootstrap.mjs'
      - '.github/scripts/ar8c-resolver-schema-convergence.mjs'
      - '.github/scripts/ar8c-resolver-convergence-execution-contract.mjs'
      - '.github/workflows/ar8c-staging-provider-bootstrap.yml'
      - '.github/workflows/ar8c-resolver-schema-convergence.yml'

permissions:
  contents: read

jobs:
  contract:
    name: AR-8C Provider Bootstrap Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate accepted provider execution authority
        run: |
          node .github/scripts/ar8-staging-provider-bootstrap.mjs contract
          node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Prove resolver convergence fails closed
        run: node .github/scripts/ar8c-resolver-schema-convergence.mjs self-test

      - name: Validate privileged resolver convergence execution surface
        run: node .github/scripts/ar8c-resolver-convergence-execution-contract.mjs
