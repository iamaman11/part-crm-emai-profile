name: R5 Provenance Finalize Temporary

on:
  push:
    branches:
      - audit/r5-accepted-provenance
    paths:
      - .github/workflows/r5-provenance-finalize.yml

permissions:
  contents: write

jobs:
  finalize-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/r5-accepted-provenance
          fetch-depth: 0

      - name: Record accepted R5 provenance fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "**Current accepted base:** `83fcb5129c81b92d5e96e9932edc8d06be182625` after accepted R4c PR #184 from exact source head `932faa9e40d503472125f44983d0e938bc8c10c4`  ",
                  "**Current accepted base:** `51719b5b0590c76fd4b18ae876b02c69e59756c8` after accepted R5 PR #187 from exact source head `1c51bf850ce6ec2cae63a086eee24411b413c2d3`",
              ),
              (
                  "### R5 — P1/P2 — Historical `use-cases` compatibility coupling is cemented by CI\n\n**Finding**",
                  "### R5 — P1/P2 — Historical `use-cases` compatibility coupling is cemented by CI — ACCEPTED\n\n**Accepted main:** squash merge `51719b5b0590c76fd4b18ae876b02c69e59756c8` via PR #187 from exact source head `1c51bf850ce6ec2cae63a086eee24411b413c2d3`.\n\n**Finding**",
              ),
              (
                  "5. **Application ownership cleanup** — R5.",
                  "5. **Application ownership cleanup** — R5. Accepted via PR #187 / `51719b5b0590c76fd4b18ae876b02c69e59756c8` from exact source head `1c51bf850ce6ec2cae63a086eee24411b413c2d3`.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one provenance target, found {count}: {old[:90]!r}")
              text = text.replace(old, new, 1)

          required = (
              "**Status:** ACTIVE / BLOCKING PHASE 2J",
              "**Production readiness:** remains `false`",
              "### R6 — P1/P2 — Frontend API facade is becoming a central bottleneck",
              "### R7 — P1 — Current repository documentation is not a single truthful authority",
              "Phase 2J may resume only when all of the following are true on accepted `main`:",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"freeze/provenance invariant missing: {token}")

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md

      - name: Commit provenance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r5-provenance-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md .github/workflows/r5-provenance-finalize.yml
          git commit -m "Record accepted R5 provenance"
          git push origin HEAD:audit/r5-accepted-provenance
