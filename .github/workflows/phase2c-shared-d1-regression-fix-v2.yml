name: Phase 2C Shared D1 Regression Fix V2

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2c-client-merge-assignment-ui
          persist-credentials: true
      - name: Evolve legacy assignment fixtures to governed commands
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scripts/test-d1-schema.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'assignment_cross_tenant': (
                  1,
                  50,
                  'invalid tenant link',
              ),
              'assignment_archived': (
                  1,
                  60,
                  'archived client',
              ),
              'assignment_primary_one': (
                  1,
                  70,
                  'primary assignment',
              ),
              'assignment_primary_two': (
                  2,
                  71,
                  'duplicate active assignment',
              ),
          }

          for assignment_id, (expected_version, at, reason) in replacements.items():
              pattern = re.compile(
                  r"INSERT INTO profile_client_assignments\s*\(.*?\)\s*"
                  r"VALUES\s*\(\?,\s*'" + re.escape(assignment_id) + r"'.*?\)",
                  re.DOTALL,
              )
              sql = (
                  "INSERT INTO profile_assignment_commands (\n"
                  "    tenant_id, profile_id, client_id, command_actor_id,\n"
                  "    command_id, assignment_id, expected_profile_version, reason, executed_at_ms\n"
                  ") VALUES (\n"
                  f"    ?, ?, ?, ?, 'cmd_{assignment_id}', '{assignment_id}',\n"
                  f"    {expected_version}, '{reason}', {at}\n"
                  ")"
              )
              text, count = pattern.subn(sql, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one fixture for {assignment_id}, found {count}')

          duplicate_at = text.index('assignment_primary_two')
          unique_at = text.index('"UNIQUE constraint failed"', duplicate_at)
          text = (
              text[:unique_at]
              + '"profile_assignment_same_client"'
              + text[unique_at + len('"UNIQUE constraint failed"'):]
          )
          path.write_text(text, encoding='utf-8')
      - name: Run shared D1 invariant suite
        run: python scripts/test-d1-schema.py
      - name: Run Phase 2C D1 proof
        run: python scripts/test-phase2c-client-merge-assignment.py
      - name: Commit validated shared-test evolution
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/test-d1-schema.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2C: evolve shared assignment D1 fixtures to governed commands'
          git push origin HEAD:phase2c-client-merge-assignment-ui
