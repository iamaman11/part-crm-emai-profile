name: Step 9 Format Bootstrap

on:
  pull_request:
  push:
    branches:
      - repository-step-9-encrypted-cloud-generations

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Apply pinned rustfmt
        run: cargo fmt --all

      - name: Commit formatting when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/encrypted-generation-domain
          if git diff --cached --quiet; then
            echo "Formatting is already current."
          else
            git commit -m "Repository Step 9: apply pinned rustfmt"
            git fetch origin repository-step-9-encrypted-cloud-generations
            git rebase origin/repository-step-9-encrypted-cloud-generations
            git push origin HEAD:repository-step-9-encrypted-cloud-generations
          fi
