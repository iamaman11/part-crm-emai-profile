name: Temporary Step 5 Normalize Sources

on:
  push:
    branches:
      - repository-step-5-profile-coordinator

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-5-profile-coordinator

      - name: Normalize source and lockfile
        run: |
          python - <<'PY'
          from pathlib import Path

          domain = Path("crates/session-domain/src/coordinator.rs")
          text = domain.read_text(encoding="utf-8")
          text = text.replace("if now > intent.expires_at {", "if now >= intent.expires_at {")
          domain.write_text(text, encoding="utf-8")

          adapter = Path("crates/cloudflare-adapters/src/profile_coordinator.rs")
          text = adapter.read_text(encoding="utf-8")
          if "pub fn is_journal_empty" not in text:
              marker = "    pub fn journal_len(&self) -> usize {\n        self.journal.len()\n    }"
              replacement = marker + "\n\n    #[must_use]\n    pub fn is_journal_empty(&self) -> bool {\n        self.journal.is_empty()\n    }"
              if marker not in text:
                  raise SystemExit("unexpected journal API shape")
              text = text.replace(marker, replacement)
          text = text.replace(
              "#[derive(Debug)]\npub enum CoordinatorAdapterError",
              "#[derive(Debug, Eq, PartialEq)]\npub enum CoordinatorAdapterError",
          )
          adapter.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo generate-lockfile
          rm .github/workflows/step5-fix-edge-semantics.yml

      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/session-domain/src/coordinator.rs crates/cloudflare-adapters/src/profile_coordinator.rs apps/control-plane-worker/src/profile_coordinator.rs apps/control-plane-worker/src/lib.rs crates/control-plane-contract/src/lib.rs .github/workflows/step5-fix-edge-semantics.yml
          git commit -m "Step 5: normalize coordinator sources and lockfile"
          git push origin HEAD:repository-step-5-profile-coordinator
