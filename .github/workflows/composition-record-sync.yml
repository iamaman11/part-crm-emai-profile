name: Composition Record Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'composition-acceptance-record' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Record accepted composition state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          accepted_head = '31f358c92c2e09c752155af208b7d2aaf73d472a'
          accepted_run = '31208960718'
          accepted_merge = 'eb02f3e81022193fb459b7c46d14afcb19c8900f'

          status_path = Path('docs/status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          assert status['implementation']['production_code'] is False
          status['implementation']['cross_component_acceptance'] = 'accepted_pr_66_repository_local_synthetic'
          status['implementation']['composition_epic'] = 'accepted_epic_43_repository_local_complete'
          status['evidence'].pop('cross_component_candidate', None)
          status['evidence']['cross_component_acceptance'] = f'accepted_pr_66_head_{accepted_head}_gate_run_{accepted_run}_merge_{accepted_merge}'
          assert status['implementation']['production_code'] is False
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          cross_path = Path('docs/CROSS_COMPONENT_ACCEPTANCE.md')
          cross = cross_path.read_text(encoding='utf-8')
          cross = cross.replace(
              '**Status:** final candidate repository-local composed/synthetic evidence; exact-head acceptance pending  ',
              '**Status:** accepted repository-local composed/synthetic evidence  ',
              1,
          )
          candidate = 'The evidence registry and status projection have been synchronized from this successful candidate run. This document update establishes the user-authored final candidate head; acceptance still requires all permanent workflows green on that same unchanged head before squash merge.'
          accepted = f'Final acceptance used exact head `{accepted_head}`. All 12 permanent workflows passed on that unchanged head, including Cross-Component Acceptance Gate `{accepted_run}`; squash merge `{accepted_merge}` established the accepted repository-local composition on `main`.'
          if candidate not in cross:
              raise SystemExit('candidate acceptance sentence not found')
          cross = cross.replace(candidate, accepted, 1)
          cross_path.write_text(cross, encoding='utf-8')

          matrix_path = Path('docs/DEVELOPER_CAPABILITY_MATRIX.md')
          matrix = matrix_path.read_text(encoding='utf-8')
          matrix = matrix.replace(
              'completed hardening #41; composition epic #43; generation slice #44 / PR #51; Profile Bridge slice #54 / PR #55; mailbox slice #56 / PR #60 + repair #61 / PR #62; accepted React UI #63 / PR #64; cross-component candidate #65 / PR #66',
              'completed hardening #41; completed composition epic #43; generation slice #44 / PR #51; Profile Bridge slice #54 / PR #55; mailbox slice #56 / PR #60 + repair #61 / PR #62; React UI #63 / PR #64; cross-component acceptance #65 / PR #66',
              1,
          )
          old = '| Cross-component standalone acceptance | Composed candidate / Synthetic | PR #66 adds a deterministic metadata-only manifest/validator and one permanent read-only lane that executes governed D1 invariants, generation integrity, Worker/adapters native+WASM, actual synthetic Bridge CLI, and Node24 frontend tests/build in one repository-local flow. | Candidate is not accepted on `main` until exact-head CI + squash merge; no external deployment/provider/device evidence is implied. |'
          new = '| Cross-component standalone acceptance | Composed / Synthetic | Accepted PR #66 provides a deterministic metadata-only manifest/validator and permanent read-only lane that executes governed D1 invariants, generation integrity, Worker/adapters native+WASM, actual synthetic Bridge CLI, and Node24 frontend tests/build in one repository-local flow. Exact accepted head and 12/12 CI are recorded in the evidence index. | No external deployment/provider/device evidence is implied; all production gates remain External. |'
          if old not in matrix:
              raise SystemExit('candidate cross-component matrix row not found')
          matrix = matrix.replace(old, new, 1)
          matrix_path.write_text(matrix, encoding='utf-8')

          index_path = Path('docs/TEST_EVIDENCE_INDEX.md')
          index = index_path.read_text(encoding='utf-8')
          old_row = '| Cross-component standalone acceptance / PR #66 | candidate repository-local composed/synthetic evidence; final exact-head acceptance pending | deterministic metadata-only six-phase manifest, D1/ACL/mailbox/generation invariants, adapter + Worker native/WASM, actual synthetic Bridge CLI to `DIRTY_LOCAL`, Node24 frontend install/typecheck/tests/build; candidate gate `31208530252` succeeded | real Cloudflare/Camoufox/mailbox providers, production keys/signing, physical multi-device or production readiness |'
          new_row = f'| Cross-component standalone acceptance / PR #66 | accepted repository-local composed/synthetic evidence | exact head `{accepted_head}`; all 12 permanent workflows green; Cross-Component Gate `{accepted_run}`; deterministic six-phase metadata-only manifest, D1/ACL/mailbox/generation invariants, adapter + Worker native/WASM, actual synthetic Bridge CLI to `DIRTY_LOCAL`, Node24 frontend install/typecheck/tests/build; squash merge `{accepted_merge}` | real Cloudflare/Camoufox/mailbox providers, production keys/signing, physical multi-device or production readiness |'
          if old_row not in index:
              raise SystemExit('candidate cross-component evidence row not found')
          index = index.replace(old_row, new_row, 1)
          old_section_tail = '- this remains candidate evidence until PR #66 passes final exact-head acceptance and squash merge.'
          new_section_tail = f'- final accepted source head: `{accepted_head}`; all 12 permanent workflows passed on that exact unchanged head; Cross-Component Acceptance Gate `{accepted_run}` succeeded; squash merge `{accepted_merge}`.'
          if old_section_tail not in index:
              raise SystemExit('candidate evidence section tail not found')
          index = index.replace(old_section_tail, new_section_tail, 1)
          index_path.write_text(index, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              '- **repository-local composition epic #43**: authoritative profile-generation\n  registry/API, полный Profile Bridge operator flow, mailbox vertical slice,\n  React UI composition и cross-component synthetic acceptance;',
              '- **completed repository-local composition epic #43**: authoritative profile-generation\n  registry/API, полный Profile Bridge operator flow, mailbox vertical slice,\n  React UI composition и cross-component synthetic acceptance приняты;',
              1,
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit accepted evidence
        run: |
          rm .github/workflows/composition-record-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json docs/CROSS_COMPONENT_ACCEPTANCE.md docs/DEVELOPER_CAPABILITY_MATRIX.md docs/TEST_EVIDENCE_INDEX.md README.md .github/workflows/composition-record-sync.yml
          git commit -m "Record accepted repository composition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
