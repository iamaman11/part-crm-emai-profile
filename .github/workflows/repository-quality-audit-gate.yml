name: Repository Quality Audit Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-quality-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-audit:
    name: Invariants And Fail-Closed Boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Compile audit policy scripts
        run: |
          python -m py_compile scripts/test-profile-generation-state-guards.py
          python -m py_compile scripts/check-github-actions-runtime.py
          python -m py_compile scripts/check-capability-module-layout.py
          python -m py_compile scripts/check-worker-application-boundary.py
          python -m py_compile scripts/check-profile-worker-application-boundary.py
          python -m py_compile scripts/check-generation-worker-application-boundary.py
          python -m py_compile scripts/check-mailbox-binding-worker-application-boundary.py
          python -m py_compile scripts/check-mailbox-job-worker-application-boundary.py
          python -m py_compile scripts/check-frontend-feature-boundaries.py
          python -m py_compile scripts/generate-architecture-inventory.py
          python -m py_compile scripts/test-architecture-inventory-negative.py
          python -m py_compile scripts/check-phase1a-event-boundaries.py
          python -m py_compile scripts/check-phase1b-notification-boundaries.py
          python -m py_compile scripts/check-phase2a-client-boundaries.py
          python -m py_compile scripts/check-phase2b-client-boundaries.py
          python -m py_compile scripts/test-phase2b-client-contacts.py
          python -m py_compile scripts/test-integration-event-foundation.py
          python -m py_compile scripts/test-notification-delivery-foundation.py

      - name: Enforce GitHub Actions Node 24 checkout runtime
        run: python scripts/check-github-actions-runtime.py

      - name: Prove deprecated Node 20 checkout fixture is rejected
        run: |
          if python scripts/check-github-actions-runtime.py --root tests/github-actions-runtime/fixtures/node20-checkout; then
            echo 'Deprecated Node 20 checkout fixture unexpectedly passed.' >&2
            exit 1
          fi

      - name: Enforce capability-owned application boundaries
        run: python scripts/check-capability-module-layout.py

      - name: Prove collapsed capability facades are rejected
        run: python scripts/check-capability-module-layout.py --self-test

      - name: Enforce Phase 1B notification ownership boundaries
        run: python scripts/check-phase1b-notification-boundaries.py

      - name: Prove provider leakage and duplicate notification ownership are rejected
        run: python scripts/check-phase1b-notification-boundaries.py --self-test

      - name: Enforce Phase 2A client ownership and contact-protection boundaries
        run: python scripts/check-phase2a-client-boundaries.py

      - name: Prove Phase 2A plaintext leakage, provider leakage and duplicate ownership are rejected
        run: python scripts/check-phase2a-client-boundaries.py --self-test

      - name: Enforce Phase 2B protected client-contact D1 boundaries
        run: python scripts/check-phase2b-client-boundaries.py

      - name: Prove plaintext and unscoped Phase 2B D1 fixtures are rejected
        run: python scripts/check-phase2b-client-boundaries.py --self-test

      - name: Prove Phase 2B protected client-contact D1 invariants
        run: python scripts/test-phase2b-client-contacts.py

      - name: Enforce thin client Worker application boundary
        run: python scripts/check-worker-application-boundary.py

      - name: Prove direct D1 client transport is rejected
        run: python scripts/check-worker-application-boundary.py --self-test

      - name: Enforce thin profile Worker application boundary
        run: python scripts/check-profile-worker-application-boundary.py

      - name: Prove direct D1 and legacy profile transports are rejected
        run: python scripts/check-profile-worker-application-boundary.py --self-test

      - name: Enforce thin generation Worker application boundary
        run: python scripts/check-generation-worker-application-boundary.py

      - name: Prove direct D1 generation transport is rejected
        run: python scripts/check-generation-worker-application-boundary.py --self-test

      - name: Enforce thin mailbox binding Worker application boundary
        run: python scripts/check-mailbox-binding-worker-application-boundary.py

      - name: Prove direct D1 and legacy mixed mailbox transports are rejected
        run: python scripts/check-mailbox-binding-worker-application-boundary.py --self-test

      - name: Enforce thin mailbox job Worker application boundary
        run: python scripts/check-mailbox-job-worker-application-boundary.py

      - name: Prove direct D1 and provider mailbox job transport is rejected
        run: python scripts/check-mailbox-job-worker-application-boundary.py --self-test

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Verify architecture inventory and documentation consistency
        run: python scripts/generate-architecture-inventory.py --check

      - name: Prove architecture inventory drift is rejected
        run: python scripts/test-architecture-inventory-negative.py

      - name: Enforce Phase 1A event/outbox ownership and scope
        run: python scripts/check-phase1a-event-boundaries.py

      - name: Prove Phase 1A durable outbox and consumer idempotency
        run: python scripts/test-integration-event-foundation.py

      - name: Prove Phase 1B delivery and cursor D1 invariants
        run: python scripts/test-notification-delivery-foundation.py

      - name: Test Phase 1B notification inner boundaries
        run: >-
          cargo test --locked
          -p notification-domain
          -p application-ports
          -p use-cases-notifications

      - name: Check Phase 1B notification inner boundaries for Workers target
        run: >-
          cargo check --locked
          -p notification-domain
          -p application-ports
          -p use-cases-notifications
          --target wasm32-unknown-unknown

      - name: Test Phase 2A client inner boundaries
        run: >-
          cargo test --locked
          -p profile-platform-primitives
          -p client-domain
          -p application-ports
          -p use-cases-clients

      - name: Check Phase 2A client inner boundaries for Workers target
        run: >-
          cargo check --locked
          -p profile-platform-primitives
          -p client-domain
          -p application-ports
          -p use-cases-clients
          --target wasm32-unknown-unknown

      - name: Test hardened pure boundaries
        run: >-
          cargo test --locked
          -p profile-platform-primitives
          -p client-domain
          -p profile-domain
          -p session-domain
          -p use-cases
          -p control-plane-contract

      - name: Test typed Cloudflare projections
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Test Worker native helpers
        run: cargo test --locked -p browser-profile-control-plane-worker --lib

      - name: Check Worker fail-closed composition for WASM
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Prove D1 live profile state guards
        run: python scripts/test-profile-generation-state-guards.py

      - name: Verify developer capability map exists
        run: |
          test -s docs/DEVELOPER_CAPABILITY_MATRIX.md
          grep -q 'Composed' docs/DEVELOPER_CAPABILITY_MATRIX.md
          grep -q 'Synthetic' docs/DEVELOPER_CAPABILITY_MATRIX.md
          grep -q 'Target' docs/DEVELOPER_CAPABILITY_MATRIX.md
          grep -q 'External' docs/DEVELOPER_CAPABILITY_MATRIX.md

      - name: Reject masked version overflow and direct ready transitions
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --fixed-strings '.saturating_add(1)' \
            apps/control-plane-worker crates; then
            echo 'Version increments must not saturate.' >&2
            exit 1
          fi
          if grep -R --line-number --fixed-strings 'AggregateVersion::from_value' \
            apps crates; then
            echo 'Invariant-bypassing aggregate version constructor returned.' >&2
            exit 1
          fi
