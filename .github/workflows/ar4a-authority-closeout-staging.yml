name: AR4A Authority Closeout Staging

on:
  push:
    branches:
      - agent/ar4a-authority-closeout-staging

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact post-merge staging baseline
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar4a-authority-closeout-staging
          fetch-depth: 0
          persist-credentials: true

      - name: Project accepted AR-4A authority
        run: python scratch/ar4a_authority_closeout.py

      - name: Regenerate canonical inventory
        run: python scripts/generate-architecture-inventory.py --write

      - name: Verify accepted AR-4A authority fail closed
        shell: bash
        run: |
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python -m json.tool architecture/inventory.json >/dev/null
          python -m json.tool architecture/architecture-rebaseline-v3-transition.json >/dev/null
          python -m json.tool docs/status.json >/dev/null

      - name: Verify AR-4A accepted source fitness remains green
        shell: bash
        run: |
          python scripts/test-cross-component-acceptance.py
          python scripts/check-mailbox-job-worker-application-boundary.py
          python scripts/check-mailbox-job-worker-application-boundary.py --self-test
          python scripts/check-phase2h-ui-boundaries.py
          python scripts/check-phase2h-ui-boundaries.py --self-test
          python scripts/check-phase2i-hardening.py
          python scripts/check-phase2i-hardening.py --self-test

      - name: Commit only authority closeout outputs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            README.md \
            docs/README.md \
            docs/INDEX.md \
            docs/status.json \
            docs/DEVELOPMENT_PLAN.md \
            docs/ARCHITECTURE_REBASELINE_V3_PLAN.md \
            docs/ARCHITECTURE_REBASELINE_V3_AR4A.md \
            architecture/architecture-rebaseline-v3-transition.json \
            architecture/inventory.json \
            scripts/_ar3_application_architecture.py \
            scripts/check-documentation-authority.py \
            scripts/generate-architecture-inventory.py
          git diff --cached --check
          git diff --cached --quiet && { echo 'No AR-4A closeout outputs produced'; exit 1; }
          git commit -m 'AR-4A closeout: accept composition remediation and advance to AR-4B'
          git push origin HEAD:agent/ar4a-authority-closeout-staging
