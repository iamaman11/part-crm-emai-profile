name: Step 4 Remove Legacy Writes

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-remove-legacy-writes
  cancel-in-progress: true

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Remove superseded direct mutation surface
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("crates/cloudflare-adapters/src/d1_identity_acl.rs")
          text = path.read_text(encoding="utf-8")

          constants = [
              "OWNER_TRANSFER_DEMOTE",
              "OWNER_TRANSFER_PROMOTE",
              "INVITATION_CREATE",
              "INVITATION_ACCEPT_MEMBERSHIP",
              "INVITATION_ACCEPT_RECORD",
              "MEMBERSHIP_STATUS_UPDATE",
              "PROFILE_CREATE",
              "PROFILE_ASSIGNMENT_CLOSE",
              "PROFILE_ASSIGNMENT_CREATE",
              "PROFILE_VERSION_CAS",
              "PROFILE_GRANT_UPSERT",
              "PROFILE_GRANT_REVOKE",
              "CLIENT_GRANT_UPSERT",
              "CLIENT_GRANT_REVOKE",
              "CLIENT_VERSION_CAS",
          ]
          for name in constants:
              text = re.sub(
                  rf"const {name}: &str = r#\".*?\"#;\n\n",
                  "",
                  text,
                  flags=re.S,
              )

          methods = [
              "transfer_owner",
              "create_invitation",
              "accept_invitation",
              "update_membership_status",
              "create_profile",
              "assign_profile",
              "grant_profile",
              "revoke_profile_grant",
              "profile_grant_batch",
              "grant_client",
              "revoke_client_grant",
              "client_grant_batch",
          ]

          def remove_method(source: str, name: str) -> str:
              candidates = [
                  f"    pub async fn {name}(",
                  f"    async fn {name}(",
              ]
              start = next((source.find(candidate) for candidate in candidates if source.find(candidate) >= 0), -1)
              if start < 0:
                  return source
              brace = source.find("{", start)
              if brace < 0:
                  raise RuntimeError(f"opening brace not found for {name}")
              depth = 0
              index = brace
              in_string = False
              escaped = False
              while index < len(source):
                  char = source[index]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          in_string = False
                  else:
                      if char == '"':
                          in_string = True
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              while end < len(source) and source[end] == "\n":
                                  end += 1
                              return source[:start] + source[end:]
                  index += 1
              raise RuntimeError(f"closing brace not found for {name}")

          for method in methods:
              text = remove_method(text, method)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify governed adapter build
        run: |
          cargo fmt --all
          cargo check --locked -p cloudflare-adapters --lib
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown

      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/step4-remove-legacy-writes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: remove legacy direct mutation surface"
          git push origin HEAD:repository-step-4-identity-clients-acl
