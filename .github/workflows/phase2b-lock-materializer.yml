name: Phase 2B Lock Materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2b-client-persistence-contact-crypto
          persist-credentials: true
      - name: Generate exact lockfile
        run: cargo generate-lockfile
      - name: Commit exact lockfile when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'Phase 2B: materialize exact Cargo lockfile'
          git push origin HEAD:phase2b-client-persistence-contact-crypto
