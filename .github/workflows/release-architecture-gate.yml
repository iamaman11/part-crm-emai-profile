name: Release Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main
      - agent/ar11-release-capability-promotion

permissions:
  contents: read

concurrency:
  group: release-architecture-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-maintenance:
    name: AR-11 deterministic projection maintenance
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/ar11-release-capability-promotion' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head with bounded write credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Generate canonical projection and apply mechanical Rust fixes
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --manifest-path tools/opsctl/Cargo.toml --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          python scripts/generate-architecture-inventory.py --write

      - name: Enforce generated-change allowlist
        id: changes
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              architecture/inventory.json|tools/opsctl/src/*.rs|tools/opsctl/src/*/*.rs) ;;
              *) echo "unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit deterministic generated output to the AR-11 branch only
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/inventory.json tools/opsctl/src
          git commit -m 'AR-11: regenerate canonical release projection'
          git push origin HEAD:agent/ar11-release-capability-promotion

  linux:
    name: Release capability and promotion policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Validate canonical release architecture source
        run: |
          node .github/scripts/release-architecture-ar11.mjs
          node .github/scripts/release-architecture-ar11.mjs --self-test

      - name: Verify canonical inventory projection
        run: python scripts/generate-architecture-inventory.py --check

      - name: Verify native opsctl release policy foundation
        run: |
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Prove production remains blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('architecture/release-architecture-ar11.json').read_text())
          assert authority['architecture_complete'] is False
          assert authority['production_core_gate'] == 'BLOCKED'
          assert authority['production_ready'] is False
          assert authority['production_mutation'] is False
          core = next(p for p in authority['release_profiles'] if p['profile_id'] == 'production-core-v1')
          assert core['current_authorization'] == 'BLOCKED'
          assert 'AR-15_UNSATISFIED' in core['blockers']
          assert 'AR-17_NOT_ACCEPTED' in core['blockers']
          PY

  windows:
    name: Release policy Windows regression
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "expected $env:EXPECTED_SOURCE_SHA, got $actual" }

      - name: Verify opsctl release authority on Windows
        shell: pwsh
        run: |
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml
