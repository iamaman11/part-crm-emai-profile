name: Release Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-architecture-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-projection-sync:
    name: Bounded AR-11 generated projection sync
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ar11-release-capability-promotion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact AR-11 candidate with bounded branch credentials
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Generate only deterministic AR-11 projections
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --manifest-path tools/opsctl/Cargo.toml --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          python scripts/generate-architecture-inventory.py --write

      - name: Enforce bounded generated path allowlist
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              architecture/inventory.json|tools/opsctl/src/release/authority.rs) ;;
              *) echo "unexpected generated path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit generated bytes to the single AR-11 branch
        if: steps.generated.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/inventory.json tools/opsctl/src/release/authority.rs
          git commit -m 'AR-11: regenerate canonical release projection'
          git push origin HEAD:agent/ar11-release-capability-promotion

  linux:
    name: Release capability and promotion policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Validate canonical release architecture source
        run: |
          node .github/scripts/release-architecture-ar11.mjs
          node .github/scripts/release-architecture-ar11.mjs --self-test
          node .github/scripts/frontend-capability-ar11.mjs

      - name: Generate exact candidate projection evidence
        run: |
          set -euo pipefail
          cargo clippy --fix --locked --manifest-path tools/opsctl/Cargo.toml --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          python scripts/generate-architecture-inventory.py --write
          mkdir -p artifacts/ar11-generated/tools/opsctl/src/release artifacts/ar11-generated/architecture
          cp architecture/inventory.json artifacts/ar11-generated/architecture/inventory.json
          cp tools/opsctl/src/release/authority.rs artifacts/ar11-generated/tools/opsctl/src/release/authority.rs

      - name: Upload candidate projection evidence
        id: generated
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-generated-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/ar11-generated
          if-no-files-found: error
          retention-days: 1

      - name: Verify generated candidate in place
        run: |
          python scripts/generate-architecture-inventory.py --check
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Prove production remains blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          authority = json.loads(Path('architecture/release-architecture-ar11.json').read_text())
          assert authority['architecture_complete'] is False
          assert authority['production_core_gate'] == 'BLOCKED'
          assert authority['production_ready'] is False
          assert authority['production_mutation'] is False
          core = next(p for p in authority['release_profiles'] if p['profile_id'] == 'production-core-v1')
          assert core['current_authorization'] == 'BLOCKED'
          assert 'AR-15_UNSATISFIED' in core['blockers']
          assert 'AR-17_NOT_ACCEPTED' in core['blockers']
          PY

  windows:
    name: Release policy Windows regression
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SOURCE_SHA) { throw "expected $env:EXPECTED_SOURCE_SHA, got $actual" }

      - name: Verify opsctl release authority on Windows
        shell: pwsh
        run: |
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml
