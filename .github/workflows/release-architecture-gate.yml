name: Release Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-architecture-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Release capability and promotion policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Validate frontend capability projection
        run: node .github/scripts/frontend-capability-ar11.mjs

      - name: Prove complete AR-11 behavioural certification traceability
        run: |
          python scripts/check-ar11-behavioural-certification.py
          python scripts/check-ar11-behavioural-certification.py --self-test

      - name: Prove FC-6 rehearsal evidence verifier fails closed
        run: python scripts/check-ar11-staging-rehearsal.py --self-test
