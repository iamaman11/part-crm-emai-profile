name: AR-8C One-Shot Provider Authority Inventory Sync

on:
  push:
    branches:
      - agent/ar8c-provider-execution-authority
    paths:
      - '.github/workflows/ar8c-sync-provider-authority-inventory-once.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Synchronize AR-8C provider authority inventory once
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Validate provider execution authority
        run: |
          node .github/scripts/ar8-staging-provider-bootstrap.mjs contract
          node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Register authority in canonical inventory generator
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-architecture-inventory.py')
          text = path.read_text(encoding='utf-8')
          constant_needle = 'CREDENTIAL_AUTHORITY = "architecture/credential-authority-ar8b.json"\n'
          constant_insert = constant_needle + 'AR8C_PROVIDER_EXECUTION_AUTHORITY = "architecture/ar8-staging-provider-bootstrap-contract.json"\nAR8C_PROVIDER_EXECUTION_EVIDENCE = "docs/AR8_STAGING_PROVIDER_BOOTSTRAP.md"\n'
          if 'AR8C_PROVIDER_EXECUTION_AUTHORITY =' in text:
              raise SystemExit('AR8C provider execution authority already registered')
          if text.count(constant_needle) != 1:
              raise SystemExit('credential authority constant insertion point drifted')
          text = text.replace(constant_needle, constant_insert, 1)

          document_needle = '    {"path": GOVERNANCE_CONTRACT, "status": "STABLE_AUTHORITY", "scope": "accepted_ar7_github_governance_contract"},\n'
          document_insert = document_needle + '    {"path": AR8C_PROVIDER_EXECUTION_EVIDENCE, "status": "EVIDENCE", "scope": "ar8c_protected_staging_provider_execution_authority"},\n    {"path": AR8C_PROVIDER_EXECUTION_AUTHORITY, "status": "STABLE_AUTHORITY", "scope": "ar8c_staging_provider_execution_contract"},\n'
          if text.count(document_needle) != 1:
              raise SystemExit('document-status insertion point drifted')
          text = text.replace(document_needle, document_insert, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Regenerate canonical inventory
        run: python scripts/generate-architecture-inventory.py --write

      - name: Enforce exact generated diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' architecture/inventory.json scripts/generate-architecture-inventory.py | sort)"
          test "$changed" = "$expected"
          git diff --check -- architecture/inventory.json scripts/generate-architecture-inventory.py

      - name: Write generated files to this branch only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: iamaman11/part-crm-emai-profile
          EXPECTED_BRANCH: agent/ar8c-provider-execution-authority
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ['EXPECTED_REPOSITORY']
          branch = os.environ['EXPECTED_BRANCH']
          expected_sha = os.environ['EXPECTED_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ar8c-provider-authority-inventory-sync',
          }

          def request(path, *, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request('https://api.github.com' + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          ref = request(f'/repos/{repository}/git/ref/heads/{urllib.parse.quote(branch, safe="")}')
          if ref['object']['sha'] != expected_sha:
              raise SystemExit(f"branch moved: expected {expected_sha}, got {ref['object']['sha']}")

          for file_path, message in [
              ('scripts/generate-architecture-inventory.py', 'Register AR-8C provider authority in inventory generator'),
              ('architecture/inventory.json', 'Regenerate architecture inventory for AR-8C provider authority'),
          ]:
              current = request(f'/repos/{repository}/contents/{file_path}?ref={urllib.parse.quote(branch, safe="")}')
              content = open(file_path, 'rb').read()
              request(
                  f'/repos/{repository}/contents/{file_path}',
                  method='PUT',
                  payload={
                      'message': message,
                      'content': base64.b64encode(content).decode(),
                      'sha': current['sha'],
                      'branch': branch,
                  },
              )
          print('AR-8C provider execution authority inventory synchronized.')
          PY
