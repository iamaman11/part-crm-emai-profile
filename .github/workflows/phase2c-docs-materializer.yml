name: Phase 2C Docs Materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Close Phase 2C and advance Phase 2D marker
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path('docs/DEVELOPMENT_PLAN.md')
          text = plan.read_text(encoding='utf-8')

          replacements = {
              '**Tracking:** Phase 1 complete; Phase 2A and Phase 2B accepted via #118/#137 and #138/#140; Phase 2C is the unique NEXT; expert-plan refinement #133; external CRM is future development only  ': '**Tracking:** Phase 1 complete; Phase 2A/2B/2C accepted via #118/#137, #138/#140 and #142/#143; Phase 2D issue #144 is the unique NEXT; expert-plan refinement #133; external CRM is future development only  ',
              'Exactly one implementation slice is active at a time. Phase 2C is the unique NEXT after\nthe accepted Phase 2B closeout; later Phase 2 slices remain blocked by the same linear rule.': 'Exactly one implementation slice is active at a time. Phase 2D issue #144 is the unique NEXT after\nthe accepted Phase 2C closeout; later Phase 2 slices remain blocked by the same linear rule.',
              '**Status:** ACCEPTED. Phase 1 is complete; Phase 2A and Phase 2B are accepted; Phase 2C is the unique next implementation slice.': '**Status:** ACCEPTED. Phase 1 is complete; Phase 2A, Phase 2B and Phase 2C are accepted; Phase 2D issue #144 is the unique next implementation slice.',
              '### Phase 2C — Client merge, assignment, grant-safe projections and modular Client Registry UI — NEXT': '### Phase 2C — Client merge, assignment, grant-safe projections and modular Client Registry UI — ACCEPTED',
              '| A5 | Feature-owned SPA route composition | **Open.** Current root router still owns direct feature imports/routes. | Mandatory first frontend architecture step in 2C before route-family growth. |': '| A5 | Feature-owned SPA route composition | **Accepted in Phase 2C.** Root app routing imports feature-owned public route APIs; direct feature-internal route composition is permanently rejected by positive/negative CI. | Preserve in later route-family growth. |',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new, 1)

          phase2d = '### Phase 2D — CQRS read models, global search and client-mail query contract'
          assert text.count(phase2d) == 1
          evidence = '''#### Phase 2C acceptance evidence\n\nPhase 2C was accepted through issue #142 / implementation PR #143 from exact proven source head\n`d3ad2e774a98ad5fed2565ba410ba9923062d170` and guarded squash merge\n`042d0dc72fa37e99f971d61d21544609a69c6e31`. The unchanged source head passed exactly 12/12\npermanent workflows with `behind_by=0`, reviews=0 and unresolved review threads=0. Accepted scope\nincludes deterministic one-way client merge, historical primary assignment semantics, application-owned\nmerge/reassignment, governed atomic D1 merge/history, grant-safe Client Registry projections, A5\nfeature-owned route composition, generated Client Registry contracts, modular Client Registry UI and\npermanent Phase 2C positive/negative/SQLite enforcement in both Quality and Repository Audit gates.\n`production_ready=false` remains intentional.\n\n'''
          text = text.replace(phase2d, evidence + phase2d + ' — NEXT', 1)

          marker = '## 19. Immediate Next Action'
          assert text.count(marker) == 1
          prefix = text.split(marker, 1)[0].rstrip()
          immediate = '''\n\n## 19. Immediate Next Action\n\nStart **Phase 2D — CQRS read models, global search and client-mail query contract** under issue #144\nfrom accepted Phase 2C `main` at `042d0dc72fa37e99f971d61d21544609a69c6e31`.\n\nExecute Phase 2D inward-first in this exact order:\n\n```text\nuse-cases-query independent application context\n  -> capability-owned query/read-model ports\n  -> stable read projections distinct from mutation aggregates\n  -> D1 read projections/indexes for supported predicates\n  -> authorization/live revocation before projection or provider fetch\n  -> bounded global metadata search\n  -> exact contact lookup via Phase 2B HMAC indexes only\n  -> provider-neutral client-mail search/body query contracts\n  -> deterministic fake cloud/Bridge query adapters\n  -> stable cursor/cost/query-plan evidence\n  -> generated public contracts + incremental Client -> Mail UI\n```\n\nNo Phase 2E+ implementation starts before Phase 2D is accepted and closed out. Fuzzy/prefix PII\nsearch remains prohibited without a separate accepted ADR. `production_ready=false` remains unchanged.\n'''
          plan.write_text(prefix + immediate, encoding='utf-8')

          arch = Path('docs/ARCHITECTURE.md')
          text = arch.read_text(encoding='utf-8')
          marker = '''Phase 2B accepts authoritative protected client-contact D1 persistence and a separate exact-lookup\nquery port. Exact lookup accepts tenant scope + contact kind + normalization version + versioned HMAC\ntoken only; D1 lookup adapters do not receive plaintext and do not decrypt/scan all contact rows.\n'''
          assert text.count(marker) == 1
          addition = marker + '''\nPhase 2C accepts deterministic one-way client merge and historical primary assignment semantics,\napplication-owned merge/reassignment sequencing, governed atomic D1 merge/history, and grant-safe\nClient Registry read projections. Assignment remains explicitly non-authorizing; source grants are\nremoved rather than transferred on merge; revoked access disappears before projection construction.\n'''
          text = text.replace(marker, addition, 1)

          marker = '''Accepted independent application ownership includes `use-cases-identity`,\n`use-cases-notifications` and `use-cases-clients`; shared `use-cases` compatibility re-exports do\nnot regain canonical ownership of those capabilities.\n'''
          assert text.count(marker) == 1
          addition = marker + '''\nPhase 2D adds `use-cases-query` as the independent cross-capability read/search application context;\nmutation aggregates remain owned by their existing capability use cases.\n'''
          text = text.replace(marker, addition, 1)

          marker = '''Frontend rules:\n\n- generated public API/event DTOs/enums are authoritative;\n'''
          assert text.count(marker) == 1
          replacement = '''Frontend rules:\n\n- feature routes are composed through feature-owned public route APIs; root app routing does not import feature-internal workspace components;\n- generated public API/event DTOs/enums are authoritative;\n'''
          text = text.replace(marker, replacement, 1)

          marker = '''- protected client-contact persistence and tenant-scoped exact-HMAC lookup positive/negative fixtures;\n- generation freshness/fencing;\n'''
          assert text.count(marker) == 1
          replacement = '''- protected client-contact persistence and tenant-scoped exact-HMAC lookup positive/negative fixtures;\n- Phase 2C client merge/assignment-as-non-ACL/grant-safe projection and feature-route positive/negative fixtures;\n- generation freshness/fencing;\n'''
          text = text.replace(marker, replacement, 1)
          arch.write_text(text, encoding='utf-8')
          PY

      - name: Validate bounded docs closeout
        run: |
          python scripts/generate-architecture-inventory.py --check
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md "
          grep -q 'Phase 2C .* ACCEPTED' docs/DEVELOPMENT_PLAN.md
          grep -q 'Phase 2D .* NEXT' docs/DEVELOPMENT_PLAN.md
          grep -q 'issue #144' docs/DEVELOPMENT_PLAN.md
          grep -q 'd3ad2e774a98ad5fed2565ba410ba9923062d170' docs/DEVELOPMENT_PLAN.md
          grep -q '042d0dc72fa37e99f971d61d21544609a69c6e31' docs/DEVELOPMENT_PLAN.md

      - name: Commit docs only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md
          git diff --cached --check
          git commit -m "Docs: accept Phase 2C and mark Phase 2D next"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
