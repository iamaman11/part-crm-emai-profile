name: AR-11 Temporary Cutover Convergence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ar11-temp-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  converge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ar11-release-capability-promotion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Converge pending bounded Rust cutovers idempotently
        run: |
          set -euo pipefail
          if ! grep -q 'Invocation::Promotion' tools/opsctl/src/lib.rs; then
            test -f scripts/ar11-promotion-cli-cutover.py
            python scripts/ar11-promotion-cli-cutover.py
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          compatibility = Path('tools/opsctl/src/release/compatibility.rs')
          text = compatibility.read_text()
          old = '''    for name in required_dimensions {\n        let dimension = evidence.dimensions.get(name).ok_or_else(|| {\n            ReleaseModelError::new(format!("missing compatibility dimension after parse: {name}"))\n        })?;\n        match dimension.decision {\n            CompatibilityDecision::Compatible => {}\n            CompatibilityDecision::Incompatible => {\n                blockers.push(format!("{}", blocker_code(name, false)));\n            }\n            CompatibilityDecision::Unknown => {\n                blockers.push(format!("{}", blocker_code(name, true)));\n            }\n        }\n    }\n'''
          new = '''    for name in &required_dimensions {\n        let dimension = evidence.dimensions.get(*name).ok_or_else(|| {\n            ReleaseModelError::new(format!("missing compatibility dimension after parse: {name}"))\n        })?;\n        match dimension.decision {\n            CompatibilityDecision::Compatible => {}\n            CompatibilityDecision::Incompatible => {\n                blockers.push(blocker_code(name, false).to_owned());\n            }\n            CompatibilityDecision::Unknown => {\n                blockers.push(blocker_code(name, true).to_owned());\n            }\n        }\n    }\n'''
          if old in text:
              compatibility.write_text(text.replace(old, new, 1))

          artifact = Path('tools/opsctl/src/release/artifact.rs')
          text = artifact.read_text()
          text = text.replace('use std::path::PathBuf;', 'use std::path::{Path, PathBuf};', 1)
          text = text.replace('fn manifest(root: &PathBuf)', 'fn manifest(root: &Path)', 1)
          artifact.write_text(text)

          model = Path('tools/opsctl/src/release/model.rs')
          text = model.read_text()
          text = text.replace(
              'const ALLOWED_COMPONENTS: [&str; 4] = [\n    "control_plane",\n    "secret_resolver",\n    "runtime_bundle",\n    "profile_bridge",\n];',
              'const ALLOWED_COMPONENTS: [&str; 5] = [\n    "control_plane",\n    "frontend",\n    "secret_resolver",\n    "runtime_bundle",\n    "profile_bridge",\n];',
              1,
          )
          model.write_text(text)

          integration = Path('tools/opsctl/tests/promotion_ar11.rs')
          text = integration.read_text()
          needle = '            "control_plane": component("control-plane-v1", "components/control-plane.tar", SHA_A, 10),\n'
          if '"frontend": component(' not in text:
              text = text.replace(
                  needle,
                  needle + '            "frontend": component("frontend-v1", "components/frontend.tar", SHA_A, 14),\n',
                  1,
              )
              inventory = '            {"path":"components/control-plane.tar","sha256":SHA_A,"size_bytes":10,"kind":"component"},\n'
              text = text.replace(
                  inventory,
                  inventory + '            {"path":"components/frontend.tar","sha256":SHA_A,"size_bytes":14,"kind":"component"},\n',
                  1,
              )
          integration.write_text(text)

          authority_path = Path('architecture/release-architecture-ar11.json')
          authority = json.loads(authority_path.read_text())
          closures = authority['deployment_closures']
          if not any(item['closure_id'] == 'rehearsal-core-v1' for item in closures):
              production_core = next(item for item in closures if item['closure_id'] == 'production-core-v1')
              rehearsal = json.loads(json.dumps(production_core))
              rehearsal['closure_id'] = 'rehearsal-core-v1'
              rehearsal['profile_id'] = 'rehearsal-core-v1'
              closures.insert(0, rehearsal)
              authority_path.write_text(json.dumps(authority, indent=2, ensure_ascii=False) + '\n')
          PY
          python scripts/generate-architecture-inventory.py --write
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          cargo clippy --fix --locked --manifest-path tools/opsctl/Cargo.toml --all-targets --allow-dirty --allow-staged -- -D warnings
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml
          python scripts/generate-architecture-inventory.py --check

      - name: Remove all temporary cutover authority including this workflow
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/workflows/ar11-bounded-rust-fix.yml \
            .github/workflows/ar11-promotion-cli-cutover.yml \
            .github/workflows/ar11-temp-convergence.yml \
            scripts/ar11-promotion-cli-cutover.py
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ar11-bounded-rust-fix.yml|.github/workflows/ar11-promotion-cli-cutover.yml|.github/workflows/ar11-temp-convergence.yml|scripts/ar11-promotion-cli-cutover.py|architecture/release-architecture-ar11.json|architecture/inventory.json|tools/opsctl/src/*.rs|tools/opsctl/src/release/*.rs|tools/opsctl/src/promotion/*.rs|tools/opsctl/tests/*.rs) ;;
              *) echo "unexpected convergence path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit only fully verified converged state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tools/opsctl architecture .github/workflows scripts/ar11-promotion-cli-cutover.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'AR-11: converge release promotion policy'
          git push origin HEAD:agent/ar11-release-capability-promotion
