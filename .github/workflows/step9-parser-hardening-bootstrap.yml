name: Step 9 Parser Hardening Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step9-final-hardening
  cancel-in-progress: false

jobs:
  harden-parser-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Remove unauthenticated allocation and add malformed-container proofs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          text, count = re.subn(
              r"let mut plaintext = Zeroizing::new\(Vec::with_capacity\(\n\s*usize::try_from\(metadata\.plaintext_bytes\(\)\)\n\s*\.map_err\(\|_\| EncryptedGenerationError::PlaintextTooLarge\)\?,\n\s*\)\);",
              "let mut plaintext = Zeroizing::new(Vec::new());",
              text,
              count=1,
          )
          if count == 0 and "let mut plaintext = Zeroizing::new(Vec::new());" not in text:
              raise SystemExit("authenticated-growth buffer: expected existing or replaceable accumulator")
          container.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          if "fn malformed_headers_and_trailing_bytes_fail_closed" not in text:
              anchor = "\n#[test]\nfn invalid_key_id_and_chunk_size_fail_closed()"
              proof = '''
#[test]
fn malformed_headers_and_trailing_bytes_fail_closed()
-> Result<(), Box<dyn std::error::Error>> {
    let plaintext = b"strict parser";
    let metadata = metadata("generation_01JSTEP9MALFORMED", 0x4c, plaintext)?;
    let sealed = seal_generation(&metadata, &key(0x5d)?, plaintext)?;

    let mut bad_magic = sealed.container().to_vec();
    bad_magic[0] ^= 0x01;
    assert!(matches!(
        open_generation(&bad_magic, &key(0x5d)?),
        Err(EncryptedGenerationError::InvalidContainer)
    ));

    let mut unsupported_version = sealed.container().to_vec();
    unsupported_version[12] = 0;
    unsupported_version[13] = 2;
    assert!(matches!(
        open_generation(&unsupported_version, &key(0x5d)?),
        Err(EncryptedGenerationError::UnsupportedVersion)
    ));

    let mut oversized_metadata = b"BPGC0001".to_vec();
    oversized_metadata.extend_from_slice(&4_097_u32.to_be_bytes());
    assert!(matches!(
        open_generation(&oversized_metadata, &key(0x5d)?),
        Err(EncryptedGenerationError::InvalidContainer)
    ));

    let mut trailing = sealed.into_container();
    trailing.push(0);
    assert!(matches!(
        open_generation(&trailing, &key(0x5d)?),
        Err(EncryptedGenerationError::InvalidContainer)
    ));
    Ok(())
}
'''
              if text.count(anchor) != 1:
                  raise SystemExit(f"malformed test anchor: expected one match, found {text.count(anchor)}")
              text = text.replace(anchor, proof + anchor, 1)
          tests.write_text(text, encoding="utf-8")

          docs = Path("docs/ENCRYPTED_CLOUD_GENERATIONS.md")
          text = docs.read_text(encoding="utf-8")
          marker = "Restore does not preallocate from unauthenticated plaintext-size metadata."
          if marker not in text:
              text = text.replace(
                  "A missing, duplicated, reordered, truncated or tampered final record fails closed.\nTrailing bytes after the final record are rejected.",
                  "A missing, duplicated, reordered, truncated or tampered final record fails closed.\nTrailing bytes after the final record are rejected. Restore does not preallocate\nfrom unauthenticated plaintext-size metadata; the bounded plaintext buffer grows\nonly after individual records authenticate successfully.",
              )
          docs.write_text(text, encoding="utf-8")
          PY

      - name: Verify parser hardening
        run: |
          cargo fmt --all
          cargo clippy --locked -p encrypted-generation-domain --all-targets -- -D warnings
          cargo test --locked -p encrypted-generation-domain

      - name: Remove temporary workflows and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/step9-*-bootstrap.yml
          git add crates/encrypted-generation-domain docs/ENCRYPTED_CLOUD_GENERATIONS.md Cargo.toml scripts/check-step9-encrypted-generation.py
          git commit -m "Repository Step 9: harden authenticated container parsing"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
