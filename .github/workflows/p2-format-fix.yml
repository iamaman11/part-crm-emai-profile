name: P2 Rust Formatting One Shot

on:
  push:
    branches:
      - cap-exec/p2-authorized-launch

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT_SHA: 758c1afc5ba44eea6336387f1b5c21424de74d12
      TARGET_BRANCH: cap-exec/p2-authorized-launch
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2

      - name: Verify one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"

      - name: Apply mechanical Rust hygiene
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/profile-bridge/src/shipping_network.rs")
          text = path.read_text(encoding="utf-8")
          old = "use std::path::{Path, PathBuf};"
          if text.count(old) != 1:
              raise SystemExit("expected shipping_network PathBuf import shape not found exactly once")
          path.write_text(text.replace(old, "use std::path::Path;"), encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          python - <<'PY'
          import subprocess
          expected = [
              "apps/profile-bridge/src/shipping_control_plane.rs",
              "apps/profile-bridge/src/shipping_network.rs",
              "apps/profile-bridge/src/windows_native.rs",
          ]
          actual = sorted(filter(None, subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()))
          if actual != expected:
              raise SystemExit(f"unexpected formatting change set: {actual}")
          PY
          git diff --check

      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p2-format-fix.yml
          git add apps/profile-bridge/src/shipping_control_plane.rs \
                  apps/profile-bridge/src/shipping_network.rs \
                  apps/profile-bridge/src/windows_native.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(p2): normalize shipping adapters"
          git push origin "HEAD:$TARGET_BRANCH"
