name: D1 TX-6 Isolated Target Observation

on:
  pull_request:
    paths:
      - '.github/workflows/d1-tx6-isolated-target-observation.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-tx6-isolated-target-observation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-tx6-isolated-target-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TX6_READ_ONLY_CANDIDATE_NAME: part-crm-d3a-bootstrap-proof
  TX6_READ_ONLY_CANDIDATE_ID: 713dd6f2-646b-46ad-93eb-103d2d0b63c4
  TX6_READ_ONLY_CANDIDATE_COMPONENT: catalog

jobs:
  contract:
    name: TX-6 isolated observation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove qualification adapter remains read-only and exact-target bounded
        run: |
          set -euo pipefail
          python scripts/d1-executor-plan.py self-test
          python - <<'PY'
          import os
          from pathlib import Path
          source = Path('.github/workflows/d1-tx6-isolated-target-observation.yml').read_text(encoding='utf-8')
          forbidden_effect_surfaces = (
              'secrets.' + 'CLOUDFLARE_API_TOKEN',
              'd1 migrations' + ' apply',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1 time-travel' + ' restore',
          )
          for forbidden in forbidden_effect_surfaces:
              assert forbidden not in source, f'read-only TX-6 observer contains forbidden effect surface: {forbidden}'
          assert os.environ['TX6_READ_ONLY_CANDIDATE_NAME'] in source
          assert os.environ['TX6_READ_ONLY_CANDIDATE_ID'] in source
          assert os.environ['TX6_READ_ONLY_CANDIDATE_COMPONENT'] == 'catalog'
          PY

  observe:
    name: TX-6 isolated target hosted observation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: staging
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Verify accepted-main read-only observation context
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$TX6_READ_ONLY_CANDIDATE_COMPONENT" = catalog
          test -n "$TX6_READ_ONLY_CANDIDATE_NAME"
          test -n "$TX6_READ_ONLY_CANDIDATE_ID"

      - name: Set up pinned Node for Wrangler read adapter
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Observe exact TX-6 candidate with read-only credential
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077

          raw="$RUNNER_TEMP/d1-tx6-isolated-target-observation"
          evidence="artifacts/d1-tx6-isolated-target-observation"
          lineage="$raw/catalog-lineage"
          mkdir -p "$raw" "$evidence" "$lineage"
          manifest="$raw/deploy-manifest.json"
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$manifest"

          account_id="$(jq -er '.control_plane.account_id // .account_id | select(type == "string" and length == 32)' "$manifest")"
          catalog_name="$(jq -er '.control_plane.d1_database_name // .d1_database_name | select(type == "string" and length > 0)' "$manifest")"
          test "$TX6_READ_ONLY_CANDIDATE_NAME" != "$catalog_name"

          env -u CLOUDFLARE_OBSERVE_API_TOKEN -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            > "$raw/d1-repository.json"

          python - "$raw/d1-repository.json" "$lineage" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          projection = json.load(open(sys.argv[1], encoding='utf-8'))
          output = Path(sys.argv[2])
          matches = [item for item in projection.get('components', []) if item.get('component_id') == 'catalog']
          if len(matches) != 1:
              raise SystemExit('typed Catalog projection missing/ambiguous')
          sources = matches[0].get('executable_migration_sources')
          if not isinstance(sources, list) or not sources:
              raise SystemExit('typed Catalog executable_migration_sources missing')
          for item in sources:
              name = item.get('migration_file')
              root = item.get('source_root')
              if root not in {'migrations/d1', 'migrations/d1-successor'} or not isinstance(name, str):
                  raise SystemExit('typed Catalog migration source escaped governed roots')
              source = Path(root) / name
              target = output / name
              if source.is_symlink() or not source.is_file() or target.exists():
                  raise SystemExit(f'invalid typed Catalog migration source: {source}')
              shutil.copyfile(source, target)
          PY

          verify_code="$(curl --silent --show-error --output "$raw/token-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and .result.status == "active"' "$raw/token-verify.json" >/dev/null

          inventory_code="$(curl --silent --show-error --output "$raw/d1-databases.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database?per_page=100")"
          test "$inventory_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result | type == "array")' "$raw/d1-databases.json" >/dev/null

          python - "$raw/d1-databases.json" "$account_id" "$catalog_name" "$TX6_READ_ONLY_CANDIDATE_NAME" "$TX6_READ_ONLY_CANDIDATE_ID" <<'PY'
          import json, sys
          path, account_id, catalog_name, target_name, target_id = sys.argv[1:]
          doc = json.load(open(path, encoding='utf-8'))
          matches = [item for item in doc.get('result', []) if item.get('name') == target_name and item.get('uuid') == target_id]
          if len(matches) != 1:
              raise SystemExit('exact TX-6 read-only candidate id/name pair missing or ambiguous in fresh staging inventory')
          if target_name == catalog_name:
              raise SystemExit('TX-6 candidate equals forbidden V2 staging Catalog reference')
          candidate = matches[0]
          if candidate.get('name') == 'part-crm-catalog-production':
              raise SystemExit('TX-6 candidate resolved to Production catalog')
          print(json.dumps({'account_id': account_id, 'candidate': candidate}, sort_keys=True))
          PY

          python - "$raw/wrangler.json" "$account_id" "$TX6_READ_ONLY_CANDIDATE_NAME" "$TX6_READ_ONLY_CANDIDATE_ID" "$lineage" <<'PY'
          import json, sys
          output, account_id, name, database_id, lineage = sys.argv[1:]
          value = {
              'name': 'tx6-read-only-observer',
              'compatibility_date': '2026-08-15',
              'account_id': account_id,
              'd1_databases': [{
                  'binding': 'TX6_REHEARSAL_DB',
                  'database_name': name,
                  'database_id': database_id,
                  'migrations_dir': lineage,
              }],
          }
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(value, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"

          npx --yes wrangler@4.94.0 d1 info "$TX6_READ_ONLY_CANDIDATE_NAME" \
            --config "$raw/wrangler.json" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/provider-identity.json"

          python - "$raw/provider-identity.json" "$TX6_READ_ONLY_CANDIDATE_NAME" "$TX6_READ_ONLY_CANDIDATE_ID" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          name, database_id = sys.argv[2:]
          def paired(item):
              if isinstance(item, dict):
                  direct_name = item.get('name') or item.get('database_name')
                  direct_id = item.get('uuid') or item.get('id') or item.get('database_id')
                  if direct_name == name and direct_id == database_id:
                      return True
                  return any(paired(v) for v in item.values())
              if isinstance(item, list):
                  return any(paired(v) for v in item)
              return False
          if not paired(value):
              raise SystemExit('provider identity does not preserve exact TX-6 candidate id/name pair')
          PY

          npx --yes wrangler@4.94.0 d1 execute "$TX6_READ_ONLY_CANDIDATE_NAME" --remote \
            --config "$raw/wrangler.json" \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations'" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/ledger-table.json"

          if python - "$raw/ledger-table.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          def contains(item):
              if isinstance(item, dict):
                  if item.get('name') == 'd1_migrations':
                      return True
                  return any(contains(v) for v in item.values())
              if isinstance(item, list):
                  return any(contains(v) for v in item)
              return False
          raise SystemExit(0 if contains(value) else 1)
          PY
          then
            npx --yes wrangler@4.94.0 d1 execute "$TX6_READ_ONLY_CANDIDATE_NAME" --remote \
              --config "$raw/wrangler.json" \
              --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
              --experimental-provision=false --experimental-auto-create=false \
              > "$raw/ledger.json"
          else
            printf '[{"results":[],"success":true}]\n' > "$raw/ledger.json"
          fi

          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger "$raw/ledger.json" \
            --output "$raw/ledger-names.json"

          npx --yes wrangler@4.94.0 d1 migrations list "$TX6_READ_ONLY_CANDIDATE_NAME" --remote \
            --config "$raw/wrangler.json" \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/wrangler-pending.txt"

          python - "$raw/wrangler-pending.txt" "$raw/wrangler-pending.json" <<'PY'
          import json, re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          matches = re.findall(r'\b[0-9]{4}_[a-z0-9_]+\.sql\b', text)
          if len(matches) != len(set(matches)):
              raise SystemExit(f'Wrangler pending-list output is ambiguous/duplicated: {matches}')
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump(matches, handle, sort_keys=False, indent=2)
              handle.write('\n')
          PY

          npx --yes wrangler@4.94.0 d1 time-travel info "$TX6_READ_ONLY_CANDIDATE_NAME" \
            --config "$raw/wrangler.json" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/time-travel.json"
          python -m json.tool "$raw/time-travel.json" >/dev/null

          observed_at_unix_seconds="$(date -u +%s)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          observation_source="github-actions://$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          python - \
            "$raw/d1-databases.json" \
            "$raw/ledger.json" \
            "$raw/ledger-names.json" \
            "$raw/wrangler-pending.json" \
            "$raw/provider-identity.json" \
            "$raw/time-travel.json" \
            "$evidence/observation.json" \
            "$SOURCE_SHA" "$account_id" "$catalog_name" \
            "$TX6_READ_ONLY_CANDIDATE_NAME" "$TX6_READ_ONLY_CANDIDATE_ID" \
            "$observed_at" "$observed_at_unix_seconds" "$observation_source" <<'PY'
          import hashlib, json, sys
          (
              inventory_path, ledger_path, ledger_names_path, pending_path,
              identity_path, time_travel_path, output_path, source_sha, account_id,
              catalog_name, target_name, target_id, observed_at,
              observed_at_unix_seconds, observation_source,
          ) = sys.argv[1:]
          inventory = json.load(open(inventory_path, encoding='utf-8'))
          ledger = json.load(open(ledger_path, encoding='utf-8'))
          remote_migrations = json.load(open(ledger_names_path, encoding='utf-8'))
          pending = json.load(open(pending_path, encoding='utf-8'))
          identity = json.load(open(identity_path, encoding='utf-8'))
          time_travel = json.load(open(time_travel_path, encoding='utf-8'))
          canonical_ledger = json.dumps(ledger, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          ledger_sha256 = hashlib.sha256(canonical_ledger.encode('utf-8')).hexdigest()
          provider_observation = {
              'schema_version': 1,
              'target': {
                  'environment': 'staging',
                  'account_id': account_id,
                  'database_name': target_name,
                  'database_id': target_id,
              },
              'observed_at_unix_seconds': int(observed_at_unix_seconds),
              'observation_source': observation_source,
              'remote_ledger_sha256': ledger_sha256,
              'remote_migrations': remote_migrations,
              'wrangler_pending_migrations': pending,
              'deployment_identity': None,
              'time_travel_bookmark_capable': True,
          }
          databases = inventory.get('result', [])
          document = {
              'schema_version': 2,
              'kind': 'D1_TX6_EXACT_CANDIDATE_OBSERVATION',
              'source_sha': source_sha,
              'environment': 'staging',
              'observed_at': observed_at,
              'account_id': account_id,
              'v2_catalog_database_name': catalog_name,
              'candidate': {
                  'database_name': target_name,
                  'database_id': target_id,
                  'component': 'catalog',
                  'is_v2_catalog_reference': target_name == catalog_name,
                  'inventory_match_count': sum(1 for item in databases if item.get('name') == target_name and item.get('uuid') == target_id),
              },
              'provider_observation_input': provider_observation,
              'provider_identity_observed': bool(identity),
              'time_travel_observation_present': bool(time_travel),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          if document['candidate']['inventory_match_count'] != 1 or document['candidate']['is_v2_catalog_reference']:
              raise SystemExit('TX-6 exact candidate lost isolated target identity')
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          SOURCE_SHA="$SOURCE_SHA" jq -e \
            '.schema_version == 2 and .kind == "D1_TX6_EXACT_CANDIDATE_OBSERVATION" and .source_sha == env.SOURCE_SHA and .environment == "staging" and .candidate.database_name == env.TX6_READ_ONLY_CANDIDATE_NAME and .candidate.database_id == env.TX6_READ_ONLY_CANDIDATE_ID and .candidate.is_v2_catalog_reference == false and .candidate.inventory_match_count == 1 and .provider_observation_input.target.database_name == env.TX6_READ_ONLY_CANDIDATE_NAME and .provider_observation_input.target.database_id == env.TX6_READ_ONLY_CANDIDATE_ID and .provider_observation_input.time_travel_bookmark_capable == true and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$evidence/observation.json" >/dev/null
          python -m json.tool "$evidence/observation.json" >/dev/null

      - name: Publish secret-free isolated-target observation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-tx6-isolated-target-observation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-tx6-isolated-target-observation/observation.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw provider observations from runner temp
        if: always()
        run: rm -rf "$RUNNER_TEMP/d1-tx6-isolated-target-observation"
