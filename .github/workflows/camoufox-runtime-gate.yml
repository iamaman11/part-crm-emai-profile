name: Camoufox Runtime Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: camoufox-runtime-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify Camoufox proof scope fail closed
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Checkout exact candidate source with history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify accepted-main or strictly allowlisted release-ops PR
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
            echo 'Accepted main always receives full real Camoufox/Windows proof.'
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = pull_request
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          test -s "$RUNNER_TEMP/changed-paths.txt"
          python - "$RUNNER_TEMP/changed-paths.txt" <<'PY'
          from pathlib import Path
          import sys

          safe = {
              '.github/workflows/release-set-promotion.yml',
              '.github/workflows/v2-staging-envelope-observation.yml',
              '.github/scripts/release-operational-ar11.mjs',
              '.github/scripts/ar8-d-secret-transport-successor.mjs',
              '.github/scripts/release-architecture-ar11.mjs',
              'architecture/release-architecture-ar11.json',
          }
          paths = [line.strip() for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if line.strip()]
          if not paths:
              raise SystemExit('changed path set is empty')
          unknown = sorted(set(paths) - safe)
          print('changed paths:')
          for path in paths:
              print(f'  {path}')
          if unknown:
              print('full runtime proof required; non-allowlisted paths:')
              for path in unknown:
                  print(f'  {path}')
              print('HEAVY=true')
          else:
              print('strict release-ops-only PR; heavy browser replay is deferred to accepted main')
              print('HEAVY=false')
          Path('/tmp/camoufox-heavy').write_text('true\n' if unknown else 'false\n', encoding='utf-8')
          PY
          echo "heavy=$(cat /tmp/camoufox-heavy)" >> "$GITHUB_OUTPUT"

  patched-candidate:
    name: Resolve patched Camoufox candidate (${{ matrix.target }})
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - name: Checkout exact project source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Resolve exact durable candidate identity
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          python3.12 -m py_compile scripts/check-camoufox-webgl-patch.py scripts/verify-camoufox-patched-candidate.py
          python3.12 scripts/check-camoufox-webgl-patch.py --self-test
          python3.12 scripts/verify-camoufox-patched-candidate.py --self-test
          python3.12 - "$TARGET" >> "$GITHUB_ENV" <<'PY'
          import json
          import pathlib
          import sys
          target = sys.argv[1]
          lock = json.loads(pathlib.Path('runtime/camouhost/camoufox-patch-lock.json').read_text(encoding='utf-8'))
          candidate = lock['candidates'][target]
          artifact_sha = candidate['artifact_sha256']
          build_source_commit = candidate['build_source_commit']
          print(f'ARTIFACT_SHA256={artifact_sha}')
          print(f'BUILD_SOURCE_COMMIT={build_source_commit}')
          print(f'RELEASE_ID=camoufox-v1-{target}-sha256-{artifact_sha}')
          print(f'ARCHIVE_ASSET=camoufox-{target}.x86_64.zip')
          print(f'PROVENANCE_ASSET=camoufox-{target}.provenance.json')
          PY

      - name: Resolve exact candidate from durable publication authority
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rm -rf artifacts/camoufox-candidate
          mkdir -p artifacts/camoufox-candidate
          gh release download "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" --dir artifacts/camoufox-candidate --pattern "$ARCHIVE_ASSET" --pattern "$PROVENANCE_ASSET"
          archive="artifacts/camoufox-candidate/${ARCHIVE_ASSET}"
          provenance="artifacts/camoufox-candidate/${PROVENANCE_ASSET}"
          test -f "$archive" && test -f "$provenance"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARTIFACT_SHA256"
          python3.12 scripts/verify-camoufox-patched-candidate.py --archive "$archive" --provenance "$provenance" --target "$TARGET" --build-source-commit "$BUILD_SOURCE_COMMIT"

      - name: Upload ephemeral candidate transport
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s0-camoufox-${{ matrix.target }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/camoufox-candidate
          if-no-files-found: error
          retention-days: 7

  real-runtime-linux:
    name: Real Camoufox cold-launch proof
    needs: [scope, patched-candidate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AR10_REAL_CAMOUFOX_HEADLESS: "false"
    steps:
      - name: Require successful fail-closed scope classification
        run: |
          set -euo pipefail
          test "${{ needs.scope.result }}" = success
          if [ "${{ needs.scope.outputs.heavy }}" = true ]; then
            test "${{ needs.patched-candidate.result }}" = success
          else
            test "${{ needs.scope.outputs.heavy }}" = false
          fi

      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Accept strictly release-ops-only PR without browser replay
        if: needs.scope.outputs.heavy == 'false'
        run: echo 'Camoufox runtime inputs are untouched; Governance/Release Architecture own this release-ops PR, and full physical/runtime proof will run again on accepted main.'

      - name: Require Python 3.12 and virtual display support
        if: needs.scope.outputs.heavy == 'true'
        run: |
          python3.12 --version
          command -v Xvfb

      - name: Start one managed X display
        if: needs.scope.outputs.heavy == 'true'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp -ac >"$RUNNER_TEMP/s0-xvfb.log" 2>&1 &
          xvfb_pid=$!
          echo "S0_XVFB_PID=$xvfb_pid" >> "$GITHUB_ENV"
          if ! S0_XVFB_PID="$xvfb_pid" python3.12 - <<'PY'
          import os, socket, time
          pid = int(os.environ['S0_XVFB_PID'])
          deadline = time.monotonic() + 20
          while time.monotonic() < deadline:
              try:
                  os.kill(pid, 0)
                  with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as client:
                      client.settimeout(0.2); client.connect('/tmp/.X11-unix/X99')
                  break
              except (FileNotFoundError, ConnectionError, OSError): time.sleep(0.1)
          else: raise SystemExit('managed X display did not accept connections within 20 seconds')
          PY
          then
            cat "$RUNNER_TEMP/s0-xvfb.log"; kill "$xvfb_pid" 2>/dev/null || true; exit 1
          fi
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Enforce CAP-01 production Bridge boundary
        if: needs.scope.outputs.heavy == 'true'
        run: |
          python3.12 -m py_compile scripts/check-cap01-profile-bridge-boundary.py
          python3.12 scripts/check-cap01-profile-bridge-boundary.py
          python3.12 scripts/check-cap01-profile-bridge-boundary.py --self-test

      - name: Install exact AR-10 Camoufox Python components
        if: needs.scope.outputs.heavy == 'true'
        run: |
          python3.12 -m pip install --disable-pip-version-check "git+https://github.com/daijro/camoufox.git@b68a4fb9400d950b2f3c2c030931deef6e203ba4#subdirectory=pythonlib" "browserforge==1.2.4" "playwright==1.60.0"
          python3.12 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('camoufox') == '0.5.6b1'
          assert importlib.metadata.version('browserforge') == '1.2.4'
          assert importlib.metadata.version('playwright') == '1.60.0'
          PY

      - name: Download exact patched Linux candidate
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: s0-camoufox-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/camoufox-candidate

      - name: Install verified candidate into ephemeral Camoufox CI cache
        if: needs.scope.outputs.heavy == 'true'
        run: |
          candidate_sha="$(python3.12 -c 'import json; print(json.load(open("artifacts/camoufox-candidate/camoufox-linux.provenance.json", encoding="utf-8"))["build_source_commit"])')"
          python3.12 -m py_compile scripts/install-camoufox-candidate-for-ci.py scripts/verify-camoufox-patched-candidate.py
          python3.12 scripts/install-camoufox-candidate-for-ci.py --archive artifacts/camoufox-candidate/camoufox-linux.x86_64.zip --provenance artifacts/camoufox-candidate/camoufox-linux.provenance.json --build-source-commit "$candidate_sha"
          python3.12 -m camoufox list --path

      - name: Compile AR-10/S0 runtime acceptance sources
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 -m py_compile runtime/camouhost/real.py scripts/diagnose-s0-webgl-parameters.py scripts/test-ar10-real-camoufox.py scripts/test-ar10-real-camoufox-cleanup.py scripts/test-s0-browser-visible-canvas.py scripts/test-s0-browser-visible-audio-fonts.py scripts/test-s0-portable-browser-state.py scripts/test-ar10-firefox-writer-locks.py scripts/check-ar10-runtime-cutover.py

      - name: Enforce AR-10 successor-runtime policy
        if: needs.scope.outputs.heavy == 'true'
        run: |
          python3.12 scripts/check-ar10-runtime-cutover.py
          python3.12 scripts/check-ar10-runtime-cutover.py --self-test

      - name: Prove Firefox writer-lock failure semantics
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/test-ar10-firefox-writer-locks.py

      - name: Prove post-launch failure cleanup and immediate relaunch
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/test-ar10-real-camoufox-cleanup.py --python /usr/bin/python3.12 --camouhost runtime/camouhost/real.py --runtime-lock runtime/camouhost/runtime-lock.json --headless false

      - name: Prove real Camoufox identity and persistent profile behavior
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/test-ar10-real-camoufox.py

      - name: Prove exact native WebGL arrays and browser-visible TypedArrays
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/diagnose-s0-webgl-parameters.py --camouhost runtime/camouhost/real.py --runtime-lock runtime/camouhost/runtime-lock.json --headless false

      - name: Prove browser-visible canvas portability on exact Camoufox
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/test-s0-browser-visible-canvas.py --python /usr/bin/python3.12 --camouhost runtime/camouhost/real.py --runtime-lock runtime/camouhost/runtime-lock.json --headless false

      - name: Prove browser-visible audio and font portability on exact Camoufox
        if: needs.scope.outputs.heavy == 'true'
        run: python3.12 scripts/test-s0-browser-visible-audio-fonts.py --python /usr/bin/python3.12 --camouhost runtime/camouhost/real.py --runtime-lock runtime/camouhost/runtime-lock.json --headless false

      - name: Prove Profile Bridge -> managed IPC -> real Camoufox chain
        if: needs.scope.outputs.heavy == 'true'
        env:
          AR10_REAL_CAMOUFOX: "1"
          AR10_PYTHON: /usr/bin/python3.12
          AR10_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          AR10_REAL_CAMOUFOX_HEADLESS: "false"
        run: cargo test --locked -p profile-bridge --test real_camoufox_runtime -- --nocapture

      - name: Prove authoritative P3 browser-state portability through managed Camoufox
        if: needs.scope.outputs.heavy == 'true'
        env:
          AR10_REAL_CAMOUFOX: "1"
          AR10_PYTHON: /usr/bin/python3.12
          AR10_RUNTIME_ROOT: ${{ github.workspace }}/runtime
          AR10_BROWSER_STATE_HEADLESS: "false"
        run: cargo test --locked -p profile-bridge --test portable_browser_state real_cookie_local_storage_and_indexed_db_survive_authoritative_p3_reopen -- --nocapture

      - name: Stop managed X display
        if: always() && needs.scope.outputs.heavy == 'true'
        run: |
          if [ -n "${S0_XVFB_PID:-}" ] && kill -0 "$S0_XVFB_PID" 2>/dev/null; then kill "$S0_XVFB_PID"; wait "$S0_XVFB_PID" || true; fi

  bridge-regression-windows:
    name: Profile Bridge Windows regression
    needs: [scope, patched-candidate]
    if: always()
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Require successful fail-closed scope classification
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success') { throw 'Camoufox scope classification failed' }
          if ('${{ needs.scope.outputs.heavy }}' -eq 'true' -and '${{ needs.patched-candidate.result }}' -ne 'success') { throw 'patched candidate resolution failed' }
          if ('${{ needs.scope.outputs.heavy }}' -ne 'true' -and '${{ needs.scope.outputs.heavy }}' -ne 'false') { throw 'invalid heavy classification' }

      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Accept strictly release-ops-only PR without Windows browser replay
        if: needs.scope.outputs.heavy == 'false'
        shell: pwsh
        run: Write-Host 'Camoufox/Bridge runtime inputs are untouched; full clean-host Windows proof will run on accepted main.'

      - name: Set up exact Windows dependency-lock Python
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Project exact Windows dependency lock candidate
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          python scripts/camouhost-windows-dependency-lock.py self-test
          $report = Join-Path $env:RUNNER_TEMP 'camouhost-windows-pip-report.json'
          $candidate = Join-Path $env:RUNNER_TEMP 'camouhost-windows-dependency-lock.json'
          python -m pip install --disable-pip-version-check --dry-run --ignore-installed --only-binary=:all: --report "$report" "camoufox==0.5.6b1" "browserforge==1.2.4" "playwright==1.60.0"
          python scripts/camouhost-windows-dependency-lock.py project --runtime-lock runtime/camouhost/runtime-lock.json --pip-report "$report" --output "$candidate"

      - name: Upload dependency lock candidate evidence
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s0-windows-dependency-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/camouhost-windows-dependency-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Download exact patched Windows candidate
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: s0-camoufox-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/camoufox-candidate

      - name: Materialize exact clean-host Windows runtime from verified candidate
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $buildPython = (Get-Command python).Source
          $candidateBuildSha = (Get-Content -Raw 'artifacts/camoufox-candidate/camoufox-windows.provenance.json' | ConvertFrom-Json).build_source_commit
          if ($candidateBuildSha -notmatch '^[0-9a-f]{40}$') { throw 'candidate build source commit is invalid' }
          python -m py_compile scripts/camouhost-runtime-build-windows.py scripts/verify-camoufox-patched-candidate.py
          python scripts/verify-camoufox-patched-candidate.py --self-test
          python scripts/camouhost-runtime-build-windows.py self-test
          python scripts/camouhost-runtime-build-windows.py build --runtime-lock runtime/camouhost/runtime-lock.json --patch-lock runtime/camouhost/camoufox-patch-lock.json --runtime-source runtime/camouhost/real.py --browser-candidate artifacts/camoufox-candidate/camoufox-windows.x86_64.zip --browser-provenance artifacts/camoufox-candidate/camoufox-windows.provenance.json --build-source-commit "$candidateBuildSha" --output "$runtimeRoot" --build-python "$buildPython"
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'python\python.exe') -PathType Leaf)) { throw 'embedded Python missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'browser\camoufox.exe') -PathType Leaf)) { throw 'packaged Camoufox missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'camouhost\browser-candidate-provenance.json') -PathType Leaf)) { throw 'browser candidate provenance missing' }

      - name: Compile runtime acceptance sources
        if: needs.scope.outputs.heavy == 'true'
        run: python -m py_compile runtime/camouhost/real.py scripts/diagnose-s0-speech-voices.py scripts/test-ar10-real-camoufox-cleanup.py scripts/test-s0-browser-visible-canvas.py scripts/test-s0-browser-visible-audio-fonts.py scripts/test-s0-portable-browser-state.py scripts/test-ar10-firefox-writer-locks.py scripts/check-ar10-runtime-cutover.py scripts/camouhost-runtime-build-windows.py scripts/camouhost-windows-dependency-lock.py scripts/verify-camoufox-patched-candidate.py

      - name: Prove Firefox writer-lock failure semantics
        if: needs.scope.outputs.heavy == 'true'
        run: python scripts/test-ar10-firefox-writer-locks.py

      - name: Prove packaged Windows post-launch failure cleanup and immediate relaunch
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          python scripts/test-ar10-real-camoufox-cleanup.py --python (Join-Path $runtimeRoot 'python\python.exe') --camouhost (Join-Path $runtimeRoot 'camouhost\real.py') --runtime-lock (Join-Path $runtimeRoot 'camouhost\runtime-lock.json') --headless false

      - name: Prove clean-host Windows Camoufox canvas portability
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          python scripts/test-s0-browser-visible-canvas.py --python (Join-Path $runtimeRoot 'python\python.exe') --camouhost (Join-Path $runtimeRoot 'camouhost\real.py') --runtime-lock (Join-Path $runtimeRoot 'camouhost\runtime-lock.json') --headless false

      - name: Prove clean-host Windows Camoufox audio and font portability
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          python scripts/test-s0-browser-visible-audio-fonts.py --python (Join-Path $runtimeRoot 'python\python.exe') --camouhost (Join-Path $runtimeRoot 'camouhost\real.py') --runtime-lock (Join-Path $runtimeRoot 'camouhost\runtime-lock.json') --headless false

      - name: Prove configured Windows speech voices reach a stable browser-visible snapshot
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          & (Join-Path $runtimeRoot 'python\python.exe') scripts/diagnose-s0-speech-voices.py --camouhost (Join-Path $runtimeRoot 'camouhost\real.py') --runtime-lock (Join-Path $runtimeRoot 'camouhost\runtime-lock.json') --headless false

      - name: Prove clean-host Windows authoritative P3 browser-state portability
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $env:AR10_REAL_CAMOUFOX = '1'
          $env:AR10_PYTHON = Join-Path $runtimeRoot 'python\python.exe'
          $env:AR10_RUNTIME_ROOT = $runtimeRoot
          $env:AR10_BROWSER_STATE_HEADLESS = 'false'
          cargo test --locked -p profile-bridge --test portable_browser_state real_cookie_local_storage_and_indexed_db_survive_authoritative_p3_reopen -- --nocapture

      - name: Test synthetic Profile Bridge failure and CLI contracts on Windows
        if: needs.scope.outputs.heavy == 'true'
        run: >-
          cargo test --locked -p profile-bridge --features synthetic-test-bin
          --bin profile-bridge-synthetic
          --test ipc_protocol_failure_matrix
          --test operator_flow_acceptance
          --test runtime_failure_matrix
          --test synthetic_operator_cli
