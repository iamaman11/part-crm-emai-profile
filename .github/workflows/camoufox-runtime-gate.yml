name: Camoufox Runtime Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # New revisions cancel stale work of this PR. Distinct accepted-main SHAs
  # retain independent proof identities and cannot cancel each other.
  group: camoufox-runtime-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify Camoufox proof scope fail closed
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Checkout exact candidate source with history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Classify accepted-main or mechanically proven runtime-unrelated PR
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
            # The full real Windows/Camoufox proof was already run on the PR
            # only when GitHub independently proves an exact-tree PR merge,
            # 18 successful PR workflows and completed real browser test steps.
            # Missing evidence always falls back to the complete main replay.
            python3.12 scripts/accepted-main-pr-reuse.py --self-test
            python3.12 scripts/accepted-main-pr-reuse.py --gate camoufox --github-output "$RUNNER_TEMP/accepted-pr-reuse.txt"
            if grep -qx 'reuse=true' "$RUNNER_TEMP/accepted-pr-reuse.txt"; then
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
              echo 'Exact main tree and PR browser proofs match: reuse certified.'
            else
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
              echo 'No exact verified PR proof: full main Camoufox replay required.'
            fi
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = pull_request
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          # --no-renames retains both sides of moves (including runtime -> docs);
          # -z preserves exact names, including whitespace and newlines.
          git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          test -s "$RUNNER_TEMP/changed-paths.txt"
          python3.12 -m py_compile scripts/classify-camoufox-runtime-scope.py
          python3.12 scripts/classify-camoufox-runtime-scope.py --self-test
          python3.12 scripts/classify-camoufox-runtime-scope.py \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --github-output "$RUNNER_TEMP/camoufox-classified.txt"
          if grep -qx 'heavy=true' "$RUNNER_TEMP/camoufox-classified.txt"; then
            echo 'heavy=true' >> "$GITHUB_OUTPUT"
          elif grep -qx 'heavy=false' "$RUNNER_TEMP/camoufox-classified.txt"; then
            # A filename-only LIGHT verdict is not sufficient. Require the
            # current protected main to own a prior FULL physical receipt for
            # the exact currently published runtime SHA. Missing/expired or
            # conflicting proof deterministically selects real Windows tests.
            if python3.12 scripts/accepted-main-pr-reuse.py --pr-camoufox-byte-proof; then
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
            else
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
              echo 'No published-byte physical receipt: execute complete Gate.'
            fi
          else
            echo 'Camoufox classifier produced no single fail-closed verdict' >&2
            exit 1
          fi

  real-runtime-linux:
    name: Rust Bridge contracts (browser-independent)
    needs: scope
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require successful scope classification
        run: test "${{ needs.scope.result }}" = success

      - name: Checkout exact candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Run existing Rust Bridge tests
        if: needs.scope.outputs.heavy == 'true'
        run: cargo test --locked -p profile-bridge --lib

  runtime-package-windows:
    # Keep the existing protected job context while combining both owners.
    name: Profile Bridge Windows regression
    # One runner keeps the exact packaged bytes local. The native Bridge proof
    # is last: its Firefox child may outlive the Rust test process.
    needs: scope
    # Keep one protected context: HEAVY uses Windows for both physical suites;
    # independently SHA-attested LIGHT only needs the Ubuntu scope guard.
    # Invalid/failed scope still runs the guard and must fail closed.
    if: always()
    runs-on: ${{ needs.scope.outputs.heavy == 'true' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Require successful scope classification
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success') { throw 'Camoufox scope classification failed' }
          if ('${{ needs.scope.outputs.heavy }}' -notin @('true','false')) { throw 'invalid Camoufox proof scope' }
          if ('${{ needs.scope.outputs.heavy }}' -eq 'false') { Write-Host 'Runtime-unrelated PR: exact scope classification is sufficient.' }

      - name: Checkout exact candidate
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        if: needs.scope.outputs.heavy == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up exact build Python
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Restore versioned Rust dependencies
        if: needs.scope.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: profile-bridge-ci-v1
          workspaces: |
            . -> target
          cache-on-failure: 'true'

      - name: Validate existing runtime owners
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          python -m py_compile runtime/camouhost/real.py runtime/camouhost/native_process.py scripts/camouhost-runtime-build-windows.py scripts/camouhost-runtime-package.py scripts/test-camouhost-native-process.py scripts/test-camouhost-native-ipc.py scripts/test-camouhost-execution-modes.py
          if ($LASTEXITCODE -ne 0) { throw 'runtime Python compile failed' }
          python scripts/test-camouhost-native-process.py
          if ($LASTEXITCODE -ne 0) { throw 'native Camoufox process boundary regression failed' }
          python scripts/test-camouhost-native-ipc.py
          if ($LASTEXITCODE -ne 0) { throw 'native Camouhost IPC regression failed' }
          python scripts/test-camouhost-execution-modes.py
          if ($LASTEXITCODE -ne 0) { throw 'Camouhost execution-mode regression failed' }
          python scripts/camouhost-runtime-build-windows.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'official runtime materializer self-test failed' }
          python scripts/camouhost-runtime-package.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'compressed runtime packager self-test failed' }

      - name: Materialize official browser and verified offline fpgen model
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The published component is the byte owner. Only missing/unfinished
          # components need a new build; the PR later hands those tested bytes
          # to accepted main without a second materializer.
          $identityPath = Join-Path $env:RUNNER_TEMP 'runtime-input-identity.json'
          python scripts/camouhost-runtime-package.py identity --output "$identityPath"
          if ($LASTEXITCODE -ne 0) { throw 'runtime source identity failed' }
          $identity = Get-Content -LiteralPath $identityPath -Raw | ConvertFrom-Json
          $releaseId = $identity.release_id
          if ($releaseId -notmatch '^runtime-bundle-v3-sha256-[0-9a-f]{64}$') { throw 'invalid runtime input release identity' }
          $probePath = Join-Path $env:RUNNER_TEMP 'runtime-release-probe.json'
          python scripts/github-release-publication.py probe --repository "$env:GITHUB_REPOSITORY" --release-id "$releaseId" --expected-asset runtime-bundle.tar.gz --expected-asset runtime-manifest.json --output "$probePath"
          if ($LASTEXITCODE -ne 0) { throw 'runtime release probe failed' }
          $probe = Get-Content -LiteralPath $probePath -Raw | ConvertFrom-Json
          if ($probe.release_id -cne $releaseId) { throw 'runtime release probe identity changed' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-release-id.txt') -Value $releaseId -NoNewline -Encoding ascii
          if ($probe.state -eq 'reuse') {
            $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
            $manifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
            if ((Test-Path -LiteralPath $archive) -or (Test-Path -LiteralPath $manifest)) { throw 'published runtime download destination is not clean' }
            gh release download "$releaseId" --repo "$env:GITHUB_REPOSITORY" --dir "$env:RUNNER_TEMP" --pattern runtime-bundle.tar.gz --pattern runtime-manifest.json
            if ($LASTEXITCODE -ne 0) { throw 'published runtime download failed' }
            $releasePath = Join-Path $env:RUNNER_TEMP 'runtime-release.json'
            gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseId" > $releasePath
            if ($LASTEXITCODE -ne 0) { throw 'runtime release receipt missing' }
            $release = Get-Content -LiteralPath $releasePath -Raw | ConvertFrom-Json
            if ($release.tag_name -cne $releaseId -or $release.draft -ne $false -or $release.prerelease -ne $false) { throw 'runtime release identity/publication flags changed' }
            $assets = @($release.assets)
            if ($assets.Count -ne 2) { throw 'runtime release asset inventory mismatch' }
            foreach ($name in @('runtime-bundle.tar.gz','runtime-manifest.json')) {
              $assetCandidates = @($assets | Where-Object { $_.name -ceq $name -and $_.state -ceq 'uploaded' })
              if ($assetCandidates.Count -ne 1 -or $assetCandidates[0].digest -notmatch '^sha256:[0-9a-f]{64}$') { throw "runtime release asset identity missing: $name" }
              $path = Join-Path $env:RUNNER_TEMP $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "runtime release asset missing: $name" }
              if ((Get-Item -LiteralPath $path).Length -ne $assetCandidates[0].size) { throw "runtime release size drift: $name" }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
              if ($assetCandidates[0].digest -cne "sha256:$actual") { throw "runtime release byte digest drift: $name" }
            }
            Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-acquisition.txt') -Value 'published' -NoNewline -Encoding ascii
            Write-Host "Reusing exact published runtime bytes: $releaseId"
            exit 0
          }
          if ($probe.state -notin @('absent','resume')) { throw 'unknown runtime component publication state' }
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $buildPython = (Get-Command python).Source
          python scripts/camouhost-runtime-build-windows.py build --runtime-lock runtime/camouhost/runtime-lock.json --runtime-source runtime/camouhost/real.py --output "$root" --build-python "$buildPython"
          if ($LASTEXITCODE -ne 0) { throw 'official Windows runtime build failed' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-acquisition.txt') -Value 'built' -NoNewline -Encoding ascii

      - name: Package exact compressed Release Set runtime input
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
          $manifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
          $acquisition = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-acquisition.txt') -Raw).Trim()
          if ($acquisition -eq 'built') {
            python scripts/camouhost-runtime-package.py package --runtime-root "$root" --archive "$archive" --manifest "$manifest"
            if ($LASTEXITCODE -ne 0) { throw 'runtime archive package failed' }
          } elseif ($acquisition -ne 'published') { throw 'unknown runtime acquisition source' }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'runtime archive or manifest missing' }
          if ((Get-Item $archive).Length -ge 2GB) { throw 'runtime compressed archive exceeds release asset limit' }
          python scripts/camouhost-runtime-package.py verify-manifest --manifest "$manifest" > $null
          if ($LASTEXITCODE -ne 0) { throw 'compressed runtime manifest invalid' }
          # Preserve an exact compressed-byte identity across local packaging,
          # extraction and both physical Rust proofs without remote transport.
          $archiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($archiveSha -notmatch '^[0-9a-f]{64}$') { throw 'runtime archive SHA-256 is invalid' }
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-bundle.sha256') -Value $archiveSha -NoNewline -Encoding ascii
          $manifestSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-manifest.sha256') -Value $manifestSha -NoNewline -Encoding ascii

      - name: Extract and verify exact official runtime
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
          $externalManifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $externalManifest -PathType Leaf)) {
            throw 'packaged official runtime archive or detached manifest is missing'
          }
          $expectedArchiveSha = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-bundle.sha256') -Raw).Trim()
          $actualArchiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualArchiveSha -cne $expectedArchiveSha) { throw 'runtime archive bytes changed after packaging' }
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-delivered-runtime'
          if (Test-Path -LiteralPath $root) { throw 'shipping extraction must use a clean directory' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          tar.exe -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'official runtime archive extraction failed' }
          $embedded = Join-Path $root 'runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $embedded -PathType Leaf)) { throw 'embedded runtime manifest missing' }
          if ((Get-FileHash -Algorithm SHA256 $embedded).Hash -ne (Get-FileHash -Algorithm SHA256 $externalManifest).Hash) {
            throw 'embedded runtime manifest differs from exact packaged manifest'
          }
          python scripts/camouhost-runtime-package.py verify-manifest --manifest $externalManifest > $null
          if ($LASTEXITCODE -ne 0) { throw 'exact runtime manifest verification failed' }
          & (Join-Path $root 'python/python.exe') -I -c "from camoufox.fpgen_model import is_pinned; assert is_pinned(), 'model not pinned'"
          if ($LASTEXITCODE -ne 0) { throw 'offline fpgen model pin failed' }

      - name: Prove official Firefox native restored tabs and POST safety on exact runtime
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          # POST replay is tested against the SAME clean-extracted archive
          # whose exact bytes the shipping reader and native Bridge will use.
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-delivered-runtime'
          $python = Join-Path $root 'python/python.exe'
          $log = Join-Path $env:RUNNER_TEMP 'native-sessionstore-restore.log'
          python scripts/test-ar10-real-camoufox-cleanup.py `
            --native-restore-only `
            --python "$python" `
            --camouhost "$(Join-Path $root 'camouhost/real.py')" `
            --runtime-lock "$(Join-Path $root 'camouhost/runtime-lock.json')" `
            --headless false 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'real native Firefox SessionStore / POST restore failed' }
          $text = Get-Content -Raw -LiteralPath $log
          if ($text -notmatch 'native_restore_proof stage=passed safe_get=PASS post_replay=0 user_post_after_admission=PASS' -or
              $text -notmatch 'AR10_NATIVE_FIREFOX_SESSIONSTORE=PHYSICAL_PASS') {
            throw 'REAL_NATIVE_FIREFOX_SESSIONSTORE_POST_PROOF_NOT_EXECUTED'
          }

      - name: Run physical shipping reader and native Bridge Open on exact packaged runtime
        if: needs.scope.outputs.heavy == 'true'
        # An orphaned Firefox must not strand a required PR proof for 90 min.
        timeout-minutes: 8
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
          $manifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf) -or
              -not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'exact packaged archive or manifest is missing'
          }
          # The preceding SessionStore/POST test executes embedded Python and
          # can rewrite imported .pyc caches. Bridge delivery must consume a
          # pristine copy of the SAME proven archive, never that mutable tree.
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-bridge-clean-runtime'
          if (Test-Path -LiteralPath $root) { throw 'Bridge runtime extraction must use a clean directory' }
          $expectedArchiveSha = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-bundle.sha256') -Raw).Trim()
          $actualArchiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualArchiveSha -cne $expectedArchiveSha) { throw 'physical runtime archive changed after SessionStore proof' }
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          tar.exe -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'clean Bridge runtime extraction failed' }
          if ((Get-FileHash -Algorithm SHA256 (Join-Path $root 'runtime-manifest.json')).Hash -ne (Get-FileHash -Algorithm SHA256 $manifest).Hash) {
            throw 'clean Bridge runtime embedded manifest mismatch'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $root 'python/python.exe') -PathType Leaf)) {
            throw 'clean Bridge runtime embedded Python missing'
          }
          $env:AR10_PACKAGED_RUNTIME_ARCHIVE = $archive
          $env:AR10_PACKAGED_RUNTIME_MANIFEST = $manifest
          $env:AR10_REAL_CAMOUFOX = '1'
          $env:AR10_PYTHON = Join-Path $root 'python/python.exe'
          $env:AR10_RUNTIME_ROOT = $root
          $env:AR10_REAL_CAMOUFOX_HEADLESS = 'false'
          $log = Join-Path $env:RUNNER_TEMP 'real-shipping-reader-and-native-open.log'
          # A detached Firefox grandchild can retain stdout and block a live
          # PowerShell Tee pipeline indefinitely; redirect with native cmd.
          $testCommand = 'cargo test --locked -p profile-bridge --test real_camoufox_runtime -- --skip published_windows_runtime_is_consumed_by_shipping_selector --test-threads=2 --show-output > "' + $log + '" 2>&1'
          & "$env:WINDIR\System32\cmd.exe" /d /s /c $testCommand
          $cargoExit = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $log -PathType Leaf)) { throw 'physical Rust test log is missing' }
          Get-Content -LiteralPath $log -Tail 40
          if ($cargoExit -ne 0) { throw "physical shipping and Bridge Rust tests failed: exit=$cargoExit" }
          $text = Get-Content -Raw -LiteralPath $log
          if ($text -notmatch 'running 2 tests' -or
              $text -notmatch 'test result: ok\. 2 passed; 0 failed; 0 ignored; 0 measured; 1 filtered out;' -or
              $text -notmatch '(?m)^test shipping_windows_runtime_archive_is_readable_by_production_delivery_reader \.\.\. ok\r?$' -or
              $text -notmatch '(?m)^test bridge_preflight_launches_real_camoufox_and_acquires_native_profile_lock \.\.\. ok\r?$' -or
              $text -notmatch 'REAL_SHIPPING_ARCHIVE_READER=PASS;FILES=[0-9]+;COMPRESSED_BYTES=[0-9]+' -or
              $text -notmatch 'AR10_NATIVE_OPEN_LOCK=PASS;elapsed_ms=[0-9]+') {
            throw 'REAL_SHIPPING_READER_OR_BRIDGE_NATIVE_OPEN_PHYSICAL_PROOF_NOT_EXECUTED'
          }

      - name: Bind exact physically tested runtime archive and manifest SHA
        if: needs.scope.outputs.heavy == 'true'
        id: custody
        shell: pwsh
        env:
          TESTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
          $manifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
          $origin = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-acquisition.txt') -Raw).Trim()
          $releaseId = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-release-id.txt') -Raw).Trim()
          $expectedArchiveSha = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-bundle.sha256') -Raw).Trim()
          $expectedManifestSha = (Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'runtime-manifest.sha256') -Raw).Trim()
          if ($origin -notin @('built','published') -or $env:TESTED_SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $releaseId -notmatch '^runtime-bundle-v3-sha256-[0-9a-f]{64}$') { throw 'runtime custody identity invalid' }
          $actualArchiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $actualManifestSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant()
          if ($actualArchiveSha -cne $expectedArchiveSha -or $actualManifestSha -cne $expectedManifestSha) { throw 'physically tested runtime bytes drifted' }
          $archiveSize = (Get-Item -LiteralPath $archive).Length
          $manifestSize = (Get-Item -LiteralPath $manifest).Length
          if ($archiveSize -le 0 -or $archiveSize -ge 2GB -or $manifestSize -le 0) { throw 'physically tested runtime asset size invalid' }
          @{
            schema_version = 1
            kind = 'CAMOUFOX_WINDOWS_PHYSICAL_RUNTIME_RECEIPT'
            source_commit_sha = $env:TESTED_SOURCE_SHA
            run_id = [UInt64]$env:GITHUB_RUN_ID
            run_attempt = [UInt64]$env:GITHUB_RUN_ATTEMPT
            release_id = $releaseId
            origin = $origin
            archive_sha256 = $actualArchiveSha
            archive_size_bytes = [UInt64]$archiveSize
            manifest_sha256 = $actualManifestSha
            manifest_size_bytes = [UInt64]$manifestSize
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'camoufox-runtime-proof.json') -Encoding utf8NoBOM
          "origin=$origin" >> $env:GITHUB_OUTPUT
          Write-Host "CAMOUFOX_PHYSICAL_RUNTIME_SHA256=$actualArchiveSha;RELEASE_ID=$releaseId;ORIGIN=$origin"

      - name: Upload exact PR-tested runtime archive only on publication miss
        if: needs.scope.outputs.heavy == 'true' && github.event_name == 'pull_request' && steps.custody.outputs.origin == 'built'
        id: runtime-archive-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: camoufox-runtime-bundle-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/runtime-bundle.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload exact PR-tested runtime manifest only on publication miss
        if: needs.scope.outputs.heavy == 'true' && github.event_name == 'pull_request' && steps.custody.outputs.origin == 'built'
        id: runtime-manifest-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: camoufox-runtime-manifest-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/runtime-manifest.json
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Verify physical PR runtime uploads match exact tested SHA
        if: needs.scope.outputs.heavy == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          ARCHIVE_UPLOAD_SHA: ${{ steps.runtime-archive-upload.outputs.artifact-digest }}
          MANIFEST_UPLOAD_SHA: ${{ steps.runtime-manifest-upload.outputs.artifact-digest }}
          ORIGIN: ${{ steps.custody.outputs.origin }}
        run: |
          $receipt = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'camoufox-runtime-proof.json') -Raw | ConvertFrom-Json
          if ($env:ORIGIN -eq 'built') {
            if ($env:ARCHIVE_UPLOAD_SHA -cne $receipt.archive_sha256 -or $env:MANIFEST_UPLOAD_SHA -cne $receipt.manifest_sha256) { throw 'uploaded runtime bytes differ from physically tested SHA' }
          } elseif ($env:ORIGIN -eq 'published') {
            if ($env:ARCHIVE_UPLOAD_SHA -or $env:MANIFEST_UPLOAD_SHA) { throw 'published runtime reuse unexpectedly uploaded duplicate archives' }
          } else { throw 'unknown physical runtime upload origin' }

      - name: Upload SHA-bound physical runtime proof receipt
        if: needs.scope.outputs.heavy == 'true' && github.event_name == 'pull_request'
        id: runtime-proof-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: camoufox-runtime-proof-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/camoufox-runtime-proof.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded physical runtime proof receipt digest
        if: needs.scope.outputs.heavy == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          RECEIPT_UPLOAD_SHA: ${{ steps.runtime-proof-upload.outputs.artifact-digest }}
        run: |
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:RUNNER_TEMP 'camoufox-runtime-proof.json')).Hash.ToLowerInvariant()
          if ($env:RECEIPT_UPLOAD_SHA -cne $actual) { throw 'uploaded physical runtime proof receipt digest mismatch' }

  camoufox-required-proof:
    # Branch protection retains the canonical cold-launch status name. The
    # single Windows job performs every physical proof on one packaged runtime.
    name: Real Camoufox cold-launch proof
    needs: [scope, runtime-package-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact official Camoufox and Bridge Windows proof
        run: |
          test "${{ needs.scope.result }}" = success
          test "${{ needs.runtime-package-windows.result }}" = success

