name: Camoufox Runtime Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: camoufox-runtime-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-runtime-linux:
    name: Real Camoufox cold-launch proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Require Python 3.12 and virtual display support
        run: |
          python3.12 --version
          command -v Xvfb

      - name: Install exact AR-10 Camoufox Python components
        run: |
          python3.12 -m pip install --disable-pip-version-check \
            "git+https://github.com/daijro/camoufox.git@cd83f7fd2fdf631dfde0c7eb53bd3d30f102ec4a#subdirectory=pythonlib" \
            "browserforge==1.2.4" \
            "playwright==1.60.0"
          python3.12 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('camoufox') == '0.5.5'
          assert importlib.metadata.version('browserforge') == '1.2.4'
          assert importlib.metadata.version('playwright') == '1.60.0'
          PY

      - name: Fetch exact Camoufox browser release
        run: |
          python3.12 -m camoufox set official/stable/152.0.4-beta.28
          python3.12 -m camoufox fetch
          python3.12 -m camoufox active | grep -F '152.0.4-beta.28'

      - name: Compile AR-10 runtime sources
        run: python3.12 -m py_compile runtime/camouhost/real.py scripts/test-ar10-real-camoufox.py scripts/check-ar10-runtime-cutover.py scripts/python-estate-ar6.py

      - name: Enforce AR-10 successor-runtime policy
        run: |
          python3.12 scripts/python-estate-ar6.py --check
          python3.12 scripts/check-ar10-runtime-cutover.py

      - name: Prove real Camoufox identity and persistent profile behavior
        run: python3.12 scripts/test-ar10-real-camoufox.py

      - name: Prove Profile Bridge -> managed IPC -> real Camoufox chain
        env:
          AR10_REAL_CAMOUFOX: "1"
          AR10_PYTHON: /usr/bin/python3.12
          AR10_RUNTIME_ROOT: ${{ github.workspace }}/runtime
        run: cargo test --locked -p profile-bridge --test real_camoufox_runtime -- --nocapture

      - name: Enforce parity-gated AR-10 closeout policy
        run: python3.12 scripts/check-ar10-runtime-cutover.py --closeout

  bridge-regression-windows:
    name: Profile Bridge Windows regression
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Compile real Camouhost source without installing browser runtime
        run: python -m py_compile runtime/camouhost/real.py scripts/check-ar10-runtime-cutover.py scripts/python-estate-ar6.py

      - name: Test and build Profile Bridge
        run: |
          cargo test --locked -p browser-execution-domain -p runtime-bundle-domain -p profile-bridge
          cargo build --locked --release -p profile-bridge
