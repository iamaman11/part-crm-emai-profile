name: Camoufox Runtime Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: camoufox-runtime-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-runtime-linux:
    name: Real Camoufox cold-launch proof
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Require Python 3.12 and virtual display support
        run: |
          python3.12 --version
          command -v Xvfb

      - name: Enforce CAP-01 production Bridge boundary
        run: |
          python3.12 -m py_compile scripts/check-cap01-profile-bridge-boundary.py
          python3.12 scripts/check-cap01-profile-bridge-boundary.py
          python3.12 scripts/check-cap01-profile-bridge-boundary.py --self-test

      - name: Install exact AR-10 Camoufox Python components
        run: |
          python3.12 -m pip install --disable-pip-version-check \
            "git+https://github.com/daijro/camoufox.git@cd83f7fd2fdf631dfde0c7eb53bd3d30f102ec4a#subdirectory=pythonlib" \
            "browserforge==1.2.4" \
            "playwright==1.60.0"
          python3.12 - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('camoufox') == '0.5.5'
          assert importlib.metadata.version('browserforge') == '1.2.4'
          assert importlib.metadata.version('playwright') == '1.60.0'
          PY

      - name: Fetch exact Camoufox browser release
        run: |
          python3.12 -m camoufox fetch official/stable/152.0.4-beta.28
          python3.12 -m camoufox active | grep -F '152.0.4-beta.28'

      - name: Compile AR-10/S0 runtime acceptance sources
        run: python3.12 -m py_compile runtime/camouhost/real.py scripts/test-ar10-real-camoufox.py scripts/test-s0-browser-visible-canvas.py scripts/test-s0-browser-visible-audio-fonts.py scripts/test-ar10-firefox-writer-locks.py scripts/check-ar10-runtime-cutover.py

      - name: Enforce AR-10 successor-runtime policy
        run: |
          python3.12 scripts/check-ar10-runtime-cutover.py
          python3.12 scripts/check-ar10-runtime-cutover.py --self-test

      - name: Prove Firefox writer-lock failure semantics
        run: python3.12 scripts/test-ar10-firefox-writer-locks.py

      - name: Prove real Camoufox identity and persistent profile behavior
        run: python3.12 scripts/test-ar10-real-camoufox.py

      - name: Prove browser-visible canvas portability on exact Camoufox
        run: |
          python3.12 scripts/test-s0-browser-visible-canvas.py \
            --python /usr/bin/python3.12 \
            --camouhost runtime/camouhost/real.py \
            --runtime-lock runtime/camouhost/runtime-lock.json \
            --headless virtual

      - name: Prove browser-visible audio and font portability on exact Camoufox
        run: |
          python3.12 scripts/test-s0-browser-visible-audio-fonts.py \
            --python /usr/bin/python3.12 \
            --camouhost runtime/camouhost/real.py \
            --runtime-lock runtime/camouhost/runtime-lock.json \
            --headless virtual

      - name: Prove Profile Bridge -> managed IPC -> real Camoufox chain
        env:
          AR10_REAL_CAMOUFOX: "1"
          AR10_PYTHON: /usr/bin/python3.12
          AR10_RUNTIME_ROOT: ${{ github.workspace }}/runtime
        run: cargo test --locked -p profile-bridge --test real_camoufox_runtime -- --nocapture

      - name: Enforce parity-gated AR-10 closeout policy
        run: python3.12 scripts/check-ar10-runtime-cutover.py --closeout

  bridge-regression-windows:
    name: Profile Bridge Windows regression
    runs-on: windows-2025
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up exact Windows dependency-lock Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Project exact Windows dependency lock candidate
        shell: pwsh
        run: |
          python scripts/camouhost-windows-dependency-lock.py self-test
          $report = Join-Path $env:RUNNER_TEMP 'camouhost-windows-pip-report.json'
          $candidate = Join-Path $env:RUNNER_TEMP 'camouhost-windows-dependency-lock.json'
          python -m pip install --disable-pip-version-check --dry-run --ignore-installed --only-binary=:all: --report "$report" `
            "camoufox==0.5.5" `
            "browserforge==1.2.4" `
            "playwright==1.60.0"
          python scripts/camouhost-windows-dependency-lock.py project `
            --runtime-lock runtime/camouhost/runtime-lock.json `
            --pip-report "$report" `
            --output "$candidate"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'camouhost-windows-dependency-lock.json'; v=json.loads(p.read_text(encoding='utf-8')); assert v['kind']=='CAMOUHOST_WINDOWS_PYTHON_DEPENDENCY_LOCK_CANDIDATE'; assert v['python_version']=='3.12.10'; assert v['architecture']=='x86_64'; assert v['packages']"

      - name: Upload dependency lock candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s0-windows-dependency-lock-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/camouhost-windows-dependency-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Materialize exact clean-host Windows runtime
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $buildPython = (Get-Command python).Source
          python scripts/camouhost-runtime-build-windows.py self-test
          python scripts/camouhost-runtime-build-windows.py build `
            --runtime-lock runtime/camouhost/runtime-lock.json `
            --runtime-source runtime/camouhost/real.py `
            --output "$runtimeRoot" `
            --build-python "$buildPython"
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'python\python.exe') -PathType Leaf)) { throw 'embedded Python missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'browser\camoufox.exe') -PathType Leaf)) { throw 'packaged Camoufox missing' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtimeRoot 'camouhost\resolved-runtime.json') -PathType Leaf)) { throw 'resolved runtime evidence missing' }

      - name: Compile runtime acceptance sources
        run: python -m py_compile runtime/camouhost/real.py scripts/test-s0-browser-visible-canvas.py scripts/test-s0-browser-visible-audio-fonts.py scripts/test-ar10-firefox-writer-locks.py scripts/check-ar10-runtime-cutover.py scripts/camouhost-runtime-build-windows.py scripts/camouhost-windows-dependency-lock.py

      - name: Prove Firefox writer-lock failure semantics
        run: python scripts/test-ar10-firefox-writer-locks.py

      - name: Prove clean-host Windows Camoufox canvas portability
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $runtimePython = Join-Path $runtimeRoot 'python\python.exe'
          $camouhost = Join-Path $runtimeRoot 'camouhost\real.py'
          $runtimeLock = Join-Path $runtimeRoot 'camouhost\runtime-lock.json'
          python scripts/test-s0-browser-visible-canvas.py `
            --python "$runtimePython" `
            --camouhost "$camouhost" `
            --runtime-lock "$runtimeLock" `
            --headless false

      - name: Prove clean-host Windows Camoufox audio and font portability
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $runtimePython = Join-Path $runtimeRoot 'python\python.exe'
          $camouhost = Join-Path $runtimeRoot 'camouhost\real.py'
          $runtimeLock = Join-Path $runtimeRoot 'camouhost\runtime-lock.json'
          python scripts/test-s0-browser-visible-audio-fonts.py `
            --python "$runtimePython" `
            --camouhost "$camouhost" `
            --runtime-lock "$runtimeLock" `
            --headless false

      - name: Test browser/runtime domain contracts on Windows
        run: cargo test --locked -p browser-execution-domain -p runtime-bundle-domain

      - name: Test Profile Bridge on Windows
        run: cargo test --locked -p profile-bridge --features synthetic-test-bin

      - name: Build release Profile Bridge on Windows
        run: cargo build --locked --release -p profile-bridge
