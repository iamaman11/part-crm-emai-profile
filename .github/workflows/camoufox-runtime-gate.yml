name: Camoufox Runtime Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  # A stale queued proof for an earlier PR head must not block exact-head validation.
  group: camoufox-runtime-gate-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify Camoufox proof scope fail closed
    runs-on: ubuntu-24.04
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - name: Checkout exact candidate source with history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Classify accepted-main or mechanically proven runtime-unrelated PR
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
            # The full real Windows/Camoufox proof was already run on the PR
            # only when GitHub independently proves an exact-tree squash merge,
            # 18 successful PR workflows and completed real browser test steps.
            # Missing evidence always falls back to the complete main replay.
            python3.12 scripts/accepted-main-pr-reuse.py --self-test
            python3.12 scripts/accepted-main-pr-reuse.py --gate camoufox --github-output "$RUNNER_TEMP/accepted-pr-reuse.txt"
            if grep -qx 'reuse=true' "$RUNNER_TEMP/accepted-pr-reuse.txt"; then
              echo 'heavy=false' >> "$GITHUB_OUTPUT"
              echo 'Exact main tree and PR browser proofs match: reuse certified.'
            else
              echo 'heavy=true' >> "$GITHUB_OUTPUT"
              echo 'No exact verified PR proof: full main Camoufox replay required.'
            fi
            exit 0
          fi
          test "$GITHUB_EVENT_NAME" = pull_request
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$BASE_SHA^{commit}"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          test -s "$RUNNER_TEMP/changed-paths.txt"
          python3.12 -m py_compile scripts/classify-camoufox-runtime-scope.py
          python3.12 scripts/classify-camoufox-runtime-scope.py --self-test
          python3.12 scripts/classify-camoufox-runtime-scope.py \
            --paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --github-output "$GITHUB_OUTPUT"

  real-runtime-linux:
    name: Rust Bridge contracts (browser-independent)
    needs: scope
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require successful scope classification
        run: test "${{ needs.scope.result }}" = success

      - name: Checkout exact candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Run existing Rust Bridge tests
        if: needs.scope.outputs.heavy == 'true'
        run: cargo test --locked -p profile-bridge --lib

  runtime-package-windows:
    name: Build and verify official Windows Camoufox runtime
    needs: scope
    if: needs.scope.outputs.heavy == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Require successful scope classification
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success' -or '${{ needs.scope.outputs.heavy }}' -ne 'true') { throw 'Camoufox scope classification failed' }

      - name: Checkout exact candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up exact build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Validate existing runtime owners
        shell: pwsh
        run: |
          python -m py_compile runtime/camouhost/real.py runtime/camouhost/native_process.py scripts/camouhost-runtime-build-windows.py scripts/camouhost-runtime-package.py scripts/test-camouhost-native-process.py scripts/test-camouhost-native-ipc.py scripts/test-camouhost-execution-modes.py
          if ($LASTEXITCODE -ne 0) { throw 'runtime Python compile failed' }
          python scripts/test-camouhost-native-process.py
          if ($LASTEXITCODE -ne 0) { throw 'native Camoufox process boundary regression failed' }
          python scripts/test-camouhost-native-ipc.py
          if ($LASTEXITCODE -ne 0) { throw 'native Camouhost IPC regression failed' }
          python scripts/test-camouhost-execution-modes.py
          if ($LASTEXITCODE -ne 0) { throw 'Camouhost execution-mode regression failed' }
          python scripts/camouhost-runtime-build-windows.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'official runtime materializer self-test failed' }
          python scripts/camouhost-runtime-package.py self-test
          if ($LASTEXITCODE -ne 0) { throw 'compressed runtime packager self-test failed' }

      - name: Materialize official browser and verified offline fpgen model
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $buildPython = (Get-Command python).Source
          python scripts/camouhost-runtime-build-windows.py build --runtime-lock runtime/camouhost/runtime-lock.json --runtime-source runtime/camouhost/real.py --output "$root" --build-python "$buildPython"
          if ($LASTEXITCODE -ne 0) { throw 'official Windows runtime build failed' }
          & (Join-Path $root 'python/python.exe') -I -c "from camoufox.fpgen_model import is_pinned; assert is_pinned(), 'model not pinned'"
          if ($LASTEXITCODE -ne 0) { throw 'offline fpgen model pin failed' }

      - name: Prove official Firefox native restored tabs and POST safety on exact runtime
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $python = Join-Path $root 'python/python.exe'
          $log = Join-Path $env:RUNNER_TEMP 'native-sessionstore-restore.log'
          python scripts/test-ar10-real-camoufox-cleanup.py `
            --native-restore-only `
            --python "$python" `
            --camouhost "$(Join-Path $root 'camouhost/real.py')" `
            --runtime-lock "$(Join-Path $root 'camouhost/runtime-lock.json')" `
            --headless false 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'real native Firefox SessionStore / POST restore failed' }
          $text = Get-Content -Raw -LiteralPath $log
          if ($text -notmatch 'native_restore_proof stage=passed safe_get=PASS post_replay=0 user_post_after_admission=PASS' -or
              $text -notmatch 'AR10_NATIVE_FIREFOX_SESSIONSTORE=PHYSICAL_PASS') {
            throw 'REAL_NATIVE_FIREFOX_SESSIONSTORE_POST_PROOF_NOT_EXECUTED'
          }

      - name: Package exact compressed Release Set runtime input
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $archive = Join-Path $env:RUNNER_TEMP 'runtime-bundle.tar.gz'
          $manifest = Join-Path $env:RUNNER_TEMP 'runtime-manifest.json'
          python scripts/camouhost-runtime-package.py package --runtime-root "$root" --archive "$archive" --manifest "$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'runtime archive package failed' }
          if ((Get-Item $archive).Length -ge 2GB) { throw 'runtime compressed archive exceeds release asset limit' }
          python scripts/camouhost-runtime-package.py verify-manifest --manifest "$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'compressed runtime manifest invalid' }

      - name: Upload exact-head official runtime for downstream Windows proofs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: official-158-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/runtime-bundle.tar.gz
            ${{ runner.temp }}/runtime-manifest.json
          if-no-files-found: error
          retention-days: 7

  shipping-archive-reader-windows:
    name: Rust shipping reader verifies exact compressed Windows runtime
    needs: [scope, runtime-package-windows]
    if: needs.scope.outputs.heavy == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Require exact runtime package
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success' -or '${{ needs.runtime-package-windows.result }}' -ne 'success') { throw 'exact Windows runtime package is not available' }

      - name: Checkout exact candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Restore versioned Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: profile-bridge-ci-v1
          workspaces: |
            . -> target
          cache-on-failure: 'true'

      - name: Download exact official runtime artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: official-158-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/camouhost-runtime-artifact

      - name: Run Windows Bridge library tests and production archive reader
        shell: pwsh
        run: |
          cargo test --locked -p profile-bridge --lib
          if ($LASTEXITCODE -ne 0) { throw 'Windows Bridge library tests failed' }
          $archive = Join-Path $env:RUNNER_TEMP 'camouhost-runtime-artifact/runtime-bundle.tar.gz'
          $manifest = Join-Path $env:RUNNER_TEMP 'camouhost-runtime-artifact/runtime-manifest.json'
          $env:AR10_PACKAGED_RUNTIME_ARCHIVE = $archive
          $env:AR10_PACKAGED_RUNTIME_MANIFEST = $manifest
          $log = Join-Path $env:RUNNER_TEMP 'shipping-runtime-archive-reader.log'
          cargo test --locked -p profile-bridge --test real_camoufox_runtime shipping_windows_runtime_archive_is_readable_by_production_delivery_reader -- --exact --nocapture 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'production compressed runtime archive reader failed' }
          $text = Get-Content -Raw -LiteralPath $log
          if ($text -notmatch 'REAL_SHIPPING_ARCHIVE_READER=PASS;FILES=[0-9]+;COMPRESSED_BYTES=[0-9]+' -or
              $text -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored; 0 measured; [0-9]+ filtered out;') {
            throw 'REAL_SHIPPING_ARCHIVE_READER_NOT_EXECUTED_OR_NOT_PASSED'
          }

  bridge-regression-windows:
    name: Profile Bridge Windows regression
    needs: [scope, runtime-package-windows, shipping-archive-reader-windows]
    if: always()
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Require successful prerequisites
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success') { throw 'Camoufox scope classification failed' }
          if ('${{ needs.scope.outputs.heavy }}' -notin @('true','false')) { throw 'invalid Camoufox proof scope' }
          if ('${{ needs.scope.outputs.heavy }}' -eq 'true') {
            if ('${{ needs.runtime-package-windows.result }}' -ne 'success') { throw 'official runtime package failed' }
            if ('${{ needs.shipping-archive-reader-windows.result }}' -ne 'success') { throw 'production runtime archive reader failed' }
          } else {
            Write-Host 'Runtime-unrelated PR: exact scope classification is sufficient.'
          }

      - name: Checkout exact candidate
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        if: needs.scope.outputs.heavy == 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Restore versioned Rust dependencies
        if: needs.scope.outputs.heavy == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: profile-bridge-ci-v1
          workspaces: |
            . -> target
          cache-on-failure: 'true'

      - name: Download exact official runtime artifact
        if: needs.scope.outputs.heavy == 'true'
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: official-158-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/camouhost-runtime-artifact

      - name: Extract and verify exact official runtime
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'camouhost-runtime-artifact'
          $archive = Join-Path $artifact 'runtime-bundle.tar.gz'
          $externalManifest = Join-Path $artifact 'runtime-manifest.json'
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          tar.exe -xzf $archive -C $root
          if ($LASTEXITCODE -ne 0) { throw 'official runtime archive extraction failed' }
          $embedded = Join-Path $root 'runtime-manifest.json'
          if (-not (Test-Path -LiteralPath $embedded -PathType Leaf)) { throw 'embedded runtime manifest missing' }
          if ((Get-FileHash -Algorithm SHA256 $embedded).Hash -ne (Get-FileHash -Algorithm SHA256 $externalManifest).Hash) {
            throw 'embedded runtime manifest differs from exact packaged manifest'
          }
          python scripts/camouhost-runtime-package.py verify-manifest --manifest $externalManifest
          if ($LASTEXITCODE -ne 0) { throw 'exact runtime manifest verification failed' }

      - name: Run official Camoufox Playwright user Open/Close through production Bridge crates
        if: needs.scope.outputs.heavy == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $env:AR10_REAL_CAMOUFOX = '1'
          $env:AR10_PYTHON = Join-Path $root 'python/python.exe'
          $env:AR10_RUNTIME_ROOT = $root
          $env:AR10_REAL_CAMOUFOX_HEADLESS = 'false'
          $log = Join-Path $env:RUNNER_TEMP 'real-camoufox-open-close.log'
          cargo test --locked -p profile-bridge --test real_camoufox_runtime bridge_preflight_launches_real_camoufox_through_official_playwright_without_page_inspection -- --exact --nocapture 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { throw 'official Camoufox Playwright Bridge integration failed' }
          $text = Get-Content -Raw -LiteralPath $log
          if ($text -notmatch 'AR10_COLD_CYCLE_COMPLETED=PASS;ordinal=3') {
            throw 'REAL_CAMOUFOX_THREE_COLD_OPEN_CLOSE_CYCLES_NOT_CONFIRMED'
          }

  camoufox-required-proof:
    # Branch protection retains the canonical cold-launch check name. The Windows
    # package, archive-reader and user Open/Close jobs jointly own the real proof.
    name: Real Camoufox cold-launch proof
    needs: [scope, runtime-package-windows, shipping-archive-reader-windows, bridge-regression-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require exact official Camoufox and Bridge Windows proof
        run: |
          test "${{ needs.scope.result }}" = success
          if [ "${{ needs.scope.outputs.heavy }}" = "true" ]; then
            test "${{ needs.runtime-package-windows.result }}" = success
            test "${{ needs.shipping-archive-reader-windows.result }}" = success
          fi
          test "${{ needs.bridge-regression-windows.result }}" = success

  camoufox-required-proof:
    # Branch protection retains the canonical cold-launch check name. The single
    # physical Windows runtime job above owns all real Camoufox/Bridge tests.
    name: Real Camoufox cold-launch proof
    needs: bridge-regression-windows
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require real official Camoufox and Bridge Windows proof
        run: test "${{ needs.bridge-regression-windows.result }}" = success
