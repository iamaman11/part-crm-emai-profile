name: R7 Provenance Finalize Temporary

on:
  push:
    branches:
      - audit/r7-accepted-provenance
    paths:
      - .github/workflows/r7-provenance-finalize.yml

permissions:
  contents: write

jobs:
  finalize-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: audit/r7-accepted-provenance
          fetch-depth: 1

      - name: Record accepted R7 provenance fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '**Current accepted base:** `48c49349047a0a200e6d405ed1a2623ab6183d87` after accepted R6 PR #190 from exact source head `94e66d139b1b5227c9edb2981d07e529afdf72d5`',
                  '**Current accepted base:** `ab683ef25a6ebce1ce0fc9483669fe6bdcfa9676` after accepted R7 PR #193 from exact source head `22ec5da1c72681f7013d4edbdf53c4d3c6563dba`',
              ),
              (
                  '### R7 — P1 — Current repository documentation is not a single truthful authority\n\n**Finding**',
                  '### R7 — P1 — Current repository documentation is not a single truthful authority — ACCEPTED\n\n**Accepted main:** squash merge `ab683ef25a6ebce1ce0fc9483669fe6bdcfa9676` via PR #193 from exact source head `22ec5da1c72681f7013d4edbdf53c4d3c6563dba`.\n\n**Finding**',
              ),
              (
                  '7. **Current documentation/security authority** — R7.',
                  '7. **Current documentation/security authority** — R7. Accepted via PR #193 / `ab683ef25a6ebce1ce0fc9483669fe6bdcfa9676` from exact source head `22ec5da1c72681f7013d4edbdf53c4d3c6563dba`.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one R7 provenance target, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          required = (
              '**Status:** ACTIVE / BLOCKING PHASE 2J',
              '**Production readiness:** remains `false`',
              '### R8 — P2 — Green CI still tolerates owned warning/dead-code debt and duplicates expensive checks',
              '### R9 — P2 — Certification domain contains a second device-authorization model',
              'remaining P2 items are either closed or explicitly documented as non-blocking with no hidden correctness/security/contract risk',
          )
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'R7 provenance freeze/P2 invariant missing: {marker}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md

      - name: Commit provenance without removing workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md
          git commit -m 'Record accepted R7 provenance'
          git push origin HEAD:audit/r7-accepted-provenance
