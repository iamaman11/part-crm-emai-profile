name: GitHub Governance Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: GitHub Governance Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate every GitHub Actions workflow with digest-pinned actionlint
        uses: docker://rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7
        with:
          args: -no-color

      - name: Prove workflow secret authority fails closed
        run: python scripts/check-workflow-secret-authority.py --self-test

      - name: Validate canonical workflow secret consumers and environment boundaries
        run: python scripts/check-workflow-secret-authority.py

      - name: Validate one-merge architecture acceptance contract
        run: |
          node .github/scripts/architecture-acceptance.mjs contract
          node .github/scripts/architecture-acceptance.mjs derive | python -m json.tool

      - name: Validate architecture-slice premerge identity
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node .github/scripts/architecture-acceptance.mjs premerge
          --title "$PR_TITLE"
          --head-ref "$PR_HEAD_REF"
          --base-ref "$PR_BASE_REF"
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"

      - name: Prove architecture acceptance drift fails closed
        run: node .github/scripts/architecture-acceptance.mjs self-test

      - name: Validate AR-7 governance contract
        run: node .github/scripts/github-governance.mjs contract

      - name: Prove AR-7 governance drift fails closed
        run: node .github/scripts/github-governance.mjs self-test

      - name: Validate AR-10 additive governance extension
        run: node .github/scripts/ar10-github-governance-extension.mjs contract

      - name: Prove AR-10 governance weakening fails closed
        run: node .github/scripts/ar10-github-governance-extension.mjs self-test

      - name: Validate canonical Actions registry projection
        run: node .github/scripts/github-actions-registry.mjs contract

      - name: Prove Actions registry drift fails closed
        run: node .github/scripts/github-actions-registry.mjs self-test

      - name: Validate accepted AR-8C operational credential lifecycle provenance
        run: node .github/scripts/credential-lifecycle.mjs contract

      - name: Prove accepted AR-8C credential lifecycle provenance drift fails closed
        run: node .github/scripts/credential-lifecycle.mjs self-test

      - name: Validate accepted AR-8C staging provider execution provenance
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs contract

      - name: Prove accepted AR-8C provider execution provenance drift fails closed
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Validate current subject-domain architecture authorities
        run: node .github/scripts/architecture-authority-check.mjs

      - name: Prove current architecture authority drift fails closed
        run: node .github/scripts/architecture-authority-check.mjs --self-test

      - name: Validate current Profile/Camoufox security authority
        run: node .github/scripts/profile-security-authority-check.mjs

      - name: Prove Profile/Camoufox security and proxy-handle leakage fail closed
        run: node .github/scripts/profile-security-authority-check.mjs --self-test

  hosted-state:
    name: GitHub Governance Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    env:
      GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit accepted AR-7 live hosted GitHub governance baseline
        run: node .github/scripts/github-governance.mjs live

      - name: Audit AR-10 additive live hosted governance
        run: node .github/scripts/ar10-github-governance-extension.mjs live

      - name: Audit live Actions registry against canonical projection
        env:
          GITHUB_ACTIONS_READ_AUTH: ${{ github.token }}
        run: printf '%s' "$GITHUB_ACTIONS_READ_AUTH" | node .github/scripts/github-actions-registry.mjs live

      - name: Reconcile GitHub credential binding metadata
        env:
          GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: node .github/scripts/credential-lifecycle.mjs github-live

  operational-credential-state:
    name: Operational Credential Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit staging Cloudflare operational credential metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          AR8C_AUDIT_ENVIRONMENT: staging
        run: node .github/scripts/credential-lifecycle.mjs cloudflare-live
