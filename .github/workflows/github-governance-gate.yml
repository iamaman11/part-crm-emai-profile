name: GitHub Governance Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: GitHub Governance Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate AR-7 governance contract
        run: node .github/scripts/github-governance.mjs contract

      - name: Prove AR-7 governance drift fails closed
        run: node .github/scripts/github-governance.mjs self-test

      - name: Validate canonical Actions registry projection
        run: node .github/scripts/github-actions-registry.mjs contract

      - name: Prove Actions registry drift fails closed
        run: node .github/scripts/github-actions-registry.mjs self-test

      - name: Validate accepted AR-8C operational credential lifecycle provenance
        run: node .github/scripts/credential-lifecycle.mjs contract

      - name: Prove accepted AR-8C credential lifecycle provenance drift fails closed
        run: node .github/scripts/credential-lifecycle.mjs self-test

      - name: Validate accepted AR-8C staging provider execution provenance
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs contract

      - name: Prove accepted AR-8C provider execution provenance drift fails closed
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Validate current subject-domain architecture authorities
        run: node .github/scripts/architecture-authority-check.mjs

      - name: Prove current architecture authority drift fails closed
        run: node .github/scripts/architecture-authority-check.mjs --self-test

      - name: Validate current Profile/Camoufox security authority
        run: node .github/scripts/profile-security-authority-check.mjs

      - name: Prove Profile/Camoufox security and proxy-handle leakage fail closed
        run: node .github/scripts/profile-security-authority-check.mjs --self-test

  hosted-state:
    name: GitHub Governance Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    env:
      GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit live hosted GitHub governance
        run: node .github/scripts/github-governance.mjs live

      - name: Audit live Actions registry against canonical projection
        env:
          GITHUB_ACTIONS_READ_AUTH: ${{ github.token }}
        run: printf '%s' "$GITHUB_ACTIONS_READ_AUTH" | node .github/scripts/github-actions-registry.mjs live

      - name: Reconcile GitHub credential binding metadata
        env:
          GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: node .github/scripts/credential-lifecycle.mjs github-live

  operational-credential-state:
    name: Operational Credential Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit staging Cloudflare operational credential metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          AR8C_AUDIT_ENVIRONMENT: staging
        run: node .github/scripts/credential-lifecycle.mjs cloudflare-live

  ar8-checkpoint-materializer:
    name: AR8 Accepted Checkpoint Materializer Temporary
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/ar8-accepted-checkpoint-sync' && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact checkpoint-sync head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Execute staged source and compatibility steps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def execute_named_run(workflow_path: str, step_name: str, next_step: str) -> None:
              workflow = Path(workflow_path).read_text(encoding='utf-8')
              marker = f'      - name: {step_name}\n'
              start = workflow.index(marker)
              run_at = workflow.index('        run: |\n', start) + len('        run: |\n')
              end = workflow.index(f'\n      - name: {next_step}', run_at)
              lines = workflow[run_at:end].splitlines()
              script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              token = '$' + '{{ github.event.pull_request.head.sha }}'
              script = script.replace(token, head)
              subprocess.run(['bash', '-c', script], check=True)

          execute_named_run(
              '.github/workflows/ar8-accepted-checkpoint-materializer.yml',
              'Write accepted AR-8 checkpoint sources',
              'Validate accepted checkpoint locally',
          )
          execute_named_run(
              '.github/workflows/ar8-checkpoint-push-bootstrap.yml',
              'Advance legacy documentation checker and capability projection',
              'Validate and retire all temporary materializers',
          )
          PY

      - name: Validate final accepted checkpoint tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-ar8-completion-status.py --check
          python scripts/generate-ar8-completion-status.py --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-documentation-authority.py
          python scripts/check-documentation-authority.py --self-test
          python scripts/python-estate-ar6.py --check
          python scripts/python-estate-ar6.py --self-test
          python scripts/check-opsctl-readonly.py
          python scripts/check-opsctl-readonly.py --self-test
          node .github/scripts/architecture-authority-check.mjs
          node .github/scripts/architecture-authority-check.mjs --self-test
          node .github/scripts/profile-security-authority-check.mjs
          node .github/scripts/profile-security-authority-check.mjs --self-test
          git diff --check

      - name: Restore permanent workflow retire bootstrap and commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/github-governance-gate.yml
          rm .github/workflows/ar8-accepted-checkpoint-materializer.yml
          rm .github/workflows/ar8-checkpoint-push-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Project accepted AR-8 checkpoint and AR-9 handoff"
          git push origin HEAD:agent/ar8-accepted-checkpoint-sync
