name: GitHub Governance Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: GitHub Governance Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate every GitHub Actions workflow with digest-pinned actionlint
        run: |
          set -euo pipefail
          image='rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7'
          docker pull "$image" >/dev/null
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$image" -no-color

      - name: Prove workflow secret authority fails closed
        run: python scripts/check-workflow-secret-authority.py --self-test

      - name: Validate canonical workflow secret consumers and environment boundaries
        run: python scripts/check-workflow-secret-authority.py

      - name: Prove AR-11 Core mailbox hosted disablement fails closed
        run: node .github/scripts/ar11-core-mailbox-hosted-disablement.mjs --self-test

      - name: Validate AR-11 Core mailbox hosted disablement contract
        run: node .github/scripts/ar11-core-mailbox-hosted-disablement.mjs

      - name: Derive lifecycle through the typed PF-1 owner
        run: |
          node .github/scripts/architecture-acceptance-observer.mjs evidence > acceptance-evidence.json
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . status --acceptance-evidence-json acceptance-evidence.json \
            > lifecycle-state.json
          python -m json.tool lifecycle-state.json >/dev/null

      - name: Validate architecture-slice premerge identity
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node .github/scripts/architecture-acceptance-observer.mjs premerge \
            --title "$PR_TITLE" \
            --head-ref "$PR_HEAD_REF" \
            --base-ref "$PR_BASE_REF" \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            > premerge-observation.json
          python - <<'PY'
          import json
          premerge = json.load(open('premerge-observation.json', encoding='utf-8'))
          state = json.load(open('lifecycle-state.json', encoding='utf-8'))
          if premerge['architecture_slice'] and premerge['slice'] != state['current_slice']:
              raise SystemExit(f"architecture slice {premerge['slice']} is not current {state['current_slice']}")
          PY

      - name: Prove typed lifecycle drift fails closed
        run: cargo test --locked --manifest-path tools/opsctl/Cargo.toml architecture

      - name: Prove typed hosted evidence policy and adapter fail closed
        run: cargo test --locked --manifest-path tools/opsctl/Cargo.toml hosted_evidence

      - name: Validate current GitHub governance desired state
        run: node .github/scripts/github-governance.mjs contract

      - name: Prove GitHub governance weakening fails closed
        run: node .github/scripts/github-governance.mjs self-test

      - name: Validate canonical Actions registry projection
        run: node .github/scripts/github-actions-registry.mjs contract

      - name: Prove Actions registry drift fails closed
        run: node .github/scripts/github-actions-registry.mjs self-test

      - name: Validate accepted AR-8C operational credential lifecycle provenance
        run: node .github/scripts/credential-lifecycle.mjs contract

      - name: Prove accepted AR-8C operational credential lifecycle provenance drift fails closed
        run: node .github/scripts/credential-lifecycle.mjs self-test

      - name: Validate accepted AR-8C staging provider execution provenance
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs contract

      - name: Prove accepted AR-8C provider execution provenance drift fails closed
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Validate current subject-domain architecture authorities
        run: node .github/scripts/architecture-authority-check.mjs

      - name: Prove current architecture authority drift fails closed
        run: node .github/scripts/architecture-authority-check.mjs --self-test

      - name: Validate current Profile/Camoufox security authority
        run: node .github/scripts/profile-security-authority-check.mjs

      - name: Prove Profile/Camoufox security and proxy-handle leakage fail closed
        run: node .github/scripts/profile-security-authority-check.mjs --self-test

  hosted-state:
    name: GitHub Governance Hosted State
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit current live hosted GitHub governance
        run: node .github/scripts/github-governance.mjs live

      - name: Audit live Actions registry against canonical projection
        env:
          GITHUB_ACTIONS_READ_AUTH: ${{ github.token }}
        run: printf '%s' "$GITHUB_ACTIONS_READ_AUTH" | node .github/scripts/github-actions-registry.mjs live

      - name: Reconcile GitHub credential binding metadata
        env:
          GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: node .github/scripts/credential-lifecycle.mjs github-live

  operational-credential-state:
    name: Operational Credential Hosted State
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Collect AR-11 staging operational credential raw facts
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          attestation='docs/evidence/ar11-fc6-cloudflare-observe-token-policy.json'
          extension='architecture/credential-authority-ar11-extension.json'
          test -f "$attestation"
          test -f "$extension"
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/ar11-observe-deploy-manifest.json"

          verify_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-token-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"

          account_id="$(jq -r '.control_plane.account_id // .account_id' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          worker_name="$(jq -r '.control_plane.worker_name // .worker_name' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          d1_database_name="$(jq -r '.control_plane.d1_database_name // .d1_database_name' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          r2_bucket="$(jq -r '.control_plane.r2_bucket_name // .r2_bucket_name' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          queue_name="$(jq -r '.control_plane.integration_events_queue // .integration_events_queue' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          test -n "$account_id"
          test -n "$worker_name"
          test -n "$d1_database_name"
          test -n "$r2_bucket"
          test -n "$queue_name"

          account_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-account.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id")"

          deployments_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-deployments.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"

          d1_catalog_exit_code=0
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$account_id" \
            npx --yes wrangler@4.94.0 d1 execute "$d1_database_name" --remote \
              --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
              > "$RUNNER_TEMP/ar11-observe-d1.json" || d1_catalog_exit_code=$?

          r2_bucket_exit_code=0
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$account_id" \
            npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json \
              > "$RUNNER_TEMP/ar11-observe-r2.json" || r2_bucket_exit_code=$?

          queue_exit_code=0
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$account_id" \
            npx --yes wrangler@4.94.0 queues info "$queue_name" \
              > "$RUNNER_TEMP/ar11-observe-queue.txt" || queue_exit_code=$?

          worker_secret_names_exit_code=0
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$account_id" \
            npx --yes wrangler@4.94.0 secret list --name "$worker_name" --format json \
              > "$RUNNER_TEMP/ar11-observe-secret-list.json" || worker_secret_names_exit_code=$?

          workers_deployments_response_digest_sha256="$(sha256sum "$RUNNER_TEMP/ar11-observe-deployments.json" | awk '{print $1}')"
          d1_catalog_output_digest_sha256="$(sha256sum "$RUNNER_TEMP/ar11-observe-d1.json" | awk '{print $1}')"
          r2_bucket_output_digest_sha256="$(sha256sum "$RUNNER_TEMP/ar11-observe-r2.json" | awk '{print $1}')"

          jq -n \
            --argjson workers_deployments_http_status "$deployments_code" \
            --slurpfile deployments "$RUNNER_TEMP/ar11-observe-deployments.json" \
            --arg workers_deployments_response_digest_sha256 "$workers_deployments_response_digest_sha256" \
            --argjson d1_catalog_exit_code "$d1_catalog_exit_code" \
            --arg d1_catalog_output_digest_sha256 "$d1_catalog_output_digest_sha256" \
            --argjson r2_bucket_exit_code "$r2_bucket_exit_code" \
            --arg r2_bucket_output_digest_sha256 "$r2_bucket_output_digest_sha256" \
            --argjson queue_exit_code "$queue_exit_code" \
            --argjson worker_secret_names_exit_code "$worker_secret_names_exit_code" \
            '{
              workers_deployments_http_status: $workers_deployments_http_status,
              workers_deployments_success: $deployments[0].success,
              workers_deployments_error_count: ($deployments[0].errors | length),
              workers_deployments_response_digest_sha256: $workers_deployments_response_digest_sha256,
              d1_catalog_exit_code: $d1_catalog_exit_code,
              d1_catalog_output_digest_sha256: $d1_catalog_output_digest_sha256,
              r2_bucket_exit_code: $r2_bucket_exit_code,
              r2_bucket_output_digest_sha256: $r2_bucket_output_digest_sha256,
              queue_exit_code: $queue_exit_code,
              worker_secret_names_exit_code: $worker_secret_names_exit_code,
              mutation_probe: "FORBIDDEN_NOT_EXECUTED"
            }' > "$RUNNER_TEMP/ar11-observe-read-observations.json"

          observed_at="$(date -u +%s)"
          valid_until="$((observed_at + 21600))"
          observation="$RUNNER_TEMP/pf2-operational-credential-observation.json"
          jq -n \
            --slurpfile extension "$extension" \
            --slurpfile attestation "$attestation" \
            --slurpfile verify "$RUNNER_TEMP/ar11-observe-token-verify.json" \
            --slurpfile account "$RUNNER_TEMP/ar11-observe-account.json" \
            --slurpfile deploy "$RUNNER_TEMP/ar11-observe-deploy-manifest.json" \
            --slurpfile reads "$RUNNER_TEMP/ar11-observe-read-observations.json" \
            --arg issuer github-actions \
            --arg source github-governance-gate/operational-credential-state \
            --arg target "$GITHUB_REPOSITORY" \
            --arg environment staging \
            --arg subject "$SOURCE_SHA" \
            --argjson source_run_id "$GITHUB_RUN_ID" \
            --argjson source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson observed_at "$observed_at" \
            --argjson valid_until "$valid_until" \
            --argjson verify_http_status "$verify_code" \
            --argjson account_http_status "$account_code" \
            '($extension[0].credentials | map(select(.id == "cloudflare.staging-observation-api")) | .[0]) as $credential |
            {
              schema_version: 3,
              kind: "HOSTED_EVIDENCE_RAW_OBSERVATION",
              issuer: $issuer,
              source: $source,
              target: $target,
              environment: $environment,
              subject: $subject,
              source_run_id: $source_run_id,
              source_run_attempt: $source_run_attempt,
              observed_at_unix_seconds: $observed_at,
              valid_until_unix_seconds: $valid_until,
              credential_policy: {
                extension_production_mutation: $extension[0].production_mutation,
                credential_id: $credential.id,
                environment_scope: $credential.environment_scope.environments,
                allowed_mutator: $credential.allowed_mutator,
                mutation_allowed: $credential.mutation_allowed,
                provider_mutation_forbidden: $credential.provider_mutation_forbidden,
                required_provider_permissions: $credential.required_provider_permissions,
                forbidden_provider_permission_classes: $credential.forbidden_provider_permission_classes
              },
              attestation: $attestation[0],
              token_verify: {
                http_status: $verify_http_status,
                success: $verify[0].success,
                error_count: ($verify[0].errors | length),
                token_id: $verify[0].result.id,
                status: $verify[0].result.status
              },
              account: {
                http_status: $account_http_status,
                success: $account[0].success,
                error_count: ($account[0].errors | length),
                account_id: $account[0].result.id,
                account_name: $account[0].result.name
              },
              deployment_account_id: ($deploy[0].control_plane.account_id // $deploy[0].account_id // ""),
              reads: $reads[0],
              production_mutation: false
            }' > "$observation"

      - name: Prove disabled AR-11 Core mailbox surfaces have no hosted execution authority
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/ar11-core-mailbox-hosted-manifest.json"

          account_id="$(jq -er '.control_plane.account_id // .account_id | select(type == "string" and length == 32)' "$RUNNER_TEMP/ar11-core-mailbox-hosted-manifest.json")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name | select(type == "string" and length > 0)' "$RUNNER_TEMP/ar11-core-mailbox-hosted-manifest.json")"
          resolver_name="$(jq -er '.env.staging.name | select(type == "string" and length > 0)' deploy/cloudflare/mailbox-secret-resolver.wrangler.jsonc)"
          jq -e '.workers_dev == false and .env.staging.workers_dev == false and (.env.staging.routes | type == "array") and (.env.staging.routes | length) == 0 and (.env.staging.triggers.crons | type == "array") and (.env.staging.triggers.crons | length) == 0' \
            deploy/cloudflare/mailbox-secret-resolver.wrangler.jsonc >/dev/null

          settings_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-core-settings.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/settings")"
          if [ "$settings_code" = 200 ]; then
            jq -e '.success == true and ((.result.bindings // []) | all(.[]; .name != "MAILBOX_SECRET_RESOLVER" and .name != "MAILBOX_JOBS" and .name != "MAILBOX_RESOLVER_CALLER_AUTH_KEY"))' \
              "$RUNNER_TEMP/ar11-core-settings.json" >/dev/null
          elif [ "$settings_code" != 404 ]; then
            cat "$RUNNER_TEMP/ar11-core-settings.json" >&2
            exit 1
          fi

          schedules_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-resolver-schedules.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$resolver_name/schedules")"
          if [ "$schedules_code" = 200 ]; then
            jq -e '.success == true and (.result.schedules | type == "array") and ((.result.schedules | length) == 0)' \
              "$RUNNER_TEMP/ar11-resolver-schedules.json" >/dev/null
          elif [ "$schedules_code" != 404 ]; then
            cat "$RUNNER_TEMP/ar11-resolver-schedules.json" >&2
            exit 1
          fi

          subdomain_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-resolver-subdomain.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$resolver_name/subdomain")"
          if [ "$subdomain_code" = 200 ]; then
            jq -e '.success == true and .result.enabled == false and .result.previews_enabled == false' \
              "$RUNNER_TEMP/ar11-resolver-subdomain.json" >/dev/null
          elif [ "$subdomain_code" != 404 ]; then
            cat "$RUNNER_TEMP/ar11-resolver-subdomain.json" >&2
            exit 1
          fi

          echo "AR11_CORE_MAILBOX_HOSTED_DISABLED control_plane=$worker_name resolver=$resolver_name service_binding=absent cron_triggers=0 workers_dev=false previews=false production_mutation=false"

      - name: Seal typed PF-2 operational credential hosted evidence
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" != pull_request
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          evaluated_at="$(date -u +%s)"
          observation="$RUNNER_TEMP/pf2-operational-credential-observation.json"
          evidence_dir="artifacts/pf2-operational-credential-hosted-evidence"
          evidence="$evidence_dir/evidence.json"
          replay="$RUNNER_TEMP/pf2-operational-credential-evidence-replay.json"
          test -f "$observation"
          mkdir -p "$evidence_dir"

          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . hosted-evidence operational-credential seal \
            --observation-json "$observation" \
            --evaluated-at-unix-seconds "$evaluated_at" \
            --expected-subject "$SOURCE_SHA" \
            > "$evidence"

          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . hosted-evidence operational-credential verify \
            --artifact-json "$evidence" \
            --evaluated-at-unix-seconds "$evaluated_at" \
            --expected-subject "$SOURCE_SHA" \
            > "$replay"
          cmp --silent "$evidence" "$replay"

      - name: Publish immutable typed PF-2 hosted evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pf2-operational-credential-hosted-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/pf2-operational-credential-hosted-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove raw provider observations from runner temp
        if: always()
        run: |
          rm -f \
            "$RUNNER_TEMP/ar11-observe-deploy-manifest.json" \
            "$RUNNER_TEMP/ar11-observe-token-verify.json" \
            "$RUNNER_TEMP/ar11-observe-account.json" \
            "$RUNNER_TEMP/ar11-observe-deployments.json" \
            "$RUNNER_TEMP/ar11-observe-d1.json" \
            "$RUNNER_TEMP/ar11-observe-r2.json" \
            "$RUNNER_TEMP/ar11-observe-queue.txt" \
            "$RUNNER_TEMP/ar11-observe-secret-list.json" \
            "$RUNNER_TEMP/ar11-observe-read-observations.json" \
            "$RUNNER_TEMP/pf2-operational-credential-observation.json" \
            "$RUNNER_TEMP/pf2-operational-credential-evidence-replay.json"
