name: GitHub Governance Gate

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: github-governance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: GitHub Governance Contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate every GitHub Actions workflow with digest-pinned actionlint
        run: |
          set -euo pipefail
          image='rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7'
          docker pull "$image" >/dev/null
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            "$image" -no-color

      - name: Prove workflow secret authority fails closed
        run: python scripts/check-workflow-secret-authority.py --self-test

      - name: Validate canonical workflow secret consumers and environment boundaries
        run: python scripts/check-workflow-secret-authority.py

      - name: Prove AR-11 observe credential readiness fails closed
        run: node .github/scripts/ar11-observe-credential-readiness.mjs --self-test

      - name: Validate one-merge architecture acceptance contract
        run: |
          node .github/scripts/architecture-acceptance.mjs contract
          node .github/scripts/architecture-acceptance.mjs derive | python -m json.tool

      - name: Validate architecture-slice premerge identity
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node .github/scripts/architecture-acceptance.mjs premerge
          --title "$PR_TITLE"
          --head-ref "$PR_HEAD_REF"
          --base-ref "$PR_BASE_REF"
          --base "$PR_BASE_SHA"
          --base "$PR_BASE_SHA"
          --head "$PR_HEAD_SHA"

      - name: Prove architecture acceptance drift fails closed
        run: node .github/scripts/architecture-acceptance.mjs self-test

      - name: Validate AR-7 governance contract
        run: node .github/scripts/github-governance.mjs contract

      - name: Prove AR-7 governance drift fails closed
        run: node .github/scripts/github-governance.mjs self-test

      - name: Validate AR-10 additive governance extension
        run: node .github/scripts/ar10-github-governance-extension.mjs contract

      - name: Prove AR-10 governance weakening fails closed
        run: node .github/scripts/ar10-github-governance-extension.mjs self-test

      - name: Validate canonical Actions registry projection
        run: node .github/scripts/github-actions-registry.mjs contract

      - name: Prove Actions registry drift fails closed
        run: node .github/scripts/github-actions-registry.mjs self-test

      - name: Validate accepted AR-8C operational credential lifecycle provenance
        run: node .github/scripts/credential-lifecycle.mjs contract

      - name: Prove accepted AR-8C credential lifecycle provenance drift fails closed
        run: node .github/scripts/credential-lifecycle.mjs self-test

      - name: Validate accepted AR-8C staging provider execution provenance
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs contract

      - name: Prove accepted AR-8C provider execution provenance drift fails closed
        run: node .github/scripts/ar8-staging-provider-bootstrap.mjs self-test

      - name: Validate current subject-domain architecture authorities
        run: node .github/scripts/architecture-authority-check.mjs

      - name: Prove current architecture authority drift fails closed
        run: node .github/scripts/architecture-authority-check.mjs --self-test

      - name: Validate current Profile/Camoufox security authority
        run: node .github/scripts/profile-security-authority-check.mjs

      - name: Prove Profile/Camoufox security and proxy-handle leakage fail closed
        run: node .github/scripts/profile-security-authority-check.mjs --self-test

  hosted-state:
    name: GitHub Governance Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    env:
      GOVERNANCE_AUDIT_TOKEN: ${{ secrets.GOVERNANCE_AUDIT_TOKEN }}
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit accepted AR-7 live hosted GitHub governance baseline
        run: node .github/scripts/github-governance.mjs live

      - name: Audit AR-10 additive live hosted governance
        run: node .github/scripts/ar10-github-governance-extension.mjs live

      - name: Audit live Actions registry against canonical projection
        env:
          GITHUB_ACTIONS_READ_AUTH: ${{ github.token }}
        run: printf '%s' "$GITHUB_ACTIONS_READ_AUTH" | node .github/scripts/github-actions-registry.mjs live

      - name: Reconcile GitHub credential binding metadata
        env:
          GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: node .github/scripts/credential-lifecycle.mjs github-live

  operational-credential-state:
    name: Operational Credential Hosted State
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Audit staging Cloudflare operational credential metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          AR8C_AUDIT_ENVIRONMENT: staging
        run: node .github/scripts/credential-lifecycle.mjs cloudflare-live

      - name: Verify AR-11 observe token binding and active identity metadata
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/ar11-observe-binding-manifest.json"
          verify_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-binding-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = 200
          jq -e '.success == true and .result.status == "active" and (.result.id | type == "string")' "$RUNNER_TEMP/ar11-observe-binding-verify.json" >/dev/null
          account_id="$(jq -r '.control_plane.account_id // .account_id' "$RUNNER_TEMP/ar11-observe-binding-manifest.json")"
          [[ "$account_id" =~ ^[0-9a-f]{32}$ ]]
          token_id="$(jq -r '.result.id' "$RUNNER_TEMP/ar11-observe-binding-verify.json")"
          echo "AR11_OBSERVE_ACTIVE token_id=$token_id account_id=$account_id status=active"

      - name: Prove AR-11 staging observe credential READY or fail closed
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          attestation='docs/evidence/ar11-fc6-cloudflare-observe-token-policy.json'
          test -f "$attestation"
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/ar11-observe-deploy-manifest.json"

          verify_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-token-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = 200
          jq -e '.success == true and .result.status == "active" and (.result.id | type == "string")' "$RUNNER_TEMP/ar11-observe-token-verify.json" >/dev/null

          account_id="$(jq -r '.control_plane.account_id // .account_id' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          worker_name="$(jq -r '.control_plane.worker_name // .worker_name' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          r2_bucket="$(jq -r '.control_plane.r2_bucket_name // .r2_bucket_name' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          queue_name="$(jq -r '.control_plane.integration_events_queue // .integration_events_queue' "$RUNNER_TEMP/ar11-observe-deploy-manifest.json")"
          test -n "$account_id"
          test -n "$worker_name"
          test -n "$r2_bucket"
          test -n "$queue_name"

          python scripts/release-core-overlay-ar11.py \
            --source-config deploy/cloudflare/wrangler.jsonc \
            --release-root . \
            --deploy-manifest "$RUNNER_TEMP/ar11-observe-deploy-manifest.json" \
            --environment staging \
            --output "$RUNNER_TEMP/ar11-observe-wrangler.staging.json"

          deployments_code="$(curl --silent --show-error --output "$RUNNER_TEMP/ar11-observe-deployments.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          test "$deployments_code" = 200 -o "$deployments_code" = 404
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$RUNNER_TEMP/ar11-observe-wrangler.staging.json" --env staging > "$RUNNER_TEMP/ar11-observe-d1.json"
          npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json \
            --config "$RUNNER_TEMP/ar11-observe-wrangler.staging.json" --env staging > "$RUNNER_TEMP/ar11-observe-r2.json"
          npx --yes wrangler@4.94.0 queues info "$queue_name" \
            --config "$RUNNER_TEMP/ar11-observe-wrangler.staging.json" --env staging > "$RUNNER_TEMP/ar11-observe-queue.txt"
          npx --yes wrangler@4.94.0 secret list --name "$worker_name" --json \
            --config "$RUNNER_TEMP/ar11-observe-wrangler.staging.json" --env staging > "$RUNNER_TEMP/ar11-observe-secret-list.json"

          jq -n '{
            schema_version: 1,
            kind: "AR11_OBSERVE_CREDENTIAL_READ_OBSERVATIONS",
            workers_deployments_read: true,
            d1_catalog_read: true,
            r2_bucket_read: true,
            queue_read: true,
            worker_secret_names_read: true,
            mutation_probe: "FORBIDDEN_NOT_EXECUTED"
          }' > "$RUNNER_TEMP/ar11-observe-read-observations.json"

          node .github/scripts/ar11-observe-credential-readiness.mjs \
            --extension architecture/credential-authority-ar11-extension.json \
            --attestation "$attestation" \
            --verify "$RUNNER_TEMP/ar11-observe-token-verify.json" \
            --deploy-manifest "$RUNNER_TEMP/ar11-observe-deploy-manifest.json" \
            --observations "$RUNNER_TEMP/ar11-observe-read-observations.json" \
            --output "$RUNNER_TEMP/ar11-observe-readiness.json"
          jq -e '.decision == "READY" and .environment == "staging" and .production_mutation == false and .mutation_probe == "FORBIDDEN_NOT_EXECUTED"' \
            "$RUNNER_TEMP/ar11-observe-readiness.json" >/dev/null
