name: GitHub Governance Gate

on:
  pull_request:

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: post-ar8c-branch-retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retire:
    name: Retire Classified AR-8C Scratch Branches
    if: github.event.pull_request.head.ref == 'agent/post-ar8c-branch-retirement'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCEPTED_MAIN: 6145ac6754d83cf1d3b5361a098c28a20a9222f7
      EXECUTOR_BRANCH: agent/post-ar8c-branch-retirement
      SELF_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact executor head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact accepted main and executor head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SELF_EXPECTED_SHA"
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$ACCEPTED_MAIN"
          git fetch --no-tags --depth=1 origin "$ACCEPTED_MAIN"

      - name: Validate classification, exception resolutions and live registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          accepted_main = os.environ['ACCEPTED_MAIN']
          executor_branch = os.environ['EXECUTOR_BRANCH']
          self_sha = os.environ['SELF_EXPECTED_SHA']
          api = f'https://api.github.com/repos/{repo}'

          classification = json.loads(Path('post-ar8c-branch-classification.json').read_text())
          resolutions = json.loads(Path('post-ar8c-branch-review-resolutions.json').read_text())
          if classification.get('schema_version') != 1 or classification.get('issue') != 352:
              raise SystemExit('branch classification schema/issue drifted')
          if classification.get('accepted_main') != accepted_main or classification.get('branch_count') != 36:
              raise SystemExit('branch classification accepted-main/count drifted')
          if classification.get('classification_counts') != {
              'CLASSIFIER_SELF_KEEP_UNTIL_FINAL': 1,
              'RETIRE_CONTAINED_IN_ACCEPTED_MAIN': 29,
              'REVIEW_UNMERGED_NO_PRESERVED_PROVENANCE': 2,
              'REVIEW_UNMERGED_REFERENCED_BY_ACCEPTED_MAIN': 4,
          }:
              raise SystemExit('branch classification counts drifted')
          if resolutions.get('schema_version') != 1 or resolutions.get('issue') != 352 or resolutions.get('accepted_main') != accepted_main:
              raise SystemExit('branch resolution schema/main drifted')

          rows = classification['branches']
          by_name = {row['branch']: row for row in rows}
          if len(by_name) != 36:
              raise SystemExit('branch classification contains duplicate names')
          self_row = by_name.get(executor_branch)
          if not self_row or self_row.get('classification') != 'CLASSIFIER_SELF_KEEP_UNTIL_FINAL':
              raise SystemExit('classifier self row missing')

          review_rows = {
              row['branch']: row for row in rows
              if str(row.get('classification', '')).startswith('REVIEW_')
          }
          resolution_by_name = {item['branch']: item for item in resolutions['resolutions']}
          if set(review_rows) != set(resolution_by_name) or len(resolution_by_name) != 6:
              raise SystemExit('review-resolution set does not exactly cover six reviewed branches')
          for name, item in resolution_by_name.items():
              if item.get('expected_head_sha') != review_rows[name].get('head_sha'):
                  raise SystemExit(f'resolution SHA drifted for {name}')
              if not str(item.get('decision', '')).startswith('RETIRE_'):
                  raise SystemExit(f'non-retirement resolution for {name}')
              if not item.get('basis'):
                  raise SystemExit(f'missing resolution basis for {name}')

          auto = [row for row in rows if row.get('delete_eligible') is True]
          if len(auto) != 29 or any(row.get('classification') != 'RETIRE_CONTAINED_IN_ACCEPTED_MAIN' for row in auto):
              raise SystemExit('automatic delete set must be exactly 29 contained branches')
          delete_rows = auto + [review_rows[name] for name in sorted(review_rows)]
          if len(delete_rows) != 35 or len({row['branch'] for row in delete_rows}) != 35:
              raise SystemExit('delete allowlist must contain exactly 35 non-self branches')

          def get(url):
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'post-ar8c-branch-retirement',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          # Fail closed if the permanent live Actions registry is not already in its
          # 16-authority steady state before branch mutation.
          policy = json.loads(__import__('subprocess').check_output(
              ['git', 'show', f'{accepted_main}:architecture/github-actions-registry.json'], text=True
          ))
          expected_paths = {item['path'] for item in policy['active_registrations']}
          if len(expected_paths) != 16:
              raise SystemExit('canonical registry projection must contain 16 active paths')
          workflows = []
          page = 1
          while True:
              payload = get(f'{api}/actions/workflows?per_page=100&page={page}')
              batch = payload.get('workflows', [])
              workflows.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 100:
                  raise SystemExit('workflow pagination exceeded bound')
          active = [w for w in workflows if w.get('state') == 'active']
          active_paths = [w.get('path') for w in active]
          if len(active) != 16 or set(active_paths) != expected_paths or len(active_paths) != len(set(active_paths)):
              raise SystemExit(f'live Actions registry not in 16-authority steady state: {active_paths}')

          # Preflight every exact ref before the first DELETE.
          owner = repo.split('/', 1)[0]
          for row in delete_rows:
              name = row['branch']
              expected_sha = row['head_sha']
              ref = get(f'{api}/git/ref/heads/{urllib.parse.quote(name, safe="/")}')
              observed = ref['object']['sha']
              if observed != expected_sha:
                  raise SystemExit(f'branch moved since classification: {name}: {observed} != {expected_sha}')
              q = urllib.parse.urlencode({'state': 'open', 'head': f'{owner}:{name}', 'per_page': 100})
              if get(f'{api}/pulls?{q}'):
                  raise SystemExit(f'open PR appeared for retirement branch: {name}')
              if row.get('classification') == 'RETIRE_CONTAINED_IN_ACCEPTED_MAIN':
                  compare = get(f'{api}/compare/{expected_sha}...{accepted_main}')
                  if compare.get('status') not in {'ahead', 'identical'} or compare.get('behind_by') != 0:
                      raise SystemExit(f'contained branch no longer contained in accepted main: {name}')

          self_ref = get(f'{api}/git/ref/heads/{urllib.parse.quote(executor_branch, safe="/")}')
          if self_ref['object']['sha'] != self_sha:
              raise SystemExit('executor branch moved during preflight')

          plan = {
              'schema_version': 1,
              'issue': 352,
              'accepted_main': accepted_main,
              'executor_branch': executor_branch,
              'executor_head': self_sha,
              'automatic_contained_count': 29,
              'reviewed_exception_count': 6,
              'non_self_delete_count': 35,
              'self_delete_last': True,
              'live_active_registry_count': 16,
              'branches': [{'branch': r['branch'], 'expected_head_sha': r['head_sha'], 'basis': r['classification']} for r in sorted(delete_rows, key=lambda x: x['branch'])],
              'review_resolutions': resolutions['resolutions'],
              'invariants': {
                  'no_regex_deletion': True,
                  'exact_sha_preflight': True,
                  'open_pr_fail_closed': True,
                  'actions_runs_deleted': False,
                  'production_mutation': False,
                  'provider_mutation': False,
                  'secret_readback': False,
              },
          }
          Path('/tmp/post-ar8c-branch-retirement-plan.json').write_text(json.dumps(plan, indent=2) + '\n')
          print(json.dumps(plan, indent=2))
          PY

      - name: Delete only exact classified non-self refs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          plan = json.loads(Path('/tmp/post-ar8c-branch-retirement-plan.json').read_text())

          def request(url, method='GET'):
              req = urllib.request.Request(url, method=method, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'post-ar8c-branch-retirement',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode(errors='replace')
                  raise SystemExit(f'{method} {url} failed: HTTP {exc.code}: {body[:1000]}')

          deleted = []
          for item in plan['branches']:
              name = item['branch']
              expected_sha = item['expected_head_sha']
              encoded = urllib.parse.quote(name, safe='/')
              status, ref = request(f'{api}/git/ref/heads/{encoded}')
              if status != 200 or ref['object']['sha'] != expected_sha:
                  raise SystemExit(f'pre-delete SHA mismatch for {name}')
              status, _ = request(f'{api}/git/refs/heads/{encoded}', method='DELETE')
              if status != 204:
                  raise SystemExit(f'unexpected delete status for {name}: {status}')
              try:
                  request(f'{api}/git/ref/heads/{encoded}')
              except SystemExit as exc:
                  if 'HTTP 404' not in str(exc):
                      raise
              else:
                  raise SystemExit(f'deleted branch still resolves: {name}')
              deleted.append({'branch': name, 'head_sha': expected_sha, 'deleted': True})
              print(json.dumps(deleted[-1]))
          if len(deleted) != 35:
              raise SystemExit('expected exactly 35 non-self deletions')
          Path('/tmp/post-ar8c-branch-retirement-results.json').write_text(json.dumps({'deleted': deleted}, indent=2) + '\n')
          PY

      - name: Verify steady state and delete executor branch last
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          accepted_main = os.environ['ACCEPTED_MAIN']
          self_branch = os.environ['EXECUTOR_BRANCH']
          self_sha = os.environ['SELF_EXPECTED_SHA']
          api = f'https://api.github.com/repos/{repo}'

          def req(url, method='GET', allow_404=False):
              request = urllib.request.Request(url, method=method, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'User-Agent': 'post-ar8c-branch-retirement',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  if allow_404 and exc.code == 404:
                      return 404, None
                  body = exc.read().decode(errors='replace')
                  raise SystemExit(f'{method} {url} failed: HTTP {exc.code}: {body[:1000]}')

          # Verify all 35 exact refs are gone.
          results = json.loads(Path('/tmp/post-ar8c-branch-retirement-results.json').read_text())['deleted']
          for item in results:
              encoded = urllib.parse.quote(item['branch'], safe='/')
              status, _ = req(f'{api}/git/ref/heads/{encoded}', allow_404=True)
              if status != 404:
                  raise SystemExit(f'branch unexpectedly remains after delete: {item["branch"]}')

          # Ensure no other AR-8C/post-AR-8C branch appeared while mutating.
          branches = []
          page = 1
          while True:
              status, rows = req(f'{api}/branches?per_page=100&page={page}')
              if status != 200:
                  raise SystemExit('branch listing failed')
              branches.extend(rows)
              if len(rows) < 100:
                  break
              page += 1
          scoped = [b['name'] for b in branches if b['name'].startswith('agent/ar8c-') or b['name'].startswith('agent/post-ar8c-')]
          if scoped != [self_branch]:
              raise SystemExit(f'unexpected scoped branches remain before self-delete: {scoped}')

          current_main = next((b['commit']['sha'] for b in branches if b['name'] == 'main'), None)
          if current_main != accepted_main:
              raise SystemExit(f'main moved during branch retirement: {current_main}')

          encoded_self = urllib.parse.quote(self_branch, safe='/')
          status, self_ref = req(f'{api}/git/ref/heads/{encoded_self}')
          if status != 200 or self_ref['object']['sha'] != self_sha:
              raise SystemExit('executor branch SHA changed before final self-delete')

          summary = {
              'schema_version': 1,
              'issue': 352,
              'accepted_main': accepted_main,
              'deleted_non_self': 35,
              'self_branch': self_branch,
              'self_head_sha': self_sha,
              'self_delete_next': True,
              'historical_actions_runs_deleted': False,
              'production_mutation': False,
              'provider_mutation': False,
              'secret_readback': False,
          }
          print('FINAL_PRE_SELF_DELETE=' + json.dumps(summary, sort_keys=True))
          status, _ = req(f'{api}/git/refs/heads/{encoded_self}', method='DELETE')
          if status != 204:
              raise SystemExit(f'unexpected self-delete status: {status}')
          status, _ = req(f'{api}/git/ref/heads/{encoded_self}', allow_404=True)
          if status != 404:
              raise SystemExit('executor branch still resolves after self-delete')
          print('FINAL_BRANCH_RETIREMENT=success; deleted=36; historical_actions_runs_deleted=false; production_mutation=false; provider_mutation=false; secret_readback=false')
          PY
