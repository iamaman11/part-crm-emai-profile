name: CAP-EXEC V2 — One-click D1 Reconciliation

run-name: V2 D1 one-click / staging catalog / ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cap-exec-v2-d1-one-click
  cancel-in-progress: false

jobs:
  dispatch:
    name: Resolve exact V2 inputs and dispatch canonical D1 executor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_ENVIRONMENT: staging
      COMPONENT: catalog
      CLOUDFLARE_ACCOUNT_ID: 4426df1449e417511bc7697d60b7f62f
      DATABASE_NAME: part-crm-catalog-staging-d3-20260815
      DATABASE_ID: af9abfd1-cb0e-4c58-aa5e-f09c8147f23f
      TARGET_RELEASE_SET_ID: release-set-v3-sha256-3538b28eb12d8bec46ba56c4c60317fb2149c7f382001cca7dbef1394d165929
      TARGET_RELEASE_SOURCE_SHA: cc2620a1d5caacadabbfbab197d59afc0b7e2491
      TARGET_CONTROL_PLANE_RELEASE_ID: cloudflare-v1-sha256-4c76d3d9f53075950e91dfb2d2da0b74033c1bc0deafdfeab976f92f33188569
      TARGET_MANIFEST_SHA256: 8a350b13898e13f4719a10deff133c0233cce4094d577b553d7f4f4117e48610
      CURRENT_RELEASE_SET_ID: release-set-v3-sha256-e01338de30cdc4c334e210f9e2bd75a67837420dd370b83964caae452f77522c
      CURRENT_RELEASE_SOURCE_SHA: 852dd515121011130dbd3d7726b72483ecc85aaf
      CURRENT_CONTROL_PLANE_RELEASE_ID: cloudflare-v1-sha256-6a76d530082fda59fe8d1304205a855667f09d0ea8efe56d6428c59b6035e82c
      CURRENT_MANIFEST_SHA256: cd57a6851a348c7044a628deae5a5804e0f7447cd0583c96bc61ad8f8812e10e
    steps:
      - name: Require exact accepted-main one-click invocation
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "iamaman11/part-crm-emai-profile"
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$GITHUB_SHA"
          test "$TARGET_ENVIRONMENT" = "staging"
          test "$COMPONENT" = "catalog"

      - name: Download exact immutable Release Set control-plane archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/v2-d1-one-click"
          mkdir -p "$RUNNER_TEMP/v2-d1-one-click/target" "$RUNNER_TEMP/v2-d1-one-click/current"
          gh release download "$TARGET_RELEASE_SET_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/v2-d1-one-click/target" \
            --pattern control-plane.tar
          gh release download "$CURRENT_RELEASE_SET_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/v2-d1-one-click/current" \
            --pattern control-plane.tar
          test -f "$RUNNER_TEMP/v2-d1-one-click/target/control-plane.tar"
          test -f "$RUNNER_TEMP/v2-d1-one-click/current/control-plane.tar"

      - name: Extract and verify exact canonical component manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['RUNNER_TEMP']) / 'v2-d1-one-click'
          expected = {
              'target': {
                  'manifest_sha256': os.environ['TARGET_MANIFEST_SHA256'],
                  'release_id': os.environ['TARGET_CONTROL_PLANE_RELEASE_ID'],
                  'source_sha': os.environ['TARGET_RELEASE_SOURCE_SHA'],
                  'schema': '0031_device_binding_governance.sql',
              },
              'current': {
                  'manifest_sha256': os.environ['CURRENT_MANIFEST_SHA256'],
                  'release_id': os.environ['CURRENT_CONTROL_PLANE_RELEASE_ID'],
                  'source_sha': os.environ['CURRENT_RELEASE_SOURCE_SHA'],
                  'schema': '0026_outbound_mail_intents.sql',
              },
          }

          import hashlib
          for label, contract in expected.items():
              archive_path = root / label / 'control-plane.tar'
              with tarfile.open(archive_path, mode='r:') as archive:
                  members = [
                      member for member in archive.getmembers()
                      if member.isfile() and PurePosixPath(member.name).name == 'release-manifest.json'
                  ]
                  if len(members) != 1:
                      raise SystemExit(f'{label}: expected exactly one release-manifest.json, observed {len(members)}')
                  extracted = archive.extractfile(members[0])
                  if extracted is None:
                      raise SystemExit(f'{label}: release manifest cannot be read')
                  raw = extracted.read()
              digest = hashlib.sha256(raw).hexdigest()
              if digest != contract['manifest_sha256']:
                  raise SystemExit(f'{label}: manifest digest mismatch: {digest}')
              manifest = json.loads(raw)
              canonical = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode()
              if canonical != raw:
                  raise SystemExit(f'{label}: manifest is not canonical JSON')
              if manifest.get('release_id') != contract['release_id']:
                  raise SystemExit(f'{label}: control-plane release identity mismatch')
              source = manifest.get('source') or {}
              if source.get('repository') != os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit(f'{label}: repository identity mismatch')
              if source.get('authority') != 'accepted-main':
                  raise SystemExit(f'{label}: source authority is not accepted-main')
              if source.get('commit_sha') != contract['source_sha']:
                  raise SystemExit(f'{label}: source SHA mismatch')
              migrations = manifest.get('migrations') or {}
              schema = manifest.get('schema_contract') or {}
              if migrations.get('latest') != contract['schema']:
                  raise SystemExit(f'{label}: migration target mismatch')
              if schema.get('database_component') != 'catalog':
                  raise SystemExit(f'{label}: schema component mismatch')
              if schema.get('target_schema_revision') != contract['schema']:
                  raise SystemExit(f'{label}: schema revision mismatch')
              (root / f'{label}-manifest.json').write_bytes(raw)
          PY

      - name: Revalidate exact main fence and dispatch canonical protected executor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$GITHUB_SHA"

          target_manifest="$(python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"v2-d1-one-click/target-manifest.json"; print(json.dumps(json.loads(p.read_text()), sort_keys=True, separators=(",",":")))')"
          current_manifest="$(python -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"v2-d1-one-click/current-manifest.json"; print(json.dumps(json.loads(p.read_text()), sort_keys=True, separators=(",",":")))')"
          confirmation="$GITHUB_SHA:$TARGET_ENVIRONMENT:$COMPONENT:$DATABASE_ID"

          gh workflow run d1-migration-executor.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field environment="$TARGET_ENVIRONMENT" \
            --raw-field source_sha="$GITHUB_SHA" \
            --raw-field component="$COMPONENT" \
            --raw-field account_id="$CLOUDFLARE_ACCOUNT_ID" \
            --raw-field database_name="$DATABASE_NAME" \
            --raw-field database_id="$DATABASE_ID" \
            --raw-field target_release_manifest_json="$target_manifest" \
            --raw-field current_release_manifest_json="$current_manifest" \
            --raw-field known_good_release_manifest_json="$current_manifest" \
            --raw-field preconditions_json='{}' \
            --raw-field mutation_authorized=true \
            --raw-field confirmation="$confirmation"

          echo "Dispatched canonical Protected D1 Migration Executor for exact main $GITHUB_SHA."
