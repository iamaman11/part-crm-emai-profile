name: Mailbox Secret Resolver Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options:
          - staging
          - production
      source_sha:
        description: Exact current accepted-main source commit for both releases
        required: true
        type: string
      resolver_release_run_id:
        description: Successful accepted-main resolver release workflow run ID
        required: true
        type: string
      resolver_artifact_id:
        description: Exact immutable resolver artifact ID
        required: true
        type: string
      resolver_artifact_digest:
        description: Exact GitHub sha256 digest of the resolver artifact
        required: true
        type: string
      resolver_release_id:
        description: Exact resolver release ID recorded in the immutable archive
        required: true
        type: string
      resolver_worker_sha256:
        description: Exact resolver Worker digest recorded in the immutable archive
        required: true
        type: string
      control_plane_release_run_id:
        description: Successful accepted-main Quality Gate run ID
        required: true
        type: string
      control_plane_artifact_id:
        description: Exact immutable control-plane artifact ID
        required: true
        type: string
      control_plane_artifact_digest:
        description: Exact GitHub sha256 digest of the control-plane artifact
        required: true
        type: string
      control_plane_release_id:
        description: Exact control-plane release ID recorded in the immutable archive
        required: true
        type: string
      staging_promotion_run_id:
        description: Successful exact-source staging promotion run; required only for production
        required: false
        type: string
      staging_evidence_artifact_id:
        description: Immutable metadata-only staging evidence artifact ID; required only for production
        required: false
        type: string
      staging_evidence_artifact_digest:
        description: Exact GitHub sha256 digest of staging evidence; required only for production
        required: false
        type: string
      staging_run_attempt:
        description: Exact staging promotion run attempt that produced the evidence; required only for production
        required: false
        type: string
      staging_evidence_confirmation:
        description: Re-enter source_sha and staging evidence digest, separated by one colon; required only for production
        required: false
        type: string
      confirmation:
        description: Re-enter source_sha to confirm this exact promotion request
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mailbox-secret-resolver-promotion-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Exact Accepted-Main Release Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Reject non-main or substituted workflow authority
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$CONFIRMATION" = "$SOURCE_SHA"

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate exact workflow, artifacts, and protected target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/mailbox-secret-resolver-promotion.py github-preflight
          --environment "${{ inputs.environment }}"
          --source-sha "${{ inputs.source_sha }}"
          --resolver-release-run-id "${{ inputs.resolver_release_run_id }}"
          --resolver-artifact-id "${{ inputs.resolver_artifact_id }}"
          --resolver-artifact-digest "${{ inputs.resolver_artifact_digest }}"
          --resolver-release-id "${{ inputs.resolver_release_id }}"
          --resolver-worker-sha256 "${{ inputs.resolver_worker_sha256 }}"
          --control-plane-release-run-id "${{ inputs.control_plane_release_run_id }}"
          --control-plane-artifact-id "${{ inputs.control_plane_artifact_id }}"
          --control-plane-artifact-digest "${{ inputs.control_plane_artifact_digest }}"
          --control-plane-release-id "${{ inputs.control_plane_release_id }}"
          --staging-promotion-run-id "${{ inputs.staging_promotion_run_id }}"
          --staging-evidence-artifact-id "${{ inputs.staging_evidence_artifact_id }}"
          --staging-evidence-artifact-digest "${{ inputs.staging_evidence_artifact_digest }}"
          --staging-run-attempt "${{ inputs.staging_run_attempt }}"
          --staging-evidence-confirmation "${{ inputs.staging_evidence_confirmation }}"
          --confirmation "${{ inputs.confirmation }}"
          --repository "$GITHUB_REPOSITORY"
          --workflow-ref "$GITHUB_REF"
          --workflow-sha "$GITHUB_SHA"
          --api-url "$GITHUB_API_URL"

      - name: Download exact immutable resolver artifact for release-identity preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAW_ARTIFACT_RUN_ID: ${{ inputs.resolver_release_run_id }}
          RAW_ARTIFACT_ID: ${{ inputs.resolver_artifact_id }}
          RAW_ARTIFACT_DIGEST: ${{ inputs.resolver_artifact_digest }}
          RAW_ARTIFACT_RELEASE_ID: ${{ inputs.resolver_release_id }}
          RAW_ARTIFACT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python scripts/mailbox-secret-resolver-promotion.py download-raw-artifact
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RAW_ARTIFACT_RUN_ID"
          --artifact-id "$RAW_ARTIFACT_ID"
          --source-sha "$RAW_ARTIFACT_SOURCE_SHA"
          --expected-digest "$RAW_ARTIFACT_DIGEST"
          --expected-name "$RAW_ARTIFACT_RELEASE_ID.tar"
          --destination "$RUNNER_TEMP/preflight-resolver-download/$RAW_ARTIFACT_RELEASE_ID.tar"

      - name: Download exact immutable control-plane artifact for release-identity preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAW_ARTIFACT_RUN_ID: ${{ inputs.control_plane_release_run_id }}
          RAW_ARTIFACT_ID: ${{ inputs.control_plane_artifact_id }}
          RAW_ARTIFACT_DIGEST: ${{ inputs.control_plane_artifact_digest }}
          RAW_ARTIFACT_RELEASE_ID: ${{ inputs.control_plane_release_id }}
          RAW_ARTIFACT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python scripts/mailbox-secret-resolver-promotion.py download-raw-artifact
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RAW_ARTIFACT_RUN_ID"
          --artifact-id "$RAW_ARTIFACT_ID"
          --source-sha "$RAW_ARTIFACT_SOURCE_SHA"
          --expected-digest "$RAW_ARTIFACT_DIGEST"
          --expected-name "$RAW_ARTIFACT_RELEASE_ID.tar"
          --destination "$RUNNER_TEMP/preflight-control-download/$RAW_ARTIFACT_RELEASE_ID.tar"

      - name: Verify exact immutable release identities before environment approval
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVER_RELEASE_ID: ${{ inputs.resolver_release_id }}
          RESOLVER_WORKER_SHA256: ${{ inputs.resolver_worker_sha256 }}
          CONTROL_PLANE_RELEASE_ID: ${{ inputs.control_plane_release_id }}
        run: |
          set -euo pipefail
          mapfile -t resolver_archives < <(find "$RUNNER_TEMP/preflight-resolver-download" -type f -name '*.tar' -print)
          mapfile -t control_archives < <(find "$RUNNER_TEMP/preflight-control-download" -type f -name '*.tar' -print)
          test "${#resolver_archives[@]}" -eq 1
          test "${#control_archives[@]}" -eq 1
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "${resolver_archives[0]}" --expected-source-sha "$SOURCE_SHA"
          python scripts/cloudflare-release.py verify-archive \
            --archive "${control_archives[0]}" --expected-source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --authority accepted-main
          mkdir -p "$RUNNER_TEMP/preflight-resolver-release" "$RUNNER_TEMP/preflight-control-release"
          tar -xf "${resolver_archives[0]}" -C "$RUNNER_TEMP/preflight-resolver-release"
          tar -xf "${control_archives[0]}" -C "$RUNNER_TEMP/preflight-control-release"
          mapfile -t resolver_dirs < <(find "$RUNNER_TEMP/preflight-resolver-release/mailbox-secret-resolver-release" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t control_dirs < <(find "$RUNNER_TEMP/preflight-control-release/cloudflare-release" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#resolver_dirs[@]}" -eq 1
          test "${#control_dirs[@]}" -eq 1
          python scripts/mailbox-secret-resolver-promotion.py validate-release-identities \
            --source-sha "$SOURCE_SHA" \
            --resolver-manifest "${resolver_dirs[0]}/release-manifest.json" \
            --control-plane-manifest "${control_dirs[0]}/release-manifest.json" \
            --resolver-release-id "$RESOLVER_RELEASE_ID" \
            --resolver-worker-sha256 "$RESOLVER_WORKER_SHA256" \
            --control-plane-release-id "$CONTROL_PLANE_RELEASE_ID"

      - name: Download and validate immutable staging evidence before production approval
        if: inputs.environment == 'production'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.staging_evidence_artifact_id }}
          path: ${{ runner.temp }}/preflight-staging-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.staging_promotion_run_id }}

      - name: Bind production request to exact passed staging evidence
        if: inputs.environment == 'production'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGING_PROMOTION_RUN_ID: ${{ inputs.staging_promotion_run_id }}
          STAGING_RUN_ATTEMPT: ${{ inputs.staging_run_attempt }}
          RESOLVER_RELEASE_ID: ${{ inputs.resolver_release_id }}
          RESOLVER_WORKER_SHA256: ${{ inputs.resolver_worker_sha256 }}
          CONTROL_PLANE_RELEASE_ID: ${{ inputs.control_plane_release_id }}
        run: |
          set -euo pipefail
          mapfile -t evidence_files < <(find "$RUNNER_TEMP/preflight-staging-evidence" -type f -name 'promotion-evidence.json' -print)
          test "${#evidence_files[@]}" -eq 1
          python scripts/mailbox-secret-resolver-promotion.py validate-staging-evidence \
            --evidence "${evidence_files[0]}" --source-sha "$SOURCE_SHA" \
            --resolver-release-id "$RESOLVER_RELEASE_ID" \
            --resolver-worker-sha256 "$RESOLVER_WORKER_SHA256" \
            --control-plane-release-id "$CONTROL_PLANE_RELEASE_ID" \
            --staging-promotion-run-id "$STAGING_PROMOTION_RUN_ID" \
            --staging-run-attempt "$STAGING_RUN_ATTEMPT"

  promote-same-bits:
    name: Resolver Then Control Plane To ${{ inputs.environment }}
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      actions: read
      contents: read
      deployments: write
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download exact immutable resolver artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAW_ARTIFACT_RUN_ID: ${{ inputs.resolver_release_run_id }}
          RAW_ARTIFACT_ID: ${{ inputs.resolver_artifact_id }}
          RAW_ARTIFACT_DIGEST: ${{ inputs.resolver_artifact_digest }}
          RAW_ARTIFACT_RELEASE_ID: ${{ inputs.resolver_release_id }}
          RAW_ARTIFACT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python scripts/mailbox-secret-resolver-promotion.py download-raw-artifact
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RAW_ARTIFACT_RUN_ID"
          --artifact-id "$RAW_ARTIFACT_ID"
          --source-sha "$RAW_ARTIFACT_SOURCE_SHA"
          --expected-digest "$RAW_ARTIFACT_DIGEST"
          --expected-name "$RAW_ARTIFACT_RELEASE_ID.tar"
          --destination "$RUNNER_TEMP/resolver-download/$RAW_ARTIFACT_RELEASE_ID.tar"

      - name: Download exact immutable control-plane artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RAW_ARTIFACT_RUN_ID: ${{ inputs.control_plane_release_run_id }}
          RAW_ARTIFACT_ID: ${{ inputs.control_plane_artifact_id }}
          RAW_ARTIFACT_DIGEST: ${{ inputs.control_plane_artifact_digest }}
          RAW_ARTIFACT_RELEASE_ID: ${{ inputs.control_plane_release_id }}
          RAW_ARTIFACT_SOURCE_SHA: ${{ inputs.source_sha }}
        run: >-
          python scripts/mailbox-secret-resolver-promotion.py download-raw-artifact
          --repository "$GITHUB_REPOSITORY"
          --run-id "$RAW_ARTIFACT_RUN_ID"
          --artifact-id "$RAW_ARTIFACT_ID"
          --source-sha "$RAW_ARTIFACT_SOURCE_SHA"
          --expected-digest "$RAW_ARTIFACT_DIGEST"
          --expected-name "$RAW_ARTIFACT_RELEASE_ID.tar"
          --destination "$RUNNER_TEMP/control-download/$RAW_ARTIFACT_RELEASE_ID.tar"

      - name: Verify and extract both immutable archives
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t resolver_archives < <(find "$RUNNER_TEMP/resolver-download" -type f -name '*.tar' -print)
          mapfile -t control_archives < <(find "$RUNNER_TEMP/control-download" -type f -name '*.tar' -print)
          test "${#resolver_archives[@]}" -eq 1
          test "${#control_archives[@]}" -eq 1
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "${resolver_archives[0]}" \
            --expected-source-sha "$SOURCE_SHA"
          python scripts/cloudflare-release.py verify-archive \
            --archive "${control_archives[0]}" \
            --expected-source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --authority accepted-main
          mkdir -p "$RUNNER_TEMP/resolver-release" "$RUNNER_TEMP/control-release"
          tar -xf "${resolver_archives[0]}" -C "$RUNNER_TEMP/resolver-release"
          tar -xf "${control_archives[0]}" -C "$RUNNER_TEMP/control-release"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Verify D1, deploy resolver then control plane, smoke, and attest
        id: promotion
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          deploy_manifest="$RUNNER_TEMP/deploy-manifest.json"
          resolver_config="$RUNNER_TEMP/resolver-deploy.jsonc"
          control_config="$RUNNER_TEMP/control-plane-deploy.jsonc"
          resolver_secret_inventory="$RUNNER_TEMP/resolver-secret-inventory.json"
          control_secret_inventory="$RUNNER_TEMP/control-secret-inventory.json"
          resolver_query="$RUNNER_TEMP/resolver-d1-migrations.json"
          control_query="$RUNNER_TEMP/control-d1-migrations.json"
          resolver_status="$RUNNER_TEMP/resolver-deployment-status.json"
          control_status="$RUNNER_TEMP/control-deployment-status.json"
          smoke_body="$RUNNER_TEMP/control-plane-smoke-body"
          evidence="$RUNNER_TEMP/promotion-evidence.json"
          trap 'rm -f "$deploy_manifest" "$resolver_config" "$control_config" "$resolver_secret_inventory" "$control_secret_inventory"' EXIT
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ACCESS_CLIENT_ID"
          test -n "$ACCESS_CLIENT_SECRET"
          test -n "$DEPLOY_MANIFEST_JSON"
          printf '%s' "$DEPLOY_MANIFEST_JSON" > "$deploy_manifest"
          unset DEPLOY_MANIFEST_JSON
          chmod 0600 "$deploy_manifest"
          mapfile -t resolver_dirs < <(find "$RUNNER_TEMP/resolver-release/mailbox-secret-resolver-release" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t control_dirs < <(find "$RUNNER_TEMP/control-release/cloudflare-release" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#resolver_dirs[@]}" -eq 1
          test "${#control_dirs[@]}" -eq 1
          python scripts/mailbox-secret-resolver-promotion.py prepare \
            --environment "$TARGET_ENVIRONMENT" \
            --deploy-manifest "$deploy_manifest" \
            --resolver-release "${resolver_dirs[0]}" \
            --control-plane-release "${control_dirs[0]}" \
            --resolver-output "$resolver_config" \
            --control-plane-output "$control_config"
          node .github/scripts/worker-secret-bindings.mjs --normalize \
            --environment "$TARGET_ENVIRONMENT" \
            --source-config "${resolver_dirs[0]}/deploy/cloudflare/mailbox-secret-resolver.wrangler.jsonc" \
            --rendered-config "$resolver_config"
          node .github/scripts/worker-secret-bindings.mjs --normalize \
            --environment "$TARGET_ENVIRONMENT" \
            --source-config "${control_dirs[0]}/deploy/cloudflare/wrangler.jsonc" \
            --rendered-config "$control_config"
          python scripts/mailbox-secret-resolver-promotion.py validate-release-identities \
            --source-sha "$SOURCE_SHA" \
            --resolver-manifest "${resolver_dirs[0]}/release-manifest.json" \
            --control-plane-manifest "${control_dirs[0]}/release-manifest.json" \
            --resolver-release-id "${{ inputs.resolver_release_id }}" \
            --resolver-worker-sha256 "${{ inputs.resolver_worker_sha256 }}" \
            --control-plane-release-id "${{ inputs.control_plane_release_id }}"
          npx --yes wrangler@4.94.0 secret list \
            --config "$resolver_config" --env "$TARGET_ENVIRONMENT" \
            --format json > "$resolver_secret_inventory"
          npx --yes wrangler@4.94.0 secret list \
            --config "$control_config" --env "$TARGET_ENVIRONMENT" \
            --format json > "$control_secret_inventory"
          node .github/scripts/worker-secret-bindings.mjs \
            --config "$resolver_config" --environment "$TARGET_ENVIRONMENT" \
            --secret-list "$resolver_secret_inventory"
          node .github/scripts/worker-secret-bindings.mjs \
            --config "$control_config" --environment "$TARGET_ENVIRONMENT" \
            --secret-list "$control_secret_inventory"
          npx --yes wrangler@4.94.0 deploy --dry-run \
            --config "$resolver_config" --env "$TARGET_ENVIRONMENT" \
            --strict --experimental-autoconfig=false
          npx --yes wrangler@4.94.0 deploy --dry-run \
            --config "$control_config" --env "$TARGET_ENVIRONMENT" \
            --strict --experimental-autoconfig=false
          npx --yes wrangler@4.94.0 d1 execute RESOLVER_DB \
            --remote --env "$TARGET_ENVIRONMENT" --config "$resolver_config" \
            --command 'SELECT name FROM d1_migrations ORDER BY id;' --json > "$resolver_query"
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB \
            --remote --env "$TARGET_ENVIRONMENT" --config "$control_config" \
            --command 'SELECT name FROM d1_migrations ORDER BY id;' --json > "$control_query"
          python scripts/mailbox-secret-resolver-promotion.py verify-remote-d1 \
            --resolver-release "${resolver_dirs[0]}" \
            --control-plane-release "${control_dirs[0]}" \
            --resolver-query "$resolver_query" \
            --control-query "$control_query"
          resolver_release_id="$(jq -r '.release_id' "${resolver_dirs[0]}/release-manifest.json")"
          control_release_id="$(jq -r '.release_id' "${control_dirs[0]}/release-manifest.json")"
          npx --yes wrangler@4.94.0 deploy \
            --config "$resolver_config" --env "$TARGET_ENVIRONMENT" \
            --strict \
            --message "source=$SOURCE_SHA release=$resolver_release_id" \
            --experimental-autoconfig=false
          npx --yes wrangler@4.94.0 deploy \
            --config "$control_config" --env "$TARGET_ENVIRONMENT" \
            --strict \
            --message "source=$SOURCE_SHA release=$control_release_id resolver=$resolver_release_id" \
            --experimental-autoconfig=false
          npx --yes wrangler@4.94.0 deployments status \
            --config "$resolver_config" --env "$TARGET_ENVIRONMENT" --json > "$resolver_status"
          npx --yes wrangler@4.94.0 deployments status \
            --config "$control_config" --env "$TARGET_ENVIRONMENT" --json > "$control_status"
          custom_domain="$(jq -r '.control_plane.custom_domain' "$deploy_manifest")"
          curl --fail --silent --show-error --location --retry 3 \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            "https://$custom_domain/api/v1/health" > "$smoke_body"
          test -s "$smoke_body"
          python scripts/mailbox-secret-resolver-promotion.py attest \
            --environment "$TARGET_ENVIRONMENT" \
            --resolver-manifest "${resolver_dirs[0]}/release-manifest.json" \
            --control-plane-manifest "${control_dirs[0]}/release-manifest.json" \
            --resolver-status "$resolver_status" \
            --control-plane-status "$control_status" \
            --smoke-body "$smoke_body" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --evidence-output "$evidence"

      - name: Upload immutable metadata-only promotion evidence
        id: staging-evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mailbox-secret-resolver-promotion-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: ${{ steps.promotion.outputs.evidence }}
          if-no-files-found: error
          retention-days: 30
