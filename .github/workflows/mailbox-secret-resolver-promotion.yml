name: Mailbox Secret Resolver Promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected target environment
        required: true
        type: choice
        options:
          - staging
          - production
      source_sha:
        description: Exact accepted-main source commit
        required: true
        type: string
      resolver_release_run_id:
        description: Successful resolver release workflow run ID
        required: true
        type: string
      control_plane_release_run_id:
        description: Successful Quality Gate run ID containing the D2 artifact
        required: true
        type: string
      staging_evidence_path:
        description: Tracked accepted staging evidence; required only for production
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: mailbox-secret-resolver-promotion-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  promote-same-bits:
    name: Same Bits To ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate immutable workflow-run provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RESOLVER_RUN_ID: ${{ inputs.resolver_release_run_id }}
          CONTROL_RUN_ID: ${{ inputs.control_plane_release_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESOLVER_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CONTROL_RUN_ID" =~ ^[0-9]+$ ]]
          resolver_run="$RUNNER_TEMP/resolver-run.json"
          control_run="$RUNNER_TEMP/control-run.json"
          trap 'rm -f "$resolver_run" "$control_run"' EXIT
          umask 077
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RESOLVER_RUN_ID" \
            > "$resolver_run"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN_ID" \
            > "$control_run"
          jq -e --arg sha "$SOURCE_SHA" '
            .name == "Mailbox Secret Resolver Release" and
            .event == "push" and .head_branch == "main" and
            .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' "$resolver_run" > /dev/null
          jq -e --arg sha "$SOURCE_SHA" '
            .name == "Quality Gate" and
            .event == "push" and .head_branch == "main" and
            .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' "$control_run" > /dev/null

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Download immutable resolver archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mailbox-secret-resolver-*
          path: ${{ runner.temp }}/resolver-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resolver_release_run_id }}

      - name: Download exact control-plane D2 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: artifact
          path: ${{ runner.temp }}/control-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.control_plane_release_run_id }}

      - name: Verify and extract both immutable archives
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -t resolver_archives < <(find "$RUNNER_TEMP/resolver-download" -type f -name '*.tar' -print)
          mapfile -t control_archives < <(find "$RUNNER_TEMP/control-download" -type f -name '*.tar' -print)
          test "${#resolver_archives[@]}" -eq 1
          test "${#control_archives[@]}" -eq 1
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "${resolver_archives[0]}" \
            --expected-source-sha "$SOURCE_SHA"
          python scripts/cloudflare-release.py verify-archive \
            --archive "${control_archives[0]}" \
            --expected-source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --authority accepted-main
          mkdir -p "$RUNNER_TEMP/resolver-release" "$RUNNER_TEMP/control-release"
          tar -xf "${resolver_archives[0]}" -C "$RUNNER_TEMP/resolver-release"
          tar -xf "${control_archives[0]}" -C "$RUNNER_TEMP/control-release"

      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Deploy resolver then exact D3 control plane with secret files
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGING_EVIDENCE_PATH: ${{ inputs.staging_evidence_path }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          RESOLVER_SECRETS_JSON: ${{ secrets.CLOUDFLARE_RESOLVER_SECRETS_JSON }}
          CONTROL_PLANE_SECRETS_JSON: ${{ secrets.CLOUDFLARE_CONTROL_PLANE_SECRETS_JSON }}
          DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          resolver_secrets="$RUNNER_TEMP/resolver-secrets.json"
          control_secrets="$RUNNER_TEMP/control-plane-secrets.json"
          deploy_manifest="$RUNNER_TEMP/deploy-manifest.json"
          resolver_config="$RUNNER_TEMP/resolver-deploy.jsonc"
          control_config="$RUNNER_TEMP/control-plane-deploy.jsonc"
          evidence="$RUNNER_TEMP/promotion-evidence.json"
          trap 'rm -f "$resolver_secrets" "$control_secrets" "$deploy_manifest" "$resolver_config" "$control_config"' EXIT
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$ACCESS_CLIENT_ID"
          test -n "$ACCESS_CLIENT_SECRET"
          test -n "$RESOLVER_SECRETS_JSON"
          test -n "$CONTROL_PLANE_SECRETS_JSON"
          test -n "$DEPLOY_MANIFEST_JSON"
          printf '%s' "$RESOLVER_SECRETS_JSON" > "$resolver_secrets"
          printf '%s' "$CONTROL_PLANE_SECRETS_JSON" > "$control_secrets"
          printf '%s' "$DEPLOY_MANIFEST_JSON" > "$deploy_manifest"
          unset RESOLVER_SECRETS_JSON CONTROL_PLANE_SECRETS_JSON DEPLOY_MANIFEST_JSON
          chmod 0600 "$resolver_secrets" "$control_secrets" "$deploy_manifest"
          python scripts/mailbox-secret-resolver-promotion.py validate-secrets \
            --resolver "$resolver_secrets" \
            --control-plane "$control_secrets"
          mapfile -t resolver_dirs < <(find "$RUNNER_TEMP/resolver-release/mailbox-secret-resolver-release" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t control_dirs < <(find "$RUNNER_TEMP/control-release/cloudflare-release" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#resolver_dirs[@]}" -eq 1
          test "${#control_dirs[@]}" -eq 1
          python scripts/mailbox-secret-resolver-promotion.py prepare \
            --environment "$TARGET_ENVIRONMENT" \
            --deploy-manifest "$deploy_manifest" \
            --resolver-release "${resolver_dirs[0]}" \
            --control-plane-release "${control_dirs[0]}" \
            --resolver-output "$resolver_config" \
            --control-plane-output "$control_config"
          if test "$TARGET_ENVIRONMENT" = production; then
            case "$STAGING_EVIDENCE_PATH" in
              docs/evidence/*.json) ;;
              *) echo 'Production requires one tracked accepted staging evidence file.' >&2; exit 1 ;;
            esac
            git ls-files --error-unmatch "$STAGING_EVIDENCE_PATH" > /dev/null
            python scripts/mailbox-secret-resolver-promotion.py validate-staging-evidence \
              --evidence "$STAGING_EVIDENCE_PATH" \
              --resolver-manifest "${resolver_dirs[0]}/release-manifest.json" \
              --control-plane-manifest "${control_dirs[0]}/release-manifest.json"
          else
            test -z "$STAGING_EVIDENCE_PATH"
          fi
          npx --yes wrangler@4.30.0 deploy \
            --config "$resolver_config" \
            --env "$TARGET_ENVIRONMENT" \
            --no-bundle \
            --secrets-file "$resolver_secrets"
          npx --yes wrangler@4.30.0 deploy \
            --config "$control_config" \
            --env "$TARGET_ENVIRONMENT" \
            --no-bundle \
            --secrets-file "$control_secrets"
          custom_domain="$(jq -r '.control_plane.custom_domain' "$deploy_manifest")"
          curl --fail --silent --show-error \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            "https://$custom_domain/api/v1/health" > /dev/null
          resolver_release_id="$(jq -r '.release_id' "${resolver_dirs[0]}/release-manifest.json")"
          control_release_id="$(jq -r '.release_id' "${control_dirs[0]}/release-manifest.json")"
          jq -n \
            --arg environment "$TARGET_ENVIRONMENT" \
            --arg source "$SOURCE_SHA" \
            --arg resolver_release_id "$resolver_release_id" \
            --arg control_release_id "$control_release_id" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:1,status:"passed_unaccepted",environment:$environment,source_commit_sha:$source,resolver_release_id:$resolver_release_id,control_plane_release_id:$control_release_id,workflow_run_id:$run_id}' \
            > "$evidence"
          chmod 0600 "$evidence"

      - name: Upload non-secret promotion evidence candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mailbox-secret-resolver-promotion-${{ inputs.environment }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/promotion-evidence.json
          archive: false
          if-no-files-found: error
          retention-days: 30
