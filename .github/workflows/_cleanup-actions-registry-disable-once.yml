name: Cleanup Actions Registry Disable Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/_cleanup-actions-registry-disable-once.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-registry-disable-once
  cancel-in-progress: false

jobs:
  disable:
    name: Complete accepted obsolete workflow retirement once
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BEFORE: 923672fd9f5fbdfacd8685143151e5ed322cb3cf
      CLASSIFICATION: docs/evidence/2026-08-18-post-ar8c-actions-registry-classification.json
      RESOLUTIONS: docs/evidence/2026-08-18-post-ar8c-actions-registry-exception-resolutions.json
    steps:
      - name: Checkout exact cleanup recovery source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact accepted recovery authority
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EVENT_BEFORE" = "$EXPECTED_BEFORE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          c = json.loads(Path('docs/evidence/2026-08-18-post-ar8c-actions-registry-classification.json').read_text())
          r = json.loads(Path('docs/evidence/2026-08-18-post-ar8c-actions-registry-exception-resolutions.json').read_text())
          assert c['schema_version'] == 1
          assert c['source_accepted_main_sha'] == '85c6d42d877108274bfac3b30042164dca0bec41'
          assert c['registered_workflow_count'] == 198
          assert c['tracked_main_workflow_count'] == 22
          assert c['decision_counts'] == {
              'DISABLE_REGISTRATION': 176,
              'KEEP_ACTIVE': 16,
              'RETIRE_FILE_AND_DISABLE': 6,
          }
          assert c['duplicate_registration_paths'] == []
          rows = c['registrations']
          assert len([x for x in rows if x['decision'] == 'DISABLE_REGISTRATION']) == 176
          assert len([x for x in rows if x['decision'] == 'RETIRE_FILE_AND_DISABLE']) == 6
          assert len([x for x in rows if x['decision'] == 'KEEP_ACTIVE']) == 16
          resolved = {x['registration_id'] for x in r['resolutions']}
          expected_deleted = {336458189, 336440298, 336271160, 336190565, 335828549, 336180935}
          assert resolved == expected_deleted
          retire_rows = {x['id'] for x in rows if x['decision'] == 'RETIRE_FILE_AND_DISABLE'}
          assert retire_rows == expected_deleted
          assert r['invariants']['required_checks_weakened'] is False
          assert r['invariants']['canonical_promotion_authority_preserved'] is True
          assert r['invariants']['canonical_release_authority_preserved'] is True
          assert r['invariants']['production_mutation'] is False
          PY

      - name: Prove retired files absent and current authorities present
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            .github/workflows/ar8c-credential-bundle-recovery.yml
            .github/workflows/ar8c-credential-recovery-assessment.yml
            .github/workflows/ar8c-provider-bootstrap-execution.yml
            .github/workflows/ar8c-resolver-schema-convergence.yml
            .github/workflows/ar8c-staging-bootstrap-preflight.yml
            .github/workflows/ar8c-staging-provider-bootstrap.yml
          )
          for path in "${retired[@]}"; do test ! -e "$path"; done
          test -f .github/workflows/mailbox-secret-resolver-promotion.yml
          test -f .github/workflows/mailbox-secret-resolver-release.yml
          test -f .github/workflows/quality-gate.yml
          test -f .github/workflows/github-governance-gate.yml

      - name: Complete exact baseline registry retirement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')

          fetch_registry() {
            local output="$1" page=1 count part next
            printf '[]\n' > "$output"
            while :; do
              part="$RUNNER_TEMP/registry-$page.json"
              curl --silent --show-error --fail-with-body "${auth[@]}" "$api/actions/workflows?per_page=100&page=$page" > "$part"
              count="$(jq '.workflows | length' "$part")"
              next="$RUNNER_TEMP/registry-next.json"
              jq -s '.[0] + .[1].workflows' "$output" "$part" > "$next"
              mv "$next" "$output"
              [ "$count" -lt 100 ] && break
              page=$((page + 1))
            done
          }

          before="$RUNNER_TEMP/registry-before.json"
          fetch_registry "$before"

          mapfile -t keep_paths < <(jq -r '.registrations[] | select(.decision == "KEEP_ACTIVE") | .path' "$CLASSIFICATION" | sort)
          test "${#keep_paths[@]}" -eq 16
          for path in "${keep_paths[@]}"; do
            test "$(jq --arg p "$path" '[.[] | select(.path == $p and .state == "active")] | length' "$before")" = '1'
          done

          changed=0
          already_disabled=0
          deleted_terminal=0
          while IFS=$'\t' read -r id path decision; do
            listed_state="$(jq -r --argjson id "$id" '[.[] | select(.id == $id)][0].state // "missing"' "$before")"
            if [ "$decision" = 'RETIRE_FILE_AND_DISABLE' ]; then
              test "$listed_state" = 'missing'
              body="$RUNNER_TEMP/deleted-$id.json"
              code="$(curl --silent --show-error "${auth[@]}" --output "$body" --write-out '%{http_code}' "$api/actions/workflows/$id")"
              test "$code" = '200'
              test "$(jq -r '.id' "$body")" = "$id"
              test "$(jq -r '.path' "$body")" = "$path"
              test "$(jq -r '.state' "$body")" = 'deleted'
              deleted_terminal=$((deleted_terminal + 1))
              continue
            fi
            test "$decision" = 'DISABLE_REGISTRATION'
            if [ "$listed_state" = 'disabled_manually' ]; then
              already_disabled=$((already_disabled + 1))
            elif [ "$listed_state" = 'active' ]; then
              code="$(curl --silent --show-error --request PUT "${auth[@]}" --output "$RUNNER_TEMP/disable-$id.txt" --write-out '%{http_code}' "$api/actions/workflows/$id/disable")"
              test "$code" = '204'
              changed=$((changed + 1))
            else
              echo "Unexpected state for baseline obsolete registration $id ($path): $listed_state" >&2
              exit 1
            fi
          done < <(jq -r '.registrations[] | select(.decision != "KEEP_ACTIVE") | [.id,.path,.decision] | @tsv' "$CLASSIFICATION")

          test "$deleted_terminal" -eq 6
          test $((changed + already_disabled)) -eq 176

          after="$RUNNER_TEMP/registry-after.json"
          fetch_registry "$after"
          while IFS=$'\t' read -r id path; do
            state="$(jq -r --argjson id "$id" '[.[] | select(.id == $id)][0].state // "missing"' "$after")"
            test "$state" = 'disabled_manually'
          done < <(jq -r '.registrations[] | select(.decision == "DISABLE_REGISTRATION") | [.id,.path] | @tsv' "$CLASSIFICATION")
          for path in "${keep_paths[@]}"; do
            test "$(jq --arg p "$path" '[.[] | select(.path == $p and .state == "active")] | length' "$after")" = '1'
          done

          echo "newly disabled: $changed" >> "$GITHUB_STEP_SUMMARY"
          echo "already disabled from attempt 1: $already_disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "provider-deleted retired AR-8C registrations: $deleted_terminal" >> "$GITHUB_STEP_SUMMARY"
          echo "current authorities preserved active: ${#keep_paths[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Disable this recovery executor last
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(--header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' --header 'X-GitHub-Api-Version: 2022-11-28')
          code="$(curl --silent --show-error --request PUT "${auth[@]}" --output "$RUNNER_TEMP/disable-self.txt" --write-out '%{http_code}' "$api/actions/workflows/_cleanup-actions-registry-disable-once.yml/disable")"
          test "$code" = '204'
          state="$(curl --silent --show-error --fail-with-body "${auth[@]}" "$api/actions/workflows/_cleanup-actions-registry-disable-once.yml" | jq -r '.state')"
          test "$state" = 'disabled_manually'
          echo 'Registry retirement recovery completed; historical run provenance preserved; current authorities remain active.' >> "$GITHUB_STEP_SUMMARY"
