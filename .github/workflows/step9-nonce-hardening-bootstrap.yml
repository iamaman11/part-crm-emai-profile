name: Step 9 Nonce Hardening Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Bind nonce claims to actual DEK bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          text = replace_one(
              text,
              "pub struct GenerationDek {\n",
              '''#[derive(Clone, Copy, Eq, Hash, Ord, PartialEq, PartialOrd)]
          pub(crate) struct NonceDomain([u8; 32]);

          pub struct GenerationDek {
          ''',
              "nonce domain type",
          )
          text = replace_one(
              text,
              '''    #[must_use]
              pub const fn key_id(&self) -> &KeyId {
                  &self.key_id
              }

              fn cipher(&self) -> Result<XChaCha20Poly1305, EncryptedGenerationError> {
          ''',
              '''    #[must_use]
              pub const fn key_id(&self) -> &KeyId {
                  &self.key_id
              }

              pub(crate) fn nonce_domain(&self) -> NonceDomain {
                  let mut digest = Sha256::new();
                  digest.update(b"profile-platform-generation-nonce-domain-v1");
                  digest.update(self.bytes);
                  NonceDomain(digest.finalize().into())
              }

              fn cipher(&self) -> Result<XChaCha20Poly1305, EncryptedGenerationError> {
          ''',
              "nonce domain derivation",
          )
          container.write_text(text, encoding="utf-8")

          lifecycle = Path("crates/encrypted-generation-domain/src/lifecycle.rs")
          text = lifecycle.read_text(encoding="utf-8")
          text = replace_one(
              text,
              '''use crate::{
              ContainerDigest, EncryptedGenerationError, GenerationDek, GenerationMetadata, KeyId,
              NoncePrefix, open_generation_expected, seal_generation,
          };
          ''',
              '''use crate::container::NonceDomain;
          use crate::{
              ContainerDigest, EncryptedGenerationError, GenerationDek, GenerationMetadata,
              NoncePrefix, open_generation_expected, seal_generation,
          };
          ''',
              "nonce domain import",
          )
          text = replace_one(
              text,
              "#[derive(Clone, Debug, Default, Eq, PartialEq)]\npub struct CloudGenerationRepository {",
              "#[derive(Clone, Default, Eq, PartialEq)]\npub struct CloudGenerationRepository {",
              "repository debug removal",
          )
          text = replace_one(
              text,
              "    nonce_claims: BTreeMap<(KeyId, NoncePrefix), GenerationId>,",
              "    nonce_claims: BTreeMap<(NonceDomain, NoncePrefix), GenerationId>,",
              "nonce claim map",
          )
          text = replace_one(
              text,
              "        let nonce_claim = (metadata.key_id().clone(), metadata.nonce_prefix());",
              "        let nonce_claim = (key.nonce_domain(), metadata.nonce_prefix());",
              "nonce claim construction",
          )
          lifecycle.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          text = replace_one(
              text,
              '''fn key(byte: u8) -> Result<GenerationDek, EncryptedGenerationError> {
              Ok(GenerationDek::new(key_id()?, [byte; 32]))
          }
          ''',
              '''fn key(byte: u8) -> Result<GenerationDek, EncryptedGenerationError> {
              Ok(GenerationDek::new(key_id()?, [byte; 32]))
          }

          fn key_with_id(value: &str, byte: u8) -> Result<GenerationDek, EncryptedGenerationError> {
              Ok(GenerationDek::new(KeyId::parse(value)?, [byte; 32]))
          }
          ''',
              "key alias helper",
          )
          anchor = "\n#[test]\nfn pointer_compare_and_swap_and_rollback_are_strict()"
          regression = '''
          #[test]
          fn nonce_reuse_is_detected_across_key_id_aliases()
          -> Result<(), Box<dyn std::error::Error>> {
              let mut repository = CloudGenerationRepository::default();
              let first_plaintext = b"same key bytes first alias";
              let first = metadata("generation_01JSTEP9ALIAS1", 0x4a, first_plaintext)?;
              repository.publish(
                  first,
                  &key_with_id("generation_key_01JSTEP9", 0x5a)?,
                  first_plaintext,
                  UnixMillis::new(1),
              )?;

              let (tenant_id, profile_id, generation_id) = ids("generation_01JSTEP9ALIAS2")?;
              let second_plaintext = b"same key bytes second alias";
              let second = GenerationMetadata::for_plaintext(
                  GenerationIdentity::new(tenant_id, profile_id, generation_id, None),
                  KeyId::parse("alternate_key_01JSTEP9")?,
                  NoncePrefix::new([0x4a; 16]),
                  1_024,
                  second_plaintext,
              )?;
              assert_eq!(
                  repository.publish(
                      second,
                      &key_with_id("alternate_key_01JSTEP9", 0x5a)?,
                      second_plaintext,
                      UnixMillis::new(2),
                  ),
                  Err(EncryptedGenerationError::NonceReuse)
              );
              Ok(())
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"nonce alias anchor: expected one match, found {text.count(anchor)}")
          text = text.replace(anchor, regression + anchor, 1)
          tests.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo test --locked -p encrypted-generation-domain nonce_reuse

      - name: Commit nonce hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/encrypted-generation-domain
          git commit -m "Repository Step 9: bind nonce reuse to DEK bytes"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
