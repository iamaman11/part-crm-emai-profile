name: AR-11 FC-4 Mutation Fence Helper

on:
  push:
    branches:
      - codex/ar11-functional-closure-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout working branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: codex/ar11-functional-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and prove FC-4 mutation boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          python scripts/_ar11_fc4_patch_temp.py
          node .github/scripts/release-operational-ar11.mjs --self-test
          node .github/scripts/release-operational-ar11.mjs
          git diff --check
          git rm .github/workflows/ar11-fc4-mutation-fence-helper.yml scripts/_ar11_fc4_patch_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-set-promotion.yml .github/scripts/release-operational-ar11.mjs
          git commit -m "AR-11 FC-4: harden mutation fence and credential boundary"
          git push origin HEAD:codex/ar11-functional-closure-v2
