name: Cross-Component Acceptance Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cross-component-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-synthetic:
    name: Repository-Local Standalone Flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Validate deterministic acceptance manifests and composition surfaces
        run: |
          python -m py_compile scripts/test-cross-component-acceptance.py scripts/check-phase2f-retained-operator.py scripts/check-phase2i-hardening.py scripts/check-phase2i-operational-bounds.py scripts/check-phase2i-supply-chain.py scripts/check-phase2i-support-bundle.py scripts/test-phase2i-d1-backup-restore.py
          python scripts/test-cross-component-acceptance.py
          python scripts/check-phase2f-retained-operator.py
          python scripts/check-phase2f-retained-operator.py --self-test
          python scripts/check-phase2i-hardening.py
          python scripts/check-phase2i-hardening.py --self-test
          python scripts/check-phase2i-operational-bounds.py
          python scripts/check-phase2i-operational-bounds.py --self-test
          python scripts/check-phase2i-supply-chain.py
          python scripts/check-phase2i-supply-chain.py --self-test
          python scripts/check-phase2i-support-bundle.py
          python scripts/check-phase2i-support-bundle.py --self-test

      - name: Prove realtime UI privacy and authority negative matrix
        run: |
          python scripts/check-phase2g-realtime-boundaries.py
          python scripts/check-phase2g-realtime-boundaries.py --self-test
          python scripts/check-phase2h-ui-boundaries.py
          python scripts/check-phase2h-ui-boundaries.py --self-test

      - name: Prove immutable generation registry and activation invariants
        run: |
          python scripts/test-profile-generation-registry.py
          python scripts/test-profile-generation-registry-edge-cases.py
          python scripts/test-profile-generation-integrity-guards.py

      - name: Execute repository-local backup restore drill
        run: python scripts/test-phase2i-d1-backup-restore.py

      - name: Verify installed Rust dependency licenses
        run: python scripts/check-phase2i-supply-chain.py --cargo-licenses

      - name: Test and execute synthetic Profile Bridge operator flow
        run: |
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/profile-bridge-metadata.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'profile-bridge-metadata.json').read_text())
          package = next(package for package in metadata['packages'] if package['name'] == 'profile-bridge')
          targets = {target['name']: target for target in package['targets']}
          assert set(name for name, target in targets.items() if 'bin' in target['kind']) == {
              'profile-bridge',
              'profile-bridge-synthetic',
          }
          assert targets['profile-bridge'].get('required-features', []) == []
          assert targets['profile-bridge-synthetic'].get('required-features', []) == ['synthetic-test-bin']
          PY
          cargo test --locked -p profile-bridge --all-targets --features synthetic-test-bin
          root="$RUNNER_TEMP/cross-component-profile"
          rm -rf "$root"
          cargo run --locked -p profile-bridge --features synthetic-test-bin --bin profile-bridge-synthetic -- \
            'profilebridge://claim/claim_0123456789abcdef0123456789abcdef' "$root" \
            | tee "$RUNNER_TEMP/profile-bridge-synthetic.out"
          grep -Fxq 'synthetic-operator-complete state=DIRTY_LOCAL_COMMITTED_GENERATION' "$RUNNER_TEMP/profile-bridge-synthetic.out"

      - name: Clean install frontend from exact lockfile
        working-directory: frontend
        run: npm ci

      - name: Verify installed npm dependency licenses
        run: python scripts/check-phase2i-supply-chain.py --node-licenses

      - name: Verify metadata-only acceptance output
        run: |
          python -m json.tool tests/cross-component/standalone-acceptance.json >/dev/null
          python -m json.tool tests/cross-component/phase2i-release-candidate.json >/dev/null
          python -m json.tool tests/operations/phase2i-operational-bounds.json >/dev/null
          python -m json.tool tests/support/phase2i-support-bundle.json >/dev/null
          if grep -R -n -E --include='*.json' '(password|access.?token|oauth|cookie|message.?body|credential.?value|raw.?secret)' tests/cross-component tests/operations; then
            echo "Sensitive field found in Phase 2I repository-local acceptance evidence." >&2
            exit 1
          fi
