name: Cross-Component Acceptance Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cross-component-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-synthetic:
    name: Repository-Local Standalone Flow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Validate deterministic acceptance manifest and composition surfaces
        run: |
          python -m py_compile scripts/test-cross-component-acceptance.py
          python scripts/test-cross-component-acceptance.py

      - name: Prove governed tenant client profile and mailbox invariants
        run: |
          python scripts/test-d1-schema.py
          python scripts/test-step4-identity-acl.py
          python scripts/test-step4-command-guards.py
          python scripts/test-step5-coordinator-projection.py
          python scripts/test-mailbox-vertical-slice.py
          if python scripts/test-step4-identity-acl.py --negative-fixture tests/identity-acl/fixtures/assignment-authorizes.sql; then
            echo "Assignment-derived authorization unexpectedly passed." >&2
            exit 1
          fi

      - name: Prove immutable generation registry and activation invariants
        run: |
          python scripts/test-profile-generation-registry.py
          python scripts/test-profile-generation-registry-edge-cases.py
          python scripts/test-profile-generation-integrity-guards.py

      - name: Test typed Worker and adapter composition
        run: |
          cargo test --locked -p cloudflare-adapters --lib
          cargo test --locked -p browser-profile-control-plane-worker --lib
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown

      - name: Test and execute synthetic Profile Bridge operator flow
        run: |
          cargo test --locked -p profile-bridge --all-targets
          root="$RUNNER_TEMP/cross-component-profile"
          rm -rf "$root"
          cargo run --locked -p profile-bridge --bin profile-bridge-synthetic -- \
            'profilebridge://claim/claim_0123456789abcdef' "$root" \
            | tee "$RUNNER_TEMP/profile-bridge-synthetic.out"
          grep -Fxq 'synthetic-operator-complete state=DIRTY_LOCAL' "$RUNNER_TEMP/profile-bridge-synthetic.out"

      - name: Clean install frontend from exact lockfile
        working-directory: frontend
        run: npm ci

      - name: Test frontend contract and neutral projection boundary
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify metadata-only acceptance output
        run: |
          python -m json.tool tests/cross-component/standalone-acceptance.json >/dev/null
          test -f frontend/dist/index.html
          if grep -R -n -E --include='*.json' '(password|access.?token|oauth|cookie|message.?body|credential.?value|raw.?secret)' tests/cross-component; then
            echo "Sensitive field found in cross-component acceptance evidence." >&2
            exit 1
          fi
