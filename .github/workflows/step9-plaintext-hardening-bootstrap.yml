name: Step 9 Plaintext Hardening Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Zeroize plaintext results and avoid wrong-key quarantine
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_one(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          text = replace_one(
              text,
              "use zeroize::Zeroize;",
              "use zeroize::{Zeroize, Zeroizing};",
              "zeroizing import",
          )
          text = replace_one(
              text,
              '''#[derive(Clone, Debug, Eq, PartialEq)]
          pub struct OpenedGeneration {
              metadata: GenerationMetadata,
              plaintext: Vec<u8>,
          }
          ''',
              '''pub struct OpenedGeneration {
              metadata: GenerationMetadata,
              plaintext: Zeroizing<Vec<u8>>,
          }
          ''',
              "opened result type",
          )
          text = replace_one(
              text,
              '''    #[must_use]
              pub fn into_plaintext(self) -> Vec<u8> {
                  self.plaintext
              }
          }
          ''',
              '''    pub(crate) fn into_parts(self) -> (GenerationMetadata, Zeroizing<Vec<u8>>) {
                  (self.metadata, self.plaintext)
              }
          }
          ''',
              "opened result transfer",
          )
          text = replace_one(
              text,
              '''    let mut plaintext = Vec::with_capacity(
                  usize::try_from(metadata.plaintext_bytes())
                      .map_err(|_| EncryptedGenerationError::PlaintextTooLarge)?,
              );
          ''',
              '''    let mut plaintext = Zeroizing::new(Vec::with_capacity(
                  usize::try_from(metadata.plaintext_bytes())
                      .map_err(|_| EncryptedGenerationError::PlaintextTooLarge)?,
              ));
          ''',
              "plaintext accumulator",
          )
          text = replace_one(
              text,
              '''        let opened = cipher
                  .decrypt(
                      &nonce_from_bytes(&nonce_bytes)?,
                      Payload {
                          msg: ciphertext,
                          aad: &aad,
                      },
                  )
                  .map_err(|_| EncryptedGenerationError::AuthenticationFailed)?;
          ''',
              '''        let opened = Zeroizing::new(
                  cipher
                      .decrypt(
                          &nonce_from_bytes(&nonce_bytes)?,
                          Payload {
                              msg: ciphertext,
                              aad: &aad,
                          },
                      )
                      .map_err(|_| EncryptedGenerationError::AuthenticationFailed)?,
              );
          ''',
              "decrypted chunk buffer",
          )
          text = text.replace("digest.update(self.bytes);", "digest.update(self.bytes.as_slice());")
          container.write_text(text, encoding="utf-8")

          lifecycle = Path("crates/encrypted-generation-domain/src/lifecycle.rs")
          text = lifecycle.read_text(encoding="utf-8")
          text = replace_one(
              text,
              "use std::collections::{BTreeMap, BTreeSet};\n",
              "use std::collections::{BTreeMap, BTreeSet};\nuse zeroize::Zeroizing;\n",
              "lifecycle zeroizing import",
          )
          text = replace_one(
              text,
              '''#[derive(Clone, Debug, Eq, PartialEq)]
          pub struct RestoreResult {
              metadata: GenerationMetadata,
              plaintext: Vec<u8>,
          }
          ''',
              '''pub struct RestoreResult {
              metadata: GenerationMetadata,
              plaintext: Zeroizing<Vec<u8>>,
          }
          ''',
              "restore result type",
          )
          text = replace_one(
              text,
              '''
              #[must_use]
              pub fn into_plaintext(self) -> Vec<u8> {
                  self.plaintext
              }
          }
          ''',
              '''
          }
          ''',
              "restore raw extraction",
          )
          text = replace_one(
              text,
              '''        let opened = match open_generation_expected(
                  container,
                  key,
                  record.metadata.tenant_id(),
                  record.metadata.profile_id(),
                  generation_id,
              ) {
                  Ok(opened) => opened,
                  Err(error) => {
                      self.quarantine(generation_id)?;
                      return Err(error);
                  }
              };
          ''',
              '''        let opened = open_generation_expected(
                  container,
                  key,
                  record.metadata.tenant_id(),
                  record.metadata.profile_id(),
                  generation_id,
              )?;
          ''',
              "wrong key quarantine",
          )
          text = replace_one(
              text,
              '''        Ok(RestoreResult {
                  metadata: opened.metadata().clone(),
                  plaintext: opened.into_plaintext(),
              })
          ''',
              '''        let (metadata, plaintext) = opened.into_parts();
              Ok(RestoreResult {
                  metadata,
                  plaintext,
              })
          ''',
              "restore zeroizing transfer",
          )
          lifecycle.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          replacements = {
              '''    assert_eq!(
                  open_generation(&tampered, &key(0x48)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              );
          ''': '''    assert!(matches!(
                  open_generation(&tampered, &key(0x48)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              ));
          ''',
              '''    assert_eq!(
                  open_generation(&container, &key(0x50)?),
                  Err(EncryptedGenerationError::InvalidContainer)
              );
          ''': '''    assert!(matches!(
                  open_generation(&container, &key(0x50)?),
                  Err(EncryptedGenerationError::InvalidContainer)
              ));
          ''',
              '''    assert_eq!(
                  open_generation(&container, &key(0x51)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              );
          ''': '''    assert!(matches!(
                  open_generation(&container, &key(0x51)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              ));
          ''',
              '''    assert_eq!(
                  open_generation(sealed.container(), &key(0x53)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              );
          ''': '''    assert!(matches!(
                  open_generation(sealed.container(), &key(0x53)?),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              ));
          ''',
              '''    assert_eq!(
                  open_generation_expected(
                      sealed.container(),
                      &key(0x52)?,
                      &tenant_id,
                      &profile_id,
                      &other,
                  ),
                  Err(EncryptedGenerationError::IdentityMismatch)
              );
          ''': '''    assert!(matches!(
                  open_generation_expected(
                      sealed.container(),
                      &key(0x52)?,
                      &tenant_id,
                      &profile_id,
                      &other,
                  ),
                  Err(EncryptedGenerationError::IdentityMismatch)
              ));
          ''',
          }
          for old, new in replacements.items():
              text = replace_one(text, old, new, "result assertion")

          anchor = "\n#[test]\nfn corruption_is_quarantined_and_cannot_become_current()"
          regression = '''
          #[test]
          fn wrong_key_does_not_quarantine_unchanged_object()
          -> Result<(), Box<dyn std::error::Error>> {
              let mut repository = CloudGenerationRepository::default();
              let metadata = metadata("generation_01JSTEP9WRONGKEY", 0x4b, b"healthy object")?;
              repository.publish(
                  metadata.clone(),
                  &key(0x5b)?,
                  b"healthy object",
                  UnixMillis::new(1),
              )?;
              assert!(matches!(
                  repository.restore(metadata.generation_id(), &key(0x5c)?, UnixMillis::new(2)),
                  Err(EncryptedGenerationError::AuthenticationFailed)
              ));
              assert_eq!(
                  repository
                      .record(metadata.generation_id())
                      .ok_or(EncryptedGenerationError::MissingGeneration)?
                      .status(),
                  CloudGenerationStatus::Verified
              );
              assert_eq!(
                  repository
                      .restore(metadata.generation_id(), &key(0x5b)?, UnixMillis::new(3))?
                      .plaintext(),
                  b"healthy object"
              );
              Ok(())
          }
          '''
          if text.count(anchor) != 1:
              raise SystemExit(f"wrong-key anchor: expected one match, found {text.count(anchor)}")
          text = text.replace(anchor, regression + anchor, 1)
          tests.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          cargo test --locked -p encrypted-generation-domain

      - name: Commit plaintext hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/encrypted-generation-domain
          git commit -m "Repository Step 9: zeroize plaintext result buffers"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
