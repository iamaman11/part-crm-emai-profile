name: Step 9 Plaintext Hardening Bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Zeroize plaintext results and avoid wrong-key quarantine
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          def sub_one(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              changed, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one structural match, found {count}")
              return changed

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          text = sub_one(
              text,
              r"use zeroize::Zeroize;",
              "use zeroize::{Zeroize, Zeroizing};",
              "zeroizing import",
          )
          text = sub_one(
              text,
              r"#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub struct OpenedGeneration \{\n\s+metadata: GenerationMetadata,\n\s+plaintext: Vec<u8>,\n\}",
              "pub struct OpenedGeneration {\n    metadata: GenerationMetadata,\n    plaintext: Zeroizing<Vec<u8>>,\n}",
              "opened result type",
          )
          text = sub_one(
              text,
              r"\n\s*#\[must_use\]\n\s*pub fn into_plaintext\(self\) -> Vec<u8> \{\n\s*self\.plaintext\n\s*\}\n\}",
              "\n    pub(crate) fn into_parts(self) -> (GenerationMetadata, Zeroizing<Vec<u8>>) {\n        (self.metadata, self.plaintext)\n    }\n}",
              "opened result transfer",
          )
          text = sub_one(
              text,
              r"let mut plaintext = Vec::with_capacity\(\n\s*usize::try_from\(metadata\.plaintext_bytes\(\)\)\n\s*\.map_err\(\|_\| EncryptedGenerationError::PlaintextTooLarge\)\?,\n\s*\);",
              "let mut plaintext = Zeroizing::new(Vec::with_capacity(\n        usize::try_from(metadata.plaintext_bytes())\n            .map_err(|_| EncryptedGenerationError::PlaintextTooLarge)?,\n    ));",
              "plaintext accumulator",
          )
          text = sub_one(
              text,
              r"let opened = cipher\n\s*\.decrypt\(\n\s*&nonce_from_bytes\(&nonce_bytes\)\?,\n\s*Payload \{\n\s*msg: ciphertext,\n\s*aad: &aad,\n\s*\},\n\s*\)\n\s*\.map_err\(\|_\| EncryptedGenerationError::AuthenticationFailed\)\?;",
              "let opened = Zeroizing::new(\n            cipher\n                .decrypt(\n                    &nonce_from_bytes(&nonce_bytes)?,\n                    Payload {\n                        msg: ciphertext,\n                        aad: &aad,\n                    },\n                )\n                .map_err(|_| EncryptedGenerationError::AuthenticationFailed)?,\n        );",
              "decrypted chunk buffer",
          )
          text = text.replace("digest.update(self.bytes);", "digest.update(self.bytes.as_slice());")
          container.write_text(text, encoding="utf-8")

          lifecycle = Path("crates/encrypted-generation-domain/src/lifecycle.rs")
          text = lifecycle.read_text(encoding="utf-8")
          text = sub_one(
              text,
              r"use std::collections::\{BTreeMap, BTreeSet\};",
              "use std::collections::{BTreeMap, BTreeSet};\nuse zeroize::Zeroizing;",
              "lifecycle zeroizing import",
          )
          text = sub_one(
              text,
              r"#\[derive\(Clone, Debug, Eq, PartialEq\)\]\npub struct RestoreResult \{\n\s+metadata: GenerationMetadata,\n\s+plaintext: Vec<u8>,\n\}",
              "pub struct RestoreResult {\n    metadata: GenerationMetadata,\n    plaintext: Zeroizing<Vec<u8>>,\n}",
              "restore result type",
          )
          text = sub_one(
              text,
              r"\n\s*#\[must_use\]\n\s*pub fn into_plaintext\(self\) -> Vec<u8> \{\n\s*self\.plaintext\n\s*\}",
              "",
              "restore raw extraction",
          )
          text = sub_one(
              text,
              r"let opened = match open_generation_expected\(\n\s*container,\n\s*key,\n\s*record\.metadata\.tenant_id\(\),\n\s*record\.metadata\.profile_id\(\),\n\s*generation_id,\n\s*\) \{\n\s*Ok\(opened\) => opened,\n\s*Err\(error\) => \{\n\s*self\.quarantine\(generation_id\)\?;\n\s*return Err\(error\);\n\s*\}\n\s*\};",
              "let opened = open_generation_expected(\n            container,\n            key,\n            record.metadata.tenant_id(),\n            record.metadata.profile_id(),\n            generation_id,\n        )?;",
              "wrong key quarantine",
          )
          text = sub_one(
              text,
              r"Ok\(RestoreResult \{\n\s*metadata: opened\.metadata\(\)\.clone\(\),\n\s*plaintext: opened\.into_plaintext\(\),\n\s*\}\)",
              "{\n            let (metadata, plaintext) = opened.into_parts();\n            Ok(RestoreResult {\n                metadata,\n                plaintext,\n            })\n        }",
              "restore zeroizing transfer",
          )
          lifecycle.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          result_patterns = [
              (
                  r"assert_eq!\(\n\s*open_generation\(&tampered, &key\(0x48\)\?\),\n\s*Err\(EncryptedGenerationError::AuthenticationFailed\)\n\s*\);",
                  "assert!(matches!(\n        open_generation(&tampered, &key(0x48)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  r"assert_eq!\(\n\s*open_generation\(&container, &key\(0x50\)\?\),\n\s*Err\(EncryptedGenerationError::InvalidContainer\)\n\s*\);",
                  "assert!(matches!(\n        open_generation(&container, &key(0x50)?),\n        Err(EncryptedGenerationError::InvalidContainer)\n    ));",
              ),
              (
                  r"assert_eq!\(\n\s*open_generation\(&container, &key\(0x51\)\?\),\n\s*Err\(EncryptedGenerationError::AuthenticationFailed\)\n\s*\);",
                  "assert!(matches!(\n        open_generation(&container, &key(0x51)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  r"assert_eq!\(\n\s*open_generation\(sealed\.container\(\), &key\(0x53\)\?\),\n\s*Err\(EncryptedGenerationError::AuthenticationFailed\)\n\s*\);",
                  "assert!(matches!(\n        open_generation(sealed.container(), &key(0x53)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  r"assert_eq!\(\n\s*open_generation_expected\((?P<body>.*?)\),\n\s*Err\(EncryptedGenerationError::IdentityMismatch\)\n\s*\);",
                  "assert!(matches!(\n        open_generation_expected(\g<body>),\n        Err(EncryptedGenerationError::IdentityMismatch)\n    ));",
              ),
          ]
          for index, (pattern, replacement) in enumerate(result_patterns, start=1):
              text = sub_one(text, pattern, replacement, f"result assertion {index}", re.DOTALL)

          anchor = "\n#[test]\nfn corruption_is_quarantined_and_cannot_become_current()"
          regression = '''
#[test]
fn wrong_key_does_not_quarantine_unchanged_object()
-> Result<(), Box<dyn std::error::Error>> {
    let mut repository = CloudGenerationRepository::default();
    let metadata = metadata("generation_01JSTEP9WRONGKEY", 0x4b, b"healthy object")?;
    repository.publish(
        metadata.clone(),
        &key(0x5b)?,
        b"healthy object",
        UnixMillis::new(1),
    )?;
    assert!(matches!(
        repository.restore(metadata.generation_id(), &key(0x5c)?, UnixMillis::new(2)),
        Err(EncryptedGenerationError::AuthenticationFailed)
    ));
    assert_eq!(
        repository
            .record(metadata.generation_id())
            .ok_or(EncryptedGenerationError::MissingGeneration)?
            .status(),
        CloudGenerationStatus::Verified
    );
    assert_eq!(
        repository
            .restore(metadata.generation_id(), &key(0x5b)?, UnixMillis::new(3))?
            .plaintext(),
        b"healthy object"
    );
    Ok(())
}
'''
          if text.count(anchor) != 1:
              raise SystemExit(f"wrong-key anchor: expected one match, found {text.count(anchor)}")
          tests.write_text(text.replace(anchor, regression + anchor, 1), encoding="utf-8")
          PY
          cargo fmt --all
          cargo test --locked -p encrypted-generation-domain

      - name: Commit plaintext hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/encrypted-generation-domain
          git commit -m "Repository Step 9: zeroize plaintext result buffers"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
