name: Opsctl Read-only Spike Gate

on:
  pull_request:
    paths:
      - '.github/workflows/opsctl-readonly-spike.yml'
      - 'tools/opsctl/**'
      - 'architecture/inventory.json'
      - 'scripts/generate-architecture-inventory.py'
      - 'scripts/check-documentation-authority.py'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: opsctl-readonly-spike-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux read-only CLI proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Clippy
        run: >-
          cargo clippy --locked
          --manifest-path tools/opsctl/Cargo.toml
          --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --manifest-path tools/opsctl/Cargo.toml --all-targets

      - name: Build binary
        run: cargo build --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Exercise read-only commands
        shell: bash
        run: |
          set -euo pipefail
          bin='tools/opsctl/target/debug/opsctl'
          test -x "$bin"
          "$bin" inventory > /tmp/opsctl-inventory.json
          python -m json.tool /tmp/opsctl-inventory.json >/dev/null
          test "$("$bin" plan)" = 'NO_CHANGE'
          "$bin" doctor | grep -q '^doctor=ok mode=read-only remote_mutation=false '
          test "$("$bin" drift)" = 'NO_DRIFT'
          "$bin" --help | grep -q 'project-specific read-only operations interface'
          "$bin" --version | grep -q '^opsctl 0.1.0$'

      - name: Prove mutation commands are absent
        shell: bash
        run: |
          set -euo pipefail
          bin='tools/opsctl/target/debug/opsctl'
          if "$bin" provision > /tmp/opsctl-mutation.out 2>&1; then
            echo 'Mutation command unexpectedly succeeded.' >&2
            exit 1
          fi
          grep -q 'intentionally exposes read-only inventory/plan/doctor/drift only' /tmp/opsctl-mutation.out

  windows:
    name: Windows read-only CLI proof
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Test and build
        run: |
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml --all-targets
          cargo build --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Exercise doctor and drift
        shell: pwsh
        run: |
          $bin = 'tools/opsctl/target/debug/opsctl.exe'
          if (-not (Test-Path $bin)) { throw 'opsctl.exe was not produced' }
          $doctor = & $bin doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($doctor -match '^doctor=ok mode=read-only remote_mutation=false ')) {
            throw "Unexpected doctor output: $doctor"
          }
          $drift = & $bin drift
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($drift -ne 'NO_DRIFT') { throw "Unexpected drift output: $drift" }
