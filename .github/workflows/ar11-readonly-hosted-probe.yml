name: AR-11 Readonly Hosted Probe

on:
  pull_request:
    paths:
      - .github/workflows/ar11-readonly-hosted-probe.yml

permissions:
  actions: read
  contents: read

jobs:
  probe:
    name: Read-only accepted-main Actions probe
    runs-on: ubuntu-latest
    steps:
      - name: Observe exact accepted-main workflow runs and jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_MAIN_SHA: 7fc11fad573f0077f1f61fd527350864df59c571
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ['REPOSITORY']
          sha = os.environ['ACCEPTED_MAIN_SHA']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'ar11-readonly-hosted-probe',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          runs = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
          observed = []
          for run in runs.get('workflow_runs', []):
              row = {
                  'id': run['id'],
                  'name': run['name'],
                  'event': run['event'],
                  'status': run['status'],
                  'conclusion': run.get('conclusion'),
                  'run_number': run['run_number'],
                  'head_sha': run['head_sha'],
                  'jobs': [],
              }
              jobs = get(f"https://api.github.com/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              for job in jobs.get('jobs', []):
                  row['jobs'].append({
                      'id': job['id'],
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job.get('conclusion'),
                  })
              observed.append(row)

          print(json.dumps({'accepted_main_sha': sha, 'runs': observed}, indent=2, sort_keys=True))
          PY
