# Trigger bounded closeout after workflow exists on branch.
name: Phase 2B Docs Closeout Materializer

on:
  push:
    branches:
      - docs-phase2b-closeout

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2b-closeout
          persist-credentials: true

      - name: Apply bounded normative closeout
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          plan = Path("docs/DEVELOPMENT_PLAN.md")
          text = plan.read_text(encoding="utf-8")
          if "Phase 2B #138 is the unique NEXT" in text:
              text = replace_once(
                  text,
                  "**Tracking:** Phase 1 complete; Phase 2A accepted via #118/#137; Phase 2B #138 is the unique NEXT; expert-plan refinement #133; external CRM is future development only",
                  "**Tracking:** Phase 1 complete; Phase 2A and Phase 2B accepted via #118/#137 and #138/#140; Phase 2C is the unique NEXT; expert-plan refinement #133; external CRM is future development only",
                  "tracking marker",
              )
              accepted_2a = """Phase 2A was accepted through issue #118 / PR #137 from exact proven source head
`2d80ee74bc8d05657414ea4e75dcf6f41c723926` and guarded squash merge
`a1eb2833a74d9156bce8f4b1c6e92815cc0d55bc`.
"""
              accepted_2b = accepted_2a + """
Phase 2B was accepted through issue #138 / PR #140 from exact proven source head
`895594e35b77ddd86395300b1644e9df6a712123` and guarded squash merge
`298062ea443c31c69212cb03b3988265b6bbcd48`.
"""
              text = replace_once(text, accepted_2a, accepted_2b, "accepted evidence baseline")
              baseline_2a = """- Phase 2A decomposed `client-domain`, opaque PII-independent contact identity, versioned contact
  normalization/protection semantics, protected-only persistence ports and extracted canonical
  client application ownership in `use-cases-clients`.
"""
              baseline_2b = baseline_2a + """- Phase 2B authoritative protected client/contact persistence in D1, separate versioned
  encryption and exact-lookup key domains, application-owned checked-version lifecycle/contact
  commands, atomic mutation + idempotency + audit + outbox, and tenant-first indexed HMAC lookup.
"""
              text = replace_once(text, baseline_2a, baseline_2b, "accepted baseline bullet")
              text = replace_once(
                  text,
                  "Exactly one implementation slice is active at a time. Phase 2B issue #138 is the unique NEXT\nafter the accepted Phase 2A closeout.",
                  "Exactly one implementation slice is active at a time. Phase 2C is the unique NEXT after\nthe accepted Phase 2B closeout; later Phase 2 slices remain blocked by the same linear rule.",
                  "active slice marker",
              )
              text = replace_once(
                  text,
                  "| A4 | Rust/OpenAPI/TypeScript generation | **Foundation accepted, coverage incomplete.** Migrated public slice is generated and CI-enforced. | Every new 2B–2H public DTO/event expands canonical generated coverage before UI use. |",
                  "| A4 | Rust/OpenAPI/TypeScript generation | **Foundation accepted, coverage incomplete.** Migrated public slice is generated and CI-enforced; Phase 2B added no public transport DTO. | Every new 2C–2H public DTO/event expands canonical generated coverage before UI use. |",
                  "A4 traceability",
              )
              text = replace_once(
                  text,
                  "| 6.5 | PII protection boundary | **Phase 2A inward foundation accepted.** Contact IDs, normalization, lookup-input separation and protected-only persistence types are implemented; authoritative ciphertext/HMAC persistence is not. | Phase 2B D1 encryption/HMAC/key-version persistence and rotation-safe lookup. |",
                  "| 6.5 | PII protection boundary | **Accepted through Phase 2B.** Contact IDs are PII-independent; authoritative D1 contact storage is ciphertext-only; encryption/HMAC key domains and versions are separate; exact lookup is tenant-scoped and index-backed; rotation candidates do not require plaintext scans. | Preserve in every later client/query/mail surface; fuzzy/prefix PII search still requires a separate accepted ADR. |",
                  "PII traceability",
              )
              text = replace_once(
                  text,
                  "**Status:** ACCEPTED. Phase 1 is complete; Phase 2B is the unique next implementation slice after accepted Phase 2A.",
                  "**Status:** ACCEPTED. Phase 1 is complete; Phase 2A and Phase 2B are accepted; Phase 2C is the unique next implementation slice.",
                  "Phase 1 status",
              )
              text = replace_once(
                  text,
                  "**Phase 1 completion gate:** ACCEPTED by the implementation merge and bounded documentation closeout.\nPhase 2A is also accepted; Phase 2B #138 is the unique NEXT and later Phase 2 slices remain blocked\nby the same linear rule.",
                  "**Phase 1 completion gate:** ACCEPTED by the implementation merge and bounded documentation closeout.\nPhase 2A and Phase 2B are also accepted; Phase 2C is the unique NEXT and later Phase 2 slices remain\nblocked by the same linear rule.",
                  "Phase 1 completion marker",
              )
              text = replace_once(
                  text,
                  "### Phase 2B — Client persistence, contact crypto adapter and lifecycle commands — NEXT",
                  "### Phase 2B — Client persistence, contact crypto adapter and lifecycle commands — ACCEPTED",
                  "2B section status",
              )
              purpose = """**Purpose:** make the 2A model authoritative and safe in D1 without weakening governed writes.
"""
              evidence = purpose + """
**Accepted evidence:** issue #138 / PR #140; exact proven source head
`895594e35b77ddd86395300b1644e9df6a712123`; guarded squash merge
`298062ea443c31c69212cb03b3988265b6bbcd48`; 12/12 permanent workflows green on the unchanged
source head; `behind_by=0`; reviews=0; unresolved threads=0. `production_ready=false` remains unchanged.
"""
              text = replace_once(text, purpose, evidence, "2B accepted evidence")
              text = replace_once(
                  text,
                  "### Phase 2C — Client merge, assignment, grant-safe projections and modular Client Registry UI",
                  "### Phase 2C — Client merge, assignment, grant-safe projections and modular Client Registry UI — NEXT",
                  "2C section status",
              )
              plan.write_text(text, encoding="utf-8")

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text(encoding="utf-8")
          if "Phase 2B accepts authoritative protected client-contact D1 persistence" not in text:
              persistence = """Client contact persistence ports accept protected representations only; transient contact plaintext
may enter only the application/protection boundary and cannot cross the persistence interface by type.
"""
              persistence_new = persistence + """
Phase 2B accepts authoritative protected client-contact D1 persistence and a separate exact-lookup
query port. Exact lookup accepts tenant scope + contact kind + normalization version + versioned HMAC
token only; D1 lookup adapters do not receive plaintext and do not decrypt/scan all contact rows.
"""
              text = replace_once(text, persistence, persistence_new, "application port boundary")
              text = replace_once(
                  text,
                  "| ClientRecord | Client Registry | D1 + audit/outbox |",
                  "| ClientRecord | Client Registry | D1 + audit/outbox |\n| ClientContactPoint | Client Registry | D1 ciphertext + nonce/key-version metadata + tenant-first HMAC lookup index; audit/outbox remain metadata-only |",
                  "core data ownership",
              )
              d1_marker = """- raw unscoped D1 access is restricted to approved migration/reconciliation adapters;
"""
              d1_new = d1_marker + """- client exact-contact lookup is tenant-first and equality/index-backed on kind + normalization
  version + lookup-key version + HMAC token; plaintext/decrypt-all search paths are prohibited;
"""
              text = replace_once(text, d1_marker, d1_new, "D1 isolation lookup")
              key_old = """Client contact protection is a separate application/adaptor key domain from generation storage:
contact display encryption keys and exact-lookup HMAC keys are distinct, versioned domains. The
Phase 2A inner contract fixes separation, domain-separated lookup input and normalization metadata;
Phase 2B owns authoritative outer key-provider, ciphertext/HMAC persistence and rotation behavior.
"""
              key_new = """Client contact protection is a separate application/adaptor key domain from generation storage:
contact display encryption keys and exact-lookup HMAC keys are distinct, versioned domains. The
Phase 2A inner contract fixes separation, domain-separated lookup input and normalization metadata.
Phase 2B accepts authoritative protected client-contact D1 persistence, current+legacy versioned
keyring behavior, current-key writes, version-selected decrypt and lookup candidates across active
lookup-key versions so planned rotation/backfill does not require plaintext database scans.
"""
              text = replace_once(text, key_old, key_new, "key hierarchy")
              ci_marker = """- D1 migration/replay invariants;
"""
              ci_new = ci_marker + """- protected client-contact persistence and tenant-scoped exact-HMAC lookup positive/negative fixtures;
"""
              text = replace_once(text, ci_marker, ci_new, "CI enforcement")
              architecture.write_text(text, encoding="utf-8")

      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git add docs/DEVELOPMENT_PLAN.md docs/ARCHITECTURE.md
          if git diff --cached --quiet; then
            echo "Phase 2B docs closeout already materialized."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Phase 2B and advance Phase 2C'
          git push origin HEAD:docs-phase2b-closeout
