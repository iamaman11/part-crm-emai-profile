name: Step 4 Wire Governed Gate

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-wire-governed-gate
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Add governed write gate to permanent Linux job
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/quality-gate.yml")
          text = path.read_text(encoding="utf-8")
          compile_anchor = "          scripts/check-d1-boundary.py\n"
          compile_line = "          scripts/check-step4-governed-writes.py\n"
          if compile_line not in text:
              text = text.replace(compile_anchor, compile_anchor + compile_line)

          step = """
      - name: Enforce governed Step 4 write surfaces
        run: python scripts/check-step4-governed-writes.py
"""
          anchor = """
      - name: Prove raw D1 use-case fixture is rejected
"""
          if "Enforce governed Step 4 write surfaces" not in text:
              text = text.replace(anchor, step + anchor)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate permanent workflow and gate
        run: |
          python -m py_compile scripts/check-step4-governed-writes.py
          python scripts/check-step4-governed-writes.py

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/step4-wire-governed-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: make governed write gate permanent"
          git push origin HEAD:repository-step-4-identity-clients-acl
