name: S0 WebGL Diagnostic

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: s0-webgl-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-webgl-parameters:
    name: Real WebGL parameter values and JS types
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Restore verified patched Linux candidate
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/camoufox-candidate
          key: s0-camoufox-linux-${{ hashFiles('runtime/camouhost/camoufox-patch-lock.json', 'runtime/camouhost/camoufox-patches/0001-webgl-checked-arrays.patch', 'scripts/build-camoufox-patched-candidate.py', 'scripts/check-camoufox-webgl-patch.py', 'scripts/verify-camoufox-patched-candidate.py') }}

      - name: Require cached candidate
        run: |
          test -f artifacts/camoufox-candidate/camoufox-linux.x86_64.zip
          test -f artifacts/camoufox-candidate/camoufox-linux.provenance.json

      - name: Install exact Camoufox Python components
        run: |
          python3.12 -m pip install --disable-pip-version-check \
            "git+https://github.com/daijro/camoufox.git@b68a4fb9400d950b2f3c2c030931deef6e203ba4#subdirectory=pythonlib" \
            "browserforge==1.2.4" \
            "playwright==1.60.0"

      - name: Install verified reused candidate
        run: |
          candidate_sha="$(python3.12 -c 'import json; print(json.load(open("artifacts/camoufox-candidate/camoufox-linux.provenance.json", encoding="utf-8"))["build_source_commit"])')"
          python3.12 scripts/install-camoufox-candidate-for-ci.py \
            --archive artifacts/camoufox-candidate/camoufox-linux.x86_64.zip \
            --provenance artifacts/camoufox-candidate/camoufox-linux.provenance.json \
            --build-source-commit "$candidate_sha"

      - name: Observe real WebGL configured values, browser values and JS types
        run: |
          python3.12 -m py_compile runtime/camouhost/real.py scripts/diagnose-s0-webgl-parameters.py
          python3.12 scripts/diagnose-s0-webgl-parameters.py \
            --camouhost runtime/camouhost/real.py \
            --runtime-lock runtime/camouhost/runtime-lock.json \
            --headless virtual

  windows-speech-voices:
    name: Windows configured and browser-visible speech voices
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up exact Windows build Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'

      - name: Download proven patched Windows candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: s0-camoufox-windows-8170f413d30aa935cfd50b5945f348a6d1d6277c
          path: artifacts/camoufox-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33583385869

      - name: Verify candidate inputs remain byte-equivalent to exact head
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $candidateBuildSha = (Get-Content -Raw 'artifacts/camoufox-candidate/camoufox-windows.provenance.json' | ConvertFrom-Json).build_source_commit
          if ($candidateBuildSha -notmatch '^[0-9a-f]{40}$') { throw 'candidate build source commit is invalid' }
          git fetch --no-tags --depth=1 origin $candidateBuildSha
          git diff --quiet $candidateBuildSha $env:SOURCE_SHA -- `
            runtime/camouhost/camoufox-patch-lock.json `
            runtime/camouhost/camoufox-patches/0001-webgl-checked-arrays.patch `
            scripts/build-camoufox-patched-candidate.py `
            scripts/check-camoufox-webgl-patch.py `
            scripts/verify-camoufox-patched-candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'candidate-defining inputs changed' }
          python scripts/verify-camoufox-patched-candidate.py `
            --archive artifacts/camoufox-candidate/camoufox-windows.x86_64.zip `
            --provenance artifacts/camoufox-candidate/camoufox-windows.provenance.json `
            --target windows `
            --build-source-commit "$candidateBuildSha"

      - name: Materialize exact Windows runtime from reused candidate
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $buildPython = (Get-Command python).Source
          $candidateBuildSha = (Get-Content -Raw 'artifacts/camoufox-candidate/camoufox-windows.provenance.json' | ConvertFrom-Json).build_source_commit
          python scripts/camouhost-runtime-build-windows.py build `
            --runtime-lock runtime/camouhost/runtime-lock.json `
            --patch-lock runtime/camouhost/camoufox-patch-lock.json `
            --runtime-source runtime/camouhost/real.py `
            --browser-candidate artifacts/camoufox-candidate/camoufox-windows.x86_64.zip `
            --browser-provenance artifacts/camoufox-candidate/camoufox-windows.provenance.json `
            --build-source-commit "$candidateBuildSha" `
            --output "$runtimeRoot" `
            --build-python "$buildPython"

      - name: Observe configured and real Windows speech voices over time
        shell: pwsh
        run: |
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'camouhost-runtime'
          $runtimePython = Join-Path $runtimeRoot 'python\python.exe'
          $camouhost = Join-Path $runtimeRoot 'camouhost\real.py'
          $runtimeLock = Join-Path $runtimeRoot 'camouhost\runtime-lock.json'
          & $runtimePython -m py_compile scripts/diagnose-s0-speech-voices.py $camouhost
          & $runtimePython scripts/diagnose-s0-speech-voices.py `
            --camouhost $camouhost `
            --runtime-lock $runtimeLock `
            --headless false
