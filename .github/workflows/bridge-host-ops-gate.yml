name: Bridge Host Operations Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-host-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-linux:
    name: Bridge Host Ops Linux Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      # OS-isolated Cargo cache; this job still checks and tests exact source.
      - name: Restore Bridge host Rust compilation cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, immutable
        with:
          shared-key: bridge-host-ops-v1
          workspaces: |
            . -> target
            platform/windows-device-key -> target

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Verify native device-key adapter and current device policy
        run: |
          cargo fmt --manifest-path platform/windows-device-key/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path platform/windows-device-key/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path platform/windows-device-key/Cargo.toml
          cargo test --locked -p device-domain

  windows-compile:
    name: Bridge Host Ops Windows Compile
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      # OS-isolated Cargo cache; this job still checks and tests exact source.
      - name: Restore Bridge host Rust compilation cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2, immutable
        with:
          shared-key: bridge-host-ops-v1
          workspaces: |
            . -> target
            platform/windows-device-key -> target

      - name: Show pinned toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Prove native Windows CNG device proof through Profile Bridge
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --manifest-path platform/windows-device-key/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path platform/windows-device-key/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path platform/windows-device-key/Cargo.toml
          cargo test --locked -p profile-bridge --test windows_device_pop
