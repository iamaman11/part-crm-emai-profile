name: Bridge Host Operations Gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-host-ops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-linux:
    name: Bridge Host Ops Linux Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Verify host-operations policy and secret boundary
        run: |
          cargo fmt --manifest-path tools/bridge-host-ops/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path tools/bridge-host-ops/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/bridge-host-ops/Cargo.toml
          cargo run --locked --quiet --manifest-path tools/bridge-host-ops/Cargo.toml -- self-test | python -m json.tool >/dev/null

  windows-compile:
    name: Bridge Host Ops Windows Compile
    runs-on: windows-latest
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Show pinned toolchain
        shell: pwsh
        run: rustup show active-toolchain

      - name: Compile and test the real Windows host adapter
        shell: pwsh
        run: |
          cargo fmt --manifest-path tools/bridge-host-ops/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path tools/bridge-host-ops/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/bridge-host-ops/Cargo.toml
          cargo build --locked --release --manifest-path tools/bridge-host-ops/Cargo.toml
          cargo run --locked --quiet --manifest-path tools/bridge-host-ops/Cargo.toml -- self-test | ConvertFrom-Json | Out-Null

  windows-enrollment-e2e:
    name: Bridge Enrollment Hosted E2E (Windows)
    needs: windows-compile
    runs-on: windows-latest
    timeout-minutes: 25
    environment: staging
    concurrency:
      group: bridge-enrollment-hosted-e2e
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up pinned Node for local Wrangler composition
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Validate stage-specific E2E harness syntax
        shell: pwsh
        run: |
          if ((node --version) -ne 'v24.19.0') { throw 'unexpected Node version' }
          npm install --global npm@11.17.0
          if ((npm --version) -ne '11.17.0') { throw 'unexpected npm version' }
          node --check tests/bridge-enrollment-e2e/dependency-server.mjs
          node --check tests/bridge-enrollment-e2e/signer-worker.mjs
          foreach ($path in @('scripts/bridge-enrollment-hosted-e2e.ps1', 'tests/bridge-enrollment-e2e/sign-csr.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw "PowerShell parse failure in $path`: $($errors[0].Message)" }
          }

      - name: Warm exact Wrangler package once
        timeout-minutes: 2
        shell: pwsh
        run: |
          $version = (npx --yes wrangler@4.129.1 --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^4\.129\.1$') { throw "unexpected Wrangler version: $version" }

      - name: Install pinned cloudflared tunnel connector
        timeout-minutes: 2
        shell: pwsh
        run: |
          $version = '2026.9.0'
          $expectedSha256 = '83e726ed18ea78c5ad5213c4c3a3a27051393950d2bc8ed4de69bec12d14eaae'
          $cloudflared = Join-Path $env:RUNNER_TEMP 'cloudflared-2026.9.0-windows-amd64.exe'
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-windows-amd64.exe" -OutFile $cloudflared -TimeoutSec 60
          $actualSha256 = (Get-FileHash -LiteralPath $cloudflared -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) { throw "cloudflared SHA256 mismatch: $actualSha256" }
          $versionOutput = (& $cloudflared --version) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $versionOutput -notmatch '2026\.9\.0') { throw "unexpected cloudflared version: $versionOutput" }

      - name: Build shipping Windows host and shipping control-plane Worker
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path tools/bridge-host-ops/Cargo.toml
          cargo install worker-build --version 0.8.5 --locked
          Push-Location apps/control-plane-worker
          try { worker-build --release } finally { Pop-Location }
          if (-not (Test-Path apps/control-plane-worker/build/worker/shim.mjs)) { throw 'Worker build output missing' }

      - name: Prove hosted Windows positive and negative enrollment E2E
        timeout-minutes: 10
        shell: pwsh
        env:
          CLOUDFLARE_E2E_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_E2E_TUNNEL_TOKEN }}
        run: |
          $cloudflared = Join-Path $env:RUNNER_TEMP 'cloudflared-2026.9.0-windows-amd64.exe'
          if (-not (Test-Path -LiteralPath $cloudflared -PathType Leaf)) { throw 'pinned cloudflared binary missing' }
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_E2E_TUNNEL_TOKEN)) { throw 'CLOUDFLARE_E2E_TUNNEL_TOKEN is missing from staging environment' }

          $tunnelToken = $env:CLOUDFLARE_E2E_TUNNEL_TOKEN
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $cloudflared
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          foreach ($argument in @('tunnel', '--no-autoupdate', '--loglevel', 'warn', '--metrics', '127.0.0.1:2000', 'run')) {
            $startInfo.ArgumentList.Add($argument)
          }
          $null = $startInfo.Environment.Remove('CLOUDFLARE_E2E_TUNNEL_TOKEN')
          $startInfo.Environment['TUNNEL_TOKEN'] = $tunnelToken
          $tunnelProcess = [System.Diagnostics.Process]::new()
          $tunnelProcess.StartInfo = $startInfo

          try {
            Write-Host 'bridge-enrollment-e2e phase=cloudflare-tunnel-start'
            if (-not $tunnelProcess.Start()) { throw 'cloudflared failed to start' }
            $env:CLOUDFLARE_E2E_TUNNEL_TOKEN = $null
            [Environment]::SetEnvironmentVariable('TUNNEL_TOKEN', $null)
            $tunnelToken = $null

            $ready = $false
            $timer = [System.Diagnostics.Stopwatch]::StartNew()
            while ($timer.Elapsed.TotalSeconds -lt 30) {
              if ($tunnelProcess.HasExited) { throw "cloudflared exited before readiness with code $($tunnelProcess.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:2000/ready' -Method Get -TimeoutSec 2 -SkipHttpErrorCheck
                if ([int]$response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'cloudflared did not become ready within 30 seconds' }
            Write-Host 'bridge-enrollment-e2e phase=cloudflare-tunnel-connected'

            ./scripts/bridge-enrollment-hosted-e2e.ps1 -ReportPath artifacts/bridge-enrollment-e2e/evidence.json | ConvertFrom-Json | Out-Null
            $evidence = Get-Content -Raw artifacts/bridge-enrollment-e2e/evidence.json | ConvertFrom-Json
            if ($evidence.status -ne 'PASS' -or $evidence.kind -ne 'BRIDGE_ENROLLMENT_HOSTED_E2E') { throw 'Bridge enrollment E2E evidence failed' }
            if ($evidence.providerMutation -or $evidence.productionMutation) { throw 'Bridge enrollment E2E performed an unauthorized provider or Production mutation' }
            if (-not $evidence.remoteProviderCredentialsPresent -or $evidence.remoteProviderCredentialUsedByHarness -or -not $evidence.remoteProviderCredentialUsedByWorkflowConnector) { throw 'Bridge enrollment E2E tunnel credential boundary is false' }
            if (-not $evidence.cloudflareTunnelConnectorOnly -or -not $evidence.cloudflareManagedPublicTls -or $evidence.cloudflareTunnelHostname -ne 'bridge-e2e.alegria.by') { throw 'Bridge enrollment E2E did not prove the Cloudflare-managed ingress boundary' }
            if (-not $evidence.shippingControlPlaneWorker -or -not $evidence.shippingHostEnroll -or -not $evidence.localD1FromTypedRepositoryProjection) { throw 'Bridge enrollment E2E did not use shipping owners' }
            foreach ($value in @(
              $evidence.negative.signerFailureReservationPersistence,
              $evidence.negative.wrongCsrConflict,
              $evidence.negative.exactCsrRecovery,
              $evidence.negative.consumedReplayRejected,
              $evidence.negative.expiryReplayRejected
            )) {
              if ($value -ne 'PASS') { throw 'Bridge enrollment negative proof is incomplete' }
            }
          } finally {
            $env:CLOUDFLARE_E2E_TUNNEL_TOKEN = $null
            [Environment]::SetEnvironmentVariable('TUNNEL_TOKEN', $null)
            if ($null -ne $tunnelProcess) {
              try {
                if (-not $tunnelProcess.HasExited) {
                  $tunnelProcess.Kill($true)
                  if (-not $tunnelProcess.WaitForExit(10000)) { Write-Warning 'cloudflared cleanup did not exit within 10 seconds' }
                }
              } catch {
                Write-Warning "cloudflared cleanup failed: $($_.Exception.Message)"
              }
              $tunnelProcess.Dispose()
            }
            Write-Host 'bridge-enrollment-e2e phase=cloudflare-tunnel-cleanup-pass'
          }

      - name: Publish secret-free Bridge enrollment E2E evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bridge-enrollment-hosted-e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/bridge-enrollment-e2e/evidence.json
          if-no-files-found: error
          retention-days: 90
