name: AR-11 Inventory Refresh Temporary

on:
  push:
    branches:
      - agent/ar11-release-capability-promotion

permissions:
  contents: write

concurrency:
  group: ar11-inventory-refresh-temporary
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar11-release-capability-promotion
          fetch-depth: 1

      - name: Regenerate canonical architecture inventory
        run: python scripts/generate-architecture-inventory.py --write

      - name: Commit projection only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- architecture/inventory.json; then
            echo "architecture/inventory.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/inventory.json
          git commit -m "AR-11: refresh canonical architecture inventory"
          git push origin HEAD:agent/ar11-release-capability-promotion
