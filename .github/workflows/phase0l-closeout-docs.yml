name: Phase 0L Documentation Closeout

on:
  push:
    branches:
      - docs-phase0l-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase0l-closeout
          fetch-depth: 0
      - name: Mark Phase 0L accepted
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = Path("docs/DEVELOPMENT_PLAN.md")
          replace_once(
              plan,
              "**Tracking:** active Phase 0L issue/PR #104; plan consolidation history #96  ",
              "**Tracking:** Phase 0L accepted via #104; next planned Phase 0M; plan consolidation history #96  ",
          )
          old_baseline = """Repository Steps 0–10 and the accepted post-composition slices through **Phase 0K** provide
the current code baseline: typed domain/application boundaries, governed D1 writes,
profile generations, application-thin coordinator ingress, synthetic Bridge/runtime lanes,
mailbox metadata/jobs, React composition and exact-head cross-component acceptance.

The current unfinished architecture-convergence slice is:

- **Phase 0L — Just-in-time application Cargo boundaries**;
- tracking issue / draft PR **#104**.

Phase 0L is **not accepted or merged** until its actual final diff, exact-head CI and merge
evidence satisfy #104 acceptance. The first justified extraction is the identity application
context (`use-cases-identity`); `identity_acl` deliberately remains with cross-client/profile
query helpers because moving it would create a false identity-only boundary. PR descriptions
are not implementation evidence. Before merge the branch must be synchronized to the latest
`main` and end at `behind_by=0`.

After 0L, continue with Phase 0M from the new accepted `main`. Do not begin the next
sequential architecture slice while 0L is still awaiting bounded acceptance."""
          new_baseline = """Repository Steps 0–10 and the accepted post-composition slices through **Phase 0L** provide
the current code baseline: typed domain/application boundaries, governed D1 writes,
profile generations, application-thin coordinator ingress, the first real application Cargo
boundary (`use-cases-identity`), synthetic Bridge/runtime lanes, mailbox metadata/jobs, React
composition and exact-head cross-component acceptance.

Phase 0L was accepted through issue/PR **#104** with guarded squash merge
`f26528f0f99d69a24ae1c4c307c1f3458ef64e05`. Identity governance plus verified-identity
ceremonies now compile/test independently in `use-cases-identity`; `identity_acl` deliberately
remains with cross-client/profile query helpers because moving it would create a false
identity-only boundary.

No sequential Phase 0 implementation slice is active in this closeout. The **next planned
slice is Phase 0M — generated frontend contracts and feature-boundary enforcement**, which must
start from the accepted Phase 0L `main` in its own bounded issue/branch/PR."""
          replace_once(plan, old_baseline, new_baseline)
          replace_once(
              plan,
              "### Phase 0L — Just-in-time application Cargo boundaries — ACTIVE",
              "### Phase 0L — Just-in-time application Cargo boundaries — ACCEPTED",
          )
          replace_once(
              plan,
              "### Phase 0M — Generated frontend contracts and feature-boundary enforcement",
              "### Phase 0M — Generated frontend contracts and feature-boundary enforcement — NEXT",
          )
          text = plan.read_text(encoding="utf-8")
          marker = "## 19. Immediate Next Action\n"
          if marker not in text:
              raise SystemExit("Immediate Next Action marker missing")
          prefix = text.split(marker, 1)[0]
          next_action = """## 19. Immediate Next Action

Start **Phase 0M — generated frontend contracts and feature-boundary enforcement** from the
accepted Phase 0L `main`. Create a fresh bounded issue/branch/PR before implementation; do not
fold 0M work into the completed #104 history.

Primary 0M acceptance target:

```text
OpenAPI/public contract source of truth
  -> deterministic TypeScript generation
  -> no handwritten duplicate server DTO/enums
  -> regeneration produces no diff
  -> sibling feature internals cannot be imported
  -> positive repository check + deliberately forbidden fixture
  -> exact-head permanent CI + guarded merge
```

Keep the new `use-cases-identity` compile-time boundary intact, extract later application
contexts only when actual dependency/growth pressure justifies it, and continue long-lead
External gate preparation without changing `production_ready=false`.
"""
          plan.write_text(prefix + next_action, encoding="utf-8")

          matrix = Path("docs/DEVELOPER_CAPABILITY_MATRIX.md")
          replace_once(
              matrix,
              "| Identity / memberships / ACL | Composed | Access identity adapter, memberships, owner bootstrap/transfer, invitation create/accept, membership status lifecycle, profile/client grants, neutral disclosure and governed D1 commands. Identity governance/ceremonies plus profile/client grant/revoke are application-owned behind thin capability transports; the legacy mixed Worker `api.rs` orchestration surface is removed and permanently rejected. | Production Access/IdP deployment is External; first real application Cargo isolation remains active Phase 0 work until 0L merges. |",
              "| Identity / memberships / ACL | Composed | Access identity adapter, memberships, owner bootstrap/transfer, invitation create/accept, membership status lifecycle, profile/client grants, neutral disclosure and governed D1 commands. Identity governance plus verified-identity ceremonies are independently Cargo-isolated in `use-cases-identity`; profile/client grant/revoke remain application-owned behind thin capability transports. | Production Access/IdP deployment is External; later client/profile/mailbox application crate extraction remains just-in-time Target work only where growth pressure justifies it. |",
          )
          old_convergence = """Accepted Phase 0 slices through **0K** establish application ownership for client create/query/grant,
profile create/query/assignment/grant, mailbox binding/job, generation, identity governance/
ceremonies and coordinator ingress. The active Phase 0L Cargo-boundary branch is not an accepted
`main` claim until its guarded merge.

As of this matrix date:

- accepted `main` includes Phase 0K application-thin coordinator ingress with permanent Step-5 ownership enforcement;
- Phase 0L first real application Cargo extraction is tracked by issue / draft PR #104 and remains unaccepted until exact-head permanent CI plus guarded merge;
- the current execution plan, not this matrix, determines subsequent order."""
          new_convergence = """Accepted Phase 0 slices through **0L** establish application ownership for client create/query/grant,
profile create/query/assignment/grant, mailbox binding/job, generation, identity governance/
ceremonies and coordinator ingress, plus the first real compile-time application Cargo boundary.

As of this matrix date:

- accepted `main` includes Phase 0K application-thin coordinator ingress with permanent Step-5 ownership enforcement;
- accepted Phase 0L places identity governance plus verified-identity ceremonies in independent `use-cases-identity`, proven by native tests, explicit Workers-WASM compile and composed regressions;
- `identity_acl` intentionally remains in shared `use-cases` because its current helpers cross client/profile contexts;
- the current execution plan, not this matrix, determines subsequent order; Phase 0M is next planned."""
          replace_once(matrix, old_convergence, new_convergence)
          replace_once(
              matrix,
              "crates/use-cases\n  accepted shared application crate with capability modules\n  (active Phase 0L branch extracts the first justified independent identity context)",
              "crates/use-cases-identity\n  accepted independent identity governance + verified-identity ceremony application context\n\ncrates/use-cases\n  accepted shared application crate for remaining contexts; identity modules are compatibility re-exports only",
          )

          status_path = Path("docs/status.json")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          status["as_of"] = "2026-08-08"
          status["post_composition"] = {
              "accepted_through_phase": "0L",
              "next_phase": "0M",
              "active_issue": None,
              "active_pr": None,
              "accepted_merge": "f26528f0f99d69a24ae1c4c307c1f3458ef64e05"
          }
          status_path.write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          PY
          git diff --check
          python -m json.tool docs/status.json >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md docs/DEVELOPER_CAPABILITY_MATRIX.md docs/status.json
          git commit -m "Docs: mark Phase 0L accepted and advance to 0M"
          git push origin HEAD:docs-phase0l-closeout
