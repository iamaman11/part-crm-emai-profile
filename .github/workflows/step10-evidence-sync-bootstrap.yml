name: Step 10 Evidence Sync Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step10-evidence-sync-bootstrap
  cancel-in-progress: false

jobs:
  synchronize-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-10-evidence-sync
          persist-credentials: true

      - name: Synchronize accepted Step 10 evidence
        run: python scripts/sync-step10-evidence.py

      - name: Remove temporary synchronization files
        run: git rm .github/workflows/step10-evidence-sync-bootstrap.yml scripts/sync-step10-evidence.py

      - name: Validate final roadmap evidence
        run: |
          python -m json.tool docs/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          assert status["repository_step"]["number"] == 10
          assert status["repository_step"]["accepted_source_head"] == "7d5ba8c2a00bac256a9365a40dee7e3c28ef5b56"
          assert status["repository_step"]["squash_merge"] == "3ddde2f48ddf82decf66c933ae5326a4455263e5"
          assert status["next_repository_step"]["number"] is None
          assert status["next_repository_step"]["status"] == "blocked_external_gate"
          assert status["decisions"]["adr_0001"].startswith("proposed")
          assert status["decisions"]["adr_0006"].startswith("proposed")
          assert status["production_ready"] is False
          assert len([step for step in status["accepted_steps"] if step["number"] == 10]) == 1

          readme = Path("README.md").read_text(encoding="utf-8")
          index = Path("docs/TEST_EVIDENCE_INDEX.md").read_text(encoding="utf-8")
          report = Path("docs/evidence/2026-08-06-repository-step-10-certification-multi-device.md")
          assert "Repository Steps 0–10 приняты" in readme
          assert "без выдуманного Step 11" in readme
          assert "Repository Step 10 / PR #33" in index
          assert report.is_file()
          PY
          git diff --check

      - name: Commit evidence synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 10: synchronize accepted evidence"
          git fetch origin repository-step-10-evidence-sync
          git rebase origin/repository-step-10-evidence-sync
          git push origin HEAD:repository-step-10-evidence-sync
