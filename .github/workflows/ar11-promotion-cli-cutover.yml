name: AR-11 Promotion CLI Cutover

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ar11-promotion-cli-cutover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cutover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ar11-release-capability-promotion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Apply exact AR-11 promotion CLI cutover
        run: |
          set -euo pipefail
          python scripts/ar11-promotion-cli-cutover.py
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Remove one-shot cutover tooling and enforce allowlist
        run: |
          set -euo pipefail
          git rm scripts/ar11-promotion-cli-cutover.py .github/workflows/ar11-promotion-cli-cutover.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ar11-promotion-cli-cutover.yml|scripts/ar11-promotion-cli-cutover.py|tools/opsctl/src/cli.rs|tools/opsctl/src/lib.rs|tools/opsctl/src/release/*.rs|tools/opsctl/src/promotion/*.rs) ;;
              *) echo "unexpected cutover path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"

      - name: Commit verified cutover to the single AR-11 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/opsctl/src .github/workflows/ar11-promotion-cli-cutover.yml scripts/ar11-promotion-cli-cutover.py
          git commit -m 'AR-11: activate promotion plan preflight verify'
          git push origin HEAD:agent/ar11-release-capability-promotion
