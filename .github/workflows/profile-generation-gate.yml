name: Profile Generation Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-generation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2f-device-d1-materialize:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase2f-device-browser-mailbox'
    name: Phase 2F Device D1 Materialize And Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 2F source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2f-device-browser-mailbox
          fetch-depth: 0

      - name: Materialize formatting and generated consistency
        run: |
          cargo fmt --all
          cargo generate-lockfile
          python scripts/generate-architecture-inventory.py --write
          rustup target add wasm32-unknown-unknown

      - name: Verify coherent device D1 slice before commit
        run: |
          set -euo pipefail
          python scripts/check-architecture.py
          python scripts/test-device-job-d1.py
          cargo clippy --locked -p device-domain -p application-ports -p use-cases-devices -p cloudflare-adapters --all-targets -- -D warnings
          cargo test --locked -p device-domain -p application-ports -p use-cases-devices
          cargo test --locked -p cloudflare-adapters --lib
          cargo check --locked -p device-domain -p application-ports -p use-cases-devices -p cloudflare-adapters --target wasm32-unknown-unknown
          python scripts/generate-architecture-inventory.py --check
          git diff --check

      - name: Commit verified generated state and restore permanent workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/profile-generation-gate.yml
          git add -A
          git diff --cached --check
          git commit -m "Phase 2F: verify typed device job D1 slice"
          git push origin HEAD:phase2f-device-browser-mailbox

  profile-generation:
    name: Registry Domain D1 Adapter Worker And Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test generation domain
        run: cargo test --locked -p profile-domain

      - name: Test Cloudflare generation adapter
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Test Worker request evidence and routing helpers
        run: cargo test --locked -p browser-profile-control-plane-worker --lib

      - name: Check composed Worker for WASM
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Compile registry and contract tests
        run: >-
          python -m py_compile
          scripts/check-contract-compatibility.py
          scripts/render-openapi.py
          scripts/test-openapi-fragments.py
          scripts/test-profile-generation-registry.py
          scripts/test-profile-generation-registry-edge-cases.py
          scripts/test-profile-generation-integrity-guards.py

      - name: Prove governed registry and activation
        run: |
          python scripts/test-profile-generation-registry.py
          python scripts/test-profile-generation-registry-edge-cases.py
          python scripts/test-profile-generation-integrity-guards.py

      - name: Verify additive OpenAPI contract
        run: |
          python scripts/test-openapi-fragments.py
          python scripts/check-contract-compatibility.py
          python scripts/render-openapi.py --output /tmp/openapi-v1.json
          python -m json.tool /tmp/openapi-v1.json >/dev/null
          grep -q 'registerProfileGeneration' /tmp/openapi-v1.json
          grep -q 'getProfileGeneration' /tmp/openapi-v1.json
          grep -q 'verifyProfileGeneration' /tmp/openapi-v1.json
          grep -q 'activateProfileGeneration' /tmp/openapi-v1.json
          grep -q 'deactivateProfileGeneration' /tmp/openapi-v1.json
          grep -q 'quarantineProfileGeneration' /tmp/openapi-v1.json

      - name: Reject migration gaps and unsafe registry storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('migrations/d1').glob('[0-9][0-9][0-9][0-9]_*.sql'))
          versions = [int(path.name.split('_', 1)[0]) for path in files]
          expected = list(range(1, len(files) + 1))
          if versions != expected:
              raise SystemExit(f'non-contiguous D1 migrations: {versions}; expected {expected}')
          PY
          grep -q 'CREATE TABLE profile_generations' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'active_profile_generation_cannot_be_quarantined' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'profile_generation_time_regression' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'profile_generation_insert_not_governed' migrations/d1/0007_profile_generation_integrity_guards.sql
          grep -q 'profile_generation_activation_not_governed' migrations/d1/0007_profile_generation_integrity_guards.sql
          grep -q 'profile_generation_deactivate_commands' migrations/d1/0008_profile_generation_deactivation.sql
          grep -q 'profile_generation_deactivation_not_governed' migrations/d1/0008_profile_generation_deactivation.sql
          if grep -R --line-number -E '(plaintext|private_key|secret_key|profile_bytes)[[:space:]]+TEXT' \
            migrations/d1/0006_profile_generation_registry.sql \
            migrations/d1/0007_profile_generation_integrity_guards.sql \
            migrations/d1/0008_profile_generation_deactivation.sql; then
            echo 'Generation registry must remain metadata-only.' >&2
            exit 1
          fi
