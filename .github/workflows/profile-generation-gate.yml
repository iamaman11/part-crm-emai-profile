name: Profile Generation Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: profile-generation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2f-browser-freshness-materialize:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase2f-device-browser-mailbox'
    name: Phase 2F Browser Freshness Materialize And Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 2F source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2f-device-browser-mailbox
          fetch-depth: 0

      - name: Materialize Bridge identity and launch guard wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_lib = Path('crates/bridge-domain/src/lib.rs')
          text = bridge_lib.read_text(encoding='utf-8')
          if 'pub mod browser_execution;' not in text:
              marker = '#![forbid(unsafe_code)]\n'
              if text.count(marker) != 1:
                  raise SystemExit('bridge-domain lib marker changed')
              text = text.replace(marker, marker + '\npub mod browser_execution;\n', 1)
          bridge_lib.write_text(text, encoding='utf-8')

          bridge = Path('crates/bridge-domain/src/browser_execution.rs')
          text = bridge.read_text(encoding='utf-8')
          if 'materialized_inventory_digest: u64' not in text:
              text = text.replace(
                  '    source_container_sha256: String,\n    browser_identity: BrowserIdentityManifest,',
                  '    source_container_sha256: String,\n    materialized_inventory_digest: u64,\n    browser_identity: BrowserIdentityManifest,',
                  1,
              )
              text = text.replace(
                  '        source_container_sha256: impl Into<String>,\n        browser_identity: BrowserIdentityManifest,',
                  '        source_container_sha256: impl Into<String>,\n        materialized_inventory_digest: u64,\n        browser_identity: BrowserIdentityManifest,',
                  1,
              )
              text = text.replace(
                  '        if !valid_sha256(&source_container_sha256) {\n            return Err(BrowserExecutionError::InvalidDigest);\n        }',
                  '        if !valid_sha256(&source_container_sha256) {\n            return Err(BrowserExecutionError::InvalidDigest);\n        }\n        if materialized_inventory_digest == 0 {\n            return Err(BrowserExecutionError::InvalidMaterializationInventory);\n        }',
                  1,
              )
              text = text.replace(
                  '            source_container_sha256,\n            browser_identity,',
                  '            source_container_sha256,\n            materialized_inventory_digest,\n            browser_identity,',
                  1,
              )
              text = text.replace(
                  '    pub fn source_container_sha256(&self) -> &str {\n        &self.source_container_sha256\n    }\n',
                  '    pub fn source_container_sha256(&self) -> &str {\n        &self.source_container_sha256\n    }\n\n    #[must_use]\n    pub const fn materialized_inventory_digest(&self) -> u64 {\n        self.materialized_inventory_digest\n    }\n',
                  1,
              )
              text = text.replace(
                  '        source_container_sha256: &str,\n        browser_identity: &BrowserIdentityManifest,',
                  '        source_container_sha256: &str,\n        materialized_inventory_digest: u64,\n        browser_identity: &BrowserIdentityManifest,',
                  1,
              )
              text = text.replace(
                  '            && self.source_container_sha256 == source_container_sha256\n            && self.browser_identity.compatibility_with(browser_identity)',
                  '            && self.source_container_sha256 == source_container_sha256\n            && self.materialized_inventory_digest == materialized_inventory_digest\n            && self.browser_identity.compatibility_with(browser_identity)',
                  1,
              )
              text = text.replace(
                  '    InvalidDigest,\n    InvalidNetworkPolicy,',
                  '    InvalidDigest,\n    InvalidMaterializationInventory,\n    InvalidNetworkPolicy,',
                  1,
              )
              text = text.replace(
                  '            Self::InvalidDigest => "browser identity digest must be lowercase SHA-256 hex",\n',
                  '            Self::InvalidDigest => "browser identity digest must be lowercase SHA-256 hex",\n            Self::InvalidMaterializationInventory => "materialized inventory digest must be non-zero",\n',
                  1,
              )
              # Domain test constructor/matches additions are intentionally exact and bounded.
              text = text.replace(
                  '            "c".repeat(64),\n            accepted_identity.clone(),',
                  '            "c".repeat(64),\n            42,\n            accepted_identity.clone(),',
                  1,
              )
              text = text.replace(
                  '            &"c".repeat(64),\n            &accepted_identity',
                  '            &"c".repeat(64),\n            42,\n            &accepted_identity',
                  1,
              )
              text = text.replace(
                  '            &"c".repeat(64),\n            &accepted_identity\n        ));\n        assert!(!binding.matches(',
                  '            &"c".repeat(64),\n            42,\n            &accepted_identity\n        ));\n        assert!(!binding.matches(',
                  1,
              )
              # Remaining two negative matches.
              text = text.replace(
                  '            &"c".repeat(64),\n            &accepted_identity\n        ));\n        assert!(!binding.matches(',
                  '            &"c".repeat(64),\n            42,\n            &accepted_identity\n        ));\n        assert!(!binding.matches(',
                  1,
              )
              text = text.replace(
                  '            &"c".repeat(64),\n            &identity(\'b\')?',
                  '            &"c".repeat(64),\n            42,\n            &identity(\'b\')?',
                  1,
              )
          # Observation validation must classify bad observations, not bad policies.
          text = text.replace(
              '        validate_optional_location(Some(&country))?;\n        validate_optional_location(Some(&region))?;\n        if !valid_timezone(&timezone) || asn == 0 || !valid_route_identity(&route_identity) {',
              '        validate_optional_location(Some(&country))\n            .map_err(|_| BrowserExecutionError::InvalidNetworkObservation)?;\n        validate_optional_location(Some(&region))\n            .map_err(|_| BrowserExecutionError::InvalidNetworkObservation)?;\n        if !valid_timezone(&timezone) || asn == 0 || !valid_route_identity(&route_identity) {',
              1,
          )
          bridge.write_text(text, encoding='utf-8')

          app_lib = Path('apps/profile-bridge/src/lib.rs')
          text = app_lib.read_text(encoding='utf-8')
          if 'pub mod browser_execution;' not in text:
              marker = '#![forbid(unsafe_code)]\n'
              if text.count(marker) != 1:
                  raise SystemExit('profile-bridge lib marker changed')
              text = text.replace(marker, marker + '\npub mod browser_execution;\n', 1)
          app_lib.write_text(text, encoding='utf-8')

          guard = Path('apps/profile-bridge/src/browser_execution.rs')
          text = guard.read_text(encoding='utf-8')
          text = text.replace('if values.len() != 10 ||', 'if values.len() != 11 ||', 1)
          old = '''    if &actual != expected
        || workspace.inventory()?.inventory_digest() != expected.materialized_inventory_digest()
    {
        return Err(BrowserLaunchBlocker::MaterializationStale);
    }

    let writer = BrowserWriterObservation::new('''
          new = '''    if &actual != expected {
        return Err(BrowserLaunchBlocker::MaterializationStale);
    }

    let writer = BrowserWriterObservation::new('''
          if old not in text:
              raise SystemExit('browser launch guard ordering marker changed')
          text = text.replace(old, new, 1)
          marker = '''        BrowserWriterDecision::RecoveryRequired => {
            return Err(BrowserLaunchBlocker::RecoveryRequired);
        }
    }

    match network_policy.evaluate(network_observation) {'''
          replacement = '''        BrowserWriterDecision::RecoveryRequired => {
            return Err(BrowserLaunchBlocker::RecoveryRequired);
        }
    }

    if workspace.inventory()?.inventory_digest() != expected.materialized_inventory_digest() {
        return Err(BrowserLaunchBlocker::MaterializationStale);
    }

    match network_policy.evaluate(network_observation) {'''
          if marker not in text:
              raise SystemExit('browser launch network marker changed')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '            Err(BrowserLaunchBlocker::MaterializationStale)\n        );\n        assert!(workspace.path().join(".parentlock").exists());',
              '            Err(BrowserLaunchBlocker::RecoveryRequired)\n        );\n        assert!(workspace.path().join(".parentlock").exists());',
              1,
          )
          guard.write_text(text, encoding='utf-8')
          PY

      - name: Materialize formatting and generated consistency
        run: |
          cargo fmt --all
          cargo generate-lockfile
          python scripts/generate-architecture-inventory.py --write
          rustup target add wasm32-unknown-unknown

      - name: Verify browser freshness slice before commit
        run: |
          set -euo pipefail
          python scripts/check-architecture.py
          python scripts/test-device-job-d1.py
          cargo clippy --locked -p bridge-domain -p profile-bridge -p device-domain -p application-ports -p use-cases-devices --all-targets -- -D warnings
          cargo test --locked -p bridge-domain -p profile-bridge -p device-domain -p application-ports -p use-cases-devices
          cargo test --locked -p cloudflare-adapters --lib
          cargo check --locked -p cloudflare-adapters --target wasm32-unknown-unknown
          python scripts/generate-architecture-inventory.py --check
          git diff --check

      - name: Commit verified slice and restore permanent workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/profile-generation-gate.yml
          git add -A
          git diff --cached --check
          git commit -m "Phase 2F: verify browser materialization freshness guards"
          git push origin HEAD:phase2f-device-browser-mailbox

  profile-generation:
    name: Registry Domain D1 Adapter Worker And Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test generation domain
        run: cargo test --locked -p profile-domain

      - name: Test Cloudflare generation adapter
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Test Worker request evidence and routing helpers
        run: cargo test --locked -p browser-profile-control-plane-worker --lib

      - name: Check composed Worker for WASM
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Compile registry and contract tests
        run: >-
          python -m py_compile
          scripts/check-contract-compatibility.py
          scripts/render-openapi.py
          scripts/test-openapi-fragments.py
          scripts/test-profile-generation-registry.py
          scripts/test-profile-generation-registry-edge-cases.py
          scripts/test-profile-generation-integrity-guards.py

      - name: Prove governed registry and activation
        run: |
          python scripts/test-profile-generation-registry.py
          python scripts/test-profile-generation-registry-edge-cases.py
          python scripts/test-profile-generation-integrity-guards.py

      - name: Verify additive OpenAPI contract
        run: |
          python scripts/test-openapi-fragments.py
          python scripts/check-contract-compatibility.py
          python scripts/render-openapi.py --output /tmp/openapi-v1.json
          python -m json.tool /tmp/openapi-v1.json >/dev/null
          grep -q 'registerProfileGeneration' /tmp/openapi-v1.json
          grep -q 'getProfileGeneration' /tmp/openapi-v1.json
          grep -q 'verifyProfileGeneration' /tmp/openapi-v1.json
          grep -q 'activateProfileGeneration' /tmp/openapi-v1.json
          grep -q 'deactivateProfileGeneration' /tmp/openapi-v1.json
          grep -q 'quarantineProfileGeneration' /tmp/openapi-v1.json

      - name: Reject migration gaps and unsafe registry storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          files = sorted(Path('migrations/d1').glob('[0-9][0-9][0-9][0-9]_*.sql'))
          versions = [int(path.name.split('_', 1)[0]) for path in files]
          expected = list(range(1, len(files) + 1))
          if versions != expected:
              raise SystemExit(f'non-contiguous D1 migrations: {versions}; expected {expected}')
          PY
          grep -q 'CREATE TABLE profile_generations' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'active_profile_generation_cannot_be_quarantined' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'profile_generation_time_regression' migrations/d1/0006_profile_generation_registry.sql
          grep -q 'profile_generation_insert_not_governed' migrations/d1/0007_profile_generation_integrity_guards.sql
          grep -q 'profile_generation_activation_not_governed' migrations/d1/0007_profile_generation_integrity_guards.sql
          grep -q 'profile_generation_deactivate_commands' migrations/d1/0008_profile_generation_deactivation.sql
          grep -q 'profile_generation_deactivation_not_governed' migrations/d1/0008_profile_generation_deactivation.sql
          if grep -R --line-number -E '(plaintext|private_key|secret_key|profile_bytes)[[:space:]]+TEXT' \
            migrations/d1/0006_profile_generation_registry.sql \
            migrations/d1/0007_profile_generation_integrity_guards.sql \
            migrations/d1/0008_profile_generation_deactivation.sql; then
            echo 'Generation registry must remain metadata-only.' >&2
            exit 1
          fi
