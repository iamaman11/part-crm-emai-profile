name: R6 Cross Component Sync Temporary

on:
  push:
    branches:
      - audit/frontend-api-ownership
    paths:
      - .github/workflows/r6-cross-component-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/frontend-api-ownership
          fetch-depth: 0

      - name: Sync R6 cross-component evidence fail closed
        shell: bash
        run: |
          set -euo pipefail
          python .github/r6-cross-component-sync.py
          python scripts/test-cross-component-acceptance.py
          python scripts/check-frontend-feature-boundaries.py
          python scripts/check-frontend-feature-boundaries.py --self-test
          git diff --check

      - name: Commit R6 evidence sync and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r6-cross-component-sync.yml
          rm .github/r6-cross-component-sync.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align cross-component evidence with R6 frontend ownership"
          git push origin HEAD:audit/frontend-api-ownership
