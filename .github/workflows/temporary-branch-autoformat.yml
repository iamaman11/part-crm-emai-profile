name: Temporary Feature Branch Autoformat

on:
  push:
    branches:
      - profile-generation-registry-api

permissions:
  contents: write

concurrency:
  group: temporary-feature-autoformat
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: profile-generation-registry-api
          persist-credentials: true

      - name: Apply pinned Rust formatting
        run: cargo fmt --all

      - name: Commit deterministic formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply pinned cargo fmt [skip ci]'
          git push origin HEAD:profile-generation-registry-api
