name: AR-9 Projection Artifact Temporary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ar9-projection-materializer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize exact canonical projections and self-remove
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source with bounded branch write credential
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Generate and verify canonical AR-9 projections
        run: |
          set -euo pipefail
          python scripts/generate-ar8-completion-status.py --write
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-ar8-completion-status.py --check
          python scripts/generate-architecture-inventory.py --check

      - name: Remove transient projection scaffolding
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/d1-evolution-gate.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Emit exact generated AR-9 canonical projection candidates\n'
          end_marker = '      - name: Set up pinned Node and npm\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('transient D1 projection emitter block not found exactly')
          path.write_text(text[:start] + text[end:], encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/ar9-projection-artifact-temp.yml

      - name: Require bounded deterministic diff
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/ar9-projection-artifact-temp.yml',
              '.github/workflows/d1-evolution-gate.yml',
              'docs/status.json',
              'architecture/architecture-rebaseline-v3-transition.json',
              'architecture/inventory.json',
          }
          observed = {
              line[3:]
              for line in subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
              if line.strip()
          }
          if observed != allowed:
              raise SystemExit(f'unexpected materializer diff: observed={sorted(observed)} expected={sorted(allowed)}')
          PY

      - name: Commit exact projections and cleanup to AR-9 branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/status.json architecture/architecture-rebaseline-v3-transition.json architecture/inventory.json .github/workflows/d1-evolution-gate.yml
          git commit -m 'AR-9: materialize canonical D1 projections'
          git push origin HEAD:agent/ar9-d1-evolution
