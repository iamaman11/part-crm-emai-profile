name: AR-8C One-Shot Preflight Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ar8c-dispatch-preflight-once.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: ar8c-one-shot-preflight-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch protected AR-8C staging preflight once
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: iamaman11/part-crm-emai-profile
      EXPECTED_WORKFLOW_ID: '335828549'
      EXPECTED_REF: main
    steps:
      - name: Dispatch accepted workflow_dispatch entrypoint
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main"}'
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.github.com/repos/${EXPECTED_REPOSITORY}/actions/workflows/${EXPECTED_WORKFLOW_ID}/dispatches")"
          if [ "$status" != '204' ]; then
            echo "workflow dispatch failed with HTTP $status" >&2
            cat "$RUNNER_TEMP/dispatch-response.txt" >&2
            exit 1
          fi
          echo "AR-8C protected staging preflight dispatch accepted for ${EXPECTED_REF}."
