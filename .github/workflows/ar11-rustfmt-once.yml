name: AR-11 Rustfmt Once

on:
  pull_request:

permissions:
  contents: read

jobs:
  rustfmt:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ar11-release-capability-promotion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Format only new release policy files
        run: |
          set -euo pipefail
          rustfmt --edition 2024 \
            tools/opsctl/src/release/compatibility.rs \
            tools/opsctl/src/release/static_compatibility.rs
          git rm .github/workflows/ar11-rustfmt-once.yml
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              tools/opsctl/src/release/compatibility.rs|tools/opsctl/src/release/static_compatibility.rs|.github/workflows/ar11-rustfmt-once.yml) ;;
              *) echo "unexpected rustfmt path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/opsctl/src/release/compatibility.rs tools/opsctl/src/release/static_compatibility.rs
          git add -u .github/workflows/ar11-rustfmt-once.yml
          git commit -m 'AR-11: rustfmt native release compatibility'
          git push origin HEAD:agent/ar11-release-capability-promotion
