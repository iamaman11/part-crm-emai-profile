name: One Shot Hardening Format

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repository-quality-hardening-clean'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-quality-hardening-clean
          persist-credentials: true
      - name: Show pinned toolchain
        run: rustup show active-toolchain
      - name: Apply pinned cargo formatting
        run: cargo fmt --all
      - name: Validate mechanical-only diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No formatting changes required."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) echo "Unexpected non-Rust formatter change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Commit mechanical formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps crates
          git commit -m "Apply pinned cargo fmt"
          git push origin HEAD:repository-quality-hardening-clean
