name: P2 Cargo Lock Refresh One Shot

on:
  push:
    branches:
      - cap-exec/p2-authorized-launch

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT_SHA: dd721d4cfff215ad57dad6c1f2c956f570bee96f
      TARGET_BRANCH: cap-exec/p2-authorized-launch
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2

      - name: Verify one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test -f Cargo.lock
          test -f apps/profile-bridge/Cargo.toml

      - name: Refresh Cargo lock deterministically
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.before"
          cargo metadata --format-version=1 > "$RUNNER_TEMP/metadata.json"
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          before_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "Cargo.lock.before"
          after_path = pathlib.Path("Cargo.lock")
          before = tomllib.loads(before_path.read_text(encoding="utf-8"))
          after = tomllib.loads(after_path.read_text(encoding="utf-8"))

          def keyed(doc):
              return {
                  (p["name"], p.get("version"), p.get("source")): p
                  for p in doc["package"]
              }

          before_packages = keyed(before)
          after_packages = keyed(after)
          if before_packages.keys() != after_packages.keys():
              raise SystemExit("lock refresh changed package identities")

          target = ("profile-bridge", "0.1.0", None)
          for key in before_packages:
              if key == target:
                  continue
              if before_packages[key] != after_packages[key]:
                  raise SystemExit(f"unexpected lock change outside profile-bridge: {key}")

          old = set(before_packages[target].get("dependencies", []))
          new = set(after_packages[target].get("dependencies", []))
          expected = {"control-plane-contract", "serde", "serde_json"}
          if new - old != expected:
              raise SystemExit(f"unexpected profile-bridge dependency additions: {sorted(new-old)}")
          if old - new:
              raise SystemExit(f"unexpected profile-bridge dependency removals: {sorted(old-new)}")
          PY
          git diff --check -- Cargo.lock

      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p2-lock-refresh.yml
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(p2): refresh Cargo lockfile"
          git push origin "HEAD:$TARGET_BRANCH"
