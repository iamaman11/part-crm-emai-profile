name: Phase 1B Materialize

on:
  push:
    branches:
      - phase1b-delivery-hardening

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Materialize lock and formatting
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Self-clean and commit
        run: |
          rm .github/workflows/phase1b-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock . ':!.github/workflows/phase1b-materialize.yml'
          git add -u .github/workflows/phase1b-materialize.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Phase 1B: materialize lock and rustfmt'
          git push origin HEAD:phase1b-delivery-hardening
