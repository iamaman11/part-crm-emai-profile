name: Repository Step 4 WebCrypto Hardening

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: repository-step4-webcrypto-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Harden JS boundary argument conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/cloudflare-adapters/src/access_webcrypto_reflect.rs")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    import_arguments.push(&rsa_jwk_object(key)?);\n'
              '    import_arguments.push(&rsa_algorithm_object()?);\n'
              '    import_arguments.push(&JsValue::from_bool(false));\n'
              '    import_arguments.push(&usages);\n',
              '    let jwk = JsValue::from(rsa_jwk_object(key)?);\n'
              '    let algorithm = JsValue::from(rsa_algorithm_object()?);\n'
              '    let usages_value = JsValue::from(usages);\n'
              '    import_arguments.push(&jwk);\n'
              '    import_arguments.push(&algorithm);\n'
              '    import_arguments.push(&JsValue::from_bool(false));\n'
              '    import_arguments.push(&usages_value);\n',
          )
          text = text.replace(
              '    verify_arguments.push(&crypto_key);\n'
              '    verify_arguments.push(&signature);\n'
              '    verify_arguments.push(&signing_input);\n',
              '    verify_arguments.push(&crypto_key);\n'
              '    verify_arguments.push(signature.as_ref());\n'
              '    verify_arguments.push(signing_input.as_ref());\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Require adapter and Worker checks
        run: |
          cargo test --locked -p cloudflare-adapters --lib
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/repository-step4-webcrypto-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: harden WebCrypto JS boundary"
          git push origin HEAD:repository-step-4-identity-clients-acl
