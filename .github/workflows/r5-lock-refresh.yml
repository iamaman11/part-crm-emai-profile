name: R5 Lock Refresh Temporary

on:
  push:
    branches:
      - audit/use-cases-compatibility-coupling
    paths:
      - .github/workflows/r5-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/use-cases-compatibility-coupling
          fetch-depth: 0

      - name: Restore accepted lock and refresh graph
        shell: bash
        run: |
          set -euo pipefail
          git show 02074084a9d76e0dd3d3c2d2d35866123e4117ce:Cargo.lock > /tmp/base-Cargo.lock
          cp /tmp/base-Cargo.lock Cargo.lock
          cargo metadata --format-version 1 >/dev/null

      - name: Prove dependency-only lock delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import tomllib

          base = tomllib.loads(Path("/tmp/base-Cargo.lock").read_text(encoding="utf-8"))
          current = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          assert base["version"] == current["version"] == 4

          def packages(document):
              return {package["name"]: package for package in document["package"]}

          before = packages(base)
          after = packages(current)
          assert before.keys() == after.keys(), "Cargo package set changed"

          expected_dependencies = {
              "browser-profile-control-plane-worker": [
                  "application-ports",
                  "client-domain",
                  "cloudflare-adapters",
                  "control-plane-contract",
                  "device-domain",
                  "identity-access-domain",
                  "profile-platform-primitives",
                  "serde",
                  "serde_json",
                  "session-domain",
                  "sha2",
                  "use-cases",
                  "use-cases-clients",
                  "use-cases-devices",
                  "use-cases-identity",
                  "use-cases-mailboxes",
                  "use-cases-notifications",
                  "use-cases-query",
                  "wasm-bindgen",
                  "worker",
              ],
              "use-cases": [
                  "application-ports",
                  "client-domain",
                  "contracts",
                  "identity-access-domain",
                  "profile-domain",
                  "profile-platform-primitives",
                  "session-domain",
              ],
          }

          for name in before:
              previous = deepcopy(before[name])
              updated = deepcopy(after[name])
              if name in expected_dependencies:
                  assert updated.get("dependencies", []) == expected_dependencies[name], (
                      name,
                      updated.get("dependencies", []),
                  )
                  previous.pop("dependencies", None)
                  updated.pop("dependencies", None)
              assert previous == updated, f"unexpected Cargo.lock drift in {name}"
          PY
          git diff -- Cargo.lock

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet -- Cargo.lock && {
            echo "Cargo.lock did not change as expected" >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Refresh lockfile for R5 ownership cleanup"
          git push origin HEAD:audit/use-cases-compatibility-coupling
