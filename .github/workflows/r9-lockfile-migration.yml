name: R9 Lockfile Migration

on:
  push:
    branches:
      - audit/r9-certification-device-authority

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R9 branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: audit/r9-certification-device-authority

      - name: Refresh lockfile for removed certification dependency
        run: cargo check -p certification-domain

      - name: Fail closed unless lockfile diff is exactly the obsolete edge removal
        run: |
          test "$(git diff --name-only)" = "Cargo.lock"
          test "$(git diff --numstat -- Cargo.lock)" = $'0\t1\tCargo.lock'
          test "$(git diff --unified=0 -- Cargo.lock | grep -E '^[+-]' | grep -Ev '^(---|\+\+\+)' | wc -l)" -eq 1
          git diff --unified=0 -- Cargo.lock | grep -F -- '- "profile-platform-primitives",'
          python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("Cargo.lock").read_text(encoding="utf-8"))
          matches = [p for p in data["package"] if p["name"] == "certification-domain"]
          assert len(matches) == 1, matches
          assert matches[0].get("dependencies") == ["sha2"], matches[0]
          PY

      - name: Commit exact lockfile migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Pre-2J R9: refresh certification lockfile"
          git push origin HEAD:audit/r9-certification-device-authority
