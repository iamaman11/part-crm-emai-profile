name: AR-11 FC-6 Operator Transport

run-name: AR11 operator transport ${{ github.event.workflow_run.id }}

on:
  workflow_run:
    workflows: [Release Architecture Gate]
    types: [completed]

permissions:
  contents: read

jobs:
  operator-entrypoint:
    name: Bind accepted data-only request to canonical dispatch
    if: github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'codex/ar11-fc6-request-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact protected-main operator adapter
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate immutable request and dispatch canonical promotion authority
        run: node .github/scripts/ar11-fc6-operator.mjs
