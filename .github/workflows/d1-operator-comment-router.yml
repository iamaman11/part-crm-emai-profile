name: D1 Operator Comment Router

run-name: D1 operator comment transport / ${{ github.event_name }} / ${{ github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/d1-operator-comment-router.yml'
      - '.github/workflows/d1-operator.yml'
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-migration-executor.yml'
      - 'architecture/credential-authority-ar11-extension.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-operator-comment-router.yml'
      - '.github/workflows/d1-operator.yml'
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-migration-executor.yml'
      - 'architecture/credential-authority-ar11-extension.json'
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: d1-operator-comment-router
  cancel-in-progress: false

jobs:
  contract:
    name: D1 operator comment router is transport-only
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove router owns transport only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('.github/workflows/d1-operator-comment-router.yml').read_text(encoding='utf-8')
          operator = Path('.github/workflows/d1-operator.yml').read_text(encoding='utf-8')
          observer = Path('.github/workflows/d1-isolated-target-observation.yml').read_text(encoding='utf-8')
          executor = Path('.github/workflows/d1-migration-executor.yml').read_text(encoding='utf-8')
          credential_authority = Path('architecture/credential-authority-ar11-extension.json').read_text(encoding='utf-8')

          forbidden = (
              'CLOUD' + 'FLARE_',
              'wrang' + 'ler ',
              'd1 migrations ' + 'apply',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1 time-travel ' + 'restore',
              'D1_TRANSACTION_' + 'AUTHORIZATION_V1',
              'issues:' + ' write',
              'contents:' + ' write',
              'D1_OPERATOR_' + 'DISPATCH_TOKEN',
          )
          for value in forbidden:
              assert value not in router, f'comment router acquired forbidden authority: {value}'

          secret_prefix = 'sec' + 'rets.'
          dispatch_secret = secret_prefix + 'GH_ADMIN_OPERATOR_TOKEN'
          assert router.count(secret_prefix) == 2, 'governed GitHub admin credential may appear only in the two privileged dispatch steps'
          assert router.count(dispatch_secret) == 2, 'operator and restore dispatch must reuse only the governed GitHub admin credential'
          assert '"credential_id": "github.hosted-admin-operator"' in credential_authority
          assert '".github/workflows/d1-operator-comment-router.yml"' in credential_authority

          dispatch_token = '/' + 'dispatches'
          assert router.count(dispatch_token) == 3, 'comment router must expose exactly three bounded downstream dispatches'
          assert ('actions/workflows/d1-operator.yml/' + 'dispatches') in router
          assert ('actions/workflows/d1-isolated-target-observation.yml/' + 'dispatches') in router
          assert ('actions/workflows/d1-migration-executor.yml/' + 'dispatches') in router
          assert "github.event.comment.body == '/d1 operator'" in router
          assert "startsWith(github.event.comment.body, '/d1 time-travel-info ')" in router
          assert "startsWith(github.event.comment.body, '/d1 time-travel-restore ')" in router
          assert 'operation_mode:' in executor and 'time_travel_restore' in executor
          assert 'authorize_restore:' in executor and 'Restore exact D1 bookmark with deploy credential' in executor
          assert executor.count("if: inputs.operation_mode == 'migration'") == 2, 'existing migration authorize+execute jobs must both be guarded from restore mode'
          restore_source = executor.split('\n  authorize_restore:', 1)[1]
          assert 'd1 migrations apply' not in restore_source, 'restore mode must never apply migrations'
          assert 'd1 create' not in restore_source and 'd1 delete' not in restore_source
          assert restore_source.count('secrets.CLOUDFLARE_API_TOKEN') == 1, 'restore mode may expose deploy credential only to the exact restore write step'
          assert restore_source.count('secrets.CLOUDFLARE_OBSERVE_API_TOKEN') == 2, 'restore mode must use read-only credential only for pre/post provider proof'
          assert 'environment: staging' in restore_source
          assert 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_V1' in restore_source
          assert '/time_travel/restore?bookmark=$RESTORE_BOOKMARK' in restore_source
          order = [
              restore_source.index('Prove restore authorization has not been consumed'),
              restore_source.index('Consume Time Travel restore authorization'),
              restore_source.index('Persist restore MUTATION_STARTED receipt'),
              restore_source.index('Restore exact D1 bookmark with deploy credential'),
              restore_source.index('Fresh post-restore ledger and diagnostics proof'),
              restore_source.index('Terminalize restore receipt fail closed'),
          ]
          assert order == sorted(order), 'restore one-shot/receipt/postverify ordering drifted'
          assert "github.event.comment.author_association == 'OWNER'" in router
          assert 'github.actor == github.repository_owner' in router
          assert 'CURRENT_STAGE_ISSUE = #' in router
          assert "github.event.issue.state == 'open'" in router
          assert "github.event.issue.pull_request == null" in router
          route_source = router.split('\n  route:', 1)[1]
          assert 'actions: write' in route_source, 'read-only observer dispatch must use the bounded ephemeral Actions permission'
          github_token_expr = '$' + '{{ github.token }}'
          admin_token_expr = '$' + '{{ ' + secret_prefix + 'GH_ADMIN_OPERATOR_TOKEN }}'
          assert f'GH_TOKEN: {github_token_expr}' in route_source
          assert f'GH_TOKEN: {admin_token_expr}' in route_source

          operator_trigger = operator.split('\npermissions:', 1)[0]
          operator_dispatch = operator_trigger.split('\n  workflow_dispatch:', 1)[1]
          assert 'inputs:' not in operator_dispatch, 'standard D1 operator must remain zero-input'
          assert 'test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"' in operator, 'standard operator owner-identity gate drifted'

          observer_trigger = observer.split('\npermissions:', 1)[0]
          observer_dispatch = observer_trigger.split('\n  workflow_dispatch:', 1)[1]
          assert 'time_travel_unix_seconds:' in observer_dispatch, 'existing observer must own the optional read-only Time Travel timestamp input'
          assert 'required: false' in observer_dispatch
          assert 'type: string' in observer_dispatch
          PY

  route:
    name: Route exact owner command to bounded D1 read/operator workflow
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      (
        github.event.comment.body == '/d1 operator' ||
        startsWith(github.event.comment.body, '/d1 time-travel-info ') ||
        startsWith(github.event.comment.body, '/d1 time-travel-restore ')
      ) &&
      github.event.comment.author_association == 'OWNER' &&
      github.actor == github.repository_owner
    needs: contract
    permissions:
      contents: read
      issues: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      COMMENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
      COMMENT_ACTOR: ${{ github.actor }}
      REPOSITORY_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Bind command to fresh protected main and CURRENT stage issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$COMMENT_AUTHOR_ASSOCIATION" = OWNER
          test "$COMMENT_ACTOR" = "$REPOSITORY_OWNER"

          python - "$COMMENT_BODY" "$GITHUB_ENV" <<'PY'
          import re
          import sys

          body, env_path = sys.argv[1:]
          restore_comment = ''
          if body == '/d1 operator':
              kind = 'operator'
              timestamp = ''
          else:
              info = re.fullmatch(r'/d1 time-travel-info ([0-9]{10})', body)
              restore = re.fullmatch(r'/d1 time-travel-restore ([1-9][0-9]*)', body)
              if info is not None:
                  kind = 'time_travel_info'
                  timestamp = info.group(1)
              elif restore is not None:
                  kind = 'time_travel_restore'
                  timestamp = ''
                  restore_comment = restore.group(1)
              else:
                  raise SystemExit('owner D1 command is not an exact supported transport command')
          with open(env_path, 'a', encoding='utf-8') as handle:
              handle.write(f'D1_ROUTE_KIND={kind}\n')
              handle.write(f'D1_TIME_TRAVEL_UNIX_SECONDS={timestamp}\n')
              handle.write(f'D1_RESTORE_AUTHORIZATION_COMMENT_ID={restore_comment}\n')
          PY

          main_json="$RUNNER_TEMP/main.json"
          tracker_json="$RUNNER_TEMP/current-stage-tracker.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$main_json"
          gh api "repos/$GITHUB_REPOSITORY/issues/266" > "$tracker_json"

          main_sha="$(jq -er '.commit.sha | select(type == "string" and length == 40)' "$main_json")"
          test "$main_sha" = "$GITHUB_SHA"

          python - "$tracker_json" "$COMMENT_ISSUE_NUMBER" <<'PY'
          import json
          import re
          import sys

          tracker_path, comment_issue = sys.argv[1:]
          tracker = json.load(open(tracker_path, encoding='utf-8'))
          if tracker.get('state') != 'open':
              raise SystemExit('live stage pointer #266 is not open')
          body = tracker.get('body')
          if not isinstance(body, str):
              raise SystemExit('live stage pointer #266 has no text body')
          matches = re.findall(r'^CURRENT_STAGE_ISSUE = #([1-9][0-9]*)$', body, flags=re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit('live stage pointer has missing or ambiguous CURRENT_STAGE_ISSUE')
          if matches[0] != comment_issue:
              raise SystemExit(f'command issue #{comment_issue} is not CURRENT stage issue #{matches[0]}')
          PY

      - name: Dispatch zero-input standard D1 operator as repository owner
        if: env.D1_ROUTE_KIND == 'operator'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/d1-operator.yml/dispatches" \
            -f ref=main

      - name: Dispatch exact read-only Time Travel lookup through existing observer
        if: env.D1_ROUTE_KIND == 'time_travel_info'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$D1_TIME_TRAVEL_UNIX_SECONDS"
          payload="$RUNNER_TEMP/d1-time-travel-info-dispatch.json"
          jq -nc \
            --arg ref main \
            --arg timestamp "$D1_TIME_TRAVEL_UNIX_SECONDS" \
            '{ref:$ref,inputs:{time_travel_unix_seconds:$timestamp}}' > "$payload"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/d1-isolated-target-observation.yml/dispatches" \
            --input "$payload"

      - name: Resolve exact restore transport envelope from OWNER authorization
        if: env.D1_ROUTE_KIND == 'time_travel_restore'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$RUNNER_TEMP/d1-restore-authorization.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$D1_RESTORE_AUTHORIZATION_COMMENT_ID" > "$auth"
          python - "$auth" "$GITHUB_ENV" <<'PY_RESTORE_ROUTE'
          import json, os, sys
          path, env_path = sys.argv[1:]
          comment = json.load(open(path, encoding='utf-8'))
          if (comment.get('user') or {}).get('login') != os.environ['REPOSITORY_OWNER'] or comment.get('author_association') != 'OWNER':
              raise SystemExit('restore authorization must be OWNER-authored')
          body = comment.get('body')
          if not isinstance(body, str):
              raise SystemExit('restore authorization body missing')
          lines = body.strip().splitlines()
          if len(lines) != 2 or lines[0] != 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_V1':
              raise SystemExit('restore authorization envelope invalid')
          raw = lines[1]
          value = json.loads(raw)
          if json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) != raw:
              raise SystemExit('restore authorization must be canonical JSON')
          if value.get('source_sha') != os.environ['GITHUB_SHA']:
              raise SystemExit('restore authorization source does not match protected main')
          if value.get('authorized_provider_effects') != ['D1_TIME_TRAVEL_RESTORE_ONLY']:
              raise SystemExit('restore authorization effect mismatch')
          target = value.get('target') or {}
          if target.get('environment') != 'staging' or target.get('component') != 'catalog':
              raise SystemExit('restore target must be staging catalog')
          with open(env_path, 'a', encoding='utf-8') as handle:
              handle.write(f"RESTORE_COMPONENT={target.get('component','')}\n")
              handle.write(f"RESTORE_ACCOUNT_ID={target.get('account_id','')}\n")
              handle.write(f"RESTORE_DATABASE_NAME={target.get('database_name','')}\n")
              handle.write(f"RESTORE_DATABASE_ID={target.get('database_id','')}\n")
          PY_RESTORE_ROUTE

      - name: Dispatch one-shot Time Travel restore through sole D1 mutation owner
        if: env.D1_ROUTE_KIND == 'time_travel_restore'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          confirmation="$GITHUB_SHA:staging:time_travel_restore:$D1_RESTORE_AUTHORIZATION_COMMENT_ID"
          payload="$RUNNER_TEMP/d1-time-travel-restore-dispatch.json"
          jq -nc --arg ref main --arg source "$GITHUB_SHA" --arg component "$RESTORE_COMPONENT" \
            --arg account "$RESTORE_ACCOUNT_ID" --arg name "$RESTORE_DATABASE_NAME" --arg id "$RESTORE_DATABASE_ID" \
            --arg comment "$D1_RESTORE_AUTHORIZATION_COMMENT_ID" --arg confirmation "$confirmation" \
            '{ref:$ref,inputs:{operation_mode:"time_travel_restore",restore_authorization_comment_id:$comment,environment:"staging",source_sha:$source,component:$component,account_id:$account,database_name:$name,database_id:$id,target_release_manifest_json:"{}",current_release_manifest_json:"{}",known_good_release_manifest_json:"{}",preconditions_json:"{}",transition_mode:"ordinary",expected_release_set_id:"",prepared_transaction_run_id:"",prepared_transaction_run_attempt:"",transaction_id:"",authorization_digest:"",transaction_authorization_json:"",mutation_authorized:true,confirmation:$confirmation}}' \
            > "$payload"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/dispatches" --input "$payload"

      - name: Record transport result
        run: |
          set -euo pipefail
          if [ "$D1_ROUTE_KIND" = operator ]; then
            downstream='d1-operator.yml / main / zero inputs / owner actor'
          elif [ "$D1_ROUTE_KIND" = time_travel_info ]; then
            downstream="d1-isolated-target-observation.yml / main / read-only timestamp=$D1_TIME_TRAVEL_UNIX_SECONDS"
          else
            downstream="d1-migration-executor.yml / main / one-shot time_travel_restore authorization_comment=$D1_RESTORE_AUTHORIZATION_COMMENT_ID"
          fi
          {
            echo '## D1 owner comment transport'
            echo
            echo "- command issue: #$COMMENT_ISSUE_NUMBER"
            echo "- protected main: $GITHUB_SHA"
            echo "- command: \`$COMMENT_BODY\`"
            echo "- downstream: \`$downstream\`"
            echo '- provider credentials in router: NO'
            echo '- provider mutation authority in router: NO'
            echo '- privileged operator/restore dispatch actor: governed GitHub admin operator credential only'
            echo '- read-only observer and authorization reads: ephemeral GitHub Actions token only'
          } >> "$GITHUB_STEP_SUMMARY"
