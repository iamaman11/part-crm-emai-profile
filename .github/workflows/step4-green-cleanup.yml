name: Step 4 Green Cleanup

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-green-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Require bounded diagnostics to be green
        run: |
          python scripts/test-step4-command-guards.py
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown
          cargo test --locked -p cloudflare-adapters --lib
          cargo fmt --all -- --check

      - name: Remove temporary diagnostics
        run: |
          rm -f step4-diagnostics.txt
          rm -f .github/workflows/step4-format-fix.yml
          rm -f .github/workflows/step4-semantic-autofix.yml
          rm -f .github/workflows/step4-green-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: remove temporary diagnostic workflows"
          git push origin HEAD:repository-step-4-identity-clients-acl
