name: D1 Evolution Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: d1-evolution-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Native opsctl and pinned Wrangler D1 proof
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Set up pinned Node and npm
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce pinned Wrangler version
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"
          test "$(npx --yes wrangler@4.94.0 --version)" = "4.94.0"

      - name: Verify protected executor and release identity contracts
        run: |
          node scripts/check-d1-migration-executor.mjs
          node scripts/check-d1-migration-executor.mjs --self-test
          node scripts/check-d1-release-schema-identity.mjs
          node scripts/check-d1-release-schema-identity.mjs --self-test

      - name: Execute all opsctl D1 commands as real CLI processes
        run: |
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status \
            --component resolver \
            --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 plan \
            --component resolver \
            --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json \
            --release-manifest tests/d1-evolution/resolver-release-compatible.json \
            --current-manifest tests/d1-evolution/resolver-release-compatible.json \
            --known-good-manifest tests/d1-evolution/resolver-release-compatible.json \
            | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 compatibility \
            --component resolver \
            --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json \
            --release-manifest tests/d1-evolution/resolver-release-compatible.json | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 verify \
            --component resolver \
            --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json \
            --release-manifest tests/d1-evolution/resolver-release-compatible.json | python -m json.tool >/dev/null

      - name: Execute reusable D1 fault and recovery harness
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m py_compile scripts/d1-fault-recovery-harness.py
          python scripts/d1-fault-recovery-harness.py \
            --root . \
            --wrangler-version 4.94.0 \
            --report artifacts/d1-evolution/fault-recovery-report.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('artifacts/d1-evolution/fault-recovery-report.json').read_text(encoding='utf-8'))
          required = {
              'ledger_noncanonical',
              'supported_ahead_recovery_window',
              'expand_old_new_runtime_rollout',
              'contract_rejection_admission',
              'contract_exact_successor',
              'transaction_observation_plan_target_drift',
              'authorization_freshness_and_scope_drift',
              'executor_checkout_identity_drift',
              'stale_or_unknown_target_fence',
              'runner_interruption_requires_recovery',
              'canonical_prefix_matrix_catalog',
              'canonical_prefix_matrix_resolver',
              'clean_bootstrap_and_replay_catalog',
              'clean_bootstrap_and_replay_resolver',
              'future_migration_append_catalog',
              'future_migration_append_resolver',
              'partial_prefix_failure',
              'repair_and_safe_continuation',
          }
          observed = {item['scenario_id'] for item in report['scenarios']}
          assert report['schema_version'] == 1, report
          assert report['status'] == 'PASS', report
          assert report['mode'] == 'LOCAL_TEST_ONLY', report
          assert report['provider_mutation'] is False, report
          assert report['production_mutation'] is False, report
          assert report['remote_provider_credentials_present'] is False, report
          assert report['scenario_count'] == len(report['scenarios']), report
          assert required <= observed, sorted(required - observed)
          assert all(item['status'] == 'PASS' for item in report['scenarios']), report
          PY

      - name: Upload D1 fault and recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-fault-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-evolution/fault-recovery-report.json
          if-no-files-found: error
          retention-days: 30

  windows-cli:
    name: Native opsctl D1 CLI portability on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Execute all native opsctl D1 commands on Windows
        shell: pwsh
        run: |
          $repository = cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository | ConvertFrom-Json
          if ($repository.kind -ne 'D1_REPOSITORY_PROJECTION') { throw 'd1 repository portability proof failed' }
          $status = cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 status --component resolver --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json | ConvertFrom-Json
          if ($status.ledger_state -ne 'EXACT' -or $status.mutation_executed) { throw 'd1 status portability proof failed' }
          $plan = cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 plan --component resolver --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json --release-manifest tests/d1-evolution/resolver-release-compatible.json --current-manifest tests/d1-evolution/resolver-release-compatible.json --known-good-manifest tests/d1-evolution/resolver-release-compatible.json | ConvertFrom-Json
          if ($plan.decision -ne 'SAFE' -or -not $plan.allowed) { throw 'd1 plan portability proof failed' }
          $compatibility = cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 compatibility --component resolver --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json --release-manifest tests/d1-evolution/resolver-release-compatible.json | ConvertFrom-Json
          if ($compatibility.ledger_state -ne 'EXACT') { throw 'd1 compatibility portability proof failed' }
          $verify = cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 verify --component resolver --ledger-json tests/d1-evolution/valid-exact-resolver-ledger.json --release-manifest tests/d1-evolution/resolver-release-compatible.json | ConvertFrom-Json
          if ($verify.decision -ne 'SAFE' -or -not $verify.allowed) { throw 'd1 verify portability proof failed' }
