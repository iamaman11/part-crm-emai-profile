name: Local Profile Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: local-profile-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-profile-linux:
    name: Local Profile Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      # Cache is a compilation accelerator only, never an attestation.
      # rust-cache's key includes the actual rustc, Cargo manifests/lockfiles
      # and compile flags; Cargo still builds changed source on every SHA.
      - name: Restore versioned Rust dependencies (not acceptance evidence)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (immutable)
        with:
          shared-key: profile-bridge-ci-v1
          cache-on-failure: 'true'

      - name: Compile Step 8 policy
        run: python -m py_compile scripts/check-step8-local-profile.py

      - name: Enforce Step 8 local lifecycle boundary
        run: python scripts/check-step8-local-profile.py

      - name: Prove browser-lock deletion fixture is rejected
        run: |
          if python scripts/check-step8-local-profile.py --root tests/local-profile/fixtures/deletes-browser-lock; then
            echo "Browser-owned lock deletion fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy Profile Bridge
        run: cargo clippy --locked -p profile-bridge --all-targets --features synthetic-test-bin -- -D warnings

      - name: Test local profile lifecycle
        run: cargo test --locked -p profile-bridge --features synthetic-test-bin local_profile

  local-profile-windows:
    name: Local Profile Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      # Keep OS/toolchain/manifests/flags in the action's hashed key.
      # The independent opsctl Cargo workspace is used by this job as well.
      # Restored artifacts never substitute any check or exact-head test.
      - name: Restore versioned Rust dependencies and opsctl
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (immutable)
        with:
          shared-key: profile-bridge-ci-v1
          workspaces: |
            . -> target
            tools/opsctl -> target
          cache-on-failure: 'true'

      - name: Test local profile lifecycle
        run: cargo test --locked -p profile-bridge --features synthetic-test-bin local_profile

      - name: Prove K2 256/512 MiB file streaming on Windows with peak RAM and disk limits
        run: python scripts/test-k2-large-native-streaming.py

      - name: Prove Windows release CMS verifier
        run: cargo test --locked -p profile-bridge --test windows_delivery_signature_acceptance -- --exact production_verifier_accepts_only_exact_pinned_application_signature

      - name: Prove application delivery signing without OS certificate-store changes
        run: ./tests/windows-delivery-signing.ps1

      - name: Build AR-6 opsctl on Windows
        run: cargo build --locked --manifest-path tools/opsctl/Cargo.toml

      - name: Exercise AR-6 opsctl read-only commands on Windows
        shell: pwsh
        run: |
          $bin = 'tools/opsctl/target/debug/opsctl.exe'
          if (-not (Test-Path $bin)) {
            throw "opsctl.exe was not produced"
          }
          $doctor = ((& $bin --root . doctor) -join "`n") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $doctor.status -ne 'ok' -or $doctor.mode -ne 'read-only' -or $doctor.mutation_executed -ne $false) {
            throw "opsctl doctor lost the read-only contract"
          }
          '{"schema_version":1,"source_branch":"main","acceptance_observations":[]}' |
            Set-Content -Encoding utf8 acceptance-evidence.json
          $status = ((& $bin --root . status --acceptance-evidence-json acceptance-evidence.json) -join "`n") | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $status.accepted_checkpoint -ne 'AR-11' -or $status.current_slice -ne 'AR-12') {
            throw "opsctl status lost the typed lifecycle contract"
          }
