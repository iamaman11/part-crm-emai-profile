name: AR-10 Python Estate Sync

on:
  push:
    branches:
      - agent/ar10-runtime-cutover

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar10-runtime-cutover
          fetch-depth: 0

      - name: Register Firefox writer-lock test in bounded AR-10 overlay
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          generator = Path('scripts/python-estate-ar6.py')
          text = generator.read_text(encoding='utf-8')
          anchor = '''    "scripts/test-ar10-real-camoufox.py": {\n        "classification": "KEEP_PYTHON",\n        "role": "test",\n        "side_effect_class": "test_only",\n        "authority": "PYTHON_ALLOWED_BY_AR10",\n        "rationale": "repository-local real Camoufox integration evidence fixture",\n    },\n'''
          addition = '''    "scripts/test-ar10-firefox-writer-locks.py": {\n        "classification": "KEEP_PYTHON",\n        "role": "test",\n        "side_effect_class": "test_only",\n        "authority": "PYTHON_ALLOWED_BY_AR10",\n        "rationale": "OS-level Firefox writer-lock ownership and fail-closed regression matrix",\n    },\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('expected AR-10 addition anchor not found')
              text = text.replace(anchor, anchor + addition, 1)
              generator.write_text(text, encoding='utf-8', newline='\n')

          overlay_path = Path('architecture/python-estate-ar10.json')
          overlay = json.loads(overlay_path.read_text(encoding='utf-8'))
          path = 'scripts/test-ar10-firefox-writer-locks.py'
          additions = overlay['additions']
          if not any(row.get('path') == path for row in additions):
              additions.append({
                  'path': path,
                  'classification': 'KEEP_PYTHON',
                  'reason': 'OS-level Firefox writer-lock ownership and fail-closed regression matrix',
              })
          for key in ('current_summary', 'final_ar10_target'):
              overlay[key]['tracked_python_files'] = 117
              overlay[key]['KEEP_PYTHON'] = 115
          overlay_path.write_text(json.dumps(overlay, indent=2, ensure_ascii=False, sort_keys=False) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Validate Python estate
        run: |
          python scripts/python-estate-ar6.py --check
          python scripts/python-estate-ar6.py --self-test
          python scripts/check-ar10-runtime-cutover.py
          git diff --check

      - name: Commit bounded overlay update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/python-estate-ar6.py architecture/python-estate-ar10.json
          git commit -m 'Register AR-10 writer-lock Python evidence'
          git push origin HEAD:agent/ar10-runtime-cutover
