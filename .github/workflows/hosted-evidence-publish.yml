name: Hosted Evidence Publish

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Immutable Actions Artifact containing exactly hosted-evidence.json
        required: true
        type: string
      evidence_kind:
        description: HostedEvidenceEnvelope evidence_kind expected from the observation job
        required: true
        type: string
      payload_version:
        description: Typed payload version expected from the observation job
        required: true
        type: number
      environment:
        description: rehearsal, staging, or production
        required: true
        type: string
      source_sha:
        description: Source SHA represented by the hosted observation
        required: true
        type: string
      source_ref:
        description: Source ref represented by the hosted observation
        required: true
        type: string
      observation_workflow_name:
        description: Caller workflow name recorded in the evidence envelope
        required: true
        type: string
      observation_workflow_ref:
        description: Caller workflow_ref recorded in the evidence envelope
        required: true
        type: string
      observation_job:
        description: Provider-facing observation job recorded in the evidence envelope
        required: true
        type: string
      observed_at:
        description: Canonical UTC observation timestamp YYYY-MM-DDTHH:MM:SSZ
        required: true
        type: string
      provider_mutation:
        description: Whether the evidenced provider operation mutated provider state
        required: true
        type: boolean
      production_mutation:
        description: Whether the evidenced operation mutated production state
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Verify and attest hosted evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact policy source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download immutable hosted evidence artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/hosted-evidence

      - name: Require one canonical evidence subject
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/hosted-evidence/hosted-evidence.json"
          test -f "$evidence"
          test "$(find "$RUNNER_TEMP/hosted-evidence" -type f -print | wc -l)" -eq 1

      - name: Reconstruct independent expected workflow/run/source binding
        shell: bash
        env:
          EVIDENCE_KIND: ${{ inputs.evidence_kind }}
          PAYLOAD_VERSION: ${{ inputs.payload_version }}
          EVIDENCE_ENVIRONMENT: ${{ inputs.environment }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_REF: ${{ inputs.source_ref }}
          OBSERVATION_WORKFLOW_NAME: ${{ inputs.observation_workflow_name }}
          OBSERVATION_WORKFLOW_REF: ${{ inputs.observation_workflow_ref }}
          OBSERVATION_JOB: ${{ inputs.observation_job }}
          OBSERVED_AT: ${{ inputs.observed_at }}
          PROVIDER_MUTATION: ${{ inputs.provider_mutation }}
          PRODUCTION_MUTATION: ${{ inputs.production_mutation }}
        run: |
          set -euo pipefail
          jq -n \
            --arg evidence_kind "$EVIDENCE_KIND" \
            --argjson payload_version "$PAYLOAD_VERSION" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            --arg workflow_name "$OBSERVATION_WORKFLOW_NAME" \
            --arg workflow_ref "$OBSERVATION_WORKFLOW_REF" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg observation_job "$OBSERVATION_JOB" \
            --arg environment "$EVIDENCE_ENVIRONMENT" \
            --arg observed_at "$OBSERVED_AT" \
            --argjson provider_mutation "$PROVIDER_MUTATION" \
            --argjson production_mutation "$PRODUCTION_MUTATION" \
            '{
              schema_version: 1,
              evidence_kind: $evidence_kind,
              payload_version: $payload_version,
              repository: $repository,
              source_sha: $source_sha,
              source_ref: $source_ref,
              workflow: {
                name: $workflow_name,
                workflow_ref: $workflow_ref,
                run_id: $run_id,
                run_attempt: $run_attempt,
                observation_job: $observation_job
              },
              environment: $environment,
              observed_at: $observed_at,
              provider_mutation: $provider_mutation,
              production_mutation: $production_mutation
            }' > "$RUNNER_TEMP/hosted-evidence-expected-context.json"

      - name: Re-verify canonical typed evidence with opsctl
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . evidence verify \
            --evidence-json "$RUNNER_TEMP/hosted-evidence/hosted-evidence.json" \
            --context-json "$RUNNER_TEMP/hosted-evidence-expected-context.json" \
            > "$RUNNER_TEMP/hosted-evidence-verify.json"
          jq -e '
            .decision == "VERIFIED" and
            .schema_version == 1 and
            .repository == env.GITHUB_REPOSITORY and
            .workflow_run_id == (env.GITHUB_RUN_ID | tonumber) and
            .workflow_run_attempt == (env.GITHUB_RUN_ATTEMPT | tonumber) and
            .sha256 != null and
            (.sha256 | test("^[0-9a-f]{64}$"))
          ' "$RUNNER_TEMP/hosted-evidence-verify.json" >/dev/null

      - name: Build custom attestation predicate from verified policy output
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            predicate_schema_version: 1,
            evidence_sha256: .sha256,
            envelope_schema_version: .schema_version,
            evidence_kind,
            payload_version,
            repository,
            source_sha,
            source_ref,
            workflow_run_id,
            workflow_run_attempt,
            environment,
            provider_mutation,
            production_mutation
          }' "$RUNNER_TEMP/hosted-evidence-verify.json" \
            > "$RUNNER_TEMP/hosted-evidence-predicate.json"

      - name: Create GitHub Artifact Attestation for verified evidence bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/hosted-evidence/hosted-evidence.json
          predicate-type: https://github.com/iamaman11/part-crm-emai-profile/attestations/hosted-operational-evidence/v1
          predicate-path: ${{ runner.temp }}/hosted-evidence-predicate.json
