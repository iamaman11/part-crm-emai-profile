name: Step 4 Semantic Autofix

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-semantic-autofix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Normalize aggregate version parsing
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("apps/control-plane-worker/src/api.rs")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"let (\w+) = match AggregateVersion::new\(([^\n]+)\) \{\n"
              r"\s+Ok\(value\) => value,\n"
              r"\s+Err\(_\) => return invalid_request\(request\),\n"
              r"\s+\};"
          )
          text = pattern.sub(
              r"let Some(\1) = parse_version(\2) else {\n"
              r"        return invalid_request(request);\n"
              r"    };",
              text,
          )
          marker = "\n#[cfg(test)]\nmod tests {"
          helper = r'''

trait IntoVersionOption {
    fn into_version_option(self) -> Option<AggregateVersion>;
}

impl IntoVersionOption for AggregateVersion {
    fn into_version_option(self) -> Option<AggregateVersion> {
        Some(self)
    }
}

impl<E> IntoVersionOption for core::result::Result<AggregateVersion, E> {
    fn into_version_option(self) -> Option<AggregateVersion> {
        self.ok()
    }
}

fn parse_version(value: u64) -> Option<AggregateVersion> {
    AggregateVersion::new(value).into_version_option()
}
'''
          if "trait IntoVersionOption" not in text:
              text = text.replace(marker, helper + marker)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply compiler suggestions
        run: |
          cargo fix --locked -p cloudflare-adapters --lib --allow-dirty --allow-staged || true
          cargo fix --locked -p browser-profile-control-plane-worker \
            --target wasm32-unknown-unknown --allow-dirty --allow-staged || true
          cargo fmt --all
          cargo metadata --format-version 1 >/dev/null

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' 'Cargo.lock'
          git commit -m "Repository Step 4: apply semantic compiler fixes"
          git push origin HEAD:repository-step-4-identity-clients-acl
