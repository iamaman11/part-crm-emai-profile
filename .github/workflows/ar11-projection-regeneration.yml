name: AR-11 Projection Regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: codex/ar11-functional-closure-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Regenerate and commit canonical projection only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py --check
          if git diff --quiet -- architecture/inventory.json; then
            echo "Projection already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/inventory.json
          git commit -m "AR-11: regenerate canonical architecture inventory"
          git push origin HEAD:codex/ar11-functional-closure-v2
