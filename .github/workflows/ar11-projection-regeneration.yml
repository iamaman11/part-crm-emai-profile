name: AR-11 Projection Regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate canonical architecture inventory and print exact diff
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-architecture-inventory.py --write
          git diff -- architecture/inventory.json
