name: Phase 2C OpenAPI Atomic Finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Make Client Registry OpenAPI generation typed and atomic
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path('crates/control-plane-contract/src/client_registry_api.rs')
          text = api_path.read_text(encoding='utf-8')
          assert 'ClientRegistryOpenApiError' not in text
          assert 'pub fn extend_openapi(document: &mut Value) {' in text

          text = text.replace(
              'use crate::public_api::ClientProjection;\n',
              'use crate::public_api::ClientProjection;\nuse core::fmt;\n',
              1,
          )
          constants = 'pub const CLIENT_ASSIGNMENT_STATUSES: [&str; 2] = ["ACTIVE", "CLOSED"];\n\n'
          error_model = '''pub const CLIENT_ASSIGNMENT_STATUSES: [&str; 2] = ["ACTIVE", "CLOSED"];\n\nconst CLIENT_REGISTRY_SCHEMA_NAMES: [&str; 13] = [\n    "ClientContactKind",\n    "ClientContactStatus",\n    "ClientAssignmentStatus",\n    "ClientListProjection",\n    "ClientUpdateRequest",\n    "ClientArchiveRequest",\n    "ClientContactUpsertRequest",\n    "ClientContactArchiveRequest",\n    "ClientMergeRequest",\n    "ClientContactProjection",\n    "ClientAssignmentProjection",\n    "ClientActivityProjection",\n    "ClientHistoryProjection",\n];\n\n#[derive(Clone, Copy, Debug, Eq, PartialEq)]\npub enum ClientRegistryOpenApiError {\n    MissingPathsObject,\n    MissingSchemasObject,\n    InvalidPathItem,\n    DuplicateOperation,\n    DuplicateSchema,\n}\n\nimpl fmt::Display for ClientRegistryOpenApiError {\n    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {\n        formatter.write_str(match self {\n            Self::MissingPathsObject => "client registry OpenAPI paths object is missing",\n            Self::MissingSchemasObject => "client registry OpenAPI schemas object is missing",\n            Self::InvalidPathItem => "client registry OpenAPI path item is invalid",\n            Self::DuplicateOperation => "client registry OpenAPI operation already exists",\n            Self::DuplicateSchema => "client registry OpenAPI schema already exists",\n        })\n    }\n}\n\nimpl std::error::Error for ClientRegistryOpenApiError {}\n\n'''
          assert text.count(constants) == 1
          text = text.replace(constants, error_model, 1)

          weak_header = '''pub fn extend_openapi(document: &mut Value) {\n    let Some(paths) = document.get_mut("paths").and_then(Value::as_object_mut) else {\n        return;\n    };\n'''
          strong_header = '''pub fn extend_openapi(document: &mut Value) -> Result<(), ClientRegistryOpenApiError> {\n    let mut candidate = document.clone();\n    extend_openapi_in_place(&mut candidate)?;\n    *document = candidate;\n    Ok(())\n}\n\nfn extend_openapi_in_place(document: &mut Value) -> Result<(), ClientRegistryOpenApiError> {\n    let paths = document\n        .get_mut("paths")\n        .and_then(Value::as_object_mut)\n        .ok_or(ClientRegistryOpenApiError::MissingPathsObject)?;\n'''
          assert text.count(weak_header) == 1
          text = text.replace(weak_header, strong_header, 1)

          schemas_marker = '    let Some(schemas) = document\n'
          function_start = text.index('fn extend_openapi_in_place')
          schemas_start = text.index(schemas_marker, function_start)
          operations = text[function_start:schemas_start]
          assert operations.count('\n    );\n') == 7, operations.count('\n    );\n')
          operations = operations.replace('\n    );\n', '\n    )?;\n')
          text = text[:function_start] + operations + text[schemas_start:]

          weak_schemas = '''    let Some(schemas) = document\n        .get_mut("components")\n        .and_then(|value| value.get_mut("schemas"))\n        .and_then(Value::as_object_mut)\n    else {\n        return;\n    };\n'''
          strong_schemas = '''    let schemas = document\n        .get_mut("components")\n        .and_then(|value| value.get_mut("schemas"))\n        .and_then(Value::as_object_mut)\n        .ok_or(ClientRegistryOpenApiError::MissingSchemasObject)?;\n    if CLIENT_REGISTRY_SCHEMA_NAMES\n        .iter()\n        .any(|name| schemas.contains_key(*name))\n    {\n        return Err(ClientRegistryOpenApiError::DuplicateSchema);\n    }\n'''
          assert text.count(weak_schemas) == 1
          text = text.replace(weak_schemas, strong_schemas, 1)

          tail = '''    schemas.insert(\n        "ClientHistoryProjection".to_owned(),\n        object_schema(\n            &["contacts", "assignments", "activity"],\n            json!({\n                "contacts": {"type": "array", "maxItems": 500, "items": schema_ref("ClientContactProjection")},\n                "assignments": {"type": "array", "maxItems": 500, "items": schema_ref("ClientAssignmentProjection")},\n                "activity": {"type": "array", "maxItems": 100, "items": schema_ref("ClientActivityProjection")}\n            }),\n        ),\n    );\n}\n\nfn insert_operation(paths: &mut Map<String, Value>, path: &str, method: &str, operation: Value) {\n    let path_item = paths\n        .entry(path.to_owned())\n        .or_insert_with(|| Value::Object(Map::new()));\n    let Some(path_item) = path_item.as_object_mut() else {\n        return;\n    };\n    assert!(\n        path_item.insert(method.to_owned(), operation).is_none(),\n        "duplicate OpenAPI operation {method} {path}"\n    );\n}\n'''
          strong_tail = '''    schemas.insert(\n        "ClientHistoryProjection".to_owned(),\n        object_schema(\n            &["contacts", "assignments", "activity"],\n            json!({\n                "contacts": {"type": "array", "maxItems": 500, "items": schema_ref("ClientContactProjection")},\n                "assignments": {"type": "array", "maxItems": 500, "items": schema_ref("ClientAssignmentProjection")},\n                "activity": {"type": "array", "maxItems": 100, "items": schema_ref("ClientActivityProjection")}\n            }),\n        ),\n    );\n    Ok(())\n}\n\nfn insert_operation(\n    paths: &mut Map<String, Value>,\n    path: &str,\n    method: &str,\n    operation: Value,\n) -> Result<(), ClientRegistryOpenApiError> {\n    let path_item = paths\n        .entry(path.to_owned())\n        .or_insert_with(|| Value::Object(Map::new()));\n    let path_item = path_item\n        .as_object_mut()\n        .ok_or(ClientRegistryOpenApiError::InvalidPathItem)?;\n    if path_item.contains_key(method) {\n        return Err(ClientRegistryOpenApiError::DuplicateOperation);\n    }\n    path_item.insert(method.to_owned(), operation);\n    Ok(())\n}\n'''
          assert text.count(tail) == 1
          text = text.replace(tail, strong_tail, 1)

          old_test = '''    fn client_registry_openapi_extension_is_additive_and_complete() {\n        let mut document = openapi_document();\n        extend_openapi(&mut document);\n'''
          new_test = '''    fn client_registry_openapi_extension_is_additive_and_complete()\n    -> Result<(), Box<dyn std::error::Error>> {\n        let mut document = openapi_document();\n        extend_openapi(&mut document)?;\n'''
          assert text.count(old_test) == 1
          text = text.replace(old_test, new_test, 1)
          old_test_tail = '''        for name in [\n            "ClientListProjection",\n            "ClientUpdateRequest",\n            "ClientArchiveRequest",\n            "ClientContactUpsertRequest",\n            "ClientContactArchiveRequest",\n            "ClientMergeRequest",\n            "ClientContactProjection",\n            "ClientAssignmentProjection",\n            "ClientActivityProjection",\n            "ClientHistoryProjection",\n        ] {\n            assert!(schemas.get(name).is_some(), "missing schema {name}");\n        }\n    }\n\n    #[test]\n    fn request_models_reject_unknown_fields() {\n'''
          new_test_tail = '''        for name in [\n            "ClientListProjection",\n            "ClientUpdateRequest",\n            "ClientArchiveRequest",\n            "ClientContactUpsertRequest",\n            "ClientContactArchiveRequest",\n            "ClientMergeRequest",\n            "ClientContactProjection",\n            "ClientAssignmentProjection",\n            "ClientActivityProjection",\n            "ClientHistoryProjection",\n        ] {\n            assert!(schemas.get(name).is_some(), "missing schema {name}");\n        }\n        Ok(())\n    }\n\n    #[test]\n    fn malformed_and_duplicate_openapi_extensions_fail_atomically() {\n        let mut missing_paths = json!({"components": {"schemas": {}}});\n        let original = missing_paths.clone();\n        assert_eq!(\n            extend_openapi(&mut missing_paths),\n            Err(super::ClientRegistryOpenApiError::MissingPathsObject)\n        );\n        assert_eq!(missing_paths, original);\n\n        let mut duplicate = openapi_document();\n        duplicate["paths"]["/api/v1/tenants/{tenantId}/clients"]["get"] = json!({});\n        let original = duplicate.clone();\n        assert_eq!(\n            extend_openapi(&mut duplicate),\n            Err(super::ClientRegistryOpenApiError::DuplicateOperation)\n        );\n        assert_eq!(duplicate, original);\n    }\n\n    #[test]\n    fn request_models_reject_unknown_fields() {\n'''
          assert text.count(old_test_tail) == 1
          text = text.replace(old_test_tail, new_test_tail, 1)
          imports = '    use crate::public_api::{ClientProjection, openapi_document};\n'
          assert text.count(imports) == 1
          text = text.replace(imports, imports + '    use serde_json::json;\n', 1)
          api_path.write_text(text, encoding='utf-8')

          fragment_path = Path('crates/control-plane-contract/src/client_registry_fragment.rs')
          text = fragment_path.read_text(encoding='utf-8')
          assert 'fn empty_fragment() -> Value' in text
          text = text.replace(
              'use crate::{client_registry_api, public_api};\n',
              'use crate::{client_registry_api, public_api};\nuse client_registry_api::ClientRegistryOpenApiError;\n',
              1,
          )
          weak_top = '''pub fn canonical_fragment() -> Value {\n    let base = public_api::openapi_document();\n    let mut extended = base.clone();\n    client_registry_api::extend_openapi(&mut extended);\n    diff_fragment(&base, &extended)\n}\n\npub fn compatibility_fragment() -> Value {\n    let mut fragment = canonical_fragment();\n    remap_legacy_refs(&mut fragment);\n    inject_client_registry_problem(&mut fragment);\n    decorate_legacy_transport_contract(&mut fragment);\n    fragment\n}\n\nfn diff_fragment(base: &Value, extended: &Value) -> Value {\n    let Some(base_paths) = base.get("paths").and_then(Value::as_object) else {\n        return empty_fragment();\n    };\n    let Some(extended_paths) = extended.get("paths").and_then(Value::as_object) else {\n        return empty_fragment();\n    };\n'''
          strong_top = '''pub fn canonical_fragment() -> Result<Value, ClientRegistryOpenApiError> {\n    let base = public_api::openapi_document();\n    let mut extended = base.clone();\n    client_registry_api::extend_openapi(&mut extended)?;\n    diff_fragment(&base, &extended)\n}\n\npub fn compatibility_fragment() -> Result<Value, ClientRegistryOpenApiError> {\n    let mut fragment = canonical_fragment()?;\n    remap_legacy_refs(&mut fragment);\n    inject_client_registry_problem(&mut fragment)?;\n    decorate_legacy_transport_contract(&mut fragment);\n    Ok(fragment)\n}\n\nfn diff_fragment(base: &Value, extended: &Value) -> Result<Value, ClientRegistryOpenApiError> {\n    let base_paths = base\n        .get("paths")\n        .and_then(Value::as_object)\n        .ok_or(ClientRegistryOpenApiError::MissingPathsObject)?;\n    let extended_paths = extended\n        .get("paths")\n        .and_then(Value::as_object)\n        .ok_or(ClientRegistryOpenApiError::MissingPathsObject)?;\n'''
          assert text.count(weak_top) == 1
          text = text.replace(weak_top, strong_top, 1)
          weak_item = '''        let Some(extended_item) = extended_item.as_object() else {\n            continue;\n        };\n        let base_item = base_paths.get(route).and_then(Value::as_object);\n'''
          strong_item = '''        let extended_item = extended_item\n            .as_object()\n            .ok_or(ClientRegistryOpenApiError::InvalidPathItem)?;\n        let base_item = match base_paths.get(route) {\n            Some(item) => Some(\n                item.as_object()\n                    .ok_or(ClientRegistryOpenApiError::InvalidPathItem)?,\n            ),\n            None => None,\n        };\n'''
          assert text.count(weak_item) == 1
          text = text.replace(weak_item, strong_item, 1)
          weak_schema = '''    let Some(base_schemas) = base\n        .pointer("/components/schemas")\n        .and_then(Value::as_object)\n    else {\n        return empty_fragment();\n    };\n    let Some(extended_schemas) = extended\n        .pointer("/components/schemas")\n        .and_then(Value::as_object)\n    else {\n        return empty_fragment();\n    };\n'''
          strong_schema = '''    let base_schemas = base\n        .pointer("/components/schemas")\n        .and_then(Value::as_object)\n        .ok_or(ClientRegistryOpenApiError::MissingSchemasObject)?;\n    let extended_schemas = extended\n        .pointer("/components/schemas")\n        .and_then(Value::as_object)\n        .ok_or(ClientRegistryOpenApiError::MissingSchemasObject)?;\n'''
          assert text.count(weak_schema) == 1
          text = text.replace(weak_schema, strong_schema, 1)
          weak_result = '''    json!({\n        "paths": Value::Object(paths),\n        "components": {\n            "schemas": Value::Object(schemas)\n        }\n    })\n}\n\nfn empty_fragment() -> Value {\n    json!({"paths": {}, "components": {"schemas": {}}})\n}\n'''
          strong_result = '''    Ok(json!({\n        "paths": Value::Object(paths),\n        "components": {\n            "schemas": Value::Object(schemas)\n        }\n    }))\n}\n'''
          assert text.count(weak_result) == 1
          text = text.replace(weak_result, strong_result, 1)
          weak_inject = '''fn inject_client_registry_problem(fragment: &mut Value) {\n    let Some(schemas) = fragment\n        .pointer_mut("/components/schemas")\n        .and_then(Value::as_object_mut)\n    else {\n        return;\n    };\n    assert!(\n        schemas\n            .insert(\n'''
          strong_inject = '''fn inject_client_registry_problem(\n    fragment: &mut Value,\n) -> Result<(), ClientRegistryOpenApiError> {\n    let schemas = fragment\n        .pointer_mut("/components/schemas")\n        .and_then(Value::as_object_mut)\n        .ok_or(ClientRegistryOpenApiError::MissingSchemasObject)?;\n    if schemas.contains_key("ClientRegistryProblem") {\n        return Err(ClientRegistryOpenApiError::DuplicateSchema);\n    }\n    schemas.insert(\n'''
          assert text.count(weak_inject) == 1
          text = text.replace(weak_inject, strong_inject, 1)
          inject_tail = '''            )\n            .is_none(),\n        "ClientRegistryProblem schema must remain additive"\n    );\n}\n'''
          assert text.count(inject_tail) == 1
          text = text.replace(inject_tail, '            );\n    Ok(())\n}\n', 1)
          text = text.replace('    #![allow(clippy::expect_used)]\n', '', 1)
          old_test = '''    fn fragment_contains_only_additive_client_registry_surface() {\n        let fragment = canonical_fragment();\n        let paths = fragment["paths"].as_object().expect("fragment paths");\n'''
          new_test = '''    fn fragment_contains_only_additive_client_registry_surface()\n    -> Result<(), Box<dyn std::error::Error>> {\n        let fragment = canonical_fragment()?;\n        let paths = fragment["paths"]\n            .as_object()\n            .ok_or("fragment paths must be an object")?;\n'''
          assert text.count(old_test) == 1
          text = text.replace(old_test, new_test, 1)
          marker = '''        assert!(\n            paths["/api/v1/tenants/{tenantId}/clients/{clientId}/merge"]\n                .get("post")\n                .is_some()\n        );\n    }\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, marker[:-6] + '        Ok(())\n    }\n', 1)
          old_compat = '''    fn compatibility_fragment_uses_legacy_client_view_and_full_problem_schema() {\n        let fragment = compatibility_fragment();\n        let rendered = serde_json::to_string(&fragment).expect("serialize fragment");\n'''
          new_compat = '''    fn compatibility_fragment_uses_legacy_client_view_and_full_problem_schema()\n    -> Result<(), Box<dyn std::error::Error>> {\n        let fragment = compatibility_fragment()?;\n        let rendered = serde_json::to_string(&fragment)?;\n'''
          assert text.count(old_compat) == 1
          text = text.replace(old_compat, new_compat, 1)
          text = text.replace(
              '            .as_array()\n            .expect("problem code enum");\n',
              '            .as_array()\n            .ok_or("problem code enum must be an array")?;\n',
              1,
          )
          compat_tail = '''        assert!(rendered.contains("#/components/parameters/CorrelationHeader"));\n        assert!(rendered.contains("#/components/parameters/IdempotencyHeader"));\n    }\n}\n'''
          assert text.count(compat_tail) == 1
          text = text.replace(
              compat_tail,
              '''        assert!(rendered.contains("#/components/parameters/CorrelationHeader"));\n        assert!(rendered.contains("#/components/parameters/IdempotencyHeader"));\n        Ok(())\n    }\n}\n''',
              1,
          )
          fragment_path.write_text(text, encoding='utf-8')

          exporter = Path('crates/control-plane-contract/src/bin/export_client_registry.rs')
          text = exporter.read_text(encoding='utf-8')
          old = '''        "canonical" => client_registry_fragment::canonical_fragment(),\n        "compatibility" => client_registry_fragment::compatibility_fragment(),\n'''
          new = '''        "canonical" => client_registry_fragment::canonical_fragment()?,\n        "compatibility" => client_registry_fragment::compatibility_fragment()?,\n'''
          assert text.count(old) == 1
          exporter.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate strict Rust and generated contracts
        run: |
          cargo fmt --all
          cargo test --locked -p control-plane-contract --all-targets
          cargo clippy --locked -p control-plane-contract --all-targets -- -D warnings
          cargo clippy --locked --workspace --all-targets --exclude browser-profile-control-plane-worker --exclude cloudflare-adapters -- -D warnings
          python scripts/generate-frontend-contracts.py
          python scripts/generate-frontend-contracts.py --check
          python scripts/check-contract-compatibility.py
          python scripts/test-openapi-fragments.py

      - name: Commit only validated product contract changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/control-plane-contract frontend/src/shared/api/generated openapi/v1/fragments
          git diff --cached --check
          git commit -m "Phase 2C: make Client Registry OpenAPI atomic and fallible"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
