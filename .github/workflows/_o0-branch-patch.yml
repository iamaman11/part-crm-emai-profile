name: O0 one-shot branch patch

on:
  push:
    branches:
      - o0-ar11-manual-terminal-outcome
    paths:
      - 'scripts/_o0_apply_manual_ar11_patch.py'
      - '.github/workflows/_o0-branch-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact patch commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded patch and delete temporary patch surfaces
        run: |
          set -euo pipefail
          python scripts/_o0_apply_manual_ar11_patch.py
          sed -i '/assert!(workflow.contains("RECOVERY_REQUIRED"));/d' tools/opsctl/tests/o0_ar11_operational_outcome.rs
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/release-operational-ar11.mjs')
          text = path.read_text(encoding='utf-8')
          def once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, observed {count}')
              text = text.replace(old, new, 1)
          once(
              "  const post = jobBlock(promotion, 'post-verify');\n  const rollback = jobBlock(promotion, 'rollback-negative-evidence');\n  for (const [name, block] of Object.entries({ route, 'resolve-preflight': resolvePreflight, 'preflight-ready': ready, 'resolve-verify': resolveAuthorized, mutate, 'post-verify': post, 'rollback-negative-evidence': rollback })) {",
              "  const post = jobBlock(promotion, 'post-verify');\n  const manualOutcome = jobBlock(promotion, 'manual-outcome');\n  const rollback = jobBlock(promotion, 'rollback-negative-evidence');\n  for (const [name, block] of Object.entries({ route, 'resolve-preflight': resolvePreflight, 'preflight-ready': ready, 'resolve-verify': resolveAuthorized, mutate, 'post-verify': post, 'manual-outcome': manualOutcome, 'rollback-negative-evidence': rollback })) {",
              'manual structural job',
          )
          once(
              "  errors.push(...requireMarkers(post, [\n    'secrets.CLOUDFLARE_OBSERVE_API_TOKEN',\n    'Re-observe provider and verify exact convergence',\n    'promotion verify',\n    '.verified == true',\n  ], 'post-deploy verifier'));\n  errors.push(...forbidMarkers(post, ['secrets.CLOUDFLARE_API_TOKEN }}', 'wrangler deploy --'], 'post-deploy verifier'));\n  errors.push(...secretObservationErrors(post, 'post-deploy verifier'));\n",
              "  errors.push(...requireMarkers(post, [\n    'secrets.CLOUDFLARE_OBSERVE_API_TOKEN',\n    'Re-observe provider and capture promotion.verify natural-owner verdict',\n    'promotion verify',\n    '> \"$RUNNER_TEMP/promotion-verify.json\"',\n    'decision=\"$(jq -er \\'.decision\\' \"$RUNNER_TEMP/promotion-verify.json\")\"',\n    \"if: steps.observe_verify.outputs.decision == 'VERIFIED'\",\n  ], 'post-deploy verifier'));\n  errors.push(...forbidMarkers(post, ['secrets.CLOUDFLARE_API_TOKEN }}', 'wrangler deploy --'], 'post-deploy verifier'));\n  errors.push(...secretObservationErrors(post, 'post-deploy verifier'));\n\n  errors.push(...requireMarkers(manualOutcome, [\n    \"if: always() && needs.route.outputs.mode == 'promote'\",\n    'Terminalize one lossless manual AR11 OperationalOutcome',\n    '--mode manual',\n    'Upload terminal manual AR11 OperationalOutcome evidence',\n    'Enforce terminal manual AR11 disposition after evidence publication',\n    '.contract == \"PROMOTION_OPERATOR_OUTCOME_V1\"',\n    '.procedure == \"AR11_RELEASE_SET_PROMOTION\"',\n    '.status == \"COMPLETED\"',\n    '.provider_mutation_started == true',\n    '.provider_mutation_executed == true',\n    '.production_mutation_executed == false',\n    '.effect_state == \"EFFECT_VERIFIED\"',\n  ], 'manual terminal outcome'));\n  errors.push(...forbidMarkers(manualOutcome, ['secrets.CLOUDFLARE_', 'wrangler deploy --', 'environment: production'], 'manual terminal outcome'));\n  const manualTerminalize = manualOutcome.indexOf('Terminalize one lossless manual AR11 OperationalOutcome');\n  const manualUpload = manualOutcome.indexOf('Upload terminal manual AR11 OperationalOutcome evidence');\n  const manualEnforce = manualOutcome.indexOf('Enforce terminal manual AR11 disposition after evidence publication');\n  if (!(manualTerminalize >= 0 && manualUpload > manualTerminalize && manualEnforce > manualUpload)) {\n    errors.push('manual AR11 must terminalize -> publish evidence -> enforce final disposition');\n  }\n",
              'post verifier semantic gate',
          )
          once(
              "  const earlyDeployCredential = files.promotion.replace(\n    '      - name: Activate deploy credential only after bound READY and authorization\\n        env:\\n          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}',\n    '      - name: Early deploy credential fixture\\n        env:\\n          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\\n        run: echo early\\n\\n      - name: Activate deploy credential only after bound READY and authorization\\n        env:\\n          DEPLOY_TOKEN: inherited',\n  );\n  if (!promotionErrors(earlyDeployCredential).some((error) => error.includes('explicit activation proof boundary'))) {\n    throw new Error('early deploy credential fixture unexpectedly passed');\n  }",
              "  const deployToken = '          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}';\n  const earlyCredentialAnchor = '      - name: Set up pinned Node before deploy credential';\n  let earlyDeployCredential = files.promotion.replace(deployToken, '          DEPLOY_TOKEN: inherited');\n  earlyDeployCredential = earlyDeployCredential.replace(\n    earlyCredentialAnchor,\n    '      - name: Early deploy credential fixture\\n        env:\\n          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}\\n        run: echo early\\n\\n' + earlyCredentialAnchor,\n  );\n  if (earlyDeployCredential === files.promotion || !earlyDeployCredential.includes('Early deploy credential fixture')) {\n    throw new Error('early deploy credential fixture setup failed');\n  }\n  if (!promotionErrors(earlyDeployCredential).some((error) => error.includes('explicit activation proof boundary'))) {\n    throw new Error('early deploy credential fixture unexpectedly passed');\n  }",
              'semantic early deploy credential fixture',
          )
          once(
              "  const legacyFixture = legacyAuthorityErrors((candidate) => candidate.endsWith(LEGACY_FILES[0]));",
              "  const missingManualTerminalization = files.promotion.replace('Terminalize one lossless manual AR11 OperationalOutcome', 'Terminalization fixture removed');\n  if (!promotionErrors(missingManualTerminalization).some((error) => error.includes('manual terminal outcome'))) {\n    throw new Error('missing manual terminalization fixture unexpectedly passed');\n  }\n  const weakManualSuccess = files.promotion.replace('.status == \"COMPLETED\"', '.status == \"RECOVERY_REQUIRED\"');\n  if (!promotionErrors(weakManualSuccess).some((error) => error.includes('manual terminal outcome'))) {\n    throw new Error('manual success-without-COMPLETED fixture unexpectedly passed');\n  }\n  const legacyFixture = legacyAuthorityErrors((candidate) => candidate.endsWith(LEGACY_FILES[0]));",
              'manual terminal negative fixtures',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify transport fixtures and successor invariants before commit
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile scripts/promotion-operational-outcome-ar11.py
          python scripts/promotion-operational-outcome-ar11.py --self-test
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml --test o0_ar11_operational_outcome
          node .github/scripts/release-operational-ar11.mjs --self-test
          node .github/scripts/release-operational-ar11.mjs
          node .github/scripts/ar8-d-secret-transport-successor.mjs --self-test
          node .github/scripts/ar8-d-secret-transport-successor.mjs
          test ! -e scripts/_o0_apply_manual_ar11_patch.py
          test ! -e .github/workflows/_o0-branch-patch.yml

      - name: Commit only final bounded O0 changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch changes produced'; exit 1; }
          git commit -m 'O0: terminalize manual AR11 effect outcomes'
          git push origin HEAD:o0-ar11-manual-terminal-outcome
