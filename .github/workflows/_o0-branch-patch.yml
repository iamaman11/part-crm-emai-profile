name: O0 one-shot branch patch

on:
  push:
    branches:
      - o0-ar11-manual-terminal-outcome
    paths:
      - 'scripts/_o0_apply_manual_ar11_patch.py'
      - 'scripts/_o0_patch_release_operational_checker.py'
      - '.github/workflows/_o0-branch-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact patch commit
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded target and semantic-checker patches
        run: |
          set -euo pipefail
          python scripts/_o0_apply_manual_ar11_patch.py
          sed -i '/assert!(workflow.contains("RECOVERY_REQUIRED"));/d' tools/opsctl/tests/o0_ar11_operational_outcome.rs
          python scripts/_o0_patch_release_operational_checker.py

      - name: Verify transport fixtures and successor invariants before export
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/o0-cargo-target
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile scripts/promotion-operational-outcome-ar11.py
          python scripts/promotion-operational-outcome-ar11.py --self-test
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml --test o0_ar11_operational_outcome
          node .github/scripts/release-operational-ar11.mjs --self-test
          node .github/scripts/release-operational-ar11.mjs
          node .github/scripts/ar8-d-secret-transport-successor.mjs --self-test
          node .github/scripts/ar8-d-secret-transport-successor.mjs
          test ! -e scripts/_o0_apply_manual_ar11_patch.py
          test ! -e scripts/_o0_patch_release_operational_checker.py
          test ! -e .github/workflows/_o0-branch-patch.yml
          test ! -e tools/opsctl/target

      - name: Export only verified target blobs outside workflow paths
        run: |
          set -euo pipefail
          mkdir -p o0-candidate
          cp .github/workflows/release-set-promotion.yml o0-candidate/release-set-promotion.yml
          cp scripts/promotion-operational-outcome-ar11.py o0-candidate/promotion-operational-outcome-ar11.py
          cp tools/opsctl/tests/o0_ar11_operational_outcome.rs o0-candidate/o0_ar11_operational_outcome.rs
          cp .github/scripts/release-operational-ar11.mjs o0-candidate/release-operational-ar11.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add o0-candidate
          printf '%s\n' \
            o0-candidate/o0_ar11_operational_outcome.rs \
            o0-candidate/promotion-operational-outcome-ar11.py \
            o0-candidate/release-operational-ar11.mjs \
            o0-candidate/release-set-promotion.yml > "$RUNNER_TEMP/expected-files"
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git diff --cached --check
          git commit -m 'O0: export verified manual AR11 candidate blobs'
          git push origin HEAD:o0-ar11-manual-terminal-outcome