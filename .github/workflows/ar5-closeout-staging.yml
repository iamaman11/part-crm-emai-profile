name: AR-5 Closeout Staging

on:
  push:
    branches:
      - agent/ar5-authority-closeout-staging

permissions:
  contents: write

jobs:
  generate-closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Project accepted AR-5 authority
        run: python scripts/ar5-closeout-staging.py

      - name: Generate canonical inventory and verify closeout
        shell: bash
        run: |
          python scripts/generate-architecture-inventory.py --write
          python scripts/check-documentation-authority.py
          python scripts/check-documentation-authority.py --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-cloudflare-runtime-bindings.py
          python scripts/cloudflare-deploy-config.py --check
          python scripts/cloudflare-deploy-config.py --self-test
          git diff --check

      - name: Commit verified output and remove staging helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ar5-closeout-staging.yml scripts/ar5-closeout-staging.py
          git add README.md architecture/architecture-rebaseline-v3-transition.json architecture/inventory.json docs/ARCHITECTURE_REBASELINE_V3_AR5.md docs/ARCHITECTURE_REBASELINE_V3_PLAN.md docs/DEVELOPMENT_PLAN.md docs/INDEX.md docs/README.md docs/status.json scripts/check-documentation-authority.py scripts/generate-architecture-inventory.py
          git commit -m "AR-5 authority closeout staging output"
          git push origin HEAD:agent/ar5-authority-closeout-staging
