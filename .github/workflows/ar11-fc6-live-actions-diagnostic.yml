name: AR-11 FC-6 Live Actions Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/ar11-fc6-live-actions-diagnostic.yml

permissions:
  contents: read

jobs:
  observe:
    name: Observe hosted state and validate repair candidate
    runs-on: ubuntu-latest
    steps:
      - name: Observe exact accepted-main push runs and live Actions registry
        shell: bash
        env:
          MAIN_SHA: 399826684d0d71876f614494d781a7cf420a9a60
          REPOSITORY: iamaman11/part-crm-emai-profile
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/main-push-runs.json"
          workflows="$RUNNER_TEMP/workflows.json"
          curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$MAIN_SHA&event=push&per_page=100" \
            -o "$runs"
          echo '=== exact-main push workflow runs ==='
          jq -r '.workflow_runs[] | [.id, .name, .status, (.conclusion // ""), .path, .event, .head_sha] | @tsv' "$runs"
          curl --fail --silent --show-error --retry 2 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows?per_page=100" \
            -o "$workflows"
          echo '=== live Actions registry ==='
          jq -r '.workflows[] | [.id, .name, .state, .path] | @tsv' "$workflows"
          echo "live_workflow_count=$(jq -r '.total_count' "$workflows")"

      - name: Lint exact accepted-main bytes and repaired candidate
        shell: bash
        env:
          MAIN_SHA: 399826684d0d71876f614494d781a7cf420a9a60
          REPOSITORY: iamaman11/part-crm-emai-profile
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/release-set-promotion.original.yml"
          repaired="$RUNNER_TEMP/release-set-promotion.repaired.yml"
          curl --fail --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/$REPOSITORY/$MAIN_SHA/.github/workflows/release-set-promotion.yml" \
            -o "$original"
          cp "$original" "$repaired"
          python - "$repaired" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old1 = '        description: Canonical operation: promote or rollback-negative evidence\n'
          new1 = "        description: 'Canonical operation: promote or rollback-negative evidence'\n"
          old2 = '        description: Promote: `<release_set_id>:<expected_current_release_set_id>`; negative: `<release_set_id>:<source_run_id>`\n'
          new2 = "        description: 'Promote: `<release_set_id>:<expected_current_release_set_id>`; negative: `<release_set_id>:<source_run_id>`'\n"
          assert text.count(old1) == 1
          assert text.count(old2) == 1
          path.write_text(text.replace(old1, new1).replace(old2, new2))
          PY
          echo '=== original exact-main actionlint result (must fail) ==='
          set +e
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "$original"
          original_status=$?
          set -e
          test "$original_status" -ne 0
          echo '=== repaired candidate actionlint result (must still expose remaining semantic lint) ==='
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "$repaired"
