name: AR-11 FC-6 Live Actions Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/ar11-fc6-live-actions-diagnostic.yml

permissions:
  contents: read

jobs:
  observe:
    name: Observe trusted-main transport and canonical promotion runs
    runs-on: ubuntu-latest
    steps:
      - name: Read anonymous public Actions API
        shell: bash
        env:
          REPOSITORY: iamaman11/part-crm-emai-profile
          MAIN_SHA: 399826684d0d71876f614494d781a7cf420a9a60
          CEREMONY: main-399826684d0d71876f614494d781a7cf420a9a60
          INVALID_CHECK_SUITE_ID: '88061513453'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          curl --fail --silent --show-error --retry 2 -H 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/release-set-promotion.yml/runs?event=workflow_dispatch&branch=main&per_page=100" > "$RUNNER_TEMP/promotion-runs.json"
          echo '=== ceremony promotion runs ==='
          jq --arg ceremony "$CEREMONY" '[.workflow_runs[] | select(.display_title | contains($ceremony)) | {id,name,display_title,event,status,conclusion,head_branch,head_sha,path}]' "$RUNNER_TEMP/promotion-runs.json"
          echo '=== invalid workflow object ==='
          curl --fail --silent --show-error --retry 2 -H 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/release-set-promotion.yml" | jq '{id,name,path,state,created_at,updated_at}'
          echo '=== invalid check suite ==='
          curl --fail --silent --show-error --retry 2 -H 'Accept: application/vnd.github+json' \
            "$api/check-suites/$INVALID_CHECK_SUITE_ID" | jq '{id,status,conclusion,head_sha,latest_check_runs_count}'

      - name: Run pinned actionlint against exact accepted-main promotion bytes
        shell: bash
        env:
          MAIN_SHA: 399826684d0d71876f614494d781a7cf420a9a60
          REPOSITORY: iamaman11/part-crm-emai-profile
        run: |
          set -euo pipefail
          workflow="$RUNNER_TEMP/release-set-promotion.yml"
          curl --fail --silent --show-error --retry 2 \
            "https://raw.githubusercontent.com/$REPOSITORY/$MAIN_SHA/.github/workflows/release-set-promotion.yml" \
            -o "$workflow"
          echo '=== actionlint v1.7.12 exact-main result ==='
          set +e
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 "$workflow"
          status=$?
          set -e
          echo "actionlint_exit=$status"
          test "$status" -ne 0
