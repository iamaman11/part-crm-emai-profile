name: Step 4 Quality Controller

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed

permissions:
  contents: write

jobs:
  finalize-green-head:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'repository-step-4-identity-clients-acl'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact successful head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Remove temporary Step 4 artifacts
        run: |
          rm -f step4-diagnostics.txt
          rm -f docs/step4-progress.md
          rm -f .github/workflows/step4-format-fix.yml
          rm -f .github/workflows/step4-semantic-autofix.yml
          rm -f .github/workflows/step4-green-cleanup.yml
          rm -f .github/workflows/step4-quality-controller.yml
          rm -f .github/workflows/step4-remove-legacy-writes.yml
          rm -f .github/workflows/step4-wire-governed-gate.yml
          rm -f .github/workflows/step4-switch-webcrypto.yml

      - name: Wire permanent temporary-artifact gate
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/quality-gate.yml")
          text = path.read_text(encoding="utf-8")
          compile_anchor = "          scripts/check-step4-governed-writes.py\n"
          compile_line = "          scripts/check-no-temporary-step4.py\n"
          if compile_line not in text:
              text = text.replace(compile_anchor, compile_anchor + compile_line)
          step = """
      - name: Reject temporary Step 4 artifacts
        run: python scripts/check-no-temporary-step4.py
"""
          anchor = """
      - name: Enforce architecture dependency boundaries
"""
          if "Reject temporary Step 4 artifacts" not in text:
              text = text.replace(anchor, step + anchor)
          path.write_text(text, encoding="utf-8")
          PY
          python scripts/check-no-temporary-step4.py

      - name: Commit exact green-head cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: finalize permanent source gates"
          git push origin HEAD:repository-step-4-identity-clients-acl
