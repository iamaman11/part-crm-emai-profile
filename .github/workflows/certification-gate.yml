name: Certification Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: certification-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification-linux:
    name: Certification Linux And WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Compile Step 10 policy
        run: python -m py_compile scripts/check-step10-certification.py

      - name: Enforce Step 10 certification boundary
        run: python scripts/check-step10-certification.py

      - name: Prove raw-signal output fixture is rejected
        run: |
          if python scripts/check-step10-certification.py --root tests/certification/fixtures/raw-signal-output; then
            echo "Raw-signal output fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Prove certification-owned device authority fixture is rejected
        run: |
          if python scripts/check-step10-certification.py --root tests/certification/fixtures/certification-device-authority; then
            echo "Certification-owned device authority fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy certification crate
        run: cargo clippy --locked -p certification-domain --all-targets -- -D warnings

      - name: Test certification matrix and update contracts
        run: cargo test --locked -p certification-domain

      - name: Add Workers WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check pure certification crate for Workers WASM
        run: cargo check --locked -p certification-domain --target wasm32-unknown-unknown

  certification-windows:
    name: Certification Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Test certification matrix and update contracts
        run: cargo test --locked -p certification-domain
