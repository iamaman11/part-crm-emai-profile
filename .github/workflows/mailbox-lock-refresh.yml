name: Mailbox Lock Refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'mailbox-vertical-slice-clean' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mailbox branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: mailbox-vertical-slice-clean
          persist-credentials: true

      - name: Refresh lockfile
        run: cargo generate-lockfile

      - name: Verify bounded lockfile diff
        run: |
          python - <<'PY'
          import subprocess

          diff = subprocess.check_output(
              ['git', 'diff', '--unified=0', '--', 'Cargo.lock'], text=True
          )
          added = [
              line[1:].strip()
              for line in diff.splitlines()
              if line.startswith('+') and not line.startswith('+++')
          ]
          removed = [
              line[1:].strip()
              for line in diff.splitlines()
              if line.startswith('-') and not line.startswith('---')
          ]
          expected = {'"application-ports",', '"mailbox-domain",'}
          if set(added) != expected or removed:
              raise SystemExit(f'unexpected Cargo.lock diff: added={added!r} removed={removed!r}')
          PY

      - name: Commit bounded lockfile refresh
        run: |
          if git diff --quiet -- Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "Refresh mailbox adapter lockfile"
          git push origin HEAD:mailbox-vertical-slice-clean
