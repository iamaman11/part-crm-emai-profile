name: AR-8C Staging Credential Recovery Assessment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar8c-staging-credential-recovery-assessment
  cancel-in-progress: false

jobs:
  assess:
    name: AR-8C Read-only Credential Recovery Assessment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      AR8C_TARGET_ENVIRONMENT: staging
      CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
    steps:
      - name: Checkout exact dispatched main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact accepted-main assessment boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up exact Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce runtime
        run: test "$(node --version)" = "v24.19.0"

      - name: Prove recovery assessment fails closed
        run: |
          node --check .github/scripts/ar8c-credential-recovery-assessment.mjs
          node .github/scripts/ar8c-credential-recovery-assessment.mjs self-test

      - name: Classify staging credential recovery state read-only
        run: node .github/scripts/ar8c-credential-recovery-assessment.mjs recovery-assess
