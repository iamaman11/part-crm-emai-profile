name: D1 Standard Operator

run-name: D1 operator / ${{ github.event_name }} / ${{ github.sha }}

on:
  pull_request:
    paths:
      - '.github/workflows/d1-operator.yml'
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-migration-prepare.yml'
      - '.github/workflows/d1-migration-executor.yml'
      - 'scripts/d1-prepare.py'
      - 'tools/opsctl/src/d1/**'
      - 'tools/opsctl/examples/d1-transaction-verify.rs'
      - 'tools/opsctl/examples/d1-executor-admission.rs'
      - 'tools/opsctl/examples/d1-execution-control.rs'
      - 'tools/opsctl/examples/d1-operator-outcome.rs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-operator.yml'
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-migration-prepare.yml'
      - '.github/workflows/d1-migration-executor.yml'
      - 'scripts/d1-prepare.py'
      - 'tools/opsctl/src/d1/**'
      - 'tools/opsctl/examples/d1-transaction-verify.rs'
      - 'tools/opsctl/examples/d1-executor-admission.rs'
      - 'tools/opsctl/examples/d1-execution-control.rs'
      - 'tools/opsctl/examples/d1-operator-outcome.rs'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: d1-standard-operator-main
  cancel-in-progress: false

jobs:
  contract:
    name: Standard D1 operator is transport-only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove operator has no provider authority or migration-specific policy
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import textwrap
          from pathlib import Path
          source = Path('.github/workflows/d1-operator.yml').read_text(encoding='utf-8')
          forbidden = (
              'secrets.' + 'CLOUDFLARE_API_TOKEN',
              'secrets.' + 'CLOUDFLARE_OBSERVE_API_TOKEN',
              'wrang' + 'ler ',
              'd1 migrations ' + 'apply',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1 time-travel ' + 'restore',
              '0027_' + 'pas2_payload_fingerprint_expand.sql',
              '0031_' + 'device_binding_governance.sql',
              '0032_' + 'pas2_payload_fingerprint_contract.sql',
              'd1-' + 'tx6-',
              'TX' + '-6 isolated target',
              'FRESH' + 'NESS = ',
              '--freshness-' + 'seconds',
              '--recovery-' + 'strategy',
              'NOOP_' + 'RETRY',
          )
          for value in forbidden:
              assert value not in source, f'D1 operator acquired forbidden policy/effect surface: {value}'
          trigger = source.split('\npermissions:', 1)[0]
          dispatch = trigger.split('\n  workflow_dispatch:', 1)[1]
          assert 'inputs:' not in dispatch, 'D1 operator must remain zero-input in GitHub UI'
          assert source.count('/dispatches') == 4, 'D1 operator dispatch surface drifted from exactly three natural-owner transitions'
          assert 'D1_TRANSACTION_AUTHORIZATION_V1' in source
          assert 'd1-transaction-authorization' in source
          assert 'd1-transaction-verify' in source
          assert 'd1-executor-admission-' in source
          assert '--authorization-rejection-kind' in source
          assert 'd1-execution-control' in source and 'inspect-receipt' in source and 'verify-post-state' in source
          assert 'D1_OPERATOR_OUTCOME_V1' in source and 'd1-operator-outcome' in source
          artifact_name = 'd1-operator-outcome-' + '$' + '{{ github.run_id }}-' + '$' + '{{ github.run_attempt }}'
          assert artifact_name in source
          assert 'd1-executor-inputs-' in source
          assert 'd1-execution-receipt-' in source and 'd1-migration-evidence-' in source
          assert 'scripts/d1-prepare.py' in source and 'operator-input' in source
          assert 'transaction_policy' in source and 'observation_freshness_max_age_seconds' in source
          assert 'class TypedStop' in source and 'typed_owner_diagnostic' in source
          assert ('EXECUTOR_' + 'DISPATCHED') not in source, 'operator must reconcile terminal executor evidence instead of stopping after dispatch'
          for terminal in ('COMPLETED', 'RECOVERY_REQUIRED', 'FAILED_NO_EFFECT'):
              assert terminal in source, f'operator terminal reconciliation missing {terminal}'
          for outcome in ('PREPARE_BLOCKED', 'STALE_OBSERVATION', 'SOURCE_TREE_TRANSACTION_DRIFT', 'TARGET_PRESTATE_DRIFT'):
              assert outcome in source, f'operator typed cause transport missing {outcome}'
          assert "summary.get('status') == 'PREPARE_BLOCKED'" in source, 'observer PREPARE_BLOCKED must remain typed'
          assert ('latest = rejected[0]') not in source, 'authorization rejection-set policy must not live in workflow ordering'
          assert ('def validate_' + 'transaction(') not in source, 'operator must not duplicate typed transaction-integrity policy'
          assert ('def validate_' + 'post_state(') not in source, 'operator must not duplicate typed post-state policy'
          assert ('def reconstruct_executor_' + 'manifests(') not in source, 'operator must consume immutable Prepare inputs instead of reconstructing executor manifests'
          marker = "python - <<'P" + "Y'\n"
          terminator = "\n          P" + "Y"
          blocks = source.split(marker)[1:]
          assert len(blocks) == 2, f'expected exactly two embedded Python blocks, got {len(blocks)}'
          for index, block in enumerate(blocks, start=1):
              body = block.split(terminator, 1)[0]
              ast.parse(textwrap.dedent(body), filename=f'd1-operator-inline-{index}.py')
          PY

      - name: Exercise typed transaction, admission, execution-control, and outcome adapters
        run: |
          set -euo pipefail
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo test --locked --manifest-path tools/opsctl/Cargo.toml --example d1-transaction-verify --example d1-executor-admission --example d1-execution-control --example d1-operator-outcome

  operator:
    name: Resolve current D1 state and perform one bounded transition
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact protected-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Build credential-free natural owners
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-transaction-authorization --example d1-transaction-verify --example d1-executor-admission --example d1-execution-control --example d1-operator-outcome
          test -x tools/opsctl/target/debug/opsctl
          test -x tools/opsctl/target/debug/examples/d1-transaction-authorization
          test -x tools/opsctl/target/debug/examples/d1-transaction-verify
          test -x tools/opsctl/target/debug/examples/d1-executor-admission
          test -x tools/opsctl/target/debug/examples/d1-execution-control
          test -x tools/opsctl/target/debug/examples/d1-operator-outcome
          python scripts/d1-prepare.py self-test

      - name: Resolve, prepare, stop for authorization, or reconcile sole executor
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          import tempfile
          import time
          from datetime import datetime
          from pathlib import Path

          REPO = os.environ['GITHUB_REPOSITORY']
          SOURCE = os.environ['SOURCE_SHA']
          SUMMARY = Path(os.environ['GITHUB_STEP_SUMMARY'])
          OPSCTL = Path('tools/opsctl/target/debug/opsctl')
          AUTH_TOOL = Path('tools/opsctl/target/debug/examples/d1-transaction-authorization')
          VERIFY_TOOL = Path('tools/opsctl/target/debug/examples/d1-transaction-verify')
          EXECUTION_CONTROL = Path('tools/opsctl/target/debug/examples/d1-execution-control')
          OUTCOME_TOOL = Path('tools/opsctl/target/debug/examples/d1-operator-outcome')
          OUTCOME_PATH = Path('d1-operator-outcome.json')
          PREPARE_WORKFLOW = 'd1-migration-prepare.yml'
          OBSERVE_WORKFLOW = 'd1-isolated-target-observation.yml'
          EXECUTOR_WORKFLOW = 'd1-migration-executor.yml'

          class TypedStop(Exception):
              def __init__(self, kind, message, owner_diagnostic=None, evidence_refs=None):
                  super().__init__(message)
                  self.kind = kind
                  self.owner_diagnostic = owner_diagnostic
                  self.evidence_refs = evidence_refs or {}

          def shell(args, *, check=True):
              result = subprocess.run(args, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if check and result.returncode != 0:
                  raise SystemExit(f"command failed ({result.returncode}): {' '.join(map(str, args))}\n{result.stderr.strip()}")
              return result

          def compact(value):
              return json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)

          def gh_json(endpoint):
              return json.loads(shell(['gh', 'api', endpoint]).stdout)

          def api_post(endpoint, payload):
              with tempfile.NamedTemporaryFile('w', encoding='utf-8', suffix='.json', delete=False) as handle:
                  json.dump(payload, handle, sort_keys=True, separators=(',', ':'))
                  handle.write('\n')
                  temp = handle.name
              try:
                  shell(['gh', 'api', '--method', 'POST', endpoint, '--input', temp])
              finally:
                  Path(temp).unlink(missing_ok=True)

          def epoch(value):
              return int(datetime.fromisoformat(value.replace('Z', '+00:00')).timestamp())

          def current_tree():
              return shell(['git', 'rev-parse', 'HEAD^{tree}']).stdout.strip()

          def typed_owner_diagnostic_value(diagnostic, allowed_reasons):
              if not isinstance(diagnostic, dict):
                  raise SystemExit('natural owner diagnostic is not one typed JSON object')
              tool = diagnostic.get('tool') or {}
              reason = diagnostic.get('reason_code')
              if (diagnostic.get('schema_version') != 1
                      or reason not in allowed_reasons
                      or not isinstance(diagnostic.get('remediation'), str)
                      or tool.get('name') != 'opsctl'
                      or tool.get('surface') != 'd1'):
                  raise SystemExit('natural owner returned unsupported typed D1 diagnostic')
              return diagnostic

          def typed_owner_diagnostic(process, allowed_reasons):
              try:
                  diagnostic = json.loads(process.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'natural owner rejected without typed JSON diagnostic: {exc}')
              return typed_owner_diagnostic_value(diagnostic, allowed_reasons)

          def emit_outcome(kind, issue, candidate=None, owner_diagnostic=None, evidence_refs=None,
                           authorization_rejections=None):
              evidence_refs = evidence_refs or {}
              authorization_rejections = authorization_rejections or []
              args = [str(OUTCOME_TOOL)]
              if kind is not None:
                  args.extend(['--kind', kind])
              for rejection in authorization_rejections:
                  args.extend(['--authorization-rejection-kind', rejection])
              args.extend(['--source-sha', SOURCE, '--tree-sha', current_tree(),
                           '--current-stage-issue', str(issue)])
              tx = (candidate or {}).get('transaction') or {}
              transaction_id = tx.get('transaction_id')
              if isinstance(transaction_id, str):
                  args.extend(['--transaction-id', transaction_id])
              target = (tx.get('transaction_plan') or {}).get('target')
              with tempfile.TemporaryDirectory(prefix='d1-operator-outcome-') as directory:
                  root = Path(directory)
                  if isinstance(target, dict):
                      target_path = root / 'target.json'
                      target_path.write_text(compact(target) + '\n', encoding='utf-8')
                      args.extend(['--target-json', str(target_path)])
                  if owner_diagnostic is not None:
                      diagnostic_path = root / 'owner-diagnostic.json'
                      diagnostic_path.write_text(compact(owner_diagnostic) + '\n', encoding='utf-8')
                      args.extend(['--owner-diagnostic-json', str(diagnostic_path)])
                  for name, reference in sorted(evidence_refs.items()):
                      args.extend(['--evidence-ref', f'{name}={reference}'])
                  process = shell(args)
              try:
                  outcome = json.loads(process.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'typed D1 operator outcome emitted invalid JSON: {exc}')
              canonical = compact(outcome)
              expected_kind = kind or ((owner_diagnostic or {}).get('reason_code'))
              if process.stdout.strip() != canonical:
                  raise SystemExit('typed D1 operator outcome is not canonical')
              if authorization_rejections:
                  if outcome.get('outcome') not in {'INVALID_AUTHORIZATION', 'STALE_AUTHORIZATION'}:
                      raise SystemExit('typed authorization rejection-set disposition escaped allowed outcomes')
              elif outcome.get('outcome') != expected_kind:
                  raise SystemExit('typed D1 operator outcome kind drifted')
              if (outcome.get('contract') != 'D1_OPERATOR_OUTCOME_V1'
                      or outcome.get('source_sha') != SOURCE
                      or outcome.get('tree_sha') != current_tree()
                      or outcome.get('current_stage_issue') != issue
                      or outcome.get('operator_has_provider_credentials') is not False):
                  raise SystemExit('typed D1 operator outcome identity drifted')
              if owner_diagnostic is not None and outcome.get('owner_diagnostic') != owner_diagnostic:
                  raise SystemExit('typed D1 operator outcome did not preserve natural-owner diagnostic verbatim')
              OUTCOME_PATH.write_text(canonical + '\n', encoding='utf-8')
              return outcome

          def current_stage_issue():
              tracker = gh_json(f'repos/{REPO}/issues/266')
              body = tracker.get('body')
              if not isinstance(body, str):
                  raise SystemExit('live stage pointer #266 has no readable body')
              matches = re.findall(r'^CURRENT_STAGE_ISSUE = #([1-9][0-9]*)$', body, re.MULTILINE)
              if len(matches) != 1:
                  raise SystemExit('live stage pointer #266 does not select exactly one CURRENT stage issue')
              issue = int(matches[0])
              owner = gh_json(f'repos/{REPO}/issues/{issue}')
              if owner.get('state') != 'open':
                  raise SystemExit('CURRENT stage issue is not open')
              return issue

          def workflow_runs(workflow, limit=50):
              value = gh_json(f'repos/{REPO}/actions/workflows/{workflow}/runs?branch=main&per_page={limit}')
              return value.get('workflow_runs') or []

          def artifacts(run_id):
              return gh_json(f'repos/{REPO}/actions/runs/{run_id}/artifacts?per_page=100').get('artifacts') or []

          def artifact_exact(run_id, name):
              matches = [item for item in artifacts(run_id) if item.get('name') == name and not item.get('expired')]
              return matches[0] if len(matches) == 1 else None

          def require_artifact(run_id, name):
              matches = [item for item in artifacts(run_id) if item.get('name') == name and not item.get('expired')]
              if len(matches) != 1:
                  raise SystemExit(f'exact artifact {name} missing or ambiguous for run {run_id}')
              return matches[0]

          def download(run_id, name, destination):
              destination = Path(destination)
              shutil.rmtree(destination, ignore_errors=True)
              destination.mkdir(parents=True, exist_ok=True)
              result = shell(['gh', 'run', 'download', str(run_id), '--repo', REPO, '--name', name, '--dir', str(destination)], check=False)
              if result.returncode != 0:
                  shutil.rmtree(destination, ignore_errors=True)
                  return False
              return True

          def verify_transaction(path, evaluated_at):
              process = shell([
                  str(VERIFY_TOOL), '--transaction-json', str(path), '--expected-source-sha', SOURCE,
                  '--expected-tree-sha', current_tree(), '--expected-environment', 'staging',
                  '--evaluated-at-unix-seconds', str(evaluated_at),
              ], check=False)
              if process.returncode != 0:
                  diagnostic = typed_owner_diagnostic(
                      process, {'STALE_OBSERVATION', 'SOURCE_TREE_TRANSACTION_DRIFT'}
                  )
                  raise TypedStop(
                      None,
                      diagnostic.get('summary') or diagnostic['reason_code'],
                      owner_diagnostic=diagnostic,
                  )
              try:
                  value = json.loads(process.stdout)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f'transaction verifier emitted invalid JSON: {exc}')
              if value.get('status') != 'TRANSACTION_VERIFIED' or value.get('mode') != 'read-only':
                  raise SystemExit('transaction verifier returned invalid success contract')
              if value.get('authorization_consumed') or value.get('mutation_executed') or value.get('provider_mutation_executed'):
                  raise SystemExit('transaction verifier success contract acquired an effect')
              if value.get('source_sha') != SOURCE or value.get('tree_sha') != current_tree():
                  raise SystemExit('transaction verifier success identity drifted')
              return value

          def latest_executor_epoch():
              values = [epoch(run['created_at']) for run in workflow_runs(EXECUTOR_WORKFLOW)
                        if run.get('event') == 'workflow_dispatch' and run.get('head_sha') == SOURCE]
              return max(values, default=0)

          def transaction_artifact(run):
              attempt = int(run.get('run_attempt') or 0)
              suffix = f"-{run['id']}-{attempt}"
              matches = [item for item in artifacts(run['id'])
                         if isinstance(item.get('name'), str) and item['name'].startswith('d1-transaction-')
                         and item['name'].endswith(suffix) and not item.get('expired')]
              return matches[0] if len(matches) == 1 else None

          def executor_input_artifact(run, component):
              attempt = int(run.get('run_attempt') or 0)
              name = f"d1-executor-inputs-{component}-{run['id']}-{attempt}"
              return artifact_exact(run['id'], name)

          def resolve_fresh_transaction():
              now = int(time.time())
              cutoff = latest_executor_epoch()
              runs = [run for run in workflow_runs(PREPARE_WORKFLOW)
                      if run.get('event') == 'workflow_dispatch'
                      and run.get('head_sha') == SOURCE
                      and run.get('status') == 'completed'
                      and run.get('conclusion') == 'success'
                      and epoch(run['created_at']) > cutoff]
              runs.sort(key=lambda item: epoch(item['created_at']), reverse=True)
              for run in runs:
                  artifact = transaction_artifact(run)
                  if artifact is None:
                      raise SystemExit(f"successful Prepare run {run['id']} missing/ambiguous transaction artifact")
                  with tempfile.TemporaryDirectory(prefix='d1-transaction-') as directory:
                      if not download(run['id'], artifact['name'], directory):
                          raise SystemExit(f"cannot download transaction artifact from Prepare run {run['id']}")
                      path = Path(directory) / 'transaction.json'
                      if not path.is_file():
                          raise SystemExit(f"Prepare run {run['id']} transaction artifact is missing transaction.json")
                      verification = verify_transaction(path, now)
                      executor_artifact = executor_input_artifact(run, verification['component'])
                      if executor_artifact is None:
                          raise SystemExit(f"Prepare run {run['id']} missing immutable executor input bundle")
                      tx = json.loads(path.read_text(encoding='utf-8'))
                  return {'run_id': int(run['id']), 'run_attempt': int(run['run_attempt']), 'transaction': tx,
                          'verification': verification, 'executor_artifact_name': executor_artifact['name'],
                          'fresh_until': int(verification['fresh_until_unix_seconds'])}
              return None

          def wait_for_dispatched_run(workflow, started_at, timeout_seconds, require_success=True):
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  matching = [run for run in workflow_runs(workflow)
                              if run.get('event') == 'workflow_dispatch' and run.get('head_sha') == SOURCE
                              and epoch(run['created_at']) >= started_at - 5]
                  if matching:
                      matching.sort(key=lambda item: epoch(item['created_at']), reverse=True)
                      selected = matching[0]
                      if selected.get('status') == 'completed':
                          if require_success and selected.get('conclusion') != 'success':
                              raise SystemExit(f"{workflow} run {selected['id']} completed as {selected.get('conclusion')}")
                          return selected
                  time.sleep(10)
              raise SystemExit(f'timed out waiting for {workflow} workflow_dispatch run')

          def wait_for_executor_attempt(started_at, authorization_digest, timeout_seconds):
              expected_title = f'D1 authorization={authorization_digest}'
              deadline = time.time() + timeout_seconds
              while time.time() < deadline:
                  matching = [run for run in workflow_runs(EXECUTOR_WORKFLOW, 100)
                              if run.get('event') == 'workflow_dispatch'
                              and run.get('head_sha') == SOURCE
                              and run.get('path') == '.github/workflows/d1-migration-executor.yml'
                              and run.get('display_title') == expected_title
                              and epoch(run['created_at']) >= started_at - 5]
                  if len(matching) > 1:
                      raise SystemExit('sole executor dispatch resolved to multiple matching workflow attempts')
                  if len(matching) == 1:
                      run = matching[0]
                      if int(run.get('run_attempt') or 0) != 1:
                          raise SystemExit('sole executor attempt drifted from required run_attempt=1')
                      if run.get('status') == 'completed':
                          return run
                  time.sleep(10)
              raise SystemExit('timed out waiting for exact sole executor attempt')

          def fresh_observation():
              start = int(time.time())
              api_post(f'repos/{REPO}/actions/workflows/{OBSERVE_WORKFLOW}/dispatches', {'ref': 'main'})
              run = wait_for_dispatched_run(OBSERVE_WORKFLOW, start, 1800)
              attempt = int(run['run_attempt'])
              name = f"d1-transaction-preflight-{run['id']}-{attempt}-{SOURCE}"
              artifact = artifact_exact(run['id'], name)
              if artifact is None:
                  raise SystemExit('fresh observation preflight artifact missing or ambiguous')
              jobs = gh_json(f"repos/{REPO}/actions/runs/{run['id']}/jobs?filter=latest&per_page=100").get('jobs') or []
              hosted = [job for job in jobs if job.get('name') == 'Isolated D1 target hosted observation and preflight']
              if len(hosted) != 1 or hosted[0].get('conclusion') != 'success':
                  raise SystemExit('fresh observation hosted job missing/ambiguous/not successful')
              directory = Path(tempfile.mkdtemp(prefix='d1-preflight-'))
              if not download(run['id'], name, directory):
                  raise SystemExit('cannot download fresh observation preflight artifact')
              required = {'prepare.json', 'provider-observation.json', 'runtime-context.json', 'summary.json', 'target-release-set-id.txt'}
              present = {path.name for path in directory.iterdir() if path.is_file()}
              if present != required:
                  raise SystemExit(f'fresh preflight artifact file set drifted: {sorted(present)}')
              summary = json.loads((directory / 'summary.json').read_text(encoding='utf-8'))
              prepare = json.loads((directory / 'prepare.json').read_text(encoding='utf-8'))
              preflight_ref = f"github-actions:run:{run['id']}:attempt:{attempt}:artifact:{artifact['id']}"
              if summary.get('source_sha') != SOURCE:
                  raise SystemExit('fresh observation preflight source identity drifted')
              if summary.get('status') == 'PREPARE_BLOCKED':
                  gates = prepare.get('gate_results')
                  if (prepare.get('status') != 'PREPARE_BLOCKED'
                          or summary.get('gate_results') != gates
                          or not isinstance(gates, list)
                          or not gates
                          or not isinstance(gates[0], dict)):
                      raise SystemExit('fresh observation PREPARE_BLOCKED evidence is missing or mismatched')
                  raise TypedStop(
                      'PREPARE_BLOCKED',
                      'read-only observation preflight returned canonical PREPARE_BLOCKED',
                      owner_diagnostic=gates[0],
                      evidence_refs={'observation_preflight': preflight_ref},
                  )
              if summary.get('status') != 'PREPARE_READY' or prepare.get('status') != 'PREPARE_READY':
                  raise SystemExit('fresh observation preflight is not one supported exact Prepare disposition')
              policy = ((prepare.get('plan') or {}).get('transaction_policy') or {})
              freshness = policy.get('observation_freshness_max_age_seconds')
              if isinstance(freshness, bool) or not isinstance(freshness, int) or freshness <= 0:
                  raise SystemExit('fresh observation PREPARE_READY plan has no usable typed freshness policy')
              observation_doc = json.loads((directory / 'provider-observation.json').read_text(encoding='utf-8'))
              observation = observation_doc.get('provider_observation_input') or {}
              observed = observation.get('observed_at_unix_seconds')
              if not isinstance(observed, int):
                  raise SystemExit('fresh observation has no typed observed_at_unix_seconds')
              if int(time.time()) > observed + freshness:
                  raise TypedStop(
                      'STALE_OBSERVATION',
                      'fresh provider observation expired before Prepare construction',
                      evidence_refs={'observation': preflight_ref},
                  )
              return {'run': run, 'attempt': attempt, 'job_id': int(hosted[0]['id']),
                      'artifact_id': int(artifact['id']), 'directory': directory}

          def extract_target_manifest(release_id, destination, component, target_revision):
              destination = Path(destination)
              destination.mkdir(parents=True, exist_ok=True)
              shell(['gh', 'release', 'download', release_id, '--repo', REPO,
                     '--pattern', 'release-set.json', '--pattern', 'control-plane.tar', '--dir', str(destination)])
              release_set_raw = (destination / 'release-set.json').read_bytes()
              release_set = json.loads(release_set_raw)
              if release_set.get('schema_version') != 3 or release_set.get('release_set_id') != release_id:
                  raise SystemExit('target Release Set identity mismatch')
              source = release_set.get('source') or {}
              if source.get('repository') != REPO or source.get('commit_sha') != SOURCE or source.get('accepted_main') is not True:
                  raise SystemExit('target Release Set is not bound to exact accepted main')
              release_component = (release_set.get('components') or {}).get('control_plane') or {}
              archive = destination / 'control-plane.tar'
              if hashlib.sha256(archive.read_bytes()).hexdigest() != release_component.get('artifact_sha256'):
                  raise SystemExit('target control-plane archive digest mismatch')
              with tarfile.open(archive, 'r:*') as handle:
                  members = [member for member in handle.getmembers() if member.isfile() and Path(member.name).name == 'release-manifest.json']
                  if len(members) != 1:
                      raise SystemExit('target control-plane release-manifest missing/ambiguous')
                  raw = handle.extractfile(members[0]).read()
              if hashlib.sha256(raw).hexdigest() != release_component.get('component_manifest_sha256'):
                  raise SystemExit('target control-plane manifest digest mismatch')
              value = json.loads(raw)
              schema = value.get('schema_contract') or {}
              if schema.get('database_component') != component or schema.get('target_schema_revision') != target_revision:
                  raise SystemExit('target release manifest disagrees with typed PREPARE_READY component/revision')
              return raw

          def build_prepare_payload(observed):
              directory = observed['directory']
              prepare = json.loads((directory / 'prepare.json').read_text(encoding='utf-8'))
              plan = prepare.get('plan') or {}
              component = plan.get('component')
              target_revision = plan.get('target_revision')
              if prepare.get('status') != 'PREPARE_READY' or component not in {'catalog', 'resolver'} or not isinstance(target_revision, str):
                  raise SystemExit('observation preflight prepare identity is invalid')
              release_id = (directory / 'target-release-set-id.txt').read_text(encoding='utf-8').strip()
              evidence_ref = f"github-actions:run:{observed['run']['id']}:attempt:{observed['attempt']}:job:{observed['job_id']}:artifact:{observed['artifact_id']}"
              with tempfile.TemporaryDirectory(prefix='d1-release-') as release_dir:
                  raw = extract_target_manifest(release_id, release_dir, component, target_revision)
                  manifest_path = Path(release_dir) / 'operator-target-release.json'
                  manifest_path.write_bytes(raw)
                  output_path = Path(release_dir) / 'operator-input.json'
                  shell(['python', 'scripts/d1-prepare.py', 'operator-input', '--opsctl', str(OPSCTL), '--root', '.',
                         '--preflight-dir', str(directory), '--source-sha', SOURCE, '--tree-sha', current_tree(),
                         '--release-id', release_id, '--release-manifest', str(manifest_path), '--evidence-ref', evidence_ref,
                         '--output', str(output_path)])
                  projection = json.loads(output_path.read_text(encoding='utf-8'))
              if projection.get('command') != 'd1 operator-input' or projection.get('mode') != 'read-only':
                  raise SystemExit('canonical operator input projection contract drifted')
              if projection.get('mutation_executed') or projection.get('provider_mutation_executed') or projection.get('authorization_consumed'):
                  raise SystemExit('canonical operator input projection acquired an effect')
              inputs = projection.get('inputs')
              if not isinstance(inputs, dict) or inputs.get('component') != component or inputs.get('source_sha') != SOURCE:
                  raise SystemExit('canonical operator input projection identity drifted')
              return {'ref': 'main', 'inputs': inputs}

          def dispatch_prepare_and_wait(observed):
              payload = build_prepare_payload(observed)
              component = payload['inputs']['component']
              start = int(time.time())
              api_post(f'repos/{REPO}/actions/workflows/{PREPARE_WORKFLOW}/dispatches', payload)
              run = wait_for_dispatched_run(PREPARE_WORKFLOW, start, 900, require_success=False)
              attempt = int(run['run_attempt'])
              prepare_name = f"d1-prepare-{component}-{run['id']}-{attempt}"
              prepare_artifact = artifact_exact(run['id'], prepare_name)
              if prepare_artifact is None:
                  raise SystemExit('Prepare run missing/ambiguous immutable prepare evidence')
              with tempfile.TemporaryDirectory(prefix='d1-prepare-result-') as directory:
                  if not download(run['id'], prepare_name, directory):
                      raise SystemExit('cannot download immutable Prepare evidence')
                  prepare_path = Path(directory) / 'prepare.json'
                  if not prepare_path.is_file():
                      raise SystemExit('Prepare evidence artifact missing prepare.json')
                  prepare_result = json.loads(prepare_path.read_text(encoding='utf-8'))
              prepare_ref = f"github-actions:run:{run['id']}:attempt:{attempt}:artifact:{prepare_artifact['id']}"
              if run.get('conclusion') != 'success':
                  gates = prepare_result.get('gate_results')
                  if prepare_result.get('status') == 'PREPARE_BLOCKED' and isinstance(gates, list) and gates and isinstance(gates[0], dict):
                      raise TypedStop(
                          'PREPARE_BLOCKED',
                          'canonical D1 Prepare returned PREPARE_BLOCKED',
                          owner_diagnostic=gates[0],
                          evidence_refs={'prepare': prepare_ref},
                      )
                  raise SystemExit(f"Prepare run {run['id']} failed without typed PREPARE_BLOCKED evidence")
              if prepare_result.get('status') != 'PREPARE_READY':
                  raise SystemExit('successful Prepare run did not publish PREPARE_READY evidence')
              transaction_name = f"d1-transaction-{component}-{run['id']}-{attempt}"
              executor_name = f"d1-executor-inputs-{component}-{run['id']}-{attempt}"
              if artifact_exact(run['id'], transaction_name) is None:
                  raise SystemExit('successful Prepare run missing exact transaction artifact')
              if artifact_exact(run['id'], executor_name) is None:
                  raise SystemExit('successful Prepare run missing immutable executor input bundle')
              with tempfile.TemporaryDirectory(prefix='d1-prepared-') as directory:
                  if not download(run['id'], transaction_name, directory):
                      raise SystemExit('cannot download prepared transaction artifact')
                  path = Path(directory) / 'transaction.json'
                  if not path.is_file():
                      raise SystemExit('successful Prepare transaction artifact is missing transaction.json')
                  verification = verify_transaction(path, int(time.time()))
                  tx = json.loads(path.read_text(encoding='utf-8'))
              return {'run_id': int(run['id']), 'run_attempt': attempt, 'transaction': tx,
                      'verification': verification, 'executor_artifact_name': executor_name,
                      'fresh_until': int(verification['fresh_until_unix_seconds']),
                      'prepare_evidence_ref': prepare_ref}

          def invalid_authorization_reference(comment, detail):
              return {
                  'diagnostic': None,
                  'reason_code': 'INVALID_AUTHORIZATION',
                  'authorization_reference': comment.get('html_url'),
                  'created_epoch': epoch(comment['created_at']),
                  'detail': detail,
              }

          def valid_authorizations(candidate, issue):
              tx = candidate['transaction']
              now = int(time.time())
              found = []
              rejected = []
              page = 1
              while True:
                  comments = gh_json(f'repos/{REPO}/issues/{issue}/comments?per_page=100&page={page}')
                  if not isinstance(comments, list):
                      raise SystemExit('stage issue comments response is not a list')
                  for comment in comments:
                      if comment.get('author_association') != 'OWNER' or comment.get('created_at') != comment.get('updated_at'):
                          continue
                      body = comment.get('body')
                      if not isinstance(body, str):
                          continue
                      parts = body.strip().splitlines()
                      if not parts or parts[0] != 'D1_TRANSACTION_AUTHORIZATION_V1':
                          continue
                      if len(parts) != 2:
                          rejected.append(invalid_authorization_reference(comment, 'authorization marker must contain exactly one JSON intent line'))
                          continue
                      try:
                          intent = json.loads(parts[1])
                      except json.JSONDecodeError:
                          rejected.append(invalid_authorization_reference(comment, 'authorization intent is not valid JSON'))
                          continue
                      if not isinstance(intent, dict) or compact(intent) != parts[1]:
                          rejected.append(invalid_authorization_reference(comment, 'authorization intent is not one canonical compact JSON object'))
                          continue
                      issued = intent.get('issued_at_unix_seconds')
                      expires = intent.get('expires_at_unix_seconds')
                      if not isinstance(issued, int) or not isinstance(expires, int):
                          rejected.append(invalid_authorization_reference(comment, 'authorization validity fields must be integers'))
                          continue
                      created = epoch(comment['created_at'])
                      if created < issued or created > expires:
                          rejected.append(invalid_authorization_reference(comment, 'authorization comment was recorded outside its declared validity window'))
                          continue
                      authorization = dict(intent)
                      authorization['authorization_reference'] = comment.get('html_url')
                      canonical = compact(authorization)
                      with tempfile.TemporaryDirectory(prefix='d1-authorization-') as directory:
                          tx_path = Path(directory) / 'transaction.json'
                          auth_path = Path(directory) / 'authorization.json'
                          tx_path.write_text(json.dumps(tx, sort_keys=True, indent=2) + '\n', encoding='utf-8')
                          auth_path.write_text(canonical + '\n', encoding='utf-8')
                          process = shell([str(AUTH_TOOL), '--transaction-json', str(tx_path), '--authorization-json', str(auth_path),
                                           '--evaluated-at-unix-seconds', str(now)], check=False)
                      if process.returncode != 0:
                          diagnostic = typed_owner_diagnostic(process, {'INVALID_AUTHORIZATION', 'STALE_AUTHORIZATION'})
                          rejected.append({'diagnostic': diagnostic,
                                           'reason_code': diagnostic['reason_code'],
                                           'authorization_reference': authorization['authorization_reference'],
                                           'created_epoch': created,
                                           'detail': diagnostic.get('summary')})
                          continue
                      binding = json.loads(process.stdout)
                      if binding.get('status') != 'AUTHORIZATION_VERIFIED' or binding.get('transaction_id') != tx.get('transaction_id'):
                          raise SystemExit('authorization natural owner returned an invalid success binding')
                      found.append({'authorization_json': canonical, 'authorization_digest': binding.get('authorization_digest'),
                                    'authorization_reference': authorization['authorization_reference'], 'created_epoch': created})
                  if len(comments) < 100:
                      break
                  page += 1
              found.sort(key=lambda item: (item['created_epoch'], item['authorization_reference']))
              rejected.sort(key=lambda item: (item['created_epoch'], item['authorization_reference'] or ''), reverse=True)
              return {'valid': found, 'rejected': rejected}

          def load_executor_inputs(candidate):
              expected = {'target-release.json', 'current-release.json', 'known-good-release.json', 'preconditions.json'}
              with tempfile.TemporaryDirectory(prefix='d1-executor-inputs-') as directory:
                  if not download(candidate['run_id'], candidate['executor_artifact_name'], directory):
                      raise SystemExit('cannot download immutable executor input bundle')
                  root = Path(directory)
                  present = {path.name for path in root.iterdir() if path.is_file()}
                  if present != expected:
                      raise SystemExit(f'immutable executor input bundle file set drifted: {sorted(present)}')
                  values = {}
                  for name in expected:
                      value = json.loads((root / name).read_text(encoding='utf-8'))
                      if not isinstance(value, dict):
                          raise SystemExit(f'immutable executor input {name} must be one JSON object')
                      values[name] = value
              return values

          def dispatch_executor(candidate, authorization):
              tx = candidate['transaction']
              verification = candidate['verification']
              target = tx['transaction_plan']['target']
              component = verification['component']
              inputs = load_executor_inputs(candidate)
              confirmation = f"{SOURCE}:{target['environment']}:{component}:{target['database_id']}"
              payload = {'ref': 'main', 'inputs': {
                  'environment': target['environment'], 'source_sha': SOURCE, 'component': component,
                  'account_id': target['account_id'], 'database_name': target['database_name'], 'database_id': target['database_id'],
                  'target_release_manifest_json': compact(inputs['target-release.json']),
                  'current_release_manifest_json': compact(inputs['current-release.json']),
                  'known_good_release_manifest_json': compact(inputs['known-good-release.json']),
                  'preconditions_json': compact(inputs['preconditions.json']), 'transition_mode': 'ordinary',
                  'expected_release_set_id': '', 'prepared_transaction_run_id': str(candidate['run_id']),
                  'prepared_transaction_run_attempt': str(candidate['run_attempt']), 'transaction_id': tx['transaction_id'],
                  'authorization_digest': authorization['authorization_digest'],
                  'transaction_authorization_json': authorization['authorization_json'], 'mutation_authorized': True,
                  'confirmation': confirmation}}
              started_at = int(time.time())
              api_post(f'repos/{REPO}/actions/workflows/{EXECUTOR_WORKFLOW}/dispatches', payload)
              return wait_for_executor_attempt(started_at, authorization['authorization_digest'], 1800)

          def reconcile_executor(candidate, authorization, run):
              tx = candidate['transaction']
              verification = candidate['verification']
              target = tx['transaction_plan']['target']
              run_id = int(run['id'])
              run_number = int(run['run_number'])
              run_attempt = int(run['run_attempt'])

              admission_name = f"d1-executor-admission-{authorization['authorization_digest']}-{run_id}-{run_attempt}"
              admission_artifact = artifact_exact(run_id, admission_name)
              if admission_artifact is not None:
                  with tempfile.TemporaryDirectory(prefix='d1-executor-admission-') as directory:
                      if not download(run_id, admission_name, directory):
                          raise SystemExit('cannot download exact executor admission artifact')
                      root = Path(directory)
                      present = {path.name for path in root.iterdir() if path.is_file()}
                      if present != {'executor-admission.json'}:
                          raise SystemExit(f'executor admission artifact file set drifted: {sorted(present)}')
                      admission = json.loads((root / 'executor-admission.json').read_text(encoding='utf-8'))
                  admission_ref = f"github-actions:run:{run_id}:attempt:{run_attempt}:artifact:{admission_artifact['id']}"
                  if admission.get('status') == 'EXECUTOR_ADMISSION_VERIFIED':
                      if (admission.get('transaction_id') != tx['transaction_id']
                              or admission.get('authorization_digest') != authorization['authorization_digest']
                              or admission.get('source_sha') != SOURCE
                              or admission.get('tree_sha') != current_tree()
                              or admission.get('component') != verification['component']
                              or admission.get('target') != target
                              or admission.get('phase') != 'ORDINARY'
                              or admission.get('authorization_consumed') is not False
                              or admission.get('mutation_executed') is not False
                              or admission.get('provider_mutation_executed') is not False):
                          raise SystemExit('executor admission success evidence identity drifted')
                  else:
                      diagnostic = typed_owner_diagnostic_value(
                          admission,
                          {'SOURCE_TREE_TRANSACTION_DRIFT', 'INVALID_AUTHORIZATION', 'STALE_AUTHORIZATION'},
                      )
                      raise TypedStop(
                          None,
                          diagnostic.get('summary') or diagnostic['reason_code'],
                          owner_diagnostic=diagnostic,
                          evidence_refs={'executor_admission': admission_ref},
                      )

              receipt_name = f'd1-execution-receipt-{run_number}-{run_id}-{run_attempt}-terminal'
              receipt_artifact = require_artifact(run_id, receipt_name)
              with tempfile.TemporaryDirectory(prefix='d1-terminal-receipt-') as directory:
                  if not download(run_id, receipt_name, directory):
                      raise SystemExit('cannot download exact terminal execution receipt')
                  root = Path(directory)
                  present = {path.name for path in root.iterdir() if path.is_file()}
                  if present != {'execution-receipt.json'}:
                      raise SystemExit(f'terminal execution receipt artifact file set drifted: {sorted(present)}')
                  receipt_path = root / 'execution-receipt.json'
                  inspected = shell([str(EXECUTION_CONTROL), 'inspect-receipt', '--receipt', str(receipt_path)])
                  try:
                      receipt = json.loads(inspected.stdout)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f'typed execution receipt inspection emitted invalid JSON: {exc}')
                  canonical_receipt = compact(receipt)
                  if inspected.stdout.strip() != canonical_receipt:
                      raise SystemExit('typed execution receipt inspection is not canonical')

              if receipt.get('schema_version') != 1:
                  raise SystemExit('terminal execution receipt schema drifted')
              if receipt.get('target') != target:
                  raise SystemExit('terminal execution receipt target does not match prepared transaction')
              if receipt.get('phase') != 'ORDINARY':
                  raise SystemExit('terminal execution receipt phase is not ORDINARY')
              if receipt.get('operation_identity') != tx['transaction_id'] or receipt.get('transaction_id') != tx['transaction_id']:
                  raise SystemExit('terminal execution receipt transaction identity mismatch')
              if receipt.get('authorization_digest') != authorization['authorization_digest']:
                  raise SystemExit('terminal execution receipt authorization digest mismatch')
              if receipt.get('source_sha') != SOURCE:
                  raise SystemExit('terminal execution receipt source mismatch')
              if receipt.get('executor_run_id') != run_id or receipt.get('fence_epoch') != run_number:
                  raise SystemExit('terminal execution receipt executor attempt identity mismatch')
              if not isinstance(receipt.get('receipt_id'), str) or re.fullmatch(r'[0-9a-f]{64}', receipt['receipt_id']) is None:
                  raise SystemExit('terminal execution receipt_id is invalid')
              events = receipt.get('events')
              if not isinstance(events, list) or not events or not isinstance(events[-1], dict):
                  raise SystemExit('terminal execution receipt has no typed terminal event')
              terminal = events[-1].get('kind')
              if terminal not in {'COMPLETED', 'RECOVERY_REQUIRED', 'FAILED_NO_EFFECT'}:
                  raise SystemExit(f'unrecognized terminal execution receipt state: {terminal}')
              receipt_sha256 = hashlib.sha256(canonical_receipt.encode('utf-8')).hexdigest()

              evidence_artifact_id = None
              evidence_sha256 = None
              if terminal == 'COMPLETED':
                  if run.get('conclusion') != 'success':
                      raise SystemExit('COMPLETED receipt disagrees with non-success executor conclusion')
                  evidence_name = f"d1-migration-evidence-{target['environment']}-{verification['component']}-{run_id}-{run_attempt}"
                  evidence_artifact = require_artifact(run_id, evidence_name)
                  with tempfile.TemporaryDirectory(prefix='d1-terminal-evidence-') as directory:
                      if not download(run_id, evidence_name, directory):
                          raise SystemExit('cannot download exact completed execution evidence')
                      root = Path(directory)
                      present = {path.name for path in root.iterdir() if path.is_file()}
                      if present != {'evidence.json'}:
                          raise SystemExit(f'completed execution evidence artifact file set drifted: {sorted(present)}')
                      evidence_path = root / 'evidence.json'
                      evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
                      evidence_sha256 = hashlib.sha256(evidence_path.read_bytes()).hexdigest()
                  if evidence.get('schema_version') != 3 or evidence.get('evidence_kind') != 'protected-d1-migration-execution':
                      raise SystemExit('completed execution evidence schema/kind mismatch')
                  if evidence.get('execution_receipt') != receipt or evidence.get('execution_receipt_id') != receipt['receipt_id']:
                      raise SystemExit('completed execution evidence does not bind exact terminal receipt')
                  context = evidence.get('context')
                  if not isinstance(context, dict):
                      raise SystemExit('completed execution evidence context missing')
                  expected_context = {
                      'source_sha': SOURCE,
                      'environment': target['environment'],
                      'component': verification['component'],
                      'database_name': target['database_name'],
                      'database_id': target['database_id'],
                      'transition_mode': 'ordinary',
                      'transaction_id': tx['transaction_id'],
                      'authorization_digest': authorization['authorization_digest'],
                      'prepared_transaction_run_id': str(candidate['run_id']),
                      'prepared_transaction_run_attempt': str(candidate['run_attempt']),
                      'executor_run_id': str(run_id),
                      'executor_run_number': str(run_number),
                      'executor_run_attempt': str(run_attempt),
                  }
                  for key, expected in expected_context.items():
                      if context.get(key) != expected:
                          raise SystemExit(f'completed execution evidence context mismatch for {key}')
                  if context.get('mutation_authorized') is not True:
                      raise SystemExit('completed execution evidence lost exact mutation authorization binding')
                  evidence_artifact_id = int(evidence_artifact['id'])
              elif run.get('conclusion') == 'success':
                  raise SystemExit(f'{terminal} receipt disagrees with successful executor conclusion')

              return {
                  'state': terminal,
                  'executor_run_id': run_id,
                  'executor_run_number': run_number,
                  'executor_run_attempt': run_attempt,
                  'executor_conclusion': run.get('conclusion'),
                  'receipt_artifact_id': int(receipt_artifact['id']),
                  'receipt_id': receipt['receipt_id'],
                  'receipt_sha256': receipt_sha256,
                  'receipt': receipt,
                  'evidence_artifact_id': evidence_artifact_id,
                  'evidence_sha256': evidence_sha256,
              }

          def reconcile_post_state(candidate, result):
              observed = fresh_observation()
              observation_path = observed['directory'] / 'provider-observation.json'
              observation_raw = observation_path.read_bytes()
              observation_doc = json.loads(observation_raw)
              observation = observation_doc.get('provider_observation_input')
              if not isinstance(observation, dict):
                  raise SystemExit('fresh post-state artifact is missing provider_observation_input')
              with tempfile.TemporaryDirectory(prefix='d1-post-state-') as directory:
                  root = Path(directory)
                  transaction_path = root / 'transaction.json'
                  receipt_path = root / 'execution-receipt.json'
                  provider_path = root / 'provider-observation-input.json'
                  transaction_path.write_text(compact(candidate['transaction']) + '\n', encoding='utf-8')
                  receipt_path.write_text(compact(result['receipt']) + '\n', encoding='utf-8')
                  provider_path.write_text(compact(observation) + '\n', encoding='utf-8')
                  process = shell([
                      str(EXECUTION_CONTROL), 'verify-post-state',
                      '--input', str(transaction_path),
                      '--receipt', str(receipt_path),
                      '--observation', str(provider_path),
                      '--evaluated-at-unix-seconds', str(int(time.time())),
                  ], check=False)
                  if process.returncode != 0:
                      diagnostic = typed_owner_diagnostic(
                          process, {'TARGET_PRESTATE_DRIFT', 'STALE_OBSERVATION'}
                      )
                      raise TypedStop(
                          None,
                          diagnostic.get('summary') or diagnostic['reason_code'],
                          owner_diagnostic=diagnostic,
                          evidence_refs={
                              'post_state_observation': f"github-actions:run:{observed['run']['id']}:attempt:{observed['attempt']}:artifact:{observed['artifact_id']}"
                          },
                      )
                  try:
                      verification = json.loads(process.stdout)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f'typed post-state verification emitted invalid JSON: {exc}')
                  canonical_verification = compact(verification)
                  if process.stdout.strip() != canonical_verification:
                      raise SystemExit('typed post-state verification is not canonical')
              if verification.get('status') != 'POST_STATE_VERIFIED':
                  raise SystemExit('typed post-state verification did not produce POST_STATE_VERIFIED')
              if verification.get('transaction_id') != candidate['transaction'].get('transaction_id'):
                  raise SystemExit('typed post-state verification transaction binding mismatch')
              if verification.get('receipt_id') != result['receipt_id']:
                  raise SystemExit('typed post-state verification receipt binding mismatch')
              if verification.get('target') != candidate['transaction']['transaction_plan']['target']:
                  raise SystemExit('typed post-state verification target binding mismatch')
              return {
                  'verification': verification,
                  'verification_sha256': hashlib.sha256(canonical_verification.encode('utf-8')).hexdigest(),
                  'observation_run_id': int(observed['run']['id']),
                  'observation_run_attempt': observed['attempt'],
                  'observation_artifact_id': observed['artifact_id'],
                  'observation_sha256': hashlib.sha256(observation_raw).hexdigest(),
              }

          issue = current_stage_issue()
          try:
              candidate = resolve_fresh_transaction()
              if candidate is None:
                  observed = fresh_observation()
                  candidate = dispatch_prepare_and_wait(observed)
                  tx = candidate['transaction']
                  planned = (tx.get('transaction_plan') or {}).get('planned_migrations')
                  if planned == []:
                      outcome = emit_outcome('REPLAY_OR_NOOP', issue, candidate,
                                             evidence_refs={'prepare': candidate.get('prepare_evidence_ref') or f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
                      SUMMARY.write_text('# D1 mechanical replay/no-op\n\n'
                                         f"- Current stage issue: `#{issue}`\n- TransactionId: `{tx['transaction_id']}`\n"
                                         f"- Typed outcome: `{outcome['outcome']}`\n- Provider mutation: `NO`\n",
                                         encoding='utf-8')
                      raise SystemExit(0)
                  outcome = emit_outcome('AUTHORIZATION_REQUIRED', issue, candidate,
                                         evidence_refs={'prepare': candidate.get('prepare_evidence_ref') or f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
                  SUMMARY.write_text('# D1 transaction prepared\n\n'
                                     f"- Current stage issue: `#{issue}`\n- TransactionId: `{tx['transaction_id']}`\n"
                                     f"- Prepare run: `{candidate['run_id']}` attempt `{candidate['run_attempt']}`\n"
                                     f"- Fresh until unix: `{candidate['fresh_until']}`\n- Typed outcome: `{outcome['outcome']}`\n"
                                     '- Provider mutation: `NO`\n- Next: record one exact transaction authorization in the CURRENT stage issue, then run this workflow once.\n',
                                     encoding='utf-8')
                  print(f"D1_OPERATOR_STATE=AUTHORIZATION_REQUIRED transaction_id={tx['transaction_id']} issue={issue}")
                  raise SystemExit(0)
          except TypedStop as stop:
              outcome = emit_outcome(stop.kind, issue, owner_diagnostic=stop.owner_diagnostic,
                                     evidence_refs=stop.evidence_refs)
              SUMMARY.write_text('# D1 operator blocked before authorization/dispatch\n\n'
                                 f"- Current stage issue: `#{issue}`\n- Typed outcome: `{outcome['outcome']}`\n"
                                 f"- Detail: `{str(stop)}`\n- Provider mutation: `NO`\n",
                                 encoding='utf-8')
              raise SystemExit(1)
          except SystemExit:
              if not OUTCOME_PATH.is_file():
                  emit_outcome('RECEIPT_OR_EVIDENCE_MISSING_OR_MISMATCHED', issue)
              raise

          tx = candidate['transaction']
          planned = (tx.get('transaction_plan') or {}).get('planned_migrations')
          if planned == []:
              emit_outcome('REPLAY_OR_NOOP', issue, candidate,
                           evidence_refs={'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
              raise SystemExit(0)

          try:
              authorization_set = valid_authorizations(candidate, issue)
          except SystemExit:
              emit_outcome('RECEIPT_OR_EVIDENCE_MISSING_OR_MISMATCHED', issue, candidate,
                           evidence_refs={'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
              raise
          auths = authorization_set['valid']
          rejected = authorization_set['rejected']
          if len(auths) == 0 and rejected:
              rejection_refs = {
                  'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"
              }
              for index, rejected_candidate in enumerate(rejected, start=1):
                  reference = rejected_candidate.get('authorization_reference')
                  if not isinstance(reference, str) or not reference:
                      raise SystemExit('rejected authorization candidate lost durable reference')
                  rejection_refs[f'authorization_candidate_{index:03d}'] = reference
              outcome = emit_outcome(
                  None,
                  issue,
                  candidate,
                  evidence_refs=rejection_refs,
                  authorization_rejections=[item['reason_code'] for item in rejected],
              )
              SUMMARY.write_text('# D1 authorization rejected\n\n'
                                 f"- Current stage issue: `#{issue}`\n- TransactionId: `{tx['transaction_id']}`\n"
                                 f"- Typed outcome: `{outcome['outcome']}`\n- Rejected candidates: `{len(rejected)}`\n"
                                 '- No executor was dispatched.\n',
                                 encoding='utf-8')
              raise SystemExit(1)
          if len(auths) == 0:
              outcome = emit_outcome('NO_AUTHORIZATION', issue, candidate,
                                     evidence_refs={'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
              SUMMARY.write_text('# D1 authorization required\n\n'
                                 f"- Current stage issue: `#{issue}`\n- TransactionId: `{tx['transaction_id']}`\n"
                                 f"- Typed outcome: `{outcome['outcome']}`\n"
                                 '- No exact immutable OWNER authorization exists for this fresh transaction.\n- No executor was dispatched.\n',
                                 encoding='utf-8')
              print(f"D1_OPERATOR_STATE=NO_AUTHORIZATION transaction_id={tx['transaction_id']} issue={issue}")
              raise SystemExit(0)
          if len(auths) != 1:
              emit_outcome('MULTIPLE_AUTHORIZATIONS', issue, candidate,
                           evidence_refs={'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}"})
              raise SystemExit('multiple valid OWNER authorizations exist for the same fresh transaction')

          try:
              executor_run = dispatch_executor(candidate, auths[0])
              result = reconcile_executor(candidate, auths[0], executor_run)
          except TypedStop as stop:
              emit_outcome(stop.kind, issue, candidate, owner_diagnostic=stop.owner_diagnostic,
                           evidence_refs={
                               'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}",
                               'authorization': auths[0]['authorization_reference'],
                               **stop.evidence_refs,
                           })
              raise SystemExit(1)
          except SystemExit:
              if not OUTCOME_PATH.is_file():
                  emit_outcome('RECEIPT_OR_EVIDENCE_MISSING_OR_MISMATCHED', issue, candidate,
                               evidence_refs={
                                   'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}",
                                   'authorization': auths[0]['authorization_reference'],
                               })
              raise
          try:
              post_state = reconcile_post_state(candidate, result)
          except TypedStop as stop:
              emit_outcome(stop.kind, issue, candidate, owner_diagnostic=stop.owner_diagnostic,
                           evidence_refs={
                               'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}",
                               'authorization': auths[0]['authorization_reference'],
                               'executor': f"github-actions:run:{result['executor_run_id']}:attempt:{result['executor_run_attempt']}",
                               'receipt': f"github-actions:run:{result['executor_run_id']}:artifact:{result['receipt_artifact_id']}:receipt:{result['receipt_id']}",
                               **stop.evidence_refs,
                           })
              raise SystemExit(1)
          except SystemExit:
              emit_outcome('RECEIPT_OR_EVIDENCE_MISSING_OR_MISMATCHED', issue, candidate,
                           evidence_refs={
                               'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}",
                               'authorization': auths[0]['authorization_reference'],
                               'executor': f"github-actions:run:{result['executor_run_id']}:attempt:{result['executor_run_attempt']}",
                               'receipt': f"github-actions:run:{result['executor_run_id']}:artifact:{result['receipt_artifact_id']}:receipt:{result['receipt_id']}",
                           })
              raise
          post = post_state['verification']
          evidence_refs = {
              'prepare': f"github-actions:run:{candidate['run_id']}:attempt:{candidate['run_attempt']}",
              'authorization': auths[0]['authorization_reference'],
              'executor': f"github-actions:run:{result['executor_run_id']}:attempt:{result['executor_run_attempt']}",
              'receipt': f"github-actions:run:{result['executor_run_id']}:artifact:{result['receipt_artifact_id']}:receipt:{result['receipt_id']}",
              'post_state': f"github-actions:run:{post_state['observation_run_id']}:attempt:{post_state['observation_run_attempt']}:artifact:{post_state['observation_artifact_id']}:sha256:{post_state['verification_sha256']}",
          }
          if result['evidence_artifact_id'] is not None:
              evidence_refs['execution_evidence'] = f"github-actions:run:{result['executor_run_id']}:artifact:{result['evidence_artifact_id']}:sha256:{result['evidence_sha256']}"
          if result['state'] == 'COMPLETED':
              outcome_kind = 'COMPLETED_VERIFIED'
          elif result['state'] == 'RECOVERY_REQUIRED':
              outcome_kind = 'RECOVERY_REQUIRED'
          else:
              event_kinds = [event.get('kind') for event in result['receipt'].get('events', []) if isinstance(event, dict)]
              outcome_kind = ('PREWRITE_ABORT' if 'PREWRITE_ABORTED' in event_kinds and 'MUTATION_STARTED' not in event_kinds
                              else 'EXECUTOR_FAILED_NO_EFFECT')
          outcome = emit_outcome(outcome_kind, issue, candidate, evidence_refs=evidence_refs)

          evidence_line = '- Completed evidence artifact: `N/A`\n- Completed evidence SHA-256: `N/A`\n'
          if result['evidence_artifact_id'] is not None:
              evidence_line = (f"- Completed evidence artifact: `{result['evidence_artifact_id']}`\n"
                               f"- Completed evidence SHA-256: `{result['evidence_sha256']}`\n")
          SUMMARY.write_text('# Sole D1 executor and post-state reconciled\n\n'
                             f"- Current stage issue: `#{issue}`\n- TransactionId: `{tx['transaction_id']}`\n"
                             f"- Authorization digest: `{auths[0]['authorization_digest']}`\n"
                             f"- Executor run: `{result['executor_run_id']}` attempt `{result['executor_run_attempt']}`\n"
                             f"- Executor conclusion: `{result['executor_conclusion']}`\n"
                             f"- Terminal receipt state: `{result['state']}`\n"
                             f"- Typed outcome: `{outcome['outcome']}`\n"
                             f"- Receipt artifact: `{result['receipt_artifact_id']}`\n"
                             f"- ReceiptId: `{result['receipt_id']}`\n"
                             f"- Receipt SHA-256: `{result['receipt_sha256']}`\n"
                             + evidence_line
                             + f"- Post-state disposition: `{post['disposition']}`\n"
                             f"- Expected post-state reached: `{post['expected_post_state_reached']}`\n"
                             f"- Post-state observer run: `{post_state['observation_run_id']}` attempt `{post_state['observation_run_attempt']}`\n"
                             f"- Post-state observation artifact: `{post_state['observation_artifact_id']}`\n"
                             f"- Post-state observation SHA-256: `{post_state['observation_sha256']}`\n"
                             f"- Post-state verification SHA-256: `{post_state['verification_sha256']}`\n"
                             + '- Mutation authority remained solely in d1-migration-executor.yml; post-state observation was read-only.\n',
                             encoding='utf-8')
          print(f"D1_OPERATOR_STATE={outcome['outcome']} transaction_id={tx['transaction_id']} "
                f"authorization_digest={auths[0]['authorization_digest']} executor_run_id={result['executor_run_id']} "
                f"receipt_id={result['receipt_id']} post_state={post['disposition']} issue={issue}")
          if result['state'] != 'COMPLETED':
              raise SystemExit(1)
          PY

      - name: Upload durable typed D1 operator outcome
        if: always() && hashFiles('d1-operator-outcome.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-operator-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: d1-operator-outcome.json
          if-no-files-found: error
          retention-days: 30
