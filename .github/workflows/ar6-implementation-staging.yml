name: AR-6 Workflow Blob Staging

on:
  push:
    branches:
      - agent/ar6-workflow-blob-staging

permissions:
  contents: write

jobs:
  blobs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Build exact permanent workflow projections
        run: python scripts/ar6-implementation-staging.py

      - name: Upload workflow contents as Git blobs only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          for label, path in [
              ("QUALITY_BLOB", ".github/workflows/quality-gate.yml"),
              ("REPOSITORY_QUALITY_BLOB", ".github/workflows/repository-quality-audit-gate.yml"),
          ]:
              payload = json.dumps({
                  "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs",
                  data=payload,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ar6-workflow-blob-staging",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  document = json.load(response)
              print(f"{label}={document['sha']}")
          PY
