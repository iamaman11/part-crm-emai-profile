name: AR-6 Implementation Staging

on:
  push:
    branches:
      - agent/ar6-implementation-staging

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact staging branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0

      - name: Apply deterministic AR-6 staging projection
        run: python scripts/ar6-implementation-staging.py

      - name: Generate full Python estate
        run: python scripts/python-estate-ar6.py --write

      - name: Format opsctl
        run: cargo fmt --manifest-path tools/opsctl/Cargo.toml

      - name: Verify AR-6 implementation
        shell: bash
        run: |
          python -m py_compile scripts/python-estate-ar6.py scripts/check-opsctl-readonly.py
          python scripts/python-estate-ar6.py --check
          python scripts/python-estate-ar6.py --self-test
          python scripts/check-opsctl-readonly.py
          python scripts/check-opsctl-readonly.py --self-test
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          cargo clippy --locked --manifest-path tools/opsctl/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path tools/opsctl/Cargo.toml
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . doctor | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . status | python -m json.tool >/dev/null
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . inventory | python -m json.tool >/dev/null
          python scripts/generate-architecture-inventory.py --check
          git diff --check

      - name: Commit verified output without staging helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ar6-implementation-staging.yml scripts/ar6-implementation-staging.py
          git add architecture/python-estate-ar6.json scripts/python-estate-ar6.py tools/opsctl .github/workflows/quality-gate.yml .github/workflows/repository-quality-audit-gate.yml
          git commit -m "AR-6 verified implementation staging output"
          git push origin HEAD:agent/ar6-implementation-staging
