name: AR-8C One-Shot Bootstrap Root Retirement

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ar8c-retire-bootstrap-roots-once.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: ar8c-one-shot-bootstrap-root-retirement
  cancel-in-progress: false

jobs:
  retire:
    name: Retire verified AR-8C staging bootstrap roots once
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      EXPECTED_REPOSITORY: iamaman11/part-crm-emai-profile
      EXPECTED_ENVIRONMENT: staging
      EXPECTED_PRE_RETIRE_SHA: f2c93ac2f57f12607f35f23d4fc5317366c5889f
      EXPECTED_GOVERNANCE_RUN_ID: '32069183476'
      EXPECTED_GOVERNANCE_WORKFLOW_ID: '335582065'
      GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
      GH_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.GH_BOOTSTRAP_ADMIN_TOKEN }}
      CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_TOKEN_ISSUER_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_ISSUER_TOKEN }}
    steps:
      - name: Verify exact accepted pre-retirement authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'push'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$EVENT_BEFORE" = "$EXPECTED_PRE_RETIRE_SHA"
          test -n "$GH_ADMIN_OPERATOR_TOKEN"
          test -n "$GH_BOOTSTRAP_ADMIN_TOKEN"
          test -n "$CLOUDFLARE_BOOTSTRAP_TOKEN"
          test -n "$CLOUDFLARE_TOKEN_ISSUER_TOKEN"
          test "$GH_ADMIN_OPERATOR_TOKEN" != "$GH_BOOTSTRAP_ADMIN_TOKEN"
          test "$CLOUDFLARE_BOOTSTRAP_TOKEN" != "$CLOUDFLARE_TOKEN_ISSUER_TOKEN"

          run_json="$RUNNER_TEMP/governance-run.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$EXPECTED_REPOSITORY/actions/runs/$EXPECTED_GOVERNANCE_RUN_ID" \
            --output "$run_json"
          test "$(jq -r '.workflow_id' "$run_json")" = "$EXPECTED_GOVERNANCE_WORKFLOW_ID"
          test "$(jq -r '.head_sha' "$run_json")" = "$EXPECTED_PRE_RETIRE_SHA"
          test "$(jq -r '.head_branch' "$run_json")" = 'main'
          test "$(jq -r '.event' "$run_json")" = 'push'
          test "$(jq -r '.status' "$run_json")" = 'completed'
          test "$(jq -r '.conclusion' "$run_json")" = 'success'

      - name: Revoke Cloudflare bootstrap and issuer credentials
        shell: bash
        run: |
          set -euo pipefail
          cf_api='https://api.cloudflare.com/client/v4'

          verify_active() {
            local token="$1"
            local label="$2"
            local output="$RUNNER_TEMP/${label}-verify-active.json"
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $token" \
              --header 'Accept: application/json' \
              "$cf_api/user/tokens/verify" \
              --output "$output"
            test "$(jq -r '.success' "$output")" = 'true'
            test "$(jq -r '.result.status' "$output")" = 'active'
            local id
            id="$(jq -r '.result.id' "$output")"
            [[ "$id" =~ ^[0-9a-f]{32}$ ]]
            printf '%s\n' "$id"
          }

          delete_token() {
            local actor_token="$1"
            local token_id="$2"
            local label="$3"
            local output="$RUNNER_TEMP/${label}-delete.json"
            local status
            status="$(curl --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer $actor_token" \
              --header 'Accept: application/json' \
              --output "$output" \
              --write-out '%{http_code}' \
              "$cf_api/user/tokens/$token_id")"
            test "$status" = '200'
            test "$(jq -r '.success' "$output")" = 'true'
            test "$(jq -r '.result.id' "$output")" = "$token_id"
          }

          expect_inactive() {
            local token="$1"
            local label="$2"
            local attempt output status success token_status
            for attempt in $(seq 1 20); do
              output="$RUNNER_TEMP/${label}-verify-inactive-$attempt.json"
              status="$(curl --silent --show-error \
                --header "Authorization: Bearer $token" \
                --header 'Accept: application/json' \
                --output "$output" \
                --write-out '%{http_code}' \
                "$cf_api/user/tokens/verify" || true)"
              if [ "$status" = '200' ]; then
                success="$(jq -r '.success // false' "$output" 2>/dev/null || printf false)"
                token_status="$(jq -r '.result.status // ""' "$output" 2>/dev/null || true)"
                if [ "$success" != 'true' ] || [ "$token_status" != 'active' ]; then
                  return 0
                fi
              elif [ "$status" = '400' ] || [ "$status" = '401' ] || [ "$status" = '403' ]; then
                return 0
              elif [ "$status" = '429' ] || [[ "$status" =~ ^5[0-9][0-9]$ ]]; then
                :
              else
                echo "$label verification returned unexpected HTTP $status" >&2
                exit 1
              fi
              sleep 5
            done
            echo "$label remained active after bounded revocation verification" >&2
            exit 1
          }

          bootstrap_id="$(verify_active "$CLOUDFLARE_BOOTSTRAP_TOKEN" 'cloudflare-bootstrap')"
          issuer_id="$(verify_active "$CLOUDFLARE_TOKEN_ISSUER_TOKEN" 'cloudflare-issuer')"
          test "$bootstrap_id" != "$issuer_id"

          # The issuer credential has the accepted API Tokens Write authority.
          # Revoke the infrastructure bootstrap root first, verify, then self-revoke the issuer last.
          delete_token "$CLOUDFLARE_TOKEN_ISSUER_TOKEN" "$bootstrap_id" 'cloudflare-bootstrap'
          expect_inactive "$CLOUDFLARE_BOOTSTRAP_TOKEN" 'cloudflare-bootstrap'
          delete_token "$CLOUDFLARE_TOKEN_ISSUER_TOKEN" "$issuer_id" 'cloudflare-issuer'
          expect_inactive "$CLOUDFLARE_TOKEN_ISSUER_TOKEN" 'cloudflare-issuer'

          echo 'Cloudflare temporary bootstrap roots revoked and verified inactive.'

      - name: Prove steady-state GitHub admin can retire protected bindings
        shell: bash
        run: |
          set -euo pipefail
          github_api='https://api.github.com'

          delete_with_steady_admin() {
            local name="$1"
            local status
            status="$(curl --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer $GH_ADMIN_OPERATOR_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RUNNER_TEMP/github-delete-$name.txt" \
              --write-out '%{http_code}' \
              "$github_api/repos/$EXPECTED_REPOSITORY/environments/$EXPECTED_ENVIRONMENT/secrets/$name")"
            test "$status" = '204'
          }

          # Both provider credentials are already verified inactive. Removing their two bindings now
          # proves the steady-state GitHub administrator has Environment write authority before the
          # GitHub bootstrap credential itself is revoked.
          delete_with_steady_admin 'CLOUDFLARE_BOOTSTRAP_TOKEN'
          delete_with_steady_admin 'CLOUDFLARE_TOKEN_ISSUER_TOKEN'

          metadata="$RUNNER_TEMP/staging-secret-metadata-pre-github-revoke.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $GH_ADMIN_OPERATOR_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$github_api/repos/$EXPECTED_REPOSITORY/environments/$EXPECTED_ENVIRONMENT/secrets?per_page=100" \
            --output "$metadata"
          for retired in CLOUDFLARE_BOOTSTRAP_TOKEN CLOUDFLARE_TOKEN_ISSUER_TOKEN; do
            test "$(jq --arg name "$retired" '[.secrets[] | select(.name == $name)] | length' "$metadata")" = '0'
          done
          test "$(jq '[.secrets[] | select(.name == "GH_BOOTSTRAP_ADMIN_TOKEN")] | length' "$metadata")" = '1'

      - name: Revoke GitHub bootstrap credential before removing its binding
        shell: bash
        run: |
          set -euo pipefail
          github_api='https://api.github.com'
          revoke_payload="$RUNNER_TEMP/github-bootstrap-revoke.json"
          export REVOKE_PAYLOAD="$revoke_payload"

          # Build the request body from the protected environment, never from a command-line argument.
          python - <<'PY'
          import json
          import os

          credential = os.environ.get('GH_BOOTSTRAP_ADMIN_TOKEN', '')
          if len(credential) < 20:
              raise SystemExit('GH_BOOTSTRAP_ADMIN_TOKEN is unavailable')
          path = os.environ['REVOKE_PAYLOAD']
          with open(path, 'w', encoding='utf-8') as handle:
              json.dump({'credentials': [credential]}, handle, separators=(',', ':'))
          PY
          chmod 600 "$revoke_payload"

          revoke_status="$(curl --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --header 'Content-Type: application/json' \
            --data-binary "@$revoke_payload" \
            --output "$RUNNER_TEMP/github-bootstrap-revoke-response.txt" \
            --write-out '%{http_code}' \
            "$github_api/credentials/revoke")"
          rm -f "$revoke_payload"
          test "$revoke_status" = '202'

          revoked='false'
          for attempt in $(seq 1 20); do
            status="$(curl --silent --show-error \
              --header "Authorization: Bearer $GH_BOOTSTRAP_ADMIN_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              --output "$RUNNER_TEMP/github-bootstrap-post-revoke-$attempt.txt" \
              --write-out '%{http_code}' \
              "$github_api/repos/$EXPECTED_REPOSITORY/environments/$EXPECTED_ENVIRONMENT/secrets?per_page=1" || true)"
            if [ "$status" = '401' ] || [ "$status" = '403' ]; then
              revoked='true'
              break
            fi
            if [ "$status" = '429' ] || [[ "$status" =~ ^5[0-9][0-9]$ ]] || [ "$status" = '200' ]; then
              sleep 5
              continue
            fi
            echo "GitHub bootstrap post-revoke verification returned unexpected HTTP $status" >&2
            exit 1
          done
          test "$revoked" = 'true'
          echo 'GitHub bootstrap credential revocation accepted and verified inactive.'

      - name: Remove revoked GitHub bootstrap binding and verify steady-state metadata
        shell: bash
        run: |
          set -euo pipefail
          github_api='https://api.github.com'
          status="$(curl --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer $GH_ADMIN_OPERATOR_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            --output "$RUNNER_TEMP/github-delete-GH_BOOTSTRAP_ADMIN_TOKEN.txt" \
            --write-out '%{http_code}' \
            "$github_api/repos/$EXPECTED_REPOSITORY/environments/$EXPECTED_ENVIRONMENT/secrets/GH_BOOTSTRAP_ADMIN_TOKEN")"
          test "$status" = '204'

          secret_metadata="$RUNNER_TEMP/staging-secret-metadata-final.json"
          curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $GH_ADMIN_OPERATOR_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$github_api/repos/$EXPECTED_REPOSITORY/environments/$EXPECTED_ENVIRONMENT/secrets?per_page=100" \
            --output "$secret_metadata"

          for retired in GH_BOOTSTRAP_ADMIN_TOKEN CLOUDFLARE_BOOTSTRAP_TOKEN CLOUDFLARE_TOKEN_ISSUER_TOKEN; do
            test "$(jq --arg name "$retired" '[.secrets[] | select(.name == $name)] | length' "$secret_metadata")" = '0'
          done
          for steady in CLOUDFLARE_ACCESS_CLIENT_ID CLOUDFLARE_ACCESS_CLIENT_SECRET CLOUDFLARE_API_TOKEN CLOUDFLARE_CONTROL_PLANE_SECRETS_JSON CLOUDFLARE_DEPLOY_MANIFEST_JSON CLOUDFLARE_RESOLVER_SECRETS_JSON; do
            test "$(jq --arg name "$steady" '[.secrets[] | select(.name == $name)] | length' "$secret_metadata")" = '1'
          done
          echo 'All temporary staging bootstrap bindings removed; steady-state staging bindings preserved.'

      - name: Record metadata-only retirement result
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## AR-8C temporary bootstrap retirement

          - Result: **PASS**
          - Scope: **staging only**
          - Pre-retirement accepted main reconciliation: **verified green**
          - Cloudflare bootstrap credential: **revoked and verified inactive**
          - Cloudflare token-issuer credential: **revoked and verified inactive**
          - GitHub bootstrap administrator credential: **revocation accepted and verified inactive**
          - Three temporary staging bindings: **removed via steady-state GitHub administrator**
          - Six steady-state staging bindings: **preserved**
          - Production mutation: **none**
          - Secret values emitted: **none**
          - Next authority: **accepted-main steady-state read-only reconciliation**
          EOF
