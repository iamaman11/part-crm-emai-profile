name: Phase 2C Gate Wiring Materializer

on:
  pull_request:

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Wire Phase 2C into permanent gates
        run: |
          python - <<'PY'
          from pathlib import Path

          quality = Path('.github/workflows/quality-gate.yml')
          text = quality.read_text(encoding='utf-8')
          compile_marker = '          scripts/check-frontend-feature-boundaries.py\n          scripts/generate-frontend-contracts.py\n'
          compile_replacement = '          scripts/check-frontend-feature-boundaries.py\n          scripts/check-phase2c-client-boundaries.py\n          scripts/test-phase2c-client-merge-assignment.py\n          scripts/generate-frontend-contracts.py\n'
          assert text.count(compile_marker) == 1
          text = text.replace(compile_marker, compile_replacement, 1)
          step_marker = '''      - name: Format\n        run: cargo fmt --all -- --check\n'''
          step_replacement = '''      - name: Enforce Phase 2C client merge and assignment boundaries\n        run: python scripts/check-phase2c-client-boundaries.py\n\n      - name: Prove Phase 2C grant-transfer, resurrection and raw-mutation fixtures are rejected\n        run: python scripts/check-phase2c-client-boundaries.py --self-test\n\n      - name: Prove Phase 2C client merge and assignment D1 invariants\n        run: python scripts/test-phase2c-client-merge-assignment.py\n\n      - name: Format\n        run: cargo fmt --all -- --check\n'''
          assert text.count(step_marker) == 1
          quality.write_text(text.replace(step_marker, step_replacement, 1), encoding='utf-8')

          audit = Path('.github/workflows/repository-quality-audit-gate.yml')
          text = audit.read_text(encoding='utf-8')
          compile_marker = '          python -m py_compile scripts/check-phase2b-client-boundaries.py\n          python -m py_compile scripts/test-phase2b-client-contacts.py\n'
          compile_replacement = '          python -m py_compile scripts/check-phase2b-client-boundaries.py\n          python -m py_compile scripts/test-phase2b-client-contacts.py\n          python -m py_compile scripts/check-phase2c-client-boundaries.py\n          python -m py_compile scripts/test-phase2c-client-merge-assignment.py\n'
          assert text.count(compile_marker) == 1
          text = text.replace(compile_marker, compile_replacement, 1)
          step_marker = '''      - name: Prove Phase 2B protected client-contact D1 invariants\n        run: python scripts/test-phase2b-client-contacts.py\n'''
          step_replacement = '''      - name: Prove Phase 2B protected client-contact D1 invariants\n        run: python scripts/test-phase2b-client-contacts.py\n\n      - name: Enforce Phase 2C client merge and assignment boundaries\n        run: python scripts/check-phase2c-client-boundaries.py\n\n      - name: Prove Phase 2C grant-transfer, resurrection and raw-mutation fixtures are rejected\n        run: python scripts/check-phase2c-client-boundaries.py --self-test\n\n      - name: Prove Phase 2C client merge and assignment D1 invariants\n        run: python scripts/test-phase2c-client-merge-assignment.py\n'''
          assert text.count(step_marker) == 1
          audit.write_text(text.replace(step_marker, step_replacement, 1), encoding='utf-8')
          PY

      - name: Validate new permanent policy wiring
        run: |
          python -m py_compile scripts/check-phase2c-client-boundaries.py scripts/test-phase2c-client-merge-assignment.py
          python scripts/check-phase2c-client-boundaries.py
          python scripts/check-phase2c-client-boundaries.py --self-test
          python scripts/test-phase2c-client-merge-assignment.py
          grep -q 'check-phase2c-client-boundaries.py' .github/workflows/quality-gate.yml
          grep -q 'check-phase2c-client-boundaries.py' .github/workflows/repository-quality-audit-gate.yml

      - name: Commit permanent wiring and self-delete
        run: |
          rm .github/workflows/phase2c-gate-wiring.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Phase 2C: enforce permanent acceptance boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
