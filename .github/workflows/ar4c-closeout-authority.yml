name: AR-4C Closeout Authority Migration

on:
  push:
    branches:
      - agent/ar4c-authority-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar4c-authority-closeout
      - name: Apply accepted AR-4C authority migration
        run: |
          python scripts/_ar4c_closeout_once.py
          python scripts/_ar4c_closeout_marker_fix.py
      - name: Regenerate canonical architecture inventory
        run: python scripts/_ar4c_inventory_bootstrap.py
      - name: Verify authority and negative fixtures
        run: |
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
      - name: Commit verified closeout authority
        run: |
          git add README.md architecture/architecture-rebaseline-v3-transition.json architecture/inventory.json docs/ARCHITECTURE_REBASELINE_V3_AR4C.md docs/ARCHITECTURE_REBASELINE_V3_PLAN.md docs/DEVELOPMENT_PLAN.md docs/INDEX.md docs/README.md docs/status.json scripts/_ar3_application_architecture.py scripts/check-documentation-authority.py scripts/generate-architecture-inventory.py
          if git diff --cached --quiet; then
            echo "Authority already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AR-4C closeout: accept composition extraction and advance to AR-5"
          git push origin HEAD:agent/ar4c-authority-closeout
