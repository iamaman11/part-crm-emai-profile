name: AR-4C Closeout Authority Migration

on:
  push:
    branches:
      - agent/ar4c-authority-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar4c-authority-closeout
      - name: Run one-shot authority migration
        run: python scripts/_ar4c_closeout_once.py
      - name: Bootstrap regenerated canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-architecture-inventory.py')
          t = p.read_text(encoding='utf-8')
          old = '    validate_docs()\n    application_architecture = ar3.build_projection(ROOT)'
          new = '    # TEMP_AR4C_CLOSEOUT_BOOTSTRAP: full validation restored before commit.\n    application_architecture = ar3.build_projection(ROOT)'
          if t.count(old) != 1:
              raise SystemExit('expected exactly one canonical validate_docs bootstrap seam')
          p.write_text(t.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python scripts/generate-architecture-inventory.py --write
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate-architecture-inventory.py')
          t = p.read_text(encoding='utf-8')
          old = '    # TEMP_AR4C_CLOSEOUT_BOOTSTRAP: full validation restored before commit.\n    application_architecture = ar3.build_projection(ROOT)'
          new = '    validate_docs()\n    application_architecture = ar3.build_projection(ROOT)'
          if t.count(old) != 1:
              raise SystemExit('temporary inventory bootstrap seam was not present exactly once')
          p.write_text(t.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
      - name: Verify accepted AR-4C authority and negative fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
      - name: Commit closeout authority only
        shell: bash
        run: |
          set -euo pipefail
          git add README.md \
            architecture/architecture-rebaseline-v3-transition.json \
            architecture/inventory.json \
            docs/ARCHITECTURE_REBASELINE_V3_AR4C.md \
            docs/ARCHITECTURE_REBASELINE_V3_PLAN.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/INDEX.md \
            docs/README.md \
            docs/status.json \
            scripts/_ar3_application_architecture.py \
            scripts/check-documentation-authority.py \
            scripts/generate-architecture-inventory.py
          if git diff --cached --quiet; then
            echo 'Authority already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AR-4C closeout: accept composition extraction and advance to AR-5'
          git push origin HEAD:agent/ar4c-authority-closeout
