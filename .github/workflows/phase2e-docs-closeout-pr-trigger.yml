name: Phase 2E Docs Closeout PR Trigger

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2e-docs-closeout-pr-trigger.yml
      - .github/workflows/phase2e-docs-closeout-materializer.yml

permissions:
  contents: write

jobs:
  closeout:
    if: github.head_ref == 'docs-phase2e-closeout'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2e-closeout

      - name: Execute canonical closeout replacement script
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase2e-docs-closeout-materializer.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.find(marker)
          if start < 0:
              raise SystemExit('canonical closeout Python marker not found')
          start += len(marker)
          end_marker = "\n          PY\n\n      - name: Validate docs-only closeout shape"
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('canonical closeout Python end marker not found')
          lines = source[start:end].splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"
          exec(compile(script, 'phase2e-docs-closeout', 'exec'), {})
          PY

      - name: Validate closeout and final diff
        run: |
          grep -F 'Phase 2E — Mailbox domain decomposition and real cloud mailbox lane — ACCEPTED' docs/DEVELOPMENT_PLAN.md
          grep -F 'Phase 2F — Durable device jobs, browser mailbox lane and materialization integration — NEXT' docs/DEVELOPMENT_PLAN.md
          grep -F '0cefa67abe810db079102462f33ec28fcfc73f69' docs/DEVELOPMENT_PLAN.md
          grep -F '6c6ba4564de88b40d282081e701a2d24f1611cc2' docs/DEVELOPMENT_PLAN.md
          grep -F 'use-cases-mailboxes' docs/ARCHITECTURE.md
          grep -F 'Phase 2E accepts decomposed `mailbox-domain`' docs/DEVELOPER_CAPABILITY_MATRIX.md

      - name: Commit docs and self-clean temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-docs-closeout-materializer.yml
          git rm .github/workflows/phase2e-docs-closeout-pr-trigger.yml
          git add docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md docs/DEVELOPER_CAPABILITY_MATRIX.md
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/phase2e-docs-closeout-materializer.yml .github/workflows/phase2e-docs-closeout-pr-trigger.yml docs/ARCHITECTURE.md docs/DEVELOPER_CAPABILITY_MATRIX.md docs/DEVELOPMENT_PLAN.md "
          git commit -m "Docs: accept Phase 2E and mark Phase 2F next"
          git push origin HEAD:docs-phase2e-closeout
