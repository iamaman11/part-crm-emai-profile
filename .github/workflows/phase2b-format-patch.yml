name: Phase 2B Format Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2b-client-persistence-contact-crypto
          persist-credentials: true
      - name: Apply fixups
        shell: python
        run: |
          from pathlib import Path

          ports = Path('crates/application-ports/src/clients.rs')
          text = ports.read_text(encoding='utf-8')
          start = text.index("impl<'a> ContactExactLookupRequest<'a> {")
          end = text.index('pub enum ContactProtectionPortErrorClass', start)
          block = text[start:end]
          if 'pub const fn key_domain(&self) -> ContactLookupKeyDomain' not in block:
              pos = block.index('    #[must_use]\n    pub const fn tenant_id')
              block = block[:pos] + (
                  '    #[must_use]\n'
                  '    pub const fn key_domain(&self) -> ContactLookupKeyDomain {\n'
                  '        ContactLookupKeyDomain::TenantExactLookup\n'
                  '    }\n\n'
              ) + block[pos:]
          text = text[:start] + block + text[end:]
          text = text.replace(
              '#[allow(async_fn_in_trait)]\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct ArchiveContactWrite',
              '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct ArchiveContactWrite',
              1,
          )
          trait = 'pub trait ProtectedClientContactRepositoryPort {'
          if '#[allow(async_fn_in_trait)]\n' + trait not in text:
              text = text.replace(trait, '#[allow(async_fn_in_trait)]\n' + trait, 1)
          ports.write_text(text, encoding='utf-8')

          crypto = Path('crates/cloudflare-adapters/src/contact_protection.rs')
          text = crypto.read_text(encoding='utf-8')
          fn_start = text.index('    pub fn decrypt_contact_display(')
          repl_start = text.index('        let mut plaintext = cipher', fn_start)
          repl_end = text.index('        Ok(Zeroizing::new(decoded))', repl_start)
          desired = '''        let plaintext = cipher
              .decrypt(
                  XNonce::from_slice(&nonce_bytes),
                  Payload {
                      msg: encrypted.ciphertext(),
                      aad: &aad,
                  },
              )
              .map_err(|_| ContactCryptoError::AuthenticationFailed)?;
          let decoded = String::from_utf8(plaintext).map_err(|error| {
              let mut bytes = error.into_bytes();
              bytes.zeroize();
              ContactCryptoError::InvalidUtf8
          })?;
'''
          text = text[:repl_start] + desired + text[repl_end:]
          test_start = text.index('fn lookup_tokens_are_tenant_separated_and_rotation_candidates_are_versioned()')
          test_end = text.index('\n    #[test]\n    fn keyring_rejects_duplicate_versions', test_start)
          block = text[test_start:test_end]
          block = block.replace(
              '        let contact_id = ContactPointId::parse("contact_01JCRYPTOA")?;\n',
              '',
              1,
          )
          block = block.replace('            &contact_id,\n', '', 2)
          text = text[:test_start] + block + text[test_end:]
          crypto.write_text(text, encoding='utf-8')
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted fixups
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/application-ports/src/clients.rs crates/use-cases-clients/src/contacts.rs crates/cloudflare-adapters/src/contact_protection.rs crates/cloudflare-adapters/src/d1_client_persistence.rs
          git commit -m 'Phase 2B: format contact application and crypto layers'
          git push origin HEAD:phase2b-client-persistence-contact-crypto
