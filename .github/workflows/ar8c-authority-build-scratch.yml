name: AR8C Authority Build Scratch

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-authority:
    if: github.event.pull_request.head.ref == 'scratch/ar8c-authority-build'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: scratch/ar8c-authority-build
          fetch-depth: 0
          persist-credentials: true

      - name: Merge AR-8C lifecycle into the existing credential authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          authority_path = Path('architecture/credential-authority-ar8b.json')
          payload_path = Path('.scratch/ar8c-lifecycle.json')
          authority = json.loads(authority_path.read_text(encoding='utf-8'))
          payload = json.loads(payload_path.read_text(encoding='utf-8'))
          if 'ar8c_operational_lifecycle' in authority:
              raise SystemExit('AR-8C lifecycle already exists; scratch builder refuses overwrite')
          authority['ar8c_operational_lifecycle'] = payload
          authority_path.write_text(json.dumps(authority, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate lifecycle contract and negative matrix
        run: |
          node .github/scripts/credential-lifecycle.mjs contract
          node .github/scripts/credential-lifecycle.mjs self-test

      - name: Regenerate canonical architecture inventory
        run: |
          python scripts/generate-architecture-inventory.py --write
          python -m json.tool architecture/credential-authority-ar8b.json >/dev/null
          python -m json.tool architecture/inventory.json >/dev/null
          git diff --check

      - name: Commit only canonical authority and generated projection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/credential-authority-ar8b.json architecture/inventory.json
          changed="$(git diff --cached --name-only)"
          test "$changed" = $'architecture/credential-authority-ar8b.json\narchitecture/inventory.json'
          git commit -m 'chore: build AR-8C operational credential authority'
          git push origin HEAD:scratch/ar8c-authority-build
