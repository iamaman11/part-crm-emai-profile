name: Release Set Promotion

run-name: AR11 Release Set Promotion — ${{ github.event_name == 'workflow_run' && 'READ-ONLY PREFLIGHT' || github.event_name == 'workflow_dispatch' && 'MANUAL PROMOTION (AUTHORIZATION REQUIRED)' || 'INTERNAL ROLLBACK-NEGATIVE EVIDENCE' }}

on:
  workflow_run:
    workflows:
      - Release Set Build
    types:
      - completed
  workflow_dispatch:
  workflow_call:
    inputs:
      operation:
        description: Internal evidence operation
        required: true
        type: string
      release_set_id:
        description: Internal rollback-negative Release Set identity
        required: false
        type: string
      expected_current_release_set_id:
        description: Internal rollback-negative expected-current identity
        required: false
        type: string
      source_run_id:
        description: Internal completed canonical READY run id
        required: false
        type: string
      confirmation:
        description: Internal rollback-negative confirmation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-set-promotion-staging
  cancel-in-progress: false

jobs:
  route:
    name: Classify automatic READY vs zero-field mutation vs internal evidence
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      source_sha: ${{ steps.route.outputs.source_sha }}
    steps:
      - name: Bind invocation surface fail closed
        id: route
        env:
          INTERNAL_OPERATION: ${{ inputs.operation }}
          READY_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          READY_SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          READY_SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          READY_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            test "$READY_SOURCE_BRANCH" = main
            test "$READY_SOURCE_EVENT" = push
            test "$READY_SOURCE_CONCLUSION" = success
            [[ "$READY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo 'mode=preflight' >> "$GITHUB_OUTPUT"
            echo "source_sha=$READY_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
            test -z "$INTERNAL_OPERATION"
            echo 'mode=promote' >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            test "$INTERNAL_OPERATION" = rollback-negative
            test "$GITHUB_REF" = refs/heads/main
            echo 'mode=rollback-negative' >> "$GITHUB_OUTPUT"
            echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  resolve-preflight:
    name: Resolve exact accepted-main target before authorization
    needs: route
    if: needs.route.outputs.mode == 'preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
      release_set_id: ${{ steps.resolve.outputs.release_set_id }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
    steps:
      - name: Resolve unique immutable Release Set for exact protected main
        id: resolve
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          test "$(jq -r '.protected' "$RUNNER_TEMP/protected-main.json")" = true
          main_sha="$(jq -r '.commit.sha' "$RUNNER_TEMP/protected-main.json")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$main_sha"

          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s --arg sha "$main_sha" '
                add
                | [.[] | select(.target_commitish == $sha and (.tag_name | test("^release-set-v3-sha256-[0-9a-f]{64}$")))]
              ' > "$RUNNER_TEMP/main-release-sets.json"
          test "$(jq 'length' "$RUNNER_TEMP/main-release-sets.json")" = 1
          release_set_id="$(jq -er '.[0].tag_name' "$RUNNER_TEMP/main-release-sets.json")"
          [[ "$release_set_id" =~ ^release-set-v3-sha256-[0-9a-f]{64}$ ]]
          {
            echo "source_sha=$main_sha"
            echo "main_sha=$main_sha"
            echo "release_set_id=$release_set_id"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact accepted-main release policy
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.resolve.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable target before any provider credential
        env:
          RELEASE_SET_ID: ${{ steps.resolve.outputs.release_set_id }}
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/target-release-set"
          policy_dir="$RUNNER_TEMP/release-policy-input"
          mkdir -p "$asset_root" "$policy_dir"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize current-v3 "$RELEASE_SET_ID" "$asset_root" "$release_root"
          cp "$release_root/release-set.json" "$policy_dir/release-set.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/${{ steps.resolve.outputs.main_sha }}...${{ steps.resolve.outputs.main_sha }}" > "$RUNNER_TEMP/accepted-source-compare.json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-set-id "$RELEASE_SET_ID" \
            --source-sha "${{ steps.resolve.outputs.main_sha }}" \
            --branch-json "$RUNNER_TEMP/protected-main.json" \
            --compare-json "$RUNNER_TEMP/accepted-source-compare.json" \
            --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify \
            --release-set "$policy_dir/release-set.json" \
            --source-root . \
            --artifact-root "$release_root" \
            | tee "$RUNNER_TEMP/release-verify.json" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 3 and .source_accepted == true and .mutation_executed == false' >/dev/null

  preflight-ready:
    name: Observe provider and publish lossless read-only terminal outcome
    needs: [route, resolve-preflight]
    if: needs.route.outputs.mode == 'preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.resolve-preflight.outputs.source_sha }}
      RELEASE_SET_ID: ${{ needs.resolve-preflight.outputs.release_set_id }}
      TARGET_PROFILE: rehearsal-core-v2
      TARGET_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
    steps:
      - name: Require read-only observation authority only
        id: observation_authority
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"

      - name: Checkout exact accepted-main source
        id: source_checkout
        if: always()
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-preflight.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node runtime for read-only provider observation
        id: node_runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Materialize exact target and rendered staging overlay
        id: materialize
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/target-release-set"
          policy_dir="$RUNNER_TEMP/release-policy-input"
          mkdir -p "$asset_root" "$policy_dir"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize current-v3 "$RELEASE_SET_ID" "$asset_root" "$release_root"
          cp "$release_root/release-set.json" "$policy_dir/release-set.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          test "$(jq -r '.commit.sha' "$RUNNER_TEMP/protected-main.json")" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/compare/$SOURCE_SHA...$SOURCE_SHA" > "$RUNNER_TEMP/accepted-source-compare.json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" --release-set-id "$RELEASE_SET_ID" \
            --source-sha "$SOURCE_SHA" --branch-json "$RUNNER_TEMP/protected-main.json" \
            --compare-json "$RUNNER_TEMP/accepted-source-compare.json" \
            --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root . --artifact-root "$release_root" \
            | tee "$RUNNER_TEMP/release-verify.json" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 3 and .source_accepted == true and .mutation_executed == false' >/dev/null
          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$release_root/components/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          control_root="$(dirname "$manifest")"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py \
            --source-config "$control_root/deploy/cloudflare/wrangler.jsonc" \
            --release-root "$control_root" \
            --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" \
            --environment staging \
            --output "$RUNNER_TEMP/wrangler.staging.json"
          {
            echo "TARGET_RELEASE_ROOT=$release_root"
            echo "TARGET_RELEASE_MANIFEST=$policy_dir/release-set.json"
            echo "CONTROL_RELEASE_MANIFEST=$manifest"
            echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json"
            echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json"
          } >> "$GITHUB_ENV"

      - name: Observe existing Worker, D1 head, resources and secret bindings
        id: observe
        run: |
          set -euo pipefail
          account_id="$(jq -er '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          r2_bucket="$(jq -er '.control_plane.r2_bucket_name // .r2_bucket_name' "$DEPLOY_MANIFEST")"
          queue_name="$(jq -er '.control_plane.integration_events_queue // .integration_events_queue' "$DEPLOY_MANIFEST")"
          custom_domain="$(jq -er '.control_plane.custom_domain // .custom_domain' "$DEPLOY_MANIFEST")"
          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/deployments-before-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          test "$http_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result.deployments | type == "array") and (.result.deployments | length) > 0' "$RUNNER_TEMP/deployments-before-api.json" >/dev/null
          jq '.result.deployments[0]' "$RUNNER_TEMP/deployments-before-api.json" > "$RUNNER_TEMP/current-deployment.json"
          python scripts/deployment-identity-ar11.py --status "$RUNNER_TEMP/current-deployment.json" --output "$RUNNER_TEMP/current-identity.json"
          current_id="$(jq -er '.release_set_id | select(type == "string")' "$RUNNER_TEMP/current-identity.json")"
          current_profile="$(jq -er '.capability_profile_id | select(type == "string" and length > 0)' "$RUNNER_TEMP/current-identity.json")"
          [[ "$current_id" =~ ^release-set-v(2|3)-sha256-[0-9a-f]{64}$ ]]
          [[ "$current_profile" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$current_id" > "$RUNNER_TEMP/current-release-api.json"
          known_good_source="$(jq -er '.target_commitish' "$RUNNER_TEMP/current-release-api.json")"
          [[ "$known_good_source" =~ ^[0-9a-f]{40}$ ]]

          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/catalog-ledger-before.json"
          npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/r2-info.json"
          npx --yes wrangler@4.94.0 queues info "$queue_name" \
            --config "$WRANGLER_CONFIG" --env staging >/dev/null
          jq -n --arg name "$queue_name" '{name:$name}' > "$RUNNER_TEMP/queue-info.json"
          npx --yes wrangler@4.94.0 secret list --format json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/secret-list.json"

          python - "$RUNNER_TEMP/catalog-ledger-before.json" "$RUNNER_TEMP/d1-names-before.json" <<'PY'
          import json, re, sys
          source, output = sys.argv[1:]
          value = json.load(open(source, encoding='utf-8'))
          names = set()
          def walk(node):
              if isinstance(node, dict):
                  name = node.get('name')
                  if isinstance(name, str) and re.fullmatch(r'\d{4}_[A-Za-z0-9_]+\.sql', name):
                      names.add(name)
                  for item in node.values(): walk(item)
              elif isinstance(node, list):
                  for item in node: walk(item)
          walk(value)
          ordered = sorted(names, key=lambda item: (int(item[:4]), item))
          if not ordered:
              raise SystemExit('Catalog D1 ledger is empty or unreadable')
          json.dump(ordered, open(output, 'w', encoding='utf-8'), indent=2)
          open(output, 'a', encoding='utf-8').write('\n')
          PY
          d1_head="$(jq -er '.[-1]' "$RUNNER_TEMP/d1-names-before.json")"
          jq -S '{release_set_id,capability_profile_id}' "$RUNNER_TEMP/current-identity.json" > "$RUNNER_TEMP/worker-binding-before.json"
          {
            echo "current_id=$current_id"
            echo "current_profile=$current_profile"
            echo "known_good_source=$known_good_source"
            echo "d1_head=$d1_head"
            echo "custom_domain=$custom_domain"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact known-good source
        id: known_good_checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.observe.outputs.known_good_source }}
          path: known-good-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current immutable Release Set and build metadata snapshot
        id: snapshot
        run: |
          set -euo pipefail
          current_id="${{ steps.observe.outputs.current_id }}"
          known_good_source="${{ steps.observe.outputs.known_good_source }}"
          asset_root="$RUNNER_TEMP/known-good-assets"
          release_root="$RUNNER_TEMP/known-good-release-set"
          policy_dir="$RUNNER_TEMP/known-good-policy"
          mkdir -p "$asset_root" "$policy_dir"
          gh release download "$current_id" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize known-good-v2-v3 "$current_id" "$asset_root" "$release_root"
          cp "$release_root/release-set.json" "$policy_dir/release-set.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/kg-main.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$known_good_source...$SOURCE_SHA" > "$RUNNER_TEMP/kg-compare.json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" --release-set-id "$current_id" \
            --source-sha "$known_good_source" --branch-json "$RUNNER_TEMP/kg-main.json" \
            --compare-json "$RUNNER_TEMP/kg-compare.json" --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/known-good-source" --artifact-root "$release_root" \
            | jq -e '.decision == "VALID" and (.release_set_schema_version == 2 or .release_set_schema_version == 3) and .source_accepted == true and .mutation_executed == false' >/dev/null
          current_release_manifest="$policy_dir/release-set.json"
          echo "CURRENT_RELEASE_MANIFEST=$current_release_manifest" >> "$GITHUB_ENV"

          python scripts/deployment-snapshot-ar11.py \
            --environment staging --collected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --deployment-status "$RUNNER_TEMP/current-deployment.json" \
            --catalog-ledger "$RUNNER_TEMP/catalog-ledger-before.json" \
            --r2-list "$RUNNER_TEMP/r2-info.json" \
            --queue-list "$RUNNER_TEMP/queue-info.json" \
            --secret-list "$RUNNER_TEMP/secret-list.json" \
            --rendered-config "$WRANGLER_CONFIG" \
            --deploy-manifest "$DEPLOY_MANIFEST" \
            --current-release-set "$current_release_manifest" \
            --output "$RUNNER_TEMP/pre-snapshot.json"
          test "$(jq -r '.schema_version' "$RUNNER_TEMP/pre-snapshot.json")" = 2

      - name: Capture native compatibility, plan and rollback-aware preflight
        id: policy
        run: |
          set -uo pipefail
          exec 3>>"$GITHUB_OUTPUT"
          echo "read_only_ready=false" >&3
          echo "infra_boundary=" >&3
          echo "target_profile=" >&3
          echo "admission_mode=" >&3

          if ! cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . d1 compatibility --component catalog \
            --ledger-json "$RUNNER_TEMP/catalog-ledger-before.json" \
            --release-manifest "$CONTROL_RELEASE_MANIFEST" \
            > "$RUNNER_TEMP/catalog-d1-compatibility.json"; then
            echo "infra_boundary=D1_COMPATIBILITY" >&3
            exit 0
          fi
          if ! jq -e '.schema_version == 1 and .command == "d1 compatibility" and .component == "catalog" and .mode == "read-only" and .mutation_executed == false and (.allowed | type == "boolean") and (.reason_codes | type == "array")' "$RUNNER_TEMP/catalog-d1-compatibility.json" >/dev/null; then
            echo "infra_boundary=D1_COMPATIBILITY" >&3
            exit 0
          fi
          if ! jq -e '.allowed == true' "$RUNNER_TEMP/catalog-d1-compatibility.json" >/dev/null; then
            exit 0
          fi

          if ! python scripts/release-compat-evidence-ar11.py \
            --release-set-id "$RELEASE_SET_ID" \
            --catalog-d1 "$RUNNER_TEMP/catalog-d1-compatibility.json" \
            --output "$RUNNER_TEMP/compatibility-evidence.json"; then
            echo "infra_boundary=RELEASE_COMPATIBILITY_EVIDENCE" >&3
            exit 0
          fi

          if ! cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion plan --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root . --profile "$TARGET_PROFILE" --environment "$TARGET_ENVIRONMENT" \
            --snapshot "$RUNNER_TEMP/pre-snapshot.json" \
            --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" \
            --expected-current "${{ steps.observe.outputs.current_id }}" \
            --current-release-set "$CURRENT_RELEASE_MANIFEST" \
            > "$RUNNER_TEMP/promotion-plan.json"; then
            echo "infra_boundary=PROMOTION_PLAN" >&3
            exit 0
          fi
          if ! jq -e --arg requested "$TARGET_PROFILE" '.schema_version == 1 and .command == "promotion.plan" and (.decision == "PLAN" or .decision == "NO_CHANGE" or .decision == "BLOCKED") and .requested_target_capability_profile_id == $requested and (.target_capability_profile_id | type == "string" and length > 0) and (.admission_mode == "DIRECT" or .admission_mode == "PREREQUISITE_RELEASE_BRIDGE") and .execution_authorized == false and .mutation_executed == false and (.blockers | type == "array")' "$RUNNER_TEMP/promotion-plan.json" >/dev/null; then
            echo "infra_boundary=PROMOTION_PLAN" >&3
            exit 0
          fi
          target_profile="$(jq -er '.target_capability_profile_id' "$RUNNER_TEMP/promotion-plan.json")"
          admission_mode="$(jq -er '.admission_mode' "$RUNNER_TEMP/promotion-plan.json")"
          [[ "$target_profile" =~ ^[a-z0-9][a-z0-9-]*$ ]]
          echo "target_profile=$target_profile" >&3
          echo "admission_mode=$admission_mode" >&3

          if ! cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release compatibility --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root . --profile "$target_profile" --environment "$TARGET_ENVIRONMENT" \
            --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" \
            --current-release-set "$CURRENT_RELEASE_MANIFEST" \
            > "$RUNNER_TEMP/release-compatibility.json"; then
            echo "infra_boundary=RELEASE_COMPATIBILITY" >&3
            exit 0
          fi
          if ! jq -e '.schema_version == 2 and .command == "release.compatibility" and .mutation_executed == false and (.compatible | type == "boolean") and (.blockers | type == "array") and (.required_steps | type == "array")' "$RUNNER_TEMP/release-compatibility.json" >/dev/null; then
            echo "infra_boundary=RELEASE_COMPATIBILITY" >&3
            exit 0
          fi
          if ! jq -e '.compatible == true' "$RUNNER_TEMP/release-compatibility.json" >/dev/null; then
            exit 0
          fi
          if ! jq -e '.decision == "PLAN"' "$RUNNER_TEMP/promotion-plan.json" >/dev/null; then
            exit 0
          fi

          if ! cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion preflight --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root . --profile "$TARGET_PROFILE" --environment "$TARGET_ENVIRONMENT" \
            --snapshot "$RUNNER_TEMP/pre-snapshot.json" \
            --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" \
            --expected-current "${{ steps.observe.outputs.current_id }}" \
            --current-release-set "$CURRENT_RELEASE_MANIFEST" \
            --known-good-release-set "$CURRENT_RELEASE_MANIFEST" \
            > "$RUNNER_TEMP/promotion-preflight.json"; then
            echo "infra_boundary=PROMOTION_PREFLIGHT" >&3
            exit 0
          fi
          if ! jq -e --arg requested "$TARGET_PROFILE" --arg effective "$target_profile" --arg mode "$admission_mode" '.schema_version == 1 and .command == "promotion.preflight" and .requested_target_capability_profile_id == $requested and .target_capability_profile_id == $effective and .admission_mode == $mode and (.ready | type == "boolean") and (.decision == "READY" or .decision == "BLOCKED") and .credential_values_accessed == false and .provider_mutation_executed == false and .mutation_executed == false and (.blockers | type == "array") and (.required_steps | type == "array")' "$RUNNER_TEMP/promotion-preflight.json" >/dev/null; then
            echo "infra_boundary=PROMOTION_PREFLIGHT" >&3
            exit 0
          fi
          if ! jq -e '.ready == true and .decision == "READY"' "$RUNNER_TEMP/promotion-preflight.json" >/dev/null; then
            exit 0
          fi
          promotion_id="$(jq -er '.promotion_id' "$RUNNER_TEMP/promotion-preflight.json")"
          echo "promotion_id=$promotion_id" >&3
          echo "read_only_ready=true" >&3

      - name: Prove bounded Worker and D1 quiescence
        id: quiescence
        if: steps.policy.outputs.read_only_ready == 'true'
        run: |
          set -euo pipefail
          sleep 30
          account_id="$(jq -er '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/deployments-after-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          test "$http_code" = 200
          jq '.result.deployments[0]' "$RUNNER_TEMP/deployments-after-api.json" > "$RUNNER_TEMP/deployment-after.json"
          python scripts/deployment-identity-ar11.py --status "$RUNNER_TEMP/deployment-after.json" --output "$RUNNER_TEMP/identity-after.json"
          jq -S '{release_set_id,capability_profile_id}' "$RUNNER_TEMP/identity-after.json" > "$RUNNER_TEMP/worker-binding-after.json"
          cmp --silent "$RUNNER_TEMP/worker-binding-before.json" "$RUNNER_TEMP/worker-binding-after.json"
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/catalog-ledger-after.json"
          python - "$RUNNER_TEMP/catalog-ledger-after.json" "$RUNNER_TEMP/d1-names-after.json" <<'PY'
          import json, re, sys
          source, output = sys.argv[1:]
          value = json.load(open(source, encoding='utf-8'))
          names = set()
          def walk(node):
              if isinstance(node, dict):
                  name = node.get('name')
                  if isinstance(name, str) and re.fullmatch(r'\d{4}_[A-Za-z0-9_]+\.sql', name):
                      names.add(name)
                  for item in node.values(): walk(item)
              elif isinstance(node, list):
                  for item in node: walk(item)
          walk(value)
          ordered = sorted(names, key=lambda item: (int(item[:4]), item))
          json.dump(ordered, open(output, 'w', encoding='utf-8'), indent=2)
          open(output, 'a', encoding='utf-8').write('\n')
          PY
          cmp --silent "$RUNNER_TEMP/d1-names-before.json" "$RUNNER_TEMP/d1-names-after.json"

      - name: Materialize secret-free READY_TO_MUTATE evidence
        id: ready
        if: steps.policy.outputs.read_only_ready == 'true' && steps.quiescence.outcome == 'success'
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/release-policy-input/release-set.json" "$RUNNER_TEMP/release-set.json"
          cp "$RUNNER_TEMP/release-policy-input/accepted-source-evidence.json" "$RUNNER_TEMP/accepted-source-evidence.json"
          worker_identity_sha="$(sha256sum "$RUNNER_TEMP/worker-binding-after.json" | cut -d' ' -f1)"
          d1_ledger_sha="$(sha256sum "$RUNNER_TEMP/d1-names-after.json" | cut -d' ' -f1)"
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_set_id "$RELEASE_SET_ID" \
            --arg expected_current "${{ steps.observe.outputs.current_id }}" \
            --arg expected_current_profile "${{ steps.observe.outputs.current_profile }}" \
            --arg target_profile "${{ steps.policy.outputs.target_profile }}" \
            --arg admission_mode "${{ steps.policy.outputs.admission_mode }}" \
            --arg d1_head "${{ steps.observe.outputs.d1_head }}" \
            --arg worker_identity_sha256 "$worker_identity_sha" \
            --arg d1_ledger_sha256 "$d1_ledger_sha" \
            --arg promotion_id "${{ steps.policy.outputs.promotion_id }}" \
            --arg release_verify_sha256 "$(sha256sum "$RUNNER_TEMP/release-verify.json" | cut -d' ' -f1)" \
            --arg preflight_sha256 "$(sha256sum "$RUNNER_TEMP/promotion-preflight.json" | cut -d' ' -f1)" \
            --arg plan_sha256 "$(sha256sum "$RUNNER_TEMP/promotion-plan.json" | cut -d' ' -f1)" \
            '{schema_version:1,kind:"AR11_READY_TO_MUTATE",ready:true,environment:"staging",source_sha:$source_sha,release_set_id:$release_set_id,expected_current_release_set_id:$expected_current,expected_current_capability_profile_id:$expected_current_profile,target_capability_profile_id:$target_profile,admission_mode:$admission_mode,worker_exists:true,worker_identity_sha256:$worker_identity_sha256,d1_head:$d1_head,d1_ledger_sha256:$d1_ledger_sha256,secret_bindings_verified:true,quiescence:{seconds:30,worker_identity_stable:true,d1_ledger_stable:true},promotion_id:$promotion_id,release_verify_sha256:$release_verify_sha256,promotion_preflight_sha256:$preflight_sha256,promotion_plan_sha256:$plan_sha256,credential_values_accessed:false,provider_mutation:false,production_mutation:false}' \
            > "$RUNNER_TEMP/ready-to-mutate.json"
          jq -e --arg source "$SOURCE_SHA" --arg target "$RELEASE_SET_ID" --arg current "${{ steps.observe.outputs.current_id }}" --arg current_profile "${{ steps.observe.outputs.current_profile }}" --arg target_profile "${{ steps.policy.outputs.target_profile }}" --arg admission_mode "${{ steps.policy.outputs.admission_mode }}" '.kind == "AR11_READY_TO_MUTATE" and .ready == true and .source_sha == $source and .release_set_id == $target and .expected_current_release_set_id == $current and .expected_current_capability_profile_id == $current_profile and .target_capability_profile_id == $target_profile and .admission_mode == $admission_mode and .worker_exists == true and .secret_bindings_verified == true and .quiescence.worker_identity_stable == true and .quiescence.d1_ledger_stable == true and .credential_values_accessed == false and .provider_mutation == false and .production_mutation == false' "$RUNNER_TEMP/ready-to-mutate.json" >/dev/null
          ready_sha="$(sha256sum "$RUNNER_TEMP/ready-to-mutate.json" | cut -d' ' -f1)"
          artifact_name="ar11-ready-to-mutate-$RELEASE_SET_ID-$SOURCE_SHA"
          echo "READY_TO_MUTATE evidence sha256=$ready_sha"
          echo "ready_sha256=$ready_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload metadata-only READY_TO_MUTATE authority
        id: ready_upload
        if: steps.ready.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.ready.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/ready-to-mutate.json
            ${{ runner.temp }}/release-set.json
            ${{ runner.temp }}/accepted-source-evidence.json
            ${{ runner.temp }}/release-verify.json
            ${{ runner.temp }}/release-compatibility.json
            ${{ runner.temp }}/compatibility-evidence.json
            ${{ runner.temp }}/promotion-plan.json
            ${{ runner.temp }}/promotion-preflight.json
            ${{ runner.temp }}/pre-snapshot.json
            ${{ runner.temp }}/worker-binding-before.json
            ${{ runner.temp }}/worker-binding-after.json
            ${{ runner.temp }}/d1-names-before.json
            ${{ runner.temp }}/d1-names-after.json
          if-no-files-found: error
          retention-days: 30

      - name: Terminalize one lossless AR11 OperationalOutcome
        id: outcome
        if: always()
        run: |
          set -euo pipefail
          failed_boundary=""
          if [ "${{ steps.observation_authority.outcome }}" = "failure" ]; then
            failed_boundary="OBSERVATION_AUTHORITY"
          elif [ "${{ steps.source_checkout.outcome }}" = "failure" ]; then
            failed_boundary="SOURCE_CHECKOUT"
          elif [ "${{ steps.node_runtime.outcome }}" = "failure" ]; then
            failed_boundary="NODE_RUNTIME_SETUP"
          elif [ "${{ steps.materialize.outcome }}" = "failure" ]; then
            failed_boundary="TARGET_MATERIALIZATION"
          elif [ "${{ steps.observe.outcome }}" = "failure" ]; then
            failed_boundary="PROVIDER_OBSERVATION"
          elif [ "${{ steps.known_good_checkout.outcome }}" = "failure" ]; then
            failed_boundary="KNOWN_GOOD_SOURCE"
          elif [ "${{ steps.snapshot.outcome }}" = "failure" ]; then
            failed_boundary="DEPLOYMENT_SNAPSHOT"
          elif [ -n "${{ steps.policy.outputs.infra_boundary }}" ]; then
            failed_boundary="${{ steps.policy.outputs.infra_boundary }}"
          elif [ "${{ steps.quiescence.outcome }}" = "failure" ]; then
            failed_boundary="QUIESCENCE"
          elif [ "${{ steps.ready.outcome }}" = "failure" ]; then
            failed_boundary="READ_ONLY_READY_EVIDENCE"
          elif [ "${{ steps.ready_upload.outcome }}" = "failure" ]; then
            failed_boundary="READY_EVIDENCE_PUBLICATION"
          fi

          effective_target_profile="${{ steps.policy.outputs.target_profile }}"
          test -n "$effective_target_profile" || effective_target_profile="$TARGET_PROFILE"
          tree_sha="$(git rev-parse "$SOURCE_SHA^{tree}")"
          evidence_artifact="ar11-operational-outcome-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/promotion-operational-outcome-ar11.py \
            --source-sha "$SOURCE_SHA" \
            --tree-sha "$tree_sha" \
            --release-set-id "$RELEASE_SET_ID" \
            --environment "$TARGET_ENVIRONMENT" \
            --profile-id "$effective_target_profile" \
            --d1-compatibility-json "$RUNNER_TEMP/catalog-d1-compatibility.json" \
            --release-compatibility-json "$RUNNER_TEMP/release-compatibility.json" \
            --promotion-plan-json "$RUNNER_TEMP/promotion-plan.json" \
            --promotion-preflight-json "$RUNNER_TEMP/promotion-preflight.json" \
            --ready-to-mutate-json "$RUNNER_TEMP/ready-to-mutate.json" \
            --failed-boundary "$failed_boundary" \
            --evidence-artifact "$evidence_artifact" \
            --output "$RUNNER_TEMP/promotion-operational-outcome.json"
          terminal_dir="$RUNNER_TEMP/ar11-terminal-evidence"
          mkdir -p "$terminal_dir"
          cp "$RUNNER_TEMP/promotion-operational-outcome.json" "$terminal_dir/"
          for candidate in \
            catalog-d1-compatibility.json \
            compatibility-evidence.json \
            release-compatibility.json \
            promotion-plan.json \
            promotion-preflight.json \
            ready-to-mutate.json \
            release-verify.json \
            pre-snapshot.json; do
            if [ -f "$RUNNER_TEMP/$candidate" ]; then
              cp "$RUNNER_TEMP/$candidate" "$terminal_dir/$candidate"
            fi
          done
          status="$(jq -er '.status' "$RUNNER_TEMP/promotion-operational-outcome.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '## AR11 OperationalOutcome'
            echo
            echo '```json'
            jq '{contract,procedure,status,phase,failed_gate,owner,owner_contract,owner_reason_code,summary,remediation,exact_next_action,source_sha,tree_sha,release_set_id,promotion_id,target_identity,authorization_state,provider_mutation_started,provider_mutation_executed,production_mutation_executed,effect_state,evidence_refs,evidence_digests}' "$RUNNER_TEMP/promotion-operational-outcome.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terminal AR11 OperationalOutcome evidence
        id: outcome_upload
        if: always() && steps.outcome.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-operational-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ar11-terminal-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal AR11 disposition after evidence publication
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.outcome.outcome }}" = "success"
          test "${{ steps.outcome_upload.outcome }}" = "success"
          jq -e '.contract == "PROMOTION_OPERATOR_OUTCOME_V1" and (.status == "READ_ONLY_READY" or .status == "NOOP" or .status == "BLOCKED") and .authorization_state == "NOT_AUTHORIZED_READ_ONLY" and .provider_mutation_started == false and .provider_mutation_executed == false and .production_mutation_executed == false and .effect_state == "EXACT_NO_EFFECT"' "$RUNNER_TEMP/promotion-operational-outcome.json" >/dev/null

      - name: Remove raw provider material
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy-manifest.json" "$RUNNER_TEMP/wrangler.staging.json" "$RUNNER_TEMP/target-assets" "$RUNNER_TEMP/target-release-set" "$RUNNER_TEMP/known-good-assets" "$RUNNER_TEMP/known-good-release-set" "$RUNNER_TEMP/secret-list.json"

  resolve-verify:
    name: Bind one-shot authorization to exact prior READY_TO_MUTATE evidence
    needs: route
    if: needs.route.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      source_sha: ${{ steps.intent.outputs.main_sha }}
      main_sha: ${{ steps.intent.outputs.main_sha }}
      release_set_id: ${{ steps.intent.outputs.release_set_id }}
      expected_current: ${{ steps.intent.outputs.expected_current }}
      authorization_comment_id: ${{ steps.intent.outputs.authorization_comment_id }}
      authorization_digest: ${{ steps.intent.outputs.authorization_digest }}
      ready_run_id: ${{ steps.intent.outputs.ready_run_id }}
      ready_artifact_name: ${{ steps.intent.outputs.ready_artifact_name }}
      ready_evidence_sha256: ${{ steps.intent.outputs.ready_evidence_sha256 }}
      promotion_id: ${{ steps.ready.outputs.promotion_id }}
      target_profile: ${{ steps.ready.outputs.target_profile }}
      expected_current_profile: ${{ steps.ready.outputs.expected_current_profile }}
      phase_state_b64: ${{ steps.resolve_state.outputs.phase_state_b64 }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve exact one-shot authorization only after READY exists
        id: intent
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          test "$(jq -r '.protected' "$RUNNER_TEMP/protected-main.json")" = true
          main_sha="$(jq -r '.commit.sha' "$RUNNER_TEMP/protected-main.json")"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$main_sha"
          gh api "repos/$GITHUB_REPOSITORY/issues/266" > "$RUNNER_TEMP/live-pointer.json"
          python - "$RUNNER_TEMP/live-pointer.json" "$main_sha" "$RUNNER_TEMP/authorized-intent.json" <<'PY'
          import json, re, sys
          pointer_path, main_sha, output_path = sys.argv[1:]
          issue = json.load(open(pointer_path, encoding='utf-8'))
          body = issue.get('body')
          if not isinstance(body, str): raise SystemExit('live pointer body is missing')
          def parse(block):
              fields = {}
              for raw in block.splitlines():
                  match = re.fullmatch(r'\s*([A-Z0-9_]+)\s*=\s*(.*?)\s*', raw)
                  if match:
                      key, value = match.groups()
                      if key in fields: raise SystemExit(f'duplicate field: {key}')
                      fields[key] = value
              return fields
          parsed = [parse(block) for block in re.findall(r'```(?:text)?\s*\n(.*?)```', body, flags=re.S)]
          current = [item for item in parsed if item.get('CURRENT_STAGE')]
          if len(current) != 1: raise SystemExit('CURRENT block missing or ambiguous')
          current = current[0]
          required_current = {'CURRENT_STAGE':'V2','CURRENT_STAGE_ISSUE':'#584','PROTECTED_MAIN':main_sha,'OPEN_IMPLEMENTATION_PR':'NONE'}
          for key, expected in required_current.items():
              if current.get(key) != expected: raise SystemExit(f'live pointer mismatch for {key}: {current.get(key)!r}')
          scoped = [item for item in parsed if re.fullmatch(r'V2_STAGING_WORKER_PROMOTION_V[1-9][0-9]*', item.get('SCOPED_EXCEPTION',''))]
          if len(scoped) != 1: raise SystemExit('active staging promotion exception missing or ambiguous')
          scoped = scoped[0]
          required = {'STATE':'ACTIVE_UNTIL_ONE_MATCHING_ATTEMPT_OR_DRIFT','ENVIRONMENT':'staging','OWNER':'.github/workflows/release-set-promotion.yml','OPERATION':'promote','PROTECTED_MAIN':main_sha,'D1_PHASE_D_0032':'EXCLUDED','ACCESS_MTLS':'EXCLUDED','OTHER_PROVIDER_MUTATION':'EXCLUDED','PRODUCTION':'EXCLUDED'}
          for key, expected in required.items():
              if scoped.get(key) != expected: raise SystemExit(f'scoped authorization mismatch for {key}: {scoped.get(key)!r}')
          target = scoped.get('TARGET_RELEASE_SET','')
          expected_current = scoped.get('EXPECTED_CURRENT_RELEASE_SET','')
          ready_run_id = scoped.get('READY_RUN_ID','')
          ready_artifact_name = scoped.get('READY_ARTIFACT_NAME','')
          ready_evidence_sha256 = scoped.get('READY_EVIDENCE_SHA256','')
          if not re.fullmatch(r'release-set-v3-sha256-[0-9a-f]{64}', target): raise SystemExit('target invalid')
          if not re.fullmatch(r'release-set-v(?:2|3)-sha256-[0-9a-f]{64}', expected_current): raise SystemExit('expected-current invalid')
          if not re.fullmatch(r'[1-9][0-9]*', ready_run_id): raise SystemExit('READY run id invalid')
          expected_artifact = f'ar11-ready-to-mutate-{target}-{main_sha}'
          if ready_artifact_name != expected_artifact: raise SystemExit('READY artifact identity mismatch')
          if not re.fullmatch(r'[0-9a-f]{64}', ready_evidence_sha256): raise SystemExit('READY evidence digest invalid')
          match = re.fullmatch(r'#584\s*/\s*([1-9][0-9]*)', scoped.get('AUTHORITY_COMMENT',''))
          if not match: raise SystemExit('authority comment locator invalid')
          document = {'schema_version':2,'kind':'WORKER_PROMOTION_AUTHORIZED_INTENT','exception':scoped['SCOPED_EXCEPTION'],'environment':'staging','owner':'.github/workflows/release-set-promotion.yml','operation':'promote','protected_main':main_sha,'release_set_id':target,'expected_current_release_set_id':expected_current,'ready_run_id':int(ready_run_id),'ready_artifact_name':ready_artifact_name,'ready_evidence_sha256':ready_evidence_sha256,'authorization_issue':584,'authorization_comment_id':int(match.group(1)),'excluded_effects':['D1_PHASE_D_0032','ACCESS_MTLS','OTHER_PROVIDER_MUTATION','PRODUCTION']}
          json.dump(document, open(output_path,'w',encoding='utf-8'), sort_keys=True, indent=2); open(output_path,'a',encoding='utf-8').write('\n')
          PY
          release_set_id="$(jq -er '.release_set_id' "$RUNNER_TEMP/authorized-intent.json")"
          expected_current="$(jq -er '.expected_current_release_set_id' "$RUNNER_TEMP/authorized-intent.json")"
          ready_run_id="$(jq -er '.ready_run_id | tostring' "$RUNNER_TEMP/authorized-intent.json")"
          ready_artifact_name="$(jq -er '.ready_artifact_name' "$RUNNER_TEMP/authorized-intent.json")"
          ready_evidence_sha256="$(jq -er '.ready_evidence_sha256' "$RUNNER_TEMP/authorized-intent.json")"
          authorization_comment_id="$(jq -er '.authorization_comment_id | tostring' "$RUNNER_TEMP/authorized-intent.json")"
          authorization_digest="$(jq -cS . "$RUNNER_TEMP/authorized-intent.json" | sha256sum | cut -d' ' -f1)"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$authorization_comment_id" > "$RUNNER_TEMP/authority-comment.json"
          RELEASE_SET_ID="$release_set_id" EXPECTED_CURRENT="$expected_current" READY_RUN_ID="$ready_run_id" READY_ARTIFACT_NAME="$ready_artifact_name" READY_EVIDENCE_SHA256="$ready_evidence_sha256" \
          python - "$RUNNER_TEMP/authority-comment.json" "$GITHUB_REPOSITORY_OWNER" <<'PY'
          import json, os, re, sys
          comment = json.load(open(sys.argv[1], encoding='utf-8'))
          if (comment.get('user') or {}).get('login') != sys.argv[2]: raise SystemExit('authorization is not OWNER-authored')
          if not str(comment.get('issue_url','')).endswith('/issues/584'): raise SystemExit('authorization not bound to #584')
          blocks = re.findall(r'```(?:text)?\s*\n(.*?)```', comment.get('body') or '', flags=re.S)
          matches=[]
          for block in blocks:
              lines=[line.strip() for line in block.splitlines() if line.strip()]
              if not lines or lines[0] != 'WORKER_PROMOTION_AUTHORIZATION_V2': continue
              fields={}
              for line in lines[1:]:
                  m=re.fullmatch(r'([A-Z0-9_]+)\s*=\s*(.*?)\s*', line)
                  if m: fields[m.group(1)]=m.group(2)
              matches.append(fields)
          if len(matches) != 1: raise SystemExit('OWNER authorization V2 missing or ambiguous')
          fields=matches[0]
          required={'ENVIRONMENT':'staging','OWNER':'.github/workflows/release-set-promotion.yml','OPERATION':'promote','RELEASE_SET_ID':os.environ['RELEASE_SET_ID'],'EXPECTED_CURRENT_RELEASE_SET_ID':os.environ['EXPECTED_CURRENT'],'READY_RUN_ID':os.environ['READY_RUN_ID'],'READY_ARTIFACT_NAME':os.environ['READY_ARTIFACT_NAME'],'READY_EVIDENCE_SHA256':os.environ['READY_EVIDENCE_SHA256'],'CONFIRMATION':f"{os.environ['RELEASE_SET_ID']}:{os.environ['EXPECTED_CURRENT']}:{os.environ['READY_EVIDENCE_SHA256']}",'SCOPE':'one exact staging Worker/runtime promotion only','D1_PHASE_D_0032_AUTHORIZED':'NO','ACCESS_MTLS_MUTATION_AUTHORIZED':'NO','OTHER_PROVIDER_MUTATION_AUTHORIZED':'NO','PRODUCTION_AUTHORIZED':'NO'}
          for key, expected in required.items():
              if fields.get(key) != expected: raise SystemExit(f'OWNER authorization mismatch for {key}: {fields.get(key)!r}')
          PY
          {
            echo "main_sha=$main_sha"
            echo "release_set_id=$release_set_id"
            echo "expected_current=$expected_current"
            echo "ready_run_id=$ready_run_id"
            echo "ready_artifact_name=$ready_artifact_name"
            echo "ready_evidence_sha256=$ready_evidence_sha256"
            echo "authorization_comment_id=$authorization_comment_id"
            echo "authorization_digest=$authorization_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify exact prior READY_TO_MUTATE authority
        id: ready
        env:
          READY_RUN_ID: ${{ steps.intent.outputs.ready_run_id }}
          READY_ARTIFACT_NAME: ${{ steps.intent.outputs.ready_artifact_name }}
          READY_EVIDENCE_SHA256: ${{ steps.intent.outputs.ready_evidence_sha256 }}
          RELEASE_SET_ID: ${{ steps.intent.outputs.release_set_id }}
          EXPECTED_CURRENT: ${{ steps.intent.outputs.expected_current }}
          MAIN_SHA: ${{ steps.intent.outputs.main_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$READY_RUN_ID" > "$RUNNER_TEMP/ready-run.json"
          jq -e --arg sha "$MAIN_SHA" '.event == "workflow_run" and .status == "completed" and .conclusion == "success" and .head_branch == "main" and .head_sha == $sha and .path == ".github/workflows/release-set-promotion.yml"' "$RUNNER_TEMP/ready-run.json" >/dev/null
          ready_root="$RUNNER_TEMP/ready"
          mkdir -p "$ready_root"
          gh run download "$READY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$READY_ARTIFACT_NAME" --dir "$ready_root"
          for name in ready-to-mutate.json release-set.json accepted-source-evidence.json release-verify.json compatibility-evidence.json promotion-plan.json promotion-preflight.json pre-snapshot.json d1-names-after.json; do test -f "$ready_root/$name"; done
          test "$(sha256sum "$ready_root/ready-to-mutate.json" | cut -d' ' -f1)" = "$READY_EVIDENCE_SHA256"
          jq -e --arg source "$MAIN_SHA" --arg target "$RELEASE_SET_ID" --arg current "$EXPECTED_CURRENT" '.schema_version == 1 and .kind == "AR11_READY_TO_MUTATE" and .ready == true and .source_sha == $source and .release_set_id == $target and .expected_current_release_set_id == $current and (.expected_current_capability_profile_id | type == "string" and length > 0) and (.target_capability_profile_id | type == "string" and length > 0) and (.admission_mode == "DIRECT" or .admission_mode == "PREREQUISITE_RELEASE_BRIDGE") and .worker_exists == true and .secret_bindings_verified == true and .quiescence.worker_identity_stable == true and .quiescence.d1_ledger_stable == true and .credential_values_accessed == false and .provider_mutation == false and .production_mutation == false' "$ready_root/ready-to-mutate.json" >/dev/null
          promotion_id="$(jq -er '.promotion_id' "$ready_root/ready-to-mutate.json")"
          target_profile="$(jq -er '.target_capability_profile_id' "$ready_root/ready-to-mutate.json")"
          expected_current_profile="$(jq -er '.expected_current_capability_profile_id' "$ready_root/ready-to-mutate.json")"
          {
            echo "promotion_id=$promotion_id"
            echo "target_profile=$target_profile"
            echo "expected_current_profile=$expected_current_profile"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact current protected-main source
        id: source_checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.intent.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Re-verify immutable target without provider credentials
        id: target_verify
        env:
          RELEASE_SET_ID: ${{ steps.intent.outputs.release_set_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_SET_ID" > "$RUNNER_TEMP/target-release.json"
          test "$(jq -r '.target_commitish' "$RUNNER_TEMP/target-release.json")" = "${{ steps.intent.outputs.main_sha }}"
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/target-release-set"
          mkdir -p "$asset_root"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize current-v3 "$RELEASE_SET_ID" "$asset_root" "$release_root"
          cmp --silent "$release_root/release-set.json" "$RUNNER_TEMP/ready/release-set.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$RUNNER_TEMP/ready/release-set.json" \
            --source-root . --artifact-root "$release_root" \
            > "$RUNNER_TEMP/manual-release-verify.json"
          jq -e '.decision == "VALID" and .release_set_schema_version == 3 and .source_accepted == true and .mutation_executed == false' "$RUNNER_TEMP/manual-release-verify.json" >/dev/null

      - name: Capture manual resolve phase state
        id: resolve_state
        if: always()
        run: |
          set -euo pipefail
          source_sha="${{ steps.intent.outputs.main_sha }}"
          test -n "$source_sha" || source_sha="${{ needs.route.outputs.source_sha }}"
          release_set_id="${{ steps.intent.outputs.release_set_id }}"
          promotion_id="${{ steps.ready.outputs.promotion_id }}"
          target_profile="${{ steps.ready.outputs.target_profile }}"
          failed_boundary=""
          if [ "${{ steps.intent.outcome }}" = "failure" ]; then failed_boundary="AUTHORIZATION_BINDING"
          elif [ "${{ steps.ready.outcome }}" = "failure" ]; then failed_boundary="READY_BINDING"
          elif [ "${{ steps.source_checkout.outcome }}" = "failure" ]; then failed_boundary="SOURCE_CHECKOUT"
          elif [ "${{ steps.target_verify.outcome }}" = "failure" ]; then failed_boundary="TARGET_RELEASE_VERIFY"
          fi
          authorization_bound=false
          if [ "${{ steps.intent.outcome }}" = "success" ] && [ "${{ steps.ready.outcome }}" = "success" ]; then authorization_bound=true; fi
          jq -n \
            --arg source_sha "$source_sha" --arg release_set_id "$release_set_id" --arg promotion_id "$promotion_id" --arg target_profile "$target_profile" \
            --arg failed_boundary "$failed_boundary" --argjson authorization_bound "$authorization_bound" \
            --arg intent "${{ steps.intent.outcome }}" --arg ready "${{ steps.ready.outcome }}" \
            --arg source_checkout "${{ steps.source_checkout.outcome }}" --arg target_verify "${{ steps.target_verify.outcome }}" \
            '{schema_version:1,kind:"AR11_MANUAL_PHASE_STATE",phase:"RESOLVE_VERIFY",source_sha:$source_sha,release_set_id:(if $release_set_id=="" then null else $release_set_id end),promotion_id:(if $promotion_id=="" then null else $promotion_id end),target_capability_profile_id:(if $target_profile=="" then null else $target_profile end),authorization_bound:$authorization_bound,provider_mutation_started:false,provider_mutation_executed:false,production_mutation_executed:false,failed_boundary:(if $failed_boundary=="" then null else $failed_boundary end),step_outcomes:{intent:$intent,ready:$ready,source_checkout:$source_checkout,target_verify:$target_verify}}' \
            > "$RUNNER_TEMP/manual-resolve-state.json"
          if [ -f "$RUNNER_TEMP/authorized-intent.json" ]; then
            jq -S . "$RUNNER_TEMP/authorized-intent.json" | sha256sum | cut -d' ' -f1 > "$RUNNER_TEMP/authorization-intent.sha256"
          fi
          phase_state_b64="$(base64 -w0 "$RUNNER_TEMP/manual-resolve-state.json")"
          echo "phase_state_b64=$phase_state_b64" >> "$GITHUB_OUTPUT"

  mutate:
    name: Execute exact same bits after READY plus authorization
    needs: [route, resolve-verify]
    if: needs.route.outputs.mode == 'promote' && needs.resolve-verify.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      actions: read
      contents: read
      deployments: write
    outputs:
      phase_state_b64: ${{ steps.mutation_state.outputs.phase_state_b64 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ needs.resolve-verify.outputs.release_set_id }}
      EXPECTED_CURRENT: ${{ needs.resolve-verify.outputs.expected_current }}
      TARGET_PROFILE: ${{ needs.resolve-verify.outputs.target_profile }}
      EXPECTED_CURRENT_PROFILE: ${{ needs.resolve-verify.outputs.expected_current_profile }}
      READY_RUN_ID: ${{ needs.resolve-verify.outputs.ready_run_id }}
      READY_ARTIFACT_NAME: ${{ needs.resolve-verify.outputs.ready_artifact_name }}
      READY_EVIDENCE_SHA256: ${{ needs.resolve-verify.outputs.ready_evidence_sha256 }}
      AUTHORIZATION_COMMENT_ID: ${{ needs.resolve-verify.outputs.authorization_comment_id }}
      AUTHORIZATION_DIGEST: ${{ needs.resolve-verify.outputs.authorization_digest }}
    steps:
      - name: Checkout exact authorized source
        id: authorized_checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and bind prior READY evidence before provider credentials
        id: ready_bind
        run: |
          set -euo pipefail
          ready_root="$RUNNER_TEMP/ready"
          mkdir -p "$ready_root"
          gh run download "$READY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$READY_ARTIFACT_NAME" --dir "$ready_root"
          test "$(sha256sum "$ready_root/ready-to-mutate.json" | cut -d' ' -f1)" = "$READY_EVIDENCE_SHA256"
          test "$(jq -r '.release_set_id' "$ready_root/ready-to-mutate.json")" = "$RELEASE_SET_ID"
          test "$(jq -r '.expected_current_release_set_id' "$ready_root/ready-to-mutate.json")" = "$EXPECTED_CURRENT"
          test "$(jq -r '.target_capability_profile_id' "$ready_root/ready-to-mutate.json")" = "$TARGET_PROFILE"
          test "$(jq -r '.expected_current_capability_profile_id' "$ready_root/ready-to-mutate.json")" = "$EXPECTED_CURRENT_PROFILE"
          test "$(jq -r '.source_sha' "$ready_root/ready-to-mutate.json")" = "${{ needs.resolve-verify.outputs.main_sha }}"
          test "$(jq -r '.ready' "$ready_root/ready-to-mutate.json")" = true
          test "$(jq -r '.provider_mutation' "$ready_root/ready-to-mutate.json")" = false
          jq -n \
            --arg authorization_digest "$AUTHORIZATION_DIGEST" \
            --arg ready_evidence_sha256 "$READY_EVIDENCE_SHA256" \
            --arg release_set_id "$RELEASE_SET_ID" \
            --arg expected_current "$EXPECTED_CURRENT" \
            --arg target_profile "$TARGET_PROFILE" \
            --arg expected_current_profile "$EXPECTED_CURRENT_PROFILE" \
            --arg source_sha "${{ needs.resolve-verify.outputs.main_sha }}" \
            '{schema_version:1,kind:"AR11_MUTATION_FENCE",authorization_digest:$authorization_digest,ready_evidence_sha256:$ready_evidence_sha256,release_set_id:$release_set_id,expected_current_release_set_id:$expected_current,target_capability_profile_id:$target_profile,expected_current_capability_profile_id:$expected_current_profile,source_sha:$source_sha}' \
            > "$RUNNER_TEMP/mutation-fence.json"

      - name: Re-verify exact immutable Release Set before credentials
        id: target_verify
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/mutation-release-set"
          mkdir -p "$asset_root"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize current-v3 "$RELEASE_SET_ID" "$asset_root" "$release_root"
          cmp --silent "$release_root/release-set.json" "$RUNNER_TEMP/ready/release-set.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$RUNNER_TEMP/ready/release-set.json" \
            --source-root . --artifact-root "$release_root" \
            > "$RUNNER_TEMP/manual-mutation-release-verify.json"
          jq -e '.decision == "VALID" and .release_set_schema_version == 3 and .source_accepted == true and .mutation_executed == false' "$RUNNER_TEMP/manual-mutation-release-verify.json" >/dev/null
          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$release_root/components/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          echo "CONTROL_RELEASE_ROOT=$(dirname "$manifest")" >> "$GITHUB_ENV"

      - name: Set up pinned Node before deploy credential
        id: node_runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Render mutation overlay and prove exact bits dry-run without deploy credential
        id: dry_run
        env:
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py \
            --source-config "$CONTROL_RELEASE_ROOT/deploy/cloudflare/wrangler.jsonc" \
            --release-root "$CONTROL_RELEASE_ROOT" --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" \
            --environment staging --output "$RUNNER_TEMP/wrangler.staging.json"
          echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json" >> "$GITHUB_ENV"
          echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json" >> "$GITHUB_ENV"
          npx --yes wrangler@4.94.0 deploy --dry-run --config "$RUNNER_TEMP/wrangler.staging.json" --env staging --experimental-autoconfig=false

      - name: Activate deploy credential only after bound READY and authorization
        id: deploy_credential
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_TOKEN"
          echo "::add-mask::$DEPLOY_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$DEPLOY_TOKEN" >> "$GITHUB_ENV"

      - name: Re-fence Worker identity and D1 head immediately before mutation
        id: exact_fence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
        run: |
          set -uo pipefail
          deployment_read=not_run
          release_set_match=not_run
          capability_profile_match=not_run
          d1_read=not_run
          d1_match=not_run
          deployment_http_code=""
          observed_release_set=""
          observed_profile=""
          observed_d1_sha256=""
          expected_d1_sha256="$(sha256sum "$RUNNER_TEMP/ready/d1-names-after.json" | cut -d' ' -f1)"
          write_exact_fence() {
            jq -n \
              --arg deployment_read "$deployment_read" \
              --arg release_set_match "$release_set_match" \
              --arg capability_profile_match "$capability_profile_match" \
              --arg d1_read "$d1_read" \
              --arg d1_match "$d1_match" \
              --arg deployment_http_code "$deployment_http_code" \
              --arg observed_release_set "$observed_release_set" \
              --arg expected_release_set "$EXPECTED_CURRENT" \
              --arg observed_profile "$observed_profile" \
              --arg expected_profile "$EXPECTED_CURRENT_PROFILE" \
              --arg observed_d1_sha256 "$observed_d1_sha256" \
              --arg expected_d1_sha256 "$expected_d1_sha256" \
              '{schema_version:1,kind:"AR11_EXACT_CURRENT_FENCE",credential_class:"READ_ONLY_OBSERVE",provider_mutation:false,production_mutation:false,deployment_http_code:(if $deployment_http_code=="" then null else $deployment_http_code end),observed_release_set_id:(if $observed_release_set=="" then null else $observed_release_set end),expected_release_set_id:$expected_release_set,observed_capability_profile_id:(if $observed_profile=="" then null else $observed_profile end),expected_capability_profile_id:$expected_profile,observed_d1_ledger_sha256:(if $observed_d1_sha256=="" then null else $observed_d1_sha256 end),expected_d1_ledger_sha256:$expected_d1_sha256,sub_fences:{deployment_read:$deployment_read,release_set_match:$release_set_match,capability_profile_match:$capability_profile_match,d1_read:$d1_read,d1_match:$d1_match}}' \
              > "$RUNNER_TEMP/exact-current-fence.json"
          }
          trap write_exact_fence EXIT
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            deployment_read=failure
            exit 1
          fi
          account_id="$(jq -er '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          if ! http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/mutation-current-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"; then
            deployment_read=failure
            exit 1
          fi
          deployment_http_code="$http_code"
          if [ "$http_code" != 200 ]; then
            deployment_read=failure
            exit 1
          fi
          if ! jq -e '.success == true and (.errors | length) == 0 and (.result.deployments | type == "array") and (.result.deployments | length) > 0' "$RUNNER_TEMP/mutation-current-api.json" >/dev/null; then
            deployment_read=failure
            exit 1
          fi
          jq '.result.deployments[0]' "$RUNNER_TEMP/mutation-current-api.json" > "$RUNNER_TEMP/mutation-current-deployment.json"
          if ! python scripts/deployment-identity-ar11.py --status "$RUNNER_TEMP/mutation-current-deployment.json" --output "$RUNNER_TEMP/mutation-current-identity.json"; then
            deployment_read=failure
            exit 1
          fi
          observed_release_set="$(jq -er '.release_set_id' "$RUNNER_TEMP/mutation-current-identity.json")"
          observed_profile="$(jq -er '.capability_profile_id' "$RUNNER_TEMP/mutation-current-identity.json")"
          deployment_read=success
          if test "$(jq -r '.release_set_id' "$RUNNER_TEMP/mutation-current-identity.json")" = "$EXPECTED_CURRENT"; then
            release_set_match=success
          else
            release_set_match=failure
            exit 1
          fi
          if test "$(jq -r '.capability_profile_id' "$RUNNER_TEMP/mutation-current-identity.json")" = "$EXPECTED_CURRENT_PROFILE"; then
            capability_profile_match=success
          else
            capability_profile_match=failure
            exit 1
          fi
          if ! npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/mutation-catalog-ledger.json"; then
            d1_read=failure
            exit 1
          fi
          d1_read=success
          if ! python - "$RUNNER_TEMP/mutation-catalog-ledger.json" "$RUNNER_TEMP/mutation-d1-names.json" <<'PY'
          import json, re, sys
          value=json.load(open(sys.argv[1],encoding='utf-8')); names=set()
          def walk(node):
              if isinstance(node,dict):
                  name=node.get('name')
                  if isinstance(name,str) and re.fullmatch(r'\d{4}_[A-Za-z0-9_]+\.sql',name): names.add(name)
                  for item in node.values(): walk(item)
              elif isinstance(node,list):
                  for item in node: walk(item)
          walk(value); ordered=sorted(names,key=lambda item:(int(item[:4]),item)); json.dump(ordered,open(sys.argv[2],'w',encoding='utf-8'),indent=2); open(sys.argv[2],'a',encoding='utf-8').write('\n')
          PY
          then
            d1_read=failure
            exit 1
          fi
          observed_d1_sha256="$(sha256sum "$RUNNER_TEMP/mutation-d1-names.json" | cut -d' ' -f1)"
          if cmp --silent "$RUNNER_TEMP/mutation-d1-names.json" "$RUNNER_TEMP/ready/d1-names-after.json"; then
            d1_match=success
          else
            d1_match=failure
            exit 1
          fi
          trap - EXIT
          write_exact_fence

      - name: Mark provider mutation invocation boundary
        id: mutation_start
        run: |
          set -euo pipefail
          jq -n --arg source_sha "${{ needs.resolve-verify.outputs.main_sha }}" --arg release_set_id "$RELEASE_SET_ID" --arg promotion_id "${{ needs.resolve-verify.outputs.promotion_id }}" --arg target_profile "$TARGET_PROFILE" --arg authorization_digest "$AUTHORIZATION_DIGEST" --arg ready_evidence_sha256 "$READY_EVIDENCE_SHA256" '{schema_version:1,kind:"AR11_PROVIDER_MUTATION_INVOCATION",source_sha:$source_sha,release_set_id:$release_set_id,promotion_id:$promotion_id,target_capability_profile_id:$target_profile,authorization_digest:$authorization_digest,ready_evidence_sha256:$ready_evidence_sha256}' > "$RUNNER_TEMP/provider-mutation-invocation.json"

      - name: Deploy exact Release Set v3 bits after all fences
        id: deploy
        run: |
          set -euo pipefail
          npx --yes wrangler@4.94.0 deploy \
            --config "$WRANGLER_CONFIG" --env staging --experimental-autoconfig=false \
            --message "release_set=$RELEASE_SET_ID profile=$TARGET_PROFILE"

      - name: Capture manual mutation phase state
        id: mutation_state
        if: always()
        run: |
          set -euo pipefail
          failed_boundary=""
          if [ "${{ steps.authorized_checkout.outcome }}" = "failure" ]; then failed_boundary="AUTHORIZED_SOURCE_CHECKOUT"
          elif [ "${{ steps.ready_bind.outcome }}" = "failure" ]; then failed_boundary="READY_FENCE_BINDING"
          elif [ "${{ steps.target_verify.outcome }}" = "failure" ]; then failed_boundary="TARGET_RELEASE_VERIFY"
          elif [ "${{ steps.node_runtime.outcome }}" = "failure" ]; then failed_boundary="NODE_RUNTIME_SETUP"
          elif [ "${{ steps.dry_run.outcome }}" = "failure" ]; then failed_boundary="MUTATION_DRY_RUN"
          elif [ "${{ steps.deploy_credential.outcome }}" = "failure" ]; then failed_boundary="DEPLOY_CREDENTIAL_ACTIVATION"
          elif [ "${{ steps.exact_fence.outcome }}" = "failure" ]; then failed_boundary="EXACT_CURRENT_FENCE"
          elif [ "${{ steps.mutation_start.outcome }}" = "failure" ]; then failed_boundary="MUTATION_INVOCATION_BOUNDARY"
          elif [ "${{ steps.deploy.outcome }}" = "failure" ]; then failed_boundary="PROVIDER_DEPLOY"
          fi
          mutation_started=false
          mutation_executed=false
          if [ "${{ steps.mutation_start.outcome }}" = "success" ]; then mutation_started=true; fi
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then mutation_executed=true; fi
          exact_current_fence='null'
          if [ -f "$RUNNER_TEMP/exact-current-fence.json" ] && jq -e '.schema_version == 1 and .kind == "AR11_EXACT_CURRENT_FENCE" and .credential_class == "READ_ONLY_OBSERVE" and .provider_mutation == false and .production_mutation == false and (.sub_fences | type == "object")' "$RUNNER_TEMP/exact-current-fence.json" >/dev/null 2>&1; then
            exact_current_fence="$(cat "$RUNNER_TEMP/exact-current-fence.json")"
          fi
          jq -n \
            --arg source_sha "${{ needs.resolve-verify.outputs.main_sha }}" --arg release_set_id "$RELEASE_SET_ID" --arg promotion_id "${{ needs.resolve-verify.outputs.promotion_id }}" --arg target_profile "$TARGET_PROFILE" \
            --arg failed_boundary "$failed_boundary" --argjson mutation_started "$mutation_started" --argjson mutation_executed "$mutation_executed" --argjson exact_current_fence "$exact_current_fence" \
            --arg authorized_checkout "${{ steps.authorized_checkout.outcome }}" --arg ready_bind "${{ steps.ready_bind.outcome }}" \
            --arg target_verify "${{ steps.target_verify.outcome }}" --arg node_runtime "${{ steps.node_runtime.outcome }}" \
            --arg dry_run "${{ steps.dry_run.outcome }}" --arg deploy_credential "${{ steps.deploy_credential.outcome }}" \
            --arg exact_fence "${{ steps.exact_fence.outcome }}" --arg mutation_start "${{ steps.mutation_start.outcome }}" --arg deploy "${{ steps.deploy.outcome }}" \
            '{schema_version:1,kind:"AR11_MANUAL_PHASE_STATE",phase:"MUTATE",source_sha:$source_sha,release_set_id:$release_set_id,promotion_id:(if $promotion_id=="" then null else $promotion_id end),target_capability_profile_id:$target_profile,authorization_bound:true,provider_mutation_started:$mutation_started,provider_mutation_executed:$mutation_executed,production_mutation_executed:false,failed_boundary:(if $failed_boundary=="" then null else $failed_boundary end),exact_current_fence:$exact_current_fence,step_outcomes:{authorized_checkout:$authorized_checkout,ready_bind:$ready_bind,target_verify:$target_verify,node_runtime:$node_runtime,dry_run:$dry_run,deploy_credential:$deploy_credential,exact_fence:$exact_fence,mutation_start:$mutation_start,deploy:$deploy}}' \
            > "$RUNNER_TEMP/manual-mutation-state.json"
          phase_state_b64="$(base64 -w0 "$RUNNER_TEMP/manual-mutation-state.json")"
          echo "phase_state_b64=$phase_state_b64" >> "$GITHUB_OUTPUT"

  post-verify:
    name: Re-observe and prove convergence
    needs: [route, resolve-verify, mutate]
    if: needs.route.outputs.mode == 'promote' && needs.mutate.result == 'success'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      actions: read
      contents: read
    outputs:
      phase_state_b64: ${{ steps.post_state.outputs.phase_state_b64 }}
      promotion_verify_b64: ${{ steps.post_state.outputs.promotion_verify_b64 }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ needs.resolve-verify.outputs.release_set_id }}
      TARGET_PROFILE: ${{ needs.resolve-verify.outputs.target_profile }}
      READY_RUN_ID: ${{ needs.resolve-verify.outputs.ready_run_id }}
      READY_ARTIFACT_NAME: ${{ needs.resolve-verify.outputs.ready_artifact_name }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
    steps:
      - name: Checkout exact promoted source
        id: source_checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download prior READY evidence and prepare read-only target
        id: target_prepare
        run: |
          set -euo pipefail
          ready_root="$RUNNER_TEMP/ready"
          mkdir -p "$ready_root"
          gh run download "$READY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$READY_ARTIFACT_NAME" --dir "$ready_root"
          test "$(jq -r '.target_capability_profile_id' "$ready_root/ready-to-mutate.json")" = "$TARGET_PROFILE"
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/post-release-set"
          mkdir -p "$asset_root"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          bash scripts/release-set-assets-ar11.sh materialize current-v3 "$RELEASE_SET_ID" "$asset_root" "$release_root"
          cmp --silent "$release_root/release-set.json" "$ready_root/release-set.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . release verify \
            --release-set "$ready_root/release-set.json" --source-root . --artifact-root "$release_root" \
            > "$RUNNER_TEMP/post-release-verify.json"
          jq -e '.decision == "VALID" and .release_set_schema_version == 3 and .source_accepted == true and .mutation_executed == false' "$RUNNER_TEMP/post-release-verify.json" >/dev/null
          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$release_root/components/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py --source-config "$(dirname "$manifest")/deploy/cloudflare/wrangler.jsonc" --release-root "$(dirname "$manifest")" --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" --environment staging --output "$RUNNER_TEMP/wrangler.staging.json"
          echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json" >> "$GITHUB_ENV"
          echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json" >> "$GITHUB_ENV"

      - name: Set up pinned Node for post-deploy observation
        id: node_runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Re-observe provider and capture promotion.verify natural-owner verdict
        id: observe_verify
        run: |
          set -euo pipefail
          account_id="$(jq -er '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          r2_bucket="$(jq -er '.control_plane.r2_bucket_name // .r2_bucket_name' "$DEPLOY_MANIFEST")"
          queue_name="$(jq -er '.control_plane.integration_events_queue // .integration_events_queue' "$DEPLOY_MANIFEST")"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments" | jq '.result.deployments[0]' > "$RUNNER_TEMP/post-deployment.json"
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote --command 'SELECT name FROM d1_migrations ORDER BY name' --json --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-catalog-ledger.json"
          npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-r2-info.json"
          npx --yes wrangler@4.94.0 queues info "$queue_name" --config "$WRANGLER_CONFIG" --env staging >/dev/null
          jq -n --arg name "$queue_name" '{name:$name}' > "$RUNNER_TEMP/post-queue-info.json"
          npx --yes wrangler@4.94.0 secret list --format json --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-secret-list.json"
          python scripts/deployment-snapshot-ar11.py --environment staging --collected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --deployment-status "$RUNNER_TEMP/post-deployment.json" --catalog-ledger "$RUNNER_TEMP/post-catalog-ledger.json" --r2-list "$RUNNER_TEMP/post-r2-info.json" --queue-list "$RUNNER_TEMP/post-queue-info.json" --secret-list "$RUNNER_TEMP/post-secret-list.json" --rendered-config "$WRANGLER_CONFIG" --deploy-manifest "$DEPLOY_MANIFEST" --current-release-set "$RUNNER_TEMP/ready/release-set.json" --output "$RUNNER_TEMP/post-snapshot.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . promotion verify --release-set "$RUNNER_TEMP/ready/release-set.json" --source-root . --profile "$TARGET_PROFILE" --environment staging --snapshot "$RUNNER_TEMP/post-snapshot.json" --evidence-json "$RUNNER_TEMP/ready/compatibility-evidence.json" > "$RUNNER_TEMP/promotion-verify.json"
          jq -e '.schema_version == 1 and .command == "promotion.verify" and (.decision == "VERIFIED" or .decision == "DRIFTED" or .decision == "INCOMPLETE" or .decision == "UNKNOWN") and (.verified | type == "boolean") and (.blockers | type == "array") and .mutation_executed == false' "$RUNNER_TEMP/promotion-verify.json" >/dev/null
          decision="$(jq -er '.decision' "$RUNNER_TEMP/promotion-verify.json")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Verify health only after promotion owner reports VERIFIED
        id: health
        if: steps.observe_verify.outputs.decision == 'VERIFIED'
        run: |
          set -euo pipefail
          custom_domain="$(jq -er '.control_plane.custom_domain // .custom_domain' "$DEPLOY_MANIFEST")"
          response="$RUNNER_TEMP/health-response"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" -o "$response" "https://$custom_domain/health"
          test "$(cat "$response")" = ok

      - name: Upload metadata-only post-deploy evidence
        id: post_evidence
        if: always() && steps.observe_verify.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-set-promotion-staging-${{ needs.resolve-verify.outputs.release_set_id }}
          path: |
            ${{ runner.temp }}/post-release-verify.json
            ${{ runner.temp }}/post-snapshot.json
            ${{ runner.temp }}/promotion-verify.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture manual post-verify phase state
        id: post_state
        if: always()
        run: |
          set -euo pipefail
          failed_boundary=""
          if [ "${{ steps.source_checkout.outcome }}" = "failure" ]; then failed_boundary="POST_SOURCE_CHECKOUT"
          elif [ "${{ steps.target_prepare.outcome }}" = "failure" ]; then failed_boundary="POST_TARGET_MATERIALIZATION"
          elif [ "${{ steps.node_runtime.outcome }}" = "failure" ]; then failed_boundary="NODE_RUNTIME_SETUP"
          elif [ "${{ steps.observe_verify.outcome }}" = "failure" ]; then failed_boundary="POST_PROVIDER_OBSERVATION"
          elif [ "${{ steps.observe_verify.outputs.decision }}" = "VERIFIED" ] && [ "${{ steps.health.outcome }}" = "failure" ]; then failed_boundary="HEALTH_VERIFICATION"
          elif [ "${{ steps.post_evidence.outcome }}" = "failure" ]; then failed_boundary="POST_EVIDENCE_PUBLICATION"
          fi
          jq -n \
            --arg source_sha "${{ needs.resolve-verify.outputs.main_sha }}" --arg release_set_id "$RELEASE_SET_ID" --arg promotion_id "${{ needs.resolve-verify.outputs.promotion_id }}" --arg target_profile "$TARGET_PROFILE" \
            --arg failed_boundary "$failed_boundary" --arg source_checkout "${{ steps.source_checkout.outcome }}" \
            --arg target_prepare "${{ steps.target_prepare.outcome }}" --arg node_runtime "${{ steps.node_runtime.outcome }}" \
            --arg observe_verify "${{ steps.observe_verify.outcome }}" --arg verify_decision "${{ steps.observe_verify.outputs.decision }}" \
            --arg health "${{ steps.health.outcome }}" --arg post_evidence "${{ steps.post_evidence.outcome }}" \
            '{schema_version:1,kind:"AR11_MANUAL_PHASE_STATE",phase:"POST_VERIFY",source_sha:$source_sha,release_set_id:$release_set_id,promotion_id:(if $promotion_id=="" then null else $promotion_id end),target_capability_profile_id:$target_profile,authorization_bound:true,provider_mutation_started:true,provider_mutation_executed:true,production_mutation_executed:false,failed_boundary:(if $failed_boundary=="" then null else $failed_boundary end),step_outcomes:{source_checkout:$source_checkout,target_prepare:$target_prepare,node_runtime:$node_runtime,observe_verify:$observe_verify,verify_decision:$verify_decision,health:$health,post_evidence:$post_evidence}}' \
            > "$RUNNER_TEMP/manual-post-verify-state.json"
          phase_state_b64="$(base64 -w0 "$RUNNER_TEMP/manual-post-verify-state.json")"
          echo "phase_state_b64=$phase_state_b64" >> "$GITHUB_OUTPUT"
          promotion_verify_b64=""
          if [ -f "$RUNNER_TEMP/promotion-verify.json" ]; then promotion_verify_b64="$(base64 -w0 "$RUNNER_TEMP/promotion-verify.json")"; fi
          echo "promotion_verify_b64=$promotion_verify_b64" >> "$GITHUB_OUTPUT"

  manual-outcome:
    name: Publish one lossless manual AR11 terminal outcome
    needs: [route, resolve-verify, mutate, post-verify]
    if: always() && needs.route.outputs.mode == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.route.outputs.source_sha }}
      TARGET_PROFILE: ${{ needs.resolve-verify.outputs.target_profile }}
      RESOLVE_STATE_B64: ${{ needs.resolve-verify.outputs.phase_state_b64 }}
      MUTATION_STATE_B64: ${{ needs.mutate.outputs.phase_state_b64 }}
      POST_STATE_B64: ${{ needs.post-verify.outputs.phase_state_b64 }}
      PROMOTION_VERIFY_B64: ${{ needs.post-verify.outputs.promotion_verify_b64 }}
      RESOLVE_RESULT: ${{ needs.resolve-verify.result }}
      MUTATE_RESULT: ${{ needs.mutate.result }}
      POST_RESULT: ${{ needs.post-verify.result }}
    steps:
      - name: Checkout exact manual AR11 source
        id: source_checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.route.outputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize captured manual phase transport
        id: captured
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP" <<'PY'
          import base64, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          source = os.environ['SOURCE_SHA']
          def write_state(name, phase, encoded, result, conservative_started=False, conservative_executed=False):
              path = root / name
              if encoded:
                  path.write_bytes(base64.b64decode(encoded, validate=True))
                  return
              state = {
                  'schema_version': 1,
                  'kind': 'AR11_MANUAL_PHASE_STATE',
                  'phase': phase,
                  'source_sha': source,
                  'release_set_id': None,
                  'promotion_id': None,
                  'target_capability_profile_id': os.environ.get('TARGET_PROFILE') or None,
                  'authorization_bound': False,
                  'provider_mutation_started': conservative_started,
                  'provider_mutation_executed': conservative_executed,
                  'production_mutation_executed': False,
                  'failed_boundary': f'{phase}_JOB_UNTERMINALIZED' if result == 'failure' else f'{phase}_JOB_{result.upper()}',
                  'step_outcomes': {'job_result': result},
              }
              path.write_text(json.dumps(state, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          write_state('manual-resolve-state.json', 'RESOLVE_VERIFY', os.environ.get('RESOLVE_STATE_B64',''), os.environ['RESOLVE_RESULT'])
          mutation_missing_started = os.environ['MUTATE_RESULT'] == 'failure'
          write_state('manual-mutation-state.json', 'MUTATE', os.environ.get('MUTATION_STATE_B64',''), os.environ['MUTATE_RESULT'], mutation_missing_started, False)
          post_missing_executed = os.environ['MUTATE_RESULT'] == 'success'
          write_state('manual-post-verify-state.json', 'POST_VERIFY', os.environ.get('POST_STATE_B64',''), os.environ['POST_RESULT'], post_missing_executed, post_missing_executed)
          encoded_verify = os.environ.get('PROMOTION_VERIFY_B64','')
          verify_path = root / 'promotion-verify.json'
          if encoded_verify:
              verify_path.write_bytes(base64.b64decode(encoded_verify, validate=True))
          else:
              verify_path.write_text('{"transport":"unavailable"}\n', encoding='utf-8')
          PY

      - name: Terminalize one lossless manual AR11 OperationalOutcome
        id: outcome
        run: |
          set -euo pipefail
          profile_id="$TARGET_PROFILE"
          test -n "$profile_id" || profile_id="rehearsal-core-v2"
          tree_sha="$(git rev-parse "$SOURCE_SHA^{tree}")"
          evidence_artifact="ar11-operational-outcome-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python scripts/promotion-operational-outcome-ar11.py \
            --mode manual \
            --source-sha "$SOURCE_SHA" --tree-sha "$tree_sha" \
            --environment staging --profile-id "$profile_id" \
            --resolve-state-json "$RUNNER_TEMP/manual-resolve-state.json" \
            --mutation-state-json "$RUNNER_TEMP/manual-mutation-state.json" \
            --post-verify-state-json "$RUNNER_TEMP/manual-post-verify-state.json" \
            --promotion-verify-json "$RUNNER_TEMP/promotion-verify.json" \
            --evidence-artifact "$evidence_artifact" \
            --output "$RUNNER_TEMP/promotion-operational-outcome.json"
          terminal_dir="$RUNNER_TEMP/ar11-manual-terminal"
          mkdir -p "$terminal_dir"
          cp "$RUNNER_TEMP/promotion-operational-outcome.json" "$RUNNER_TEMP/manual-resolve-state.json" "$RUNNER_TEMP/manual-mutation-state.json" "$RUNNER_TEMP/manual-post-verify-state.json" "$RUNNER_TEMP/promotion-verify.json" "$terminal_dir/"
          status="$(jq -er '.status' "$RUNNER_TEMP/promotion-operational-outcome.json")"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo '## Manual AR11 OperationalOutcome'
            echo
            echo '```json'
            jq '{contract,procedure,status,phase,failed_gate,owner,owner_contract,owner_reason_code,recovery_owner,summary,remediation,exact_next_action,source_sha,tree_sha,release_set_id,promotion_id,target_identity,authorization_state,provider_mutation_started,provider_mutation_executed,production_mutation_executed,effect_state,evidence_refs,evidence_digests}' "$RUNNER_TEMP/promotion-operational-outcome.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload terminal manual AR11 OperationalOutcome evidence
        id: outcome_upload
        if: always() && steps.outcome.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-operational-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ar11-manual-terminal
          if-no-files-found: error
          retention-days: 30

      - name: Enforce terminal manual AR11 disposition after evidence publication
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.outcome.outcome }}" = "success"
          test "${{ steps.outcome_upload.outcome }}" = "success"
          jq -e '.contract == "PROMOTION_OPERATOR_OUTCOME_V1" and .procedure == "AR11_RELEASE_SET_PROMOTION" and .status == "COMPLETED" and .authorization_state == "BOUND_ONE_SHOT" and .provider_mutation_started == true and .provider_mutation_executed == true and .production_mutation_executed == false and .effect_state == "EFFECT_VERIFIED"' "$RUNNER_TEMP/promotion-operational-outcome.json" >/dev/null

  rollback-negative-evidence:
    name: Prove incompatible or unknown rollback blocks before mutation
    needs: route
    if: needs.route.outputs.mode == 'rollback-negative'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      EXPECTED_CURRENT: ${{ inputs.expected_current_release_set_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Validate evidence-only intent and prior READY run
        id: bind
        run: |
          set -euo pipefail
          test "${{ inputs.operation }}" = rollback-negative
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_SET_ID" =~ ^release-set-v3-sha256-[0-9a-f]{64}$ ]]
          test "$EXPECTED_CURRENT" = "$RELEASE_SET_ID"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "${{ inputs.confirmation }}" = "$RELEASE_SET_ID:$SOURCE_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          main_sha="$(jq -er '.commit.sha' "$RUNNER_TEMP/protected-main.json")"
          test "$GITHUB_SHA" = "$main_sha"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$main_sha" '.event == "workflow_run" and .status == "completed" and .conclusion == "success" and .head_branch == "main" and .head_sha == $sha and .path == ".github/workflows/release-set-promotion.yml"' "$RUNNER_TEMP/source-run.json" >/dev/null
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.bind.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download READY evidence and prove controlled UNKNOWN rollback blocks
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-ready"
          mkdir -p "$live"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ar11-ready-to-mutate-$RELEASE_SET_ID-${{ steps.bind.outputs.main_sha }}" --dir "$live"
          for name in release-set.json release-verify.json compatibility-evidence.json promotion-plan.json promotion-preflight.json pre-snapshot.json ready-to-mutate.json; do test -f "$live/$name"; done
          jq -e --arg id "$RELEASE_SET_ID" '.release_set_id == $id and .ready == true and .provider_mutation == false' "$live/ready-to-mutate.json" >/dev/null
          jq '.catalog_schema_revision = null' "$live/pre-snapshot.json" > "$RUNNER_TEMP/controlled-unknown-snapshot.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion preflight --release-set "$live/release-set.json" --source-root . \
            --profile rehearsal-core-v2 --environment staging --snapshot "$RUNNER_TEMP/controlled-unknown-snapshot.json" \
            --evidence-json "$live/compatibility-evidence.json" --current-release-set "$live/release-set.json" \
            --known-good-release-set "$live/release-set.json" --expected-current "$RELEASE_SET_ID" \
            | tee "$RUNNER_TEMP/blocked-preflight.json"
          jq -e '.command == "promotion.preflight" and .decision == "BLOCKED" and .ready == false and .rollback_compatibility == "UNKNOWN" and (.blockers | index("ROLLBACK_COMPATIBILITY_UNKNOWN") != null) and .credential_values_accessed == false and .provider_mutation_executed == false and .mutation_executed == false' "$RUNNER_TEMP/blocked-preflight.json" >/dev/null

      - name: Upload credential-free rollback-negative evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-rollback-negative-${{ inputs.release_set_id }}
          path: |
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/live-ready/ready-to-mutate.json
            ${{ runner.temp }}/live-ready/release-set.json
            ${{ runner.temp }}/live-ready/promotion-preflight.json
            ${{ runner.temp }}/controlled-unknown-snapshot.json
            ${{ runner.temp }}/blocked-preflight.json
          if-no-files-found: error
          retention-days: 30
