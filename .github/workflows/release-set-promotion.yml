name: Release Set Promotion

run-name: AR11 ${{ inputs.operation }} ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Canonical operation: promote or rollback-negative evidence'
        required: true
        default: promote
        type: choice
        options:
          - promote
          - rollback-negative
      release_set_id:
        description: Immutable GitHub Release tag `release-set-v2-sha256-...`
        required: true
        type: string
      expected_current_release_set_id:
        description: Current provider Release Set v2 ID or NONE for a clean staging environment
        required: true
        default: NONE
        type: string
      source_run_id:
        description: Completed canonical A-to-A run id; required only for rollback-negative evidence
        required: false
        default: ''
        type: string
      request_id:
        description: Bounded operator correlation id; MANUAL for direct UI dispatch
        required: false
        default: MANUAL
        type: string
      confirmation:
        description: 'Promote: `<release_set_id>:<expected_current_release_set_id>`; negative: `<release_set_id>:<source_run_id>`'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-set-promotion-staging
  cancel-in-progress: false

jobs:
  resolve-verify:
    name: Resolve and verify immutable intent
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'promote'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      EXPECTED_CURRENT: ${{ inputs.expected_current_release_set_id }}
    steps:
      - name: Validate exact v2 operator intent
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "${{ inputs.operation }}" = promote
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_SET_ID" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CURRENT" == NONE || "$EXPECTED_CURRENT" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          test -z "${{ inputs.source_run_id }}"
          test "${{ inputs.confirmation }}" = "$RELEASE_SET_ID:$EXPECTED_CURRENT"

      - name: Prove target source was accepted protected main
        id: resolve
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_SET_ID" > "$RUNNER_TEMP/target-release.json"
          source_sha="$(jq -r '.target_commitish' "$RUNNER_TEMP/target-release.json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          test "$(jq -r '.protected' "$RUNNER_TEMP/protected-main.json")" = true
          main_sha="$(jq -r '.commit.sha' "$RUNNER_TEMP/protected-main.json")"
          test "$GITHUB_SHA" = "$main_sha"
          gh api "repos/$GITHUB_REPOSITORY/compare/$source_sha...$main_sha" > "$RUNNER_TEMP/accepted-source-compare.json"
          test "$(jq -r '.merge_base_commit.sha' "$RUNNER_TEMP/accepted-source-compare.json")" = "$source_sha"
          test "$(jq -r '.behind_by' "$RUNNER_TEMP/accepted-source-compare.json")" = 0
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout current protected-main policy authority
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.resolve.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact target source as read-only provenance input
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.resolve.outputs.source_sha }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify durable Release Set v2 with no provider credentials
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/target-release-set"
          policy_dir="$RUNNER_TEMP/release-policy-input"
          mkdir -p "$asset_root" "$release_root/components" "$policy_dir"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          for name in release-set.json control-plane.tar secret-resolver.tar runtime-bundle.tar profile-bridge.zip; do
            test -f "$asset_root/$name"
          done
          test "$(find "$asset_root" -maxdepth 1 -type f | wc -l)" -eq 5
          cp "$asset_root/release-set.json" "$release_root/release-set.json"
          cp "$asset_root/release-set.json" "$policy_dir/release-set.json"
          cp "$asset_root/control-plane.tar" "$release_root/components/control-plane.tar"
          cp "$asset_root/secret-resolver.tar" "$release_root/components/secret-resolver.tar"
          cp "$asset_root/runtime-bundle.tar" "$release_root/components/runtime-bundle.tar"
          cp "$asset_root/profile-bridge.zip" "$release_root/components/profile-bridge.zip"
          test "$(jq -r '.schema_version' "$policy_dir/release-set.json")" = 2
          test "$(jq -r '.release_set_id' "$policy_dir/release-set.json")" = "$RELEASE_SET_ID"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-set-id "$RELEASE_SET_ID" \
            --source-sha "${{ steps.resolve.outputs.source_sha }}" \
            --branch-json "$RUNNER_TEMP/protected-main.json" \
            --compare-json "$RUNNER_TEMP/accepted-source-compare.json" \
            --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify \
            --release-set "$policy_dir/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/target-source" \
            --artifact-root "$release_root" \
            | tee "$RUNNER_TEMP/release-verify.json" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 2 and .source_accepted == true and .mutation_executed == false' >/dev/null

  observe-preflight:
    name: Observe provider and prove READY without deploy credential
    needs: resolve-verify
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.policy.outputs.decision }}
      promotion_id: ${{ steps.policy.outputs.promotion_id }}
      mutation_fence_sha256: ${{ steps.policy.outputs.mutation_fence_sha256 }}
      custom_domain: ${{ steps.observe.outputs.custom_domain }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      EXPECTED_CURRENT: ${{ inputs.expected_current_release_set_id }}
      TARGET_PROFILE: rehearsal-core-v1
      TARGET_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
    steps:
      - name: Require read-only observation authority only
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"

      - name: Checkout current protected-main policy authority
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact target source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.source_sha }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node runtime for read-only observation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Re-resolve immutable target and render no-rebuild staging overlay
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/target-release-set"
          policy_dir="$RUNNER_TEMP/release-policy-input"
          mkdir -p "$asset_root" "$release_root/components" "$policy_dir"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          cp "$asset_root/release-set.json" "$release_root/release-set.json"
          cp "$asset_root/release-set.json" "$policy_dir/release-set.json"
          cp "$asset_root/control-plane.tar" "$release_root/components/control-plane.tar"
          cp "$asset_root/secret-resolver.tar" "$release_root/components/secret-resolver.tar"
          cp "$asset_root/runtime-bundle.tar" "$release_root/components/runtime-bundle.tar"
          cp "$asset_root/profile-bridge.zip" "$release_root/components/profile-bridge.zip"
          branch_json="$RUNNER_TEMP/protected-main.json"
          compare_json="$RUNNER_TEMP/accepted-source-compare.json"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$branch_json"
          gh api "repos/$GITHUB_REPOSITORY/compare/${{ needs.resolve-verify.outputs.source_sha }}...${{ needs.resolve-verify.outputs.main_sha }}" > "$compare_json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" --release-set-id "$RELEASE_SET_ID" \
            --source-sha "${{ needs.resolve-verify.outputs.source_sha }}" \
            --branch-json "$branch_json" --compare-json "$compare_json" \
            --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/target-source" --artifact-root "$release_root" \
            > "$RUNNER_TEMP/release-verify.json"
          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$release_root/components/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          control_root="$(dirname "$manifest")"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py \
            --source-config "$control_root/deploy/cloudflare/wrangler.jsonc" \
            --release-root "$control_root" \
            --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" \
            --environment staging \
            --output "$RUNNER_TEMP/wrangler.staging.json"
          {
            echo "TARGET_RELEASE_ROOT=$release_root"
            echo "TARGET_RELEASE_MANIFEST=$policy_dir/release-set.json"
            echo "TARGET_SOURCE_ROOT=$GITHUB_WORKSPACE/target-source"
            echo "CONTROL_RELEASE_MANIFEST=$manifest"
            echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json"
            echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json"
          } >> "$GITHUB_ENV"

      - name: Observe current provider state without mutation
        id: observe
        run: |
          set -euo pipefail
          account_id="$(jq -r '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -r '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          r2_bucket="$(jq -r '.control_plane.r2_bucket_name // .r2_bucket_name' "$DEPLOY_MANIFEST")"
          queue_name="$(jq -r '.control_plane.integration_events_queue // .integration_events_queue' "$DEPLOY_MANIFEST")"
          custom_domain="$(jq -r '.control_plane.custom_domain // .custom_domain' "$DEPLOY_MANIFEST")"
          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/deployments-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          if [ "$http_code" = 200 ]; then
            jq '.result.deployments[0] // {}' "$RUNNER_TEMP/deployments-api.json" > "$RUNNER_TEMP/current-deployment.json"
          elif [ "$http_code" = 404 ]; then
            printf '{}\n' > "$RUNNER_TEMP/current-deployment.json"
          else
            cat "$RUNNER_TEMP/deployments-api.json" >&2
            exit 1
          fi
          python scripts/deployment-identity-ar11.py --status "$RUNNER_TEMP/current-deployment.json" --output "$RUNNER_TEMP/current-identity.json"
          current_id="$(jq -r '.release_set_id // "NONE"' "$RUNNER_TEMP/current-identity.json")"
          test "$current_id" = "$EXPECTED_CURRENT"
          if [ "$current_id" != NONE ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$current_id" > "$RUNNER_TEMP/current-release-api.json"
            known_good_source="$(jq -r '.target_commitish' "$RUNNER_TEMP/current-release-api.json")"
            [[ "$known_good_source" =~ ^[0-9a-f]{40}$ ]]
            echo "known_good_source=$known_good_source" >> "$GITHUB_OUTPUT"
            echo "current_id=$current_id" >> "$GITHUB_OUTPUT"
          else
            echo "current_id=NONE" >> "$GITHUB_OUTPUT"
          fi
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/catalog-ledger.json"
          npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/r2-info.json"
          npx --yes wrangler@4.94.0 queues info "$queue_name" \
            --config "$WRANGLER_CONFIG" --env staging >/dev/null
          jq -n --arg name "$queue_name" '{name:$name}' > "$RUNNER_TEMP/queue-info.json"
          npx --yes wrangler@4.94.0 secret list --name "$worker_name" --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/secret-list.json"
          echo "custom_domain=$custom_domain" >> "$GITHUB_OUTPUT"

      - name: Checkout exact known-good source when replacing a deployment
        if: steps.observe.outputs.current_id != 'NONE'
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.observe.outputs.known_good_source }}
          path: known-good-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current/known-good immutable Release Set before rollback evaluation
        if: steps.observe.outputs.current_id != 'NONE'
        run: |
          set -euo pipefail
          current_id="${{ steps.observe.outputs.current_id }}"
          known_good_source="${{ steps.observe.outputs.known_good_source }}"
          asset_root="$RUNNER_TEMP/known-good-assets"
          release_root="$RUNNER_TEMP/known-good-release-set"
          policy_dir="$RUNNER_TEMP/known-good-policy"
          mkdir -p "$asset_root" "$release_root/components" "$policy_dir"
          gh release download "$current_id" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          cp "$asset_root/release-set.json" "$release_root/release-set.json"
          cp "$asset_root/release-set.json" "$policy_dir/release-set.json"
          cp "$asset_root/control-plane.tar" "$release_root/components/control-plane.tar"
          cp "$asset_root/secret-resolver.tar" "$release_root/components/secret-resolver.tar"
          cp "$asset_root/runtime-bundle.tar" "$release_root/components/runtime-bundle.tar"
          cp "$asset_root/profile-bridge.zip" "$release_root/components/profile-bridge.zip"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/kg-main.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/$known_good_source...${{ needs.resolve-verify.outputs.main_sha }}" > "$RUNNER_TEMP/kg-compare.json"
          python scripts/accepted-source-evidence-ar11.py \
            --repository "$GITHUB_REPOSITORY" --release-set-id "$current_id" \
            --source-sha "$known_good_source" --branch-json "$RUNNER_TEMP/kg-main.json" \
            --compare-json "$RUNNER_TEMP/kg-compare.json" --output "$policy_dir/accepted-source-evidence.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/known-good-source" --artifact-root "$release_root" \
            | jq -e '.decision == "VALID" and .source_accepted == true' >/dev/null
          echo "CURRENT_RELEASE_MANIFEST=$policy_dir/release-set.json" >> "$GITHUB_ENV"

      - name: Build metadata-only DeploymentSnapshot v2
        run: |
          set -euo pipefail
          snapshot_args=(
            --environment staging
            --collected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            --deployment-status "$RUNNER_TEMP/current-deployment.json"
            --catalog-ledger "$RUNNER_TEMP/catalog-ledger.json"
            --r2-list "$RUNNER_TEMP/r2-info.json"
            --queue-list "$RUNNER_TEMP/queue-info.json"
            --secret-list "$RUNNER_TEMP/secret-list.json"
            --rendered-config "$WRANGLER_CONFIG"
            --deploy-manifest "$DEPLOY_MANIFEST"
            --output "$RUNNER_TEMP/pre-snapshot.json"
          )
          if [ "${{ steps.observe.outputs.current_id }}" != NONE ]; then
            snapshot_args+=(--current-release-set "$CURRENT_RELEASE_MANIFEST")
          fi
          python scripts/deployment-snapshot-ar11.py "${snapshot_args[@]}"
          test "$(jq -r '.schema_version' "$RUNNER_TEMP/pre-snapshot.json")" = 2

      - name: Produce native D1 and external compatibility evidence v2
        run: |
          set -euo pipefail
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . d1 compatibility --component catalog \
            --ledger-json "$RUNNER_TEMP/catalog-ledger.json" \
            --release-manifest "$CONTROL_RELEASE_MANIFEST" \
            > "$RUNNER_TEMP/catalog-d1-compatibility.json"
          python scripts/release-compat-evidence-ar11.py \
            --release-set-id "$RELEASE_SET_ID" \
            --catalog-d1 "$RUNNER_TEMP/catalog-d1-compatibility.json" \
            --output "$RUNNER_TEMP/compatibility-evidence.json"
          current_args=()
          if [ "${{ steps.observe.outputs.current_id }}" != NONE ]; then
            current_args=(--current-release-set "$CURRENT_RELEASE_MANIFEST")
          fi
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release compatibility --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root "$TARGET_SOURCE_ROOT" --profile "$TARGET_PROFILE" \
            --environment "$TARGET_ENVIRONMENT" --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" \
            "${current_args[@]}" \
            | tee "$RUNNER_TEMP/release-compatibility.json" \
            | jq -e '.compatible == true and .mutation_executed == false' >/dev/null

      - name: Native promotion plan and rollback-aware preflight
        id: policy
        run: |
          set -euo pipefail
          current_args=()
          if [ "${{ steps.observe.outputs.current_id }}" != NONE ]; then
            current_args=(--current-release-set "$CURRENT_RELEASE_MANIFEST" --known-good-release-set "$CURRENT_RELEASE_MANIFEST")
          fi
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion plan --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root "$TARGET_SOURCE_ROOT" --profile "$TARGET_PROFILE" \
            --environment "$TARGET_ENVIRONMENT" --snapshot "$RUNNER_TEMP/pre-snapshot.json" \
            --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" --expected-current "$EXPECTED_CURRENT" \
            "${current_args[@]:0:2}" > "$RUNNER_TEMP/promotion-plan.json"
          preflight_current=()
          if [ "${{ steps.observe.outputs.current_id }}" != NONE ]; then
            preflight_current=(--current-release-set "$CURRENT_RELEASE_MANIFEST" --known-good-release-set "$CURRENT_RELEASE_MANIFEST")
          fi
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion preflight --release-set "$TARGET_RELEASE_MANIFEST" \
            --source-root "$TARGET_SOURCE_ROOT" --profile "$TARGET_PROFILE" \
            --environment "$TARGET_ENVIRONMENT" --snapshot "$RUNNER_TEMP/pre-snapshot.json" \
            --evidence-json "$RUNNER_TEMP/compatibility-evidence.json" --expected-current "$EXPECTED_CURRENT" \
            "${preflight_current[@]}" > "$RUNNER_TEMP/promotion-preflight.json"
          jq -e '.ready == true and .decision == "READY" and .mutation_executed == false' "$RUNNER_TEMP/promotion-preflight.json" >/dev/null
          decision="$(jq -r '.decision' "$RUNNER_TEMP/promotion-plan.json")"
          test "$decision" = PLAN -o "$decision" = NO_CHANGE
          promotion_id="$(jq -r '.promotion_id' "$RUNNER_TEMP/promotion-preflight.json")"
          jq -n \
            --arg release_set_id "$RELEASE_SET_ID" \
            --arg expected_current "$EXPECTED_CURRENT" \
            --arg promotion_id "$promotion_id" \
            --arg decision "$decision" \
            --arg preflight_sha256 "$(sha256sum "$RUNNER_TEMP/promotion-preflight.json" | cut -d' ' -f1)" \
            --arg plan_sha256 "$(sha256sum "$RUNNER_TEMP/promotion-plan.json" | cut -d' ' -f1)" \
            '{schema_version:1,release_set_id:$release_set_id,expected_current:$expected_current,promotion_id:$promotion_id,decision:$decision,preflight_sha256:$preflight_sha256,plan_sha256:$plan_sha256}' \
            > "$RUNNER_TEMP/mutation-fence.json"
          fence_sha="$(sha256sum "$RUNNER_TEMP/mutation-fence.json" | cut -d' ' -f1)"
          {
            echo "decision=$decision"
            echo "promotion_id=$promotion_id"
            echo "mutation_fence_sha256=$fence_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Materialize flat metadata-only preflight artifact contract
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/release-policy-input/release-set.json" "$RUNNER_TEMP/release-set.json"
          cp "$RUNNER_TEMP/release-policy-input/accepted-source-evidence.json" "$RUNNER_TEMP/accepted-source-evidence.json"
          cmp --silent "$RUNNER_TEMP/release-set.json" "$TARGET_RELEASE_MANIFEST"
          cmp --silent "$RUNNER_TEMP/accepted-source-evidence.json" "$RUNNER_TEMP/release-policy-input/accepted-source-evidence.json"

      - name: Upload metadata-only preflight authority
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-preflight-${{ inputs.release_set_id }}
          path: |
            ${{ runner.temp }}/release-set.json
            ${{ runner.temp }}/accepted-source-evidence.json
            ${{ runner.temp }}/release-verify.json
            ${{ runner.temp }}/release-compatibility.json
            ${{ runner.temp }}/compatibility-evidence.json
            ${{ runner.temp }}/promotion-plan.json
            ${{ runner.temp }}/promotion-preflight.json
            ${{ runner.temp }}/pre-snapshot.json
            ${{ runner.temp }}/mutation-fence.json
          if-no-files-found: error
          retention-days: 30

  mutate:
    name: Execute exact same bits after READY
    needs: [resolve-verify, observe-preflight]
    if: needs.observe-preflight.outputs.decision == 'PLAN'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      deployments: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      EXPECTED_CURRENT: ${{ inputs.expected_current_release_set_id }}
    steps:
      - name: Checkout exact current policy
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact target source before mutation verification
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.source_sha }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Download and bind exact preflight authority before provider use
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ar11-preflight-${{ inputs.release_set_id }}
          path: .ar11-preflight

      - name: Re-verify fence and exact immutable Release Set before credentials
        run: |
          set -euo pipefail
          preflight_root="$GITHUB_WORKSPACE/.ar11-preflight"
          fence="$preflight_root/mutation-fence.json"
          preflight="$preflight_root/promotion-preflight.json"
          plan="$preflight_root/promotion-plan.json"
          test "$(sha256sum "$fence" | cut -d' ' -f1)" = "${{ needs.observe-preflight.outputs.mutation_fence_sha256 }}"
          test "$(jq -r '.release_set_id' "$fence")" = "$RELEASE_SET_ID"
          test "$(jq -r '.expected_current' "$fence")" = "$EXPECTED_CURRENT"
          test "$(jq -r '.promotion_id' "$fence")" = "${{ needs.observe-preflight.outputs.promotion_id }}"
          test "$(jq -r '.decision' "$fence")" = PLAN
          test "$(jq -r '.preflight_sha256' "$fence")" = "$(sha256sum "$preflight" | cut -d' ' -f1)"
          test "$(jq -r '.plan_sha256' "$fence")" = "$(sha256sum "$plan" | cut -d' ' -f1)"
          test "$(jq -r '.ready' "$preflight")" = true
          test "$(jq -r '.promotion_id' "$preflight")" = "${{ needs.observe-preflight.outputs.promotion_id }}"

          asset_root="$RUNNER_TEMP/target-assets"
          release_root="$RUNNER_TEMP/mutation-release-set"
          policy_dir="$RUNNER_TEMP/mutation-policy"
          mkdir -p "$asset_root" "$release_root/components" "$policy_dir"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          for name in release-set.json control-plane.tar secret-resolver.tar runtime-bundle.tar profile-bridge.zip; do
            test -f "$asset_root/$name"
          done
          test "$(find "$asset_root" -maxdepth 1 -type f | wc -l)" -eq 5
          cmp --silent "$asset_root/release-set.json" "$preflight_root/release-set.json"
          cp "$preflight_root/release-set.json" "$policy_dir/release-set.json"
          cp "$preflight_root/accepted-source-evidence.json" "$policy_dir/accepted-source-evidence.json"
          cp "$asset_root/control-plane.tar" "$release_root/components/control-plane.tar"
          cp "$asset_root/secret-resolver.tar" "$release_root/components/secret-resolver.tar"
          cp "$asset_root/runtime-bundle.tar" "$release_root/components/runtime-bundle.tar"
          cp "$asset_root/profile-bridge.zip" "$release_root/components/profile-bridge.zip"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . release verify --release-set "$policy_dir/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/target-source" --artifact-root "$release_root" \
            | jq -e '.decision == "VALID" and .release_set_schema_version == 2 and .source_accepted == true and .mutation_executed == false' >/dev/null

          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$asset_root/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          test -n "$manifest"
          control_root="$(dirname "$manifest")"
          echo "CONTROL_RELEASE_ROOT=$control_root" >> "$GITHUB_ENV"

      - name: Set up pinned Node runtime before deploy credentials
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Materialize mutation overlay only after native verification
        env:
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py \
            --source-config "$CONTROL_RELEASE_ROOT/deploy/cloudflare/wrangler.jsonc" \
            --release-root "$CONTROL_RELEASE_ROOT" --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" \
            --environment staging --output "$RUNNER_TEMP/wrangler.staging.json"
          echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json" >> "$GITHUB_ENV"
          echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json" >> "$GITHUB_ENV"

      - name: Prove exact extracted bits can deploy without rebuilding
        run: |
          npx --yes wrangler@4.94.0 deploy --dry-run --config "$WRANGLER_CONFIG" --env staging --experimental-autoconfig=false

      - name: Activate deploy credential after READY and exact-byte verification
        env:
          DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_TOKEN"
          echo "::add-mask::$DEPLOY_TOKEN"
          echo "CLOUDFLARE_API_TOKEN=$DEPLOY_TOKEN" >> "$GITHUB_ENV"

      - name: Re-observe expected-current fence and deploy exact Release Set v2 bits
        run: |
          set -euo pipefail
          account_id="$(jq -r '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -r '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          test -n "$account_id"
          test -n "$worker_name"
          http_code="$(curl --silent --show-error --output "$RUNNER_TEMP/mutation-current.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          if [ "$http_code" = 200 ]; then
            jq '.result.deployments[0] // {}' "$RUNNER_TEMP/mutation-current.json" > "$RUNNER_TEMP/mutation-current-deployment.json"
          elif [ "$http_code" = 404 ]; then
            printf '{}\n' > "$RUNNER_TEMP/mutation-current-deployment.json"
          else
            cat "$RUNNER_TEMP/mutation-current.json" >&2
            exit 1
          fi
          python scripts/deployment-identity-ar11.py \
            --status "$RUNNER_TEMP/mutation-current-deployment.json" \
            --output "$RUNNER_TEMP/mutation-current-identity.json"
          current_id="$(jq -r '.release_set_id // "NONE"' "$RUNNER_TEMP/mutation-current-identity.json")"
          test "$current_id" = "$EXPECTED_CURRENT"
          npx --yes wrangler@4.94.0 deploy \
            --config "$WRANGLER_CONFIG" --env staging --experimental-autoconfig=false \
            --message "release_set=$RELEASE_SET_ID profile=rehearsal-core-v1"

  post-verify:
    name: Re-observe and prove convergence
    needs: [resolve-verify, observe-preflight, mutate]
    if: always() && needs.resolve-verify.result == 'success' && needs.observe-preflight.result == 'success' && (needs.mutate.result == 'success' || needs.mutate.result == 'skipped')
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
    steps:
      - name: Checkout current policy and exact target source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact target source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ needs.resolve-verify.outputs.source_sha }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Download preflight evidence and immutable target
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: ar11-preflight-${{ inputs.release_set_id }}
          path: ${{ runner.temp }}/preflight

      - name: Prepare target identity and read-only config
        run: |
          set -euo pipefail
          asset_root="$RUNNER_TEMP/target-assets"
          mkdir -p "$asset_root"
          gh release download "$RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$asset_root"
          control_extract="$RUNNER_TEMP/control-release"
          mkdir -p "$control_extract"
          tar -xf "$asset_root/control-plane.tar" -C "$control_extract"
          manifest="$(find "$control_extract" -type f -name release-manifest.json -print -quit)"
          control_root="$(dirname "$manifest")"
          umask 077
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$RUNNER_TEMP/deploy-manifest.json"
          python scripts/release-core-overlay-ar11.py \
            --source-config "$control_root/deploy/cloudflare/wrangler.jsonc" \
            --release-root "$control_root" --deploy-manifest "$RUNNER_TEMP/deploy-manifest.json" \
            --environment staging --output "$RUNNER_TEMP/wrangler.staging.json"
          {
            echo "CONTROL_RELEASE_MANIFEST=$manifest"
            echo "DEPLOY_MANIFEST=$RUNNER_TEMP/deploy-manifest.json"
            echo "WRANGLER_CONFIG=$RUNNER_TEMP/wrangler.staging.json"
          } >> "$GITHUB_ENV"

      - name: Set up pinned Node runtime for observation only
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Re-observe provider and verify convergence in Rust
        run: |
          set -euo pipefail
          account_id="$(jq -r '.control_plane.account_id // .account_id' "$DEPLOY_MANIFEST")"
          worker_name="$(jq -r '.control_plane.worker_name // .worker_name' "$DEPLOY_MANIFEST")"
          r2_bucket="$(jq -r '.control_plane.r2_bucket_name // .r2_bucket_name' "$DEPLOY_MANIFEST")"
          queue_name="$(jq -r '.control_plane.integration_events_queue // .integration_events_queue' "$DEPLOY_MANIFEST")"
          custom_domain="$(jq -r '.control_plane.custom_domain // .custom_domain' "$DEPLOY_MANIFEST")"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments" \
            | jq '.result.deployments[0]' > "$RUNNER_TEMP/post-deployment.json"
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB --remote \
            --command 'SELECT name FROM d1_migrations ORDER BY name' --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-catalog-ledger.json"
          npx --yes wrangler@4.94.0 r2 bucket info "$r2_bucket" --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-r2-info.json"
          npx --yes wrangler@4.94.0 queues info "$queue_name" --config "$WRANGLER_CONFIG" --env staging >/dev/null
          jq -n --arg name "$queue_name" '{name:$name}' > "$RUNNER_TEMP/post-queue-info.json"
          npx --yes wrangler@4.94.0 secret list --name "$worker_name" --json \
            --config "$WRANGLER_CONFIG" --env staging > "$RUNNER_TEMP/post-secret-list.json"
          python scripts/deployment-snapshot-ar11.py \
            --environment staging --collected-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --deployment-status "$RUNNER_TEMP/post-deployment.json" \
            --catalog-ledger "$RUNNER_TEMP/post-catalog-ledger.json" \
            --r2-list "$RUNNER_TEMP/post-r2-info.json" --queue-list "$RUNNER_TEMP/post-queue-info.json" \
            --secret-list "$RUNNER_TEMP/post-secret-list.json" --rendered-config "$WRANGLER_CONFIG" \
            --deploy-manifest "$DEPLOY_MANIFEST" --current-release-set "$RUNNER_TEMP/preflight/release-set.json" \
            --output "$RUNNER_TEMP/post-snapshot.json"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion verify --release-set "$RUNNER_TEMP/preflight/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/target-source" --profile rehearsal-core-v1 --environment staging \
            --snapshot "$RUNNER_TEMP/post-snapshot.json" --evidence-json "$RUNNER_TEMP/preflight/compatibility-evidence.json" \
            | tee "$RUNNER_TEMP/promotion-verify.json" \
            | jq -e '.verified == true and .decision == "VERIFIED" and .mutation_executed == false' >/dev/null
          response="$RUNNER_TEMP/health-response"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 \
            -H "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET" \
            -o "$response" "https://$custom_domain/health"
          test "$(cat "$response")" = ok

      - name: Upload metadata-only post-deploy evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-set-promotion-staging-${{ inputs.release_set_id }}
          path: |
            ${{ runner.temp }}/post-snapshot.json
            ${{ runner.temp }}/promotion-verify.json
          if-no-files-found: error
          retention-days: 30

  rollback-negative-evidence:
    name: Prove incompatible or unknown rollback blocks before mutation
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback-negative'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
      EXPECTED_CURRENT: ${{ inputs.expected_current_release_set_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - name: Validate evidence-only intent and live source run
        id: bind
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_SET_ID" =~ ^release-set-v2-sha256-[0-9a-f]{64}$ ]]
          test "$EXPECTED_CURRENT" = "$RELEASE_SET_ID"
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "${{ inputs.confirmation }}" = "$RELEASE_SET_ID:$SOURCE_RUN_ID"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" > "$RUNNER_TEMP/protected-main.json"
          test "$(jq -r '.protected' "$RUNNER_TEMP/protected-main.json")" = true
          main_sha="$(jq -r '.commit.sha' "$RUNNER_TEMP/protected-main.json")"
          test "$GITHUB_SHA" = "$main_sha"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg sha "$main_sha" '
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .head_branch == "main" and
            .head_sha == $sha and
            .path == ".github/workflows/release-set-promotion.yml"
          ' "$RUNNER_TEMP/source-run.json" >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_SET_ID" > "$RUNNER_TEMP/target-release.json"
          source_sha="$(jq -r '.target_commitish' "$RUNNER_TEMP/target-release.json")"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout current protected-main policy authority
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.bind.outputs.main_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact immutable target source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ steps.bind.outputs.source_sha }}
          path: target-source
          fetch-depth: 0
          persist-credentials: false

      - name: Download live A-to-A preflight evidence without provider credentials
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-preflight"
          mkdir -p "$live"
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "ar11-preflight-$RELEASE_SET_ID" --dir "$live"
          for name in release-set.json release-verify.json compatibility-evidence.json promotion-plan.json promotion-preflight.json pre-snapshot.json; do
            test -f "$live/$name"
          done
          jq -e --arg id "$RELEASE_SET_ID" '.decision == "VALID" and .release_set_id == $id and .source_accepted == true and .mutation_executed == false' "$live/release-verify.json" >/dev/null
          jq -e --arg id "$RELEASE_SET_ID" '.decision == "NO_CHANGE" and .observed_current_release_set_id == $id and .target_release_set_id == $id and (.actions | length) == 0 and .mutation_executed == false' "$live/promotion-plan.json" >/dev/null
          jq -e --arg id "$RELEASE_SET_ID" '.decision == "READY" and .ready == true and .target_release_set_id == $id and .rollback_compatibility == "COMPATIBLE" and .credential_values_accessed == false and .provider_mutation_executed == false and .mutation_executed == false' "$live/promotion-preflight.json" >/dev/null
          jq -e --arg id "$RELEASE_SET_ID" '.release_set_id == $id and .environment == "staging"' "$live/pre-snapshot.json" >/dev/null
          jq '.catalog_schema_revision = null' "$live/pre-snapshot.json" > "$RUNNER_TEMP/controlled-unknown-snapshot.json"
          test "$(jq -r '.release_set_id' "$RUNNER_TEMP/controlled-unknown-snapshot.json")" = "$RELEASE_SET_ID"

      - name: Native rollback preflight must block UNKNOWN before credentials
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live-preflight"
          cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- \
            --root . promotion preflight \
            --release-set "$live/release-set.json" \
            --source-root "$GITHUB_WORKSPACE/target-source" \
            --profile rehearsal-core-v1 \
            --environment staging \
            --snapshot "$RUNNER_TEMP/controlled-unknown-snapshot.json" \
            --evidence-json "$live/compatibility-evidence.json" \
            --current-release-set "$live/release-set.json" \
            --known-good-release-set "$live/release-set.json" \
            --expected-current "$RELEASE_SET_ID" \
            | tee "$RUNNER_TEMP/blocked-preflight.json"
          jq -e '
            .command == "promotion.preflight" and
            .decision == "BLOCKED" and
            .ready == false and
            .rollback_compatibility == "UNKNOWN" and
            (.blockers | index("ROLLBACK_COMPATIBILITY_UNKNOWN") != null) and
            .credential_values_accessed == false and
            .provider_mutation_executed == false and
            .mutation_executed == false
          ' "$RUNNER_TEMP/blocked-preflight.json" >/dev/null

      - name: Upload credential-free rollback-negative evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ar11-rollback-negative-${{ inputs.release_set_id }}
          path: |
            ${{ runner.temp }}/source-run.json
            ${{ runner.temp }}/live-preflight/release-set.json
            ${{ runner.temp }}/live-preflight/release-verify.json
            ${{ runner.temp }}/live-preflight/promotion-plan.json
            ${{ runner.temp }}/live-preflight/promotion-preflight.json
            ${{ runner.temp }}/live-preflight/pre-snapshot.json
            ${{ runner.temp }}/controlled-unknown-snapshot.json
            ${{ runner.temp }}/blocked-preflight.json
          if-no-files-found: error
          retention-days: 30
