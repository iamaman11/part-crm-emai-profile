name: Step 9 Lockfile Bootstrap

on:
  pull_request:
  push:
    branches:
      - repository-step-9-encrypted-cloud-generations

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Generate locked dependency graph
        run: cargo generate-lockfile

      - name: Commit generated lockfile when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock is already current."
          else
            git commit -m "Repository Step 9: lock exact crypto dependency graph"
            git push origin HEAD:repository-step-9-encrypted-cloud-generations
          fi
