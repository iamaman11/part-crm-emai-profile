name: Phase 0L Doc Sync

on:
  push:
    branches:
      - phase0l-identity-application-crate

permissions:
  contents: write

jobs:
  sync-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase0l-identity-application-crate
          fetch-depth: 0
      - name: Synchronize Phase 0L documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          plan = "docs/DEVELOPMENT_PLAN.md"
          replace_exact(
              plan,
              "**Tracking:** active Phase 0H issue #92; plan consolidation history #96  ",
              "**Tracking:** active Phase 0L issue/PR #104; plan consolidation history #96  ",
          )
          replace_exact(
              plan,
              "Repository Steps 0–10 and the accepted post-composition slices through **Phase 0G** provide\nthe current code baseline: typed domain/application boundaries, governed D1 writes,\nprofile generations, coordinator/session foundations, synthetic Bridge/runtime lanes,\nmailbox metadata/jobs, React composition and exact-head cross-component acceptance.\n\nThe current unfinished architecture-convergence slice is:\n\n- **Phase 0H — Profile grant application boundary**;\n- tracking issue **#92**;\n- draft PR **#93**.\n\nPhase 0H is **not accepted or merged** until its actual final diff, exact-head CI and merge\nevidence satisfy its issue acceptance. PR descriptions are not implementation evidence.\nBefore merge the branch must be synchronized to the latest `main` and end at\n`behind_by=0`.\n\nAfter 0H, continue the Phase 0 sequence below. Do not begin the next sequential\narchitecture slice while the current slice is still awaiting bounded acceptance.",
              "Repository Steps 0–10 and the accepted post-composition slices through **Phase 0K** provide\nthe current code baseline: typed domain/application boundaries, governed D1 writes,\nprofile generations, application-thin coordinator ingress, synthetic Bridge/runtime lanes,\nmailbox metadata/jobs, React composition and exact-head cross-component acceptance.\n\nThe current unfinished architecture-convergence slice is:\n\n- **Phase 0L — Just-in-time application Cargo boundaries**;\n- tracking issue / draft PR **#104**.\n\nPhase 0L is **not accepted or merged** until its actual final diff, exact-head CI and merge\nevidence satisfy #104 acceptance. The first justified extraction is the identity application\ncontext (`use-cases-identity`); `identity_acl` deliberately remains with cross-client/profile\nquery helpers because moving it would create a false identity-only boundary. PR descriptions\nare not implementation evidence. Before merge the branch must be synchronized to the latest\n`main` and end at `behind_by=0`.\n\nAfter 0L, continue with Phase 0M from the new accepted `main`. Do not begin the next\nsequential architecture slice while 0L is still awaiting bounded acceptance.",
          )
          replace_exact(plan, "use-cases -> application-ports + domains + contracts + primitives", "use-cases-* -> application-ports + domains + contracts + primitives")
          replace_exact(plan, "apps -> use-cases + adapters + contracts + primitives", "apps -> use-cases-* + adapters + contracts + primitives")
          replace_exact(plan, "### Phase 0H — Profile grant application boundary — ACTIVE", "### Phase 0H — Profile grant application boundary — ACCEPTED")
          replace_exact(plan, "### Phase 0I — Client grant application boundary", "### Phase 0I — Client grant application boundary — ACCEPTED")
          replace_exact(plan, "### Phase 0J — Identity governance lifecycle application boundary", "### Phase 0J — Identity governance lifecycle application boundary — ACCEPTED")
          replace_exact(plan, "### Phase 0K — Profile coordinator ingress thinness", "### Phase 0K — Profile coordinator ingress thinness — ACCEPTED")
          replace_exact(plan, "### Phase 0L — Just-in-time application Cargo boundaries", "### Phase 0L — Just-in-time application Cargo boundaries — ACTIVE")
          old_immediate = """## 19. Immediate Next Action

Finish **Phase 0H (#92 / PR #93)** against the latest `main` using the fail-safe application
boundary sequence above. The immediate loop is:

```text
sync #93 to current main
  -> fast preflight / format clean
  -> prove inward native + WASM
  -> switch only ProfileGrantApi to thin transport
  -> prove post-switch native + WASM
  -> remove superseded legacy profile-grant orchestration
  -> update permanent boundary/evidence/docs
  -> fast preflight --with-compile
  -> behind_by=0 + 12/12 exact-head workflows + zero blocking review
  -> guarded squash merge
```

Only after that merge start Phase 0I from the new accepted `main`. In parallel, continue
long-lead External gate preparation without changing `production_ready=false`."""
          new_immediate = """## 19. Immediate Next Action

Finish **Phase 0L (#104 / PR #104)** against the latest accepted Phase 0K `main`. The bounded
first extraction is `use-cases-identity`, owning identity governance plus verified-identity
ceremonies with only inward application/domain dependencies. Keep `identity_acl` in the shared
use-case crate until a real client/profile boundary extraction justifies moving its mixed query
helpers.

```text
keep #104 synchronized to current main
  -> physical identity application ownership lives only in use-cases-identity
  -> preserve implementation-free compatibility re-export where needed
  -> prove extracted crate native tests + explicit WASM check
  -> prove composed Worker/Windows/cross-component regression
  -> enforce dependency and capability-layout gates
  -> exact Cargo.lock workspace delta only; no dependency version drift
  -> update normative docs without promoting External claims
  -> behind_by=0 + 12/12 exact-head workflows + zero blocking review
  -> guarded squash merge
```

Only after that merge start Phase 0M from the new accepted `main`. In parallel, continue
long-lead External gate preparation without changing `production_ready=false`."""
          replace_exact(plan, old_immediate, new_immediate)

          matrix = "docs/DEVELOPER_CAPABILITY_MATRIX.md"
          replace_exact(
              matrix,
              "| Identity / memberships / ACL | Composed | Access identity adapter, memberships, owner bootstrap/transfer, invitation create/accept, membership status lifecycle, profile/client grants, neutral disclosure and governed D1 commands. Identity governance/ceremonies plus profile/client grant/revoke are application-owned behind thin capability transports; the legacy mixed Worker `api.rs` orchestration surface is removed and permanently rejected. | Production Access/IdP deployment is External; coordinator-ingress convergence remains Phase 0 work. |",
              "| Identity / memberships / ACL | Composed | Access identity adapter, memberships, owner bootstrap/transfer, invitation create/accept, membership status lifecycle, profile/client grants, neutral disclosure and governed D1 commands. Identity governance/ceremonies plus profile/client grant/revoke are application-owned behind thin capability transports; the legacy mixed Worker `api.rs` orchestration surface is removed and permanently rejected. | Production Access/IdP deployment is External; first real application Cargo isolation remains active Phase 0 work until 0L merges. |",
          )
          replace_exact(
              matrix,
              "| Profile coordinator | Composed | Durable Object journal, sequence/version/epoch/fencing, timeout/drain/recovery and D1 projection. | Phase 0 coordinator-ingress thinness is Target; remote production concurrency evidence is External. |",
              "| Profile coordinator | Composed | Durable Object journal, sequence/version/epoch/fencing, timeout/drain/recovery, application-thin HTTP ingress and D1 projection with permanent Step-5 boundary enforcement. | Remote production concurrency evidence is External. |",
          )
          replace_exact(
              matrix,
              "Accepted Phase 0 slices through **0J** establish application ownership for client create/query/grant,\nprofile create/query/assignment/grant, mailbox binding/job, generation and identity governance/\nceremony paths. The active Phase 0K coordinator-ingress branch is not an accepted `main` claim\nuntil its guarded merge.\n\nAs of this matrix date:\n\n- accepted `main` includes Phase 0J identity-governance application-boundary ownership and permanent rejection of the legacy mixed Worker `api.rs` surface;\n- Phase 0K coordinator-ingress convergence is tracked by #102 / PR #103 and remains unaccepted until exact-head permanent CI plus guarded merge;\n- the current execution plan, not this matrix, determines subsequent order.",
              "Accepted Phase 0 slices through **0K** establish application ownership for client create/query/grant,\nprofile create/query/assignment/grant, mailbox binding/job, generation, identity governance/\nceremonies and coordinator ingress. The active Phase 0L Cargo-boundary branch is not an accepted\n`main` claim until its guarded merge.\n\nAs of this matrix date:\n\n- accepted `main` includes Phase 0K application-thin coordinator ingress with permanent Step-5 ownership enforcement;\n- Phase 0L first real application Cargo extraction is tracked by issue / draft PR #104 and remains unaccepted until exact-head permanent CI plus guarded merge;\n- the current execution plan, not this matrix, determines subsequent order.",
          )
          replace_exact(
              matrix,
              "crates/use-cases\n  current accepted application crate with capability modules\n  (Phase 0 target: split independent high-growth contexts into real Cargo crates)",
              "crates/use-cases\n  accepted shared application crate with capability modules\n  (active Phase 0L branch extracts the first justified independent identity context)",
          )
          replace_exact(
              matrix,
              "apps/control-plane-worker\n  thin Worker/DO composition and transport; coordinator ingress remains the active Phase 0 convergence target until 0K merge",
              "apps/control-plane-worker\n  thin Worker/DO composition and transport; coordinator ingress is application-thin on accepted main",
          )
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEVELOPMENT_PLAN.md docs/DEVELOPER_CAPABILITY_MATRIX.md
          git commit -m "Docs: advance accepted baseline to 0K and activate 0L"
          git push origin HEAD:phase0l-identity-application-crate
