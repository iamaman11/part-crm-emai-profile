name: Mailbox Overflow Repair

on:
  push:
    branches:
      - mailbox-adapter-export-repair

permissions:
  contents: write

jobs:
  repair-and-self-remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: mailbox-adapter-export-repair
          fetch-depth: 0

      - name: Apply checked counter repair and deterministic regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/cloudflare-adapters/src/mailbox_provider.rs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    SchedulingOverflow,\n    InvalidJobState,\n',
                  '    SchedulingOverflow,\n    InvalidJobState,\n    CounterOverflow,\n',
              ),
              (
                  '            | Self::SchedulingOverflow\n            | Self::InvalidJobState => None,\n',
                  '            | Self::SchedulingOverflow\n            | Self::InvalidJobState\n            | Self::CounterOverflow => None,\n',
              ),
              (
                  '            Self::InvalidJobState => "mailbox job state is invalid for provider execution",\n',
                  '            Self::InvalidJobState => "mailbox job state is invalid for provider execution",\n            Self::CounterOverflow => "mailbox provider call counter overflow",\n',
              ),
              (
                  '        self.calls = self.calls.saturating_add(1);\n',
                  '        self.calls = self\n            .calls\n            .checked_add(1)\n            .ok_or(MailboxProviderAdapterError::CounterOverflow)?;\n',
              ),
              (
                  '    #[test]\n    fn retryable_failure_schedules_retry_without_payload_data()\n',
                  '''    #[test]\n    fn fake_provider_counter_overflow_fails_closed() -> Result<(), Box<dyn std::error::Error>> {\n        let binding = binding()?;\n        let job = job(&binding, 3)?;\n        let mut adapter = DeterministicFakeMailboxProvider {\n            outcome: DeterministicMailboxOutcome::TerminalFailure,\n            calls: u32::MAX,\n        };\n        let error = adapter\n            .check_mailbox(&binding, &job)\n            .expect_err("counter overflow must fail closed");\n        assert_eq!(error, MailboxProviderAdapterError::CounterOverflow);\n        assert_eq!(adapter.calls(), u32::MAX);\n        Ok(())\n    }\n\n    #[test]\n    fn retryable_failure_schedules_retry_without_payload_data()\n''',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one exact replacement, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          rm .github/workflows/mailbox-overflow-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fail closed on mailbox fake counter overflow"
          git push origin HEAD:mailbox-adapter-export-repair
