name: AR-4B Closeout Semantic Fix

on:
  push:
    branches:
      - agent/ar4b-authority-closeout

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar4b-authority-closeout
      - name: Align accepted AR-4B evidence authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_ar3_application_architecture.py')
          text = path.read_text(encoding='utf-8')
          old = '        "evidence": AR4A_EVIDENCE,\n        "projection_policy":'
          new = '        "evidence": AR4B_EVIDENCE,\n        "projection_policy":'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one accepted application-architecture evidence seam')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          evidence = Path('docs/ARCHITECTURE_REBASELINE_V3_AR4B.md')
          text = evidence.read_text(encoding='utf-8')
          text = text.replace('Bounded implementation issue: #282  \n', '', 1)
          text = text.replace('The candidate must pass, at minimum:', 'The implementation candidate was required to pass, at minimum:', 1)
          evidence.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Regenerate and verify canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-architecture-inventory.py --write
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
      - name: Commit semantic fix
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/_ar3_application_architecture.py architecture/inventory.json docs/ARCHITECTURE_REBASELINE_V3_AR4B.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AR-4B closeout: align accepted evidence authority'
          git push origin HEAD:agent/ar4b-authority-closeout
