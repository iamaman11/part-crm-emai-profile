name: Runtime Bundle Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runtime-bundle-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-bundle-linux:
    name: Runtime Bundle Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Compile Step 7 Python sources
        run: >-
          python -m py_compile
          tools/runtime_bundle.py
          runtime/camouhost/main.py
          scripts/check-step7-runtime-bundle.py
          scripts/test-step7-runtime-bundle.py
          scripts/test-step7-fake-camouhost.py

      - name: Enforce Step 7 runtime bundle boundaries
        run: python scripts/check-step7-runtime-bundle.py

      - name: Prove legacy corpus fixture is rejected
        run: |
          if python scripts/check-step7-runtime-bundle.py --root tests/runtime-bundle/fixtures/legacy-corpus-reference; then
            echo "Legacy corpus reference fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Test deterministic bundle build verify and extraction
        run: python scripts/test-step7-runtime-bundle.py

      - name: Test fake Camouhost subprocess lifecycle
        run: python scripts/test-step7-fake-camouhost.py

      - name: Check runtime bundle domain for WASM
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p runtime-bundle-domain

  runtime-bundle-windows:
    name: Runtime Bundle Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Test runtime bundle domain
        run: cargo test --locked -p runtime-bundle-domain

      - name: Test fake Camouhost subprocess lifecycle
        run: python scripts/test-step7-fake-camouhost.py

      - name: Rebuild Profile Bridge release artifact
        run: cargo build --locked --release -p profile-bridge

      - name: Verify Profile Bridge executable remains present
        shell: pwsh
        run: |
          $artifact = Get-Item "target/release/profile-bridge.exe"
          if ($artifact.Length -le 0) {
            throw "profile-bridge.exe is empty"
          }
