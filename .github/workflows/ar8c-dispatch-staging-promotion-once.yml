name: AR-8C One-Shot Staging Promotion Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ar8c-dispatch-staging-promotion-once.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: ar8c-one-shot-staging-promotion-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch canonical AR-8C staging promotion once
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_REPOSITORY: iamaman11/part-crm-emai-profile
      RESOLVER_RELEASE_WORKFLOW_ID: '334695573'
      CONTROL_PLANE_RELEASE_WORKFLOW_ID: '328055413'
      PROMOTION_WORKFLOW_ID: '334695572'
    steps:
      - name: Resolve exact-main immutable releases and dispatch staging promotion
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          api="https://api.github.com/repos/${EXPECTED_REPOSITORY}"

          github_get() {
            curl --silent --show-error --fail-with-body \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          wait_for_exact_success() {
            local workflow_id="$1"
            local label="$2"
            local attempt runs run status conclusion run_id
            for attempt in $(seq 1 60); do
              runs="$(github_get "$api/actions/workflows/$workflow_id/runs?branch=main&event=push&per_page=20")"
              run="$(jq -c --arg sha "$source_sha" '[.workflow_runs[] | select(.head_sha == $sha)] | first // empty' <<<"$runs")"
              if [ -z "$run" ]; then
                sleep 15
                continue
              fi
              status="$(jq -r '.status' <<<"$run")"
              conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
              run_id="$(jq -r '.id' <<<"$run")"
              if [ "$status" = 'completed' ]; then
                if [ "$conclusion" != 'success' ]; then
                  echo "$label exact-main release run $run_id completed with conclusion=$conclusion" >&2
                  exit 1
                fi
                printf '%s\n' "$run_id"
                return 0
              fi
              sleep 15
            done
            echo "Timed out waiting for $label exact-main release for $source_sha" >&2
            exit 1
          }

          select_single_tar_artifact() {
            local run_id="$1"
            local label="$2"
            local listing artifact count
            listing="$(github_get "$api/actions/runs/$run_id/artifacts?per_page=100")"
            count="$(jq '[.artifacts[] | select(.expired == false and (.name | endswith(".tar")))] | length' <<<"$listing")"
            if [ "$count" != '1' ]; then
              echo "$label run $run_id must expose exactly one non-expired .tar artifact; found $count" >&2
              exit 1
            fi
            artifact="$(jq -c '.artifacts[] | select(.expired == false and (.name | endswith(".tar")))' <<<"$listing")"
            printf '%s\n' "$artifact"
          }

          extract_release_manifest() {
            local artifact_id="$1"
            local target="$2"
            local archive="$RUNNER_TEMP/$target-artifact.bin"
            local unpack="$RUNNER_TEMP/$target-unpack"
            local payload="$RUNNER_TEMP/$target-payload"
            local tar_file manifest_count manifest
            mkdir -p "$unpack" "$payload"
            curl --silent --show-error --fail-with-body --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/artifacts/$artifact_id/zip" \
              --output "$archive"
            if unzip -tq "$archive" >/dev/null 2>&1; then
              unzip -q "$archive" -d "$unpack"
              mapfile -t tar_files < <(find "$unpack" -type f -name '*.tar' -print)
              test "${#tar_files[@]}" -eq 1
              tar_file="${tar_files[0]}"
            elif tar -tf "$archive" >/dev/null 2>&1; then
              tar_file="$archive"
            else
              echo "$target artifact is neither a GitHub ZIP containing one TAR nor a raw TAR" >&2
              exit 1
            fi
            tar -xf "$tar_file" -C "$payload"
            manifest_count="$(find "$payload" -type f -name 'release-manifest.json' | wc -l | tr -d ' ')"
            test "$manifest_count" = '1'
            manifest="$(find "$payload" -type f -name 'release-manifest.json' -print)"
            printf '%s\n' "$manifest"
          }

          resolver_run_id="$(wait_for_exact_success "$RESOLVER_RELEASE_WORKFLOW_ID" 'resolver')"
          control_run_id="$(wait_for_exact_success "$CONTROL_PLANE_RELEASE_WORKFLOW_ID" 'control-plane')"

          resolver_artifact="$(select_single_tar_artifact "$resolver_run_id" 'resolver')"
          control_artifact="$(select_single_tar_artifact "$control_run_id" 'control-plane')"

          resolver_artifact_id="$(jq -r '.id' <<<"$resolver_artifact")"
          resolver_artifact_name="$(jq -r '.name' <<<"$resolver_artifact")"
          resolver_artifact_digest="$(jq -r '.digest' <<<"$resolver_artifact")"
          control_artifact_id="$(jq -r '.id' <<<"$control_artifact")"
          control_artifact_name="$(jq -r '.name' <<<"$control_artifact")"
          control_artifact_digest="$(jq -r '.digest' <<<"$control_artifact")"

          resolver_release_id="${resolver_artifact_name%.tar}"
          control_release_id="${control_artifact_name%.tar}"

          resolver_manifest="$(extract_release_manifest "$resolver_artifact_id" 'resolver')"
          control_manifest="$(extract_release_manifest "$control_artifact_id" 'control-plane')"

          test "$(jq -r '.source_commit_sha' "$resolver_manifest")" = "$source_sha"
          test "$(jq -r '.release_id' "$resolver_manifest")" = "$resolver_release_id"
          resolver_worker_sha256="$(jq -r '.resolver_worker_sha256' "$resolver_manifest")"
          test "$resolver_worker_sha256" != 'null'
          test "${#resolver_worker_sha256}" -eq 64

          test "$(jq -r '.source_commit_sha' "$control_manifest")" = "$source_sha"
          test "$(jq -r '.release_id' "$control_manifest")" = "$control_release_id"

          payload="$(jq -n \
            --arg source_sha "$source_sha" \
            --arg resolver_run_id "$resolver_run_id" \
            --arg resolver_artifact_id "$resolver_artifact_id" \
            --arg resolver_artifact_digest "$resolver_artifact_digest" \
            --arg resolver_release_id "$resolver_release_id" \
            --arg resolver_worker_sha256 "$resolver_worker_sha256" \
            --arg control_run_id "$control_run_id" \
            --arg control_artifact_id "$control_artifact_id" \
            --arg control_artifact_digest "$control_artifact_digest" \
            --arg control_release_id "$control_release_id" \
            '{ref:"main",inputs:{environment:"staging",source_sha:$source_sha,resolver_release_run_id:$resolver_run_id,resolver_artifact_id:$resolver_artifact_id,resolver_artifact_digest:$resolver_artifact_digest,resolver_release_id:$resolver_release_id,resolver_worker_sha256:$resolver_worker_sha256,control_plane_release_run_id:$control_run_id,control_plane_artifact_id:$control_artifact_id,control_plane_artifact_digest:$control_artifact_digest,control_plane_release_id:$control_release_id,confirmation:$source_sha}}')"

          status="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$api/actions/workflows/$PROMOTION_WORKFLOW_ID/dispatches")"
          if [ "$status" != '204' ]; then
            echo "canonical staging promotion dispatch failed with HTTP $status" >&2
            cat "$RUNNER_TEMP/dispatch-response.txt" >&2
            exit 1
          fi
          echo "Canonical AR-8C staging promotion accepted for exact main $source_sha."
