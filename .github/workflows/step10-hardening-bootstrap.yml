name: Step 10 Hardening Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step10-hardening-bootstrap
  cancel-in-progress: false

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-10-certification-multi-device
          persist-credentials: true

      - name: Apply certification hardening
        run: python scripts/harden-step10.py

      - name: Remove temporary hardening files
        run: git rm .github/workflows/step10-hardening-bootstrap.yml scripts/harden-step10.py .step10-hardening-trigger

      - name: Verify hardened Step 10 boundary
        run: |
          cargo fmt --all
          python -m py_compile scripts/check-step10-certification.py scripts/check-architecture.py
          python scripts/check-architecture.py
          python scripts/check-step10-certification.py
          if python scripts/check-step10-certification.py --root tests/certification/fixtures/raw-signal-output; then
            echo "Raw-signal output fixture unexpectedly passed." >&2
            exit 1
          fi
          cargo clippy --locked -p certification-domain --all-targets -- -D warnings
          cargo test --locked -p certification-domain
          rustup target add wasm32-unknown-unknown
          cargo check --locked -p certification-domain --target wasm32-unknown-unknown

      - name: Commit verified certification hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 10: harden certification privacy policy"
          git fetch origin repository-step-10-certification-multi-device
          git rebase origin/repository-step-10-certification-multi-device
          git push origin HEAD:repository-step-10-certification-multi-device
