name: V2 One-Click Catalog D1 0027-0031

run-name: V2 one-click staging Catalog D1 0027-0031 @ ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cap-exec-v2-d1-one-click
  cancel-in-progress: false

# STAGE_BOUND_V2_ONE_SHOT: thin GitHub-only orchestration for #584.
# This workflow owns no D1/provider semantics. It only resolves immutable metadata
# and dispatches the existing Protected D1 Migration Executor. It is intentionally
# bound to the single direct successor of AUTHORIZATION_BASE_SHA and must be retired
# after this bounded transaction.
jobs:
  resolve-dispatch:
    name: Resolve exact immutable D1 dispatch envelope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
      AUTHORIZATION_BASE_SHA: cc2620a1d5caacadabbfbab197d59afc0b7e2491
      EXPECTED_ACTOR: iamaman11
      EXPECTED_CURRENT_RELEASE_SET_ID: release-set-v3-sha256-e01338de30cdc4c334e210f9e2bd75a67837420dd370b83964caae452f77522c
      EXPECTED_CURRENT_RELEASE_SOURCE: 852dd515121011130dbd3d7726b72483ecc85aaf
      EXPECTED_CURRENT_MANIFEST_SHA256: cd57a6851a348c7044a628deae5a5804e0f7447cd0583c96bc61ad8f8812e10e
      EXPECTED_TARGET_MIGRATION: 0031_device_binding_governance.sql
      EXPECTED_CURRENT_MIGRATION: 0026_outbound_mail_intents.sql
      CLOUDFLARE_ACCOUNT_ID: 4426df1449e417511bc7697d60b7f62f
      DATABASE_NAME: part-crm-catalog-staging-d3-20260815
      DATABASE_ID: af9abfd1-cb0e-4c58-aa5e-f09c8147f23f
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Fail closed unless this is the exact one-shot main successor
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "$AUTHORIZATION_BASE_SHA"
          test "$(git rev-list --count "$AUTHORIZATION_BASE_SHA..$SOURCE_SHA")" -eq 1

          mapfile -t changed < <(git diff --name-only "$AUTHORIZATION_BASE_SHA" "$SOURCE_SHA")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/v2-d1-one-click-dispatcher.yml"

          test -f "migrations/d1/$EXPECTED_TARGET_MIGRATION"
          test -f "migrations/d1/$EXPECTED_CURRENT_MIGRATION"
          mapfile -t migrations < <(find migrations/d1 -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${#migrations[@]}" -eq 31
          test "${migrations[30]}" = "$EXPECTED_TARGET_MIGRATION"
          for expected in \
            0027_pas2_payload_fingerprint.sql \
            0028_profile_assignment_detach.sql \
            0029_profile_launch_authority.sql \
            0030_profile_generation_successor_commit.sql \
            0031_device_binding_governance.sql; do
            test -f "migrations/d1/$expected"
          done

      - name: Resolve exact target Release Set for this accepted main
        run: |
          set -euo pipefail
          mapfile -t target_release_ids < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -r --arg sha "$SOURCE_SHA" \
                '.[] | select(.target_commitish == $sha and (.tag_name | startswith("release-set-v3-sha256-"))) | .tag_name'
          )
          test "${#target_release_ids[@]}" -eq 1
          target_release_set_id="${target_release_ids[0]}"
          [[ "$target_release_set_id" =~ ^release-set-v3-sha256-[0-9a-f]{64}$ ]]

          target_source="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$target_release_set_id" --jq '.target_commitish')"
          current_source="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$EXPECTED_CURRENT_RELEASE_SET_ID" --jq '.target_commitish')"
          test "$target_source" = "$SOURCE_SHA"
          test "$current_source" = "$EXPECTED_CURRENT_RELEASE_SOURCE"
          echo "TARGET_RELEASE_SET_ID=$target_release_set_id" >> "$GITHUB_ENV"

      - name: Download only the exact Release Set documents and control-plane archives
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v2-d1-one-click"
          rm -rf "$root"
          mkdir -p "$root/target" "$root/current"

          gh release download "$TARGET_RELEASE_SET_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$root/target" \
            --pattern release-set.json \
            --pattern control-plane.tar
          gh release download "$EXPECTED_CURRENT_RELEASE_SET_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$root/current" \
            --pattern release-set.json \
            --pattern control-plane.tar

          test "$(find "$root/target" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$root/current" -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify Release Set bindings and extract exact component manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['RUNNER_TEMP']) / 'v2-d1-one-click'

          def sha256(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()

          def verify(label: str, release_set_id: str, source_sha: str, schema_revision: str, pinned_manifest_sha: str | None) -> None:
              release_set_path = root / label / 'release-set.json'
              archive_path = root / label / 'control-plane.tar'
              release_set = json.loads(release_set_path.read_text(encoding='utf-8'))
              if release_set.get('schema_version') != 3:
                  raise SystemExit(f'{label}: Release Set must be schema v3')
              if release_set.get('release_set_id') != release_set_id:
                  raise SystemExit(f'{label}: Release Set id mismatch')
              source = release_set.get('source') or {}
              if source.get('repository') != os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit(f'{label}: repository mismatch')
              if source.get('commit_sha') != source_sha or source.get('accepted_main') is not True:
                  raise SystemExit(f'{label}: accepted-main source mismatch')

              component = (release_set.get('components') or {}).get('control_plane')
              if not isinstance(component, dict):
                  raise SystemExit(f'{label}: control_plane component binding missing')
              if component.get('component_id') != 'control_plane':
                  raise SystemExit(f'{label}: component id mismatch')
              if component.get('source_commit_sha') != source_sha:
                  raise SystemExit(f'{label}: component source mismatch')
              if component.get('artifact_path') != 'components/control-plane.tar':
                  raise SystemExit(f'{label}: component artifact path mismatch')

              archive_raw = archive_path.read_bytes()
              if sha256(archive_raw) != component.get('artifact_sha256'):
                  raise SystemExit(f'{label}: control-plane archive digest mismatch')
              if len(archive_raw) != component.get('artifact_size_bytes'):
                  raise SystemExit(f'{label}: control-plane archive size mismatch')

              with tarfile.open(archive_path, mode='r:') as archive:
                  members = [
                      member for member in archive.getmembers()
                      if member.isfile() and PurePosixPath(member.name).name == 'release-manifest.json'
                  ]
                  if len(members) != 1:
                      raise SystemExit(f'{label}: expected exactly one component release manifest')
                  extracted = archive.extractfile(members[0])
                  if extracted is None:
                      raise SystemExit(f'{label}: component release manifest unreadable')
                  manifest_raw = extracted.read()

              manifest_sha = sha256(manifest_raw)
              if manifest_sha != component.get('component_manifest_sha256'):
                  raise SystemExit(f'{label}: component manifest digest mismatch')
              if pinned_manifest_sha is not None and manifest_sha != pinned_manifest_sha:
                  raise SystemExit(f'{label}: pinned current manifest digest mismatch')

              manifest = json.loads(manifest_raw)
              canonical = (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode('utf-8')
              if canonical != manifest_raw:
                  raise SystemExit(f'{label}: component manifest is not canonical JSON')
              if manifest.get('release_id') != component.get('release_id'):
                  raise SystemExit(f'{label}: component release id mismatch')
              manifest_source = manifest.get('source') or {}
              if manifest_source.get('repository') != os.environ['GITHUB_REPOSITORY']:
                  raise SystemExit(f'{label}: component repository mismatch')
              if manifest_source.get('commit_sha') != source_sha or manifest_source.get('authority') != 'accepted-main':
                  raise SystemExit(f'{label}: component accepted-main source mismatch')
              if (manifest.get('migrations') or {}).get('latest') != schema_revision:
                  raise SystemExit(f'{label}: Catalog migration target mismatch')
              contract = manifest.get('schema_contract') or {}
              if contract.get('database_component') != 'catalog' or contract.get('target_schema_revision') != schema_revision:
                  raise SystemExit(f'{label}: Catalog schema contract mismatch')

              (root / f'{label}-manifest.json').write_bytes(manifest_raw)

          verify(
              'target',
              os.environ['TARGET_RELEASE_SET_ID'],
              os.environ['SOURCE_SHA'],
              os.environ['EXPECTED_TARGET_MIGRATION'],
              None,
          )
          verify(
              'current',
              os.environ['EXPECTED_CURRENT_RELEASE_SET_ID'],
              os.environ['EXPECTED_CURRENT_RELEASE_SOURCE'],
              os.environ['EXPECTED_CURRENT_MIGRATION'],
              os.environ['EXPECTED_CURRENT_MANIFEST_SHA256'],
          )
          PY

      - name: Race-check main and prove this exact executor has not already been dispatched
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/runs?event=workflow_dispatch&per_page=100" \
            > "$RUNNER_TEMP/d1-executor-runs.json"
          existing="$(jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | length' "$RUNNER_TEMP/d1-executor-runs.json")"
          test "$existing" -eq 0

      - name: Dispatch the existing canonical Protected D1 Migration Executor exactly once
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"

          root="$RUNNER_TEMP/v2-d1-one-click"
          target_manifest="$(jq -c . "$root/target-manifest.json")"
          current_manifest="$(jq -c . "$root/current-manifest.json")"
          confirmation="$SOURCE_SHA:staging:catalog:$DATABASE_ID"

          jq -n \
            --arg ref main \
            --arg environment staging \
            --arg source_sha "$SOURCE_SHA" \
            --arg component catalog \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg database_name "$DATABASE_NAME" \
            --arg database_id "$DATABASE_ID" \
            --arg target_release_manifest_json "$target_manifest" \
            --arg current_release_manifest_json "$current_manifest" \
            --arg known_good_release_manifest_json "$current_manifest" \
            --arg preconditions_json '{}' \
            --arg confirmation "$confirmation" \
            '{
              ref: $ref,
              inputs: {
                environment: $environment,
                source_sha: $source_sha,
                component: $component,
                account_id: $account_id,
                database_name: $database_name,
                database_id: $database_id,
                target_release_manifest_json: $target_release_manifest_json,
                current_release_manifest_json: $current_release_manifest_json,
                known_good_release_manifest_json: $known_good_release_manifest_json,
                preconditions_json: $preconditions_json,
                mutation_authorized: true,
                confirmation: $confirmation
              }
            }' > "$RUNNER_TEMP/d1-dispatch.json"

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/dispatches" \
            --input "$RUNNER_TEMP/d1-dispatch.json"
          rm -f "$RUNNER_TEMP/d1-dispatch.json"
          echo "Canonical Protected D1 Migration Executor dispatch accepted by GitHub for exact main $SOURCE_SHA."
