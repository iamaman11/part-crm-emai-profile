name: R6 Frontend API Migrate Temporary

on:
  push:
    branches:
      - audit/frontend-api-ownership
    paths:
      - .github/workflows/r6-frontend-api-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/frontend-api-ownership
          fetch-depth: 0

      - name: Migrate capability API ownership fail closed
        shell: bash
        run: |
          set -euo pipefail
          python .github/r6-frontend-api-migrate.py
          python scripts/check-frontend-feature-boundaries.py
          python scripts/check-frontend-feature-boundaries.py --self-test
          git diff --check

      - name: Validate frontend behavior and types
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run typecheck
          npm test
          npm run build

      - name: Commit coherent R6 migration and remove temporary tooling
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r6-frontend-api-audit.yml
          rm .github/workflows/r6-frontend-api-migrate.yml
          rm .github/r6-frontend-api-migrate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate frontend capability API ownership"
          git push origin HEAD:audit/frontend-api-ownership
