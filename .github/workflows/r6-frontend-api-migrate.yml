name: R6 Frontend API Migrate Temporary

on:
  push:
    branches:
      - audit/frontend-api-ownership
    paths:
      - .github/workflows/r6-frontend-api-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/frontend-api-ownership
          fetch-depth: 0

      - name: Migrate capability API ownership fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def write(path: str, content: str) -> None:
              target = root / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              target = root / path
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              target.write_text(text.replace(old, new), encoding='utf-8')

          write('frontend/src/shared/api/endpoint.ts', '''import { newIdempotencyKey, requestJson, sha256Hex } from './client';
import type { MutationReceipt } from './generated/control-plane';

export function segment(value: string): string {
  if (!value || value.includes('/') || value.includes('\\\\')) {
    throw new TypeError('Opaque identifiers cannot contain path separators');
  }
  return encodeURIComponent(value);
}

export function pagedPath(path: string, cursor?: string | null, limit = 50): string {
  if (!Number.isInteger(limit) || limit < 1 || limit > 100) {
    throw new RangeError('Query page size must be an integer between 1 and 100');
  }
  const search = new URLSearchParams({ limit: String(limit) });
  if (cursor) search.set('cursor', cursor);
  return `${path}?${search.toString()}`;
}

async function mutationBody<T extends object>(body: T): Promise<T & { requestDigest: string }> {
  return { ...body, requestDigest: await sha256Hex(body) };
}

export function mutate<T extends object>(
  path: string,
  tenantId: string,
  method: 'POST' | 'PUT' | 'PATCH' | 'DELETE',
  body: T,
): Promise<MutationReceipt | undefined> {
  return mutationBody(body).then((payload) => requestJson<MutationReceipt>(path, {
    tenantId,
    method,
    body: payload,
    idempotencyKey: newIdempotencyKey(),
  }));
}
''')

