name: N1 Projection Scratch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'codex/n1-projection-scratch-20260823'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Apply N1 cutover and generate projections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          ar3 = root / 'scripts/_ar3_application_architecture.py'
          text = ar3.read_text(encoding='utf-8')
          text = text.replace(
              'projection is architecture/inventory.json. Accepted runtime-resource decisions are consumed\nfrom architecture/runtime-topology-ar2.json without being re-decided here.',
              'projection is architecture/inventory.json. Runtime/resource topology is owned by provider-native\nconfiguration and Product Rust rather than consumed from the historical AR-2 decision artifact.',
          )
          text = text.replace('import copy\nimport json\n', 'import copy\n')
          text = text.replace('RUNTIME_TOPOLOGY = "architecture/runtime-topology-ar2.json"\n', '')
          text = text.replace('''        "resource_refs": [
            "control_plane_worker",
            "static_assets",
            "catalog_d1",
            "profile_objects",
            "profile_coordinator",
            "notification_hub",
            "integration_events",
            "mailbox_jobs",
            "mailbox_jobs_dlq",
            "generation_verification",
            "mailbox_secret_resolver_service",
            "control_plane_schedule",
        ],
''', '')
          text = text.replace('''        "resource_refs": [
            "mailbox_secret_resolver_worker",
            "resolver_d1",
            "resolver_reconciliation_schedule",
        ],
''', '')
          text = text.replace('        "resource_refs": ["browser_bridge_mailbox_lane"],\n', '')
          start = text.index('\ndef load_topology(root: Path) -> dict[str, Any]:')
          end = text.index('\ndef _validate_source_text', start)
          text = text[:start] + text[end:]
          text = text.replace('    topology = load_topology(root)\n', '')
          start = text.index('    resource_ids = {item["id"] for item in topology["resources"]}\n')
          end = text.index('    remediation = ', start)
          text = text[:start] + text[end:]
          text = text.replace('        "topology_source": RUNTIME_TOPOLOGY,\n', '')
          text = text.replace('        "runtime_resources": copy.deepcopy(topology["resources"]),\n', '')
          start = text.index('\n    missing_resource = copy.deepcopy(expected)')
          end = text.index('\n    duplicate_owner = ', start)
          text = text[:start] + text[end:]
          ar3.write_text(text, encoding='utf-8', newline='\n')

          engine = root / 'scripts/generate-architecture-inventory-engine.py'
          text = engine.read_text(encoding='utf-8')
          text = text.replace('RUNTIME_TOPOLOGY = "architecture/runtime-topology-ar2.json"\n', '')
          text = text.replace('    {"path": RUNTIME_TOPOLOGY, "status": "STABLE_AUTHORITY", "scope": "accepted_ar2_runtime_topology_decision_input_for_ar3"},\n', '')
          text = text.replace('''    if program.get("runtime_topology_decision") != RUNTIME_TOPOLOGY:
        raise SystemExit("docs/status.json must project the accepted AR-2 topology decision")
''', '')
          text = text.replace('            "topology_decision_source": RUNTIME_TOPOLOGY,\n', '')
          text = text.replace('                "topology_decision": "DELETE",\n', '')
          text = text.replace('            "runtime_topology_decision": RUNTIME_TOPOLOGY,\n', '')
          text = text.replace('            "runtime_topology_projection_owner": "AR-3",\n', '')
          start = text.index('\n    topology = copy.deepcopy(expected)')
          end = text.index('\n    runtime_cleanup = ', start)
          text = text[:start] + text[end:]
          start = text.index('\n    missing_resource = copy.deepcopy(expected)')
          end = text.index('\n    ar4d = ', start)
          text = text[:start] + text[end:]
          engine.write_text(text, encoding='utf-8', newline='\n')

          status_path = root / 'docs/status.json'
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status['current']['architecture_program'].pop('runtime_topology_decision', None)
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8', newline='\n')

          (root / 'architecture/runtime-topology-ar2.json').unlink()
          PY
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-cloudflare-runtime-bindings.py
          python scripts/check-documentation-authority.py --root .
          git diff --check
      - name: Commit generated scratch blobs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/_ar3_application_architecture.py scripts/generate-architecture-inventory-engine.py architecture/inventory.json docs/status.json architecture/runtime-topology-ar2.json
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'scratch: materialize N1 projection blobs'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
