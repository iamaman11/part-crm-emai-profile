name: Phase 2C Clean Finalizer

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2c-client-merge-assignment-ui
          fetch-depth: 0
          persist-credentials: true

      - name: Idempotently align legacy assignment fixtures
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('scripts/test-d1-schema.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'assignment_cross_tenant': (1, 50, 'invalid tenant link'),
              'assignment_archived': (1, 60, 'archived client'),
              'assignment_primary_one': (1, 70, 'primary assignment'),
              'assignment_primary_two': (2, 71, 'duplicate active assignment'),
          }
          for assignment_id, (expected_version, at, reason) in replacements.items():
              if f"'cmd_{assignment_id}'" in text:
                  continue
              pattern = re.compile(
                  r"INSERT INTO profile_client_assignments\s*\(.*?\)\s*"
                  r"VALUES\s*\(\?,\s*'" + re.escape(assignment_id) + r"'.*?\)",
                  re.DOTALL,
              )
              sql = (
                  "INSERT INTO profile_assignment_commands (\n"
                  "    tenant_id, profile_id, client_id, command_actor_id,\n"
                  "    command_id, assignment_id, expected_profile_version, reason, executed_at_ms\n"
                  ") VALUES (\n"
                  f"    ?, ?, ?, ?, 'cmd_{assignment_id}', '{assignment_id}',\n"
                  f"    {expected_version}, '{reason}', {at}\n"
                  ")"
              )
              text, count = pattern.subn(sql, text, count=1)
              if count != 1:
                  raise SystemExit(f'expected one legacy fixture for {assignment_id}, found {count}')

          duplicate_at = text.index('assignment_primary_two')
          same_client = '"profile_assignment_same_client"'
          unique = '"UNIQUE constraint failed"'
          tail = text[duplicate_at:]
          if same_client not in tail:
              if unique not in tail:
                  raise SystemExit('duplicate assignment expectation marker missing')
              at = text.index(unique, duplicate_at)
              text = text[:at] + same_client + text[at + len(unique):]
          path.write_text(text, encoding='utf-8')

      - name: Run shared D1 invariants
        run: python scripts/test-d1-schema.py

      - name: Run Phase 2C D1 proof
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Run Phase 2C permanent boundary gate
        run: |
          python scripts/check-phase2c-client-boundaries.py
          python scripts/check-phase2c-client-boundaries.py --self-test

      - name: Remove all temporary Phase 2C maintenance artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/phase2c-maintenance.yml \
            .github/workflows/phase2c-shared-d1-regression-fix.yml \
            .github/workflows/phase2c-shared-d1-regression-fix-v2.yml \
            .github/workflows/phase2c-regression-finalizer.yml \
            .github/workflows/phase2c-clean-final.yml \
            scripts/_phase2c_regression_trigger.txt \
            scripts/_phase2c_regression_trigger_v2.txt \
            scripts/_phase2c_regression_finalizer_trigger.txt \
            scripts/_phase2c_clean_final_trigger.txt

      - name: Commit, rebase and push validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No Phase 2C cleanup changes remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Phase 2C: finalize governed assignment regression and policy gate'
          git pull --rebase origin phase2c-client-merge-assignment-ui
          git push origin HEAD:phase2c-client-merge-assignment-ui
