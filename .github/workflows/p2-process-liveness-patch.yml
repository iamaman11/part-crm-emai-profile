name: P2 Process Liveness One Shot

on:
  push:
    branches:
      - cap-exec/p2-authorized-launch

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT_SHA: 1fe5b6a6c32d95ef62145f71c3814393c1ff64aa
      TARGET_BRANCH: cap-exec/p2-authorized-launch
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 2

      - name: Verify one-shot source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test -f .github/scripts/p2_process_liveness_patch.py

      - name: Patch existing liveness owner
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/p2_process_liveness_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          python -c "import subprocess; expected=['apps/profile-bridge/src/camouhost_process.rs','apps/profile-bridge/src/operator_flow.rs']; actual=sorted(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())); assert actual == expected, (actual, expected)"
          git diff --check

      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/p2-process-liveness-patch.yml .github/scripts/p2_process_liveness_patch.py
          git add apps/profile-bridge/src/camouhost_process.rs apps/profile-bridge/src/operator_flow.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(p2): fence dead Bridge runtime before heartbeat"
          git push origin "HEAD:$TARGET_BRANCH"
