name: AR-4C Architecture Once

on:
  push:
    branches:
      - ar4c-outbound-mail-composition

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ar4c-outbound-mail-composition
      - name: Apply candidate architecture migration
        run: python scripts/_ar4c_architecture_once.py
      - name: Regenerate and verify canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-documentation-authority.py --root .
      - name: Commit candidate architecture state
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/_ar3_application_architecture.py scripts/generate-architecture-inventory.py architecture/inventory.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'AR-4C project candidate composition ownership into canonical inventory'
          git push origin HEAD:ar4c-outbound-mail-composition
