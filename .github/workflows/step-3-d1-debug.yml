name: Step 3 D1 Debug

on:
  push:
    branches:
      - repository-step-3-d1-catalog-foundation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Inspect synthetic CAS fixture
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/test-d1-schema.py")
          spec = importlib.util.spec_from_file_location("d1schema", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          connection = module.open_database()
          module.apply_migrations(connection)
          module.seed_catalog(connection)
          print("memberships", [tuple(row) for row in connection.execute(
              "SELECT tenant_id, actor_id, role, status FROM memberships ORDER BY tenant_id, actor_id"
          )])
          print("client", [tuple(row) for row in connection.execute(
              "SELECT tenant_id, client_id, created_by_actor_id, updated_by_actor_id, version FROM clients WHERE tenant_id=? AND client_id=?",
              (module.TENANT_A, module.CLIENT_A),
          )])
          print("fk before", [tuple(row) for row in connection.execute("PRAGMA foreign_key_check")])
          try:
              cursor = connection.execute(
                  """
                  UPDATE clients
                  SET display_name = 'Updated Client', version = version + 1,
                      updated_by_actor_id = ?, updated_at_ms = 100
                  WHERE tenant_id = ? AND client_id = ? AND version = 1
                  """,
                  (module.OWNER_A, module.TENANT_A, module.CLIENT_A),
              )
              print("fresh rowcount", cursor.rowcount)
          except Exception as error:
              print("fresh update error", repr(error))
              print("fk after error", [tuple(row) for row in connection.execute("PRAGMA foreign_key_check")])
              raise
          PY
