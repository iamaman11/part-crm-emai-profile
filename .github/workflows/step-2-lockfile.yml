name: Step 2 Lockfile

on:
  push:
    branches:
      - repository-step-2-domain-contract-skeleton

permissions:
  contents: write

concurrency:
  group: step-2-lockfile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-2-domain-contract-skeleton
          persist-credentials: true

      - name: Generate exact dependency lock
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Step 2 domain workspace"
          git push origin HEAD:repository-step-2-domain-contract-skeleton
