name: N4 Projection Sync Temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/n4-operator-authority-cleanup
          fetch-depth: 0

      - name: Regenerate retained inventory projection
        run: python scripts/generate-architecture-inventory.py --write

      - name: Remove retired current-path references
        shell: python
        run: |
          import json
          from pathlib import Path

          status_path = Path("docs/status.json")
          payload = json.loads(status_path.read_text(encoding="utf-8"))
          authorities = payload["current"]["architecture_program"]["subject_domain_authorities"]
          authorities.pop("operator_contract", None)
          status_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
              newline="\n",
          )

          boundary_path = Path("docs/OPSCTL_ARCHITECTURE_BOUNDARY.md")
          text = boundary_path.read_text(encoding="utf-8")
          old = (
              "Current N2 work on `main` removed AR-6 Python-estate sentinels from repository-root discovery. "
              "Current discovery still depends on tracked inventory/generator and AR-8 operator sentinels. "
              "N4/PF-1 must remove those remaining dependencies so repository identity uses minimal durable workspace markers rather than files scheduled for retirement or generated projections."
          )
          new = (
              "N2 removed AR-6 Python-estate sentinels from repository-root discovery, and N4 removed the AR-8 operator predecessor from current operator semantics/diagnostics. "
              "Repository discovery still depends on the retained tracked inventory/generator while its non-N4 lifecycle compatibility consumer exists. "
              "Its later owning cutover must resolve that dependency so repository identity uses minimal durable workspace markers rather than generated projections."
          )
          if old not in text:
              raise SystemExit("expected OPSCTL repository-root discovery paragraph not found")
          boundary_path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Commit generated projection sync
        shell: bash
        run: |
          set -euo pipefail
          git add architecture/inventory.json docs/status.json docs/OPSCTL_ARCHITECTURE_BOUNDARY.md
          if git diff --cached --quiet; then
            echo "No projection/documentation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "N4: synchronize generated projections"
          git push origin HEAD:codex/n4-operator-authority-cleanup
