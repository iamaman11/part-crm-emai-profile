name: Temporary Step 6 Final Format

on:
  push:
    branches:
      - repository-step-6-windows-bridge

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-6-windows-bridge

      - name: Apply pinned rustfmt
        run: |
          cargo fmt --all
          rm .github/workflows/step6-final-format.yml

      - name: Commit formatting and workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/profile-bridge crates/bridge-domain .github/workflows/step6-final-format.yml
          git commit -m "Step 6: apply pinned rustfmt"
          git push origin HEAD:repository-step-6-windows-bridge
