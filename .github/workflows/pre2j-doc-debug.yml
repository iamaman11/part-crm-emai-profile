name: TEMP Pre2J Documentation Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  documentation-authority-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify documentation authority
        run: python scripts/check-documentation-authority.py
      - name: Generate deterministic architecture inventory
        run: python scripts/generate-architecture-inventory.py --write
      - name: Verify generated inventory diff hygiene
        run: git diff --check -- architecture/inventory.json
      - name: Commit generated architecture inventory
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- architecture/inventory.json; then
            echo 'Architecture inventory already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/inventory.json
          git commit -m 'Pre-2J closeout: refresh architecture inventory'
      - name: Push generated architecture inventory
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
