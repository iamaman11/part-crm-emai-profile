name: TEMP Pre2J Documentation Debug

on:
  pull_request:

permissions:
  contents: write

jobs:
  documentation-authority-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Verify documentation authority
        run: python scripts/check-documentation-authority.py
      - name: Migrate architecture policy to accepted closeout semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-architecture-inventory.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'raise SystemExit(f"no product Phase ... — NEXT section is allowed while pre-2J remediation is active: {next_sections}")',
                  'raise SystemExit(f"no bare product Phase ... — NEXT section is allowed; use an explicit accepted/blocked/unblocked status: {next_sections}")',
              ),
              (
                  'blocked_phase2j = "Phase 2J — Production-readiness evidence and controlled rollout — BLOCKED / NEXT AFTER PRE-2J"\n    if blocked_phase2j not in plan:\n        raise SystemExit("DEVELOPMENT_PLAN.md must keep Phase 2J blocked behind pre-2J closure")',
                  'unblocked_phase2j = "Phase 2J — Production-readiness evidence and controlled rollout — UNBLOCKED / NOT STARTED"\n    if unblocked_phase2j not in plan:\n        raise SystemExit("DEVELOPMENT_PLAN.md must keep Phase 2J unblocked but not started after pre-2J closure")',
              ),
              (
                  'if len(immediate) != 2 or "PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md" not in immediate[1] or "Do not start Phase 2J" not in immediate[1]:\n        raise SystemExit("Immediate Next Action must enforce the active pre-2J blocker")',
                  'if (\n        len(immediate) != 2\n        or "Phase 2J is unblocked but not started" not in immediate[1]\n        or "separate bounded work batch" not in immediate[1]\n        or "`production_ready=false`" not in immediate[1]\n    ):\n        raise SystemExit("Immediate Next Action must preserve post-closeout Phase 2J and production-readiness boundaries")',
              ),
              (
                  '"Phase 2J — Production-readiness evidence and controlled rollout — BLOCKED / NEXT AFTER PRE-2J",',
                  '"Phase 2J — Production-readiness evidence and controlled rollout — UNBLOCKED / NOT STARTED",',
              ),
              (
                  '"Phase 2J — Production-readiness evidence and controlled rollout — NEXT",',
                  '"Phase 2J — Production-readiness evidence and controlled rollout — NEXT",\n        "Phase 2J — Production-readiness evidence and controlled rollout — BLOCKED / NEXT AFTER PRE-2J",',
              ),
              (
                  '"pre2j_execution_blocker": "docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md",',
                  '"pre2j_closeout": "docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md",',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one policy marker to migrate, observed {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Generate deterministic architecture inventory
        run: python scripts/generate-architecture-inventory.py --write
      - name: Verify architecture policy and inventory
        shell: bash
        run: |
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          git diff --check -- scripts/generate-architecture-inventory.py architecture/inventory.json
      - name: Commit closeout policy and generated inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-architecture-inventory.py architecture/inventory.json
          git commit -m 'Pre-2J closeout: align architecture authority gate'
      - name: Push closeout policy and generated inventory
        run: git push origin HEAD:${{ github.event.pull_request.head.ref }}
