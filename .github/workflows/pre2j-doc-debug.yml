name: TEMP Pre2J Documentation Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  documentation-authority-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Verify documentation authority
        run: python scripts/check-documentation-authority.py
      - name: Expose generated architecture inventory delta
        shell: bash
        run: |
          python scripts/generate-architecture-inventory.py --write
          if git diff --quiet -- architecture/inventory.json; then
            echo '::notice file=architecture/inventory.json,line=1,title=Architecture inventory::No generated inventory drift'
            exit 0
          fi
          delta="$(git diff --unified=0 -- architecture/inventory.json | base64 -w0)"
          printf '::error file=architecture/inventory.json,line=1,title=Generated architecture inventory delta::%s\n' "$delta"
          exit 1
