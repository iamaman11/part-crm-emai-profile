name: Step 4 Format Fix

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Refresh generated files
        run: |
          cargo metadata --format-version 1 >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          test_path = Path("scripts/test-step4-command-guards.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              '"profile_grant_target_not_active_member",',
              '"profile_grant_version_mismatch",',
          )
          test_path.write_text(test_text, encoding="utf-8")

          spec_path = Path("openapi/v1/openapi.json")
          spec = json.loads(spec_path.read_text(encoding="utf-8"))
          spec["components"]["schemas"]["Problem"]["required"] = [
              "type", "title", "status", "code", "correlation_id"
          ]
          properties = spec["components"]["schemas"]["Problem"]["properties"]
          if "correlationId" in properties:
              properties["correlation_id"] = properties.pop("correlationId")
          for path in (
              "/api/v1/tenants/{tenantId}/clients/{clientId}/grants/{actorId}",
              "/api/v1/tenants/{tenantId}/profiles/{profileId}/grants/{actorId}",
          ):
              spec["paths"][path]["delete"]["requestBody"] = spec["paths"][path]["put"]["requestBody"]
          spec_path.write_text(json.dumps(spec, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit generated files when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' 'Cargo.lock' 'openapi/v1/openapi.json' 'scripts/test-step4-command-guards.py'
          git commit -m "Repository Step 4: apply generated formatting fixes"
          git push origin HEAD:repository-step-4-identity-clients-acl
