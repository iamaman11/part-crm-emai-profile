name: Step 4 Format Fix

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: step4-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Refresh lockfile metadata
        run: cargo metadata --format-version 1 >/dev/null

      - name: Restore accepted Problem field name
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("openapi/v1/openapi.json")
          text = path.read_text(encoding="utf-8")
          text = text.replace('"correlationId"', '"correlation_id"')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit generated files when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' 'Cargo.lock' 'openapi/v1/openapi.json'
          git commit -m "Repository Step 4: apply generated formatting fixes"
          git push origin HEAD:repository-step-4-identity-clients-acl
