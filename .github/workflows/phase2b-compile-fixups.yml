name: Phase 2B Compile Fixups

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2b-client-persistence-contact-crypto
          persist-credentials: true
      - name: Apply compile fixups
        shell: python
        run: |
          from pathlib import Path

          ports = Path('crates/application-ports/src/clients.rs')
          text = ports.read_text(encoding='utf-8')
          marker = '''    pub const fn new(
                  tenant_id: &'a TenantId,
                  kind: ContactKind,
                  normalization_version: ContactNormalizationVersion,
                  hmac_input: &'a ExactLookupHmacInput,
              ) -> Self {
                  Self {
                      tenant_id,
                      kind,
                      normalization_version,
                      hmac_input,
                  }
              }
          '''
          if marker not in text:
              raise SystemExit('exact lookup constructor marker missing')
          text = text.replace(marker, marker + '''
              #[must_use]
              pub const fn key_domain(&self) -> ContactLookupKeyDomain {
                  ContactLookupKeyDomain::TenantExactLookup
              }
          ''', 1)
          text = text.replace(
              '#[allow(async_fn_in_trait)]\n#[derive(Clone, Debug, Eq, PartialEq)]\npub struct ArchiveContactWrite',
              '#[derive(Clone, Debug, Eq, PartialEq)]\npub struct ArchiveContactWrite',
              1,
          )
          text = text.replace(
              'pub trait ProtectedClientContactRepositoryPort {',
              '#[allow(async_fn_in_trait)]\npub trait ProtectedClientContactRepositoryPort {',
              1,
          )
          ports.write_text(text, encoding='utf-8')

          crypto = Path('crates/cloudflare-adapters/src/contact_protection.rs')
          text = crypto.read_text(encoding='utf-8')
          old = '''        let mut plaintext = cipher
              .decrypt(
                  XNonce::from_slice(&nonce_bytes),
                  Payload {
                      msg: encrypted.ciphertext(),
                      aad: &aad,
                  },
              )
              .map_err(|_| ContactCryptoError::AuthenticationFailed)?;
          let decoded = String::from_utf8(plaintext.clone()).map_err(|_| {
              plaintext.zeroize();
              ContactCryptoError::InvalidUtf8
          })?;
          plaintext.zeroize();
          Ok(Zeroizing::new(decoded))
          '''
          new = '''        let plaintext = cipher
              .decrypt(
                  XNonce::from_slice(&nonce_bytes),
                  Payload {
                      msg: encrypted.ciphertext(),
                      aad: &aad,
                  },
              )
              .map_err(|_| ContactCryptoError::AuthenticationFailed)?;
          let decoded = String::from_utf8(plaintext).map_err(|error| {
              let mut bytes = error.into_bytes();
              bytes.zeroize();
              ContactCryptoError::InvalidUtf8
          })?;
          Ok(Zeroizing::new(decoded))
          '''
          if old not in text:
              raise SystemExit('decrypt block marker missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''ContactExactLookupRequest::new(
                      &tenant_a,
                      &contact_id,
                      ContactKind::Email,''',
              '''ContactExactLookupRequest::new(
                      &tenant_a,
                      ContactKind::Email,''',
              1,
          )
          text = text.replace(
              '''ContactExactLookupRequest::new(
                      &tenant_b,
                      &contact_id,
                      ContactKind::Email,''',
              '''ContactExactLookupRequest::new(
                      &tenant_b,
                      ContactKind::Email,''',
              1,
          )
          crypto.write_text(text, encoding='utf-8')
      - name: Format
        run: cargo fmt --all -- --check || cargo fmt --all
      - name: Check Phase 2B inner native
        run: cargo check --locked -p application-ports -p use-cases-clients
      - name: Check Phase 2B adapter native
        run: cargo check --locked -p cloudflare-adapters
      - name: Check Phase 2B adapter and application for Workers target
        run: cargo check --locked -p use-cases-clients -p cloudflare-adapters --target wasm32-unknown-unknown
      - name: Commit checked fixups
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/application-ports/src/clients.rs crates/use-cases-clients/src/contacts.rs crates/cloudflare-adapters/src/contact_protection.rs crates/cloudflare-adapters/src/d1_client_persistence.rs
          git commit -m 'Phase 2B: compile contact application and crypto layers'
          git push origin HEAD:phase2b-client-persistence-contact-crypto
