name: External Evidence Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: external-evidence-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-evidence:
    name: External Evidence Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Compile external evidence policy
        run: python -m py_compile scripts/check-external-evidence.py

      - name: Validate repository external evidence
        run: python scripts/check-external-evidence.py

      - name: Validate canonical fixtures
        run: |
          python scripts/check-external-evidence.py --root tests/external-evidence/fixtures/valid
          python scripts/check-external-evidence.py --root tests/external-evidence/fixtures/valid-passed

      - name: Prove unsafe and invalid fixtures are rejected
        shell: bash
        run: |
          set -euo pipefail
          for fixture in secret-bearing invalid-passed forked-lineage dangling-lineage; do
            if python scripts/check-external-evidence.py --root "tests/external-evidence/fixtures/${fixture}"; then
              echo "Negative fixture unexpectedly passed: ${fixture}" >&2
              exit 1
            fi
          done
