name: External Evidence Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: external-evidence-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-evidence:
    name: External Evidence Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove typed external evidence semantic policy fails closed
        run: cargo test --locked --manifest-path tools/opsctl/Cargo.toml -p opsctl-core external_evidence

      - name: Validate repository evidence, scope, lineage and readiness through strict Rust adapter
        run: cargo test --locked --manifest-path tools/opsctl/Cargo.toml --test external_evidence_policy
