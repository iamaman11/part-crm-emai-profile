name: D1 Migration Prepare

on:
  pull_request:
    paths:
      - 'scripts/d1-prepare.py'
      - '.github/workflows/d1-migration-prepare.yml'
      - 'tools/opsctl/examples/d1-transaction-plan.rs'
      - 'tools/opsctl/examples/d1-current-reconstruction-plan.rs'
      - 'tools/opsctl/src/d1.rs'
      - 'tools/opsctl/src/d1/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/d1-prepare.py'
      - '.github/workflows/d1-migration-prepare.yml'
      - 'tools/opsctl/examples/d1-transaction-plan.rs'
      - 'tools/opsctl/examples/d1-current-reconstruction-plan.rs'
      - 'tools/opsctl/src/d1.rs'
      - 'tools/opsctl/src/d1/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact accepted protected-main source SHA
        required: true
        type: string
      operation_mode:
        description: Credential-free D1 prepare mode
        required: false
        default: migration
        type: choice
        options:
          - migration
          - reconstruction
      component:
        description: D1 component
        required: true
        type: choice
        options:
          - catalog
          - resolver
      ledger_json:
        description: Secret-free observed D1 migration ledger JSON
        required: true
        type: string
      target_release_manifest_json:
        description: Exact target component release manifest JSON
        required: true
        type: string
      current_release_manifest_json:
        description: Exact current component release manifest JSON
        required: true
        type: string
      known_good_release_manifest_json:
        description: Exact last-known-good component release manifest JSON
        required: true
        type: string
      preconditions_json:
        description: Typed D1 preconditions JSON
        required: true
        type: string
      provider_observation_json:
        description: Strict secret-free ProviderObservationInput JSON for the exact target
        required: true
        type: string
      repository_projection_json:
        description: Strict typed D1 repository projection JSON from its natural owner
        required: true
        type: string
      transaction_input_json:
        description: Strict TransactionIdentityInput JSON for an ordinary future transaction
        required: false
        default: '{}'
        type: string
      release_set_id:
        description: Exact CURRENT Release Set identity for reconstruction mode
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  self-test:
    name: Credential-free prepare contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"
      - name: Compile prepare adapter
        run: python -m py_compile scripts/d1-prepare.py
      - name: Exercise ready, blocked, and operator-input fixtures
        run: python scripts/d1-prepare.py self-test
      - name: Prove successful Prepare publishes immutable executor inputs and reconstruction identity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/d1-migration-prepare.yml').read_text(encoding='utf-8')
          executor_artifact_prefix = 'name: d1-executor-' + 'inputs-'
          reconstruction_artifact_prefix = 'name: d1-' + 'reconstruction-'
          assert source.count(executor_artifact_prefix) == 1
          assert source.count(reconstruction_artifact_prefix) == 1
          assert 'path: artifacts/d1-prepare/reconstruction.json' in source
          assert 'd1-current-reconstruction-plan' in source
          assert 'D1_CURRENT_FRESH_ZERO_RECONSTRUCTION' in source
          provider_contract = source.split('expected_keys = {', 1)[1].split('}', 1)[0]
          assert "'remote_migrations'" in provider_contract
          assert "'wrangler_pending_migrations'" not in provider_contract
          for name in ('target-release.json', 'current-release.json', 'known-good-release.json', 'preconditions.json'):
              assert f'artifacts/d1-prepare/{name}' in source
          PY

  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: Exact credential-free prepare
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      OPERATION_MODE: ${{ inputs.operation_mode }}
      COMPONENT: ${{ inputs.component }}
      LEDGER_JSON: ${{ inputs.ledger_json }}
      TARGET_RELEASE_MANIFEST_JSON: ${{ inputs.target_release_manifest_json }}
      CURRENT_RELEASE_MANIFEST_JSON: ${{ inputs.current_release_manifest_json }}
      KNOWN_GOOD_RELEASE_MANIFEST_JSON: ${{ inputs.known_good_release_manifest_json }}
      PRECONDITIONS_JSON: ${{ inputs.preconditions_json }}
      PROVIDER_OBSERVATION_JSON: ${{ inputs.provider_observation_json }}
      REPOSITORY_PROJECTION_JSON: ${{ inputs.repository_projection_json }}
      TRANSACTION_INPUT_JSON: ${{ inputs.transaction_input_json }}
      RELEASE_SET_ID: ${{ inputs.release_set_id }}
    steps:
      - name: Reject non-main or non-exact source before prepare
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$SOURCE_SHA"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$OPERATION_MODE" = migration || test "$OPERATION_MODE" = reconstruction
          test "$COMPONENT" = catalog || test "$COMPONENT" = resolver
          if [ "$OPERATION_MODE" = reconstruction ]; then
            test "$COMPONENT" = catalog
            [[ "$RELEASE_SET_ID" =~ ^release-set-v3-sha256-[0-9a-f]{64}$ ]]
          fi

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Materialize secret-free typed inputs
        run: |
          set -euo pipefail
          mkdir -p artifacts/d1-prepare
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path('artifacts/d1-prepare')
          documents = {
              'ledger.json': os.environ['LEDGER_JSON'],
              'target-release.json': os.environ['TARGET_RELEASE_MANIFEST_JSON'],
              'current-release.json': os.environ['CURRENT_RELEASE_MANIFEST_JSON'],
              'known-good-release.json': os.environ['KNOWN_GOOD_RELEASE_MANIFEST_JSON'],
              'preconditions.json': os.environ['PRECONDITIONS_JSON'],
              'provider-observation.json': os.environ['PROVIDER_OBSERVATION_JSON'],
              'repository-projection.json': os.environ['REPOSITORY_PROJECTION_JSON'],
              'transaction-input.json': os.environ['TRANSACTION_INPUT_JSON'],
          }
          parsed = {}
          for name, raw in documents.items():
              value = json.loads(raw)
              if not isinstance(value, (dict, list)):
                  raise SystemExit(f'{name} must be structured JSON')
              if name != 'ledger.json' and not isinstance(value, dict):
                  raise SystemExit(f'{name} must be one JSON object')
              parsed[name] = value
              (root / name).write_text(json.dumps(value, sort_keys=True, indent=2) + '\n', encoding='utf-8')

          if os.environ['OPERATION_MODE'] == 'reconstruction':
              observation = parsed['provider-observation.json']
              expected_keys = {
                  'schema_version', 'target', 'observed_at_unix_seconds', 'observation_source',
                  'remote_ledger_sha256', 'remote_migrations',
                  'deployment_identity', 'time_travel_bookmark_capable',
              }
              if set(observation) != expected_keys or observation.get('schema_version') != 1:
                  raise SystemExit('reconstruction provider observation does not match ProviderObservationInput v1')
              target = observation.get('target')
              if not isinstance(target, dict) or set(target) != {'environment', 'account_id', 'database_name', 'database_id'}:
                  raise SystemExit('reconstruction target does not match the exact typed target contract')
              if target.get('environment') != 'staging':
                  raise SystemExit('reconstruction target must be staging')
              if observation.get('remote_migrations') != []:
                  raise SystemExit('reconstruction provider observation must have an exactly empty remote ledger')
              canonical = json.dumps({'remote_migrations': []}, sort_keys=True, separators=(',', ':'))
              if hashlib.sha256(canonical.encode()).hexdigest() != observation.get('remote_ledger_sha256'):
                  raise SystemExit('reconstruction provider observation ledger digest is detached from remote_migrations')
              observed_at = observation.get('observed_at_unix_seconds')
              source = observation.get('observation_source')
              if isinstance(observed_at, bool) or not isinstance(observed_at, int) or observed_at <= 0:
                  raise SystemExit('reconstruction observed_at_unix_seconds must be positive')
              if not isinstance(source, str) or not source:
                  raise SystemExit('reconstruction observation_source must be non-empty')
              (root / 'target.json').write_text(json.dumps(target, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build pinned credential-free opsctl and planners
        run: |
          set -euo pipefail
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-transaction-plan
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-current-reconstruction-plan

      - name: Prepare ordinary migration before any mutation authorization
        id: prepare
        if: inputs.operation_mode == 'migration'
        run: |
          set -euo pipefail
          set +e
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            python scripts/d1-prepare.py prepare \
              --opsctl tools/opsctl/target/debug/opsctl \
              --root . \
              --component "$COMPONENT" \
              --ledger-json artifacts/d1-prepare/ledger.json \
              --release-manifest artifacts/d1-prepare/target-release.json \
              --current-manifest artifacts/d1-prepare/current-release.json \
              --known-good-manifest artifacts/d1-prepare/known-good-release.json \
              --preconditions-json artifacts/d1-prepare/preconditions.json \
              --output artifacts/d1-prepare/prepare.json
          rc=$?
          set -e
          test -f artifacts/d1-prepare/prepare.json
          jq -e '.command == "d1 prepare" and .mode == "read-only" and .mutation_executed == false and .provider_mutation_executed == false and .authorization_consumed == false and (.status == "PREPARE_READY" or .status == "PREPARE_BLOCKED")' \
            artifacts/d1-prepare/prepare.json >/dev/null
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Seal immutable ordinary transaction plan before authorization
        if: inputs.operation_mode == 'migration' && steps.prepare.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          jq -e '.status == "PREPARE_READY" and .authorization_consumed == false and .mutation_executed == false and .provider_mutation_executed == false' \
            artifacts/d1-prepare/prepare.json >/dev/null
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-transaction-plan \
              --prepare-json artifacts/d1-prepare/prepare.json \
              --observation-json artifacts/d1-prepare/provider-observation.json \
              --repository-json artifacts/d1-prepare/repository-projection.json \
              --transaction-input-json artifacts/d1-prepare/transaction-input.json \
              --release-manifest-json artifacts/d1-prepare/target-release.json \
              > artifacts/d1-prepare/transaction.json
          jq -e '.status == "TRANSACTION_PREPARED" and .mode == "read-only" and .authorization_consumed == false and .mutation_executed == false and .provider_mutation_executed == false and (.transaction_id | test("^[0-9a-f]{64}$"))' \
            artifacts/d1-prepare/transaction.json >/dev/null
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          jq -e --arg source "$SOURCE_SHA" --arg tree "$tree_sha" \
            '.transaction_plan.source_sha == $source and .transaction_plan.tree_sha == $tree' \
            artifacts/d1-prepare/transaction.json >/dev/null

      - name: Seal immutable CURRENT reconstruction plan before authorization
        id: reconstruction
        if: inputs.operation_mode == 'reconstruction'
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          observed_at="$(jq -er '.observed_at_unix_seconds' artifacts/d1-prepare/provider-observation.json)"
          observation_source="$(jq -er '.observation_source' artifacts/d1-prepare/provider-observation.json)"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-current-reconstruction-plan \
              --root . \
              --ledger-json artifacts/d1-prepare/ledger.json \
              --release-manifest artifacts/d1-prepare/target-release.json \
              --target-json artifacts/d1-prepare/target.json \
              --source-sha "$SOURCE_SHA" \
              --tree-sha "$tree_sha" \
              --release-set-id "$RELEASE_SET_ID" \
              --observed-at-unix-seconds "$observed_at" \
              --observation-source "$observation_source" \
              > artifacts/d1-prepare/reconstruction.json
          jq -e \
            --arg source "$SOURCE_SHA" \
            --arg tree "$tree_sha" \
            --arg release_set "$RELEASE_SET_ID" \
            '.schema_version == 1 and .status == "RECONSTRUCTION_PREPARED" and .mode == "read-only" and .authorization_required == true and .authorization_consumed == false and .mutation_executed == false and .provider_mutation_executed == false and (.reconstruction_id | test("^[0-9a-f]{64}$")) and .plan.kind == "D1_CURRENT_FRESH_ZERO_RECONSTRUCTION" and .plan.disposition == "PREPROD_BASELINE_DRIFT" and .plan.component == "catalog" and .plan.source_sha == $source and .plan.tree_sha == $tree and .plan.release_set_id == $release_set and .plan.allowed_provider_effects == ["D1_BOOTSTRAP_CURRENT_EXACT_CONSTRUCTION"] and (.plan.forbidden_provider_effects | index("D1_MIGRATIONS_APPLY_EXACT_PLAN") != null) and (.plan.forbidden_provider_effects | index("PRODUCTION_MUTATION") != null) and .plan.provider_observation.remote_migrations == []' \
            artifacts/d1-prepare/reconstruction.json >/dev/null

      - name: Upload immutable secret-free prepare evidence
        if: always() && inputs.operation_mode == 'migration' && steps.prepare.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-prepare-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-prepare/prepare.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable ordinary transaction identity artifact
        if: inputs.operation_mode == 'migration' && steps.prepare.outputs.exit_code == '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-transaction-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-prepare/transaction.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable CURRENT reconstruction identity artifact
        if: inputs.operation_mode == 'reconstruction' && steps.reconstruction.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-reconstruction-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/d1-prepare/reconstruction.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload immutable executor input bundle
        if: (inputs.operation_mode == 'migration' && steps.prepare.outputs.exit_code == '0') || (inputs.operation_mode == 'reconstruction' && steps.reconstruction.outcome == 'success')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-executor-inputs-${{ inputs.component }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/d1-prepare/target-release.json
            artifacts/d1-prepare/current-release.json
            artifacts/d1-prepare/known-good-release.json
            artifacts/d1-prepare/preconditions.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed when ordinary prepare is blocked
        if: inputs.operation_mode == 'migration' && steps.prepare.outputs.exit_code != '0'
        run: |
          set -euo pipefail
          jq -e '.status == "PREPARE_BLOCKED" and (.gate_results | length) > 0' artifacts/d1-prepare/prepare.json >/dev/null
          test ! -e artifacts/d1-prepare/transaction.json
          reason="$(jq -r '.gate_results[0].reason_code' artifacts/d1-prepare/prepare.json)"
          echo "::error title=PREPARE_BLOCKED::credential-free D1 prepare blocked reason_code=$reason"
          exit 3
