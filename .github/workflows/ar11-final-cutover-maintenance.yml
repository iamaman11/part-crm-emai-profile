name: AR-11 Final Cutover Maintenance

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ar11-final-cutover-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cutover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/ar11-release-capability-promotion' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact AR-11 candidate
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded AR-11 authority cutover
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1. Make accepted-main evidence cryptographically derive from source identity.
          model = Path('tools/opsctl/src/release/model.rs')
          text = model.read_text()
          needle = '''    validate_sha256_like(\n        &accepted_main_evidence_sha256,\n        "source.accepted_main_evidence_sha256",\n    )?;\n    Ok(ReleaseSetSource {\n'''
          replacement = '''    validate_sha256_like(\n        &accepted_main_evidence_sha256,\n        "source.accepted_main_evidence_sha256",\n    )?;\n    let accepted_main_identity = serde_json::json!({\n        "authority": "accepted-main",\n        "commit_sha": commit_sha,\n        "repository": repository,\n    });\n    let canonical = canonical_json(&accepted_main_identity).map_err(ReleaseModelError::new)?;\n    let expected_evidence = sha256_hex(canonical.as_bytes());\n    if accepted_main_evidence_sha256 != expected_evidence {\n        return Err(ReleaseModelError::new(\n            "SOURCE_NOT_ACCEPTED: accepted-main evidence does not bind repository and commit SHA",\n        ));\n    }\n    Ok(ReleaseSetSource {\n'''
          if needle not in text:
              raise SystemExit('Release Set accepted-main evidence insertion point drifted')
          model.write_text(text.replace(needle, replacement, 1))

          # 2. Extend frozen AR-6 + AR-10 estate through an explicit AR-11 overlay.
          estate = Path('scripts/python-estate-ar6.py')
          text = estate.read_text()
          text = text.replace(
              'AR10_OVERLAY = ROOT / "architecture" / "python-estate-ar10.json"\nSCHEMA_VERSION = 1',
              'AR10_OVERLAY = ROOT / "architecture" / "python-estate-ar10.json"\nAR11_OVERLAY = ROOT / "architecture" / "python-estate-ar11.json"\nSCHEMA_VERSION = 1',
              1,
          )
          insertion = '''\n\ndef apply_ar11_overlay(rows: list[dict[str, Any]]) -> tuple[list[dict[str, Any]], dict[str, Any]]:\n    overlay = load_json(AR11_OVERLAY)\n    if (\n        overlay.get("schema_version") != 1\n        or overlay.get("status") != "AR11_CURRENT_PYTHON_ESTATE_OVERLAY"\n        or overlay.get("owning_slice") != "AR-11"\n        or overlay.get("parent_overlay") != "architecture/python-estate-ar10.json"\n    ):\n        fail("AR-11 Python estate overlay identity/version drifted")\n    policy = overlay.get("policy")\n    if not isinstance(policy, dict):\n        fail("AR-11 Python estate overlay policy is missing")\n    for field, expected in {\n        "global_python_to_rust_rewrite": False,\n        "baseline_rewrite_allowed": False,\n        "unknown_delta_policy": "FAIL_CLOSED",\n        "production_mutation": False,\n        "operational_provider_mutator_must_be_rust": True,\n    }.items():\n        if policy.get(field) != expected:\n            fail(f"AR-11 Python estate overlay policy drifted: {field}")\n    by_path = {row["path"]: copy.deepcopy(row) for row in rows}\n    retirements = overlay.get("retirements")\n    if not isinstance(retirements, list) or len(retirements) != len(set(retirements)):\n        fail("AR-11 Python retirements must be a unique array")\n    for path in retirements:\n        row = by_path.get(path)\n        if (\n            not isinstance(path, str)\n            or row is None\n            or row.get("classification") != "MIGRATE_TO_RUST"\n            or row.get("cutover_slice") != "AR-11"\n        ):\n            fail(f"AR-11 may retire only its accepted MIGRATE_TO_RUST cohort: {path}")\n        del by_path[path]\n    additions = overlay.get("additions")\n    if not isinstance(additions, list):\n        fail("AR-11 Python additions must be an array")\n    for row in additions:\n        if not isinstance(row, dict):\n            fail("AR-11 Python addition must be an object")\n        path = row.get("path")\n        required = ("path", "classification", "role", "side_effect_class", "authority", "rationale")\n        if (\n            not isinstance(path, str)\n            or not path\n            or path in by_path\n            or row.get("classification") != "KEEP_PYTHON"\n            or any(not isinstance(row.get(field), str) or not row[field] for field in required)\n        ):\n            fail(f"AR-11 Python addition is malformed/unreviewed: {path!r}")\n        by_path[path] = copy.deepcopy(row)\n    current = sorted(by_path.values(), key=lambda row: row["path"])\n    counts = {name: 0 for name in sorted(ALLOWED)}\n    for row in current:\n        counts[row["classification"]] += 1\n    expected_summary = {"tracked_python_files": len(current), **counts}\n    if overlay.get("current_summary") != expected_summary:\n        fail(\n            "AR-11 Python estate current_summary drifted: "\n            f"expected={expected_summary}, observed={overlay.get('current_summary')}"\n        )\n    return current, overlay\n'''
          marker = '\n\ndef _import_names(tree: ast.AST) -> set[str]:\n'
          if 'def apply_ar11_overlay(' not in text:
              if marker not in text:
                  raise SystemExit('Python estate AR-11 insertion point drifted')
              text = text.replace(marker, insertion + marker, 1)
          old_build = '''    rows = build_current_rows(baseline_rows, additions, retirements)\n    tracked = tracked_python(root)\n'''
          new_build = '''    rows = build_current_rows(baseline_rows, additions, retirements)\n    rows, ar11_overlay = apply_ar11_overlay(rows)\n    tracked = tracked_python(root)\n'''
          if old_build not in text:
              raise SystemExit('Python estate build insertion point drifted')
          text = text.replace(old_build, new_build, 1)
          old_summary = '''    if overlay.get("current_summary") != summary:\n        fail(\n            "AR-10 Python estate overlay current_summary drifted: "\n            f"expected={summary}, observed={overlay.get('current_summary')}"\n        )\n    return {\n        "schema_version": 1,\n        "status": "CURRENT_PYTHON_ESTATE_VIA_AR6_BASELINE_PLUS_AR10_OVERLAY",\n        "accepted_program_checkpoint": "AR-6",\n        "current_owning_slice": "AR-10",\n'''
          new_summary = '''    if ar11_overlay.get("current_summary") != summary:\n        fail(\n            "AR-11 Python estate overlay current_summary drifted: "\n            f"expected={summary}, observed={ar11_overlay.get('current_summary')}"\n        )\n    return {\n        "schema_version": 1,\n        "status": "CURRENT_PYTHON_ESTATE_VIA_AR6_BASELINE_PLUS_AR10_AR11_OVERLAYS",\n        "accepted_program_checkpoint": "AR-6",\n        "current_owning_slice": "AR-11",\n'''
          if old_summary not in text:
              raise SystemExit('Python estate summary insertion point drifted')
          estate.write_text(text.replace(old_summary, new_summary, 1))

          # 3. Current runtime/successor gates must require completed cutover, not pre-cutover mode.
          for relative in [
              'scripts/check-cloudflare-runtime-bindings.py',
              '.github/scripts/ar8-d-secret-transport-successor.mjs',
          ]:
              path = Path(relative)
              current = path.read_text()
              current = current.replace('run_checker(AR11_CHECKER, "--pre-cutover")', 'run_checker(AR11_CHECKER)')
              current = current.replace("run('node', [AR11_CHECKER, '--pre-cutover'], { check: false })", "run('node', [AR11_CHECKER], { check: false })")
              path.write_text(current)

          # 4. Quality Gate: retire current Python mutator references and validate AR-11 successor.
          quality = Path('.github/workflows/quality-gate.yml')
          text = quality.read_text()
          text = text.replace('          scripts/mailbox-secret-resolver-promotion.py\n', '')
          anchor = '          scripts/mailbox-secret-resolver-release.py\n'
          additions = ''.join(f'          {value}\n' for value in [
              'scripts/release-set-ar11.py',
              'scripts/release-compat-evidence-ar11.py',
              'scripts/release-core-overlay-ar11.py',
              'scripts/deployment-snapshot-ar11.py',
              'scripts/deployment-identity-ar11.py',
          ])
          if additions not in text:
              text = text.replace(anchor, anchor + additions, 1)
          old = '''          python scripts/check-pre2j-d3-resolver-bootstrap-implementation.py --self-test\n          python scripts/mailbox-secret-resolver-release.py self-test\n          python scripts/mailbox-secret-resolver-promotion.py self-test\n'''
          new = '''          python scripts/check-pre2j-d3-resolver-bootstrap-implementation.py --self-test\n          python scripts/mailbox-secret-resolver-release.py self-test\n          node .github/scripts/ar8-d-secret-transport-successor.mjs\n          node .github/scripts/ar8-d-secret-transport-successor.mjs --self-test\n          node .github/scripts/release-operational-ar11.mjs\n          node .github/scripts/release-operational-ar11.mjs --self-test\n          python scripts/release-set-ar11.py self-test\n          python scripts/release-compat-evidence-ar11.py --self-test\n          python scripts/release-core-overlay-ar11.py --self-test\n          python scripts/deployment-snapshot-ar11.py --self-test\n'''
          if old not in text:
              raise SystemExit('Quality Gate D3 successor block drifted')
          quality.write_text(text.replace(old, new, 1))

          # 5. Permanent AR-11 gate owns positive/negative operational/static adapters.
          gate = Path('.github/workflows/release-architecture-gate.yml')
          text = gate.read_text()
          anchor = '''          node .github/scripts/release-architecture-ar11.mjs --self-test\n          node .github/scripts/frontend-capability-ar11.mjs\n'''
          expanded = anchor + '''          node .github/scripts/release-operational-ar11.mjs\n          node .github/scripts/release-operational-ar11.mjs --self-test\n          node .github/scripts/ar8-d-secret-transport-successor.mjs\n          python scripts/release-set-ar11.py self-test\n          python scripts/release-compat-evidence-ar11.py --self-test\n          python scripts/release-core-overlay-ar11.py --self-test\n          python scripts/deployment-snapshot-ar11.py --self-test\n'''
          if 'release-operational-ar11.mjs --self-test' not in text:
              if anchor not in text:
                  raise SystemExit('Release Architecture Gate insertion point drifted')
              text = text.replace(anchor, expanded, 1)
          gate.write_text(text)

          # 6. Canonical Actions registry must describe the post-cutover workflow surface.
          registry = Path('.github/scripts/github-actions-registry.mjs')
          text = registry.read_text()
          replacements = [
              ("registrations.length === 20, 'registry policy must classify exactly 20 current active registrations'", "registrations.length === 21, 'registry policy must classify exactly 21 current active registrations'"),
              ("entry.category === 'PERMANENT_REQUIRED').length === 19, 'registry policy must classify exactly 19 permanent workflows'", "entry.category === 'PERMANENT_REQUIRED').length === 20, 'registry policy must classify exactly 20 permanent workflows'"),
              ("registrations.some((entry) => entry.path === '.github/workflows/mailbox-secret-resolver-promotion.yml' && entry.category === 'CURRENT_MANUAL_OPERATION'), 'Mailbox Secret Resolver Promotion must remain the current manual operation'", "registrations.some((entry) => entry.path === '.github/workflows/release-set-promotion.yml' && entry.category === 'CURRENT_MANUAL_OPERATION'), 'Release Set Promotion must be the single current manual operation'"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Actions registry cutover insertion drifted: {old}')
              text = text.replace(old, new, 1)
          registry.write_text(text)
          PY

          git rm --ignore-unmatch \
            .github/workflows/mailbox-secret-resolver-promotion.yml \
            scripts/mailbox-secret-resolver-promotion.py \
            scripts/_mailbox_secret_resolver_promotion_core.py \
            .github/workflows/ar11-rustfmt-once.yml

          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          python -m py_compile \
            scripts/python-estate-ar6.py \
            scripts/check-cloudflare-runtime-bindings.py \
            scripts/release-set-ar11.py \
            scripts/release-compat-evidence-ar11.py \
            scripts/release-core-overlay-ar11.py \
            scripts/deployment-snapshot-ar11.py \
            scripts/deployment-identity-ar11.py
          python scripts/python-estate-ar6.py --check
          node .github/scripts/release-operational-ar11.mjs
          node .github/scripts/release-operational-ar11.mjs --self-test
          node .github/scripts/ar8-d-secret-transport-successor.mjs
          node .github/scripts/ar8-d-secret-transport-successor.mjs --self-test
          python scripts/check-cloudflare-runtime-bindings.py
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py --check
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Enforce exact maintenance path allowlist and self-remove
        run: |
          set -euo pipefail
          git rm .github/workflows/ar11-final-cutover-maintenance.yml
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          printf '%s\n' "$changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ar11-final-cutover-maintenance.yml|\
              .github/workflows/ar11-rustfmt-once.yml|\
              .github/workflows/mailbox-secret-resolver-promotion.yml|\
              .github/workflows/quality-gate.yml|\
              .github/workflows/release-architecture-gate.yml|\
              .github/scripts/ar8-d-secret-transport-successor.mjs|\
              .github/scripts/github-actions-registry.mjs|\
              scripts/mailbox-secret-resolver-promotion.py|\
              scripts/_mailbox_secret_resolver_promotion_core.py|\
              scripts/python-estate-ar6.py|\
              scripts/check-cloudflare-runtime-bindings.py|\
              tools/opsctl/src/release/model.rs|\
              tools/opsctl/src/release/compatibility.rs|\
              tools/opsctl/src/release/static_compatibility.rs|\
              tools/opsctl/src/promotion/preflight.rs|\
              architecture/inventory.json) ;;
              '') ;;
              *) echo "unexpected AR-11 final cutover path: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          node .github/scripts/github-actions-registry.mjs contract
          node .github/scripts/github-actions-registry.mjs self-test

      - name: Commit verified cutover without generated build artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/quality-gate.yml \
            .github/workflows/release-architecture-gate.yml \
            .github/scripts/ar8-d-secret-transport-successor.mjs \
            .github/scripts/github-actions-registry.mjs \
            scripts/python-estate-ar6.py \
            scripts/check-cloudflare-runtime-bindings.py \
            tools/opsctl/src/release/model.rs \
            tools/opsctl/src/release/compatibility.rs \
            tools/opsctl/src/release/static_compatibility.rs \
            tools/opsctl/src/promotion/preflight.rs \
            architecture/inventory.json
          unstaged="$(git diff --name-only)"
          if [[ -n "$unstaged" ]]; then
            printf 'unstaged AR-11 cutover paths remain:\n%s\n' "$unstaged" >&2
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            printf 'unexpected untracked files after AR-11 cutover:\n%s\n' "$untracked" >&2
            exit 1
          fi
          cached="$({ git diff --cached --name-only; } | sort -u)"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ar11-final-cutover-maintenance.yml|\
              .github/workflows/ar11-rustfmt-once.yml|\
              .github/workflows/mailbox-secret-resolver-promotion.yml|\
              .github/workflows/quality-gate.yml|\
              .github/workflows/release-architecture-gate.yml|\
              .github/scripts/ar8-d-secret-transport-successor.mjs|\
              .github/scripts/github-actions-registry.mjs|\
              scripts/mailbox-secret-resolver-promotion.py|\
              scripts/_mailbox_secret_resolver_promotion_core.py|\
              scripts/python-estate-ar6.py|\
              scripts/check-cloudflare-runtime-bindings.py|\
              tools/opsctl/src/release/model.rs|\
              tools/opsctl/src/release/compatibility.rs|\
              tools/opsctl/src/release/static_compatibility.rs|\
              tools/opsctl/src/promotion/preflight.rs|\
              architecture/inventory.json) ;;
              '') ;;
              *) echo "unexpected staged AR-11 final cutover path: $file" >&2; exit 1 ;;
            esac
          done <<< "$cached"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'AR-11: cut over D3 promotion authority to Rust'
          git push origin HEAD:agent/ar11-release-capability-promotion
