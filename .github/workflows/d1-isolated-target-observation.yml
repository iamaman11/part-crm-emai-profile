name: D1 Isolated Target Observation

on:
  pull_request:
    paths:
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-operator.yml'
      - 'scripts/d1-cloudflare-read.py'
      - 'scripts/d1-prepare.py'
      - 'scripts/deployment-identity-ar11.py'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation_mode:
        description: 'Observation mode; reconstruction continues the machine-owned reconstruction state machine'
        required: false
        default: current
        type: choice
        options:
          - current
          - reconstruction
      time_travel_unix_seconds:
        description: 'Optional exact Unix-seconds timestamp for read-only D1 Time Travel bookmark lookup'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: d1-isolated-target-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  D1_COMPONENT: catalog

jobs:
  contract:
    name: Isolated D1 observation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove current-target observation remains read-only and facts-only
        run: |
          set -euo pipefail
          python scripts/d1-executor-plan.py self-test
          python scripts/d1-cloudflare-read.py self-test
          python scripts/d1-prepare.py self-test
          python scripts/deployment-identity-ar11.py --self-test
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('.github/workflows/d1-isolated-target-observation.yml').read_text(encoding='utf-8')
          adapter = Path('scripts/d1-cloudflare-read.py').read_text(encoding='utf-8')
          forbidden_effect_surfaces = (
              'secrets.' + 'CLOUDFLARE_API_TOKEN',
              'd1 migrations' + ' apply',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1 time-travel' + ' restore',
              'd1-migration-executor.yml' + '/dispatches',
          )
          for forbidden in forbidden_effect_surfaces:
              assert forbidden not in source, f'read-only D1 observer contains forbidden effect surface: {forbidden}'
          forbidden_rehearsal_identity = (
              'D1_' + 'REHEARSAL_',
              'part-crm-' + 'd3a-bootstrap-proof',
              '713dd6f2-' + '646b-46ad-93eb-103d2d0b63c4',
          )
          for forbidden in forbidden_rehearsal_identity:
              assert forbidden not in source, f'consumed rehearsal identity remains in standard observer: {forbidden}'
          forbidden_stage_policy = (
              '0026_' + 'outbound_mail_intents.sql',
              '0031_' + 'device_binding_governance.sql',
              '0032_' + 'pas2_payload_fingerprint_contract.sql',
              'post_' + 'apply_invariants',
              'exact_' + 'ordinary_revision',
              'protected_' + 'contract_absent',
          )
          for forbidden in forbidden_stage_policy:
              assert forbidden not in source, f'D1 observer acquired stage-specific migration policy: {forbidden}'
          trigger = source.split('\npermissions:', 1)[0]
          push_block = trigger.split('\n  push:', 1)[1].split('\n  workflow_dispatch:', 1)[0]
          dispatch_block = trigger.split('\n  workflow_dispatch:', 1)[1]
          observe_source = source.split('\n  observe:', 1)[1]
          authority_source = observe_source.split('\n      - name: Resolve machine-owned exact reconstruction authority', 1)[1].split('\n      - name: Observe exact current staging Catalog with canonical Cloudflare D1 Read API', 1)[0]
          assert re.search(r'PR #[0-9]+', authority_source) is None, 'reconstruction authority must not depend on historical implementation PR numbers'
          assert "checkpoint.get('author_association')" in authority_source
          assert "'PROTECTED_MAIN'" in authority_source
          assert "'ACTIVE_RECONSTRUCTION_ID'" in authority_source
          assert "'NEW_D1_RECONSTRUCTION_AUTHORIZED'" in authority_source
          assert "values['NEW_D1_RECONSTRUCTION_AUTHORIZED'] != 'YES'" in authority_source
          assert 'fresh-zero reconstruction is not explicitly authorized' in authority_source
          assert 'RECOVERY_REQUIRED' in authority_source and 'FAIL_FORWARD_ONLY' in authority_source
          assert "'account_id'" in authority_source and "'database_name'" in authority_source and "'database_id'" in authority_source
          assert "'canonical_empty_ledger_sha256'" in authority_source and "'canonical_predecessor_sha256'" in authority_source
          assert '\n    branches:\n      - main' in push_block
          assert '\n    paths:' not in push_block, 'exact-main observation must not be path-filtered'
          assert '\n    inputs:\n      operation_mode:' in dispatch_block
          assert '\n      time_travel_unix_seconds:' in dispatch_block
          assert 'required: false' in dispatch_block and 'type: string' in dispatch_block
          assert '\n      operation_mode:' in dispatch_block
          assert '\n      target_database_name:' not in dispatch_block
          assert '\n      target_database_id:' not in dispatch_block
          assert '\n      release_set_id:' not in dispatch_block
          assert "D1_COMPONENT: catalog" in source
          assert "d1_database_name // .d1_database_name" in observe_source
          assert "workers/scripts/$worker_name/deployments" in observe_source
          assert 'deployment-identity-ar11.py' in observe_source
          assert 'python scripts/d1-cloudflare-read.py observe' in observe_source
          assert 'wrangler@4.94.0' not in observe_source
          assert 'npx --yes wrangler' not in observe_source
          assert 'actions/setup-node@' not in observe_source
          assert "opsctl='tools/opsctl/target/debug/opsctl'" in source
          assert 'd1-execution-control' in observe_source
          assert 'RECOVERY_REQUIRED_CONFIRMED' in observe_source
          assert 'expected_post_state_reached == true' in observe_source
          assert 'RECON_RECOVERY' in observe_source
          assert 'executable_schema_authority' in adapter
          assert '--sql' not in adapter
          assert 'SELECT name FROM sqlite_master' in adapter
          assert 'SELECT id, name FROM d1_migrations ORDER BY id' in adapter
          assert 'PRAGMA foreign_key_check' in adapter
          assert 'PRAGMA quick_check' in adapter
          assert 'subparsers.add_parser("restore")' not in adapter
          assert 'pre_migration_runtime_schema_contract' not in observe_source
          assert 'release_schema_contract' in source
          assert 'CURRENT_DEPLOYED_IMMUTABLE_RELEASE_SCHEMA_CONTRACT' in observe_source
          assert '--current-manifest "$root/current-runtime-manifest.json"' in source
          assert '--known-good-manifest "$root/known-good-runtime-manifest.json"' in source
          assert 'D1_CLOUDFLARE_READ_CONTRACT_V1' in observe_source
          assert 'D1_CURRENT_TARGET_OBSERVATION' in observe_source
          assert "'wrangler_pending_migrations': pending" in observe_source
          assert 'D1_DATABASE_INVENTORY_OBSERVATION_V1' in observe_source
          assert 'database-inventory.json' in observe_source
          assert "'inventory_complete': True" in observe_source
          assert "'provider_mutation': False" in observe_source
          assert "'d1_mutation': False" in observe_source
          assert "'production_mutation': False" in observe_source
          assert 'gh release download' not in observe_source
          assert 'browser_download_url' in observe_source
          assert '--retry-all-errors' in observe_source
          assert 'sha256sum' in observe_source
          assert 'CURRENT_CHECKPOINT' in observe_source
          assert 'issues/266' in observe_source
          assert 'd1-migration-prepare.yml' in observe_source
          assert 're' + 'construct:' not in source
          artifact_name = 'd1-transaction-preflight-' + '$' + '{{ github.run_id }}-' + '$' + '{{ github.run_attempt }}-' + '$' + '{{ github.sha }}'
          assert artifact_name in source
          recovery_artifact = 'd1-reconstruction-recovery-' + '$' + '{{ github.run_id }}-' + '$' + '{{ github.run_attempt }}-' + '$' + '{{ github.sha }}'
          assert recovery_artifact in source
          PY

  observe:
    name: Isolated D1 target hosted observation and preflight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      actions: write
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Verify exact accepted-main read-only context
        env:
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_TIME_TRAVEL_UNIX_SECONDS: ${{ github.event.inputs.time_travel_unix_seconds || '' }}
          OPERATION_MODE: ${{ inputs.operation_mode || 'current' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$D1_COMPONENT" = catalog
          if [ -n "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" ]; then
            python - "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" <<'PY'
          import re, sys
          if re.fullmatch(r'[0-9]{10}', sys.argv[1]) is None:
              raise SystemExit('time_travel_unix_seconds must be exactly 10 decimal Unix-seconds digits')
          PY
          fi

      - name: Resolve machine-owned exact reconstruction authority
        if: github.event_name == 'workflow_dispatch' && inputs.operation_mode == 'reconstruction'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          authority="$RUNNER_TEMP/d1-reconstruction-authority"
          mkdir -p "$authority"
          gh api "repos/$GITHUB_REPOSITORY/issues/266" > "$authority/issue-266.json"
          python - "$authority/issue-266.json" "$SOURCE_SHA" "$authority/target.json" <<'PY'
          import json, re, sys
          issue_path, source_sha, output_path = sys.argv[1:]
          body = json.load(open(issue_path, encoding='utf-8')).get('body') or ''
          values = {}
          for line in body.splitlines():
              if ' = ' in line:
                  name, value = line.split(' = ', 1)
                  values.setdefault(name.strip(), value.strip())
          required = ('CURRENT_STAGE', 'CURRENT_STAGE_ISSUE', 'PROTECTED_MAIN', 'CURRENT_CHECKPOINT', 'ACTIVE_RECONSTRUCTION_ID', 'NEW_D1_RECONSTRUCTION_AUTHORIZED', 'account_id', 'database_name', 'database_id')
          if any(name not in values for name in required):
              raise SystemExit('CURRENT authority is missing an exact required field')
          if values['CURRENT_STAGE'] != 'V2' or values['CURRENT_STAGE_ISSUE'] != '#584':
              raise SystemExit('CURRENT authority is not bound to V2 / Issue #584')
          if values['PROTECTED_MAIN'] != source_sha or re.fullmatch(r'[0-9a-f]{40}', values['PROTECTED_MAIN']) is None:
              raise SystemExit('CURRENT authority protected main does not match exact workflow source')
          checkpoint = re.match(r'#584\s*/\s*([0-9]+)\b', values['CURRENT_CHECKPOINT'])
          if checkpoint is None:
              raise SystemExit('CURRENT authority checkpoint is not #584 / comment id')
          if re.fullmatch(r'[0-9a-f]{32}', values['account_id']) is None:
              raise SystemExit('CURRENT authority account id is invalid')
          if re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', values['database_id']) is None:
              raise SystemExit('CURRENT authority database id is invalid')
          active = values['ACTIVE_RECONSTRUCTION_ID']
          recovery = False
          reconstruction_id = ''
          if active != 'NONE':
              match = re.fullmatch(r'([0-9a-f]{64}) / RECOVERY_REQUIRED / FAIL_FORWARD_ONLY', active)
              if match is None:
                  raise SystemExit('active reconstruction state is neither NONE nor exact fail-forward recovery')
              recovery = True
              reconstruction_id = match.group(1)
          elif values['NEW_D1_RECONSTRUCTION_AUTHORIZED'] != 'YES':
              raise SystemExit('fresh-zero reconstruction is not explicitly authorized by CURRENT authority')
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump({
                  'account_id': values['account_id'],
                  'database_name': values['database_name'],
                  'database_id': values['database_id'],
                  'checkpoint_comment_id': checkpoint.group(1),
                  'recovery': recovery,
                  'reconstruction_id': reconstruction_id,
              }, handle, sort_keys=True)
          PY
          checkpoint_id="$(jq -er '.checkpoint_comment_id' "$authority/target.json")"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$checkpoint_id" > "$authority/checkpoint.json"
          jq -e --arg checkpoint_id "$checkpoint_id" '.id | tostring == $checkpoint_id' "$authority/checkpoint.json" >/dev/null
          python - "$authority/checkpoint.json" "$authority/target.json" "$SOURCE_SHA" <<'PY'
          import json, re, sys
          checkpoint_path, target_path, source_sha = sys.argv[1:]
          checkpoint = json.load(open(checkpoint_path, encoding='utf-8'))
          target = json.load(open(target_path, encoding='utf-8'))
          if checkpoint.get('author_association') != 'OWNER':
              raise SystemExit('CURRENT checkpoint comment is not OWNER-authored authority')
          issue_url = checkpoint.get('issue_url')
          if not isinstance(issue_url, str) or not issue_url.endswith('/issues/584'):
              raise SystemExit('CURRENT checkpoint comment is not owned by Issue #584')
          body = checkpoint.get('body') or ''
          if 'V2.3B' not in body:
              raise SystemExit('CURRENT checkpoint comment does not bind V2.3B')
          values = {}
          for line in body.splitlines():
              if ' = ' in line:
                  name, value = line.split(' = ', 1)
                  values.setdefault(name.strip(), value.strip())
          if target['recovery']:
              if values.get('PROTECTED_MAIN') != source_sha:
                  raise SystemExit('recovery checkpoint is not rebound to exact current protected main')
              if values.get('account_id') != target['account_id'] or values.get('database_name') != target['database_name'] or values.get('database_id') != target['database_id']:
                  raise SystemExit('recovery checkpoint target identity drifted')
              if values.get('reconstruction_id') != target['reconstruction_id']:
                  raise SystemExit('recovery checkpoint reconstruction_id drifted')
              prepared = values.get('prepared_run', '')
              executor = values.get('executor_run', '')
              effect_source = values.get('reconstruction_source_sha', '')
              release_set = values.get('reconstruction_release_set_id', '')
              if re.fullmatch(r'[1-9][0-9]*', prepared) is None or re.fullmatch(r'[1-9][0-9]*', executor) is None:
                  raise SystemExit('recovery checkpoint prepare/executor run identity is invalid')
              if re.fullmatch(r'[0-9a-f]{40}', effect_source) is None:
                  raise SystemExit('recovery checkpoint effect source is invalid')
              if re.fullmatch(r'release-set-v3-sha256-[0-9a-f]{64}', release_set) is None:
                  raise SystemExit('recovery checkpoint Release Set identity is invalid')
              if values.get('SECOND_RECONSTRUCTION_AUTHORIZED') != 'NO' or values.get('EXECUTOR_RERUN_AUTHORIZED') != 'NO':
                  raise SystemExit('recovery checkpoint does not preserve the no-retry boundary')
              target.update({
                  'prepared_run_id': prepared,
                  'executor_run_id': executor,
                  'effect_source_sha': effect_source,
                  'release_set_id': release_set,
              })
              with open(target_path, 'w', encoding='utf-8') as handle:
                  json.dump(target, handle, sort_keys=True)
          else:
              expected = {
                  'PROTECTED_MAIN': source_sha,
                  'account_id': target['account_id'],
                  'database_name': target['database_name'],
                  'database_id': target['database_id'],
              }
              for name, value in expected.items():
                  if values.get(name) != value:
                      raise SystemExit(f'CURRENT checkpoint semantic identity mismatch: {name}')
              empty_ledger_sha256 = '18bb30916ec8d7c0eaa18e5ebebdc9b5284fe07cfbf9db69aeaee3bee3211bf2'
              checkpoint_fingerprints = {
                  values.get('canonical_empty_ledger_sha256'),
                  values.get('canonical_predecessor_sha256'),
              }
              if empty_ledger_sha256 not in checkpoint_fingerprints:
                  raise SystemExit('CURRENT checkpoint does not bind the canonical fresh-zero ledger fingerprint')
          PY
          branch_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$branch_sha" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.protected' | grep -qx true
          if [ "$(jq -r '.recovery' "$authority/target.json")" = true ]; then
            jq -r '"RECON_RECOVERY=true", "RECON_ACCOUNT_ID=\(.account_id)", "RECON_DATABASE_NAME=\(.database_name)", "RECON_DATABASE_ID=\(.database_id)", "RECON_RECONSTRUCTION_ID=\(.reconstruction_id)", "RECON_PREPARED_RUN_ID=\(.prepared_run_id)", "RECON_EXECUTOR_RUN_ID=\(.executor_run_id)", "RECON_EFFECT_SOURCE_SHA=\(.effect_source_sha)", "RECON_RELEASE_SET_ID=\(.release_set_id)"' "$authority/target.json" >> "$GITHUB_ENV"
          else
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.target_commitish == env.SOURCE_SHA and (.tag_name | startswith("release-set-v3-sha256-")) and .draft == false and .prerelease == false) | .tag_name' > "$authority/release-tags.txt"
            release_set_id="$(python - "$authority/release-tags.txt" <<'PY'
          import sys
          matches = [line.strip() for line in open(sys.argv[1], encoding='utf-8') if line.strip()]
          if len(matches) != 1:
              raise SystemExit(f'exact current Release Set is missing/ambiguous: {matches!r}')
          print(matches[0])
          PY
            )"
            jq -r --arg release_set_id "$release_set_id" '"RECON_RECOVERY=false", "RECON_ACCOUNT_ID=\(.account_id)", "RECON_DATABASE_NAME=\(.database_name)", "RECON_DATABASE_ID=\(.database_id)", "RECON_RELEASE_SET_ID=\($release_set_id)"' "$authority/target.json" >> "$GITHUB_ENV"
          fi

      - name: Observe exact current staging Catalog with canonical Cloudflare D1 Read API
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_TIME_TRAVEL_UNIX_SECONDS: ${{ github.event.inputs.time_travel_unix_seconds || '' }}
          OPERATION_MODE: ${{ inputs.operation_mode || 'current' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077

          raw="$RUNNER_TEMP/d1-current-target-observation"
          evidence="artifacts/d1-current-target-observation"
          mkdir -p "$raw" "$evidence"
          manifest="$raw/deploy-manifest.json"
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$manifest"

          account_id="$(jq -er '.control_plane.account_id // .account_id | select(type == "string" and length == 32)' "$manifest")"
          target_name="$(jq -er '.control_plane.d1_database_name // .d1_database_name | select(type == "string" and length > 0)' "$manifest")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name | select(type == "string" and length > 0)' "$manifest")"
          if [ "$OPERATION_MODE" = reconstruction ]; then
            test "$account_id" = "$RECON_ACCOUNT_ID"
            account_id="$RECON_ACCOUNT_ID"
            target_name="$RECON_DATABASE_NAME"
            test "$target_name" != 'part-crm-catalog-production'
          fi

          test "$target_name" != 'part-crm-catalog-production'

          env -u CLOUDFLARE_OBSERVE_API_TOKEN -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            > "$raw/d1-repository.json"

          verify_code="$(curl --silent --show-error --output "$raw/token-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and .result.status == "active"' "$raw/token-verify.json" >/dev/null

          inventory_code="$(curl --silent --show-error --output "$raw/d1-databases.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database?per_page=100")"
          test "$inventory_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result | type == "array") and ((.result_info.total_pages // 1) == 1)' "$raw/d1-databases.json" >/dev/null

          if [ "$OPERATION_MODE" = reconstruction ]; then
            target_id="$RECON_DATABASE_ID"
            python - "$raw/d1-databases.json" "$target_name" "$target_id" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          expected = {'name': sys.argv[2], 'uuid': sys.argv[3]}
          matches = [item for item in value.get('result', []) if isinstance(item, dict) and item.get('name') == expected['name'] and item.get('uuid') == expected['uuid']]
          if len(matches) != 1:
              raise SystemExit('fresh complete D1 inventory does not prove exactly one exact reconstruction target name+UUID record')
          PY
          else
            target_id="$(python - "$raw/d1-databases.json" "$target_name" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          name = sys.argv[2]
          matches = [item for item in value.get('result', []) if isinstance(item, dict) and item.get('name') == name]
          if len(matches) != 1:
              raise SystemExit('current staging Catalog name is missing/ambiguous in fresh D1 inventory')
          database_id = matches[0].get('uuid')
          if not isinstance(database_id, str) or not database_id:
              raise SystemExit('current staging Catalog inventory row has no exact uuid')
          print(database_id)
          PY
            )"
          fi
          test -n "$target_id"

          if [ "$OPERATION_MODE" = reconstruction ]; then
            current_release_set_id="$RECON_RELEASE_SET_ID"
            current_release_source_sha="${RECON_EFFECT_SOURCE_SHA:-$SOURCE_SHA}"
          else
          deployments_code="$(curl --silent --show-error --output "$raw/deployments-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          test "$deployments_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result.deployments | type == "array") and (.result.deployments | length) > 0' "$raw/deployments-api.json" >/dev/null
          jq '.result.deployments[0]' "$raw/current-deployment.json" > /dev/null 2>&1 || true
          jq '.result.deployments[0]' "$raw/deployments-api.json" > "$raw/current-deployment.json"
          python scripts/deployment-identity-ar11.py \
            --status "$raw/current-deployment.json" \
            --output "$raw/current-deployment-identity.json"
          current_release_set_id="$(jq -er '.release_set_id | select(type == "string" and test("^release-set-v(2|3)-sha256-[0-9a-f]{64}$"))' "$raw/current-deployment-identity.json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$current_release_set_id" > "$raw/current-release-api.json"
          current_release_source_sha="$(jq -er '.target_commitish | select(type == "string" and test("^[0-9a-f]{40}$"))' "$raw/current-release-api.json")"
          fi

          python scripts/d1-cloudflare-read.py observe \
            --root . \
            --environment staging \
            --account-id "$account_id" \
            --database-name "$target_name" \
            --database-id "$target_id" \
            --repository-json "$raw/d1-repository.json" \
            --output-dir "$raw" \
            --time-travel-unix-seconds "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS"

          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger "$raw/ledger.json" \
            --output "$raw/ledger-names-normalized.json"
          python - "$raw/ledger-names.json" "$raw/ledger-names-normalized.json" <<'PY'
          import json, sys
          left = json.load(open(sys.argv[1], encoding='utf-8'))
          right = json.load(open(sys.argv[2], encoding='utf-8'))
          if left != right:
              raise SystemExit('Cloudflare REST ledger normalization disagrees with existing canonical ledger normalizer')
          PY

          jq -e \
            '.schema_version == 1 and .kind == "D1_CLOUDFLARE_READ_CONTRACT_V1" and .environment == "staging" and .query_mutation_proof.ledger_table_changed_db == false and .query_mutation_proof.ledger_changed_db == false and .query_mutation_proof.foreign_key_changed_db == false and .query_mutation_proof.quick_check_changed_db == false and .time_travel_bookmark_present == true and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$raw/read-contract.json" >/dev/null

          observed_at_unix_seconds="$(date -u +%s)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          observation_source="github-actions://$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

          python - \
            "$raw/d1-databases.json" "$evidence/database-inventory.json" \
            "$SOURCE_SHA" "$account_id" "$observed_at" "$observed_at_unix_seconds" "$observation_source" <<'PY'
          import json, re, sys
          raw_path, output_path, source_sha, account_id, observed_at, observed_at_unix_seconds, observation_source = sys.argv[1:]
          value = json.load(open(raw_path, encoding='utf-8'))
          if value.get('success') is not True or value.get('errors') != [] or not isinstance(value.get('result'), list):
              raise SystemExit('D1 inventory response is not a successful complete result array')
          result_info = value.get('result_info') or {}
          if result_info.get('total_pages', 1) != 1:
              raise SystemExit('D1 inventory response is paginated; exact absence cannot be proven from a partial inventory')
          databases = []
          seen_names = set()
          seen_ids = set()
          for item in value['result']:
              if not isinstance(item, dict):
                  raise SystemExit('D1 inventory contains a non-object row')
              name = item.get('name')
              database_id = item.get('uuid')
              if not isinstance(name, str) or not name or not isinstance(database_id, str) or re.fullmatch(r'[0-9a-f-]{36}', database_id) is None:
                  raise SystemExit('D1 inventory row is missing exact name/uuid identity')
              if name in seen_names or database_id in seen_ids:
                  raise SystemExit('D1 inventory contains duplicate name or uuid identity')
              seen_names.add(name)
              seen_ids.add(database_id)
              databases.append({'database_name': name, 'database_id': database_id})
          databases.sort(key=lambda item: (item['database_name'], item['database_id']))
          document = {
              'schema_version': 1,
              'kind': 'D1_DATABASE_INVENTORY_OBSERVATION_V1',
              'source_sha': source_sha,
              'environment': 'staging',
              'account_id': account_id,
              'observed_at': observed_at,
              'observed_at_unix_seconds': int(observed_at_unix_seconds),
              'observation_source': observation_source,
              'inventory_complete': True,
              'databases': databases,
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          SOURCE_SHA="$SOURCE_SHA" ACCOUNT_ID="$account_id" jq -e \
            '.schema_version == 1 and .kind == "D1_DATABASE_INVENTORY_OBSERVATION_V1" and .source_sha == env.SOURCE_SHA and .environment == "staging" and .account_id == env.ACCOUNT_ID and .inventory_complete == true and (.databases | type == "array") and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$evidence/database-inventory.json" >/dev/null

          if [ -n "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" ]; then
            python - \
              "$raw/time-travel.json" \
              "$evidence/time-travel-lookup.json" \
              "$SOURCE_SHA" "$target_name" "$target_id" \
              "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" "$observed_at" "$observation_source" <<'PY'
          import json, sys
          raw_path, output_path, source_sha, target_name, target_id, timestamp, observed_at, observation_source = sys.argv[1:]
          value = json.load(open(raw_path, encoding='utf-8'))
          if set(value) != {'bookmark'} or not isinstance(value.get('bookmark'), str) or not value['bookmark']:
              raise SystemExit('Cloudflare Time Travel lookup JSON is not the closed BookmarkResponse shape')
          document = {
              'schema_version': 1,
              'kind': 'D1_TIME_TRAVEL_LOOKUP_V1',
              'source_sha': source_sha,
              'environment': 'staging',
              'target': {'database_name': target_name, 'database_id': target_id},
              'requested_unix_seconds': int(timestamp),
              'bookmark': value['bookmark'],
              'observed_at': observed_at,
              'observation_source': observation_source,
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          fi

          python - \
            "$raw/ledger.json" "$raw/ledger-names.json" "$raw/provider-pending.json" \
            "$raw/provider-identity.json" "$raw/time-travel.json" "$raw/read-contract.json" \
            "$raw/foreign-key-check.stdout" "$raw/foreign-key-check.exit-code" \
            "$raw/quick-check.stdout" "$raw/quick-check.exit-code" \
            "$evidence/provider-observation.json" \
            "$SOURCE_SHA" "$account_id" "$target_name" "$target_id" \
            "$current_release_set_id" "$current_release_source_sha" \
            "$observed_at" "$observed_at_unix_seconds" "$observation_source" <<'PY'
          import hashlib, json, os, sys
          (
              ledger_path, ledger_names_path, pending_path, identity_path, time_travel_path, read_contract_path,
              foreign_key_stdout_path, foreign_key_exit_path, quick_stdout_path, quick_exit_path,
              output_path, source_sha, account_id, target_name, target_id,
              current_release_set_id, current_release_source_sha,
              observed_at, observed_at_unix_seconds, observation_source,
          ) = sys.argv[1:]
          ledger = json.load(open(ledger_path, encoding='utf-8'))
          remote_migrations = json.load(open(ledger_names_path, encoding='utf-8'))
          pending = json.load(open(pending_path, encoding='utf-8'))
          identity = json.load(open(identity_path, encoding='utf-8'))
          time_travel = json.load(open(time_travel_path, encoding='utf-8'))
          read_contract = json.load(open(read_contract_path, encoding='utf-8'))

          if read_contract.get('kind') != 'D1_CLOUDFLARE_READ_CONTRACT_V1' or read_contract.get('environment') != 'staging':
              raise SystemExit('canonical Cloudflare D1 read contract is missing or invalid')
          if read_contract.get('target') != {'database_name': target_name, 'database_id': target_id}:
              raise SystemExit('canonical Cloudflare D1 read contract target drifted')
          if read_contract.get('remote_migrations') != remote_migrations:
              raise SystemExit('canonical Cloudflare D1 read contract ledger drifted')
          if read_contract.get('provider_pending_migrations') != pending:
              raise SystemExit('canonical Cloudflare D1 read contract pending diagnostic drifted')
          mutation_proof = read_contract.get('query_mutation_proof') or {}
          if any(mutation_proof.get(name) is not False for name in (
              'ledger_table_changed_db', 'ledger_changed_db', 'foreign_key_changed_db', 'quick_check_changed_db'
          )):
              raise SystemExit('canonical Cloudflare D1 read contract did not prove every query mutation-free')
          if read_contract.get('provider_mutation') is not False or read_contract.get('d1_mutation') is not False or read_contract.get('production_mutation') is not False:
              raise SystemExit('canonical Cloudflare D1 read contract claims mutation')

          def diagnostic(stdout_path, exit_path):
              raw_stdout = open(stdout_path, encoding='utf-8', errors='replace').read()
              exit_code = int(open(exit_path, encoding='utf-8').read().strip())
              try:
                  result = json.loads(raw_stdout)
                  json_valid = True
              except json.JSONDecodeError:
                  result = None
                  json_valid = False
              return {'exit_code': exit_code, 'json_valid': json_valid, 'raw_stdout': raw_stdout, 'result': result}

          foreign_key_check = diagnostic(foreign_key_stdout_path, foreign_key_exit_path)
          quick_check = diagnostic(quick_stdout_path, quick_exit_path)
          foreign_key_result = foreign_key_check['result']
          quick_result = quick_check['result']
          foreign_key_ok = (
              foreign_key_check['exit_code'] == 0 and foreign_key_check['json_valid']
              and isinstance(foreign_key_result, list) and len(foreign_key_result) == 1
              and isinstance(foreign_key_result[0], dict) and foreign_key_result[0].get('success') is True
              and foreign_key_result[0].get('results') == []
          )
          quick_rows = quick_result[0].get('results') if (
              quick_check['exit_code'] == 0 and quick_check['json_valid']
              and isinstance(quick_result, list) and len(quick_result) == 1
              and isinstance(quick_result[0], dict) and quick_result[0].get('success') is True
          ) else None
          quick_ok = (
              isinstance(quick_rows, list) and len(quick_rows) == 1
              and isinstance(quick_rows[0], dict) and list(quick_rows[0].values()) == ['ok']
          )
          recovery = os.environ.get('RECON_RECOVERY') == 'true'
          if os.environ.get('OPERATION_MODE') == 'reconstruction' and not recovery:
              if remote_migrations != []:
                  raise SystemExit('exact fresh reconstruction target has non-empty remote migration ledger')
              remote_ledger_sha256 = hashlib.sha256(b'{"remote_migrations":[]}').hexdigest()
              if remote_ledger_sha256 != '18bb30916ec8d7c0eaa18e5ebebdc9b5284fe07cfbf9db69aeaee3bee3211bf2':
                  raise SystemExit('canonical empty-ledger digest contract drifted')
          else:
              canonical = json.dumps({'remote_migrations': remote_migrations}, sort_keys=True, separators=(',', ':'))
              remote_ledger_sha256 = hashlib.sha256(canonical.encode()).hexdigest()
          provider_observation = {
              'schema_version': 1,
              'target': {
                  'environment': 'staging',
                  'account_id': account_id,
                  'database_name': target_name,
                  'database_id': target_id,
              },
              'observed_at_unix_seconds': int(observed_at_unix_seconds),
              'observation_source': observation_source,
              'remote_ledger_sha256': remote_ledger_sha256,
              'remote_migrations': remote_migrations,
              'wrangler_pending_migrations': pending,
              'deployment_identity': current_release_set_id,
              'time_travel_bookmark_capable': True,
          }
          document = {
              'schema_version': 1,
              'kind': 'D1_CURRENT_TARGET_OBSERVATION',
              'source_sha': source_sha,
              'environment': 'staging',
              'observed_at': observed_at,
              'component': 'catalog',
              'current_deployed_release_set_id': current_release_set_id,
              'current_deployed_source_sha': current_release_source_sha,
              'provider_observation_input': provider_observation,
              'provider_diagnostics': {
                  'schema_version': 1,
                  'provider_pending_migrations': pending,
                  'read_contract': read_contract,
                  'foreign_key_check_ok': foreign_key_ok,
                  'quick_check_ok': quick_ok,
                  'foreign_key_check': foreign_key_check,
                  'quick_check': quick_check,
              },
              'provider_identity_observed': bool(identity),
              'time_travel_observation_present': bool(time_travel),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          SOURCE_SHA="$SOURCE_SHA" TARGET_NAME="$target_name" TARGET_ID="$target_id" jq -e \
            '.schema_version == 1 and .kind == "D1_CURRENT_TARGET_OBSERVATION" and .source_sha == env.SOURCE_SHA and .environment == "staging" and .component == "catalog" and .provider_observation_input.target.database_name == env.TARGET_NAME and .provider_observation_input.target.database_id == env.TARGET_ID and .provider_observation_input.target.environment == "staging" and (.provider_observation_input.wrangler_pending_migrations | type == "array") and .provider_observation_input.wrangler_pending_migrations == .provider_diagnostics.provider_pending_migrations and (.current_deployed_release_set_id | test("^release-set-v(2|3)-sha256-[0-9a-f]{64}$")) and (.current_deployed_source_sha | test("^[0-9a-f]{40}$")) and .provider_observation_input.time_travel_bookmark_capable == true and .provider_diagnostics.schema_version == 1 and .provider_diagnostics.read_contract.kind == "D1_CLOUDFLARE_READ_CONTRACT_V1" and .provider_diagnostics.read_contract.query_mutation_proof.ledger_table_changed_db == false and .provider_diagnostics.read_contract.query_mutation_proof.ledger_changed_db == false and .provider_diagnostics.read_contract.query_mutation_proof.foreign_key_changed_db == false and .provider_diagnostics.read_contract.query_mutation_proof.quick_check.changed_db == false and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$evidence/provider-observation.json" >/dev/null

          {
            echo "CURRENT_TARGET_NAME=$target_name"
            echo "CURRENT_TARGET_ID=$target_id"
            echo "CURRENT_DEPLOYED_RELEASE_SET_ID=$current_release_set_id"
            echo "CURRENT_DEPLOYED_SOURCE_SHA=$current_release_source_sha"
          } >> "$GITHUB_ENV"

      - name: Publish secret-free exact Time Travel lookup
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.time_travel_unix_seconds != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-time-travel-lookup-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-current-target-observation/time-travel-lookup.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on unusable provider diagnostics
        run: |
          set -euo pipefail
          jq -e \
            '.provider_diagnostics.foreign_key_check.exit_code == 0 and .provider_diagnostics.foreign_key_check.json_valid == true and .provider_diagnostics.foreign_key_check_ok == true and .provider_diagnostics.quick_check.exit_code == 0 and .provider_diagnostics.quick_check.json_valid == true and .provider_diagnostics.quick_check_ok == true and .provider_diagnostics.read_contract.kind == "D1_CLOUDFLARE_READ_CONTRACT_V1" and .provider_diagnostics.read_contract.time_travel_bookmark_present == true and .provider_diagnostics.read_contract.provider_mutation == false and .provider_diagnostics.read_contract.d1_mutation == false and .provider_diagnostics.read_contract.production_mutation == false' \
            artifacts/d1-current-target-observation/provider-observation.json >/dev/null

      - name: Verify fail-forward reconstruction post-state without provider mutation
        if: env.RECON_RECOVERY == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RECON_RECOVERY" = true
          test -n "$RECON_PREPARED_RUN_ID"
          test -n "$RECON_EXECUTOR_RUN_ID"
          test -n "$RECON_RECONSTRUCTION_ID"
          test -n "$RECON_EFFECT_SOURCE_SHA"
          root="artifacts/d1-reconstruction-recovery"
          mkdir -p "$root/prepared" "$root/executor"
          prepare_api="$RUNNER_TEMP/recovery-prepare-run.json"
          executor_api="$RUNNER_TEMP/recovery-executor-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECON_PREPARED_RUN_ID" > "$prepare_api"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECON_EXECUTOR_RUN_ID" > "$executor_api"
          jq -e --arg source "$RECON_EFFECT_SOURCE_SHA" \
            '.path == ".github/workflows/d1-migration-prepare.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $source and .status == "completed" and .conclusion == "success" and .run_attempt == 1' \
            "$prepare_api" >/dev/null
          jq -e --arg source "$RECON_EFFECT_SOURCE_SHA" \
            '.path == ".github/workflows/d1-migration-executor.yml" and .event == "workflow_dispatch" and .head_branch == "main" and .head_sha == $source and .status == "completed" and .conclusion == "failure" and .run_attempt == 1' \
            "$executor_api" >/dev/null
          gh run download "$RECON_PREPARED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "d1-reconstruction-catalog-$RECON_PREPARED_RUN_ID-1" --dir "$root/prepared"
          gh run download "$RECON_EXECUTOR_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "d1-reconstruction-evidence-$RECON_EXECUTOR_RUN_ID-1" --dir "$root/executor"
          reconstruction="$root/prepared/reconstruction.json"
          receipt="$root/executor/execution-receipt.json"
          materialization="$root/executor/materialization.json"
          test -f "$reconstruction" && test -f "$receipt" && test -f "$materialization"
          jq -e --arg id "$RECON_RECONSTRUCTION_ID" --arg source "$RECON_EFFECT_SOURCE_SHA" --arg release "$RECON_RELEASE_SET_ID" \
            '.reconstruction_id == $id and .plan.source_sha == $source and .plan.release_set_id == $release and .plan.provider_observation.target.environment == "staging"' \
            "$reconstruction" >/dev/null
          jq -e --arg id "$RECON_RECONSTRUCTION_ID" --arg source "$RECON_EFFECT_SOURCE_SHA" \
            '.operation_identity == $id and .transaction_id == $id and .source_sha == $source and .recovery_strategy == "FAIL_FORWARD_ONLY" and .events[-2].kind == "RECONSTRUCTION_APPLIED" and .events[-1].kind == "RECOVERY_REQUIRED" and ([.events[] | select(.kind == "RECONSTRUCTION_APPLIED")] | length) == 1' \
            "$receipt" >/dev/null
          jq -e --arg id "$RECON_RECONSTRUCTION_ID" --arg release "$RECON_RELEASE_SET_ID" \
            '.reconstruction_id == $id and .release_set_id == $release and .provider_effect == "D1_BOOTSTRAP_CURRENT_EXACT_CONSTRUCTION" and .provider_mutation_authorized == false and .production_mutation_authorized == false' \
            "$materialization" >/dev/null
          python - \
            artifacts/d1-current-target-observation/provider-observation.json \
            "$reconstruction" "$materialization" "$root/post-observation.json" <<'PY'
          import hashlib, json, sys
          observation_path, reconstruction_path, materialization_path, output_path = sys.argv[1:]
          document = json.load(open(observation_path, encoding='utf-8'))
          reconstruction = json.load(open(reconstruction_path, encoding='utf-8'))
          materialization = json.load(open(materialization_path, encoding='utf-8'))
          provider = document.get('provider_observation_input') or {}
          diagnostics = document.get('provider_diagnostics') or {}
          remote = provider.get('remote_migrations')
          pending = diagnostics.get('provider_pending_migrations')
          expected = ((reconstruction.get('plan') or {}).get('expected_post_state') or {}).get('ledger_migrations')
          deferred = materialization.get('deferred_revisions')
          sealed_target = ((reconstruction.get('plan') or {}).get('provider_observation') or {}).get('target')
          if provider.get('target') != sealed_target:
              raise SystemExit('fresh recovery observation target differs from sealed reconstruction target')
          if remote != expected or not isinstance(remote, list) or not remote:
              raise SystemExit('fresh recovery observation did not reach the exact sealed reconstruction ledger')
          if pending != deferred or not isinstance(pending, list):
              raise SystemExit('fresh recovery pending set differs from materialized deferred revisions')
          if any(item in remote for item in pending):
              raise SystemExit('fresh recovery reports one migration as both applied and deferred')
          if diagnostics.get('foreign_key_check_ok') is not True or diagnostics.get('quick_check_ok') is not True:
              raise SystemExit('fresh recovery database invariants are not clean')
          read_contract = diagnostics.get('read_contract') or {}
          if read_contract.get('provider_mutation') is not False or read_contract.get('d1_mutation') is not False or read_contract.get('production_mutation') is not False:
              raise SystemExit('fresh recovery observation is not read-only')
          canonical = json.dumps({'remote_migrations': remote}, sort_keys=True, separators=(',', ':'))
          typed = {
              'schema_version': 1,
              'target': provider['target'],
              'observed_at_unix_seconds': provider['observed_at_unix_seconds'],
              'observation_source': provider['observation_source'] + '/fail-forward-recovery',
              'remote_ledger_sha256': hashlib.sha256(canonical.encode()).hexdigest(),
              'remote_migrations': remote,
              'wrangler_pending_migrations': pending,
              'deployment_identity': materialization['release_set_id'],
              'time_travel_bookmark_capable': provider.get('time_travel_bookmark_capable') is True,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(typed, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PY
          cargo build --locked --manifest-path tools/opsctl/Cargo.toml --example d1-execution-control
          evaluated_at="$(date -u +%s)"
          env -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            tools/opsctl/target/debug/examples/d1-execution-control verify-post-state \
              --reconstruction "$reconstruction" \
              --receipt "$receipt" \
              --observation "$root/post-observation.json" \
              --evaluated-at-unix-seconds "$evaluated_at" \
              > "$root/post-state-verification.json"
          jq -e \
            '.status == "RECONSTRUCTION_POST_STATE_VERIFIED" and .disposition == "RECOVERY_REQUIRED_CONFIRMED" and .terminal_state == "RECOVERY_REQUIRED" and .reconstruction_applied == true and .expected_post_state_reached == true and .observed_migrations == .expected_ledger_migrations' \
            "$root/post-state-verification.json" >/dev/null
          jq -n \
            --arg current_source "$SOURCE_SHA" \
            --arg effect_source "$RECON_EFFECT_SOURCE_SHA" \
            --arg reconstruction_id "$RECON_RECONSTRUCTION_ID" \
            --argjson prepare_run "$RECON_PREPARED_RUN_ID" \
            --argjson executor_run "$RECON_EXECUTOR_RUN_ID" \
            --slurpfile verification "$root/post-state-verification.json" \
            '{schema_version:1,kind:"D1_RECONSTRUCTION_FAIL_FORWARD_RECOVERY_V1",status:"EXPECTED_POST_STATE_VERIFIED_READ_ONLY",current_source_sha:$current_source,reconstruction_source_sha:$effect_source,reconstruction_id:$reconstruction_id,prepared_run_id:$prepare_run,executor_run_id:$executor_run,typed_post_state_verification:$verification[0],provider_mutation:false,d1_mutation:false,production_mutation:false,second_reconstruction:false,executor_rerun:false}' \
            > "$root/recovery-verification.json"
          jq -e '.status == "EXPECTED_POST_STATE_VERIFIED_READ_ONLY" and .typed_post_state_verification.expected_post_state_reached == true and .provider_mutation == false and .d1_mutation == false and .production_mutation == false and .second_reconstruction == false and .executor_rerun == false' \
            "$root/recovery-verification.json" >/dev/null

      - name: Publish fail-forward reconstruction recovery evidence
        if: env.RECON_RECOVERY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-reconstruction-recovery-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            artifacts/d1-reconstruction-recovery/recovery-verification.json
            artifacts/d1-reconstruction-recovery/post-state-verification.json
            artifacts/d1-reconstruction-recovery/post-observation.json
            artifacts/d1-reconstruction-recovery/prepared/reconstruction.json
            artifacts/d1-reconstruction-recovery/executor/execution-receipt.json
            artifacts/d1-reconstruction-recovery/executor/materialization.json
            artifacts/d1-current-target-observation/provider-observation.json
            artifacts/d1-current-target-observation/database-inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Run canonical credential-free transaction preflight
        if: env.RECON_RECOVERY != 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          OPERATION_MODE: ${{ inputs.operation_mode || 'current' }}
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_OBSERVE_API_TOKEN:-}"
          root="$RUNNER_TEMP/d1-preflight"
          evidence="artifacts/d1-transaction-preflight"
          observation="artifacts/d1-current-target-observation/provider-observation.json"
          inventory="artifacts/d1-current-target-observation/database-inventory.json"
          mkdir -p "$root/target" "$root/current" "$evidence"
          test -f "$observation"
          test -f "$inventory"
          SOURCE_SHA="$SOURCE_SHA" jq -e \
            '.schema_version == 1 and .kind == "D1_DATABASE_INVENTORY_OBSERVATION_V1" and .source_sha == env.SOURCE_SHA and .environment == "staging" and .inventory_complete == true and (.databases | type == "array") and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$inventory" >/dev/null

          cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          opsctl='tools/opsctl/target/debug/opsctl'
          test -x "$opsctl"
          python scripts/d1-prepare.py self-test

          target_release=''
          for _ in $(seq 1 48); do
            mapfile -t releases < <(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.target_commitish == \"$SOURCE_SHA\" and (.tag_name | startswith(\"release-set-v3-sha256-\")) and .draft == false and .prerelease == false) | .tag_name")
            if [ "${#releases[@]}" -gt 1 ]; then
              printf 'multiple immutable Release Sets target exact current source: %s\n' "${releases[*]}" >&2
              exit 1
            fi
            if [ "${#releases[@]}" -eq 1 ]; then
              target_release="${releases[0]}"
              break
            fi
            sleep 15
          done
          test -n "$target_release"

          download_release_assets() {
            local release_tag="$1"
            local output_dir="$2"
            local release_json="$output_dir/release-api.json"
            local asset_name asset_json asset_url asset_digest actual_digest
            mkdir -p "$output_dir"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > "$release_json"
            for asset_name in release-set.json control-plane.tar; do
              asset_json="$(jq -ce --arg name "$asset_name" '
                [.assets[] | select(.name == $name and .state == "uploaded")]
                | if length == 1 then .[0] else error("release asset missing or ambiguous") end
              ' "$release_json")"
              asset_url="$(jq -er '.browser_download_url | select(type == "string" and length > 0)' <<<"$asset_json")"
              asset_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$asset_json")"
              curl --fail --location --silent --show-error \
                --retry 5 --retry-delay 2 --retry-all-errors \
                --output "$output_dir/$asset_name" "$asset_url"
              actual_digest="sha256:$(sha256sum "$output_dir/$asset_name" | awk '{print $1}')"
              test "$actual_digest" = "$asset_digest"
            done
            rm -f "$release_json"
          }
          download_release_assets "$target_release" "$root/target"
          download_release_assets "$CURRENT_DEPLOYED_RELEASE_SET_ID" "$root/current"

          python - \
            "$root" "$target_release" "$SOURCE_SHA" \
            "$CURRENT_DEPLOYED_RELEASE_SET_ID" "$CURRENT_DEPLOYED_SOURCE_SHA" "$D1_COMPONENT" <<'PY'
          import hashlib, json, sys, tarfile
          from pathlib import Path
          root, target_id, target_source, current_id, current_source, component_id = sys.argv[1:]
          root = Path(root)
          def extract(folder, expected_id, expected_source, output):
              rs = json.load(open(folder / 'release-set.json', encoding='utf-8'))
              if rs.get('release_set_id') != expected_id or rs.get('schema_version') not in {2, 3}:
                  raise SystemExit(f'Release Set identity mismatch for {folder}')
              source = rs.get('source') or {}
              if source.get('repository') != 'iamaman11/part-crm-emai-profile' or source.get('commit_sha') != expected_source or source.get('accepted_main') is not True:
                  raise SystemExit(f'Release Set source mismatch for {folder}')
              component = (rs.get('components') or {}).get('control_plane') or {}
              if component.get('source_commit_sha') != expected_source:
                  raise SystemExit(f'control_plane source mismatch for {folder}')
              archive = folder / 'control-plane.tar'
              if hashlib.sha256(archive.read_bytes()).hexdigest() != component.get('artifact_sha256'):
                  raise SystemExit(f'control_plane artifact digest mismatch for {folder}')
              with tarfile.open(archive, 'r:*') as tar:
                  members = [m for m in tar.getmembers() if m.isfile() and Path(m.name).name == 'release-manifest.json']
                  if len(members) != 1:
                      raise SystemExit(f'control_plane manifest missing/ambiguous for {folder}')
                  raw = tar.extractfile(members[0]).read()
              if hashlib.sha256(raw).hexdigest() != component.get('component_manifest_sha256'):
                  raise SystemExit(f'control_plane manifest digest mismatch for {folder}')
              Path(output).write_bytes(raw)
          extract(root / 'target', target_id, target_source, root / 'target-manifest.json')
          extract(root / 'current', current_id, current_source, root / 'current-deployed-manifest.json')
          for path, label in ((root / 'target-manifest.json', 'target'), (root / 'current-deployed-manifest.json', 'current-deployed')):
              schema = json.load(open(path, encoding='utf-8')).get('schema_contract')
              if not isinstance(schema, dict) or schema.get('database_component') != component_id:
                  raise SystemExit(f'{label} release manifest is not for the current D1 component')
          PY
          printf '%s\n' "$target_release" > "$evidence/target-release-set-id.txt"

          "$opsctl" --root . d1 repository > "$root/d1-repository.json"
          python - \
            "$root/d1-repository.json" "$root/target-manifest.json" "$root/current-deployed-manifest.json" \
            "$root/current-runtime-manifest.json" "$root/known-good-runtime-manifest.json" \
            "$evidence/runtime-context.json" <<'PY'
          import json, os, sys
          repository_path, target_path, deployed_path, current_output, known_output, evidence_output = sys.argv[1:]
          component_id = os.environ['D1_COMPONENT']
          repository = json.load(open(repository_path, encoding='utf-8'))
          matches = [item for item in repository.get('components', []) if item.get('component_id') == component_id]
          if len(matches) != 1:
              raise SystemExit('typed D1 repository projection missing/ambiguous during preflight')
          component = matches[0]
          release = component.get('release_schema_contract')
          target = json.load(open(target_path, encoding='utf-8')).get('schema_contract')
          deployed = json.load(open(deployed_path, encoding='utf-8')).get('schema_contract')
          if not all(isinstance(value, dict) for value in (release, target, deployed)):
              raise SystemExit('typed release/target/deployed schema contracts are incomplete')
          if release.get('database_component') != component_id:
              raise SystemExit('typed D1 release schema contract component drifted')
          for field, owner_field in (
              ('migration_history_digest', 'history_digest'),
              ('compatibility_policy_digest', 'compatibility_policy_digest'),
          ):
              if release.get(field) != component.get(owner_field):
                  raise SystemExit(f'typed D1 release {field} is not bound to current repository authority')
          for field in (
              'database_component', 'target_schema_revision', 'supported_schema_min', 'supported_schema_max',
              'migration_history_digest', 'compatibility_policy_digest',
          ):
              if target.get(field) != release.get(field):
                  raise SystemExit(f'target Release Set schema contract drifted from typed D1 release authority: {field}')
          if deployed.get('database_component') != component_id:
              raise SystemExit('deployed Release Set component drifted')
          manifest = {'schema_contract': deployed}
          for output in (current_output, known_output):
              with open(output, 'w', encoding='utf-8') as handle:
                  json.dump(manifest, handle, sort_keys=True, indent=2)
                  handle.write('\n')
          evidence = {
              'schema_version': 1,
              'kind': 'D1_DEPLOYED_RUNTIME_CONTEXT',
              'source_sha': os.environ['SOURCE_SHA'],
              'basis': 'CURRENT_DEPLOYED_IMMUTABLE_RELEASE_SCHEMA_CONTRACT',
              'deployed_release_set_id': os.environ['CURRENT_DEPLOYED_RELEASE_SET_ID'],
              'deployed_release_source_sha': os.environ['CURRENT_DEPLOYED_SOURCE_SHA'],
              'deployed_release_target_revision': deployed.get('target_schema_revision'),
              'schema_contract': deployed,
              'release_schema_contract': release,
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(evidence_output, 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          python - "$observation" "$SOURCE_SHA" "$CURRENT_TARGET_NAME" "$CURRENT_TARGET_ID" "$root/ledger.json" <<'PY'
          import json, sys, time
          path, source, name, dbid, ledger_path = sys.argv[1:]
          doc = json.load(open(path, encoding='utf-8'))
          obs = doc.get('provider_observation_input') or {}
          target = obs.get('target') or {}
          if doc.get('source_sha') != source or doc.get('kind') != 'D1_CURRENT_TARGET_OBSERVATION':
              raise SystemExit('observer evidence is not bound to exact accepted-main source/current target contract')
          if target.get('database_name') != name or target.get('database_id') != dbid or target.get('environment') != 'staging':
              raise SystemExit('observer target identity drifted')
          if doc.get('provider_mutation') or doc.get('d1_mutation') or doc.get('production_mutation'):
              raise SystemExit('observer evidence claims mutation')
          observed = obs.get('observed_at_unix_seconds')
          if not isinstance(observed, int) or observed > int(time.time()) + 60 or int(time.time()) - observed > 1800:
              raise SystemExit('observer evidence is stale for prepare preflight')
          names = obs.get('remote_migrations')
          if not isinstance(names, list) or not all(isinstance(x, str) for x in names):
              raise SystemExit('observer remote migration ledger is invalid')
          payload = [{'results': [{'id': i + 1, 'name': value} for i, value in enumerate(names)], 'success': True}]
          with open(ledger_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          printf '{"component":"%s","completed":[]}\n' "$D1_COMPONENT" > "$root/preconditions.json"

          cp "$observation" "$evidence/provider-observation.json"
          cp "$inventory" "$evidence/database-inventory.json"
          if [ "$OPERATION_MODE" != reconstruction ]; then
          set +e
          python scripts/d1-prepare.py prepare \
            --opsctl "$opsctl" \
            --root . \
            --component "$D1_COMPONENT" \
            --ledger-json "$root/ledger.json" \
            --release-manifest "$root/target-manifest.json" \
            --current-manifest "$root/current-runtime-manifest.json" \
            --known-good-manifest "$root/known-good-runtime-manifest.json" \
            --preconditions-json "$root/preconditions.json" \
            --output "$evidence/prepare.json"
          rc=$?
          set -e
          test "$rc" = 0 -o "$rc" = 3
          jq -e '.status == "PREPARE_READY" or .status == "PREPARE_BLOCKED"' "$evidence/prepare.json" >/dev/null

          python - \
            "$evidence/prepare.json" "$evidence/provider-observation.json" "$evidence/runtime-context.json" \
            "$evidence/summary.json" <<'PY'
          import json, os, sys
          prepare = json.load(open(sys.argv[1], encoding='utf-8'))
          observation = json.load(open(sys.argv[2], encoding='utf-8'))
          runtime_context = json.load(open(sys.argv[3], encoding='utf-8'))
          runtime_contract = runtime_context.get('schema_contract') or {}
          release_contract = runtime_context.get('release_schema_contract') or {}
          diagnostics = observation.get('provider_diagnostics') or {}
          value = {
              'schema_version': 1,
              'kind': 'D1_TRANSACTION_PREFLIGHT',
              'source_sha': os.environ['SOURCE_SHA'],
              'observation_run_id': os.environ['GITHUB_RUN_ID'],
              'observation_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_name': os.environ['GITHUB_WORKFLOW'],
              'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),
              'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA'),
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'ref': os.environ['GITHUB_REF'],
              'target_database_name': os.environ['CURRENT_TARGET_NAME'],
              'target_database_id': os.environ['CURRENT_TARGET_ID'],
              'current_deployed_release_set_id': os.environ['CURRENT_DEPLOYED_RELEASE_SET_ID'],
              'runtime_context_target_revision': runtime_contract.get('target_schema_revision'),
              'runtime_context_supported_max': runtime_contract.get('supported_schema_max'),
              'release_target_revision': release_contract.get('target_schema_revision'),
              'release_supported_max': release_contract.get('supported_schema_max'),
              'status': prepare.get('status'),
              'provider_pending_migrations': diagnostics.get('provider_pending_migrations'),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          if prepare.get('status') == 'PREPARE_READY':
              value['planned_migrations'] = (prepare.get('plan') or {}).get('planned_migrations', [])
          else:
              value['gate_results'] = prepare.get('gate_results', [])
          with open(sys.argv[4], 'w', encoding='utf-8') as handle:
              json.dump(value, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          echo 'D1 secret-free current-target preflight disposition:'
          cat "$evidence/summary.json"
          jq -c '{status, gate_results, plan: (if .status == "PREPARE_READY" then {decision: .plan.decision, ledger_state: .plan.ledger_state, planned_migrations: .plan.planned_migrations} else null end)}' "$evidence/prepare.json"
          fi

      - name: Dispatch existing credential-free Prepare for machine-resolved reconstruction
        if: github.event_name == 'workflow_dispatch' && inputs.operation_mode == 'reconstruction' && env.RECON_RECOVERY != 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
          OPERATION_MODE: ${{ inputs.operation_mode || 'current' }}
        run: |
          set -euo pipefail
          test "$OPERATION_MODE" = reconstruction
          test "$RECON_RECOVERY" = false
          root="$RUNNER_TEMP/d1-preflight"
          observation="artifacts/d1-current-target-observation/provider-observation.json"
          python - "$root/provider-observation-input.json" "$observation" <<'PY'
          import json, sys
          output, source = sys.argv[1:]
          document = json.load(open(source, encoding='utf-8'))
          value = document.get('provider_observation_input')
          if not isinstance(value, dict):
              raise SystemExit('canonical observer did not produce ProviderObservationInput')
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(value, handle, sort_keys=True, separators=(',', ':'))
              handle.write('\n')
          PY
          python - "$root/dispatch.json" "$SOURCE_SHA" "$CURRENT_DEPLOYED_RELEASE_SET_ID" <<'PY'
          import json, pathlib, sys
          output, source, release_set = sys.argv[1:]
          root = pathlib.Path(output).parent
          def text(name):
              return (root / name).read_text(encoding='utf-8')
          payload = {'ref': 'main', 'inputs': {
              'source_sha': source,
              'operation_mode': 'reconstruction',
              'component': 'catalog',
              'ledger_json': text('ledger.json'),
              'target_release_manifest_json': text('target-manifest.json'),
              'current_release_manifest_json': text('current-runtime-manifest.json'),
              'known_good_release_manifest_json': text('known-good-runtime-manifest.json'),
              'preconditions_json': text('preconditions.json'),
              'provider_observation_json': text('provider-observation-input.json'),
              'repository_projection_json': text('d1-repository.json'),
              'transaction_input_json': '{}',
              'release_set_id': release_set,
          }}
          pathlib.Path(output).write_text(json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          prepare_workflow='d1-'
          prepare_workflow+='migration-prepare.yml'
          dispatch_path='/dispatches'
          dispatch_code="$(gh api --method POST --input "$root/dispatch.json" --include "repos/$GITHUB_REPOSITORY/actions/workflows/$prepare_workflow$dispatch_path" | sed -n '1p' | awk '{print $2}')"
          test "$dispatch_code" = 204
          jq -e '.inputs.operation_mode == "reconstruction" and .inputs.component == "catalog" and (.inputs.release_set_id | test("^release-set-v3-sha256-[0-9a-f]{64}$"))' "$root/dispatch.json" >/dev/null
          {
            echo 'Prepare dispatch accepted: workflow=d1-migration-prepare.yml operation_mode=reconstruction component=catalog'
            echo 'Provider mutation: NO'
            echo 'D1 mutation: NO'
            echo 'Production mutation: NO'
            echo 'Executor dispatch: NO'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish secret-free D1 transaction preflight
        if: env.RECON_RECOVERY != 'true' && (github.event_name != 'workflow_dispatch' || inputs.operation_mode != 'reconstruction')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-transaction-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-transaction-preflight
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw provider observations and preflight inputs from runner temp
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/d1-current-target-observation"
          rm -rf "$RUNNER_TEMP/d1-preflight"
          rm -rf "$RUNNER_TEMP/d1-reconstruction-authority"