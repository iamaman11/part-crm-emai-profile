name: D1 Isolated Target Observation

on:
  pull_request:
    paths:
      - '.github/workflows/d1-isolated-target-observation.yml'
      - '.github/workflows/d1-operator.yml'
      - 'scripts/d1-prepare.py'
      - 'scripts/deployment-identity-ar11.py'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      time_travel_unix_seconds:
        description: 'Optional exact Unix-seconds timestamp for read-only D1 Time Travel bookmark lookup'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: d1-isolated-target-observation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  D1_COMPONENT: catalog

jobs:
  contract:
    name: Isolated D1 observation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove current-target observation remains read-only and facts-only
        run: |
          set -euo pipefail
          python scripts/d1-executor-plan.py self-test
          python scripts/d1-prepare.py self-test
          python scripts/deployment-identity-ar11.py --self-test
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/d1-isolated-target-observation.yml').read_text(encoding='utf-8')
          forbidden_effect_surfaces = (
              'secrets.' + 'CLOUDFLARE_API_TOKEN',
              'd1 migrations' + ' apply',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1 time-travel' + ' restore',
              'd1-migration-executor.yml' + '/dispatches',
          )
          for forbidden in forbidden_effect_surfaces:
              assert forbidden not in source, f'read-only D1 observer contains forbidden effect surface: {forbidden}'
          forbidden_rehearsal_identity = (
              'D1_' + 'REHEARSAL_',
              'part-crm-' + 'd3a-bootstrap-proof',
              '713dd6f2-' + '646b-46ad-93eb-103d2d0b63c4',
          )
          for forbidden in forbidden_rehearsal_identity:
              assert forbidden not in source, f'consumed rehearsal identity remains in standard observer: {forbidden}'
          forbidden_stage_policy = (
              '0026_' + 'outbound_mail_intents.sql',
              '0031_' + 'device_binding_governance.sql',
              '0032_' + 'pas2_payload_fingerprint_contract.sql',
              'post_' + 'apply_invariants',
              'exact_' + 'ordinary_revision',
              'protected_' + 'contract_absent',
          )
          for forbidden in forbidden_stage_policy:
              assert forbidden not in source, f'D1 observer acquired stage-specific migration policy: {forbidden}'
          trigger = source.split('\npermissions:', 1)[0]
          push_block = trigger.split('\n  push:', 1)[1].split('\n  workflow_dispatch:', 1)[0]
          dispatch_block = trigger.split('\n  workflow_dispatch:', 1)[1]
          observe_source = source.split('\n  observe:', 1)[1]
          assert '\n    branches:\n      - main' in push_block
          assert '\n    paths:' not in push_block, 'exact-main observation must not be path-filtered'
          assert '\n    inputs:\n      time_travel_unix_seconds:' in dispatch_block
          assert 'required: false' in dispatch_block and 'type: string' in dispatch_block
          assert "D1_COMPONENT: catalog" in source
          assert "d1_database_name // .d1_database_name" in observe_source
          assert "workers/scripts/$worker_name/deployments" in observe_source
          assert 'deployment-identity-ar11.py' in observe_source
          assert "opsctl='tools/opsctl/target/debug/opsctl'" in source
          assert 'pre_migration_runtime_schema_contract' not in observe_source
          assert 'release_schema_contract' in source
          assert 'CURRENT_DEPLOYED_IMMUTABLE_RELEASE_SCHEMA_CONTRACT' in observe_source
          assert '--current-manifest "$root/current-runtime-manifest.json"' in source
          assert '--known-good-manifest "$root/known-good-runtime-manifest.json"' in source
          assert '--command "PRAGMA foreign_key_check"' in observe_source
          assert '--command "PRAGMA quick_check"' in observe_source
          assert '--command "PRAGMA integrity_check"' not in observe_source
          assert 'D1_CURRENT_TARGET_OBSERVATION' in observe_source
          assert "'provider_mutation': False" in observe_source
          assert "'d1_mutation': False" in observe_source
          assert "'production_mutation': False" in observe_source
          assert 'gh release download' not in observe_source
          assert 'browser_download_url' in observe_source
          assert '--retry-all-errors' in observe_source
          assert 'sha256sum' in observe_source
          artifact_name = 'd1-transaction-preflight-' + '$' + '{{ github.run_id }}-' + '$' + '{{ github.run_attempt }}-' + '$' + '{{ github.sha }}'
          assert artifact_name in source
          PY

  observe:
    name: Isolated D1 target hosted observation and preflight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Verify exact accepted-main read-only context
        env:
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_TIME_TRAVEL_UNIX_SECONDS: ${{ github.event.inputs.time_travel_unix_seconds || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$D1_COMPONENT" = catalog
          if [ -n "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" ]; then
            python - "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" <<'PY'
          import re, sys
          if re.fullmatch(r'[0-9]{10}', sys.argv[1]) is None:
              raise SystemExit('time_travel_unix_seconds must be exactly 10 decimal Unix-seconds digits')
          PY
          fi

      - name: Set up pinned Node for Wrangler read adapter
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Observe exact current staging Catalog with read-only credential
        env:
          CLOUDFLARE_OBSERVE_API_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
          SOURCE_SHA: ${{ github.sha }}
          REQUESTED_TIME_TRAVEL_UNIX_SECONDS: ${{ github.event.inputs.time_travel_unix_seconds || '' }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_OBSERVE_API_TOKEN"
          test -n "$CLOUDFLARE_DEPLOY_MANIFEST_JSON"
          echo "::add-mask::$CLOUDFLARE_OBSERVE_API_TOKEN"
          umask 077

          raw="$RUNNER_TEMP/d1-current-target-observation"
          evidence="artifacts/d1-current-target-observation"
          lineage="$raw/catalog-lineage"
          mkdir -p "$raw" "$evidence" "$lineage"
          manifest="$raw/deploy-manifest.json"
          printf '%s' "$CLOUDFLARE_DEPLOY_MANIFEST_JSON" > "$manifest"

          account_id="$(jq -er '.control_plane.account_id // .account_id | select(type == "string" and length == 32)' "$manifest")"
          target_name="$(jq -er '.control_plane.d1_database_name // .d1_database_name | select(type == "string" and length > 0)' "$manifest")"
          worker_name="$(jq -er '.control_plane.worker_name // .worker_name | select(type == "string" and length > 0)' "$manifest")"
          test "$target_name" != 'part-crm-catalog-production'

          env -u CLOUDFLARE_OBSERVE_API_TOKEN -u CLOUDFLARE_API_TOKEN -u CLOUDFLARE_ACCOUNT_ID \
            cargo run --locked --quiet --manifest-path tools/opsctl/Cargo.toml -- --root . d1 repository \
            > "$raw/d1-repository.json"

          python - "$raw/d1-repository.json" "$lineage" <<'PY'
          import json, shutil, sys
          from pathlib import Path
          projection = json.load(open(sys.argv[1], encoding='utf-8'))
          output = Path(sys.argv[2])
          matches = [item for item in projection.get('components', []) if item.get('component_id') == 'catalog']
          if len(matches) != 1:
              raise SystemExit('typed Catalog projection missing/ambiguous')
          sources = matches[0].get('executable_migration_sources')
          if not isinstance(sources, list) or not sources:
              raise SystemExit('typed Catalog executable_migration_sources missing')
          for item in sources:
              name = item.get('migration_file')
              root = item.get('source_root')
              if root not in {'migrations/d1', 'migrations/d1-successor', 'migrations/d1-successor-v2'} or not isinstance(name, str):
                  raise SystemExit('typed Catalog migration source escaped governed roots')
              source = Path(root) / name
              target = output / name
              if source.is_symlink() or not source.is_file() or target.exists():
                  raise SystemExit(f'invalid typed Catalog migration source: {source}')
              shutil.copyfile(source, target)
          PY

          verify_code="$(curl --silent --show-error --output "$raw/token-verify.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          test "$verify_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and .result.status == "active"' "$raw/token-verify.json" >/dev/null

          inventory_code="$(curl --silent --show-error --output "$raw/d1-databases.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database?per_page=100")"
          test "$inventory_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result | type == "array")' "$raw/d1-databases.json" >/dev/null

          target_id="$(python - "$raw/d1-databases.json" "$target_name" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          name = sys.argv[2]
          matches = [item for item in value.get('result', []) if isinstance(item, dict) and item.get('name') == name]
          if len(matches) != 1:
              raise SystemExit('current staging Catalog name is missing/ambiguous in fresh D1 inventory')
          database_id = matches[0].get('uuid')
          if not isinstance(database_id, str) or not database_id:
              raise SystemExit('current staging Catalog inventory row has no exact uuid')
          print(database_id)
          PY
          )"
          test -n "$target_id"

          deployments_code="$(curl --silent --show-error --output "$raw/deployments-api.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_OBSERVE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/workers/scripts/$worker_name/deployments")"
          test "$deployments_code" = 200
          jq -e '.success == true and (.errors | length) == 0 and (.result.deployments | type == "array") and (.result.deployments | length) > 0' "$raw/deployments-api.json" >/dev/null
          jq '.result.deployments[0]' "$raw/deployments-api.json" > "$raw/current-deployment.json"
          python scripts/deployment-identity-ar11.py \
            --status "$raw/current-deployment.json" \
            --output "$raw/current-deployment-identity.json"
          current_release_set_id="$(jq -er '.release_set_id | select(type == "string" and test("^release-set-v(2|3)-sha256-[0-9a-f]{64}$"))' "$raw/current-deployment-identity.json")"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$current_release_set_id" > "$raw/current-release-api.json"
          current_release_source_sha="$(jq -er '.target_commitish | select(type == "string" and test("^[0-9a-f]{40}$"))' "$raw/current-release-api.json")"

          python - "$raw/wrangler.json" "$account_id" "$target_name" "$target_id" "$lineage" <<'PY'
          import json, sys
          output, account_id, name, database_id, lineage = sys.argv[1:]
          value = {
              'name': 'd1-current-target-read-only-observer',
              'compatibility_date': '2026-08-15',
              'account_id': account_id,
              'd1_databases': [{
                  'binding': 'D1_CURRENT_TARGET_DB',
                  'database_name': name,
                  'database_id': database_id,
                  'migrations_dir': lineage,
              }],
          }
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(value, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          export CLOUDFLARE_API_TOKEN="$CLOUDFLARE_OBSERVE_API_TOKEN"
          export CLOUDFLARE_ACCOUNT_ID="$account_id"

          npx --yes wrangler@4.94.0 d1 info "$target_name" \
            --config "$raw/wrangler.json" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/provider-identity.json"

          python - "$raw/provider-identity.json" "$target_name" "$target_id" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          name, database_id = sys.argv[2:]
          def paired(item):
              if isinstance(item, dict):
                  direct_name = item.get('name') or item.get('database_name')
                  direct_id = item.get('uuid') or item.get('id') or item.get('database_id')
                  if direct_name == name and direct_id == database_id:
                      return True
                  return any(paired(v) for v in item.values())
              if isinstance(item, list):
                  return any(paired(v) for v in item)
              return False
          if not paired(value):
              raise SystemExit('provider identity does not preserve exact current staging Catalog id/name pair')
          PY

          npx --yes wrangler@4.94.0 d1 execute "$target_name" --remote \
            --config "$raw/wrangler.json" \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name='d1_migrations'" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/ledger-table.json"

          if python - "$raw/ledger-table.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding='utf-8'))
          def contains(item):
              if isinstance(item, dict):
                  if item.get('name') == 'd1_migrations':
                      return True
                  return any(contains(v) for v in item.values())
              if isinstance(item, list):
                  return any(contains(v) for v in item)
              return False
          raise SystemExit(0 if contains(value) else 1)
          PY
          then
            npx --yes wrangler@4.94.0 d1 execute "$target_name" --remote \
              --config "$raw/wrangler.json" \
              --command "SELECT id, name FROM d1_migrations ORDER BY id" --json \
              --experimental-provision=false --experimental-auto-create=false \
              > "$raw/ledger.json"
          else
            printf '[{"results":[],"success":true}]\n' > "$raw/ledger.json"
          fi

          python scripts/d1-executor-plan.py normalize-ledger \
            --ledger "$raw/ledger.json" \
            --output "$raw/ledger-names.json"

          set +e
          npx --yes wrangler@4.94.0 d1 execute "$target_name" --remote \
            --config "$raw/wrangler.json" --command "PRAGMA foreign_key_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/foreign-key-check.stdout"
          foreign_key_exit_code=$?
          npx --yes wrangler@4.94.0 d1 execute "$target_name" --remote \
            --config "$raw/wrangler.json" --command "PRAGMA quick_check" --json \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/quick-check.stdout"
          quick_check_exit_code=$?
          set -e
          printf '%s\n' "$foreign_key_exit_code" > "$raw/foreign-key-check.exit-code"
          printf '%s\n' "$quick_check_exit_code" > "$raw/quick-check.exit-code"

          npx --yes wrangler@4.94.0 d1 migrations list "$target_name" --remote \
            --config "$raw/wrangler.json" \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/wrangler-pending.txt"

          python - "$raw/wrangler-pending.txt" "$raw/wrangler-pending.json" <<'PY'
          import json, re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          matches = re.findall(r'\b[0-9]{4}_[a-z0-9_]+\.sql\b', text)
          if len(matches) != len(set(matches)):
              raise SystemExit(f'Wrangler pending-list output is ambiguous/duplicated: {matches}')
          with open(sys.argv[2], 'w', encoding='utf-8') as handle:
              json.dump(matches, handle, sort_keys=False, indent=2)
              handle.write('\n')
          PY

          time_travel_args=()
          if [ -n "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" ]; then
            time_travel_args=(--timestamp "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS")
          fi
          npx --yes wrangler@4.94.0 d1 time-travel info "$target_name" \
            --config "$raw/wrangler.json" --json \
            "${time_travel_args[@]}" \
            --experimental-provision=false --experimental-auto-create=false \
            > "$raw/time-travel.json"
          jq -e 'type == "object" and (keys == ["bookmark"]) and (.bookmark | type == "string" and length > 0)' "$raw/time-travel.json" >/dev/null

          observed_at_unix_seconds="$(date -u +%s)"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          observation_source="github-actions://$GITHUB_REPOSITORY/$GITHUB_WORKFLOW/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"

          if [ -n "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" ]; then
            python - \
              "$raw/time-travel.json" \
              "$evidence/time-travel-lookup.json" \
              "$SOURCE_SHA" "$target_name" "$target_id" \
              "$REQUESTED_TIME_TRAVEL_UNIX_SECONDS" "$observed_at" "$observation_source" <<'PY'
          import json, sys
          raw_path, output_path, source_sha, target_name, target_id, timestamp, observed_at, observation_source = sys.argv[1:]
          value = json.load(open(raw_path, encoding='utf-8'))
          if set(value) != {'bookmark'} or not isinstance(value.get('bookmark'), str) or not value['bookmark']:
              raise SystemExit('Wrangler Time Travel lookup JSON is not the closed BookmarkResponse shape')
          document = {
              'schema_version': 1,
              'kind': 'D1_TIME_TRAVEL_LOOKUP_V1',
              'source_sha': source_sha,
              'environment': 'staging',
              'target': {'database_name': target_name, 'database_id': target_id},
              'requested_unix_seconds': int(timestamp),
              'bookmark': value['bookmark'],
              'observed_at': observed_at,
              'observation_source': observation_source,
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          fi

          python - \
            "$raw/ledger.json" "$raw/ledger-names.json" "$raw/wrangler-pending.json" \
            "$raw/provider-identity.json" "$raw/time-travel.json" \
            "$raw/foreign-key-check.stdout" "$raw/foreign-key-check.exit-code" \
            "$raw/quick-check.stdout" "$raw/quick-check.exit-code" \
            "$evidence/provider-observation.json" \
            "$SOURCE_SHA" "$account_id" "$target_name" "$target_id" \
            "$current_release_set_id" "$current_release_source_sha" \
            "$observed_at" "$observed_at_unix_seconds" "$observation_source" <<'PY'
          import hashlib, json, sys
          (
              ledger_path, ledger_names_path, pending_path, identity_path, time_travel_path,
              foreign_key_stdout_path, foreign_key_exit_path, quick_stdout_path, quick_exit_path,
              output_path, source_sha, account_id, target_name, target_id,
              current_release_set_id, current_release_source_sha,
              observed_at, observed_at_unix_seconds, observation_source,
          ) = sys.argv[1:]
          ledger = json.load(open(ledger_path, encoding='utf-8'))
          remote_migrations = json.load(open(ledger_names_path, encoding='utf-8'))
          pending = json.load(open(pending_path, encoding='utf-8'))
          identity = json.load(open(identity_path, encoding='utf-8'))
          time_travel = json.load(open(time_travel_path, encoding='utf-8'))

          def diagnostic(stdout_path, exit_path):
              raw_stdout = open(stdout_path, encoding='utf-8', errors='replace').read()
              exit_code = int(open(exit_path, encoding='utf-8').read().strip())
              try:
                  result = json.loads(raw_stdout)
                  json_valid = True
              except json.JSONDecodeError:
                  result = None
                  json_valid = False
              return {'exit_code': exit_code, 'json_valid': json_valid, 'raw_stdout': raw_stdout, 'result': result}

          foreign_key_check = diagnostic(foreign_key_stdout_path, foreign_key_exit_path)
          quick_check = diagnostic(quick_stdout_path, quick_exit_path)
          foreign_key_result = foreign_key_check['result']
          quick_result = quick_check['result']
          foreign_key_ok = (
              foreign_key_check['exit_code'] == 0 and foreign_key_check['json_valid']
              and isinstance(foreign_key_result, list) and len(foreign_key_result) == 1
              and isinstance(foreign_key_result[0], dict) and foreign_key_result[0].get('success') is True
              and foreign_key_result[0].get('results') == []
          )
          quick_rows = quick_result[0].get('results') if (
              quick_check['exit_code'] == 0 and quick_check['json_valid']
              and isinstance(quick_result, list) and len(quick_result) == 1
              and isinstance(quick_result[0], dict) and quick_result[0].get('success') is True
          ) else None
          quick_ok = (
              isinstance(quick_rows, list) and len(quick_rows) == 1
              and isinstance(quick_rows[0], dict) and list(quick_rows[0].values()) == ['ok']
          )
          canonical_ledger = json.dumps(ledger, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          provider_observation = {
              'schema_version': 1,
              'target': {
                  'environment': 'staging',
                  'account_id': account_id,
                  'database_name': target_name,
                  'database_id': target_id,
              },
              'observed_at_unix_seconds': int(observed_at_unix_seconds),
              'observation_source': observation_source,
              'remote_ledger_sha256': hashlib.sha256(canonical_ledger.encode('utf-8')).hexdigest(),
              'remote_migrations': remote_migrations,
              'wrangler_pending_migrations': pending,
              'deployment_identity': current_release_set_id,
              'time_travel_bookmark_capable': True,
          }
          document = {
              'schema_version': 1,
              'kind': 'D1_CURRENT_TARGET_OBSERVATION',
              'source_sha': source_sha,
              'environment': 'staging',
              'observed_at': observed_at,
              'component': 'catalog',
              'current_deployed_release_set_id': current_release_set_id,
              'current_deployed_source_sha': current_release_source_sha,
              'provider_observation_input': provider_observation,
              'provider_diagnostics': {
                  'schema_version': 1,
                  'foreign_key_check_ok': foreign_key_ok,
                  'quick_check_ok': quick_ok,
                  'foreign_key_check': foreign_key_check,
                  'quick_check': quick_check,
              },
              'provider_identity_observed': bool(identity),
              'time_travel_observation_present': bool(time_travel),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(output_path, 'w', encoding='utf-8') as handle:
              json.dump(document, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          SOURCE_SHA="$SOURCE_SHA" TARGET_NAME="$target_name" TARGET_ID="$target_id" jq -e \
            '.schema_version == 1 and .kind == "D1_CURRENT_TARGET_OBSERVATION" and .source_sha == env.SOURCE_SHA and .environment == "staging" and .component == "catalog" and .provider_observation_input.target.database_name == env.TARGET_NAME and .provider_observation_input.target.database_id == env.TARGET_ID and .provider_observation_input.target.environment == "staging" and (.current_deployed_release_set_id | test("^release-set-v(2|3)-sha256-[0-9a-f]{64}$")) and (.current_deployed_source_sha | test("^[0-9a-f]{40}$")) and .provider_observation_input.time_travel_bookmark_capable == true and .provider_diagnostics.schema_version == 1 and .provider_mutation == false and .d1_mutation == false and .production_mutation == false' \
            "$evidence/provider-observation.json" >/dev/null

          {
            echo "CURRENT_TARGET_NAME=$target_name"
            echo "CURRENT_TARGET_ID=$target_id"
            echo "CURRENT_DEPLOYED_RELEASE_SET_ID=$current_release_set_id"
            echo "CURRENT_DEPLOYED_SOURCE_SHA=$current_release_source_sha"
          } >> "$GITHUB_ENV"

      - name: Publish secret-free exact Time Travel lookup
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.time_travel_unix_seconds != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-time-travel-lookup-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-current-target-observation/time-travel-lookup.json
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on unusable provider diagnostics
        run: |
          set -euo pipefail
          jq -e \
            '.provider_diagnostics.foreign_key_check.exit_code == 0 and .provider_diagnostics.foreign_key_check.json_valid == true and .provider_diagnostics.foreign_key_check_ok == true and .provider_diagnostics.quick_check.exit_code == 0 and .provider_diagnostics.quick_check.json_valid == true and .provider_diagnostics.quick_check_ok == true' \
            artifacts/d1-current-target-observation/provider-observation.json >/dev/null

      - name: Run canonical credential-free transaction preflight
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_OBSERVE_API_TOKEN:-}"
          root="$RUNNER_TEMP/d1-preflight"
          evidence="artifacts/d1-transaction-preflight"
          observation="artifacts/d1-current-target-observation/provider-observation.json"
          mkdir -p "$root/target" "$root/current" "$evidence"
          test -f "$observation"

          cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          opsctl='tools/opsctl/target/debug/opsctl'
          test -x "$opsctl"
          python scripts/d1-prepare.py self-test

          target_release=''
          for _ in $(seq 1 48); do
            mapfile -t releases < <(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.target_commitish == \"$SOURCE_SHA\" and (.tag_name | startswith(\"release-set-v3-sha256-\")) and .draft == false) | .tag_name")
            if [ "${#releases[@]}" -gt 1 ]; then
              printf 'multiple immutable Release Sets target exact current source: %s\n' "${releases[*]}" >&2
              exit 1
            fi
            if [ "${#releases[@]}" -eq 1 ]; then
              target_release="${releases[0]}"
              break
            fi
            sleep 15
          done
          test -n "$target_release"

          download_release_assets() {
            local release_tag="$1"
            local output_dir="$2"
            local release_json="$output_dir/release-api.json"
            local asset_name asset_json asset_url asset_digest actual_digest
            mkdir -p "$output_dir"
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" > "$release_json"
            for asset_name in release-set.json control-plane.tar; do
              asset_json="$(jq -ce --arg name "$asset_name" '
                [.assets[] | select(.name == $name and .state == "uploaded")]
                | if length == 1 then .[0] else error("release asset missing or ambiguous") end
              ' "$release_json")"
              asset_url="$(jq -er '.browser_download_url | select(type == "string" and length > 0)' <<<"$asset_json")"
              asset_digest="$(jq -er '.digest | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))' <<<"$asset_json")"
              curl --fail --location --silent --show-error \
                --retry 5 --retry-delay 2 --retry-all-errors \
                --output "$output_dir/$asset_name" "$asset_url"
              actual_digest="sha256:$(sha256sum "$output_dir/$asset_name" | awk '{print $1}')"
              test "$actual_digest" = "$asset_digest"
            done
            rm -f "$release_json"
          }
          download_release_assets "$target_release" "$root/target"
          download_release_assets "$CURRENT_DEPLOYED_RELEASE_SET_ID" "$root/current"

          python - \
            "$root" "$target_release" "$SOURCE_SHA" \
            "$CURRENT_DEPLOYED_RELEASE_SET_ID" "$CURRENT_DEPLOYED_SOURCE_SHA" "$D1_COMPONENT" <<'PY'
          import hashlib, json, sys, tarfile
          from pathlib import Path
          root, target_id, target_source, current_id, current_source, component_id = sys.argv[1:]
          root = Path(root)
          def extract(folder, expected_id, expected_source, output):
              rs = json.load(open(folder / 'release-set.json', encoding='utf-8'))
              if rs.get('release_set_id') != expected_id or rs.get('schema_version') not in {2, 3}:
                  raise SystemExit(f'Release Set identity mismatch for {folder}')
              source = rs.get('source') or {}
              if source.get('repository') != 'iamaman11/part-crm-emai-profile' or source.get('commit_sha') != expected_source or source.get('accepted_main') is not True:
                  raise SystemExit(f'Release Set source mismatch for {folder}')
              component = (rs.get('components') or {}).get('control_plane') or {}
              if component.get('source_commit_sha') != expected_source:
                  raise SystemExit(f'control_plane source mismatch for {folder}')
              archive = folder / 'control-plane.tar'
              if hashlib.sha256(archive.read_bytes()).hexdigest() != component.get('artifact_sha256'):
                  raise SystemExit(f'control_plane artifact digest mismatch for {folder}')
              with tarfile.open(archive, 'r:*') as tar:
                  members = [m for m in tar.getmembers() if m.isfile() and Path(m.name).name == 'release-manifest.json']
                  if len(members) != 1:
                      raise SystemExit(f'control_plane manifest missing/ambiguous for {folder}')
                  raw = tar.extractfile(members[0]).read()
              if hashlib.sha256(raw).hexdigest() != component.get('component_manifest_sha256'):
                  raise SystemExit(f'control_plane manifest digest mismatch for {folder}')
              Path(output).write_bytes(raw)
          extract(root / 'target', target_id, target_source, root / 'target-manifest.json')
          extract(root / 'current', current_id, current_source, root / 'current-deployed-manifest.json')
          for path, label in ((root / 'target-manifest.json', 'target'), (root / 'current-deployed-manifest.json', 'current-deployed')):
              schema = json.load(open(path, encoding='utf-8')).get('schema_contract')
              if not isinstance(schema, dict) or schema.get('database_component') != component_id:
                  raise SystemExit(f'{label} release manifest is not for the current D1 component')
          PY
          printf '%s\n' "$target_release" > "$evidence/target-release-set-id.txt"

          "$opsctl" --root . d1 repository > "$root/d1-repository.json"
          python - \
            "$root/d1-repository.json" "$root/target-manifest.json" "$root/current-deployed-manifest.json" \
            "$root/current-runtime-manifest.json" "$root/known-good-runtime-manifest.json" \
            "$evidence/runtime-context.json" <<'PY'
          import json, os, sys
          repository_path, target_path, deployed_path, current_output, known_output, evidence_output = sys.argv[1:]
          component_id = os.environ['D1_COMPONENT']
          repository = json.load(open(repository_path, encoding='utf-8'))
          matches = [item for item in repository.get('components', []) if item.get('component_id') == component_id]
          if len(matches) != 1:
              raise SystemExit('typed D1 repository projection missing/ambiguous during preflight')
          component = matches[0]
          release = component.get('release_schema_contract')
          target = json.load(open(target_path, encoding='utf-8')).get('schema_contract')
          deployed = json.load(open(deployed_path, encoding='utf-8')).get('schema_contract')
          if not all(isinstance(value, dict) for value in (release, target, deployed)):
              raise SystemExit('typed release/target/deployed schema contracts are incomplete')
          if release.get('database_component') != component_id:
              raise SystemExit('typed D1 release schema contract component drifted')
          for field, owner_field in (
              ('migration_history_digest', 'history_digest'),
              ('compatibility_policy_digest', 'compatibility_policy_digest'),
          ):
              if release.get(field) != component.get(owner_field):
                  raise SystemExit(f'typed D1 release {field} is not bound to current repository authority')
          for field in (
              'database_component', 'target_schema_revision', 'supported_schema_min', 'supported_schema_max',
              'migration_history_digest', 'compatibility_policy_digest',
          ):
              if target.get(field) != release.get(field):
                  raise SystemExit(f'target Release Set schema contract drifted from typed D1 release authority: {field}')
          if deployed.get('database_component') != component_id:
              raise SystemExit('deployed Release Set component drifted')
          manifest = {'schema_contract': deployed}
          for output in (current_output, known_output):
              with open(output, 'w', encoding='utf-8') as handle:
                  json.dump(manifest, handle, sort_keys=True, indent=2)
                  handle.write('\n')
          evidence = {
              'schema_version': 1,
              'kind': 'D1_DEPLOYED_RUNTIME_CONTEXT',
              'source_sha': os.environ['SOURCE_SHA'],
              'basis': 'CURRENT_DEPLOYED_IMMUTABLE_RELEASE_SCHEMA_CONTRACT',
              'deployed_release_set_id': os.environ['CURRENT_DEPLOYED_RELEASE_SET_ID'],
              'deployed_release_source_sha': os.environ['CURRENT_DEPLOYED_SOURCE_SHA'],
              'deployed_release_target_revision': deployed.get('target_schema_revision'),
              'schema_contract': deployed,
              'release_schema_contract': release,
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          with open(evidence_output, 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY

          python - "$observation" "$SOURCE_SHA" "$CURRENT_TARGET_NAME" "$CURRENT_TARGET_ID" "$root/ledger.json" <<'PY'
          import json, sys, time
          path, source, name, dbid, ledger_path = sys.argv[1:]
          doc = json.load(open(path, encoding='utf-8'))
          obs = doc.get('provider_observation_input') or {}
          target = obs.get('target') or {}
          if doc.get('source_sha') != source or doc.get('kind') != 'D1_CURRENT_TARGET_OBSERVATION':
              raise SystemExit('observer evidence is not bound to exact accepted-main source/current target contract')
          if target.get('database_name') != name or target.get('database_id') != dbid or target.get('environment') != 'staging':
              raise SystemExit('observer target identity drifted')
          if doc.get('provider_mutation') or doc.get('d1_mutation') or doc.get('production_mutation'):
              raise SystemExit('observer evidence claims mutation')
          observed = obs.get('observed_at_unix_seconds')
          if not isinstance(observed, int) or observed > int(time.time()) + 60 or int(time.time()) - observed > 1800:
              raise SystemExit('observer evidence is stale for prepare preflight')
          names = obs.get('remote_migrations')
          pending = obs.get('wrangler_pending_migrations')
          if not isinstance(names, list) or not all(isinstance(x, str) for x in names):
              raise SystemExit('observer remote migration ledger is invalid')
          if not isinstance(pending, list) or not all(isinstance(x, str) for x in pending):
              raise SystemExit('observer Wrangler pending list is invalid')
          payload = [{'results': [{'id': i + 1, 'name': value} for i, value in enumerate(names)], 'success': True}]
          with open(ledger_path, 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          printf '{"component":"%s","completed":[]}\n' "$D1_COMPONENT" > "$root/preconditions.json"

          set +e
          python scripts/d1-prepare.py prepare \
            --opsctl "$opsctl" \
            --root . \
            --component "$D1_COMPONENT" \
            --ledger-json "$root/ledger.json" \
            --release-manifest "$root/target-manifest.json" \
            --current-manifest "$root/current-runtime-manifest.json" \
            --known-good-manifest "$root/known-good-runtime-manifest.json" \
            --preconditions-json "$root/preconditions.json" \
            --output "$evidence/prepare.json"
          rc=$?
          set -e
          test "$rc" = 0 -o "$rc" = 3
          jq -e '.status == "PREPARE_READY" or .status == "PREPARE_BLOCKED"' "$evidence/prepare.json" >/dev/null
          cp "$observation" "$evidence/provider-observation.json"

          python - \
            "$evidence/prepare.json" "$evidence/provider-observation.json" "$evidence/runtime-context.json" \
            "$evidence/summary.json" <<'PY'
          import json, os, sys
          prepare = json.load(open(sys.argv[1], encoding='utf-8'))
          observation = json.load(open(sys.argv[2], encoding='utf-8'))
          runtime_context = json.load(open(sys.argv[3], encoding='utf-8'))
          runtime_contract = runtime_context.get('schema_contract') or {}
          release_contract = runtime_context.get('release_schema_contract') or {}
          value = {
              'schema_version': 1,
              'kind': 'D1_TRANSACTION_PREFLIGHT',
              'source_sha': os.environ['SOURCE_SHA'],
              'observation_run_id': os.environ['GITHUB_RUN_ID'],
              'observation_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow_name': os.environ['GITHUB_WORKFLOW'],
              'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),
              'workflow_sha': os.environ.get('GITHUB_WORKFLOW_SHA'),
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'ref': os.environ['GITHUB_REF'],
              'target_database_name': os.environ['CURRENT_TARGET_NAME'],
              'target_database_id': os.environ['CURRENT_TARGET_ID'],
              'current_deployed_release_set_id': os.environ['CURRENT_DEPLOYED_RELEASE_SET_ID'],
              'runtime_context_target_revision': runtime_contract.get('target_schema_revision'),
              'runtime_context_supported_max': runtime_contract.get('supported_schema_max'),
              'release_target_revision': release_contract.get('target_schema_revision'),
              'release_supported_max': release_contract.get('supported_schema_max'),
              'status': prepare.get('status'),
              'raw_wrangler_pending_migrations': (observation.get('provider_observation_input') or {}).get('wrangler_pending_migrations'),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          if prepare.get('status') == 'PREPARE_READY':
              value['planned_migrations'] = (prepare.get('plan') or {}).get('planned_migrations', [])
          else:
              value['gate_results'] = prepare.get('gate_results', [])
          with open(sys.argv[4], 'w', encoding='utf-8') as handle:
              json.dump(value, handle, sort_keys=True, indent=2)
              handle.write('\n')
          PY
          echo 'D1 secret-free current-target preflight disposition:'
          cat "$evidence/summary.json"
          jq -c '{status, gate_results, plan: (if .status == "PREPARE_READY" then {decision: .plan.decision, ledger_state: .plan.ledger_state, planned_migrations: .plan.planned_migrations} else null end)}' "$evidence/prepare.json"

      - name: Publish secret-free D1 transaction preflight
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-transaction-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-transaction-preflight
          if-no-files-found: error
          retention-days: 30

      - name: Remove raw provider observations and preflight inputs from runner temp
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/d1-current-target-observation"
          rm -rf "$RUNNER_TEMP/d1-preflight"
