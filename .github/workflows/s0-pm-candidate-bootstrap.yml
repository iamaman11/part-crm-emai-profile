name: S0-PM Candidate Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/s0-pm-candidate-bootstrap.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: s0-pm-candidate-bootstrap
  cancel-in-progress: false

jobs:
  publish-accepted-candidate:
    name: Publish accepted Camoufox candidate (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    env:
      TARGET: ${{ matrix.target }}
      PROVEN_GENERATION_RUN: '33572782439'
    steps:
      - name: Checkout exact accepted-main bootstrap source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prove bounded accepted-main bootstrap authority
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3.12 scripts/check-camoufox-webgl-patch.py --self-test
          python3.12 scripts/verify-camoufox-patched-candidate.py --self-test

      - name: Resolve exact locked candidate identity
        run: |
          set -euo pipefail
          python3.12 - "$TARGET" >> "$GITHUB_ENV" <<'PY'
          import json
          import pathlib
          import sys

          target = sys.argv[1]
          lock = json.loads(pathlib.Path('runtime/camouhost/camoufox-patch-lock.json').read_text(encoding='utf-8'))
          candidate = lock['candidates'][target]
          artifact_sha = candidate['artifact_sha256']
          build_source_commit = candidate['build_source_commit']
          print(f'ARTIFACT_SHA256={artifact_sha}')
          print(f'BUILD_SOURCE_COMMIT={build_source_commit}')
          print(f'RELEASE_ID=camoufox-v1-{target}-sha256-{artifact_sha}')
          print(f'ARCHIVE_ASSET=camoufox-{target}.x86_64.zip')
          print(f'PROVENANCE_ASSET=camoufox-{target}.provenance.json')
          PY

      - name: Download exact accepted bytes from historical generation evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          name: s0-camoufox-${{ matrix.target }}-11e3696e37d5065633d93d5ddd05fdf1bb836b96
          path: artifacts/bootstrap-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33572782439

      - name: Verify source bytes before publication
        run: |
          set -euo pipefail
          archive="artifacts/bootstrap-source/${ARCHIVE_ASSET}"
          provenance="artifacts/bootstrap-source/${PROVENANCE_ASSET}"
          test -f "$archive"
          test -f "$provenance"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$ARTIFACT_SHA256"
          python3.12 scripts/verify-camoufox-patched-candidate.py \
            --archive "$archive" \
            --provenance "$provenance" \
            --target "$TARGET" \
            --build-source-commit "$BUILD_SOURCE_COMMIT"

      - name: Publish once or prove byte-identical durable authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_dir=artifacts/bootstrap-source
          durable_dir=artifacts/durable-existing
          if gh release view "$RELEASE_ID" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p "$durable_dir"
            gh release download "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$durable_dir" \
              --pattern "$ARCHIVE_ASSET" \
              --pattern "$PROVENANCE_ASSET"
            cmp "$source_dir/$ARCHIVE_ASSET" "$durable_dir/$ARCHIVE_ASSET"
            cmp "$source_dir/$PROVENANCE_ASSET" "$durable_dir/$PROVENANCE_ASSET"
            echo "Durable candidate already exists and is byte-identical: $RELEASE_ID"
          else
            gh release create "$RELEASE_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_ID" \
              --notes "Immutable content-addressed accepted Camoufox ${TARGET} candidate. Exact build-source/upstream/patch provenance is carried by the verified provenance asset and repository lock. This is not an application release or a mutable latest selector."
            gh release upload "$RELEASE_ID" \
              "$source_dir/$ARCHIVE_ASSET" \
              "$source_dir/$PROVENANCE_ASSET" \
              --repo "$GITHUB_REPOSITORY"
          fi

      - name: Re-resolve from durable authority and verify independently
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts/durable-proof
          mkdir -p artifacts/durable-proof
          gh release download "$RELEASE_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts/durable-proof \
            --pattern "$ARCHIVE_ASSET" \
            --pattern "$PROVENANCE_ASSET"
          test "$(sha256sum "artifacts/durable-proof/$ARCHIVE_ASSET" | cut -d' ' -f1)" = "$ARTIFACT_SHA256"
          python3.12 scripts/verify-camoufox-patched-candidate.py \
            --archive "artifacts/durable-proof/$ARCHIVE_ASSET" \
            --provenance "artifacts/durable-proof/$PROVENANCE_ASSET" \
            --target "$TARGET" \
            --build-source-commit "$BUILD_SOURCE_COMMIT"
          echo "Durable candidate authority proven: $RELEASE_ID"
