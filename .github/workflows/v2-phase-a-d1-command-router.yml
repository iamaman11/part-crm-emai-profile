name: V2 Phase A D1 Command Router

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: read

concurrency:
  group: cap-exec-v2-phase-a-d1-command-router
  cancel-in-progress: false

# STAGE_BOUND_V2_PHASE_A_ROUTER
# Thin GitHub provenance/transport adapter for #584. D1 planning, transaction
# identity and authorization semantics remain in credential-free typed owners.
# Historical PHASE_A_AUTHORIZATION text records are intentionally incompatible.
# This router never observes or mutates Cloudflare directly and dispatches only
# the sole canonical mutation owner: d1-migration-executor.yml.

jobs:
  route:
    if: >-
      github.event.issue.number == 584 &&
      startsWith(github.event.comment.body, '/v2-phase-a-d1')
    name: Route exact typed Phase A transaction authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
      COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
      SOURCE_SHA: ${{ github.sha }}
      EXPECTED_ACTOR: iamaman11
      EXPECTED_ISSUE: '584'
      CLOUDFLARE_ACCOUNT_ID: 4426df1449e417511bc7697d60b7f62f
      DATABASE_NAME: part-crm-catalog-staging-d3-20260815
      DATABASE_ID: af9abfd1-cb0e-4c58-aa5e-f09c8147f23f
    steps:
      - name: Parse exact owner command
        run: |
          set -euo pipefail
          test "$COMMENT_AUTHOR" = "$EXPECTED_ACTOR"
          test "$COMMENT_AUTHOR_ASSOCIATION" = "OWNER"
          python - <<'PY'
          import os
          from pathlib import Path

          lines = [line.strip() for line in os.environ['COMMENT_BODY'].strip().splitlines()]
          if not lines or lines[0] != '/v2-phase-a-d1':
              raise SystemExit('invalid command verb')
          values = {}
          for line in lines[1:]:
              if not line:
                  continue
              if '=' not in line:
                  raise SystemExit(f'invalid command line: {line!r}')
              key, value = line.split('=', 1)
              if key in values or not key or not value:
                  raise SystemExit('duplicate/empty command field')
              values[key] = value
          required = {
              'source_sha',
              'prepared_transaction_run_id',
              'prepared_transaction_run_attempt',
              'transaction_id',
              'authorization_comment_id',
          }
          if set(values) != required:
              raise SystemExit(f'exact fields required: {sorted(required)}')
          if len(values['source_sha']) != 40 or any(c not in '0123456789abcdef' for c in values['source_sha']):
              raise SystemExit('invalid source_sha')
          if not values['prepared_transaction_run_id'].isdigit():
              raise SystemExit('invalid prepared_transaction_run_id')
          if not values['prepared_transaction_run_attempt'].isdigit() or int(values['prepared_transaction_run_attempt']) <= 0:
              raise SystemExit('invalid prepared_transaction_run_attempt')
          if len(values['transaction_id']) != 64 or any(c not in '0123456789abcdef' for c in values['transaction_id']):
              raise SystemExit('invalid transaction_id')
          if not values['authorization_comment_id'].isdigit():
              raise SystemExit('invalid authorization_comment_id')
          out = Path(os.environ['GITHUB_ENV'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f"COMMAND_SOURCE_SHA={values['source_sha']}\n")
              fh.write(f"PREPARED_TRANSACTION_RUN_ID={values['prepared_transaction_run_id']}\n")
              fh.write(f"PREPARED_TRANSACTION_RUN_ATTEMPT={values['prepared_transaction_run_attempt']}\n")
              fh.write(f"TRANSACTION_ID={values['transaction_id']}\n")
              fh.write(f"AUTHORIZATION_COMMENT_ID={values['authorization_comment_id']}\n")
          PY

      - name: Verify exact protected-main source
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issue_comment
          test "$COMMAND_SOURCE_SHA" = "$SOURCE_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"

      - name: Load exact immutable prepared transaction
        run: |
          set -euo pipefail
          run_json="$RUNNER_TEMP/prepare-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARED_TRANSACTION_RUN_ID" > "$run_json"
          test "$(jq -r '.path' "$run_json")" = ".github/workflows/d1-migration-prepare.yml"
          test "$(jq -r '.event' "$run_json")" = "workflow_dispatch"
          test "$(jq -r '.head_sha' "$run_json")" = "$SOURCE_SHA"
          test "$(jq -r '.status' "$run_json")" = "completed"
          test "$(jq -r '.conclusion' "$run_json")" = "success"
          test "$(jq -r '.run_attempt' "$run_json")" = "$PREPARED_TRANSACTION_RUN_ATTEMPT"

          root="$RUNNER_TEMP/v2-phase-a-router"
          rm -rf "$root"
          mkdir -p "$root/transaction"
          artifact="d1-transaction-catalog-$PREPARED_TRANSACTION_RUN_ID-$PREPARED_TRANSACTION_RUN_ATTEMPT"
          gh run download "$PREPARED_TRANSACTION_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir "$root/transaction"
          test "$(find "$root/transaction" -maxdepth 1 -type f | wc -l)" -eq 1
          test -f "$root/transaction/transaction.json"

      - name: Verify prepared transaction stage envelope
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v2-phase-a-router"
          transaction="$root/transaction/transaction.json"
          tree_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq '.tree.sha')"
          jq -e \
            --arg transaction "$TRANSACTION_ID" \
            --arg source "$SOURCE_SHA" \
            --arg tree "$tree_sha" \
            --arg account "$CLOUDFLARE_ACCOUNT_ID" \
            --arg name "$DATABASE_NAME" \
            --arg database "$DATABASE_ID" \
            '
            .schema_version == 1
            and .status == "TRANSACTION_PREPARED"
            and .mode == "read-only"
            and .authorization_consumed == false
            and .mutation_executed == false
            and .provider_mutation_executed == false
            and .transaction_id == $transaction
            and .transaction_plan.source_sha == $source
            and .transaction_plan.tree_sha == $tree
            and .transaction_plan.transaction_kind == "D1_MIGRATION"
            and .transaction_plan.phase == "ORDINARY"
            and .transaction_plan.target.environment == "staging"
            and .transaction_plan.target.account_id == $account
            and .transaction_plan.target.database_name == $name
            and .transaction_plan.target.database_id == $database
            and .provider_observation.target == .transaction_plan.target
            and (.transaction_plan.release_candidate_id | test("^release-set-v3-sha256-[0-9a-f]{64}$"))
            and (.provider_observation.deployment_identity | type == "string")
            and (.provider_observation.deployment_identity | test("^release-set-v3-sha256-[0-9a-f]{64}$"))
            and (.transaction_plan.release_manifest_digests | keys == ["catalog"])
            and (.transaction_plan.release_manifest_digests.catalog | test("^[0-9a-f]{64}$"))
            ' "$transaction" >/dev/null
          {
            echo "TARGET_RELEASE_SET_ID=$(jq -r '.transaction_plan.release_candidate_id' "$transaction")"
            echo "CURRENT_RELEASE_SET_ID=$(jq -r '.provider_observation.deployment_identity' "$transaction")"
            echo "TARGET_MANIFEST_SHA256=$(jq -r '.transaction_plan.release_manifest_digests.catalog' "$transaction")"
          } >> "$GITHUB_ENV"

      - name: Verify durable typed authorization record
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v2-phase-a-router"
          auth_json="$root/authorization-comment.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTHORIZATION_COMMENT_ID" > "$auth_json"
          test "$(jq -r '.user.login' "$auth_json")" = "$EXPECTED_ACTOR"
          test "$(jq -r '.author_association' "$auth_json")" = "OWNER"
          test "$(jq -r '.issue_url' "$auth_json")" = "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$EXPECTED_ISSUE"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'v2-phase-a-router'
          comment = json.loads((root / 'authorization-comment.json').read_text(encoding='utf-8'))
          body = comment.get('body')
          if not isinstance(body, str):
              raise SystemExit('authorization comment body must be text')
          lines = body.strip().splitlines()
          if len(lines) != 2 or lines[0].strip() != 'D1_TRANSACTION_AUTHORIZATION_V1':
              raise SystemExit('typed authorization must use the exact two-line V1 envelope')
          raw = lines[1].strip()

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f'duplicate JSON key: {key}')
                  result[key] = value
              return result

          try:
              value = json.loads(raw, object_pairs_hook=strict_object)
          except (json.JSONDecodeError, ValueError) as exc:
              raise SystemExit(f'authorization payload is not strict JSON: {exc}')
          if not isinstance(value, dict):
              raise SystemExit('authorization payload must be one JSON object')
          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)
          if raw != canonical:
              raise SystemExit('authorization payload must be exact canonical compact sorted JSON')
          if value.get('transaction_id') != os.environ['TRANSACTION_ID']:
              raise SystemExit('authorization transaction_id does not match command')
          if value.get('authorization_reference') != comment.get('html_url'):
              raise SystemExit('authorization_reference must equal this exact GitHub comment URL')
          authorization_digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as fh:
              fh.write(f'TRANSACTION_AUTHORIZATION_JSON={raw}\n')
              fh.write(f'AUTHORIZATION_DIGEST={authorization_digest}\n')
          PY

      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Reverify exact checkout and immutable transaction source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$(jq -r '.transaction_plan.tree_sha' "$RUNNER_TEMP/v2-phase-a-router/transaction/transaction.json")"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"

      - name: Resolve exact target and current Release Sets from transaction
        run: |
          set -euo pipefail
          target_json="$RUNNER_TEMP/v2-phase-a-router/target-release.json"
          current_json="$RUNNER_TEMP/v2-phase-a-router/current-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_RELEASE_SET_ID" > "$target_json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$CURRENT_RELEASE_SET_ID" > "$current_json"
          test "$(jq -r '.target_commitish' "$target_json")" = "$SOURCE_SHA"
          current_source="$(jq -r '.target_commitish' "$current_json")"
          test "${#current_source}" -eq 40
          [[ "$current_source" =~ ^[0-9a-f]{40}$ ]]
          echo "CURRENT_RELEASE_SOURCE=$current_source" >> "$GITHUB_ENV"

      - name: Download immutable transaction-bound Release Sets
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v2-phase-a-router"
          mkdir -p "$root/target" "$root/current"
          gh release download "$TARGET_RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$root/target" --pattern release-set.json --pattern control-plane.tar
          gh release download "$CURRENT_RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --dir "$root/current" --pattern release-set.json --pattern control-plane.tar
          test "$(find "$root/target" -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find "$root/current" -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Verify transaction-bound component manifests
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ['RUNNER_TEMP']) / 'v2-phase-a-router'
          transaction = json.loads((root / 'transaction' / 'transaction.json').read_text(encoding='utf-8'))
          plan = transaction['transaction_plan']
          observation = transaction['provider_observation']

          def sha256(raw: bytes) -> str:
              return hashlib.sha256(raw).hexdigest()

          def verify(label: str, release_set_id: str, source_sha: str) -> tuple[dict, str]:
              rs = json.loads((root / label / 'release-set.json').read_text(encoding='utf-8'))
              if rs.get('schema_version') != 3 or rs.get('release_set_id') != release_set_id:
                  raise SystemExit(f'{label}: release-set identity mismatch')
              source = rs.get('source') or {}
              if source.get('repository') != os.environ['GITHUB_REPOSITORY'] or source.get('commit_sha') != source_sha or source.get('accepted_main') is not True:
                  raise SystemExit(f'{label}: accepted-main source mismatch')
              component = (rs.get('components') or {}).get('control_plane')
              if not isinstance(component, dict) or component.get('source_commit_sha') != source_sha:
                  raise SystemExit(f'{label}: control-plane binding mismatch')
              archive_raw = (root / label / 'control-plane.tar').read_bytes()
              if sha256(archive_raw) != component.get('artifact_sha256'):
                  raise SystemExit(f'{label}: archive digest mismatch')
              with tarfile.open(root / label / 'control-plane.tar', mode='r:') as archive:
                  members = [m for m in archive.getmembers() if m.isfile() and PurePosixPath(m.name).name == 'release-manifest.json']
                  if len(members) != 1:
                      raise SystemExit(f'{label}: exactly one release-manifest.json required')
                  extracted = archive.extractfile(members[0])
                  if extracted is None:
                      raise SystemExit(f'{label}: manifest unreadable')
                  raw = extracted.read()
              digest = sha256(raw)
              if digest != component.get('component_manifest_sha256'):
                  raise SystemExit(f'{label}: component manifest digest mismatch')
              manifest = json.loads(raw)
              if (json.dumps(manifest, sort_keys=True, indent=2) + '\n').encode() != raw:
                  raise SystemExit(f'{label}: manifest is not canonical JSON')
              (root / f'{label}-manifest.json').write_bytes(raw)
              return manifest, digest

          target, target_digest = verify('target', os.environ['TARGET_RELEASE_SET_ID'], os.environ['SOURCE_SHA'])
          current, _ = verify('current', os.environ['CURRENT_RELEASE_SET_ID'], os.environ['CURRENT_RELEASE_SOURCE'])
          if target_digest != os.environ['TARGET_MANIFEST_SHA256']:
              raise SystemExit('target manifest does not match immutable transaction digest')

          target_contract = target.get('schema_contract') or {}
          target_migrations = target.get('migrations') or {}
          if target_contract.get('database_component') != 'catalog':
              raise SystemExit('target manifest component mismatch')
          if target_contract.get('target_schema_revision') != plan['schema_target']:
              raise SystemExit('target schema revision does not match immutable transaction')
          if target_contract.get('supported_schema_min') != plan['supported_schema_min']:
              raise SystemExit('target supported min does not match immutable transaction')
          if target_contract.get('supported_schema_max') != plan['supported_schema_max']:
              raise SystemExit('target supported max does not match immutable transaction')
          if target_migrations.get('latest') != plan['schema_target']:
              raise SystemExit('target latest migration does not match immutable transaction')

          predecessor = observation.get('remote_migrations')
          if not isinstance(predecessor, list) or not predecessor:
              raise SystemExit('V2 Phase A requires a non-empty sealed predecessor ledger')
          current_target = predecessor[-1]
          current_contract = current.get('schema_contract') or {}
          current_migrations = current.get('migrations') or {}
          if current_contract.get('database_component') != 'catalog':
              raise SystemExit('current manifest component mismatch')
          if current_contract.get('target_schema_revision') != current_target:
              raise SystemExit('current schema target does not match sealed predecessor')
          if current_migrations.get('latest') != current_target:
              raise SystemExit('current latest migration does not match sealed predecessor')
          PY

      - name: Race-check main before dispatch
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"

      - name: Dispatch sole canonical executor with exact typed transaction authorization
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"
          root="$RUNNER_TEMP/v2-phase-a-router"
          target_manifest="$(jq -c . "$root/target-manifest.json")"
          current_manifest="$(jq -c . "$root/current-manifest.json")"
          confirmation="$SOURCE_SHA:staging:catalog:$DATABASE_ID"
          jq -n \
            --arg ref main \
            --arg environment staging \
            --arg source_sha "$SOURCE_SHA" \
            --arg component catalog \
            --arg account_id "$CLOUDFLARE_ACCOUNT_ID" \
            --arg database_name "$DATABASE_NAME" \
            --arg database_id "$DATABASE_ID" \
            --arg target_release_manifest_json "$target_manifest" \
            --arg current_release_manifest_json "$current_manifest" \
            --arg known_good_release_manifest_json "$current_manifest" \
            --arg transition_mode ordinary \
            --arg prepared_transaction_run_id "$PREPARED_TRANSACTION_RUN_ID" \
            --arg prepared_transaction_run_attempt "$PREPARED_TRANSACTION_RUN_ATTEMPT" \
            --arg transaction_id "$TRANSACTION_ID" \
            --arg authorization_digest "$AUTHORIZATION_DIGEST" \
            --arg transaction_authorization_json "$TRANSACTION_AUTHORIZATION_JSON" \
            --arg confirmation "$confirmation" \
            '{ref:$ref,inputs:{environment:$environment,source_sha:$source_sha,component:$component,account_id:$account_id,database_name:$database_name,database_id:$database_id,target_release_manifest_json:$target_release_manifest_json,current_release_manifest_json:$current_release_manifest_json,known_good_release_manifest_json:$known_good_release_manifest_json,transition_mode:$transition_mode,prepared_transaction_run_id:$prepared_transaction_run_id,prepared_transaction_run_attempt:$prepared_transaction_run_attempt,transaction_id:$transaction_id,authorization_digest:$authorization_digest,transaction_authorization_json:$transaction_authorization_json,mutation_authorized:true,confirmation:$confirmation}}' \
            > "$RUNNER_TEMP/d1-dispatch.json"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/dispatches" --input "$RUNNER_TEMP/d1-dispatch.json"
          rm -f "$RUNNER_TEMP/d1-dispatch.json"
          echo "Canonical Phase A executor dispatch accepted for exact transaction $TRANSACTION_ID authorization $AUTHORIZATION_DIGEST on main $SOURCE_SHA."
