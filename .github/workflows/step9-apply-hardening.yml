name: Step 9 Apply Hardening

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step9-apply-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Apply bounded security hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          text = replace_once(text, "use zeroize::Zeroize;", "use zeroize::{Zeroize, Zeroizing};", "zeroizing import")
          text = replace_once(
              text,
              "#[derive(Clone, Copy, Eq, Hash, Ord, PartialEq, PartialOrd)]\npub(crate) struct NonceDomain([u8; 32]);",
              "#[derive(Eq, Hash, Ord, PartialEq, PartialOrd)]\npub(crate) struct NonceDomain([u8; 32]);\n\nimpl Drop for NonceDomain {\n    fn drop(&mut self) {\n        self.0.zeroize();\n    }\n}",
              "nonce-domain memory boundary",
          )
          text = replace_once(text, "digest.update(self.bytes);", "digest.update(self.bytes.as_slice());", "nonce-domain digest borrowing")
          text = replace_once(
              text,
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub struct OpenedGeneration {\n    metadata: GenerationMetadata,\n    plaintext: Vec<u8>,\n}",
              "pub struct OpenedGeneration {\n    metadata: GenerationMetadata,\n    plaintext: Zeroizing<Vec<u8>>,\n}",
              "opened result type",
          )
          text = replace_once(
              text,
              "    #[must_use]\n    pub fn into_plaintext(self) -> Vec<u8> {\n        self.plaintext\n    }\n}",
              "    pub(crate) fn into_parts(self) -> (GenerationMetadata, Zeroizing<Vec<u8>>) {\n        (self.metadata, self.plaintext)\n    }\n}",
              "opened result transfer",
          )
          text = replace_once(
              text,
              "    let mut plaintext = Vec::with_capacity(\n        usize::try_from(metadata.plaintext_bytes())\n            .map_err(|_| EncryptedGenerationError::PlaintextTooLarge)?,\n    );",
              "    let mut plaintext = Zeroizing::new(Vec::new());",
              "authenticated-growth plaintext buffer",
          )
          text = replace_once(
              text,
              "        let opened = cipher\n            .decrypt(\n                &nonce_from_bytes(&nonce_bytes)?,\n                Payload {\n                    msg: ciphertext,\n                    aad: &aad,\n                },\n            )\n            .map_err(|_| EncryptedGenerationError::AuthenticationFailed)?;",
              "        let opened = Zeroizing::new(\n            cipher\n                .decrypt(\n                    &nonce_from_bytes(&nonce_bytes)?,\n                    Payload {\n                        msg: ciphertext,\n                        aad: &aad,\n                    },\n                )\n                .map_err(|_| EncryptedGenerationError::AuthenticationFailed)?,\n        );",
              "decrypted chunk zeroization",
          )
          container.write_text(text, encoding="utf-8")

          lifecycle = Path("crates/encrypted-generation-domain/src/lifecycle.rs")
          text = lifecycle.read_text(encoding="utf-8")
          text = replace_once(text, "use std::collections::{BTreeMap, BTreeSet};", "use std::collections::{BTreeMap, BTreeSet};\nuse zeroize::Zeroizing;", "restore zeroizing import")
          text = replace_once(
              text,
              "#[derive(Clone, Debug, Eq, PartialEq)]\npub struct RestoreResult {\n    metadata: GenerationMetadata,\n    plaintext: Vec<u8>,\n}",
              "pub struct RestoreResult {\n    metadata: GenerationMetadata,\n    plaintext: Zeroizing<Vec<u8>>,\n}",
              "restore result type",
          )
          raw_extraction = "\n    #[must_use]\n    pub fn into_plaintext(self) -> Vec<u8> {\n        self.plaintext\n    }"
          if raw_extraction in text:
              text = text.replace(raw_extraction, "", 1)
          text = replace_once(text, "#[derive(Clone, Default, Eq, PartialEq)]\npub struct CloudGenerationRepository {", "#[derive(Default)]\npub struct CloudGenerationRepository {", "repository sensitive-state derives")
          text = replace_once(
              text,
              "        let opened = match open_generation_expected(\n            container,\n            key,\n            record.metadata.tenant_id(),\n            record.metadata.profile_id(),\n            generation_id,\n        ) {\n            Ok(opened) => opened,\n            Err(error) => {\n                self.quarantine(generation_id)?;\n                return Err(error);\n            }\n        };",
              "        let opened = open_generation_expected(\n            container,\n            key,\n            record.metadata.tenant_id(),\n            record.metadata.profile_id(),\n            generation_id,\n        )?;",
              "wrong-key quarantine boundary",
          )
          text = replace_once(
              text,
              "        Ok(RestoreResult {\n            metadata: opened.metadata().clone(),\n            plaintext: opened.into_plaintext(),\n        })",
              "        let (metadata, plaintext) = opened.into_parts();\n        Ok(RestoreResult {\n            metadata,\n            plaintext,\n        })",
              "restore result transfer",
          )
          lifecycle.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          replacements = (
              (
                  "    assert_eq!(\n        open_generation(&tampered, &key(0x48)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    );",
                  "    assert!(matches!(\n        open_generation(&tampered, &key(0x48)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  "    assert_eq!(\n        open_generation(&container, &key(0x50)?),\n        Err(EncryptedGenerationError::InvalidContainer)\n    );",
                  "    assert!(matches!(\n        open_generation(&container, &key(0x50)?),\n        Err(EncryptedGenerationError::InvalidContainer)\n    ));",
              ),
              (
                  "    assert_eq!(\n        open_generation(&container, &key(0x51)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    );",
                  "    assert!(matches!(\n        open_generation(&container, &key(0x51)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  "    assert_eq!(\n        open_generation(sealed.container(), &key(0x53)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    );",
                  "    assert!(matches!(\n        open_generation(sealed.container(), &key(0x53)?),\n        Err(EncryptedGenerationError::AuthenticationFailed)\n    ));",
              ),
              (
                  "    assert_eq!(\n        open_generation_expected(\n            sealed.container(),\n            &key(0x52)?,\n            &tenant_id,\n            &profile_id,\n            &other,\n        ),\n        Err(EncryptedGenerationError::IdentityMismatch)\n    );",
                  "    assert!(matches!(\n        open_generation_expected(\n            sealed.container(),\n            &key(0x52)?,\n            &tenant_id,\n            &profile_id,\n            &other,\n        ),\n        Err(EncryptedGenerationError::IdentityMismatch)\n    ));",
              ),
          )
          for index, (old, new) in enumerate(replacements, start=1):
              text = replace_once(text, old, new, f"non-Debug result assertion {index}")

          if "fn wrong_key_does_not_quarantine_unchanged_object" not in text:
              anchor = "\n#[test]\nfn corruption_is_quarantined_and_cannot_become_current()"
              proof = (
                  "\n#[test]\n"
                  "fn wrong_key_does_not_quarantine_unchanged_object()\n"
                  "-> Result<(), Box<dyn std::error::Error>> {\n"
                  "    let mut repository = CloudGenerationRepository::default();\n"
                  "    let metadata = metadata(\"generation_01JSTEP9WRONGKEY\", 0x4b, b\"healthy object\")?;\n"
                  "    repository.publish(metadata.clone(), &key(0x5b)?, b\"healthy object\", UnixMillis::new(1))?;\n"
                  "    assert!(matches!(repository.restore(metadata.generation_id(), &key(0x5c)?, UnixMillis::new(2)), Err(EncryptedGenerationError::AuthenticationFailed)));\n"
                  "    assert_eq!(repository.record(metadata.generation_id()).ok_or(EncryptedGenerationError::MissingGeneration)?.status(), CloudGenerationStatus::Verified);\n"
                  "    assert_eq!(repository.restore(metadata.generation_id(), &key(0x5b)?, UnixMillis::new(3))?.plaintext(), b\"healthy object\");\n"
                  "    Ok(())\n"
                  "}\n"
              )
              if text.count(anchor) != 1:
                  raise SystemExit("wrong-key proof anchor is missing or duplicated")
              text = text.replace(anchor, proof + anchor, 1)

          if "fn malformed_headers_and_trailing_bytes_fail_closed" not in text:
              anchor = "\n#[test]\nfn invalid_key_id_and_chunk_size_fail_closed()"
              proof = (
                  "\n#[test]\n"
                  "fn malformed_headers_and_trailing_bytes_fail_closed()\n"
                  "-> Result<(), Box<dyn std::error::Error>> {\n"
                  "    let plaintext = b\"strict parser\";\n"
                  "    let metadata = metadata(\"generation_01JSTEP9MALFORMED\", 0x4c, plaintext)?;\n"
                  "    let sealed = seal_generation(&metadata, &key(0x5d)?, plaintext)?;\n"
                  "    let mut bad_magic = sealed.container().to_vec();\n"
                  "    bad_magic[0] ^= 0x01;\n"
                  "    assert!(matches!(open_generation(&bad_magic, &key(0x5d)?), Err(EncryptedGenerationError::InvalidContainer)));\n"
                  "    let mut unsupported_version = sealed.container().to_vec();\n"
                  "    unsupported_version[12] = 0;\n"
                  "    unsupported_version[13] = 2;\n"
                  "    assert!(matches!(open_generation(&unsupported_version, &key(0x5d)?), Err(EncryptedGenerationError::UnsupportedVersion)));\n"
                  "    let mut oversized_metadata = b\"BPGC0001\".to_vec();\n"
                  "    oversized_metadata.extend_from_slice(&4_097_u32.to_be_bytes());\n"
                  "    assert!(matches!(open_generation(&oversized_metadata, &key(0x5d)?), Err(EncryptedGenerationError::InvalidContainer)));\n"
                  "    let mut trailing = sealed.into_container();\n"
                  "    trailing.push(0);\n"
                  "    assert!(matches!(open_generation(&trailing, &key(0x5d)?), Err(EncryptedGenerationError::InvalidContainer)));\n"
                  "    Ok(())\n"
                  "}\n"
              )
              if text.count(anchor) != 1:
                  raise SystemExit("malformed-container proof anchor is missing or duplicated")
              text = text.replace(anchor, proof + anchor, 1)
          tests.write_text(text, encoding="utf-8")

          docs = Path("docs/ENCRYPTED_CLOUD_GENERATIONS.md")
          text = docs.read_text(encoding="utf-8")
          if "## Repository-local security hardening" not in text:
              text += (
                  "\n\n## Repository-local security hardening\n\n"
                  "- nonce reuse claims are keyed by a non-exported digest of the actual DEK bytes, not caller-controlled key IDs;\n"
                  "- nonce-domain values are not cloneable or printable and are zeroized on drop;\n"
                  "- plaintext-bearing results do not implement `Clone` or `Debug`, and buffers use `Zeroizing`;\n"
                  "- restore grows plaintext only after each record authenticates and never preallocates from unauthenticated size metadata;\n"
                  "- a wrong DEK does not quarantine an immutable object while its cataloged digest still matches;\n"
                  "- malformed headers and trailing bytes fail closed.\n"
              )
          docs.write_text(text, encoding="utf-8")

          policy = Path("scripts/check-step9-encrypted-generation.py")
          text = policy.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    \"zeroize\",\n)",
              "    \"zeroize\",\n    \"Zeroizing\",\n    \"nonce_domain\",\n    \"impl Drop for NonceDomain\",\n    \"let mut plaintext = Zeroizing::new(Vec::new())\",\n    \"wrong_key_does_not_quarantine_unchanged_object\",\n    \"malformed_headers_and_trailing_bytes_fail_closed\",\n)",
              "policy required hardening fragments",
          )
          text = replace_once(
              text,
              "GENERATION_DEK_DEBUG = re.compile(\n    r\"#\\[derive\\([^\\]]*Debug[^\\]]*\\)\\]\\s*pub\\s+struct\\s+GenerationDek\",\n    re.MULTILINE,\n)",
              "SENSITIVE_DEBUG = re.compile(\n    r\"#\\[derive\\([^\\]]*Debug[^\\]]*\\)\\]\\s*(?:pub(?:\\(crate\\))?\\s+)?struct\\s+\"\n    r\"(?:GenerationDek|OpenedGeneration|RestoreResult|NonceDomain)\",\n    re.MULTILINE,\n)",
              "sensitive Debug policy",
          )
          text = replace_once(text, "    if GENERATION_DEK_DEBUG.search(source_text):\n        failures.append(\"GenerationDek must not derive Debug\")", "    if SENSITIVE_DEBUG.search(source_text):\n        failures.append(\"key and plaintext-bearing types must not derive Debug\")", "sensitive Debug enforcement")
          text = replace_once(
              text,
              "    bootstrap = root / \".github/workflows/step9-lockfile-bootstrap.yml\"\n    if bootstrap.exists():\n        failures.append(\"temporary Step 9 lockfile bootstrap workflow must be removed\")",
              "    bootstrap_workflows = sorted((root / \".github/workflows\").glob(\"step9-*.yml\"))\n    if bootstrap_workflows:\n        failures.append(\"temporary Step 9 workflows must be removed\")",
              "temporary workflow policy",
          )
          policy.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary files before policy checks
        run: git rm .github/workflows/step9-apply-hardening.yml .step9-hardening-trigger

      - name: Verify hardening
        run: |
          cargo fmt --all
          python -m py_compile scripts/check-step9-encrypted-generation.py
          python scripts/check-step9-encrypted-generation.py --root .
          if python scripts/check-step9-encrypted-generation.py --root tests/encrypted-generation/fixtures/logs-key; then
            echo "negative fixture unexpectedly passed" >&2
            exit 1
          fi
          cargo clippy --locked -p encrypted-generation-domain --all-targets -- -D warnings
          cargo test --locked -p encrypted-generation-domain

      - name: Commit verified hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 9: harden encrypted generation memory boundaries"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
