name: Phase 2E IMAP Query Restore

on:
  push:
    branches:
      - phase2e-mailbox-cloud-lane
    paths:
      - .github/workflows/phase2e-imap-query-restore.yml

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2e-mailbox-cloud-lane

      - name: Apply bounded Unicode literal delta
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/cloudflare-adapters/src/imap_query.rs')
          text = path.read_text(encoding='utf-8')
          old = '''async fn search_uid_window(
              session: &mut ImapSession,
              start: u64,
              end: u64,
              request: &SearchClientMailboxMessagesRequest,
          ) -> Result<Vec<u64>, QueryPortError> {
              if start == 0 || end < start {
                  return Err(integrity_failure());
              }
              let mut command = String::from("UID SEARCH ");
              if request.term().is_some_and(|term| !term.as_str().is_ascii()) {
                  command.push_str("CHARSET UTF-8 ");
              }
              command.push_str("UID ");
              command.push_str(&start.to_string());
              command.push(':');
              command.push_str(&end.to_string());
              if let Some(term) = request.term() {
                  command.push_str(" TEXT ");
                  push_imap_quoted(&mut command, term.as_str());
              }
              let response = session
                  .execute(&command, MAX_IMAP_CONTROL_RESPONSE_BYTES)
                  .await
                  .map_err(map_transport_error)?;
              require_ok(&response)?;
              parse_search_uids(&response.text_lossy())
          }
          '''
          new = '''async fn search_uid_window(
              session: &mut ImapSession,
              start: u64,
              end: u64,
              request: &SearchClientMailboxMessagesRequest,
          ) -> Result<Vec<u64>, QueryPortError> {
              if start == 0 || end < start {
                  return Err(integrity_failure());
              }
              let mut command = String::from("UID SEARCH ");
              if let Some(term) = request.term() {
                  if !term.as_str().is_ascii() {
                      command.push_str("CHARSET UTF-8 ");
                  }
                  command.push_str("UID ");
                  command.push_str(&start.to_string());
                  command.push(':');
                  command.push_str(&end.to_string());
                  command.push_str(" TEXT");
                  let response = if term.as_str().is_ascii() {
                      command.push(' ');
                      push_imap_quoted(&mut command, term.as_str());
                      session
                          .execute(&command, MAX_IMAP_CONTROL_RESPONSE_BYTES)
                          .await
                          .map_err(map_transport_error)?
                  } else {
                      session
                          .execute_with_literal(
                              &command,
                              term.as_str().as_bytes(),
                              MAX_IMAP_CONTROL_RESPONSE_BYTES,
                          )
                          .await
                          .map_err(map_transport_error)?
                  };
                  require_ok(&response)?;
                  return parse_search_uids(&response.text_lossy());
              }

              command.push_str("UID ");
              command.push_str(&start.to_string());
              command.push(':');
              command.push_str(&end.to_string());
              let response = session
                  .execute(&command, MAX_IMAP_CONTROL_RESPONSE_BYTES)
                  .await
                  .map_err(map_transport_error)?;
              require_ok(&response)?;
              parse_search_uids(&response.text_lossy())
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('accepted search_uid_window marker not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          session = Path('crates/cloudflare-adapters/src/imap_session.rs')
          session_text = session.read_text(encoding='utf-8')
          old_test = '''        assert_eq!(
              literal_command_prefix("p000001", "UID SEARCH CHARSET UTF-8 UID 1:500 TEXT", 6,)?,
              "p000001 UID SEARCH CHARSET UTF-8 UID 1:500 TEXT {6}\\r\\n"
          );
          '''
          new_test = '''        let prefix = literal_command_prefix(
              "p000001",
              "UID SEARCH CHARSET UTF-8 UID 1:500 TEXT",
              6,
          )
          .map_err(|_| "literal command prefix failed")?;
          assert_eq!(
              prefix,
              "p000001 UID SEARCH CHARSET UTF-8 UID 1:500 TEXT {6}\\r\\n"
          );
          '''
          if session_text.count(old_test) != 1:
              raise SystemExit('IMAP literal test marker not found exactly once')
          session.write_text(session_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Format and verify adapter logic
        run: |
          cargo fmt --all
          cargo test --locked -p cloudflare-adapters --lib

      - name: Verify composed Worker for WASM
        run: cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown

      - name: Verify Phase 2E boundary contract
        run: |
          python scripts/check-phase2e-mailbox-boundaries.py
          python scripts/check-phase2e-mailbox-boundaries.py --self-test

      - name: Commit verified product delta and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-imap-query-restore.yml
          git add crates/cloudflare-adapters/src/imap_query.rs crates/cloudflare-adapters/src/imap_session.rs
          git diff --cached --check
          git commit -m "Phase 2E: apply Unicode literals to accepted IMAP query"
          git push origin HEAD:phase2e-mailbox-cloud-lane
