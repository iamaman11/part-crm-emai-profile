name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-consistency-materialize:
    name: Post-Phase 2D Semantic Consistency Materialization
    if: github.event_name == 'pull_request' && github.head_ref == 'docs-phase2d-semantic-consistency'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consistency branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2d-semantic-consistency
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize accepted Phase 2D semantics
        run: python scripts/materialize-post-phase2d-consistency.py

      - name: Validate semantic consistency and inventory
        run: |
          python -m py_compile scripts/generate-architecture-inventory.py
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          grep -Fq 'Phase 2E issue #148 is the unique next implementation slice' docs/DEVELOPMENT_PLAN.md
          grep -Fq '| A8 | CQRS/read-model boundary | **Accepted in Phase 2D**' docs/DEVELOPER_CAPABILITY_MATRIX.md
          grep -Fq 'query-mail-api' architecture/inventory.json
          git diff --check

      - name: Restore permanent workflow and commit bounded correction
        run: |
          git checkout origin/main -- .github/workflows/frontend-gate.yml
          rm -f scripts/materialize-post-phase2d-consistency.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached origin/main --name-only | sort | tr '\n' ' ')" = "architecture/inventory.json docs/DEVELOPER_CAPABILITY_MATRIX.md docs/DEVELOPMENT_PLAN.md scripts/generate-architecture-inventory.py "
          git commit -m 'Docs: reconcile accepted Phase 2D semantics and harden consistency'
          git push origin HEAD:docs-phase2d-semantic-consistency

  frontend:
    name: React Operator UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Clean install from lockfile
        working-directory: frontend
        run: npm ci

      - name: Reject credential persistence and token surfaces in application source
        run: |
          if grep -R -n -E --include='*.ts' --include='*.tsx' '(localStorage|sessionStorage|Cf-Access-Jwt-Assertion)' frontend/src; then
            echo "Forbidden browser credential persistence/token surface found in application source." >&2
            exit 1
          fi

      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify Static Assets output
        run: |
          test -f frontend/dist/index.html
          find frontend/dist/assets -type f -print -quit | grep -q .
