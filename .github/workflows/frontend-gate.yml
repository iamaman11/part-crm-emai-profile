name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-closeout-materialize:
    name: Phase 2D Docs Closeout Materialization
    if: github.event_name == 'pull_request' && github.head_ref == 'docs-phase2d-closeout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2d-closeout
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize normative closeout
        run: python scripts/phase2d-docs-closeout.py

      - name: Validate bounded closeout
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md "
          grep -q 'Phase 2D — CQRS read models, global search and client-mail query contract — ACCEPTED' docs/DEVELOPMENT_PLAN.md
          grep -q 'Phase 2E — Mailbox domain decomposition and real cloud mailbox lane — NEXT' docs/DEVELOPMENT_PLAN.md
          grep -q 'Phase 2E issue #148 is the unique NEXT' docs/DEVELOPMENT_PLAN.md
          grep -q 'ad491e2f0c9ba9f79130923fdde6fe1407af4dc5' docs/DEVELOPMENT_PLAN.md
          grep -q '26f8fa82bdad02a5a0867b0d36748b915579ef1c' docs/DEVELOPMENT_PLAN.md
          grep -q 'Phase 2D accepts capability-owned' docs/ARCHITECTURE.md
          python scripts/generate-architecture-inventory.py --check
          git diff --check

      - name: Restore permanent workflow and commit docs only
        run: |
          git checkout origin/main -- .github/workflows/frontend-gate.yml
          rm -f .github/workflows/phase2d-docs-closeout-materializer.yml
          rm -f scripts/phase2d-docs-closeout-trigger.txt
          rm -f scripts/phase2d-docs-closeout.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md "
          git commit -m 'Docs: accept Phase 2D and mark Phase 2E next'
          git push origin HEAD:docs-phase2d-closeout

  frontend:
    name: React Operator UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Clean install from lockfile
        working-directory: frontend
        run: npm ci

      - name: Reject credential persistence and token surfaces in application source
        run: |
          if grep -R -n -E --include='*.ts' --include='*.tsx' '(localStorage|sessionStorage|Cf-Access-Jwt-Assertion)' frontend/src; then
            echo "Forbidden browser credential persistence/token surface found in application source." >&2
            exit 1
          fi

      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify Static Assets output
        run: |
          test -f frontend/dist/index.html
          find frontend/dist/assets -type f -print -quit | grep -q .
