name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linear-roadmap-materialize:
    name: Materialize linear Phase 1 to Phase 2 roadmap
    if: github.event_name == 'pull_request' && github.head_ref == 'docs-linear-phase1-phase2-roadmap' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-linear-phase1-phase2-roadmap

      - name: Materialize and validate roadmap
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize-linear-roadmap.py
          python scripts/generate-architecture-inventory.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          plan = Path('docs/DEVELOPMENT_PLAN.md').read_text(encoding='utf-8')
          future = Path('docs/FUTURE_DEVELOPMENT.md').read_text(encoding='utf-8')
          next_sections = re.findall(r'^### (Phase [^\n]+?) — NEXT\s*$', plan, re.MULTILINE)
          if next_sections != ['Phase 1B — Delivery hardening, catch-up and operations']:
              raise SystemExit(f'unexpected NEXT sections: {next_sections}')
          forbidden = re.findall(r'^## \d+\. Phase (?:3|4|5|6|7|8|9|10)\b.*$', plan, re.MULTILINE)
          if forbidden:
              raise SystemExit(f'legacy active phase headings remain: {forbidden}')
          if 'Phase 9 — CRM' in plan or 'Phase 3 — External CRM' in plan:
              raise SystemExit('CRM remains an active numbered phase')
          if 'External CRM integration is a future capability, not an active Phase 3.' not in future:
              raise SystemExit('future CRM boundary missing')
          if '— NEXT' in future:
              raise SystemExit('future-development document must not define NEXT')
          print('Linear roadmap policy checks passed.')
          PY
          rm scripts/materialize-linear-roadmap.py
          git diff --check

      - name: Commit materialized documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEVELOPMENT_PLAN.md \
            docs/DEVELOPER_CAPABILITY_MATRIX.md \
            docs/INDEX.md \
            docs/FUTURE_DEVELOPMENT.md \
            scripts/materialize-linear-roadmap.py
          git diff --cached --check
          git commit -m 'Docs: linearize Phase 1 and Phase 2 execution roadmap'
          git push origin HEAD:docs-linear-phase1-phase2-roadmap
