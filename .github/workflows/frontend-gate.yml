name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1a-materialize:
    name: Materialize Phase 1A generated repository state
    if: github.event_name == 'pull_request' && github.head_ref == 'phase1a-event-outbox-foundation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase1a-event-outbox-foundation

      - name: Materialize lockfile and architecture inventory
        run: |
          cargo generate-lockfile
          python scripts/generate-architecture-inventory.py --write
          python scripts/test-integration-event-foundation.py
          git diff --check

      - name: Commit generated repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock architecture/inventory.json
          if git diff --cached --quiet; then
            echo 'Generated repository state already current.'
            exit 0
          fi
          git commit -m 'Phase 1A: materialize lockfile and architecture inventory'
          git push origin HEAD:phase1a-event-outbox-foundation

  frontend:
    name: React Operator UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Clean install from lockfile
        working-directory: frontend
        run: npm ci

      - name: Reject credential persistence and token surfaces in application source
        run: |
          if grep -R -n -E --include='*.ts' --include='*.tsx' '(localStorage|sessionStorage|Cf-Access-Jwt-Assertion)' frontend/src; then
            echo "Forbidden browser credential persistence/token surface found in application source." >&2
            exit 1
          fi

      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify Static Assets output
        run: |
          test -f frontend/dist/index.html
          find frontend/dist/assets -type f -print -quit | grep -q .
