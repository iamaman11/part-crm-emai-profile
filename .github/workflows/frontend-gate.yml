name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linear-roadmap-cleanup:
    name: Clean stale roadmap phase references
    if: github.event_name == 'pull_request' && github.head_ref == 'docs-linear-phase1-phase2-roadmap' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout roadmap branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-linear-phase1-phase2-roadmap

      - name: Clean and validate normative roadmap
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix-linear-roadmap-stale-refs.py
          python scripts/generate-architecture-inventory.py --check
          python - <<'PY'
          from pathlib import Path
          import re
          plan = Path('docs/DEVELOPMENT_PLAN.md').read_text(encoding='utf-8')
          next_sections = re.findall(r'^### (Phase [^\n]+?) — NEXT\s*$', plan, re.MULTILINE)
          if next_sections != ['Phase 1B — Delivery hardening, catch-up and operations']:
              raise SystemExit(f'unexpected NEXT sections: {next_sections}')
          stale = [
              token for token in (
                  'Phase 7 is completion/polish',
                  'production promotion remains Phase 10',
                  'Phase 1B may proceed in parallel',
                  'Phase 1B is eligible to proceed',
              ) if token in plan
          ]
          if stale:
              raise SystemExit(f'stale execution wording remains: {stale}')
          print('Final linear roadmap wording checks passed.')
          PY
          rm scripts/fix-linear-roadmap-stale-refs.py
          git diff --check

      - name: Commit clean documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEVELOPMENT_PLAN.md scripts/fix-linear-roadmap-stale-refs.py
          git diff --cached --check
          git commit -m 'Docs: remove stale phase references from linear roadmap'
          git push origin HEAD:docs-linear-phase1-phase2-roadmap
