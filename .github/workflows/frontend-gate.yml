name: Frontend Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: frontend-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase2f-docs-materialize:
    name: Phase 2F Runtime Contract Materialization
    if: github.event_name == 'pull_request' && github.head_ref == 'docs-phase2f-runtime-contract-refinement'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2f-runtime-contract-refinement
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize Phase 2F refinement
        run: python scripts/materialize-phase2f-runtime-refinement.py

      - name: Validate docs and architecture consistency
        run: |
          python -m py_compile scripts/generate-architecture-inventory.py
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          grep -Fq '`BrowserIdentityManifest`' docs/DEVELOPMENT_PLAN.md
          grep -Fq '`NetworkIdentityPolicy` + `NetworkIdentityObservation`' docs/DEVELOPMENT_PLAN.md
          grep -Fq 'PID alone is never sufficient ownership proof' docs/DEVELOPMENT_PLAN.md
          grep -Fq 'blanket `PRAGMA integrity_check`' docs/DEVELOPMENT_PLAN.md
          grep -Fq '### 11.1 Browser Runtime Identity, Network Policy And Writer Recovery' docs/ARCHITECTURE.md
          git diff --check

      - name: Restore permanent workflow and commit bounded refinement
        run: |
          git checkout origin/main -- .github/workflows/frontend-gate.yml
          rm -f scripts/materialize-phase2f-runtime-refinement.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test "$(git diff --cached origin/main --name-only | sort | tr '\n' ' ')" = "docs/ARCHITECTURE.md docs/DEVELOPMENT_PLAN.md scripts/generate-architecture-inventory.py "
          git commit -m 'Docs: refine Phase 2F browser runtime contracts'
          git push origin HEAD:docs-phase2f-runtime-contract-refinement

  frontend:
    name: React Operator UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Clean install from lockfile
        working-directory: frontend
        run: npm ci

      - name: Reject credential persistence and token surfaces in application source
        run: |
          if grep -R -n -E --include='*.ts' --include='*.tsx' '(localStorage|sessionStorage|Cf-Access-Jwt-Assertion)' frontend/src; then
            echo "Forbidden browser credential persistence/token surface found in application source." >&2
            exit 1
          fi

      - name: Strict TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: Verify Static Assets output
        run: |
          test -f frontend/dist/index.html
          find frontend/dist/assets -type f -print -quit | grep -q .
