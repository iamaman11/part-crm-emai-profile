name: Step 2 Rustfmt

on:
  push:
    branches:
      - repository-step-2-domain-contract-skeleton

permissions:
  contents: write

concurrency:
  group: step-2-rustfmt
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-2-domain-contract-skeleton
          persist-credentials: true

      - name: Apply exact rustfmt
        run: cargo fmt --all

      - name: Commit formatting when changed
        run: |
          if git diff --quiet; then
            echo "Formatting is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates apps
          git commit -m "style: apply Step 2 rustfmt"
          git push origin HEAD:repository-step-2-domain-contract-skeleton
