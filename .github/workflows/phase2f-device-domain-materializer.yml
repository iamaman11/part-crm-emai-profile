name: Phase 2F Device Domain Materializer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2f-device-domain-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'phase2f-device-browser-mailbox'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 2F branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2f-device-browser-mailbox

      - name: Harden provider-independent device domain
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          ids = Path('crates/device-domain/src/id.rs')
          replace_once(ids, '                self.0.fmt(formatter)\n', '                formatter.write_str(self.0.as_str())\n')

          job = Path('crates/device-domain/src/job.rs')
          replace_once(
              job,
              'use profile_platform_primitives::{\n    AggregateVersion, DeviceClaimId, DeviceJobId, UnixMillis, VersionOverflow,\n};\n\nuse crate::{claim::DeviceClaim, target::DeviceJobTarget};\n',
              'use profile_platform_primitives::{AggregateVersion, UnixMillis, VersionOverflow};\n\nuse crate::{\n    claim::DeviceClaim,\n    id::{DeviceClaimId, DeviceJobId},\n    target::DeviceJobTarget,\n};\n',
          )
          replace_once(
              job,
              '        matches!(Self::Succeeded | Self::Failed | Self::Cancelled, self)\n',
              '        matches!(self, Self::Succeeded | Self::Failed | Self::Cancelled)\n',
          )
          replace_once(
              job,
              '''    ) -> Result<(), DeviceJobError> {\n        self.release_running_claim(claim_id, fence, observed_at)?;\n        if retry_at <= observed_at {\n            return Err(DeviceJobError::InvalidRetryAt);\n        }\n        self.status = DeviceJobStatus::ProfileBusy;\n''',
              '''    ) -> Result<(), DeviceJobError> {\n        if retry_at <= observed_at {\n            return Err(DeviceJobError::InvalidRetryAt);\n        }\n        self.release_running_claim(claim_id, fence, observed_at)?;\n        self.status = DeviceJobStatus::ProfileBusy;\n''',
          )
          replace_once(
              job,
              '''    ) -> Result<(), DeviceJobError> {\n        self.release_running_claim(claim_id, fence, observed_at)?;\n        if self.attempt >= self.max_attempts {\n            return Err(DeviceJobError::AttemptsExhausted);\n        }\n        if retry_at <= observed_at {\n            return Err(DeviceJobError::InvalidRetryAt);\n        }\n        self.status = DeviceJobStatus::RetryScheduled;\n''',
              '''    ) -> Result<(), DeviceJobError> {\n        if self.attempt >= self.max_attempts {\n            return Err(DeviceJobError::AttemptsExhausted);\n        }\n        if retry_at <= observed_at {\n            return Err(DeviceJobError::InvalidRetryAt);\n        }\n        self.release_running_claim(claim_id, fence, observed_at)?;\n        self.status = DeviceJobStatus::RetryScheduled;\n''',
          )
          expire = '''\n    pub fn expire_claim(\n        &mut self,\n        observed_at: UnixMillis,\n        retry_at: UnixMillis,\n    ) -> Result<DeviceJobStatus, DeviceJobError> {\n        self.ensure_time(observed_at)?;\n        if self.status != DeviceJobStatus::Running {\n            return Err(DeviceJobError::InvalidState);\n        }\n        let claim = self\n            .active_claim\n            .as_ref()\n            .ok_or(DeviceJobError::MissingActiveClaim)?;\n        if !claim.is_expired(observed_at) {\n            return Err(DeviceJobError::LeaseStillActive);\n        }\n        let next_status = if self.attempt >= self.max_attempts {\n            DeviceJobStatus::Failed\n        } else {\n            if retry_at <= observed_at {\n                return Err(DeviceJobError::InvalidRetryAt);\n            }\n            DeviceJobStatus::RetryScheduled\n        };\n        self.active_claim = None;\n        self.status = next_status;\n        self.retry_at = (next_status == DeviceJobStatus::RetryScheduled).then_some(retry_at);\n        self.advance(observed_at)?;\n        Ok(next_status)\n    }\n'''
          marker = '\n    pub fn require_auth(\n'
          text = job.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('job expire insertion marker must occur once')
          job.write_text(text.replace(marker, expire + marker, 1), encoding='utf-8')
          replace_once(
              job,
              '    LeaseExpired,\n    AttemptsExhausted,\n',
              '    LeaseExpired,\n    LeaseStillActive,\n    AttemptsExhausted,\n',
          )
          replace_once(
              job,
              '            Self::LeaseExpired => "device job claim lease expired",\n            Self::AttemptsExhausted =>',
              '            Self::LeaseExpired => "device job claim lease expired",\n            Self::LeaseStillActive => "device job claim lease is still active",\n            Self::AttemptsExhausted =>',
          )
          replace_once(
              job,
              '''    use crate::target::DeviceJobTarget;\n    use profile_platform_primitives::{\n        DeviceClaimId, DeviceId, DeviceJobId, GenerationId, ProfileId, TenantId, UnixMillis,\n    };\n''',
              '''    use crate::{\n        id::{DeviceClaimId, DeviceJobId},\n        target::DeviceJobTarget,\n    };\n    use profile_platform_primitives::{\n        DeviceId, GenerationId, ProfileId, TenantId, UnixMillis,\n    };\n''',
          )
          retry_test_marker = '''    #[test]\n    fn retry_auth_and_recovery_states_never_become_false_success()\n'''
          lease_test = '''    #[test]\n    fn expired_claim_retries_or_fails_but_never_succeeds()\n    -> Result<(), Box<dyn std::error::Error>> {\n        let mut retrying = job(2)?;\n        retrying.claim(\n            DeviceClaimId::parse("devclaim_01JDEVICE1")?,\n            UnixMillis::new(110),\n            UnixMillis::new(120),\n        )?;\n        assert_eq!(\n            retrying.expire_claim(UnixMillis::new(120), UnixMillis::new(150))?,\n            DeviceJobStatus::RetryScheduled\n        );\n\n        let mut exhausted = job(1)?;\n        exhausted.claim(\n            DeviceClaimId::parse("devclaim_01JDEVICE2")?,\n            UnixMillis::new(110),\n            UnixMillis::new(120),\n        )?;\n        assert_eq!(\n            exhausted.expire_claim(UnixMillis::new(120), UnixMillis::new(150))?,\n            DeviceJobStatus::Failed\n        );\n        assert!(exhausted.status().is_terminal());\n        Ok(())\n    }\n\n'''
          text = job.read_text(encoding='utf-8')
          if text.count(retry_test_marker) != 1:
              raise SystemExit('job lease test insertion marker must occur once')
          job.write_text(text.replace(retry_test_marker, lease_test + retry_test_marker, 1), encoding='utf-8')
          terminal_marker = '''    #[test]\n    fn terminal_state_is_sticky()'''
          atomic_test = '''    #[test]\n    fn invalid_retry_does_not_partially_release_running_claim()\n    -> Result<(), Box<dyn std::error::Error>> {\n        let mut job = job(2)?;\n        let claim_id = DeviceClaimId::parse("devclaim_01JDEVICE")?;\n        let claim = job.claim(claim_id.clone(), UnixMillis::new(110), UnixMillis::new(200))?;\n        assert_eq!(\n            job.mark_profile_busy(\n                &claim_id,\n                claim.fence(),\n                UnixMillis::new(120),\n                UnixMillis::new(120),\n            ),\n            Err(DeviceJobError::InvalidRetryAt)\n        );\n        assert_eq!(job.status(), DeviceJobStatus::Running);\n        assert!(job.active_claim().is_some());\n        Ok(())\n    }\n\n'''
          text = job.read_text(encoding='utf-8')
          if text.count(terminal_marker) != 1:
              raise SystemExit('job atomic test insertion marker must occur once')
          job.write_text(text.replace(terminal_marker, atomic_test + terminal_marker, 1), encoding='utf-8')

          Path('crates/device-domain/src/lib.rs').write_text('''#![forbid(unsafe_code)]\n\npub mod claim;\npub mod id;\npub mod job;\npub mod target;\n\npub use claim::{DeviceClaim, DeviceClaimError};\npub use id::{DeviceClaimId, DeviceJobId};\npub use job::{DeviceJob, DeviceJobError, DeviceJobStatus};\npub use target::DeviceJobTarget;\n''', encoding='utf-8')

          cargo = Path('Cargo.toml')
          replace_once(cargo, '    "crates/client-domain",\n', '    "crates/client-domain",\n    "crates/device-domain",\n')
          replace_once(cargo, 'client-domain = { path = "crates/client-domain" }\n', 'client-domain = { path = "crates/client-domain" }\ndevice-domain = { path = "crates/device-domain" }\n')

          architecture = Path('scripts/check-architecture.py')
          replace_once(
              architecture,
              '    "client-domain": {"profile-platform-primitives", "contracts", "zeroize"},\n',
              '    "client-domain": {"profile-platform-primitives", "contracts", "zeroize"},\n    "device-domain": {"profile-platform-primitives"},\n',
          )
          PY

      - name: Materialize generated consistency
        run: |
          cargo generate-lockfile
          cargo fmt --all
          python scripts/generate-architecture-inventory.py --write

      - name: Verify device domain
        run: |
          python scripts/check-architecture.py
          cargo clippy --locked -p device-domain --all-targets -- -D warnings
          cargo test --locked -p device-domain
          python scripts/generate-architecture-inventory.py --check

      - name: Commit verified slice and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2f-device-domain-materializer.yml
          git add Cargo.toml Cargo.lock architecture/inventory.json scripts/check-architecture.py crates/device-domain
          git diff --cached --check
          git commit -m "Phase 2F: establish durable device job domain"
          git push origin HEAD:phase2f-device-browser-mailbox
