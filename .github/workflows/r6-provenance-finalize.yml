name: R6 Provenance Finalize Temporary

on:
  push:
    branches:
      - audit/r6-accepted-provenance
    paths:
      - .github/workflows/r6-provenance-finalize.yml

permissions:
  contents: write

jobs:
  finalize-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/r6-accepted-provenance
          fetch-depth: 1

      - name: Record accepted R6 provenance fail closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "**Current accepted base:** `51719b5b0590c76fd4b18ae876b02c69e59756c8` after accepted R5 PR #187 from exact source head `1c51bf850ce6ec2cae63a086eee24411b413c2d3`",
                  "**Current accepted base:** `48c49349047a0a200e6d405ed1a2623ab6183d87` after accepted R6 PR #190 from exact source head `94e66d139b1b5227c9edb2981d07e529afdf72d5`",
              ),
              (
                  "### R6 — P1/P2 — Frontend API facade is becoming a central bottleneck\n\n**Finding**",
                  "### R6 — P1/P2 — Frontend API facade is becoming a central bottleneck — ACCEPTED\n\n**Accepted main:** squash merge `48c49349047a0a200e6d405ed1a2623ab6183d87` via PR #190 from exact source head `94e66d139b1b5227c9edb2981d07e529afdf72d5`.\n\n**Finding**",
              ),
              (
                  "6. **Frontend API modularization** — R6, preferably aligned with R4 capability migrations rather than a mechanical rewrite.",
                  "6. **Frontend API modularization** — R6. Accepted via PR #190 / `48c49349047a0a200e6d405ed1a2623ab6183d87` from exact source head `94e66d139b1b5227c9edb2981d07e529afdf72d5`.",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one provenance target, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          required = (
              "**Status:** ACTIVE / BLOCKING PHASE 2J",
              "**Production readiness:** remains `false`",
              "### R7 — P1 — Current repository documentation is not a single truthful authority",
              "Phase 2J may resume only when all of the following are true on accepted `main`:",
              "all R1-R7 findings are closed with permanent regression evidence",
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f"freeze/provenance invariant missing: {token}")

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md

      - name: Commit provenance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r6-provenance-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRE2J_ARCHITECTURE_REMEDIATION_PLAN.md .github/workflows/r6-provenance-finalize.yml
          git commit -m "Record accepted R6 provenance"
          git push origin HEAD:audit/r6-accepted-provenance
