name: TX-7 Executor Checker Patcher

on:
  push:
    branches:
      - tx7-issue-triggered-restore

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/tx7-issue-triggered-restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: tx7-issue-triggered-restore
          fetch-depth: 0

      - name: Patch existing D1 executor checker invariant
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/check-d1-migration-executor.mjs')
          text = path.read_text(encoding='utf-8')
          marker = "const RESTORE_APPLY_STEP = 'Restore exact D1 bookmark with deploy credential';"
          if marker in text:
              print('checker already patched; no-op')
              raise SystemExit(0)

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, observed={count}')
              text = text.replace(old, new, 1)

          replace_once(
              "const APPLY_STEP = 'Apply planned migrations with deploy credential';\n",
              "const APPLY_STEP = 'Apply planned migrations with deploy credential';\n"
              "const RESTORE_PREWRITE_STEP = 'Fresh pre-write provider identity, ledger, diagnostics and bookmark proof';\n"
              "const RESTORE_APPLY_STEP = 'Restore exact D1 bookmark with deploy credential';\n"
              "const RESTORE_POSTVERIFY_STEP = 'Fresh post-restore ledger and diagnostics proof';\n",
              'restore step constants',
          )
          replace_once(
              "  if (deploySteps !== 1) fail(`deploy-capable credential must appear exactly once; observed=${deploySteps}`);\n",
              "  if (deploySteps !== 2) fail(`deploy-capable credential must appear exactly once in each mutually exclusive migration/restore write step; observed=${deploySteps}`);\n",
              'deploy reference cardinality',
          )

          deploy_anchor = "  for (const forbidden of [OBSERVE_REF, 'd1 info', 'd1 execute', 'd1 migrations list', 'ledger-fence.json', 'status-fence.json', 'verify-pending']) {\n"
          deploy_anchor += "    if (deployStep.includes(forbidden)) fail(`sole deploy credential step must contain only actual apply boundary, not read-only revalidation: ${forbidden}`);\n"
          deploy_anchor += "  }\n"
          restore_checks = deploy_anchor + "\n"
          restore_checks += "  const restorePrewriteStep = stepBody(text, RESTORE_PREWRITE_STEP);\n"
          restore_checks += "  if (!restorePrewriteStep.includes(OBSERVE_REF)) fail('restore pre-write proof must use the dedicated observe credential');\n"
          restore_checks += "  if (restorePrewriteStep.includes(DEPLOY_REF)) fail('restore pre-write proof must never receive the deploy credential');\n"
          restore_checks += "  for (const marker of ['d1 info', 'SELECT id, name FROM d1_migrations ORDER BY id', 'd1 time-travel info', 'PRAGMA foreign_key_check', 'PRAGMA quick_check']) {\n"
          restore_checks += "    if (!restorePrewriteStep.includes(marker)) fail(`restore pre-write proof lost read-only marker: ${marker}`);\n"
          restore_checks += "  }\n\n"
          restore_checks += "  const restoreDeployStep = stepBody(text, RESTORE_APPLY_STEP);\n"
          restore_checks += "  for (const marker of [DEPLOY_REF, 'test -n \"$CLOUDFLARE_API_TOKEN\"', '--request POST', '/time_travel/restore?bookmark=$RESTORE_BOOKMARK']) {\n"
          restore_checks += "    if (!restoreDeployStep.includes(marker)) fail(`restore deploy step lost exact write marker: ${marker}`);\n"
          restore_checks += "  }\n"
          restore_checks += "  for (const forbidden of [OBSERVE_REF, 'd1 migrations apply', 'd1 create', 'd1 delete', 'PRAGMA ']) {\n"
          restore_checks += "    if (restoreDeployStep.includes(forbidden)) fail(`restore deploy credential step acquired forbidden read/migration surface: ${forbidden}`);\n"
          restore_checks += "  }\n\n"
          restore_checks += "  const restorePostverifyStep = stepBody(text, RESTORE_POSTVERIFY_STEP);\n"
          restore_checks += "  if (!restorePostverifyStep.includes(OBSERVE_REF)) fail('restore post-verify must use the dedicated observe credential');\n"
          restore_checks += "  if (restorePostverifyStep.includes(DEPLOY_REF)) fail('restore post-verify must never receive the deploy credential');\n"
          restore_checks += "  for (const marker of ['SELECT id, name FROM d1_migrations ORDER BY id', 'PRAGMA foreign_key_check', 'PRAGMA quick_check', 'expected-post-ledger.json']) {\n"
          restore_checks += "    if (!restorePostverifyStep.includes(marker)) fail(`restore post-verify lost fail-closed marker: ${marker}`);\n"
          restore_checks += "  }\n"
          replace_once(deploy_anchor, restore_checks, 'restore credential/effect structure')

          owner_anchor = "  if (remoteMutationPaths.length !== 1 || remoteMutationPaths[0] !== EXECUTOR) {\n"
          owner_anchor += "    fail(`exactly one workflow may own remote D1 migrations apply; observed=${JSON.stringify(remoteMutationPaths)}`);\n"
          owner_anchor += "  }\n"
          restore_owner = owner_anchor + "\n"
          restore_owner += "  const restoreMutationPaths = [];\n"
          restore_owner += "  for (const workflowPath of workflows) {\n"
          restore_owner += "    const candidate = normalizedShell(await readFile(path.join(root, workflowPath), 'utf8'));\n"
          restore_owner += "    if (candidate.includes(DEPLOY_REF) && /\\/time_travel\\/restore\\?bookmark=/.test(candidate)) restoreMutationPaths.push(workflowPath);\n"
          restore_owner += "  }\n"
          restore_owner += "  if (restoreMutationPaths.length !== 1 || restoreMutationPaths[0] !== EXECUTOR) {\n"
          restore_owner += "    fail(`exactly one workflow may own D1 Time Travel restore; observed=${JSON.stringify(restoreMutationPaths)}`);\n"
          restore_owner += "  }\n"
          replace_once(owner_anchor, restore_owner, 'sole restore mutation owner')

          negative_anchor = "  await expectRejected('deploy token used for observation', replaceFixture('deploy token used for observation', text, OBSERVE_REF, DEPLOY_REF));\n"
          negative = negative_anchor
          negative += "  await expectRejected(\n    'third deploy credential exposure',\n    `${text}\\n# ${DEPLOY_REF}\\n`,\n  );\n"
          replace_once(negative_anchor, negative, 'deploy credential negative fixture')

          old_message = 'durable MUTATION_STARTED before sole deploy credential/apply, mechanically known applied events, D1-supported fail-closed post-verify diagnostics'
          if old_message in text:
              text = text.replace(old_message, 'durable MUTATION_STARTED before bounded deploy credential writes, mechanically known applied events, D1-supported fail-closed post-verify diagnostics', 1)

          path.write_text(text, encoding='utf-8')
          PY

          node scripts/check-d1-migration-executor.mjs
          node scripts/check-d1-migration-executor.mjs --self-test

      - name: Commit checker patch to feature branch
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/check-d1-migration-executor.mjs; then
            echo 'no checker diff to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/check-d1-migration-executor.mjs
          git commit -m 'TX-7: prove bounded restore deploy credential'
          git push origin HEAD:tx7-issue-triggered-restore
