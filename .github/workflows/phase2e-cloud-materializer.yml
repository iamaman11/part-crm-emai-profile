name: Phase 2E Cloud Consistency Materializer

on:
  push:
    branches:
      - phase2e-mailbox-cloud-lane
    paths:
      - .github/workflows/phase2e-cloud-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2e-mailbox-cloud-lane
      - name: Materialize cloud provider composition and generated consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/control-plane-worker/src/mailbox_jobs.rs')
          text = path.read_text(encoding='utf-8')
          old_import = '''use cloudflare_adapters::mailbox_provider::{
              DeterministicFakeMailboxProvider, DeterministicMailboxOutcome,
          };'''
          new_import = 'use cloudflare_adapters::cloud_mailbox_provider::CloudMailboxProviderRouter;'
          if text.count(old_import) != 1:
              raise SystemExit('expected one deterministic mailbox provider import')
          text = text.replace(old_import, new_import)
          old_provider = '''    let mut provider = DeterministicFakeMailboxProvider::new(
              DeterministicMailboxOutcome::Success {
                  provider_status: "SYNTHETIC_OK".to_owned(),
                  bounded_item_count: 0,
                  next_cursor: None,
              },
          );'''
          new_provider = '    let mut provider = CloudMailboxProviderRouter::new(env);'
          if text.count(old_provider) != 1:
              raise SystemExit('expected one deterministic production mailbox provider')
          path.write_text(text.replace(old_provider, new_provider), encoding='utf-8')

          path = Path('crates/cloudflare-adapters/src/gmail_mailbox.rs')
          text = path.read_text(encoding='utf-8')
          old = 'use worker::{Fetch, Headers, Method, Request, RequestInit};\n'
          new = old + 'use zeroize::Zeroize;\n'
          if text.count(old) != 1:
              raise SystemExit('expected gmail worker import')
          text = text.replace(old, new)
          if text.count('    authorization.clear();') != 1:
              raise SystemExit('expected gmail bearer clear')
          path.write_text(text.replace('    authorization.clear();', '    authorization.zeroize();'), encoding='utf-8')
          PY
          cargo generate-lockfile
          cargo fmt --all
          python scripts/generate-architecture-inventory.py --write
          git rm .github/workflows/phase2e-cloud-materializer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock architecture/inventory.json apps/control-plane-worker/src/mailbox_jobs.rs crates/cloudflare-adapters/src/gmail_mailbox.rs crates/cloudflare-adapters/src/*.rs
          git commit -m "Phase 2E: compose real cloud mailbox providers"
          git push origin HEAD:phase2e-mailbox-cloud-lane
