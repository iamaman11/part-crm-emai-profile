name: Phase 2A Branch Format

on:
  push:
    branches:
      - phase2a-client-protection-foundation

permissions:
  contents: write

concurrency:
  group: phase2a-branch-format
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2a-client-protection-foundation
          persist-credentials: true

      - name: Format Rust workspace
        run: cargo fmt

      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Phase 2A: apply cargo fmt"
          git push origin HEAD:phase2a-client-protection-foundation
