name: AR8C Program Projection Sync Scratch

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'scratch/ar8c-program-projection-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: scratch/ar8c-program-projection-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Advance accepted AR-8B to current AR-8C machine state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one guarded replacement, observed {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          generator = 'scripts/generate-architecture-inventory.py'
          replace_once(
              generator,
              'AR-8B projects one metadata-only credential authority without creating a competing registry.',
              'AR-8B projects the accepted metadata-only credential authority; AR-8C projects its bounded operational lifecycle without creating a competing registry.',
          )
          replace_once(
              generator,
              'AR8B_IMPLEMENTATION_ISSUE = 309\nACCEPTED_SLICES = ["AR-0", "AR-1", "AR-2", "AR-3", "AR-4A", "AR-4B", "AR-4C", "AR-5", "AR-6", "AR-7"]\nCURRENT_SLICE = "AR-8"\nNEXT_SLICE = "AR-9"\nAR8_ACCEPTED_SUBSLICES = ["AR-8A"]\nAR8_CURRENT_SUBSLICE = "AR-8B"\nAR8_MANDATORY_REMAINING = ["AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"]',
              'AR8B_IMPLEMENTATION_ISSUE = 309\nAR8C_IMPLEMENTATION_ISSUE = 314\nACCEPTED_SLICES = ["AR-0", "AR-1", "AR-2", "AR-3", "AR-4A", "AR-4B", "AR-4C", "AR-5", "AR-6", "AR-7"]\nCURRENT_SLICE = "AR-8"\nNEXT_SLICE = "AR-9"\nAR8_ACCEPTED_SUBSLICES = ["AR-8A", "AR-8B"]\nAR8_CURRENT_SUBSLICE = "AR-8C"\nAR8_MANDATORY_REMAINING = ["AR-8C", "AR-8D", "AR-8E", "AR-8F"]',
          )
          replace_once(
              generator,
              'def expected_ar8_progress() -> dict[str, object]:\n    return {',
              'def ar8b_acceptance() -> dict[str, object]:\n    return {\n        "issue": 309,\n        "implementation_pr": 312,\n        "exact_green_head": "743276b578bb15042e8a42beff0e14f7698e61b0",\n        "implementation_merge": "4e4d1c25226384858ca8905377ee155bedabc6d4",\n        "applicable_permanent_workflows": "14/14",\n    }\n\n\ndef expected_ar8_progress() -> dict[str, object]:\n    return {',
          )
          replace_once(generator, '"current_implementation_issue": AR8B_IMPLEMENTATION_ISSUE,', '"current_implementation_issue": AR8C_IMPLEMENTATION_ISSUE,')
          replace_once(generator, 'docs/status.json must project AR-8A accepted / AR-8B current / AR-8C..F mandatory', 'docs/status.json must project AR-8A/B accepted / AR-8C current / AR-8D..F mandatory')

          generator_helper = '''def build_ar8c_operational_lifecycle_projection(payload: dict[str, Any]) -> dict[str, object]:
    lifecycle = payload.get("ar8c_operational_lifecycle")
    if not isinstance(lifecycle, dict):
        raise SystemExit("AR-8C operational lifecycle source is missing")
    concerns = lifecycle.get("concerns")
    hosted = lifecycle.get("hosted_reconciliation")
    github = hosted.get("github") if isinstance(hosted, dict) else None
    cloudflare = hosted.get("cloudflare") if isinstance(hosted, dict) else None
    if not isinstance(concerns, list) or any(not isinstance(item, dict) for item in concerns):
        raise SystemExit("AR-8C operational lifecycle concerns must be a list of objects")
    if not isinstance(github, dict) or not isinstance(cloudflare, dict):
        raise SystemExit("AR-8C hosted reconciliation source is incomplete")
    concern_ids = sorted(str(item.get("id")) for item in concerns if isinstance(item.get("id"), str) and item.get("id"))
    if len(concern_ids) != len(concerns) or len(set(concern_ids)) != len(concern_ids):
        raise SystemExit("AR-8C operational lifecycle requires unique stable concern ids")
    return {
        "schema_version": int(lifecycle["schema_version"]),
        "status": str(lifecycle["status"]),
        "implementation_issue": int(lifecycle["implementation_issue"]),
        "accepted_base": str(lifecycle["accepted_base"]),
        "metadata_only": lifecycle.get("metadata_only") is True,
        "stage_order": lifecycle["stage_order"],
        "concern_ids": concern_ids,
        "hosted_reconciliation": {
            "github": {
                "accepted_main_only": github.get("accepted_main_only") is True,
                "pull_request_exposure": github.get("pull_request_exposure") is True,
                "metadata_only": github.get("metadata_only") is True,
                "readback_values": github.get("readback_values") is True,
                "executor_binding": github.get("executor_binding"),
            },
            "cloudflare": {
                "accepted_main_only": cloudflare.get("accepted_main_only") is True,
                "audit_environment": cloudflare.get("audit_environment"),
                "read_only": cloudflare.get("read_only") is True,
                "api_token_binding": cloudflare.get("api_token_binding"),
                "verify_endpoint": cloudflare.get("verify_endpoint"),
                "required_token_status": cloudflare.get("required_token_status"),
                "worker_secret_contract_source": cloudflare.get("worker_secret_contract_source"),
            },
        },
        "production_mutation": lifecycle.get("production_mutation") is True,
        "opsctl_mutation": lifecycle.get("opsctl_mutation") is True,
    }


'''
          replace_once(generator, 'def build_credential_projection(payload: dict[str, Any]) -> dict[str, object]:\n', generator_helper + 'def build_credential_projection(payload: dict[str, Any]) -> dict[str, object]:\n')
          replace_once(generator, '        "future_cutovers": future_cutovers,\n    }\n\n\ndef build_inventory()', '        "future_cutovers": future_cutovers,\n        "operational_lifecycle": build_ar8c_operational_lifecycle_projection(payload),\n    }\n\n\ndef build_inventory()')
          replace_once(generator, '            "ar8_progress": expected_ar8_progress(),\n            "architecture_complete": False,', '            "ar8_progress": expected_ar8_progress(),\n            "ar8b_acceptance": ar8b_acceptance(),\n            "architecture_complete": False,')
          replace_once(generator, 'ar8_state["program_state"]["ar8_progress"]["current_subslice"] = "AR-8C"', 'ar8_state["program_state"]["ar8_progress"]["current_subslice"] = "AR-8D"')
          replace_once(generator, 'inventory self-test failed to detect AR-8B sequencing drift', 'inventory self-test failed to detect AR-8C sequencing drift')

          checker = 'scripts/check-documentation-authority.py'
          replace_once(
              checker,
              'AR8B_IMPLEMENTATION_ISSUE = 309\nAR8_ACCEPTED_SUBSLICES = ["AR-8A"]\nAR8_CURRENT_SUBSLICE = "AR-8B"\nAR8_MANDATORY_REMAINING = ["AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"]',
              'AR8B_IMPLEMENTATION_ISSUE = 309\nAR8C_IMPLEMENTATION_ISSUE = 314\nAR8_ACCEPTED_SUBSLICES = ["AR-8A", "AR-8B"]\nAR8_CURRENT_SUBSLICE = "AR-8C"\nAR8_MANDATORY_REMAINING = ["AR-8C", "AR-8D", "AR-8E", "AR-8F"]\nAR8B_ACCEPTANCE = {\n    "issue": 309,\n    "implementation_pr": 312,\n    "exact_green_head": "743276b578bb15042e8a42beff0e14f7698e61b0",\n    "implementation_merge": "4e4d1c25226384858ca8905377ee155bedabc6d4",\n    "applicable_permanent_workflows": "14/14",\n}',
          )
          replace_once(checker, '"current_implementation_issue": AR8B_IMPLEMENTATION_ISSUE,', '"current_implementation_issue": AR8C_IMPLEMENTATION_ISSUE,')

          checker_helper = '''def expected_ar8c_operational_lifecycle_projection(payload: dict[str, Any]) -> dict[str, object]:
    lifecycle = payload.get("ar8c_operational_lifecycle")
    if not isinstance(lifecycle, dict):
        raise ValueError("AR-8C operational lifecycle source is missing")
    concerns = lifecycle.get("concerns")
    hosted = lifecycle.get("hosted_reconciliation")
    github = hosted.get("github") if isinstance(hosted, dict) else None
    cloudflare = hosted.get("cloudflare") if isinstance(hosted, dict) else None
    if not isinstance(concerns, list) or any(not isinstance(item, dict) for item in concerns):
        raise ValueError("AR-8C operational lifecycle concerns must be a list of objects")
    if not isinstance(github, dict) or not isinstance(cloudflare, dict):
        raise ValueError("AR-8C hosted reconciliation source is incomplete")
    concern_ids = sorted(str(item.get("id")) for item in concerns if isinstance(item.get("id"), str) and item.get("id"))
    if len(concern_ids) != len(concerns) or len(set(concern_ids)) != len(concern_ids):
        raise ValueError("AR-8C operational lifecycle requires unique stable concern ids")
    return {
        "schema_version": int(lifecycle["schema_version"]),
        "status": str(lifecycle["status"]),
        "implementation_issue": int(lifecycle["implementation_issue"]),
        "accepted_base": str(lifecycle["accepted_base"]),
        "metadata_only": lifecycle.get("metadata_only") is True,
        "stage_order": lifecycle["stage_order"],
        "concern_ids": concern_ids,
        "hosted_reconciliation": {
            "github": {
                "accepted_main_only": github.get("accepted_main_only") is True,
                "pull_request_exposure": github.get("pull_request_exposure") is True,
                "metadata_only": github.get("metadata_only") is True,
                "readback_values": github.get("readback_values") is True,
                "executor_binding": github.get("executor_binding"),
            },
            "cloudflare": {
                "accepted_main_only": cloudflare.get("accepted_main_only") is True,
                "audit_environment": cloudflare.get("audit_environment"),
                "read_only": cloudflare.get("read_only") is True,
                "api_token_binding": cloudflare.get("api_token_binding"),
                "verify_endpoint": cloudflare.get("verify_endpoint"),
                "required_token_status": cloudflare.get("required_token_status"),
                "worker_secret_contract_source": cloudflare.get("worker_secret_contract_source"),
            },
        },
        "production_mutation": lifecycle.get("production_mutation") is True,
        "opsctl_mutation": lifecycle.get("opsctl_mutation") is True,
    }


'''
          replace_once(checker, 'def expected_credential_projection(root: Path, payload: dict[str, Any]) -> dict[str, object]:\n', checker_helper + 'def expected_credential_projection(root: Path, payload: dict[str, Any]) -> dict[str, object]:\n')
          replace_once(checker, '        "future_cutovers": future_cutovers,\n    }\n\n\ndef validate(root: Path)', '        "future_cutovers": future_cutovers,\n        "operational_lifecycle": expected_ar8c_operational_lifecycle_projection(payload),\n    }\n\n\ndef validate(root: Path)')
          replace_once(
              checker,
              '        errors.append("AR-8B credential source authority provenance/policy drifted")\n\n    predecessor =',
              '        errors.append("AR-8B credential source authority provenance/policy drifted")\n    ar8c_lifecycle = credential_authority.get("ar8c_operational_lifecycle") if isinstance(credential_authority.get("ar8c_operational_lifecycle"), dict) else {}\n    if (\n        ar8c_lifecycle.get("status") != "CANDIDATE_AR8C_OPERATIONAL_CREDENTIAL_LIFECYCLE"\n        or ar8c_lifecycle.get("implementation_issue") != AR8C_IMPLEMENTATION_ISSUE\n        or ar8c_lifecycle.get("accepted_base") != "4e4d1c25226384858ca8905377ee155bedabc6d4"\n        or ar8c_lifecycle.get("metadata_only") is not True\n        or ar8c_lifecycle.get("production_mutation") is not False\n        or ar8c_lifecycle.get("opsctl_mutation") is not False\n        or ar8c_lifecycle.get("pull_request_privileged_exposure") is not False\n    ):\n        errors.append("AR-8C operational credential lifecycle source provenance/policy drifted")\n\n    predecessor =',
          )
          replace_once(checker, 'if transition.get("schema_version") != 10 or transition.get("status") != "ACTIVE_DURING_AR8_AFTER_ACCEPTED_AR8A":\n        errors.append("architecture transition must encode active AR-8 after accepted AR-8A")', 'if transition.get("schema_version") != 11 or transition.get("status") != "ACTIVE_DURING_AR8_AFTER_ACCEPTED_AR8B":\n        errors.append("architecture transition must encode active AR-8 after accepted AR-8B")')
          replace_once(checker, '    validate_ar8_progress(program.get("ar8_progress"), "docs/status.json architecture_program.ar8_progress", errors, allow_projection_fields=False)\n', '    validate_ar8_progress(program.get("ar8_progress"), "docs/status.json architecture_program.ar8_progress", errors, allow_projection_fields=False)\n    if program.get("ar8b_acceptance") != AR8B_ACCEPTANCE:\n        errors.append("docs/status.json AR-8B acceptance provenance drifted")\n')
          replace_once(checker, '    validate_ar8_progress(transition.get("ar8_progress"), "architecture transition ar8_progress", errors, allow_projection_fields=True)\n', '    validate_ar8_progress(transition.get("ar8_progress"), "architecture transition ar8_progress", errors, allow_projection_fields=True)\n    if transition.get("ar8b_acceptance") != AR8B_ACCEPTANCE:\n        errors.append("architecture transition AR-8B acceptance provenance drifted")\n')
          replace_once(checker, '    validate_ar8_progress(program_state.get("ar8_progress"), "architecture inventory program_state.ar8_progress", errors, allow_projection_fields=False)\n', '    validate_ar8_progress(program_state.get("ar8_progress"), "architecture inventory program_state.ar8_progress", errors, allow_projection_fields=False)\n    if program_state.get("ar8b_acceptance") != AR8B_ACCEPTANCE:\n        errors.append("architecture inventory AR-8B acceptance provenance drifted")\n')
          replace_once(checker, '("AR-8 subslice skip", Path("docs/status.json"), \'"current_subslice": "AR-8B"\', \'"current_subslice": "AR-8C"\', "current_subslice"),', '("AR-8 subslice skip", Path("docs/status.json"), \'"current_subslice": "AR-8C"\', \'"current_subslice": "AR-8D"\', "current_subslice"),')
          replace_once(checker, 'Architecture Re-baseline v3 active AR-8 / current AR-8B documentation authority negative fixtures passed.', 'Architecture Re-baseline v3 active AR-8 / current AR-8C documentation authority negative fixtures passed.')
          replace_once(checker, 'Architecture Re-baseline v3 active AR-8 / current AR-8B documentation/program authority is consistent.', 'Architecture Re-baseline v3 active AR-8 / current AR-8C documentation/program authority is consistent.')

          acceptance = {
              'issue': 309,
              'implementation_pr': 312,
              'exact_green_head': '743276b578bb15042e8a42beff0e14f7698e61b0',
              'implementation_merge': '4e4d1c25226384858ca8905377ee155bedabc6d4',
              'applicable_permanent_workflows': '14/14',
          }
          progress = {
              'umbrella_issue': 308,
              'accepted_subslices': ['AR-8A', 'AR-8B'],
              'current_subslice': 'AR-8C',
              'current_implementation_issue': 314,
              'mandatory_remaining': ['AR-8C', 'AR-8D', 'AR-8E', 'AR-8F'],
              'full_ar8_accepted': False,
              'ar9_blocked': True,
              'production_mutation': False,
          }

          status_path = Path('docs/status.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          program = status['current']['architecture_program']
          program['ar8_progress'] = progress
          program['ar8b_acceptance'] = acceptance
          status['next_repository_step'] = {
              'number': None,
              'name': 'Architecture Re-baseline v3 AR-8C',
              'status': 'current_ar8_subslice_after_accepted_ar8b',
              'tracking_issue': 266,
              'umbrella_issue': 308,
              'implementation_issue': 314,
              'authority': 'docs/ARCHITECTURE_REBASELINE_V3_PLAN.md',
          }
          status_path.write_text(json.dumps(status, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          transition_path = Path('architecture/architecture-rebaseline-v3-transition.json')
          transition = json.loads(transition_path.read_text(encoding='utf-8'))
          transition['schema_version'] = 11
          transition['status'] = 'ACTIVE_DURING_AR8_AFTER_ACCEPTED_AR8B'
          transition_progress = dict(progress)
          transition_progress['credential_authority_source'] = 'architecture/credential-authority-ar8b.json'
          transition_progress['canonical_projection'] = 'architecture/inventory.json::credential_authority'
          transition['ar8_progress'] = transition_progress
          transition['ar8b_acceptance'] = acceptance
          policy = transition['architecture_inventory_policy']
          policy.pop('ar8b_current_projection', None)
          policy['ar8b_accepted_projection'] = 'ACCEPTED_METADATA_ONLY_CREDENTIAL_AUTHORITY_IN_CANONICAL_INVENTORY'
          policy['ar8c_current_projection'] = 'CANDIDATE_OPERATIONAL_CREDENTIAL_LIFECYCLE_IN_CANONICAL_INVENTORY'
          app = transition['application_architecture']
          app['program_handoff_status'] = 'AR8_ACTIVE_AFTER_AR8B_ACCEPTED'
          app['program_next_required_subslice'] = 'AR-8C'
          transition_path.write_text(json.dumps(transition, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate and regenerate canonical projections
        run: |
          node .github/scripts/credential-lifecycle.mjs contract
          node .github/scripts/credential-lifecycle.mjs self-test
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py
          python -m json.tool architecture/architecture-rebaseline-v3-transition.json >/dev/null
          python -m json.tool docs/status.json >/dev/null
          python -m json.tool architecture/inventory.json >/dev/null
          git diff --check

      - name: Commit only canonical AR-8C projection sources and outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-architecture-inventory.py scripts/check-documentation-authority.py architecture/architecture-rebaseline-v3-transition.json docs/status.json architecture/inventory.json
          changed="$(git diff --cached --name-only)"
          expected=$'architecture/architecture-rebaseline-v3-transition.json\narchitecture/inventory.json\ndocs/status.json\nscripts/check-documentation-authority.py\nscripts/generate-architecture-inventory.py'
          test "$changed" = "$expected"
          git commit -m 'chore: project accepted AR-8B and current AR-8C'
          git push origin HEAD:scratch/ar8c-program-projection-sync
