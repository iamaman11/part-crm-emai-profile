name: AR8C Program Projection Sync Scratch

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.ref == 'scratch/ar8c-program-projection-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scratch source branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: scratch/ar8c-program-projection-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Advance accepted AR-8B to current AR-8C machine state
        run: python .scratch/ar8c_program_projection_sync.py

      - name: Validate and regenerate canonical projections
        run: |
          node .github/scripts/credential-lifecycle.mjs contract
          node .github/scripts/credential-lifecycle.mjs self-test
          python scripts/check-documentation-authority.py --root .
          python scripts/check-documentation-authority.py --root . --self-test
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-architecture-inventory.py
          python -m json.tool architecture/architecture-rebaseline-v3-transition.json >/dev/null
          python -m json.tool docs/status.json >/dev/null
          python -m json.tool architecture/inventory.json >/dev/null
          git diff --check

      - name: Commit only canonical AR-8C projection sources and outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-architecture-inventory.py scripts/check-documentation-authority.py architecture/architecture-rebaseline-v3-transition.json docs/status.json architecture/inventory.json
          changed="$(git diff --cached --name-only)"
          expected=$'architecture/architecture-rebaseline-v3-transition.json\narchitecture/inventory.json\ndocs/status.json\nscripts/check-documentation-authority.py\nscripts/generate-architecture-inventory.py'
          test "$changed" = "$expected"
          git commit -m 'chore: project accepted AR-8B and current AR-8C'
          git push origin HEAD:scratch/ar8c-program-projection-sync
