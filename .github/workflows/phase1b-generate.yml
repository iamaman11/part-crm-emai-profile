name: Phase 1B Generate Contracts And Inventory

on:
  push:
    branches:
      - phase1b-delivery-hardening

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: Register notification routes in architecture generator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-architecture-inventory.py')
          text = path.read_text(encoding='utf-8')
          classifier_old = '    ("mailboxes", "crates/control-plane-contract/src/routes/mailboxes.rs"),\n]'
          classifier_new = '    ("mailboxes", "crates/control-plane-contract/src/routes/mailboxes.rs"),\n    ("notifications", "crates/control-plane-contract/src/routes/notifications.rs"),\n]'
          if classifier_old not in text:
              raise SystemExit('classifier insertion point missing')
          text = text.replace(classifier_old, classifier_new, 1)
          route_marker = ']\n\nGENERATED_CONTRACTS = ['
          notification_routes = '''    ("NotificationEventCollectionApi", "notifications", ["GET"], "/api/v1/tenants/{tenant_id}/notifications/events", "/api/v1/tenants/tenant_01/notifications/events", True),
              ("NotificationEventAckApi", "notifications", ["POST"], "/api/v1/tenants/{tenant_id}/notifications/events/ack", "/api/v1/tenants/tenant_01/notifications/events/ack", True),
              ("NotificationReplayCollectionApi", "notifications", ["POST"], "/api/v1/tenants/{tenant_id}/notifications/replays", "/api/v1/tenants/tenant_01/notifications/replays", True),
              ("NotificationOperationsApi", "notifications", ["GET"], "/api/v1/tenants/{tenant_id}/notifications/operations", "/api/v1/tenants/tenant_01/notifications/operations", True),
          ]

          GENERATED_CONTRACTS = ['''
          if route_marker not in text:
              raise SystemExit('route insertion point missing')
          text = text.replace(route_marker, notification_routes, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
      - name: Generate canonical public contracts and inventory
        run: |
          python scripts/generate-frontend-contracts.py
          python scripts/generate-architecture-inventory.py --write
      - name: Self-clean and commit
        run: |
          rm .github/workflows/phase1b-generate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-architecture-inventory.py contracts/generated/control-plane.openapi.json frontend/src/shared/api/generated/control-plane.ts architecture/inventory.json
          git add -u .github/workflows/phase1b-generate.yml
          git commit -m 'Phase 1B: generate notification contracts and inventory'
          git push origin HEAD:phase1b-delivery-hardening
