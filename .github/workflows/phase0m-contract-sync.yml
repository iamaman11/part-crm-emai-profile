name: Phase 0M Contract Sync

on:
  push:
    branches:
      - phase0m-generated-frontend-contracts

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 0M branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase0m-generated-frontend-contracts

      - name: Refresh lockfile for canonical contract dependencies
        run: cargo generate-lockfile

      - name: Generate OpenAPI and TypeScript contracts
        run: python scripts/generate-frontend-contracts.py

      - name: Commit generated artifacts only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock contracts/generated frontend/src/shared/api/generated; then
            echo 'Generated contract artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock contracts/generated frontend/src/shared/api/generated
          git commit -m 'Phase 0M: materialize generated frontend contracts'
          git push origin HEAD:phase0m-generated-frontend-contracts
