name: Phase 0M Docs Closeout

on:
  push:
    branches:
      - docs-phase0m-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase0m-closeout

      - name: Materialize accepted-main docs
        run: python scripts/phase0m-docs-closeout.py

      - name: Commit accepted-main docs
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DEVELOPMENT_PLAN.md docs/DEVELOPER_CAPABILITY_MATRIX.md
          git commit -m 'Docs: mark Phase 0M accepted and advance to 0N'
          git push origin HEAD:docs-phase0m-closeout
