name: Phase 2C Finalize Materializer

on:
  push:
    branches:
      - phase2c-client-merge-assignment-ui

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2c-client-merge-assignment-ui
          fetch-depth: 0

      - name: Materialize deterministic files
        run: |
          python scripts/generate-architecture-inventory.py --write
          python scripts/generate-frontend-contracts.py
          cargo fmt --all

      - name: Validate targeted Phase 2C state
        run: |
          python scripts/check-contract-compatibility.py
          python scripts/generate-frontend-contracts.py --check
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/test-d1-schema.py
          python scripts/test-phase2c-client-merge-assignment.py
          cargo test --locked -p client-domain -p use-cases-clients
          cargo test --locked -p cloudflare-adapters --lib
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown
          cd frontend
          npm ci
          npm run lint
          npm test -- --run
          npm run build

      - name: Commit product-only materialized state
        run: |
          rm .github/workflows/phase2c-finalize-materializer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Phase 2C: materialize formatted acceptance state"
          git push origin HEAD:phase2c-client-merge-assignment-ui
