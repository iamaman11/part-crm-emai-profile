  quality-cloudflare-worker:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: quality-accepted-pr-proof
    if: always() && (github.event_name == 'pull_request' || needs.quality-accepted-pr-proof.result != 'success' || needs.quality-accepted-pr-proof.outputs.reuse != 'true')
    name: Cloudflare Worker Release Build
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Require successful accepted PR proof routing
        run: test "${{ needs.quality-accepted-pr-proof.result }}" = success

      - name: Checkout exact release source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Resolve immutable release source authority
        id: source
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$SOURCE_EVENT:$GITHUB_REF" in
            push:refs/heads/main)
              test -z "$PR_HEAD_REF"
              echo "source_ref=refs/heads/main" >> "$GITHUB_OUTPUT"
              echo "authority=accepted-main" >> "$GITHUB_OUTPUT"
              ;;
            pull_request:refs/pull/*/merge)
              test -n "$PR_HEAD_REF"
              echo "source_ref=refs/heads/$PR_HEAD_REF" >> "$GITHUB_OUTPUT"
              echo "authority=review-candidate" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported release source event/ref: $SOURCE_EVENT $GITHUB_REF" >&2
              exit 1
              ;;
          esac

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check Worker for WASM
        env:
          RUSTFLAGS: -Dwarnings
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Restore pinned worker-build bootstrap cache
        id: worker-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/worker-build-install
          key: worker-build-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-0.8.5

      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.5 --locked --root "$RUNNER_TEMP/worker-build-install"

      - name: Build release Worker artifact
        working-directory: apps/control-plane-worker
        run: '"$RUNNER_TEMP/worker-build-install/bin/worker-build" --release'

      - name: Verify Worker artifact
        run: |
          test -f apps/control-plane-worker/build/worker/shim.mjs
          find apps/control-plane-worker/build -type f -name '*.wasm' -print -quit | grep -q .

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Install exact frontend dependency graph
        working-directory: frontend
        run: npm ci

      - name: Build release Static Assets artifact
        working-directory: frontend
        run: npm run build

      - name: Build immutable release package
        id: release
        env:
          RELEASE_AUTHORITY: ${{ steps.source.outputs.authority }}
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          python scripts/cloudflare-release.py build \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --source-event "$GITHUB_EVENT_NAME" \
            --authority "$RELEASE_AUTHORITY" \
            --github-output

      - name: Verify immutable release archive against exact source
        env:
          RELEASE_AUTHORITY: ${{ steps.source.outputs.authority }}
        run: |
          python scripts/cloudflare-release.py verify-archive \
            --archive "${{ steps.release.outputs.archive }}" \
            --expected-source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --authority "$RELEASE_AUTHORITY"

      - name: Upload exact immutable release tar
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ steps.release.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded artifact digest
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.archive_sha256 }}
          UPLOADED_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          test -n "$UPLOADED_DIGEST"
          test "$UPLOADED_DIGEST" = "$EXPECTED_DIGEST"
          echo "Verified immutable release artifact ${UPLOADED_DIGEST} for ${SOURCE_SHA}."

      # Build the other cloud release component while the pinned worker-build
      # compiler is already present. Main only repackages these exact bytes.
      - name: Build immutable Resolver Worker artifact
        run: |
          set -euo pipefail
          (cd apps/mailbox-secret-resolver-worker && "$RUNNER_TEMP/worker-build-install/bin/worker-build" --release)
          python scripts/mailbox-secret-resolver-release.py build \
            --source-sha "$SOURCE_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Verify immutable Resolver archive against exact source
        id: resolver
        run: |
          set -euo pipefail
          mapfile -t archives < <(find artifacts/mailbox-secret-resolver-release -maxdepth 1 -type f -name '*.tar' -print)
          test "${#archives[@]}" -eq 1
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "${archives[0]}" --expected-source-sha "$SOURCE_SHA"
          echo "archive=${archives[0]}" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$(sha256sum "${archives[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload exact immutable Resolver tar
        id: resolver-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ steps.resolver.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded Resolver artifact digest
        env:
          EXPECTED_DIGEST: ${{ steps.resolver.outputs.archive_sha256 }}
          UPLOADED_DIGEST: ${{ steps.resolver-upload.outputs.artifact-digest }}
        run: |
          test -n "$UPLOADED_DIGEST"
          test "$UPLOADED_DIGEST" = "$EXPECTED_DIGEST"
  quality-rust-windows:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    needs: quality-accepted-pr-proof
    if: always() && (github.event_name == 'pull_request' || needs.quality-accepted-pr-proof.result != 'success' || needs.quality-accepted-pr-proof.outputs.reuse != 'true')
    name: Rust Windows And Profile Bridge Artifact
    runs-on: windows-latest
    steps:
      - name: Require successful accepted PR proof routing
        shell: pwsh
        run: |
          if ('${{ needs.quality-accepted-pr-proof.result }}' -ne 'success') { throw 'Accepted PR proof routing did not succeed' }

      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
