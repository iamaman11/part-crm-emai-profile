      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Reuse exact prior FULL-proof Profile Bridge executable
        if: github.event_name == 'pull_request' && needs.quality-accepted-pr-proof.outputs.native_unaffected == 'true'
        id: native-bridge
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/accepted-main-pr-reuse.py --pr-native-bridge target/release/profile-bridge.exe

      # Full native tests need the warm toolchain cache; an already verified
      # exact previous EXE does not. Keep this after the trusted attempt, but
      # before the fallback cleanup/build so stale cache binaries cannot leak.
      - name: Restore versioned Rust dependencies
        if: steps.native-bridge.outcome != 'success'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 (immutable)
        with:
          shared-key: profile-bridge-ci-v1
          workspaces: |
            . -> target
            tools/opsctl -> target
          cache-on-failure: 'true'

      - name: Remove untrusted inherited executable before FULL native fallback
        if: steps.native-bridge.outcome != 'success'
        shell: pwsh
        run: |
          $exe = 'target/release/profile-bridge.exe'
          if (Test-Path -LiteralPath $exe) { Remove-Item -LiteralPath $exe -Force -ErrorAction Stop }

      - name: Check and test native crates
        if: steps.native-bridge.outcome != 'success'
        run: >-
          cargo test --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters
          -- --skip fresh_lone_intent_first_seals_then_commit_and_next_claim_finishes_active_exact
          --skip production_verifier_accepts_only_exact_pinned_application_signature

      - name: Build release Profile Bridge executable
        if: steps.native-bridge.outcome != 'success'
        run: cargo build --locked --release -p profile-bridge

      - name: Compile actual per-user installer and prove native signature rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Hosted Windows image is missing the Inno Setup build tool'
          }
          python scripts/windows-delivery-publication.py installer-smoke-test --bridge target/release/profile-bridge.exe --compiler "$compiler"

      - name: Verify Windows Profile Bridge artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/profile-bridge.exe")) {
            throw "profile-bridge.exe was not produced"
          }
          $artifact = Get-Item "target/release/profile-bridge.exe"
          if ($artifact.Length -le 0) {
            throw "profile-bridge.exe is empty"
          }
          Write-Host "Verified Profile Bridge artifact: $($artifact.FullName) ($($artifact.Length) bytes)"

      # Source-only PR test transport; not a signed installer or approved Release Set.
      # No production enrollment, trust mutation or deployment is possible here.
      # Raw archive:false uses the source basename `profile-bridge.exe` as its
      # artifact identity; the accepted-main proof binds it to one PR run/HEAD.
      - name: Upload disposable exact-head Windows Bridge candidate
        if: github.event_name == 'pull_request'
        id: bridge-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: target/release/profile-bridge.exe
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded Bridge artifact digest
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          UPLOADED_DIGEST: ${{ steps.bridge-upload.outputs.artifact-digest }}
        run: |
          $expected = (Get-FileHash -Algorithm SHA256 target/release/profile-bridge.exe).Hash.ToLowerInvariant()
          if (-not $env:UPLOADED_DIGEST -or $env:UPLOADED_DIGEST -ne $expected) {
            throw 'PR Bridge raw release executable upload digest mismatch'
          }

      - name: Write FULL Quality Windows runner identity receipt
        if: github.event_name == 'pull_request' && steps.native-bridge.outcome != 'success'
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/accepted-main-pr-reuse.py --native-runner-receipt quality --receipt-output "$env:RUNNER_TEMP/quality-native-runner.json"

      - name: Upload FULL Quality Windows runner identity receipt
        if: github.event_name == 'pull_request' && steps.native-bridge.outcome != 'success'
        id: native-runner-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quality-native-runner.json
          path: ${{ runner.temp }}/quality-native-runner.json
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Verify uploaded FULL Quality runner identity digest
        if: github.event_name == 'pull_request' && steps.native-bridge.outcome != 'success'
        shell: pwsh
        env:
          UPLOADED_DIGEST: ${{ steps.native-runner-upload.outputs.artifact-digest }}
        run: |
          $expected = (Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP/quality-native-runner.json").Hash.ToLowerInvariant()
          if (-not $env:UPLOADED_DIGEST -or $env:UPLOADED_DIGEST -ne $expected) {
            throw 'FULL Quality Windows runner receipt upload SHA mismatch'
          }

