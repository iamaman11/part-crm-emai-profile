name: AR-10 Projection Sync

on:
  push:
    branches:
      - agent/ar10-runtime-cutover

permissions:
  contents: write

concurrency:
  group: ar10-projection-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.ref == 'refs/heads/agent/ar10-runtime-cutover'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar10-runtime-cutover
          fetch-depth: 0

      - name: Patch only the stale current-delivery projection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('architecture/inventory.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          current = payload['current_delivery_map']
          invariants = current['invariants']
          if current.get('accepted_checkpoint') != 'AR-9' or current.get('current_work') != 'AR-10':
              raise SystemExit('refusing to patch unexpected current delivery map')
          if invariants.get('ar9_accepted') is not True:
              raise SystemExit('refusing to patch without accepted AR-9 evidence')
          if invariants.get('ar9_blocked') is False:
              raise SystemExit(0)
          if invariants.get('ar9_blocked') is not True:
              raise SystemExit('refusing to patch unexpected ar9_blocked state')
          invariants['ar9_blocked'] = False
          path.write_text(json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=False) + '\n', encoding='utf-8', newline='\n')
          PY

      - name: Verify exact one-field semantic diff
        run: |
          git diff --exit-code -- . ':(exclude)architecture/inventory.json'
          git diff --check
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          before = json.loads(subprocess.check_output(['git', 'show', 'HEAD:architecture/inventory.json'], text=True))
          after = json.loads(Path('architecture/inventory.json').read_text(encoding='utf-8'))
          before['current_delivery_map']['invariants']['ar9_blocked'] = False
          if before != after:
              raise SystemExit('projection sync changed more than current_delivery_map.invariants.ar9_blocked')
          PY

      - name: Commit deterministic projection sync
        run: |
          if git diff --quiet -- architecture/inventory.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add architecture/inventory.json
          git commit -m 'Sync canonical AR-10 delivery map'
          git push origin HEAD:agent/ar10-runtime-cutover
