name: AR8 Accepted Checkpoint Materializer Temporary

on:
  pull_request:

permissions:
  contents: write

jobs:
  materialize-and-retire:
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.event.pull_request.head.ref == 'agent/ar8-accepted-checkpoint-sync' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact checkpoint-sync head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Write accepted AR-8 checkpoint sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

          cat > scripts/generate-ar8-completion-status.py <<'PY'
          #!/usr/bin/env python3
          """Deterministically project accepted AR-8 and AR-9 handoff into canonical status authorities."""

          from __future__ import annotations

          import argparse
          import copy
          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          BASE_STATUS = ROOT / "history/status-ar8c-before-ar8-completion.json"
          BASE_TRANSITION = ROOT / "history/architecture-rebaseline-v3-transition-before-ar8-completion.json"
          STATUS = ROOT / "docs/status.json"
          TRANSITION = ROOT / "architecture/architecture-rebaseline-v3-transition.json"
          ACCEPTANCE_EVIDENCE = "docs/evidence/2026-08-18-ar8-final-acceptance.json"
          EXACT_GREEN_HEAD = "81d1f0c26ff0bd3a688c2d5dc000b93640479e47"
          IMPLEMENTATION_MERGE = "874666f6ef6eb003425c9677d558378d6dc0daaf"


          def progress(*, projection_fields: bool) -> dict[str, object]:
              value: dict[str, object] = {
                  "umbrella_issue": 308,
                  "accepted_subslices": ["AR-8A", "AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"],
                  "current_subslice": None,
                  "current_implementation_issue": None,
                  "mandatory_remaining": [],
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "production_mutation": False,
                  "implementation_entry_gate": "AR8_ACCEPTED_MAIN_AR9_CURRENT",
                  "source_complete_candidate": False,
                  "completion_pr": 362,
                  "implemented_through": "AR-8F",
                  "accepted_top_level_slice": "AR-8",
                  "exact_green_head": EXACT_GREEN_HEAD,
                  "implementation_merge": IMPLEMENTATION_MERGE,
                  "applicable_permanent_workflows": "14/14",
                  "accepted_main_reread": IMPLEMENTATION_MERGE,
                  "acceptance_evidence": ACCEPTANCE_EVIDENCE,
              }
              if projection_fields:
                  value.update({
                      "credential_authority_source": "architecture/credential-authority.json",
                      "credential_registry_provenance": "architecture/credential-authority-ar8b.json",
                      "canonical_projection": "architecture/inventory.json::subject_domain_authorities",
                  })
              return value


          def delivery_map(base: dict[str, object]) -> dict[str, object]:
              value = copy.deepcopy(base)
              value["accepted_checkpoint"] = "AR-8"
              value["current_work"] = "AR-9"
              value["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-8",
                  "current_subslice": "AR-9",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR8_CLOSEOUT",
              }
              value["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-8",
                  "full_ar8_accepted": True,
                  "acceptance_evidence": ACCEPTANCE_EVIDENCE,
              }
              value["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              value["next_gate"] = {
                  "id": "AR-9_ACCEPTANCE",
                  "issue": None,
                  "on_success": "AR-10_BECOMES_CURRENT",
              }
              value["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return value


          def acceptance() -> dict[str, object]:
              return {
                  "issue": 361,
                  "umbrella_issue": 308,
                  "implementation_pr": 362,
                  "exact_green_head": EXACT_GREEN_HEAD,
                  "implementation_merge": IMPLEMENTATION_MERGE,
                  "applicable_permanent_workflows": "14/14",
                  "behind_by": 0,
                  "blocking_reviews": 0,
                  "unresolved_review_threads": 0,
                  "accepted_main_reread": IMPLEMENTATION_MERGE,
                  "evidence": ACCEPTANCE_EVIDENCE,
                  "metadata_only": True,
                  "production_mutation": False,
              }


          def project_status() -> dict[str, object]:
              payload = json.loads(BASE_STATUS.read_text(encoding="utf-8"))
              current = payload["current"]
              program = current["architecture_program"]
              accepted_slices = list(program.get("accepted_slices", []))
              if "AR-8" not in accepted_slices:
                  accepted_slices.append("AR-8")
              program["accepted_slices"] = accepted_slices
              program["current_slice"] = "AR-9"
              program["next_slice_after_acceptance"] = "AR-10"
              program["ar8_progress"] = progress(projection_fields=False)
              program["ar8_acceptance"] = acceptance()
              program["subject_domain_authorities"] = {
                  "credential_authority": "architecture/credential-authority.json",
                  "credential_registry_provenance": "architecture/credential-authority-ar8b.json",
                  "credential_lifecycle": "architecture/credential-lifecycle.json",
                  "operator_contract": "architecture/operator-contract.json",
                  "profile_security": "architecture/profile-security.json",
                  "architecture_map": "architecture/README.md",
              }
              current["current_delivery_map"] = delivery_map(current["current_delivery_map"])
              current["architecture_complete"] = False
              current["production_core_gate"] = "BLOCKED"
              current["next_repository_step"] = {
                  "name": "AR-9 — D1 Evolution / Schema Compatibility",
                  "status": "current",
                  "tracking_issue": 266,
                  "authority": "docs/ARCHITECTURE_REBASELINE_V3_PLAN.md",
                  "previous_acceptance_evidence": ACCEPTANCE_EVIDENCE,
              }
              payload["production_ready"] = False
              payload["as_of"] = "2026-08-18"
              return payload


          def project_transition() -> dict[str, object]:
              payload = json.loads(BASE_TRANSITION.read_text(encoding="utf-8"))
              payload["status"] = "ACTIVE_AFTER_AR8_ACCEPTANCE"
              payload["current_slice"] = "AR-9"
              payload["next_slice_after_acceptance"] = "AR-10"
              accepted_slices = list(payload.get("accepted_slices", []))
              if "AR-8" not in accepted_slices:
                  accepted_slices.append("AR-8")
              payload["accepted_slices"] = accepted_slices
              payload["ar8_progress"] = progress(projection_fields=True)
              payload["ar8_acceptance"] = acceptance()
              payload["current_delivery_map"] = delivery_map(payload["current_delivery_map"])
              policy = payload["architecture_inventory_policy"]
              policy["ar8_current_subject_projection"] = "architecture/inventory.json::subject_domain_authorities"
              policy["ar8_current_composition_root"] = "architecture/credential-authority.json"
              policy["ar8b_registry_role"] = "IMMUTABLE_ACCEPTED_PROVENANCE_DATASET"
              app = payload.get("application_architecture", {})
              app["program_handoff_status"] = "AR8_ACCEPTED_AR9_CURRENT"
              app["program_next_required_subslice"] = "AR-9"
              return payload


          def serialized(payload: object) -> str:
              return json.dumps(payload, indent=2, ensure_ascii=False, sort_keys=False) + "\n"


          def validate(status: dict[str, object], transition: dict[str, object]) -> None:
              current = status["current"]
              program = current["architecture_program"]
              if program.get("current_slice") != "AR-9" or "AR-8" not in program.get("accepted_slices", []):
                  raise ValueError("program must advance to AR-9 only after accepted AR-8")
              if program.get("ar8_progress") != progress(projection_fields=False):
                  raise ValueError("docs/status.json accepted AR-8 progress drifted")
              if transition.get("ar8_progress") != progress(projection_fields=True):
                  raise ValueError("architecture transition accepted AR-8 progress drifted")
              expected_delivery = current["current_delivery_map"]
              if expected_delivery != transition.get("current_delivery_map"):
                  raise ValueError("status and transition CURRENT_DELIVERY_MAP projections must match exactly")
              invariants = expected_delivery.get("invariants", {})
              required = {
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              }
              for key, wanted in required.items():
                  if invariants.get(key) != wanted:
                      raise ValueError(f"CURRENT_DELIVERY_MAP invariant {key} drifted")
              if current.get("architecture_complete") is not False:
                  raise ValueError("architecture must remain incomplete after AR-8")
              if current.get("production_core_gate") != "BLOCKED" or status.get("production_ready") is not False:
                  raise ValueError("production gates must remain fail-closed after AR-8")


          def main() -> int:
              parser = argparse.ArgumentParser()
              mode = parser.add_mutually_exclusive_group(required=True)
              mode.add_argument("--write", action="store_true")
              mode.add_argument("--check", action="store_true")
              mode.add_argument("--self-test", action="store_true")
              args = parser.parse_args()
              expected_status = project_status()
              expected_transition = project_transition()
              validate(expected_status, expected_transition)
              if args.write:
                  STATUS.write_text(serialized(expected_status), encoding="utf-8", newline="\n")
                  TRANSITION.write_text(serialized(expected_transition), encoding="utf-8", newline="\n")
                  print("Wrote accepted AR-8 status/transition and AR-9 handoff projections.")
              elif args.check:
                  actual_status = json.loads(STATUS.read_text(encoding="utf-8"))
                  actual_transition = json.loads(TRANSITION.read_text(encoding="utf-8"))
                  validate(actual_status, actual_transition)
                  if actual_status != expected_status or actual_transition != expected_transition:
                      raise SystemExit("accepted AR-8 status/transition projections are stale; run --write")
                  print("AR-8 accepted-main status/transition are current; AR-9 is current while production remains blocked.")
              else:
                  negative = copy.deepcopy(expected_status)
                  negative["current"]["current_delivery_map"]["invariants"]["production_core_gate"] = "AUTHORIZED"
                  try:
                      validate(negative, expected_transition)
                  except ValueError:
                      print("Post-AR-8 premature production authorization fixture rejected as expected.")
                  else:
                      raise SystemExit("premature production authorization negative fixture unexpectedly passed")
              return 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except (KeyError, TypeError, ValueError, json.JSONDecodeError) as error:
                  print(f"AR-8 accepted checkpoint projection failed: {error}", file=sys.stderr)
                  raise SystemExit(1) from error
          PY

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/generate-architecture-inventory.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"""Generate canonical inventory with current subject-domain AR-8 completion projection."""', '"""Generate canonical inventory after accepted AR-8 and hand off to AR-9."""')
          anchor = 'legacy_progress = engine.expected_ar8_progress\n'
          insert = '''legacy_progress = engine.expected_ar8_progress\nengine.CURRENT_SLICE = "AR-9"\nengine.NEXT_SLICE = "AR-10"\nengine.CURRENT_DELIVERY_CHECKPOINT = "AR-8"\nengine.AR8_ACCEPTED_SUBSLICES = ["AR-8A", "AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"]\nengine.AR8_CURRENT_SUBSLICE = None\nengine.AR8D_IMPLEMENTATION_ISSUE = None\nengine.AR8_MANDATORY_REMAINING = []\nengine.AR8_IMPLEMENTATION_ENTRY_GATE = "AR8_ACCEPTED_MAIN_AR9_CURRENT"\nif "AR-8" not in engine.ACCEPTED_SLICES:\n    engine.ACCEPTED_SLICES = [*engine.ACCEPTED_SLICES, "AR-8"]\n'''
          if anchor not in text:
              raise SystemExit('inventory engine anchor missing')
          text = text.replace(anchor, insert, 1)
          text = re.sub(r'def completion_delivery_map\(\) -> dict\[str, object\]:\n.*?\n\n\ndef completion_progress', '''def completion_delivery_map() -> dict[str, object]:
              value = legacy_delivery_map()
              value["accepted_checkpoint"] = "AR-8"
              value["current_work"] = "AR-9"
              value["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-8",
                  "current_subslice": "AR-9",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR8_CLOSEOUT",
              }
              value["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-8",
                  "full_ar8_accepted": True,
                  "acceptance_evidence": "docs/evidence/2026-08-18-ar8-final-acceptance.json",
              }
              value["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              value["next_gate"] = {"id": "AR-9_ACCEPTANCE", "issue": None, "on_success": "AR-10_BECOMES_CURRENT"}
              value["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return value


          def completion_progress''', text, count=1, flags=re.S)
          text = re.sub(r'def completion_progress\(\) -> dict\[str, object\]:\n.*?\n\n\nengine.current_delivery_map', '''def completion_progress() -> dict[str, object]:
              value = legacy_progress()
              value.update({
                  "accepted_subslices": ["AR-8A", "AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"],
                  "current_subslice": None,
                  "current_implementation_issue": None,
                  "mandatory_remaining": [],
                  "implementation_entry_gate": "AR8_ACCEPTED_MAIN_AR9_CURRENT",
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "production_mutation": False,
                  "source_complete_candidate": False,
                  "completion_pr": 362,
                  "implemented_through": "AR-8F",
                  "accepted_top_level_slice": "AR-8",
                  "exact_green_head": "81d1f0c26ff0bd3a688c2d5dc000b93640479e47",
                  "implementation_merge": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "applicable_permanent_workflows": "14/14",
                  "accepted_main_reread": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "acceptance_evidence": "docs/evidence/2026-08-18-ar8-final-acceptance.json",
              })
              return value


          engine.current_delivery_map''', text, count=1, flags=re.S)
          old = '''        "source_completion": {
                  "tracking_issue": 361,
                  "completion_pr": 362,
                  "implemented_through": "AR-8F",
                  "state": "FINAL_ACCEPTANCE_PENDING",
                  "accepted_main_through": "AR-8C",
                  "full_ar8_accepted": False,
                  "ar9_blocked": True,
                  "production_mutation": False,
              },'''
          new = '''        "source_completion": {
                  "tracking_issue": 361,
                  "umbrella_issue": 308,
                  "completion_pr": 362,
                  "implemented_through": "AR-8F",
                  "state": "ACCEPTED_MAIN",
                  "accepted_main_through": "AR-8",
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "exact_green_head": "81d1f0c26ff0bd3a688c2d5dc000b93640479e47",
                  "implementation_merge": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "acceptance_evidence": "docs/evidence/2026-08-18-ar8-final-acceptance.json",
                  "production_mutation": False,
              },'''
          if old not in text:
              raise SystemExit('inventory source_completion block missing')
          text = text.replace(old, new, 1)
          text = text.replace('documentation["ar8_completion_pr"] = 362', 'documentation["ar8_completion_pr"] = 362\n    documentation["ar8_acceptance_evidence"] = "docs/evidence/2026-08-18-ar8-final-acceptance.json"')
          text = text.replace('Architecture inventory projects current subject-domain authorities while accepted-main/AR-9/production remain blocked.', 'Architecture inventory projects accepted AR-8 subject-domain authorities; AR-9 is current while production remains blocked.')
          text = text.replace('Wrote architecture/inventory.json with current subject-domain AR-8 completion projection.', 'Wrote architecture/inventory.json with accepted AR-8 and AR-9 handoff projection.')
          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          cat > scripts/check-documentation-authority.py <<'PY'
          #!/usr/bin/env python3
          """Current documentation authority checker after accepted AR-8 and AR-9 handoff."""

          from __future__ import annotations

          import argparse
          import importlib.util
          import json
          import sys
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          LEGACY_PATH = ROOT / "scripts/check-documentation-authority-legacy.py"
          ACCEPTANCE_EVIDENCE = Path("docs/evidence/2026-08-18-ar8-final-acceptance.json")
          SUBJECT_FILES = (
              Path("architecture/credential-authority.json"),
              Path("architecture/credential-lifecycle.json"),
              Path("architecture/operator-contract.json"),
              Path("architecture/profile-security.json"),
              Path("architecture/README.md"),
          )

          spec = importlib.util.spec_from_file_location("documentation_authority_legacy", LEGACY_PATH)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load documentation authority legacy engine")
          legacy = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(legacy)

          legacy_expected_current_delivery_map = legacy.expected_current_delivery_map
          legacy.CURRENT_SLICE = "AR-9"
          legacy.NEXT_SLICE = "AR-10"
          legacy.CURRENT_DELIVERY_CHECKPOINT = "AR-8"
          legacy.AR8_ACCEPTED_SUBSLICES = ["AR-8A", "AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"]
          legacy.AR8_CURRENT_SUBSLICE = None
          legacy.AR8D_IMPLEMENTATION_ISSUE = None
          legacy.AR8_IMPLEMENTATION_ENTRY_GATE = "AR8_ACCEPTED_MAIN_AR9_CURRENT"
          legacy.AR8_MANDATORY_REMAINING = []
          if "AR-8" not in legacy.ACCEPTED_SLICES:
              legacy.ACCEPTED_SLICES = [*legacy.ACCEPTED_SLICES, "AR-8"]
          if ACCEPTANCE_EVIDENCE not in legacy.REQUIRED_FILES:
              legacy.REQUIRED_FILES = (*legacy.REQUIRED_FILES, ACCEPTANCE_EVIDENCE)


          def expected_current_delivery_map() -> dict[str, object]:
              base = legacy_expected_current_delivery_map()
              base["accepted_checkpoint"] = "AR-8"
              base["current_work"] = "AR-9"
              base["source_implemented"] = {
                  "status": "ACCEPTED",
                  "through": "AR-8",
                  "current_subslice": "AR-9",
                  "current_subslice_source": "ACCEPTED_MAIN_AFTER_AR8_CLOSEOUT",
              }
              base["accepted_on_main"] = {
                  "status": "COMPLETE",
                  "through": "AR-8",
                  "full_ar8_accepted": True,
                  "acceptance_evidence": ACCEPTANCE_EVIDENCE.as_posix(),
              }
              base["current_blocker"] = {"issue": None, "status": "NONE", "blocks": "NONE"}
              base["next_gate"] = {"id": "AR-9_ACCEPTANCE", "issue": None, "on_success": "AR-10_BECOMES_CURRENT"}
              base["invariants"].update({
                  "source_present_not_equal_production_enabled": True,
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "architecture_complete": False,
                  "production_core_gate": "BLOCKED",
                  "production_ready": False,
                  "production_mutation": False,
              })
              return base


          def validate_ar8_progress(value: object, label: str, errors: list[str], *, allow_projection_fields: bool) -> None:
              progress = value if isinstance(value, dict) else {}
              expected = {
                  "umbrella_issue": 308,
                  "accepted_subslices": ["AR-8A", "AR-8B", "AR-8C", "AR-8D", "AR-8E", "AR-8F"],
                  "current_subslice": None,
                  "current_implementation_issue": None,
                  "mandatory_remaining": [],
                  "implementation_entry_gate": "AR8_ACCEPTED_MAIN_AR9_CURRENT",
                  "full_ar8_accepted": True,
                  "ar9_blocked": False,
                  "production_mutation": False,
                  "source_complete_candidate": False,
                  "completion_pr": 362,
                  "implemented_through": "AR-8F",
                  "accepted_top_level_slice": "AR-8",
                  "exact_green_head": "81d1f0c26ff0bd3a688c2d5dc000b93640479e47",
                  "implementation_merge": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "applicable_permanent_workflows": "14/14",
                  "accepted_main_reread": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "acceptance_evidence": ACCEPTANCE_EVIDENCE.as_posix(),
              }
              for key, wanted in expected.items():
                  if progress.get(key) != wanted:
                      errors.append(f"{label}.{key} must be {wanted!r}")
              if allow_projection_fields:
                  if progress.get("credential_authority_source") != "architecture/credential-authority.json":
                      errors.append(f"{label}.credential_authority_source must point to current subject credential authority")
                  if progress.get("credential_registry_provenance") != "architecture/credential-authority-ar8b.json":
                      errors.append(f"{label}.credential_registry_provenance must preserve accepted AR-8B provenance")
                  if progress.get("canonical_projection") != "architecture/inventory.json::subject_domain_authorities":
                      errors.append(f"{label}.canonical_projection must point to current subject-domain inventory projection")


          legacy.expected_current_delivery_map = expected_current_delivery_map
          legacy.validate_ar8_progress = validate_ar8_progress


          def validate_acceptance_evidence(root: Path) -> None:
              payload = json.loads((root / ACCEPTANCE_EVIDENCE).read_text(encoding="utf-8"))
              exact = {
                  "status": "ACCEPTED_AR8",
                  "implementation_pr": 362,
                  "exact_green_head": "81d1f0c26ff0bd3a688c2d5dc000b93640479e47",
                  "implementation_merge": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "applicable_permanent_workflows": "14/14",
                  "behind_by": 0,
                  "blocking_reviews": 0,
                  "unresolved_review_threads": 0,
                  "accepted_main_reread": "874666f6ef6eb003425c9677d558378d6dc0daaf",
                  "production_mutation": False,
              }
              for key, wanted in exact.items():
                  if payload.get(key) != wanted:
                      raise ValueError(f"AR-8 acceptance evidence {key} drifted")
              if payload.get("next_slice") != "AR-9" or payload.get("production_core_gate") != "BLOCKED" or payload.get("production_ready") is not False:
                  raise ValueError("AR-8 acceptance evidence must hand off to AR-9 without enabling production")


          def validate_subject_authority(root: Path) -> None:
              for relative in SUBJECT_FILES:
                  if not (root / relative).is_file():
                      raise ValueError(f"missing current subject-domain architecture file: {relative}")
              authority = json.loads((root / "architecture/credential-authority.json").read_text(encoding="utf-8"))
              lifecycle = json.loads((root / "architecture/credential-lifecycle.json").read_text(encoding="utf-8"))
              operator = json.loads((root / "architecture/operator-contract.json").read_text(encoding="utf-8"))
              profile = json.loads((root / "architecture/profile-security.json").read_text(encoding="utf-8"))
              if authority.get("kind") != "CURRENT_CREDENTIAL_AUTHORITY" or authority.get("status") != "current":
                  raise ValueError("current credential authority composition root drifted")
              if lifecycle.get("kind") != "CREDENTIAL_LIFECYCLE_AUTHORITY" or lifecycle.get("status") != "current":
                  raise ValueError("current credential lifecycle authority drifted")
              if operator.get("kind") != "OPERATOR_CONTRACT_AUTHORITY" or operator.get("mode") != "READ_ONLY_METADATA_ONLY":
                  raise ValueError("current operator contract drifted")
              if profile.get("kind") != "PROFILE_SECURITY_AUTHORITY" or len(profile.get("security_domains", [])) != 6:
