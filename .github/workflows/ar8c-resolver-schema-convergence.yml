name: AR-8C Resolver Schema Convergence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar8c-resolver-schema-convergence-staging
  cancel-in-progress: false

jobs:
  converge:
    name: AR-8C Protected Resolver Schema Convergence
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      AR8C_TARGET_ENVIRONMENT: staging
      CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
    steps:
      - name: Checkout accepted main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact accepted-main checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "main"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Read-only resolver convergence prepare
        run: node .github/scripts/ar8c-resolver-schema-convergence.mjs prepare

      - name: Apply only the accepted missing D1 migration
        run: |
          case "$AR8C_RESOLVER_ACTION" in
            APPLY)
              npx --yes wrangler@4.94.0 d1 migrations apply "$AR8C_RESOLVER_DB_NAME" --remote --config "$AR8C_WRANGLER_CONFIG" --experimental-provision=false --experimental-auto-create=false --install-skills=false
              ;;
            NOOP)
              echo "AR-8C resolver schema is already converged; no provider mutation required."
              ;;
            *)
              echo "Unexpected AR8C_RESOLVER_ACTION; refusing execution." >&2
              exit 1
              ;;
          esac

      - name: Verify exact resolver convergence
        run: node .github/scripts/ar8c-resolver-schema-convergence.mjs verify
