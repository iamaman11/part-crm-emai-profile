name: Phase 2I Governance Patch

on:
  push:
    branches:
      - phase2i-governance-closeout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Apply bounded Phase 2I governance closeout
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          SOURCE_HEAD = "c1075337cfc582d0f4c00ec34b1aa7cda9ac1101"
          MERGE_SHA = "800c634147d6300ea3989ff0cf87ade6e2387ee9"

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all_required(path: str, old: str, new: str, minimum: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrences, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected one replacement, found {count}: {pattern}")
              file.write_text(updated, encoding="utf-8")

          ledger_path = Path("architecture/accepted-phases.json")
          ledger = json.loads(ledger_path.read_text(encoding="utf-8"))
          phases = ledger["accepted_phases"]
          if phases[-1]["phase"] != "Phase 2H":
              raise SystemExit("accepted phase ledger must end at Phase 2H before Phase 2I closeout")
          phases.append(
              {
                  "phase": "Phase 2I",
                  "issue": 167,
                  "implementation_pr": 168,
                  "source_head": SOURCE_HEAD,
                  "merge_sha": MERGE_SHA,
                  "permanent_workflows": 12,
              }
          )
          ledger_path.write_text(json.dumps(ledger, indent=2) + "\n", encoding="utf-8")

          replace_once(
              "scripts/accepted_phase_provenance.py",
              '    "Phase 2H",\n)',
              '    "Phase 2H",\n    "Phase 2I",\n)',
          )

          plan = "docs/DEVELOPMENT_PLAN.md"
          replace_once(
              plan,
              "**Tracking:** Phase 1 complete; Phase 2A/2B/2C/2D/2E/2F/2G/2H accepted via #118/#137, #138/#140, #142/#143, #144/#147, #148/#152, #154/#155, #159/#160 and #163/#164; Phase 2I is the unique NEXT after this docs closeout; expert-plan refinement #133; external CRM is future development only",
              "**Tracking:** Phase 1 complete; Phase 2A/2B/2C/2D/2E/2F/2G/2H/2I accepted via #118/#137, #138/#140, #142/#143, #144/#147, #148/#152, #154/#155, #159/#160, #163/#164 and #167/#168; Phase 2J is the unique NEXT after this docs closeout; expert-plan refinement #133; external CRM is future development only",
          )
          replace_once(
              plan,
              "  rendering, explicit offline behavior and permanent route/generated-contract/privacy boundary checks.\n",
              "  rendering, explicit offline behavior and permanent route/generated-contract/privacy boundary checks;\n- Phase 2I integrated release-candidate hardening with executable cross-capability security/failure/recovery\n  evidence, D1/R2/coordinator/Bridge recovery drills, metadata-safe operational/capacity policy,\n  dependency/license/source controls, threat-model closure, support-bundle privacy enforcement and a\n  release-candidate contract/migration freeze.\n",
          )
          replace_once(
              plan,
              "Phase 2H was accepted through issue #163 / PR #164 from exact proven source head\n`9add9b94d0de255b93e5a7c24584fcf6756462a7` and guarded squash merge\n`a32768feddb3da69b872e701bc529aad3521e1b0`.\n",
              "Phase 2H was accepted through issue #163 / PR #164 from exact proven source head\n`9add9b94d0de255b93e5a7c24584fcf6756462a7` and guarded squash merge\n`a32768feddb3da69b872e701bc529aad3521e1b0`.\n\nPhase 2I was accepted through issue #167 / PR #168 from exact proven source head\n`c1075337cfc582d0f4c00ec34b1aa7cda9ac1101` and guarded squash merge\n`800c634147d6300ea3989ff0cf87ade6e2387ee9`.\n",
          )
          replace_once(
              plan,
              "Exactly one implementation slice is active at a time. Phase 2I is the unique NEXT only after this\nPhase 2H docs closeout is accepted on `main`; Phase 2J remains blocked by the same linear rule.",
              "Exactly one implementation slice is active at a time. Phase 2J is the unique NEXT only after this\nPhase 2I docs closeout is accepted on `main`; future CRM work remains blocked by the same linear rule.",
          )
          replace_all_required(plan, "Phase 2A through Phase 2H are accepted; Phase 2I is the unique next implementation slice after this closeout.", "Phase 2A through Phase 2I are accepted; Phase 2J is the unique next implementation slice after this closeout.")
          replace_all_required(plan, "Phase 2A through Phase 2H are also accepted; Phase 2I is the unique NEXT and Phase 2J remains", "Phase 2A through Phase 2I are also accepted; Phase 2J is the unique NEXT and future CRM work remains")
          replace_once(
              plan,
              "### Phase 2I — Standalone E2E, security, recovery and operational hardening — NEXT",
              "### Phase 2I — Standalone E2E, security, recovery and operational hardening — ACCEPTED",
          )
          acceptance_anchor = """#### 2I acceptance

- no unresolved repository-owned architecture/security correctness gaps;
- backup/restore/recovery procedures have executable evidence;
- failure injection does not violate canonical state/fencing/idempotency invariants;
- performance/cost bounds are documented for supported scale assumptions;
- all permanent workflows green on one exact release-candidate head.

### Phase 2J — Production-readiness evidence and controlled rollout
"""
          acceptance_replacement = """#### 2I acceptance

- no unresolved repository-owned architecture/security correctness gaps;
- backup/restore/recovery procedures have executable evidence;
- failure injection does not violate canonical state/fencing/idempotency invariants;
- performance/cost bounds are documented for supported scale assumptions;
- all permanent workflows green on one exact release-candidate head.

#### Phase 2I acceptance evidence

Phase 2I was accepted through issue #167 / implementation PR #168 from exact proven source head
`c1075337cfc582d0f4c00ec34b1aa7cda9ac1101` and guarded squash merge
`800c634147d6300ea3989ff0cf87ade6e2387ee9`. The unchanged source head passed exactly 12/12
permanent workflows with `behind_by=0`, reviews=0 and unresolved review threads=0. Accepted repository-
owned scope includes integrated identity/client/profile/mailbox/device/realtime/UI release-candidate
checks; tenant/IDOR/revocation/result-count privacy negatives; duplicate/replay/fencing/failure recovery;
D1-compatible backup/restore and corruption rejection; immutable-generation/coordinator/Bridge recovery;
metadata-safe operational indicators and source-backed capacity bounds; dependency source/integrity and
installed Rust/npm license checks; threat-model closure; allowlist-only support/evidence policy; and
release-candidate contract/migration freeze. Real provider, Camoufox, physical-device, remote R2/key,
trusted-signing and production Cloudflare evidence remains Phase 2J External scope, and
`production_ready=false` remains intentional.

### Phase 2J — Production-readiness evidence and controlled rollout — NEXT
"""
          replace_once(plan, acceptance_anchor, acceptance_replacement)
          replace_once(
              plan,
              "Phase 2I integrated E2E/security/recovery/operations hardening                                        NEXT\nPhase 2J real production evidence + controlled rollout",
              "Phase 2I integrated E2E/security/recovery/operations hardening                                        ACCEPTED\nPhase 2J real production evidence + controlled rollout                                                NEXT",
          )
          replace_all_required(plan, "**Accepted through Phase 2H.** Phase 1B durable delivery", "**Accepted through Phase 2I.** Phase 1B durable delivery")
          replace_all_required(plan, "**Accepted through Phase 2H.** Notification replay", "**Accepted through Phase 2I.** Notification replay")
          replace_all_required(plan, "**Accepted through Phase 2H.** Live membership/grants", "**Accepted through Phase 2I.** Live membership/grants")
          replace_all_required(plan, "**Accepted in Phase 2D and preserved through Phase 2H.**", "**Accepted in Phase 2D and preserved through Phase 2I.**")
          replace_all_required(plan, "**Accepted repository-local through Phase 2F.**", "**Accepted repository-local through Phase 2I.**")
          replace_all_required(plan, "Phase 2I closes broader recovery/E2E; Phase 2J supplies real physical/provider evidence.", "Phase 2I accepted broader repository-local recovery/E2E evidence; Phase 2J supplies real physical/provider evidence.")
          regex_once(
              plan,
              r"## 19\. Immediate Next Action\n.*\Z",
              """## 19. Immediate Next Action

After this docs/governance closeout is accepted on `main`, open the bounded implementation/evidence issue
and start **Phase 2J — production-readiness evidence and controlled rollout** from the exact resulting
pre-2J closeout `main` SHA. Do not start Phase 2J directly from the Phase 2I implementation merge
`800c634147d6300ea3989ff0cf87ade6e2387ee9`; this governance closeout is part of the linear gate.

Execute Phase 2J only for real-world evidence that repository-local CI cannot prove:

```text
isolated production Cloudflare resources/budgets + remote D1/R2/DO/Queue proof
  -> trusted Windows signing/update/rollback
  -> primary + secondary physical Windows hosts and real multi-device recovery
  -> production device-key protection/unwrap/revoke/recovery
  -> escrow/key restore drill
  -> privacy/retention/product-license approval
  -> real provider/fingerprint certification
  -> remote backup/recovery/failure-order drills
  -> independent security/cryptographic review where applicable
  -> monitoring/on-call/runbook/rollout/rollback acceptance
  -> staged rollout with explicit rollback triggers
  -> production_ready=true only after every mandatory External gate is accepted
```

Phase 2I repository-local release-candidate evidence remains accepted input and must not be relabeled as
production proof. Missing or failed real provider/device/signing/key/remote-runtime evidence keeps
`production_ready=false`. External CRM remains future-only until standalone Phase 2J is accepted.
""",
          )

          matrix = "docs/DEVELOPER_CAPABILITY_MATRIX.md"
          replace_all_required(matrix, "broader integrated failure/recovery proof is Phase 2I.", "Phase 2I integrated failure/recovery proof is accepted; real provider/device/production proof remains Phase 2J External evidence.")
          replace_all_required(matrix, "Real browser/kernel-lock and physical multi-device evidence remains Phase 2I/2J Target/External.", "Real browser/kernel-lock and physical multi-device evidence remains Phase 2J External.")
          replace_all_required(matrix, "Phase 2I proves integrated E2E/security/recovery/operational behavior; Phase 2J supplies real rollout evidence.", "Phase 2I integrated E2E/security/recovery/operational behavior is accepted; Phase 2J supplies real rollout evidence.")
          replace_all_required(matrix, "Real provider/device execution remains External; Phase 2I expands integrated failure/recovery proof.", "Phase 2I integrated failure/recovery proof is accepted; real provider/device execution remains Phase 2J External evidence.")
          replace_all_required(matrix, "Real-world provider content corpus/security validation expands in Phase 2I/2J.", "Repository-local security negatives are accepted through Phase 2I; real-world provider corpus validation remains Phase 2J External evidence.")
          replace_once(
              matrix,
              "| Cross-component standalone acceptance | Composed / Synthetic | Deterministic metadata-only manifest covers governed D1, generation integrity, Worker/adapters native+WASM, Phase 2F retained Bridge close -> immutable upload -> exact verify -> authoritative commit -> successor/release, Phase 2G Worker/DO realtime composition, and the Phase 2H generated operator-query/Client Mail/frontend composition. | Broader release-candidate E2E/security/recovery/load evidence is Phase 2I; real deployment/provider/device evidence is External. |",
              "| Cross-component standalone acceptance | Composed / Synthetic | Phase 2I expands the deterministic metadata-only standalone proof across identity/client/profile/mailbox/device/realtime/UI security, failure, recovery, supply-chain/license, support-bundle and release-freeze gates. | Real deployment/provider/device/signing/key evidence is Phase 2J External. |",
          )
          replace_all_required(matrix, "Phase 2I proves integrated release-candidate behavior.", "Phase 2I integrated release-candidate behavior is accepted.")
          replace_all_required(matrix, "Broader integrated performance/security evidence is Phase 2I; real provider/device evidence remains External.", "Phase 2I repository-local performance/security bounds are accepted; production calibration and real provider/device evidence remain Phase 2J External.")
          replace_all_required(matrix, "Phase 2I owns integrated E2E/security/recovery/operations hardening; Phase 2J closes real rollout evidence.", "Phase 2I integrated E2E/security/recovery/operations hardening is accepted; Phase 2J closes real rollout evidence.")
          replace_once(
              matrix,
              "| External CRM integration | Target / Future |",
              "| Integrated release-candidate hardening | Composed / Synthetic | Phase 2I implementation PR #168 was accepted from exact source head `c1075337cfc582d0f4c00ec34b1aa7cda9ac1101` and guarded squash merge `800c634147d6300ea3989ff0cf87ade6e2387ee9`, with exactly 12/12 permanent workflows success, `behind_by=0`, reviews=0 and unresolved review threads=0. Repository-owned scope includes executable security/failure/recovery/DR, metadata-safe operations/capacity, dependency/license/threat-model, support-bundle and release-freeze evidence. | Real Cloudflare/provider/Camoufox/physical-device/signing/key/independent-review evidence remains Phase 2J External; `production_ready=false` remains unchanged. |\n| External CRM integration | Target / Future |",
          )
          replace_all_required(matrix, "**Accepted through Phase 2H**", "**Accepted through Phase 2I**")
          replace_all_required(matrix, "**Accepted through Phase 2H.**", "**Accepted through Phase 2I.**")
          replace_all_required(matrix, "**Accepted repository-local through Phase 2F**", "**Accepted repository-local through Phase 2I**")
          replace_all_required(matrix, "Preserve continuously through Phase 2I.", "Preserve continuously through Phase 2J.")
          replace_all_required(matrix, "Preserve through Phase 2I.", "Preserve through Phase 2J.")
          replace_all_required(matrix, "Phase 2I closes broader recovery/E2E; Phase 2J supplies real physical/provider evidence.", "Phase 2I accepted broader repository-local recovery/E2E evidence; Phase 2J supplies real physical/provider evidence.")
          replace_once(
              matrix,
              "- accepted Phase 2H implementation provenance: issue #163 / PR #164, exact source head `9add9b94d0de255b93e5a7c24584fcf6756462a7`, squash merge `a32768feddb3da69b872e701bc529aad3521e1b0`;",
              "- accepted Phase 2H implementation provenance: issue #163 / PR #164, exact source head `9add9b94d0de255b93e5a7c24584fcf6756462a7`, squash merge `a32768feddb3da69b872e701bc529aad3521e1b0`;\n- accepted Phase 2I implementation provenance: issue #167 / PR #168, exact source head `c1075337cfc582d0f4c00ec34b1aa7cda9ac1101`, squash merge `800c634147d6300ea3989ff0cf87ade6e2387ee9`;",
          )

          inventory = "scripts/generate-architecture-inventory.py"
          replace_once(inventory, '        "Phase 2I — Standalone E2E, security, recovery and operational hardening — NEXT",', '        "Phase 2I — Standalone E2E, security, recovery and operational hardening — ACCEPTED",\n        "Phase 2J — Production-readiness evidence and controlled rollout — NEXT",')
          replace_once(inventory, '        "Phase 2H was accepted through issue #163 / PR #164",\n        "`9add9b94d0de255b93e5a7c24584fcf6756462a7`",\n        "`a32768feddb3da69b872e701bc529aad3521e1b0`",', '        "Phase 2I was accepted through issue #167 / PR #168",\n        "`c1075337cfc582d0f4c00ec34b1aa7cda9ac1101`",\n        "`800c634147d6300ea3989ff0cf87ade6e2387ee9`",')
          replace_all_required(inventory, "preserved through Phase 2H", "preserved through Phase 2I")
          replace_all_required(inventory, "Accepted through Phase 2H", "Accepted through Phase 2I")
          replace_all_required(inventory, "Accepted repository-local through Phase 2F", "Accepted repository-local through Phase 2I")
          replace_once(inventory, '        "Phase 2H — Complete standalone UI and administration UX — NEXT",', '        "Phase 2H — Complete standalone UI and administration UX — NEXT",\n        "Phase 2I — Standalone E2E, security, recovery and operational hardening — NEXT",\n        "Phase 2I is the unique NEXT",')
          replace_once(inventory, '        "| Complete standalone UI | Composed / Synthetic |",', '        "| Complete standalone UI | Composed / Synthetic |",\n        "| Integrated release-candidate hardening | Composed / Synthetic |",')
          replace_once(inventory, '        "`a32768feddb3da69b872e701bc529aad3521e1b0`",\n    )', '        "`a32768feddb3da69b872e701bc529aad3521e1b0`",\n        "`c1075337cfc582d0f4c00ec34b1aa7cda9ac1101`",\n        "`800c634147d6300ea3989ff0cf87ade6e2387ee9`",\n    )')

          replace_once(
              "tests/cross-component/phase2i-release-candidate.json",
              '  "completionState": "in-progress",',
              '  "completionState": "accepted",',
          )
          replace_once(
              "scripts/check-phase2i-hardening.py",
              '        "completionState": "in-progress",',
              '        "completionState": "accepted",',
          )
          replace_once(
              "tests/support/phase2i-support-bundle.json",
              '  "releaseState": "in-progress",',
              '  "releaseState": "accepted",',
          )
          replace_once(
              "scripts/check-phase2i-support-bundle.py",
              '        "releaseState": "in-progress",',
              '        "releaseState": "accepted",',
          )
          replace_once(
              "docs/PHASE2I_RELEASE_CANDIDATE_MATRIX.md",
              "**Status:** in progress — repository-local Phase 2I evidence only",
              "**Status:** ACCEPTED — repository-local Phase 2I release-candidate evidence",
          )
          replace_once(
              "docs/PHASE2I_RELEASE_CANDIDATE_MATRIX.md",
              "Still required before Phase 2I acceptance:\n\n1. complete exact-head CI validation of all repository-owned Phase 2I gates, including installed dependency license checks;\n2. confirm no unresolved repository-owned findings, `behind_by=0`, clean reviews/threads and all 12 permanent workflows successful on one unchanged head.\n\nPhase 2J remains blocked and `production_ready=false` remains unchanged until Phase 2I is accepted.",
              "Phase 2I implementation was accepted from exact source head `c1075337cfc582d0f4c00ec34b1aa7cda9ac1101` after exactly 12/12 permanent workflows succeeded with `behind_by=0`, reviews=0 and unresolved review threads=0, then guarded-squash merged as `800c634147d6300ea3989ff0cf87ade6e2387ee9`.\n\nPhase 2J is the next evidence slice only after this governance closeout reaches `main`; `production_ready=false` remains unchanged until Phase 2J accepts every mandatory External gate.",
          )
          replace_once(
              "docs/PHASE2I_THREAT_MODEL.md",
              "Status: in progress; repository-local release-candidate scope only. Production readiness remains false.",
              "Status: ACCEPTED for repository-local Phase 2I scope. Production readiness remains false pending Phase 2J External evidence.",
          )
          PY

      - name: Validate governance semantics before commit
        run: |
          python scripts/check-phase2i-hardening.py
          python scripts/check-phase2i-hardening.py --self-test
          python scripts/check-phase2i-support-bundle.py
          python scripts/check-phase2i-support-bundle.py --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/check-architecture.py

      - name: Commit bounded closeout and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2i-governance-patch.yml
          git add architecture/accepted-phases.json docs/DEVELOPMENT_PLAN.md docs/DEVELOPER_CAPABILITY_MATRIX.md docs/PHASE2I_RELEASE_CANDIDATE_MATRIX.md docs/PHASE2I_THREAT_MODEL.md scripts/accepted_phase_provenance.py scripts/generate-architecture-inventory.py scripts/check-phase2i-hardening.py scripts/check-phase2i-support-bundle.py tests/cross-component/phase2i-release-candidate.json tests/support/phase2i-support-bundle.json
          git commit -m "Phase 2I: complete governance closeout"
          git push origin HEAD:phase2i-governance-closeout
