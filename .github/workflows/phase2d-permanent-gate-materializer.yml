name: Phase 2D Permanent Gate Materializer

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'phase2d-query-cqrs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phase 2D head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2d-query-cqrs
          fetch-depth: 0
          persist-credentials: true

      - name: Wire Phase 2D into permanent gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          quality = Path('.github/workflows/quality-gate.yml')
          replace_once(
              quality,
              '''          scripts/check-phase2c-client-boundaries.py
          scripts/test-phase2c-client-merge-assignment.py
''',
              '''          scripts/check-phase2c-client-boundaries.py
          scripts/test-phase2c-client-merge-assignment.py
          scripts/check-phase2d-query-boundaries.py
          scripts/test-phase2d-query-projections.py
''',
          )
          replace_once(
              quality,
              '''      - name: Prove Phase 2C client merge and assignment D1 invariants
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Format
''',
              '''      - name: Prove Phase 2C client merge and assignment D1 invariants
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Enforce Phase 2D query and privacy boundaries
        run: python scripts/check-phase2d-query-boundaries.py

      - name: Prove Phase 2D negative query fixtures are rejected
        run: python scripts/check-phase2d-query-boundaries.py --self-test

      - name: Prove Phase 2D grant-safe projections and query plans
        run: python scripts/test-phase2d-query-projections.py

      - name: Test Phase 2D query application and synthetic Bridge adapter
        run: |
          cargo test --locked -p application-ports -p use-cases-query
          cargo test --locked -p profile-bridge fake_mail_query

      - name: Format
''',
          )
          replace_once(
              quality,
              '''          -p application-ports
          -p use-cases

      - name: Validate delivery status
''',
              '''          -p application-ports
          -p use-cases
          -p use-cases-query

      - name: Validate delivery status
''',
          )

          audit = Path('.github/workflows/repository-quality-audit-gate.yml')
          replace_once(
              audit,
              '''          python -m py_compile scripts/check-phase2c-client-boundaries.py
          python -m py_compile scripts/test-phase2c-client-merge-assignment.py
''',
              '''          python -m py_compile scripts/check-phase2c-client-boundaries.py
          python -m py_compile scripts/test-phase2c-client-merge-assignment.py
          python -m py_compile scripts/check-phase2d-query-boundaries.py
          python -m py_compile scripts/test-phase2d-query-projections.py
''',
          )
          replace_once(
              audit,
              '''      - name: Prove Phase 2C client merge and assignment D1 invariants
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Enforce thin client Worker application boundary
''',
              '''      - name: Prove Phase 2C client merge and assignment D1 invariants
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Enforce Phase 2D query and privacy boundaries
        run: python scripts/check-phase2d-query-boundaries.py

      - name: Prove Phase 2D negative query fixtures are rejected
        run: python scripts/check-phase2d-query-boundaries.py --self-test

      - name: Prove Phase 2D grant-safe projections and query plans
        run: python scripts/test-phase2d-query-projections.py

      - name: Enforce thin client Worker application boundary
''',
          )
          replace_once(
              audit,
              '''      - name: Check Phase 2A client inner boundaries for Workers target
        run: >-
          cargo check --locked
          -p profile-platform-primitives
          -p client-domain
          -p application-ports
          -p use-cases-clients
          --target wasm32-unknown-unknown

      - name: Test hardened pure boundaries
''',
              '''      - name: Check Phase 2A client inner boundaries for Workers target
        run: >-
          cargo check --locked
          -p profile-platform-primitives
          -p client-domain
          -p application-ports
          -p use-cases-clients
          --target wasm32-unknown-unknown

      - name: Test Phase 2D query inner boundaries
        run: >-
          cargo test --locked
          -p application-ports
          -p use-cases-query

      - name: Check Phase 2D query inner boundaries for Workers target
        run: >-
          cargo check --locked
          -p application-ports
          -p use-cases-query
          --target wasm32-unknown-unknown

      - name: Test hardened pure boundaries
''',
          )
          replace_once(
              audit,
              '''      - name: Test typed Cloudflare projections
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Test Worker native helpers
''',
              '''      - name: Test typed Cloudflare projections
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Test deterministic Bridge mail query adapter
        run: cargo test --locked -p profile-bridge fake_mail_query

      - name: Test Worker native helpers
''',
          )
          PY

      - name: Validate permanent Phase 2D wiring
        run: |
          python -m py_compile scripts/check-phase2d-query-boundaries.py scripts/test-phase2d-query-projections.py
          python scripts/check-phase2d-query-boundaries.py
          python scripts/check-phase2d-query-boundaries.py --self-test
          python scripts/test-phase2d-query-projections.py
          python scripts/generate-frontend-contracts.py --check
          cargo test --locked -p application-ports -p use-cases-query
          cargo test --locked -p cloudflare-adapters --lib
          cargo test --locked -p profile-bridge fake_mail_query
          cargo check --locked -p application-ports -p use-cases-query -p cloudflare-adapters --target wasm32-unknown-unknown
          grep -q 'Enforce Phase 2D query and privacy boundaries' .github/workflows/quality-gate.yml
          grep -q 'Enforce Phase 2D query and privacy boundaries' .github/workflows/repository-quality-audit-gate.yml
          git diff --check

      - name: Commit permanent wiring and self-delete
        run: |
          rm .github/workflows/phase2d-permanent-gate-materializer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Phase 2D: wire permanent query acceptance gates'
          git push origin HEAD:phase2d-query-cqrs
