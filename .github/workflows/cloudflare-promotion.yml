          --no-bundle
          --strict
          --message "release=${{ inputs.release_id }} source=${{ inputs.release_sha }} artifact-sha256=${{ inputs.artifact_sha256 }}"
          --experimental-provision=false
          --experimental-auto-create=false

  production-verify:
    name: Production Verification And Attestation
    needs: [production-deploy]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEPLOY_MANIFEST_JSON: ${{ secrets.CLOUDFLARE_DEPLOY_MANIFEST_JSON }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout exact accepted release source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
