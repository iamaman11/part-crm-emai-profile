name: AR-10 Main Protection Once

on:
  push:
    branches:
      - agent/ar10-runtime-cutover

permissions:
  contents: read

concurrency:
  group: ar10-main-protection-once
  cancel-in-progress: false

jobs:
  harden:
    name: Add Camoufox required checks to main
    runs-on: ubuntu-24.04
    env:
      GH_ADMIN_OPERATOR_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}
      REPOSITORY: iamaman11/part-crm-emai-profile
      BRANCH: main
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Add only AR-10 Camoufox required contexts
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ.get('GH_ADMIN_OPERATOR_TOKEN', '')
          if not token:
              raise SystemExit('GH_ADMIN_OPERATOR_TOKEN is required for hosted main-protection hardening')

          repository = os.environ['REPOSITORY']
          branch = os.environ['BRANCH']
          api = f'https://api.github.com/repos/{repository}/branches/{branch}/protection'
          additions = [
              'Real Camoufox cold-launch proof',
              'Profile Bridge Windows regression',
          ]
          ar7 = json.loads(Path('architecture/github-governance-ar7.json').read_text(encoding='utf-8'))
          baseline = ar7['main_governance']['required_checks']

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'User-Agent': 'part-crm-ar10-protection-hardening',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(url, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  body = error.read().decode('utf-8', 'replace')[:1000]
                  raise SystemExit(f'GitHub API failed closed: HTTP {error.code}: {body}') from error
              return json.loads(raw) if raw else None

          def names(protection):
              status = protection.get('required_status_checks') or {}
              result = set()
              result.update(value for value in status.get('contexts', []) if isinstance(value, str))
              result.update(
                  row.get('context')
                  for row in status.get('checks', [])
                  if isinstance(row, dict) and isinstance(row.get('context'), str)
              )
              return result

          before = request(api)
          if before.get('required_status_checks', {}).get('strict') is not True:
              raise SystemExit('refusing to mutate non-strict main protection')
          before_names = names(before)
          missing_baseline = sorted(set(baseline) - before_names)
          if missing_baseline:
              raise SystemExit(f'refusing to harden protection with missing accepted AR-7 checks: {missing_baseline}')

          request(
              f'{api}/required_status_checks/contexts',
              method='POST',
              payload={'contexts': additions},
          )

          after = request(api)
          if after.get('required_status_checks', {}).get('strict') is not True:
              raise SystemExit('main strict status-check policy changed during AR-10 hardening')
          after_names = names(after)
          missing_after = sorted((set(baseline) | set(additions)) - after_names)
          if missing_after:
              raise SystemExit(f'main protection is missing required checks after AR-10 hardening: {missing_after}')
          removed = sorted(before_names - after_names)
          if removed:
              raise SystemExit(f'AR-10 hardening unexpectedly removed required checks: {removed}')
          print(f'AR-10 main protection hardened additively: {len(before_names)} -> {len(after_names)} required contexts')
          PY
