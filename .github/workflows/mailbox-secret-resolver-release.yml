name: Mailbox Secret Resolver Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mailbox-secret-resolver-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  accepted-main-release:
    name: Build Once From Accepted Main
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Enforce accepted-main source authority
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python scripts/check-pre2j-d3-resolver-bootstrap-authority.py
          python scripts/check-pre2j-d3-resolver-bootstrap-implementation.py
          python scripts/mailbox-secret-resolver-release.py check

      - name: Check resolver for Workers target
        env:
          RUSTFLAGS: -Dwarnings
        run: >-
          cargo check --locked -p mailbox-secret-resolver-worker
          --target wasm32-unknown-unknown

      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Build resolver once
        working-directory: apps/mailbox-secret-resolver-worker
        run: worker-build --release

      - name: Build immutable resolver release
        id: release
        run: |
          set -euo pipefail
          python scripts/mailbox-secret-resolver-release.py build \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output

      - name: Verify immutable resolver archive
        run: |
          set -euo pipefail
          python scripts/mailbox-secret-resolver-release.py verify-archive \
            --archive "${{ steps.release.outputs.archive }}" \
            --expected-source-sha "$SOURCE_SHA"

      - name: Upload exact immutable resolver archive
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mailbox-secret-resolver-${{ steps.release.outputs.release_id }}
          path: ${{ steps.release.outputs.archive }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Record non-secret immutable identity
        run: |
          set -euo pipefail
          test -n "${{ steps.upload.outputs.artifact-digest }}"
          test -n "${{ steps.release.outputs.archive_sha256 }}"
          echo "Resolver release ${{ steps.release.outputs.release_id }} built once from ${SOURCE_SHA}."
