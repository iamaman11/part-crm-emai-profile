name: External Review Attestation Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: external-review-attestation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-review-attestation:
    name: External Review Attestations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Compile attestation policy and offline fixtures
        run: |
          python -m py_compile scripts/check-external-review-attestations.py
          python -m py_compile tests/external-review-attestations/test-attestations.py

      - name: Revalidate external evidence and readiness
        run: |
          python scripts/check-external-evidence.py
          python scripts/check-external-evidence-scope.py
          python scripts/check-external-readiness-summary.py

      - name: Run offline GitHub API attestation fixtures
        run: python tests/external-review-attestations/test-attestations.py

      - name: Verify active terminal records against GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/check-external-review-attestations.py
