name: AR-10 Governance Script Sync

on:
  push:
    branches:
      - agent/ar10-runtime-cutover

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar10-runtime-cutover
          fetch-depth: 0

      - name: Make accepted AR-7 live audit monotonic
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/github-governance.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''    if (!sameStringSet(protectionCheckNames(protection), contract.main_governance.required_checks)) {\n      errors.push('live main required status checks do not equal the contract');\n    }'''
          new = '''    const liveRequiredChecks = new Set(protectionCheckNames(protection));\n    for (const requiredCheck of contract.main_governance.required_checks) {\n      if (!liveRequiredChecks.has(requiredCheck)) {\n        errors.push(`live main lost accepted AR-7 required status check: ${requiredCheck}`);\n      }\n    }'''
          if new not in text:
              if old not in text:
                  raise SystemExit('expected AR-7 live exact-set check not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Validate governance contracts
        run: |
          node .github/scripts/github-governance.mjs contract
          node .github/scripts/github-governance.mjs self-test
          node .github/scripts/ar10-github-governance-extension.mjs contract
          node .github/scripts/ar10-github-governance-extension.mjs self-test
          git diff --check

      - name: Commit monotonic live-audit semantics
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/github-governance.mjs
          git commit -m 'Allow additive required checks after AR-7'
          git push origin HEAD:agent/ar10-runtime-cutover
