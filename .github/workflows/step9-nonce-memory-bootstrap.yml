name: Step 9 Nonce Memory Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step9-final-hardening
  cancel-in-progress: false

jobs:
  finalize-memory-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-encrypted-cloud-generations
          persist-credentials: true

      - name: Require prior hardening and minimize nonce-domain lifetime
        run: |
          python - <<'PY'
          from pathlib import Path

          container = Path("crates/encrypted-generation-domain/src/container.rs")
          text = container.read_text(encoding="utf-8")
          required = (
              "use zeroize::{Zeroize, Zeroizing};",
              "plaintext: Zeroizing<Vec<u8>>",
              "let mut plaintext = Zeroizing::new(Vec::new());",
              "pub(crate) fn into_parts",
          )
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f"prior plaintext/parser hardening is not present: {missing}")
          text = text.replace(
              "#[derive(Clone, Copy, Eq, Hash, Ord, PartialEq, PartialOrd)]\npub(crate) struct NonceDomain([u8; 32]);",
              "#[derive(Eq, Ord, PartialEq, PartialOrd)]\npub(crate) struct NonceDomain([u8; 32]);",
          )
          if "impl Drop for NonceDomain" not in text:
              marker = "pub(crate) struct NonceDomain([u8; 32]);\n"
              addition = '''pub(crate) struct NonceDomain([u8; 32]);

          impl Drop for NonceDomain {
              fn drop(&mut self) {
                  self.0.zeroize();
              }
          }
          '''
              if text.count(marker) != 1:
                  raise SystemExit("nonce domain marker is missing or duplicated")
              text = text.replace(marker, addition, 1)
          container.write_text(text, encoding="utf-8")

          lifecycle = Path("crates/encrypted-generation-domain/src/lifecycle.rs")
          text = lifecycle.read_text(encoding="utf-8")
          required = (
              "plaintext: Zeroizing<Vec<u8>>",
              "let (metadata, plaintext) = opened.into_parts();",
          )
          missing = [fragment for fragment in required if fragment not in text]
          if missing:
              raise SystemExit(f"prior restore hardening is not present: {missing}")
          text = text.replace(
              "#[derive(Clone, Default, Eq, PartialEq)]\npub struct CloudGenerationRepository {",
              "#[derive(Default)]\npub struct CloudGenerationRepository {",
          )
          lifecycle.write_text(text, encoding="utf-8")

          tests = Path("crates/encrypted-generation-domain/src/tests.rs").read_text(encoding="utf-8")
          for fragment in (
              "fn nonce_reuse_is_detected_across_key_id_aliases",
              "fn wrong_key_does_not_quarantine_unchanged_object",
              "fn malformed_headers_and_trailing_bytes_fail_closed",
          ):
              if fragment not in tests:
                  raise SystemExit(f"required security regression is missing: {fragment}")

          docs = Path("docs/ENCRYPTED_CLOUD_GENERATIONS.md")
          text = docs.read_text(encoding="utf-8")
          if "Production nonce claims must be persisted atomically" not in text:
              text = text.replace(
                  "with the same DEK even when callers try different key IDs.",
                  "with the same DEK even when callers try different key IDs. The internal\nnonce-domain value is not cloneable or printable and is zeroized on drop.\nProduction nonce claims must be persisted atomically with immutable generation\npublication; the repository-local map is evidence only.",
              )
          docs.write_text(text, encoding="utf-8")
          PY

      - name: Verify final memory boundary
        run: |
          cargo fmt --all
          cargo clippy --locked -p encrypted-generation-domain --all-targets -- -D warnings
          cargo test --locked -p encrypted-generation-domain

      - name: Remove all temporary workflows and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/step9-*-bootstrap.yml
          git add crates/encrypted-generation-domain docs/ENCRYPTED_CLOUD_GENERATIONS.md Cargo.toml scripts/check-step9-encrypted-generation.py tests/encrypted-generation/fixtures/logs-key
          git commit -m "Repository Step 9: minimize nonce-domain memory lifetime"
          git fetch origin repository-step-9-encrypted-cloud-generations
          git rebase origin/repository-step-9-encrypted-cloud-generations
          git push origin HEAD:repository-step-9-encrypted-cloud-generations
