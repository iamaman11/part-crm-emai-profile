name: Repository Step 4 Remove Superseded Writes

on:
  push:
    branches:
      - repository-step-4-identity-clients-acl

permissions:
  contents: write

concurrency:
  group: repository-step4-remove-superseded-writes
  cancel-in-progress: true

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-4-identity-clients-acl
          persist-credentials: true

      - name: Remove superseded direct mutation surface
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("crates/cloudflare-adapters/src/d1_identity_acl.rs")
          text = path.read_text(encoding="utf-8")

          constants = (
              "OWNER_TRANSFER_DEMOTE",
              "OWNER_TRANSFER_PROMOTE",
              "INVITATION_CREATE",
              "INVITATION_ACCEPT_MEMBERSHIP",
              "INVITATION_ACCEPT_RECORD",
              "MEMBERSHIP_STATUS_UPDATE",
              "PROFILE_CREATE",
              "PROFILE_ASSIGNMENT_CLOSE",
              "PROFILE_ASSIGNMENT_CREATE",
              "PROFILE_VERSION_CAS",
              "PROFILE_GRANT_UPSERT",
              "PROFILE_GRANT_REVOKE",
              "CLIENT_GRANT_UPSERT",
              "CLIENT_GRANT_REVOKE",
              "CLIENT_VERSION_CAS",
          )
          for name in constants:
              text, count = re.subn(
                  rf"const {name}: &str = r#\".*?\"#;\n\n",
                  "",
                  text,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f"expected one constant {name}, removed {count}")

          methods = (
              "transfer_owner",
              "create_invitation",
              "accept_invitation",
              "update_membership_status",
              "create_profile",
              "assign_profile",
              "grant_profile",
              "revoke_profile_grant",
              "profile_grant_batch",
              "grant_client",
              "revoke_client_grant",
              "client_grant_batch",
          )

          def remove_method(source: str, name: str) -> str:
              starts = [f"    pub async fn {name}(", f"    async fn {name}("]
              positions = [source.find(start) for start in starts]
              positions = [position for position in positions if position >= 0]
              if len(positions) != 1:
                  raise SystemExit(f"expected one method {name}, found {len(positions)}")
              start = positions[0]
              opening = source.find("{", start)
              if opening < 0:
                  raise SystemExit(f"opening brace missing for {name}")

              depth = 0
              index = opening
              state = "code"
              raw_hashes = 0
              block_depth = 0
              while index < len(source):
                  char = source[index]
                  nxt = source[index + 1] if index + 1 < len(source) else ""

                  if state == "line_comment":
                      if char == "\n":
                          state = "code"
                  elif state == "block_comment":
                      if char == "/" and nxt == "*":
                          block_depth += 1
                          index += 1
                      elif char == "*" and nxt == "/":
                          block_depth -= 1
                          index += 1
                          if block_depth == 0:
                              state = "code"
                  elif state == "string":
                      if char == "\\":
                          index += 1
                      elif char == '"':
                          state = "code"
                  elif state == "char":
                      if char == "\\":
                          index += 1
                      elif char == "'":
                          state = "code"
                  elif state == "raw":
                      closing = '"' + ('#' * raw_hashes)
                      if source.startswith(closing, index):
                          index += len(closing) - 1
                          state = "code"
                  else:
                      if char == "/" and nxt == "/":
                          state = "line_comment"
                          index += 1
                      elif char == "/" and nxt == "*":
                          state = "block_comment"
                          block_depth = 1
                          index += 1
                      elif char == '"':
                          state = "string"
                      elif char == "'":
                          state = "char"
                      elif char == "r":
                          match = re.match(r'r(#{0,16})"', source[index:])
                          if match:
                              raw_hashes = len(match.group(1))
                              index += len(match.group(0)) - 1
                              state = "raw"
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              end = index + 1
                              while end < len(source) and source[end] == "\n":
                                  end += 1
                              return source[:start] + source[end:]
                  index += 1
              raise SystemExit(f"closing brace missing for {name}")

          for method in methods:
              text = remove_method(text, method)

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all

      - name: Prove governed boundary and builds
        run: |
          python scripts/check-step4-governed-writes.py
          cargo test --locked -p cloudflare-adapters --lib
          cargo check --locked -p browser-profile-control-plane-worker --target wasm32-unknown-unknown

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/repository-step4-remove-superseded-writes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 4: remove superseded direct writes"
          git push origin HEAD:repository-step-4-identity-clients-acl
