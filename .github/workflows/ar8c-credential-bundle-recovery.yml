name: AR-8C Staging Credential Bundle Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ar8c-staging-credential-bundle-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: Recover Staging Credential Bundles
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      AR8C_TARGET_ENVIRONMENT: staging
    steps:
      - name: Checkout exact source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact accepted-main boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node version
        run: test "$(node --version)" = "v24.19.0"

      - name: Validate bounded recovery implementation
        run: |
          node --check .github/scripts/ar8c-credential-bundle-recovery.mjs
          node .github/scripts/ar8c-credential-recovery-assessment.mjs self-test
          node .github/scripts/ar8c-credential-bundle-recovery.mjs self-test

      - name: Execute one-time staging credential bundle recovery
        env:
          GH_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.GH_BOOTSTRAP_ADMIN_TOKEN }}
          CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
          CLOUDFLARE_TOKEN_ISSUER_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_ISSUER_TOKEN }}
          AR8C_RECOVERY_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.AR8C_RECOVERY_GOOGLE_OAUTH_CLIENT_SECRET }}
          AR8C_RECOVERY_MICROSOFT_OAUTH_CLIENT_SECRET: ${{ secrets.AR8C_RECOVERY_MICROSOFT_OAUTH_CLIENT_SECRET }}
        run: node .github/scripts/ar8c-credential-bundle-recovery.mjs execute
