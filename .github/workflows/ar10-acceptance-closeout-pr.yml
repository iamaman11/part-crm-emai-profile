name: AR-10 Acceptance Closeout PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ar10-acceptance-closeout-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  project:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/ar10-acceptance-closeout'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: agent/ar10-acceptance-closeout
          fetch-depth: 0

      - name: Normalize current-sequence and negative-fixture semantics
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          for relative in ('docs/DEVELOPMENT_PLAN.md', 'docs/ARCHITECTURE_REBASELINE_V3_PLAN.md'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              text, count10 = re.subn(
                  r'^AR-10\s+Runtime and Historical Executable Simplification\s+CURRENT$',
                  'AR-10  Runtime and Historical Executable Simplification              DONE / ACCEPTED',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              text, count11 = re.subn(
                  r'^AR-11\s+Release-set / Promotion Architecture\s*$',
                  'AR-11  Release-set / Promotion Architecture                           CURRENT',
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count10 != 1 or count11 != 1:
                  raise SystemExit(f'{relative}: sequence normalization did not match exactly once')
              path.write_text(text, encoding='utf-8', newline='\n')

          checker = Path('scripts/check-documentation-authority.py')
          text = checker.read_text(encoding='utf-8')
          old = '("active slice rollback", ("current", "architecture_program", "current_slice"), "AR-10", "AR-9", "current_slice", False),'
          new = '("active slice rollback", ("current", "architecture_program", "current_slice"), "AR-11", "AR-10", "current_slice", False),'
          if new not in text:
              if old not in text:
                  raise SystemExit('documentation negative fixture anchor not found')
              text = text.replace(old, new, 1)
              checker.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Apply deterministic acceptance transformation
        run: python .github/scripts/ar10-acceptance-closeout-once.py

      - name: Regenerate canonical projections
        run: |
          python scripts/generate-ar8-completion-status.py --write
          python scripts/generate-architecture-inventory.py --write

      - name: Validate generated AR-10 accepted / AR-11 current state
        run: |
          python -m py_compile \
            scripts/generate-ar8-completion-status.py \
            scripts/generate-architecture-inventory.py \
            scripts/check-documentation-authority.py \
            scripts/check-ar10-runtime-cutover.py
          python scripts/generate-ar8-completion-status.py --check
          python scripts/generate-ar8-completion-status.py --self-test
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          python scripts/check-documentation-authority.py
          python scripts/check-documentation-authority.py --self-test
          git diff --check

      - name: Commit deterministic closeout projection
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            architecture/runtime-cutover-ar10.json \
            architecture/inventory.json \
            architecture/architecture-rebaseline-v3-transition.json \
            scripts/generate-architecture-inventory.py \
            scripts/check-documentation-authority.py \
            scripts/check-ar10-runtime-cutover.py \
            docs/status.json \
            README.md \
            docs/README.md \
            docs/INDEX.md \
            docs/DEVELOPMENT_PLAN.md \
            docs/ARCHITECTURE_REBASELINE_V3_PLAN.md \
            docs/DEVELOPER_CAPABILITY_MATRIX.md \
            docs/ARCHITECTURE_REBASELINE_V3_AR10.md
          git commit -m 'Accept AR-10 and advance AR-11'
          git push origin HEAD:agent/ar10-acceptance-closeout
