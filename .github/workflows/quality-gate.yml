name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  n1-materialize:
    name: N1 Scratch Materialization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact scratch source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Materialize deterministic N1 blobs
        run: |
          set +e
          python scripts/check-no-temporary-step4.py
          status=$?
          set -e
          test "$status" -eq 97
          test ! -e architecture/runtime-topology-ar2.json
          python -m py_compile scripts/_ar3_application_architecture.py scripts/generate-architecture-inventory-engine.py
          python -m json.tool architecture/inventory.json >/dev/null
          python -m json.tool docs/status.json >/dev/null

      - name: Upload deterministic N1 blobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: n1-generated-blobs
          path: |
            scripts/_ar3_application_architecture.py
            scripts/generate-architecture-inventory-engine.py
            architecture/inventory.json
            docs/status.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated blobs to disposable scratch branch
        env:
          SCRATCH_BRANCH: codex/n1-projection-scratch-20260823
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/_ar3_application_architecture.py scripts/generate-architecture-inventory-engine.py architecture/inventory.json docs/status.json architecture/runtime-topology-ar2.json
          git diff --cached --check
          git commit -m "[skip ci] scratch: materialize generated N1 blobs"
          git push origin "HEAD:refs/heads/$SCRATCH_BRANCH"
