name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust Linux and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Check domain primitives for Workers target
        run: cargo check --locked -p profile-platform-primitives --target wasm32-unknown-unknown

      - name: Validate delivery status
        run: |
          python -m json.tool docs/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          assert status["production_ready"] is False
          assert status["repository_step"]["number"] == 0
          assert status["decisions"]["adr_0006"].startswith("proposed")
          PY

      - name: Scan tracked files for high-confidence secrets
        run: bash scripts/check-tracked-secrets.sh

  rust-windows:
    name: Rust Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check and test
        run: cargo test --locked --workspace --all-targets
