name: Quality Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  n1-final-exact-audit:
    name: N1 Final Exact-Head Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit carrier
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Audit exact N1 candidate
        env:
          TARGET: 5ec729191d0fab7ea40f12e981d5b44d54e7500c
          OLD_HEAD: e0b96f33687185034b855a5186e8e2daac13e810
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET^{commit}"
          git cat-file -e "$OLD_HEAD^{commit}"
          rm -rf /tmp/n1-final-audit
          git worktree add --detach /tmp/n1-final-audit "$TARGET"
          cd /tmp/n1-final-audit
          test "$(git rev-parse HEAD)" = "$TARGET"
          test ! -e architecture/runtime-topology-ar2.json

          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-ar8-completion-status.py --check
          python scripts/check-documentation-authority.py --root .
          python scripts/check-historical-executable-debt.py > /tmp/n1-debt-report.txt
          python scripts/check-cloudflare-runtime-bindings.py
          python scripts/check-cloudflare-runtime-bindings.py --self-test

          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          root = pathlib.Path('/tmp/n1-final-audit')
          target = os.environ['TARGET']
          old_head = os.environ['OLD_HEAD']

          def git(*args: str, check: bool = True) -> subprocess.CompletedProcess[str]:
              return subprocess.run(['git', *args], cwd=root, text=True, capture_output=True, check=check)

          debt_text = pathlib.Path('/tmp/n1-debt-report.txt').read_text(encoding='utf-8')
          marker = '\nHistorical executable debt inventory is current; retired code replay remains fail closed.'
          if marker not in debt_text:
              raise SystemExit('historical-debt validator did not emit its success marker')
          debt = json.loads(debt_text.split(marker, 1)[0])
          legacy = next(
              item for item in debt['historical_executable_debt']
              if item['path'] == 'scripts/check-documentation-authority-legacy.py'
          )
          assert legacy['classification'] == 'TRANSITION_PROVENANCE_ONLY'
          assert legacy['callers'] == [], legacy

          old_path = 'architecture/runtime-topology-ar2.json'
          grep = git('grep', '-n', old_path, '--', '.', check=False)
          if grep.returncode not in (0, 1):
              raise SystemExit(grep.stderr)
          residual_paths = set()
          for line in grep.stdout.splitlines():
              path = line.split(':', 1)[0]
              residual_paths.add(path)
              allowed = (
                  path.startswith('history/')
                  or path.startswith('docs/')
                  or path == 'scripts/check-documentation-authority-legacy.py'
              )
              if not allowed:
                  raise SystemExit(f'current semantic old-topology reference remains: {line}')

          executable_suffixes = {'.py', '.sh', '.mjs', '.js', '.cjs', '.ts', '.yml', '.yaml', '.rs'}
          current_executable_old_refs = [
              path for path in residual_paths
              if pathlib.Path(path).suffix in executable_suffixes
              and path != 'scripts/check-documentation-authority-legacy.py'
          ]
          assert current_executable_old_refs == [], current_executable_old_refs

          for pattern in (
              'topology_source',
              'runtime_resources',
              'resource_refs',
              'EXPECTED_RESOURCE_DECISIONS',
              'validate_ar2_topology',
              'RUNTIME_TOPOLOGY',
          ):
              probe = git('grep', '-n', pattern, '--', '.', check=False)
              if probe.returncode == 0:
                  raise SystemExit(f'old projection/caller symbol remains for {pattern}:\n{probe.stdout}')
              if probe.returncode != 1:
                  raise SystemExit(probe.stderr)

          old_payload = json.loads(git('show', f'{old_head}:architecture/runtime-topology-ar2.json').stdout)
          resources = old_payload['resources']
          assert len(resources) == 21, len(resources)
          unmapped = []
          for item in resources:
              decision = item['decision']
              if decision == 'DELETE':
                  if item['id'] != 'generation_verification':
                      unmapped.append((item['id'], decision, 'unexpected delete'))
                  continue
              if decision not in {'KEEP', 'DEFER'}:
                  unmapped.append((item['id'], decision, 'unknown decision'))
                  continue
              evidence = item.get('evidence', [])
              live_evidence = []
              for raw in evidence:
                  path = raw.split('::', 1)[0]
                  if (root / path).exists():
                      live_evidence.append(path)
              if not live_evidence:
                  unmapped.append((item['id'], decision, evidence))

          ar3 = (root / 'scripts/_ar3_application_architecture.py').read_text(encoding='utf-8')
          assert 'EXTEND_CANONICAL_INVENTORY_DO_NOT_CREATE_COMPETING_REGISTRY' in ar3
          status = json.loads((root / 'docs/status.json').read_text(encoding='utf-8'))
          current = status['current']
          assert status['production_ready'] is False
          assert current['architecture_complete'] is False
          assert current['production_core_gate'] == 'BLOCKED'
          transition = json.loads((root / 'architecture/architecture-rebaseline-v3-transition.json').read_text(encoding='utf-8'))
          runtime = transition['runtime_topology']
          assert runtime['decision_authority'] == 'RETIRED_CURRENT_SEMANTIC_AUTHORITY'
          assert runtime['current_resource_topology_authority'] == 'WRANGLER_PROVIDER_NATIVE_CONFIGURATION_AND_PRODUCT_RUST'
          assert runtime['current_runtime_workload_authority'] == 'PRODUCT_RUST'
          assert runtime['current_anti_regression_authority'] == 'scripts/check-cloudflare-runtime-bindings.py'
          assert runtime['production_promotion_authority'] == 'PC-1_AFTER_AR-17_USING_AR-11_RELEASE_SET'
          assert transition['state_model']['production_core_gate'] == 'BLOCKED'
          assert 'no_production_mutation_during_ar0_through_ar17' in transition['hard_invariants']
          assert unmapped == [], unmapped

          print(f'N1_FINAL_AUDIT exact_head={target}')
          print('old_callers=0')
          print('old_unique_invariants=0')
          print(f'old_resource_decisions_mapped={len(resources)}')
          print(f'provenance_only_old_path_files={len(residual_paths)}')
          PY
