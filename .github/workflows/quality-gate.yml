name: Quality Gate

on:
  pull_request:

permissions:
  contents: write

jobs:
  n1-current-projection:
    name: N1 Current Projection Surgery
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact scratch source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Apply surgical current-projection cutover
        run: |
          python scripts/check-no-temporary-step4.py
          python -m json.tool architecture/architecture-rebaseline-v3-transition.json >/dev/null
          python scripts/generate-ar8-completion-status.py --check
          python scripts/generate-architecture-inventory.py --check
          python scripts/check-documentation-authority.py --root .
          python scripts/check-historical-executable-debt.py --check
          test ! -e architecture/runtime-topology-ar2.json
          ! git grep -n 'architecture/runtime-topology-ar2.json' HEAD -- architecture/architecture-rebaseline-v3-transition.json architecture/README.md

      - name: Commit only current projection blobs
        env:
          SCRATCH_BRANCH: codex/n1-current-projection-scratch-20260823
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add architecture/architecture-rebaseline-v3-transition.json architecture/README.md
          git diff --cached --check
          git commit -m "[skip ci] scratch: materialize N1 current projection blobs"
          git push origin "HEAD:refs/heads/$SCRATCH_BRANCH"
