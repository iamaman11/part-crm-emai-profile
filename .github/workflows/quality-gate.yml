name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust Linux and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Compile repository policy scripts
        run: >-
          python -m py_compile
          scripts/check-architecture.py
          scripts/check-contract-compatibility.py
          scripts/check-d1-boundary.py
          scripts/test-d1-schema.py

      - name: Enforce architecture dependency boundaries
        run: python scripts/check-architecture.py

      - name: Prove forbidden dependency fixture is rejected
        run: |
          if python scripts/check-architecture.py --root tests/architecture/fixtures/forbidden-domain; then
            echo "Forbidden architecture fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Enforce typed D1 adapter boundary
        run: python scripts/check-d1-boundary.py

      - name: Prove raw D1 use-case fixture is rejected
        run: |
          if python scripts/check-d1-boundary.py --root tests/d1-boundary/fixtures/raw-use-case; then
            echo "Raw D1 use-case fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Lint and compare v1 contracts
        run: python scripts/check-contract-compatibility.py

      - name: Prove breaking contract fixture is rejected
        run: |
          if python scripts/check-contract-compatibility.py --current-root tests/contracts/fixtures/breaking; then
            echo "Breaking contract fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Protect accepted v1 contract baseline
        run: bash scripts/check-contract-baseline-immutable.sh

      - name: Test D1 schema and transaction invariants
        run: python scripts/test-d1-schema.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy native crates
        run: >-
          cargo clippy --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters -- -D warnings

      - name: Test native crates
        run: >-
          cargo test --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters

      - name: Check pure crates for Workers target
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p profile-platform-primitives
          -p contracts
          -p control-plane-contract
          -p identity-access-domain
          -p client-domain
          -p profile-domain
          -p session-domain
          -p mailbox-domain
          -p application-ports
          -p use-cases

      - name: Validate delivery status
        run: |
          python -m json.tool docs/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          step = status["repository_step"]
          assert status["production_ready"] is False
          assert isinstance(step["number"], int) and step["number"] >= 0
          assert step["status"] in {"in_progress", "completed"}
          assert status["decisions"]["adr_0006"].startswith("proposed")
          PY

      - name: Scan tracked files for high-confidence secrets
        run: bash scripts/check-tracked-secrets.sh

  d1-catalog:
    name: D1 Catalog Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show Node and npm versions
        run: |
          node --version
          npm --version

      - name: Apply migrations to isolated local D1
        run: >-
          npx --yes wrangler@4.94.0 d1 migrations apply CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state

      - name: Prove migration replay is a no-op
        run: >-
          npx --yes wrangler@4.94.0 d1 migrations apply CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state

      - name: Run D1 integrity checks
        run: >-
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state
          --command "PRAGMA foreign_key_check; PRAGMA integrity_check;"

  cloudflare-worker:
    name: Cloudflare Worker Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check Worker for WASM
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Build release Worker artifact
        working-directory: apps/control-plane-worker
        run: worker-build --release

      - name: Verify Worker artifact
        run: |
          test -f apps/control-plane-worker/build/worker/shim.mjs
          find apps/control-plane-worker/build -type f -name '*.wasm' -print -quit | grep -q .

  rust-windows:
    name: Rust Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check and test native crates
        run: >-
          cargo test --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters
