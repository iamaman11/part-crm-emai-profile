name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-linux:
    name: Rust Linux and WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Compile repository policy scripts
        run: >-
          python -m py_compile
          scripts/check-architecture.py
          scripts/check-contract-compatibility.py
          scripts/check-d1-boundary.py
          scripts/check-device-generation-commit-boundary.py
          scripts/check-r2-generation-objects.py
          scripts/check-step4-governed-writes.py
          scripts/check-step5-profile-coordinator.py
          scripts/check-step6-windows-bridge.py
          scripts/check-no-temporary-step4.py
          scripts/check-frontend-feature-boundaries.py
          scripts/check-phase2c-client-boundaries.py
          scripts/test-phase2c-client-merge-assignment.py
          scripts/check-phase2d-query-boundaries.py
          scripts/check-phase2e-mailbox-boundaries.py
          scripts/test-phase2d-query-projections.py
          scripts/generate-frontend-contracts.py
          scripts/generate-architecture-inventory.py
          scripts/cloudflare-deploy-config.py
          scripts/test-d1-schema.py
          scripts/test-step4-identity-acl.py
          scripts/test-step4-command-guards.py
          scripts/test-step5-coordinator-projection.py
          scripts/test-step6-bridge-local.py
          scripts/test-mailbox-vertical-slice.py
          scripts/test-device-job-d1.py
          scripts/test-device-generation-commit-d1.py
          scripts/test-browser-mail-execution-d1.py

      - name: Reject temporary Step 4, Step 5 and Step 6 artifacts
        run: python scripts/check-no-temporary-step4.py

      - name: Enforce architecture dependency boundaries
        run: python scripts/check-architecture.py

      - name: Prove forbidden dependency fixture is rejected
        run: |
          if python scripts/check-architecture.py --root tests/architecture/fixtures/forbidden-domain; then
            echo "Forbidden architecture fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Enforce typed D1 adapter boundary
        run: python scripts/check-d1-boundary.py

      - name: Enforce immutable R2 generation object boundary
        run: python scripts/check-r2-generation-objects.py

      - name: Prove missing R2 create-only condition is rejected
        run: python scripts/check-r2-generation-objects.py --self-test

      - name: Enforce coordinator-authoritative device generation commit boundary
        run: python scripts/check-device-generation-commit-boundary.py

      - name: Prove missing generation-commit authority reservation is rejected
        run: python scripts/check-device-generation-commit-boundary.py --self-test

      - name: Enforce governed Step 4 write surfaces
        run: python scripts/check-step4-governed-writes.py

      - name: Enforce Step 5 coordinator boundaries
        run: python scripts/check-step5-profile-coordinator.py

      - name: Prove assignment-derived coordinator authorization is rejected
        run: |
          if python scripts/check-step5-profile-coordinator.py --root tests/profile-coordinator/fixtures/assignment-authorizes; then
            echo "Assignment-derived coordinator authorization unexpectedly passed." >&2
            exit 1
          fi

      - name: Enforce Step 6 Windows Bridge boundaries
        run: python scripts/check-step6-windows-bridge.py

      - name: Prove browser runtime lock deletion fixture is rejected
        run: |
          if python scripts/check-step6-windows-bridge.py --root tests/windows-bridge/fixtures/deletes-browser-lock; then
            echo "Browser runtime lock deletion fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Prove raw D1 use-case fixture is rejected
        run: |
          if python scripts/check-d1-boundary.py --root tests/d1-boundary/fixtures/raw-use-case; then
            echo "Raw D1 use-case fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Lint and compare v1 contracts
        run: python scripts/check-contract-compatibility.py

      - name: Prove breaking contract fixture is rejected
        run: |
          if python scripts/check-contract-compatibility.py --current-root tests/contracts/fixtures/breaking; then
            echo "Breaking contract fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Protect accepted v1 contract baseline
        run: bash scripts/check-contract-baseline-immutable.sh

      - name: Enforce frontend sibling-feature boundaries
        run: python scripts/check-frontend-feature-boundaries.py

      - name: Prove sibling feature internals are rejected
        run: python scripts/check-frontend-feature-boundaries.py --self-test

      - name: Verify generated frontend contracts are current
        run: python scripts/generate-frontend-contracts.py --check

      - name: Verify architecture inventory and documentation consistency
        run: python scripts/generate-architecture-inventory.py --check

      - name: Prove architecture inventory drift is detected
        run: python scripts/generate-architecture-inventory.py --self-test

      - name: Verify canonical Cloudflare deployment configuration
        run: python scripts/cloudflare-deploy-config.py --check

      - name: Prove Cloudflare environment configuration fails closed
        run: python scripts/cloudflare-deploy-config.py --self-test

      - name: Test D1 schema and transaction invariants
        run: python scripts/test-d1-schema.py

      - name: Test identity owner-transfer and ACL invariants
        run: python scripts/test-step4-identity-acl.py

      - name: Test governed command trigger atomicity
        run: python scripts/test-step4-command-guards.py

      - name: Test mailbox metadata, lifecycle, replay and atomicity invariants
        run: python scripts/test-mailbox-vertical-slice.py

      - name: Test Phase 2F device identity, job and claimable D1 invariants
        run: python scripts/test-device-job-d1.py

      - name: Test Phase 2F atomic device-generation catalog commit invariants
        run: python scripts/test-device-generation-commit-d1.py

      - name: Test Phase 2F browser mailbox execution D1 invariants
        run: python scripts/test-browser-mail-execution-d1.py

      - name: Test coordinator projection and reconciliation invariants
        run: python scripts/test-step5-coordinator-projection.py

      - name: Test local Bridge SQLite and outbox invariants
        run: python scripts/test-step6-bridge-local.py

      - name: Prove assignment-as-ACL fixture is rejected
        run: |
          if python scripts/test-step4-identity-acl.py --negative-fixture tests/identity-acl/fixtures/assignment-authorizes.sql; then
            echo "Assignment-as-ACL fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Enforce Phase 2C client merge and assignment boundaries
        run: python scripts/check-phase2c-client-boundaries.py

      - name: Prove Phase 2C grant-transfer, resurrection and raw-mutation fixtures are rejected
        run: python scripts/check-phase2c-client-boundaries.py --self-test

      - name: Prove Phase 2C client merge and assignment D1 invariants
        run: python scripts/test-phase2c-client-merge-assignment.py

      - name: Enforce Phase 2D query and privacy boundaries
        run: python scripts/check-phase2d-query-boundaries.py

      - name: Prove Phase 2D negative query fixtures are rejected
        run: python scripts/check-phase2d-query-boundaries.py --self-test

      - name: Prove Phase 2D grant-safe projections and query plans
        run: python scripts/test-phase2d-query-projections.py

      - name: Test Phase 2D query application and synthetic Bridge adapter
        run: |
          cargo test --locked -p application-ports -p use-cases-query
          cargo test --locked -p profile-bridge fake_mail_query

      - name: Enforce Phase 2E cloud mailbox runtime and privacy boundaries
        run: python scripts/check-phase2e-mailbox-boundaries.py

      - name: Prove Phase 2E negative mailbox fixture is rejected
        run: python scripts/check-phase2e-mailbox-boundaries.py --self-test

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy native crates
        run: >-
          cargo clippy --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters -- -D warnings

      - name: Test native crates
        run: >-
          cargo test --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters

      - name: Test Cloudflare adapter logic
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo test --locked -p cloudflare-adapters --lib

      - name: Check extracted identity application crate for Workers target
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p use-cases-identity

      - name: Check pure crates for Workers target
        run: >-
          cargo check --locked --target wasm32-unknown-unknown
          -p profile-platform-primitives
          -p contracts
          -p control-plane-contract
          -p identity-access-domain
          -p client-domain
          -p profile-domain
          -p session-domain
          -p mailbox-domain
          -p bridge-domain
          -p application-ports
          -p use-cases
          -p use-cases-query

      - name: Validate delivery status
        run: |
          python -m json.tool docs/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          step = status["repository_step"]
          assert status["production_ready"] is False
          assert isinstance(step["number"], int) and step["number"] >= 0
          assert step["status"] in {"in_progress", "completed"}
          assert status["decisions"]["adr_0006"].startswith("proposed")
          PY

      - name: Scan tracked files for high-confidence secrets
        run: bash scripts/check-tracked-secrets.sh

  d1-catalog:
    name: D1 Catalog Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Node 24 LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce Node and npm versions
        run: |
          test "$(node --version)" = "v24.19.0"
          npm install --global npm@11.17.0
          test "$(npm --version)" = "11.17.0"

      - name: Apply migrations to isolated local D1
        run: >-
          npx --yes wrangler@4.94.0 d1 migrations apply CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state

      - name: Prove migration replay is a no-op
        run: >-
          npx --yes wrangler@4.94.0 d1 migrations apply CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state

      - name: Verify migrated D1 catalog shape
        run: >-
          npx --yes wrangler@4.94.0 d1 execute CATALOG_DB
          --local
          --config deploy/cloudflare/wrangler.d1-test.jsonc
          --persist-to .wrangler/d1-test-state
          --command "SELECT COUNT(*) AS tenants FROM tenants; SELECT COUNT(*) AS clients FROM clients; SELECT COUNT(*) AS profiles FROM browser_profiles; SELECT COUNT(*) AS invitation_acceptances FROM invitation_acceptances; SELECT COUNT(*) AS governed_owner_transfers FROM owner_transfer_commands; SELECT COUNT(*) AS governed_profile_grants FROM profile_grant_commands; SELECT COUNT(*) AS coordinator_projection_commands FROM profile_coordinator_projection_commands; SELECT COUNT(*) AS coordinator_projections FROM profile_coordinator_projections; SELECT COUNT(*) AS mailbox_bindings FROM mailbox_bindings; SELECT COUNT(*) AS mailbox_jobs FROM mailbox_jobs; SELECT COUNT(*) AS browser_mailbox_execution_bindings FROM browser_mailbox_execution_bindings; SELECT name FROM d1_migrations ORDER BY id;"

  cloudflare-worker:
    name: Cloudflare Worker Release Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check Worker for WASM
        env:
          RUSTFLAGS: -Dwarnings
        run: >-
          cargo check --locked -p browser-profile-control-plane-worker
          --target wasm32-unknown-unknown

      - name: Install pinned worker-build
        run: cargo install worker-build --version 0.8.5 --locked

      - name: Build release Worker artifact
        working-directory: apps/control-plane-worker
        run: worker-build --release

      - name: Verify Worker artifact
        run: |
          test -f apps/control-plane-worker/build/worker/shim.mjs
          find apps/control-plane-worker/build -type f -name '*.wasm' -print -quit | grep -q .

  rust-windows:
    name: Rust Windows And Profile Bridge Artifact
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Check and test native crates
        run: >-
          cargo test --locked --workspace --all-targets
          --exclude browser-profile-control-plane-worker
          --exclude cloudflare-adapters

      - name: Build release Profile Bridge executable
        run: cargo build --locked --release -p profile-bridge

      - name: Verify Windows Profile Bridge artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/profile-bridge.exe")) {
            throw "profile-bridge.exe was not produced"
          }
          $artifact = Get-Item "target/release/profile-bridge.exe"
          if ($artifact.Length -le 0) {
            throw "profile-bridge.exe is empty"
          }
          Write-Host "Verified Profile Bridge artifact: $($artifact.FullName) ($($artifact.Length) bytes)"
