name: N1 Exact-Head Retirement Audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: N1 Exact-Head Retirement Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch with full history
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Switch to exact N1 candidate tree
        env:
          N1_HEAD: 5ec729191d0fab7ea40f12e981d5b44d54e7500c
        run: |
          git checkout --detach "$N1_HEAD"
          test "$(git rev-parse HEAD)" = "$N1_HEAD"
          test ! -e architecture/runtime-topology-ar2.json

      - name: Prove current validators after retirement
        run: |
          python scripts/check-cloudflare-runtime-bindings.py
          python scripts/check-documentation-authority.py --root .
          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test
          git diff --check

      - name: Exhaustive old-caller and unique-invariant audit
        env:
          PRE_RETIREMENT_HEAD: e0b96f33687185034b855a5186e8e2daac13e810
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, os, subprocess
          from pathlib import Path

          root = Path('.')
          old_path = 'architecture/runtime-topology-ar2.json'
          old = json.loads(subprocess.check_output(
              ['git', 'show', f"{os.environ['PRE_RETIREMENT_HEAD']}:{old_path}"], text=True
          ))
          resources = old.get('resources')
          assert isinstance(resources, list) and len(resources) == 21, len(resources or [])
          decisions = {item['id']: item['decision'] for item in resources}
          expected = {
              'control_plane_worker':'KEEP','static_assets':'KEEP','mailbox_secret_resolver_worker':'KEEP',
              'catalog_d1':'KEEP','resolver_d1':'KEEP','profile_objects':'KEEP','profile_coordinator':'KEEP',
              'notification_hub':'KEEP','integration_events':'KEEP','mailbox_jobs':'KEEP','mailbox_jobs_dlq':'KEEP',
              'generation_verification':'DELETE','mailbox_secret_resolver_service':'KEEP','control_plane_schedule':'KEEP',
              'resolver_reconciliation_schedule':'KEEP','gmail_api':'KEEP','imap_read':'KEEP','smtp_send':'KEEP',
              'microsoft_graph_oauth_read_delta':'KEEP','microsoft_graph_mail_send':'DEFER','browser_bridge_mailbox_lane':'KEEP',
          }
          assert decisions == expected

          # Prove the former resource/workload rows are represented by current authorities.
          release = json.loads(Path('architecture/release-architecture-ar11.json').read_text(encoding='utf-8'))
          closures = release['deployment_closures']
          closure_resources = {
              r for c in closures for key in ('required_resources','optional_or_disabled_resources')
              for r in c.get(key, [])
          }
          required_cloudflare = {
              'control_plane_worker','catalog_d1','resolver_d1','profile_objects','profile_coordinator',
              'notification_hub','integration_events','mailbox_jobs','mailbox_jobs_dlq',
              'mailbox_secret_resolver_worker','mailbox_secret_resolver_service',
              'control_plane_schedule','resolver_reconciliation_schedule',
          }
          assert not (required_cloudflare - closure_resources), sorted(required_cloudflare - closure_resources)
          units = {u['activation_unit'] for u in release['activation_units']}
          for unit in ('profile_runtime','mailbox_browser_binding','mailbox_read','mailbox_jobs','outbound_mail'):
              assert unit in units, unit

          wrangler = Path('deploy/cloudflare/wrangler.jsonc').read_text(encoding='utf-8')
          assert '"binding": "ASSETS"' in wrangler
          provider = Path('crates/cloudflare-adapters/src/cloud_mailbox_provider.rs').read_text(encoding='utf-8')
          for marker in ('check_gmail_mailbox','check_imap_mailbox','check_microsoft_graph_mailbox'):
              assert marker in provider, marker
          outbound = Path('apps/control-plane-worker/src/composition/outbound_mail.rs').read_text(encoding='utf-8')
          for marker in (
              'CloudflareGmailOutboundMailProvider','CloudflareSmtpOutboundMailProvider',
              'MailboxProvider::BrowserFallback | MailboxProvider::MicrosoftGraph',
              'ClientMailOutboundProvider::Unsupported',
          ):
              assert marker in outbound, marker

          # The old documentation checker is explicitly retained as non-callable provenance.
          debt = json.loads(Path('architecture/historical-executable-debt.json').read_text(encoding='utf-8'))
          debt_items = [i for value in debt.values() if isinstance(value, list) for i in value if isinstance(i, dict)]
          legacy = [i for i in debt_items if i.get('path') == 'scripts/check-documentation-authority-legacy.py']
          assert len(legacy) == 1
          assert legacy[0].get('classification') == 'TRANSITION_PROVENANCE_ONLY'
          assert legacy[0].get('standalone_entrypoint') is False
          estate = json.loads(Path('architecture/python-estate-ar11.json').read_text(encoding='utf-8'))
          retained = estate['post_ar11_cleanup']['retained_transition_provenance']
          entry = next(i for i in retained if i.get('path') == 'scripts/check-documentation-authority-legacy.py')
          assert entry['current_callable_authority'] is False
          assert entry['current_importers_required'] == 0
          current_doc_checker = Path('scripts/check-documentation-authority.py').read_text(encoding='utf-8')
          assert 'check-documentation-authority-legacy.py' not in current_doc_checker

          terms = (
              old_path, 'runtime_topology_decision', 'RUNTIME_TOPOLOGY', '"topology_source"',
              '"runtime_resources"', '"resource_refs"', '"topology_decision_source"',
              '"runtime_topology_projection_owner"',
          )
          provenance = {
              'docs/ARCHITECTURE_REBASELINE_V3_AR2.md','docs/ARCHITECTURE_REBASELINE_V3_AR3.md',
              'docs/POST_AR11_FUNCTIONAL_CLOSURE_PLAN.md','docs/PRE_PF1_AUTHORITY_ESTATE_NORMALIZATION.md',
              'docs/PF1_CANONICAL_ARCHITECTURE_INVENTORY_CUTOVER.md',
              'scripts/check-documentation-authority-legacy.py',
              'architecture/historical-executable-debt.json','architecture/python-estate-ar11.json',
              'architecture/python-estate-ar6.json',
          }
          tracked = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          current_matches = []
          provenance_matches = []
          for raw in tracked:
              if not raw: continue
              rel = raw.decode()
              path = Path(rel)
              if not path.is_file(): continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              for n,line in enumerate(text.splitlines(),1):
                  for term in terms:
                      if term not in line: continue
                      row = (rel,n,term,line.strip())
                      if rel.startswith('history/') or rel in provenance:
                          provenance_matches.append(row)
                      else:
                          current_matches.append(row)
          for row in provenance_matches:
              print('N1_PROVENANCE', row)
          for row in current_matches:
              print('N1_CURRENT_MATCH', row)
          assert not current_matches, f'current old-authority matches remain: {current_matches}'

          legacy_refs = []
          allowed_legacy_ref_paths = {
              'scripts/check-documentation-authority-legacy.py',
              'architecture/historical-executable-debt.json',
              'architecture/python-estate-ar11.json',
              'architecture/python-estate-ar6.json',
          }
          for raw in tracked:
              if not raw: continue
              rel = raw.decode(); path = Path(rel)
              if not path.is_file(): continue
              try: text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if 'check-documentation-authority-legacy.py' in text and rel not in allowed_legacy_ref_paths:
                  legacy_refs.append(rel)
          assert not legacy_refs, legacy_refs

          print(f'N1_OLD_RESOURCE_DECISION_COUNT {len(resources)}')
          print(f'N1_PROVENANCE_MATCH_COUNT {len(provenance_matches)}')
          print('N1_LEGACY_CHECKER_EXECUTABLE_CALLER_COUNT 0')
          print('N1_OLD_CALLER_COUNT 0')
          print('N1_OLD_UNIQUE_CURRENT_INVARIANT_COUNT 0')
          print('N1_EXACT_HEAD_RETIREMENT_AUDIT PASS')
          PY
