name: Quality Gate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: n1-scratch-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  n1-materialize:
    name: N1 Scratch Materialization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact scratch source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact scratch source
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Materialize and audit N1 candidate
        run: |
          set +e
          python scripts/check-no-temporary-step4.py
          status=$?
          set -e
          test "$status" -eq 97
          test ! -e architecture/runtime-topology-ar2.json
          python -m py_compile \
            scripts/_ar3_application_architecture.py \
            scripts/generate-architecture-inventory-engine.py \
            scripts/check-documentation-authority-legacy.py
          python -m json.tool architecture/inventory.json >/dev/null
          python -m json.tool architecture/architecture-rebaseline-v3-transition.json >/dev/null
          python -m json.tool docs/status.json >/dev/null
          git diff --check

      - name: Upload deterministic N1 candidate blobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: n1-final-candidate-blobs
          path: |
            scripts/_ar3_application_architecture.py
            scripts/generate-architecture-inventory-engine.py
            scripts/check-documentation-authority-legacy.py
            architecture/inventory.json
            architecture/architecture-rebaseline-v3-transition.json
            architecture/README.md
            docs/status.json
          if-no-files-found: error
          retention-days: 1
