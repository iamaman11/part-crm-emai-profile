name: Temporary Step 5 Final Format

on:
  push:
    branches:
      - repository-step-5-profile-coordinator

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-5-profile-coordinator

      - name: Apply pinned rustfmt
        run: |
          cargo fmt --all
          rm .github/workflows/step5-final-format.yml

      - name: Commit formatting and workflow removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/control-plane-worker/src/profile_coordinator.rs crates/cloudflare-adapters/src/d1_profile_coordinator.rs crates/session-domain/src/coordinator.rs .github/workflows/step5-final-format.yml
          git commit -m "Step 5: apply pinned rustfmt"
          git push origin HEAD:repository-step-5-profile-coordinator
