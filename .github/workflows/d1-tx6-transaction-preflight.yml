name: D1 TX-6 Transaction Preflight

# TX-6/#624 transitional credential-free adapter. Provider facts come only from
# the canonical TX-6 observer. Retire this workflow after rehearsal acceptance.
on:
  pull_request:
    paths:
      - '.github/workflows/d1-tx6-transaction-preflight.yml'
      - 'scripts/d1-prepare.py'
      - 'tools/opsctl/src/d1/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/d1-tx6-transaction-preflight.yml'
      - 'scripts/d1-prepare.py'
      - 'tools/opsctl/src/d1/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: d1-tx6-transaction-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TX6_DATABASE_NAME: part-crm-d3a-bootstrap-proof
  TX6_DATABASE_ID: 713dd6f2-646b-46ad-93eb-103d2d0b63c4
  TX6_COMPONENT: catalog
  TX6_OBSERVER_WORKFLOW_ID: '351749887'
  TX6_KNOWN_GOOD_RELEASE_SET_ID: release-set-v3-sha256-e01338de30cdc4c334e210f9e2bd75a67837420dd370b83964caae452f77522c
  TX6_KNOWN_GOOD_SOURCE_SHA: 852dd515121011130dbd3d7726b72483ecc85aaf
  TX6_KNOWN_GOOD_MANIFEST_SHA256: cd57a6851a348c7044a628deae5a5804e0f7447cd0583c96bc61ad8f8812e10e

jobs:
  contract:
    name: TX-6 transaction preflight contract
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Prove preflight has no provider credential or mutation surface
        run: |
          set -euo pipefail
          python scripts/d1-prepare.py self-test
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/d1-tx6-transaction-preflight.yml').read_text(encoding='utf-8')
          forbidden = (
              'secrets.' + 'CLOUDFLARE_',
              'CLOUDFLARE_' + 'API_TOKEN',
              'd1 migrations' + ' apply',
              'd1 time-travel' + ' restore',
              'd1 ' + 'create',
              'd1 ' + 'delete',
              'd1-migration-executor.yml' + '/dispatches',
          )
          for value in forbidden:
              assert value not in source, f'TX-6 preflight contains forbidden effect/credential surface: {value}'
          assert 'canonical TX-6 observer' in source
          assert 'Retire this workflow after rehearsal acceptance' in source
          PY

  preflight:
    name: TX-6 hosted credential-free prepare preflight
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout exact accepted-main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Build credential-free typed D1 owners
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path tools/opsctl/Cargo.toml
          python scripts/d1-prepare.py self-test

      - name: Resolve same-source canonical observer evidence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tx6-preflight"
          mkdir -p "$root/observer" artifacts/d1-tx6-transaction-preflight
          observer_run=''
          for _ in $(seq 1 48); do
            observer_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TX6_OBSERVER_WORKFLOW_ID/runs?head_sha=$SOURCE_SHA&event=push&per_page=20" --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id' | head -n1)"
            if [ -n "$observer_run" ]; then break; fi
            sleep 15
          done
          test -n "$observer_run"
          artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$observer_run/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("d1-tx6-isolated-target-observation-"))) | .name' | head -n1)"
          test -n "$artifact_name"
          gh run download "$observer_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$root/observer"
          test -f "$root/observer/observation.json"
          python - "$root/observer/observation.json" "$SOURCE_SHA" "$TX6_DATABASE_NAME" "$TX6_DATABASE_ID" <<'PY'
          import json, sys, time
          path, source, name, dbid = sys.argv[1:]
          doc = json.load(open(path, encoding='utf-8'))
          obs = doc.get('provider_observation_input') or {}
          target = obs.get('target') or {}
          if doc.get('source_sha') != source or doc.get('kind') != 'D1_TX6_EXACT_CANDIDATE_OBSERVATION':
              raise SystemExit('observer evidence is not bound to exact accepted-main source')
          if target.get('database_name') != name or target.get('database_id') != dbid or target.get('environment') != 'staging':
              raise SystemExit('observer target identity drifted')
          if doc.get('provider_mutation') or doc.get('d1_mutation') or doc.get('production_mutation'):
              raise SystemExit('observer evidence claims mutation')
          observed = obs.get('observed_at_unix_seconds')
          if not isinstance(observed, int) or observed > int(time.time()) + 60 or int(time.time()) - observed > 1800:
              raise SystemExit('observer evidence is stale for TX-6 prepare preflight')
          remote = obs.get('remote_migrations')
          pending = obs.get('wrangler_pending_migrations')
          if not isinstance(remote, list) or not all(isinstance(x, str) for x in remote):
              raise SystemExit('observer remote migration ledger is invalid')
          if not isinstance(pending, list) or not all(isinstance(x, str) for x in pending):
              raise SystemExit('observer Wrangler pending list is invalid')
          PY
          printf '%s\n' "$observer_run" > "$root/observer-run-id.txt"

      - name: Resolve exact source-bound target and accepted known-good manifests
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tx6-preflight"
          mkdir -p "$root/target" "$root/known-good"
          target_release=''
          for _ in $(seq 1 48); do
            target_release="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.target_commitish == \"$SOURCE_SHA\" and (.tag_name | startswith(\"release-set-v3-sha256-\")) and .draft == false) | .tag_name" | head -n1)"
            if [ -n "$target_release" ]; then break; fi
            sleep 15
          done
          test -n "$target_release"
          gh release download "$target_release" --repo "$GITHUB_REPOSITORY" --pattern release-set.json --pattern control-plane.tar --dir "$root/target"
          gh release download "$TX6_KNOWN_GOOD_RELEASE_SET_ID" --repo "$GITHUB_REPOSITORY" --pattern release-set.json --pattern control-plane.tar --dir "$root/known-good"
          python - "$root" "$target_release" "$SOURCE_SHA" "$TX6_KNOWN_GOOD_RELEASE_SET_ID" "$TX6_KNOWN_GOOD_SOURCE_SHA" "$TX6_KNOWN_GOOD_MANIFEST_SHA256" <<'PY'
          import hashlib, json, sys, tarfile
          from pathlib import Path
          root, target_id, source_sha, known_id, known_source, known_manifest_sha = sys.argv[1:]
          root = Path(root)
          def extract(folder, expected_id, expected_source, output):
              rs = json.load(open(folder / 'release-set.json', encoding='utf-8'))
              if rs.get('schema_version') != 3 or rs.get('release_set_id') != expected_id:
                  raise SystemExit(f'Release Set identity mismatch for {folder}')
              source = rs.get('source') or {}
              if source.get('repository') != 'iamaman11/part-crm-emai-profile' or source.get('commit_sha') != expected_source or source.get('accepted_main') is not True:
                  raise SystemExit(f'Release Set source mismatch for {folder}')
              component = (rs.get('components') or {}).get('control_plane') or {}
              if component.get('source_commit_sha') != expected_source:
                  raise SystemExit(f'control_plane source mismatch for {folder}')
              archive = folder / 'control-plane.tar'
              if hashlib.sha256(archive.read_bytes()).hexdigest() != component.get('artifact_sha256'):
                  raise SystemExit(f'control_plane artifact digest mismatch for {folder}')
              with tarfile.open(archive, 'r:*') as tar:
                  members = [m for m in tar.getmembers() if m.isfile() and Path(m.name).name == 'release-manifest.json']
                  if len(members) != 1:
                      raise SystemExit(f'control_plane manifest missing/ambiguous for {folder}')
                  raw = tar.extractfile(members[0]).read()
              if hashlib.sha256(raw).hexdigest() != component.get('component_manifest_sha256'):
                  raise SystemExit(f'control_plane manifest digest mismatch for {folder}')
              Path(output).write_bytes(raw)
          extract(root / 'target', target_id, source_sha, root / 'target-manifest.json')
          extract(root / 'known-good', known_id, known_source, root / 'known-good-manifest.json')
          if hashlib.sha256((root / 'known-good-manifest.json').read_bytes()).hexdigest() != known_manifest_sha:
              raise SystemExit('known-good exact manifest digest drifted')
          target = json.load(open(root / 'target-manifest.json', encoding='utf-8'))['schema_contract']
          known = json.load(open(root / 'known-good-manifest.json', encoding='utf-8'))['schema_contract']
          if target.get('database_component') != 'catalog' or target.get('target_schema_revision') != '0031_device_binding_governance.sql':
              raise SystemExit('target release is not exact ordinary Catalog 0031')
          if known.get('database_component') != 'catalog' or known.get('target_schema_revision') != '0026_outbound_mail_intents.sql':
              raise SystemExit('known-good release is not exact historical Catalog 0026')
          PY
          printf '%s\n' "$target_release" > "$root/target-release-set-id.txt"

      - name: Run canonical credential-free prepare
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/tx6-preflight"
          evidence="artifacts/d1-tx6-transaction-preflight"
          python - "$root/observer/observation.json" "$root/ledger.json" <<'PY'
          import json, sys
          obs = json.load(open(sys.argv[1], encoding='utf-8'))['provider_observation_input']
          names = obs['remote_migrations']
          payload = [{'results': [{'id': i + 1, 'name': name} for i, name in enumerate(names)], 'success': True}]
          json.dump(payload, open(sys.argv[2], 'w', encoding='utf-8'), sort_keys=True, indent=2)
          open(sys.argv[2], 'a', encoding='utf-8').write('\n')
          PY
          printf '{"component":"catalog","completed":[]}\n' > "$root/preconditions.json"
          set +e
          python scripts/d1-prepare.py prepare \
            --opsctl target/debug/opsctl \
            --root . \
            --component catalog \
            --ledger-json "$root/ledger.json" \
            --release-manifest "$root/target-manifest.json" \
            --current-manifest "$root/known-good-manifest.json" \
            --known-good-manifest "$root/known-good-manifest.json" \
            --preconditions-json "$root/preconditions.json" \
            --output "$evidence/prepare.json"
          rc=$?
          set -e
          test "$rc" = 0 -o "$rc" = 3
          jq -e '.status == "PREPARE_READY" or .status == "PREPARE_BLOCKED"' "$evidence/prepare.json" >/dev/null
          cp "$root/observer/observation.json" "$evidence/provider-observation.json"
          cp "$root/observer-run-id.txt" "$evidence/observer-run-id.txt"
          cp "$root/target-release-set-id.txt" "$evidence/target-release-set-id.txt"
          python - "$evidence/prepare.json" "$evidence/provider-observation.json" "$evidence/summary.json" <<'PY'
          import json, os, sys
          prepare = json.load(open(sys.argv[1], encoding='utf-8'))
          observation = json.load(open(sys.argv[2], encoding='utf-8'))
          value = {
              'schema_version': 1,
              'kind': 'D1_TX6_TRANSACTION_PREFLIGHT',
              'source_sha': os.environ['SOURCE_SHA'],
              'target_database_name': os.environ['TX6_DATABASE_NAME'],
              'target_database_id': os.environ['TX6_DATABASE_ID'],
              'status': prepare.get('status'),
              'raw_wrangler_pending_migrations': (observation.get('provider_observation_input') or {}).get('wrangler_pending_migrations'),
              'provider_mutation': False,
              'd1_mutation': False,
              'production_mutation': False,
          }
          if prepare.get('status') == 'PREPARE_READY':
              value['planned_migrations'] = (prepare.get('plan') or {}).get('planned_migrations', [])
          else:
              value['gate_results'] = prepare.get('gate_results', [])
          json.dump(value, open(sys.argv[3], 'w', encoding='utf-8'), sort_keys=True, indent=2)
          open(sys.argv[3], 'a', encoding='utf-8').write('\n')
          PY

      - name: Publish secret-free TX-6 transaction preflight
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: d1-tx6-transaction-preflight-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: artifacts/d1-tx6-transaction-preflight
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary preflight inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/tx6-preflight"
