name: Phase 2E Rustfmt Materializer

on:
  push:
    branches:
      - phase2e-mailbox-cloud-lane
    paths:
      - .github/workflows/phase2e-rustfmt-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2e-mailbox-cloud-lane

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Commit formatted IMAP patch and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-rustfmt-materializer.yml
          git add crates/cloudflare-adapters/src/imap_session.rs crates/cloudflare-adapters/src/imap_query.rs
          git diff --cached --check
          git commit -m "Phase 2E: format Unicode IMAP literal support"
          git push origin HEAD:phase2e-mailbox-cloud-lane
