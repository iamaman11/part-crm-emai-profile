name: AR8 Opsctl Rustfmt Remediator Temporary

on:
  pull_request:

permissions:
  contents: write

jobs:
  format-and-retire:
    if: github.repository == 'iamaman11/part-crm-emai-profile' && github.event.pull_request.head.ref == 'agent/ar8-completion' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact completion head
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Apply deterministic rustfmt and retire workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          cargo fmt --manifest-path tools/opsctl/Cargo.toml
          cargo fmt --manifest-path tools/opsctl/Cargo.toml -- --check
          rm .github/workflows/ar8-opsctl-rustfmt-remediator.yml
          git diff --check
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/opsctl/src/lib.rs .github/workflows/ar8-opsctl-rustfmt-remediator.yml
          git diff --cached --check
          git commit -m "Format AR-8 opsctl authority surface"
          git push origin HEAD:agent/ar8-completion
