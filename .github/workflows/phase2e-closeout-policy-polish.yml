name: Phase 2E Closeout Policy Polish

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase2e-closeout-policy-polish.yml

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'docs-phase2e-closeout'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: docs-phase2e-closeout

      - name: Advance accepted-phase semantic policy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate-architecture-inventory.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '        "Phase 2E — Mailbox domain decomposition and real cloud mailbox lane — NEXT",\n':
                  '        "Phase 2E — Mailbox domain decomposition and real cloud mailbox lane — ACCEPTED",\n',
              '        "Phase 2E issue #148 is the unique NEXT",\n':
                  '        "Phase 2F — Durable device jobs, browser mailbox lane and materialization integration — NEXT",\n',
              '        "| A3 | Domain aggregate splitting | **Client half accepted in Phase 2A**",\n':
                  '        "| A3 | Domain aggregate splitting | **Accepted** — Phase 2A decomposed `client-domain`; Phase 2E decomposed `mailbox-domain`",\n',
              '        "crates/use-cases-query",\n':
                  '        "crates/use-cases-query",\n        "crates/use-cases-mailboxes",\n',
              '    stale_plan_markers = (\n':
                  '    stale_plan_markers = (\n        "Phase 2E — Mailbox domain decomposition and real cloud mailbox lane — NEXT",\n        "Phase 2E issue #148 is the unique NEXT",\n',
              '    stale_matrix_markers = (\n':
                  '    stale_matrix_markers = (\n        "| A3 | Domain aggregate splitting | **Client half accepted in Phase 2A**",\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one policy marker, found {count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          python scripts/generate-architecture-inventory.py --check
          python scripts/generate-architecture-inventory.py --self-test

      - name: Commit policy closeout and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase2e-closeout-policy-polish.yml
          git add scripts/generate-architecture-inventory.py
          git diff --cached --check
          git commit -m "Docs: advance Phase 2 architecture consistency markers"
          git push origin HEAD:docs-phase2e-closeout
