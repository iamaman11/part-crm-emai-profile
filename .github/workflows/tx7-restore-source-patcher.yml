name: TX-7 Restore Source Patcher

on:
  push:
    branches:
      - tx7-issue-triggered-restore

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'iamaman11' && github.ref == 'refs/heads/tx7-issue-triggered-restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: tx7-issue-triggered-restore
          fetch-depth: 0

      - name: Apply bounded two-file restore transport patch
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def gh(expr: str) -> str:
              return '$' + '{{ ' + expr + ' }}'

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          executor_path = Path('.github/workflows/d1-migration-executor.yml')
          executor = executor_path.read_text(encoding='utf-8')
          if 'authorize_restore:' in executor or 'time_travel_restore' in executor:
              raise SystemExit('executor already contains restore mode; refusing non-idempotent patch')

          executor = replace_once(
              executor,
              "run-name: D1 authorization=${{ inputs.authorization_digest || inputs.expected_release_set_id || 'none' }}",
              "run-name: D1 authorization=${{ inputs.authorization_digest || inputs.expected_release_set_id || inputs.restore_authorization_comment_id || 'none' }}",
              'executor run-name',
          )
          executor = replace_once(
              executor,
              "      source_sha:\n        description: Exact accepted-main source SHA\n        required: true\n        type: string\n      component:\n",
              "      source_sha:\n        description: Exact accepted-main source SHA\n        required: true\n        type: string\n      operation_mode:\n        description: Protected D1 effect mode\n        required: false\n        default: migration\n        type: choice\n        options:\n          - migration\n          - time_travel_restore\n      restore_authorization_comment_id:\n        description: Exact owner authorization comment id for one-shot Time Travel restore mode\n        required: false\n        default: ''\n        type: string\n      component:\n",
              'executor operation inputs',
          )
          executor = replace_once(
              executor,
              "  authorize:\n    name: Validate D1 mutation inputs before protected Environment\n",
              "  authorize:\n    if: inputs.operation_mode == 'migration'\n    name: Validate D1 mutation inputs before protected Environment\n",
              'migration authorize mode guard',
          )
          executor = replace_once(
              executor,
              "  migrate:\n    needs: authorize\n",
              "  migrate:\n    if: inputs.operation_mode == 'migration'\n    needs: authorize\n",
              'migration job mode guard',
          )

          restore_jobs = f'''\n\n  authorize_restore:\n    if: inputs.operation_mode == 'time_travel_restore'\n    name: Validate one-shot D1 Time Travel restore authorization\n    runs-on: ubuntu-24.04\n    timeout-minutes: 5\n    env:\n      SOURCE_SHA: {gh('inputs.source_sha')}\n      TARGET_ENVIRONMENT: {gh('inputs.environment')}\n      AUTHORIZATION_COMMENT_ID: {gh('inputs.restore_authorization_comment_id')}\n      MUTATION_AUTHORIZED: {gh('inputs.mutation_authorized')}\n      CONFIRMATION: {gh('inputs.confirmation')}\n    steps:\n      - name: Fail closed before any restore Environment binding\n        run: |\n          set -euo pipefail\n          test "$GITHUB_EVENT_NAME" = workflow_dispatch\n          test "$GITHUB_REF" = refs/heads/main\n          test "$GITHUB_SHA" = "$SOURCE_SHA"\n          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"\n          test "$TARGET_ENVIRONMENT" = staging\n          test "$MUTATION_AUTHORIZED" = true\n          test "$GITHUB_RUN_ATTEMPT" = 1\n          [[ "$AUTHORIZATION_COMMENT_ID" =~ ^[1-9][0-9]*$ ]]\n          test "$CONFIRMATION" = "$SOURCE_SHA:staging:time_travel_restore:$AUTHORIZATION_COMMENT_ID"\n\n      - name: Bind restore authorization to immutable OWNER comment and exact accepted source\n        id: restore_auth\n        env:\n          GH_TOKEN: {gh('github.token')}\n        run: |\n          set -euo pipefail\n          root="$RUNNER_TEMP/d1-time-travel-restore-auth"\n          rm -rf "$root"\n          mkdir -p "$root"\n          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$AUTHORIZATION_COMMENT_ID" > "$root/comment.json"\n          gh api "repos/$GITHUB_REPOSITORY/issues/266" > "$root/tracker.json"\n          gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" > "$root/commit.json"\n          python - "$root" "$GITHUB_OUTPUT" <<'PY_AUTH'\n          import hashlib\n          import json\n          import os\n          import re\n          import sys\n          from pathlib import Path\n\n          root = Path(sys.argv[1])\n          output = Path(sys.argv[2])\n          comment = json.loads((root / 'comment.json').read_text(encoding='utf-8'))\n          tracker = json.loads((root / 'tracker.json').read_text(encoding='utf-8'))\n          commit = json.loads((root / 'commit.json').read_text(encoding='utf-8'))\n          owner = os.environ['GITHUB_REPOSITORY_OWNER']\n          repository = os.environ['GITHUB_REPOSITORY']\n          source = os.environ['SOURCE_SHA']\n\n          body = tracker.get('body')\n          if not isinstance(body, str):\n              raise SystemExit('live stage pointer #266 body missing')\n          current = re.findall(r'^CURRENT_STAGE_ISSUE = #([1-9][0-9]*)$', body, flags=re.MULTILINE)\n          if len(current) != 1:\n              raise SystemExit('CURRENT_STAGE_ISSUE missing or ambiguous')\n          expected_issue_url = f'https://api.github.com/repos/{{repository}}/issues/{{current[0]}}'\n          if comment.get('issue_url') != expected_issue_url:\n              raise SystemExit('restore authorization is not on the CURRENT stage issue')\n          if (comment.get('user') or {{}}).get('login') != owner or comment.get('author_association') != 'OWNER':\n              raise SystemExit('restore authorization must be recorded by repository OWNER')\n          created_at = comment.get('created_at')\n          if not isinstance(created_at, str) or comment.get('updated_at') != created_at:\n              raise SystemExit('restore authorization comment must be immutable after creation')\n          raw_body = comment.get('body')\n          if not isinstance(raw_body, str):\n              raise SystemExit('restore authorization comment body must be text')\n          lines = raw_body.strip().splitlines()\n          if len(lines) != 2 or lines[0] != 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_V1':\n              raise SystemExit('restore authorization must use exact two-line V1 envelope')\n          raw = lines[1]\n\n          def strict_object(pairs):\n              value = {{}}\n              for key, item in pairs:\n                  if key in value:\n                      raise ValueError(f'duplicate JSON key: {{key}}')\n                  value[key] = item\n              return value\n\n          try:\n              value = json.loads(raw, object_pairs_hook=strict_object)\n          except (json.JSONDecodeError, ValueError) as exc:\n              raise SystemExit(f'invalid strict authorization JSON: {{exc}}')\n          canonical = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False)\n          if raw != canonical:\n              raise SystemExit('restore authorization JSON is not exact canonical compact sorted JSON')\n          expected_keys = {{\n              'schema_version', 'source_sha', 'source_tree_sha', 'target',\n              'restore_timestamp_unix_seconds', 'restore_bookmark',\n              'expected_pre_restore_ledger', 'expected_post_restore_ledger',\n              'authorized_provider_effects', 'forbidden_provider_effects', 'observation',\n          }}\n          if set(value) != expected_keys or value.get('schema_version') != 1:\n              raise SystemExit('restore authorization fields/schema mismatch')\n          if value.get('source_sha') != source:\n              raise SystemExit('restore authorization source_sha mismatch')\n          tree = ((commit.get('tree') or {{}}).get('sha'))\n          if value.get('source_tree_sha') != tree:\n              raise SystemExit('restore authorization source_tree_sha mismatch')\n          target = value.get('target')\n          if not isinstance(target, dict) or set(target) != {{'environment','component','account_id','database_name','database_id'}}:\n              raise SystemExit('restore target contract mismatch')\n          if target.get('environment') != 'staging' or target.get('component') != 'catalog':\n              raise SystemExit('restore target must be staging catalog')\n          for key in ('account_id','database_name','database_id'):\n              if not isinstance(target.get(key), str) or not target[key]:\n                  raise SystemExit(f'restore target {{key}} missing')\n          timestamp = value.get('restore_timestamp_unix_seconds')\n          bookmark = value.get('restore_bookmark')\n          if not isinstance(timestamp, int) or timestamp <= 0:\n              raise SystemExit('restore timestamp must be positive integer')\n          if not isinstance(bookmark, str) or re.fullmatch(r'[0-9a-f]{{8}}-[0-9a-f]{{8}}-[0-9a-f]{{8}}-[0-9a-f]{{32}}', bookmark) is None:\n              raise SystemExit('restore bookmark format invalid')\n          pre = value.get('expected_pre_restore_ledger')\n          post = value.get('expected_post_restore_ledger')\n          for label, ledger in (('pre', pre), ('post', post)):\n              if not isinstance(ledger, list) or not ledger or len(ledger) != len(set(ledger)) or not all(isinstance(x, str) and re.fullmatch(r'[0-9]{{4}}_[a-z0-9_]+\\.sql', x) for x in ledger):\n                  raise SystemExit(f'{{label}} restore ledger invalid')\n          if len(post) >= len(pre) or pre[:len(post)] != post:\n              raise SystemExit('post-restore ledger must be a strict prefix of pre-restore ledger')\n          if value.get('authorized_provider_effects') != ['D1_TIME_TRAVEL_RESTORE_ONLY']:\n              raise SystemExit('restore authorization effect scope mismatch')\n          if value.get('forbidden_provider_effects') != ['D1_CREATE','D1_DELETE','D1_MIGRATION_APPLY','D1_TIME_TRAVEL_SECOND_RESTORE','PRODUCTION_MUTATION']:\n              raise SystemExit('restore forbidden-effect contract mismatch')\n          observation = value.get('observation')\n          if not isinstance(observation, dict) or set(observation) != {{'run_id','artifact_id','artifact_digest','lookup_json_sha256'}}:\n              raise SystemExit('restore observation contract mismatch')\n          if not isinstance(observation.get('run_id'), int) or not isinstance(observation.get('artifact_id'), int):\n              raise SystemExit('restore observation ids invalid')\n          if not isinstance(observation.get('artifact_digest'), str) or re.fullmatch(r'sha256:[0-9a-f]{{64}}', observation['artifact_digest']) is None:\n              raise SystemExit('restore observation artifact digest invalid')\n          if not isinstance(observation.get('lookup_json_sha256'), str) or re.fullmatch(r'[0-9a-f]{{64}}', observation['lookup_json_sha256']) is None:\n              raise SystemExit('restore observation JSON digest invalid')\n\n          digest = hashlib.sha256(raw.encode('utf-8')).hexdigest()\n          validated = {{\n              'schema_version': 1,\n              'kind': 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_VALIDATED',\n              'authorization_comment_id': int(os.environ['AUTHORIZATION_COMMENT_ID']),\n              'authorization_digest': digest,\n              'authorization_comment_url': comment.get('html_url'),\n              'intent': value,\n              'provider_mutation_executed': False,\n          }}\n          (root / 'validated-authorization.json').write_text(json.dumps(validated, sort_keys=True, indent=2) + '\\n', encoding='utf-8')\n          with output.open('a', encoding='utf-8') as fh:\n              fh.write(f'authorization_digest={{digest}}\\n')\n          PY_AUTH\n\n      - name: Prove restore authorization has not been consumed\n        env:\n          GH_TOKEN: {gh('github.token')}\n          AUTHORIZATION_DIGEST: {gh('steps.restore_auth.outputs.authorization_digest')}\n        run: |\n          set -euo pipefail\n          expected_title="D1 authorization=$AUTHORIZATION_COMMENT_ID"\n          prior="$RUNNER_TEMP/prior-restore-runs.json"\n          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/runs?event=workflow_dispatch&per_page=100" |\n            jq -s --arg title "$expected_title" --argjson current "$GITHUB_RUN_NUMBER" '[.[].workflow_runs[] | select(.display_title == $title and .run_number < $current) | .id] | unique' > "$prior"\n          while IFS= read -r run_id; do\n            jobs="$RUNNER_TEMP/prior-restore-jobs-$run_id.json"\n            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" | jq -s '[.[].jobs[]?]' > "$jobs"\n            hits="$(jq '[.[] | .steps[]? | select(.name == "Consume Time Travel restore authorization" and .conclusion == "success")] | length' "$jobs")"\n            test "$hits" -eq 0 || {{ echo 'restore authorization already consumed' >&2; exit 1; }}\n          done < <(jq -r '.[]' "$prior")\n\n      - name: Persist validated restore authorization evidence\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n        with:\n          name: d1-time-travel-restore-authorization-{gh('inputs.restore_authorization_comment_id')}-{gh('github.run_id')}-{gh('github.run_attempt')}\n          path: ${{{{ runner.temp }}}}/d1-time-travel-restore-auth/validated-authorization.json\n          if-no-files-found: error\n          retention-days: 30\n\n  restore:\n    if: inputs.operation_mode == 'time_travel_restore'\n    needs: authorize_restore\n    name: staging / exact D1 Time Travel restore\n    runs-on: ubuntu-24.04\n    timeout-minutes: 15\n    environment: staging\n    env:\n      SOURCE_SHA: {gh('inputs.source_sha')}\n      AUTHORIZATION_COMMENT_ID: {gh('inputs.restore_authorization_comment_id')}\n    steps:\n      - name: Checkout exact accepted-main source\n        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a\n        with:\n          ref: {gh('inputs.source_sha')}\n          persist-credentials: false\n          fetch-depth: 1\n\n      - name: Download validated restore authorization\n        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16\n        with:\n          name: d1-time-travel-restore-authorization-{gh('inputs.restore_authorization_comment_id')}-{gh('github.run_id')}-{gh('github.run_attempt')}\n          path: artifacts/d1-time-travel-restore\n\n      - name: Load exact restore envelope and verify accepted source\n        run: |\n          set -euo pipefail\n          auth=artifacts/d1-time-travel-restore/validated-authorization.json\n          test -f "$auth"\n          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"\n          tree_sha="$(git rev-parse 'HEAD^{{tree}}')"\n          test "$(jq -r '.intent.source_tree_sha' "$auth")" = "$tree_sha"\n          jq '.intent.expected_pre_restore_ledger' "$auth" > artifacts/d1-time-travel-restore/expected-pre-ledger.json\n          jq '.intent.expected_post_restore_ledger' "$auth" > artifacts/d1-time-travel-restore/expected-post-ledger.json\n          {{\n            echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r '.intent.target.account_id' "$auth")"\n            echo "DATABASE_NAME=$(jq -r '.intent.target.database_name' "$auth")"\n            echo "DATABASE_ID=$(jq -r '.intent.target.database_id' "$auth")"\n            echo "COMPONENT=$(jq -r '.intent.target.component' "$auth")"\n            echo "RESTORE_TIMESTAMP=$(jq -r '.intent.restore_timestamp_unix_seconds' "$auth")"\n            echo "RESTORE_BOOKMARK=$(jq -r '.intent.restore_bookmark' "$auth")"\n            echo "AUTHORIZATION_DIGEST=$(jq -r '.authorization_digest' "$auth")"\n          }} >> "$GITHUB_ENV"\n\n      - name: Set up pinned Node and materialize exact target config\n        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e\n        with:\n          node-version: '24.19.0'\n          package-manager-cache: false\n\n      - name: Materialize exact isolated target provider config\n        run: |\n          set -euo pipefail\n          npm install --global npm@11.17.0\n          test "$(node --version)" = v24.19.0\n          test "$(npm --version)" = 11.17.0\n          test "$(npx --yes wrangler@4.94.0 --version)" = 4.94.0\n          jq -n --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" --arg id "$DATABASE_ID" '{name:"d1-time-travel-restore",compatibility_date:"2026-08-15",account_id:$account,d1_databases:[{binding:"D1_REHEARSAL_DB",database_name:$name,database_id:$id}]}' > artifacts/d1-time-travel-restore/wrangler.json\n\n      - name: Fresh pre-write provider identity, ledger, diagnostics and bookmark proof\n        env:\n          CLOUDFLARE_API_TOKEN: {gh('secrets.CLOUDFLARE_OBSERVE_API_TOKEN')}\n        run: |\n          set -euo pipefail\n          test -n "$CLOUDFLARE_API_TOKEN"\n          cfg=artifacts/d1-time-travel-restore/wrangler.json\n          npx --yes wrangler@4.94.0 d1 info "$DATABASE_NAME" --config "$cfg" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/provider-identity.json\n          python - <<'PY_ID'\n          import json, os\n          from pathlib import Path\n          value=json.loads(Path('artifacts/d1-time-travel-restore/provider-identity.json').read_text())\n          expected={{os.environ['DATABASE_NAME'],os.environ['DATABASE_ID']}}\n          def paired(item):\n              if isinstance(item,dict):\n                  strings={{v for v in item.values() if isinstance(v,str)}}\n                  return expected.issubset(strings) or any(paired(v) for v in item.values())\n              if isinstance(item,list): return any(paired(v) for v in item)\n              return False\n          if not paired(value): raise SystemExit('fresh provider identity mismatch')\n          PY_ID\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "SELECT id, name FROM d1_migrations ORDER BY id" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/ledger-before.json\n          python scripts/d1-executor-plan.py normalize-ledger --ledger artifacts/d1-time-travel-restore/ledger-before.json --output artifacts/d1-time-travel-restore/ledger-before-names.json\n          cmp --silent artifacts/d1-time-travel-restore/expected-pre-ledger.json artifacts/d1-time-travel-restore/ledger-before-names.json\n          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" --config "$cfg" --json --timestamp "$RESTORE_TIMESTAMP" --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/bookmark-proof.json\n          jq -e --arg bookmark "$RESTORE_BOOKMARK" '.bookmark == $bookmark' artifacts/d1-time-travel-restore/bookmark-proof.json >/dev/null\n          npx --yes wrangler@4.94.0 d1 time-travel info "$DATABASE_NAME" --config "$cfg" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/pre-restore-current-bookmark.json\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "PRAGMA foreign_key_check" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/foreign-key-before.json\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "PRAGMA quick_check" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/quick-before.json\n          jq -e 'length == 1 and .[0].success == true and .[0].results == []' artifacts/d1-time-travel-restore/foreign-key-before.json >/dev/null\n          jq -e 'length == 1 and .[0].success == true and (.[0].results | length) == 1 and (.[0].results[0] | to_entries | map(.value)) == ["ok"]' artifacts/d1-time-travel-restore/quick-before.json >/dev/null\n\n      - name: Consume Time Travel restore authorization\n        run: |\n          set -euo pipefail\n          now="$(date -u +%s)"\n          jq -n --argjson schema 1 --arg kind D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_CONSUMPTION --arg source "$SOURCE_SHA" --arg comment "$AUTHORIZATION_COMMENT_ID" --arg digest "$AUTHORIZATION_DIGEST" --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" --arg id "$DATABASE_ID" --arg bookmark "$RESTORE_BOOKMARK" --argjson timestamp "$RESTORE_TIMESTAMP" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson consumed "$now" '{schema_version:$schema,kind:$kind,source_sha:$source,authorization_comment_id:($comment|tonumber),authorization_digest:$digest,target:{environment:"staging",account_id:$account,database_name:$name,database_id:$id},restore_timestamp_unix_seconds:$timestamp,restore_bookmark:$bookmark,executor_run_id:$run_id,run_attempt:$run_attempt,consumed_at_unix_seconds:$consumed,provider_mutation_executed:false}' > artifacts/d1-time-travel-restore/authorization-consumption.json\n\n      - name: Persist one-shot restore authorization consumption\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n        with:\n          name: d1-time-travel-restore-authorization-consumption-{gh('inputs.restore_authorization_comment_id')}\n          path: artifacts/d1-time-travel-restore/authorization-consumption.json\n          if-no-files-found: error\n          retention-days: 30\n\n      - name: Persist restore MUTATION_STARTED receipt\n        run: |\n          set -euo pipefail\n          now="$(date -u +%s)"\n          jq -n --argjson schema 1 --arg kind D1_TIME_TRAVEL_RESTORE_RECEIPT_V1 --arg status MUTATION_STARTED --arg source "$SOURCE_SHA" --arg comment "$AUTHORIZATION_COMMENT_ID" --arg digest "$AUTHORIZATION_DIGEST" --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DATABASE_NAME" --arg id "$DATABASE_ID" --arg bookmark "$RESTORE_BOOKMARK" --argjson timestamp "$RESTORE_TIMESTAMP" --argjson run_id "$GITHUB_RUN_ID" --argjson run_attempt "$GITHUB_RUN_ATTEMPT" --argjson started "$now" '{schema_version:$schema,kind:$kind,status:$status,source_sha:$source,authorization_comment_id:($comment|tonumber),authorization_digest:$digest,target:{environment:"staging",account_id:$account,database_name:$name,database_id:$id},restore_timestamp_unix_seconds:$timestamp,restore_bookmark:$bookmark,executor_run_id:$run_id,run_attempt:$run_attempt,mutation_started_at_unix_seconds:$started,provider_mutation_executed:false,migration_apply_executed:false,production_mutation:false,second_restore_executed:false}' > artifacts/d1-time-travel-restore/receipt.json\n\n      - name: Restore exact D1 bookmark with deploy credential\n        env:\n          CLOUDFLARE_API_TOKEN: {gh('secrets.CLOUDFLARE_API_TOKEN')}\n        run: |\n          set -euo pipefail\n          test -n "$CLOUDFLARE_API_TOKEN"\n          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database/$DATABASE_ID/time_travel/restore?bookmark=$RESTORE_BOOKMARK"\n          code="$(curl --silent --show-error --request POST --output artifacts/d1-time-travel-restore/restore-result.json --write-out '%{{http_code}}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url")"\n          test "$code" = 200\n          jq -e --arg bookmark "$RESTORE_BOOKMARK" '.success == true and (.errors | length) == 0 and .result.bookmark == $bookmark and (.result.previous_bookmark | type == "string") and (.result.previous_bookmark | length > 0)' artifacts/d1-time-travel-restore/restore-result.json >/dev/null\n          jq '.provider_mutation_executed=true' artifacts/d1-time-travel-restore/receipt.json > artifacts/d1-time-travel-restore/receipt.next.json\n          mv artifacts/d1-time-travel-restore/receipt.next.json artifacts/d1-time-travel-restore/receipt.json\n\n      - name: Fresh post-restore ledger and diagnostics proof\n        env:\n          CLOUDFLARE_API_TOKEN: {gh('secrets.CLOUDFLARE_OBSERVE_API_TOKEN')}\n        run: |\n          set -euo pipefail\n          cfg=artifacts/d1-time-travel-restore/wrangler.json\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "SELECT id, name FROM d1_migrations ORDER BY id" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/ledger-after.json\n          python scripts/d1-executor-plan.py normalize-ledger --ledger artifacts/d1-time-travel-restore/ledger-after.json --output artifacts/d1-time-travel-restore/ledger-after-names.json\n          cmp --silent artifacts/d1-time-travel-restore/expected-post-ledger.json artifacts/d1-time-travel-restore/ledger-after-names.json\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "PRAGMA foreign_key_check" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/foreign-key-after.json\n          npx --yes wrangler@4.94.0 d1 execute "$DATABASE_NAME" --remote --config "$cfg" --command "PRAGMA quick_check" --json --experimental-provision=false --experimental-auto-create=false > artifacts/d1-time-travel-restore/quick-after.json\n          jq -e 'length == 1 and .[0].success == true and .[0].results == []' artifacts/d1-time-travel-restore/foreign-key-after.json >/dev/null\n          jq -e 'length == 1 and .[0].success == true and (.[0].results | length) == 1 and (.[0].results[0] | to_entries | map(.value)) == ["ok"]' artifacts/d1-time-travel-restore/quick-after.json >/dev/null\n          now="$(date -u +%s)"\n          previous="$(jq -r '.result.previous_bookmark' artifacts/d1-time-travel-restore/restore-result.json)"\n          jq --arg status COMPLETED --arg previous "$previous" --argjson completed "$now" '.status=$status | .previous_bookmark=$previous | .completed_at_unix_seconds=$completed | .provider_mutation_executed=true' artifacts/d1-time-travel-restore/receipt.json > artifacts/d1-time-travel-restore/receipt.next.json\n          mv artifacts/d1-time-travel-restore/receipt.next.json artifacts/d1-time-travel-restore/receipt.json\n\n      - name: Terminalize restore receipt fail closed\n        if: always()\n        run: |\n          set -euo pipefail\n          receipt=artifacts/d1-time-travel-restore/receipt.json\n          if [ ! -f "$receipt" ]; then exit 0; fi\n          status="$(jq -r '.status' "$receipt")"\n          if [ "$status" = MUTATION_STARTED ]; then\n            now="$(date -u +%s)"\n            jq --arg status RECOVERY_REQUIRED --argjson failed "$now" '.status=$status | .failed_at_unix_seconds=$failed' "$receipt" > artifacts/d1-time-travel-restore/receipt.next.json\n            mv artifacts/d1-time-travel-restore/receipt.next.json "$receipt"\n          fi\n          jq -e '.status == "COMPLETED" or .status == "RECOVERY_REQUIRED"' "$receipt" >/dev/null\n\n      - name: Persist terminal Time Travel restore receipt\n        if: always() && hashFiles('artifacts/d1-time-travel-restore/receipt.json') != ''\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a\n        with:\n          name: d1-time-travel-restore-receipt-{gh('inputs.restore_authorization_comment_id')}-{gh('github.run_id')}-{gh('github.run_attempt')}\n          path: |\n            artifacts/d1-time-travel-restore/receipt.json\n            artifacts/d1-time-travel-restore/ledger-before-names.json\n            artifacts/d1-time-travel-restore/ledger-after-names.json\n            artifacts/d1-time-travel-restore/restore-result.json\n          if-no-files-found: error\n          retention-days: 30\n'''
          executor += restore_jobs
          executor_path.write_text(executor, encoding='utf-8')

          router_path = Path('.github/workflows/d1-operator-comment-router.yml')
          router = router_path.read_text(encoding='utf-8')
          if '/d1 time-travel-restore ' in router or 'd1-migration-executor.yml/dispatches' in router:
              raise SystemExit('router already contains restore route; refusing non-idempotent patch')
          router = router.replace("      - '.github/workflows/d1-isolated-target-observation.yml'\n      - 'architecture/credential-authority-ar11-extension.json'", "      - '.github/workflows/d1-isolated-target-observation.yml'\n      - '.github/workflows/d1-migration-executor.yml'\n      - 'architecture/credential-authority-ar11-extension.json'")
          if router.count("      - '.github/workflows/d1-migration-executor.yml'") != 2:
              raise SystemExit('router must watch executor on PR and push exactly twice')
          router = replace_once(router, "          observer = Path('.github/workflows/d1-isolated-target-observation.yml').read_text(encoding='utf-8')\n", "          observer = Path('.github/workflows/d1-isolated-target-observation.yml').read_text(encoding='utf-8')\n          executor = Path('.github/workflows/d1-migration-executor.yml').read_text(encoding='utf-8')\n", 'router executor contract input')
          router = replace_once(router, "          assert router.count(dispatch_token) == 2, 'comment router must expose exactly two bounded downstream dispatches'\n          assert ('actions/workflows/d1-operator.yml/' + 'dispatches') in router\n          assert ('actions/workflows/d1-isolated-target-observation.yml/' + 'dispatches') in router\n          assert \"github.event.comment.body == '/d1 operator'\" in router\n          assert \"startsWith(github.event.comment.body, '/d1 time-travel-info ')\" in router\n", "          assert router.count(dispatch_token) == 3, 'comment router must expose exactly three bounded downstream dispatches'\n          assert ('actions/workflows/d1-operator.yml/' + 'dispatches') in router\n          assert ('actions/workflows/d1-isolated-target-observation.yml/' + 'dispatches') in router\n          assert ('actions/workflows/d1-migration-executor.yml/' + 'dispatches') in router\n          assert \"github.event.comment.body == '/d1 operator'\" in router\n          assert \"startsWith(github.event.comment.body, '/d1 time-travel-info ')\" in router\n          assert \"startsWith(github.event.comment.body, '/d1 time-travel-restore ')\" in router\n          assert 'operation_mode:' in executor and 'time_travel_restore' in executor\n          assert 'authorize_restore:' in executor and 'Restore exact D1 bookmark with deploy credential' in executor\n", 'router dispatch contract')
          router = replace_once(router, "        github.event.comment.body == '/d1 operator' ||\n        startsWith(github.event.comment.body, '/d1 time-travel-info ')\n", "        github.event.comment.body == '/d1 operator' ||\n        startsWith(github.event.comment.body, '/d1 time-travel-info ') ||\n        startsWith(github.event.comment.body, '/d1 time-travel-restore ')\n", 'router route predicate')
          router = replace_once(router, "      REPOSITORY_OWNER: ${{ github.repository_owner }}\n", "      REPOSITORY_OWNER: ${{ github.repository_owner }}\n      ADMIN_GH_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}\n", 'router governed admin token')
          router = replace_once(router, "          if body == '/d1 operator':\n              kind = 'operator'\n              timestamp = ''\n          else:\n              match = re.fullmatch(r'/d1 time-travel-info ([0-9]{10})', body)\n              if match is None:\n                  raise SystemExit('owner D1 command is not an exact supported transport command')\n              kind = 'time_travel_info'\n              timestamp = match.group(1)\n          with open(env_path, 'a', encoding='utf-8') as handle:\n              handle.write(f'D1_ROUTE_KIND={kind}\\n')\n              handle.write(f'D1_TIME_TRAVEL_UNIX_SECONDS={timestamp}\\n')\n", "          restore_comment = ''\n          if body == '/d1 operator':\n              kind = 'operator'\n              timestamp = ''\n          else:\n              info = re.fullmatch(r'/d1 time-travel-info ([0-9]{10})', body)\n              restore = re.fullmatch(r'/d1 time-travel-restore ([1-9][0-9]*)', body)\n              if info is not None:\n                  kind = 'time_travel_info'\n                  timestamp = info.group(1)\n              elif restore is not None:\n                  kind = 'time_travel_restore'\n                  timestamp = ''\n                  restore_comment = restore.group(1)\n              else:\n                  raise SystemExit('owner D1 command is not an exact supported transport command')\n          with open(env_path, 'a', encoding='utf-8') as handle:\n              handle.write(f'D1_ROUTE_KIND={kind}\\n')\n              handle.write(f'D1_TIME_TRAVEL_UNIX_SECONDS={timestamp}\\n')\n              handle.write(f'D1_RESTORE_AUTHORIZATION_COMMENT_ID={restore_comment}\\n')\n", 'router exact command parser')
          router = replace_once(router, "        env:\n          GH_TOKEN: ${{ secrets.GH_ADMIN_OPERATOR_TOKEN }}\n", "        env:\n          GH_TOKEN: ${{ env.ADMIN_GH_TOKEN }}\n", 'operator dispatch admin token projection')
          marker = "      - name: Record transport result\n"
          if router.count(marker) != 1:
              raise SystemExit('router record marker missing/ambiguous')
          restore_steps = f'''      - name: Resolve exact restore transport envelope from OWNER authorization\n        if: env.D1_ROUTE_KIND == 'time_travel_restore'\n        env:\n          GH_TOKEN: {gh('github.token')}\n        run: |\n          set -euo pipefail\n          auth="$RUNNER_TEMP/d1-restore-authorization.json"\n          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$D1_RESTORE_AUTHORIZATION_COMMENT_ID" > "$auth"\n          python - "$auth" "$GITHUB_ENV" <<'PY_RESTORE_ROUTE'\n          import json, os, re, sys\n          path, env_path = sys.argv[1:]\n          comment = json.load(open(path, encoding='utf-8'))\n          if (comment.get('user') or {{}}).get('login') != os.environ['REPOSITORY_OWNER'] or comment.get('author_association') != 'OWNER':\n              raise SystemExit('restore authorization must be OWNER-authored')\n          body = comment.get('body')\n          if not isinstance(body, str): raise SystemExit('restore authorization body missing')\n          lines = body.strip().splitlines()\n          if len(lines) != 2 or lines[0] != 'D1_TIME_TRAVEL_RESTORE_AUTHORIZATION_V1':\n              raise SystemExit('restore authorization envelope invalid')\n          raw = lines[1]\n          value = json.loads(raw)\n          if json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False) != raw:\n              raise SystemExit('restore authorization must be canonical JSON')\n          if value.get('source_sha') != os.environ['GITHUB_SHA']:\n              raise SystemExit('restore authorization source does not match protected main')\n          if value.get('authorized_provider_effects') != ['D1_TIME_TRAVEL_RESTORE_ONLY']:\n              raise SystemExit('restore authorization effect mismatch')\n          target = value.get('target') or {{}}\n          if target.get('environment') != 'staging' or target.get('component') != 'catalog':\n              raise SystemExit('restore target must be staging catalog')\n          with open(env_path, 'a', encoding='utf-8') as fh:\n              fh.write(f"RESTORE_COMPONENT={{target.get('component','')}}\\n")\n              fh.write(f"RESTORE_ACCOUNT_ID={{target.get('account_id','')}}\\n")\n              fh.write(f"RESTORE_DATABASE_NAME={{target.get('database_name','')}}\\n")\n              fh.write(f"RESTORE_DATABASE_ID={{target.get('database_id','')}}\\n")\n          PY_RESTORE_ROUTE\n\n      - name: Dispatch one-shot Time Travel restore through sole D1 mutation owner\n        if: env.D1_ROUTE_KIND == 'time_travel_restore'\n        env:\n          GH_TOKEN: {gh('env.ADMIN_GH_TOKEN')}\n        run: |\n          set -euo pipefail\n          test -n "$GH_TOKEN"\n          confirmation="$GITHUB_SHA:staging:time_travel_restore:$D1_RESTORE_AUTHORIZATION_COMMENT_ID"\n          payload="$RUNNER_TEMP/d1-time-travel-restore-dispatch.json"\n          jq -nc --arg ref main --arg source "$GITHUB_SHA" --arg component "$RESTORE_COMPONENT" --arg account "$RESTORE_ACCOUNT_ID" --arg name "$RESTORE_DATABASE_NAME" --arg id "$RESTORE_DATABASE_ID" --arg comment "$D1_RESTORE_AUTHORIZATION_COMMENT_ID" --arg confirmation "$confirmation" '{{ref:$ref,inputs:{{operation_mode:"time_travel_restore",restore_authorization_comment_id:$comment,environment:"staging",source_sha:$source,component:$component,account_id:$account,database_name:$name,database_id:$id,target_release_manifest_json:"{{}}",current_release_manifest_json:"{{}}",known_good_release_manifest_json:"{{}}",preconditions_json:"{{}}",transition_mode:"ordinary",expected_release_set_id:"",prepared_transaction_run_id:"",prepared_transaction_run_attempt:"",transaction_id:"",authorization_digest:"",transaction_authorization_json:"",mutation_authorized:true,confirmation:$confirmation}}}}' > "$payload"\n          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/d1-migration-executor.yml/dispatches" --input "$payload"\n\n'''
          router = router.replace(marker, restore_steps + marker, 1)
          router = replace_once(router, "          if [ \"$D1_ROUTE_KIND\" = operator ]; then\n            downstream='d1-operator.yml / main / zero inputs / owner actor'\n          else\n            downstream=\"d1-isolated-target-observation.yml / main / read-only timestamp=$D1_TIME_TRAVEL_UNIX_SECONDS\"\n          fi\n", "          if [ \"$D1_ROUTE_KIND\" = operator ]; then\n            downstream='d1-operator.yml / main / zero inputs / owner actor'\n          elif [ \"$D1_ROUTE_KIND\" = time_travel_info ]; then\n            downstream=\"d1-isolated-target-observation.yml / main / read-only timestamp=$D1_TIME_TRAVEL_UNIX_SECONDS\"\n          else\n            downstream=\"d1-migration-executor.yml / main / one-shot time_travel_restore authorization_comment=$D1_RESTORE_AUTHORIZATION_COMMENT_ID\"\n          fi\n", 'router summary route')
          router_path.write_text(router, encoding='utf-8')

          patcher = Path('.github/workflows/tx7-restore-source-patcher.yml')
          patcher.unlink()
          PY

          git diff --check
          git status --short
          test ! -e .github/workflows/tx7-restore-source-patcher.yml
          git diff -- .github/workflows/d1-migration-executor.yml .github/workflows/d1-operator-comment-router.yml | sed -n '1,260p'

      - name: Commit exact two-file source result and remove patcher
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/d1-migration-executor.yml .github/workflows/d1-operator-comment-router.yml .github/workflows/tx7-restore-source-patcher.yml
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/d1-migration-executor.yml .github/workflows/d1-operator-comment-router.yml .github/workflows/tx7-restore-source-patcher.yml "
          git commit -m 'TX-7: add issue-triggered one-shot D1 restore'
          git push origin HEAD:tx7-issue-triggered-restore
