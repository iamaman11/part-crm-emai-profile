name: TX-7 Restore Source Patcher

on:
  push:
    branches:
      - tx7-issue-triggered-restore

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'iamaman11' && github.ref == 'refs/heads/tx7-issue-triggered-restore'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: tx7-issue-triggered-restore
          fetch-depth: 0

      - name: Apply exact bounded source patch
        run: python .github/tx7_restore_source_patch.py

      - name: Verify final write-set and commit
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/tx7-restore-source-patcher.yml
          test ! -e .github/tx7_restore_source_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          changed="$(git diff --cached --name-only | sort | tr '\n' ' ')"
          test "$changed" = ".github/tx7_restore_source_patch.py .github/workflows/d1-migration-executor.yml .github/workflows/d1-operator-comment-router.yml .github/workflows/tx7-restore-source-patcher.yml "
          git commit -m 'TX-7: add issue-triggered one-shot D1 restore'
          git push origin HEAD:tx7-issue-triggered-restore
