          from pathlib import Path

          def insert_after(path: Path, marker: str, addition: str, guard: str) -> None:
              text = path.read_text(encoding='utf-8')
              if guard in text:
                  return
              if text.count(marker) != 1:
                  raise SystemExit(f'{path}: expected one marker for {guard!r}')
              path.write_text(text.replace(marker, marker + addition, 1), encoding='utf-8')

          root = Path('Cargo.toml')
          insert_after(root, '    "crates/use-cases-clients",\n', '    "crates/use-cases-devices",\n', '    "crates/use-cases-devices",\n')
          insert_after(root, 'use-cases-clients = { path = "crates/use-cases-clients" }\n', 'use-cases-devices = { path = "crates/use-cases-devices" }\n', 'use-cases-devices = { path = "crates/use-cases-devices" }\n')

          ports_cargo = Path('crates/application-ports/Cargo.toml')
          insert_after(ports_cargo, 'client-domain.workspace = true\n', 'device-domain.workspace = true\n', 'device-domain.workspace = true\n')

          ports_lib = Path('crates/application-ports/src/lib.rs')
          insert_after(ports_lib, 'pub mod commands;\n', 'pub mod device_jobs;\n', 'pub mod device_jobs;\n')

          architecture = Path('scripts/check-architecture.py')
          text = architecture.read_text(encoding='utf-8')
          if '        "device-domain",\n        "profile-domain",' not in text:
              marker = '        "client-domain",\n        "profile-domain",'
              if text.count(marker) != 1:
                  raise SystemExit('architecture application-ports marker changed')
              text = text.replace(marker, '        "client-domain",\n        "device-domain",\n        "profile-domain",', 1)
          if '    "use-cases-devices": {' not in text:
              marker = '    "use-cases-identity": {'
              if text.count(marker) != 1:
                  raise SystemExit('architecture use-case marker changed')
              addition = (
                  '    "use-cases-devices": {\n'
                  '        "profile-platform-primitives",\n'
                  '        "device-domain",\n'
                  '        "application-ports",\n'
                  '    },\n'
              )
              text = text.replace(marker, addition + marker, 1)
