/// Persisted metadata representation. It may represent corrupted storage and
/// therefore becomes a domain aggregate only through [`DeviceJob::restore`].
#[derive(Clone, Debug, Eq, PartialEq)]
pub struct DeviceJobSnapshot {
    pub job_id: DeviceJobId,
    pub target: DeviceJobTarget,
    pub aggregate_version: u64,
    pub status: DeviceJobStatus,
    pub attempt: u32,
    pub max_attempts: u32,
    pub last_fence: u64,
    pub active_claim: Option<DeviceClaimSnapshot>,
    pub retry_at: Option<UnixMillis>,
    pub updated_at: UnixMillis,
}

impl DeviceJob {'''
              text = text.replace(marker, snapshot, 1)
              marker = 'impl DeviceJob {\n    pub fn issue('
              if text.count(marker) != 1:
                  raise SystemExit('job restore method marker changed')
              methods = '''impl DeviceJob {
    #[must_use]
    pub fn snapshot(&self) -> DeviceJobSnapshot {
        DeviceJobSnapshot {
            job_id: self.job_id.clone(),
            target: self.target.clone(),
            aggregate_version: self.version.value(),
            status: self.status,
            attempt: self.attempt,
            max_attempts: self.max_attempts,
            last_fence: self.last_fence,
            active_claim: self.active_claim.as_ref().map(DeviceClaim::snapshot),
            retry_at: self.retry_at,
            updated_at: self.updated_at,
        }
    }

    pub fn restore(snapshot: DeviceJobSnapshot) -> Result<Self, DeviceJobError> {
        let DeviceJobSnapshot { job_id, target, aggregate_version, status, attempt, max_attempts, last_fence, active_claim, retry_at, updated_at } = snapshot;
        if max_attempts == 0 || max_attempts > MAX_DEVICE_JOB_ATTEMPTS || attempt > max_attempts || (attempt == 0 && last_fence != 0) || (attempt > 0 && last_fence < u64::from(attempt)) {
            return Err(DeviceJobError::InvalidSnapshot);
        }
        let requires_attempt = matches!(status, DeviceJobStatus::ProfileBusy | DeviceJobStatus::Running | DeviceJobStatus::RetryScheduled | DeviceJobStatus::AuthRequired | DeviceJobStatus::RecoveryRequired | DeviceJobStatus::Succeeded | DeviceJobStatus::Failed);
        if requires_attempt && attempt == 0 {
            return Err(DeviceJobError::InvalidSnapshot);
        }
        let requires_claim = status == DeviceJobStatus::Running;
        if requires_claim != active_claim.is_some() {
            return Err(DeviceJobError::InvalidSnapshot);
        }
        let requires_retry = matches!(status, DeviceJobStatus::ProfileBusy | DeviceJobStatus::RetryScheduled);
        if requires_retry != retry_at.is_some() || retry_at.is_some_and(|retry_at| retry_at <= updated_at) {
            return Err(DeviceJobError::InvalidSnapshot);
        }
        let active_claim = match active_claim {
            Some(snapshot) => {
                let claim = DeviceClaim::restore(snapshot).map_err(|_| DeviceJobError::InvalidSnapshot)?;
                if claim.job_id() != &job_id || claim.target() != &target || claim.fence() != last_fence || claim.last_heartbeat_at() > updated_at || updated_at >= claim.lease_expires_at() {
                    return Err(DeviceJobError::InvalidSnapshot);
                }
                Some(claim)
            }
            None => None,
        };
        let version = AggregateVersion::new(aggregate_version).map_err(|_| DeviceJobError::InvalidSnapshot)?;
        Ok(Self { job_id, target, version, status, attempt, max_attempts, last_fence, active_claim, retry_at, updated_at })
    }

    pub fn issue('''
