          text = claim.read_text(encoding='utf-8')
          if 'pub struct DeviceClaimSnapshot' not in text:
              marker = '}\n\nimpl DeviceClaim {'
              if text.count(marker) != 1:
                  raise SystemExit('claim snapshot insertion marker changed')
              snapshot = '''}

/// Persisted metadata representation. It is intentionally unvalidated until
/// passed through [`DeviceClaim::restore`].
#[derive(Clone, Debug, Eq, PartialEq)]
pub struct DeviceClaimSnapshot {
    pub claim_id: DeviceClaimId,
    pub job_id: DeviceJobId,
    pub target: DeviceJobTarget,
    pub fence: u64,
    pub claimed_at: UnixMillis,
    pub last_heartbeat_at: UnixMillis,
    pub lease_expires_at: UnixMillis,
}

impl DeviceClaim {'''
