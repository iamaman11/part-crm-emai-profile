name: Phase 2F Device Restore Boundary Materializer

on:
  push:
    branches:
      - phase2f-device-browser-mailbox
    paths:
      - .github/workflows/phase2f-device-usecases-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.ref == 'refs/heads/phase2f-device-browser-mailbox'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 2F branch
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: phase2f-device-browser-mailbox

      - name: Materialize device ownership and typed restore boundary
