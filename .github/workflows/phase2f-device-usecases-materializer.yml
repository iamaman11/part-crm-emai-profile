    #[test]
    fn snapshot_round_trip_preserves_running_claim_binding()
    -> Result<(), Box<dyn std::error::Error>> {
        let mut original = job(3)?;
        original.claim(DeviceClaimId::parse("devclaim_01JRESTORE")?, UnixMillis::new(110), UnixMillis::new(200))?;
        let restored = DeviceJob::restore(original.snapshot())?;
        assert_eq!(restored, original);
        Ok(())
    }

    #[test]
    fn restore_rejects_impossible_status_claim_retry_and_version_combinations()
    -> Result<(), Box<dyn std::error::Error>> {
        let mut running = job(3)?;
        running.claim(DeviceClaimId::parse("devclaim_01JRESTORE")?, UnixMillis::new(110), UnixMillis::new(200))?;
        let valid = running.snapshot();
        let mut missing_claim = valid.clone();
        missing_claim.active_claim = None;
        assert_eq!(DeviceJob::restore(missing_claim), Err(DeviceJobError::InvalidSnapshot));
        let mut stale_fence = valid.clone();
        stale_fence.last_fence = stale_fence.last_fence.saturating_add(1);
        assert_eq!(DeviceJob::restore(stale_fence), Err(DeviceJobError::InvalidSnapshot));
        let mut zero_version = valid.clone();
        zero_version.aggregate_version = 0;
        assert_eq!(DeviceJob::restore(zero_version), Err(DeviceJobError::InvalidSnapshot));
        let mut too_many_attempts = valid.clone();
        too_many_attempts.attempt = too_many_attempts.max_attempts.saturating_add(1);
        assert_eq!(DeviceJob::restore(too_many_attempts), Err(DeviceJobError::InvalidSnapshot));
        let mut retry_without_time = valid;
        retry_without_time.status = DeviceJobStatus::RetryScheduled;
        retry_without_time.active_claim = None;
        retry_without_time.retry_at = None;
        assert_eq!(DeviceJob::restore(retry_without_time), Err(DeviceJobError::InvalidSnapshot));
        Ok(())
    }

    #[test]
    fn restore_rejects_claim_target_and_timeline_corruption()
    -> Result<(), Box<dyn std::error::Error>> {
        let mut running = job(3)?;
        running.claim(DeviceClaimId::parse("devclaim_01JRESTORE")?, UnixMillis::new(110), UnixMillis::new(200))?;
        let valid = running.snapshot();
        let mut wrong_target = valid.clone();
        if let Some(claim) = wrong_target.active_claim.as_mut() {
            claim.target = DeviceJobTarget::new(TenantId::parse("tenant_01JOTHER")?, DeviceId::parse("device_01JOTHER")?, ProfileId::parse("profile_01JOTHER")?, GenerationId::parse("generation_01JOTHER")?);
        }
        assert_eq!(DeviceJob::restore(wrong_target), Err(DeviceJobError::InvalidSnapshot));
        let mut future_heartbeat = valid.clone();
        if let Some(claim) = future_heartbeat.active_claim.as_mut() {
            claim.last_heartbeat_at = UnixMillis::new(111);
        }
        assert_eq!(DeviceJob::restore(future_heartbeat), Err(DeviceJobError::InvalidSnapshot));
        let mut expired_at_update = valid;
        expired_at_update.updated_at = UnixMillis::new(200);
        assert_eq!(DeviceJob::restore(expired_at_update), Err(DeviceJobError::InvalidSnapshot));
        Ok(())
    }
'''
