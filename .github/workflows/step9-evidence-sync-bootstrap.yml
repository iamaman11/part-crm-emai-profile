name: Step 9 Evidence Sync Bootstrap

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: step9-evidence-sync-bootstrap
  cancel-in-progress: false

jobs:
  synchronize-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repository-step-9-evidence-sync
          persist-credentials: true

      - name: Synchronize accepted Step 9 evidence
        run: python scripts/sync-step9-evidence.py

      - name: Remove temporary synchronization files
        run: git rm .github/workflows/step9-evidence-sync-bootstrap.yml scripts/sync-step9-evidence.py .step9-evidence-trigger

      - name: Validate evidence and status
        run: |
          python -m json.tool docs/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("docs/status.json").read_text(encoding="utf-8"))
          assert status["repository_step"]["number"] == 9
          assert status["repository_step"]["accepted_source_head"] == "73685241a6d70cf6d8ec80210d94b66cf37b1b45"
          assert status["repository_step"]["squash_merge"] == "bc5286e3fea767acf955fb2622dab6221ecf1c3b"
          assert status["next_repository_step"]["number"] == 10
          assert status["decisions"]["adr_0006"] == "proposed_blocks_production"
          assert status["production_ready"] is False
          assert len([step for step in status["accepted_steps"] if step["number"] == 9]) == 1

          readme = Path("README.md").read_text(encoding="utf-8")
          index = Path("docs/TEST_EVIDENCE_INDEX.md").read_text(encoding="utf-8")
          report = Path("docs/evidence/2026-08-06-repository-step-9-encrypted-cloud-generations.md")
          assert "Repository Steps 0–9 приняты" in readme
          assert "Repository Step 10: Certification And Multi-Device" in readme
          assert "Repository Step 9 / PR #30" in index
          assert report.is_file()
          PY
          git diff --check

      - name: Commit evidence synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repository Step 9: synchronize accepted evidence"
          git fetch origin repository-step-9-evidence-sync
          git rebase origin/repository-step-9-evidence-sync
          git push origin HEAD:repository-step-9-evidence-sync
