name: AR-6 Python Estate Staging

on:
  push:
    branches:
      - agent/ar6-python-estate-staging

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: List tracked Python files
        shell: bash
        run: |
          git ls-files '*.py' | sort
          echo "COUNT=$(git ls-files '*.py' | wc -l)"
