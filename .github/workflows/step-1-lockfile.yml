name: Step 1 Lockfile

on:
  pull_request:
  push:
    branches:
      - repository-step-1-cloudflare-cold-build

permissions:
  contents: write

concurrency:
  group: step-1-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Show pinned toolchain
        run: rustup show active-toolchain

      - name: Generate dependency lock
        run: |
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null

      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: lock Cloudflare worker dependencies"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
