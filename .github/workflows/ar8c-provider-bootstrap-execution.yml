name: AR-8C Staging Provider Bootstrap Execution

on:
  workflow_dispatch:
    inputs:
      google_oauth_client_id:
        description: 'Authoritative staging Google OAuth public client ID (not a secret)'
        required: true
        type: string
      microsoft_oauth_client_id:
        description: 'Authoritative staging Microsoft OAuth public client ID (not a secret)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ar8c-staging-provider-bootstrap-execution
  cancel-in-progress: false

jobs:
  bootstrap:
    name: AR-8C Protected Staging Provider Bootstrap
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      AR8C_TARGET_ENVIRONMENT: staging
      AR8C_GOOGLE_OAUTH_CLIENT_ID: ${{ inputs.google_oauth_client_id }}
      AR8C_MICROSOFT_OAUTH_CLIENT_ID: ${{ inputs.microsoft_oauth_client_id }}
      GH_BOOTSTRAP_ADMIN_TOKEN: ${{ secrets.GH_BOOTSTRAP_ADMIN_TOKEN }}
      CLOUDFLARE_BOOTSTRAP_TOKEN: ${{ secrets.CLOUDFLARE_BOOTSTRAP_TOKEN }}
      CLOUDFLARE_TOKEN_ISSUER_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN_ISSUER_TOKEN }}
      CLOUDFLARE_RESOLVER_SECRETS_JSON: ${{ secrets.CLOUDFLARE_RESOLVER_SECRETS_JSON }}
      CLOUDFLARE_CONTROL_PLANE_SECRETS_JSON: ${{ secrets.CLOUDFLARE_CONTROL_PLANE_SECRETS_JSON }}
    steps:
      - name: Checkout exact dispatched main source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact accepted-main execution boundary
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up exact Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      - name: Enforce runtime and GitHub CLI availability
        run: |
          test "$(node --version)" = "v24.19.0"
          command -v gh >/dev/null

      - name: Validate execution implementation before secret mutation
        run: |
          node .github/scripts/ar8c-provider-bootstrap-execution.mjs self-test
          node .github/scripts/ar8c-provider-bootstrap-execution-contract.mjs

      - name: Re-run protected provider identity and credential preflight
        run: node .github/scripts/ar8c-staging-bootstrap-preflight.mjs

      - name: Re-classify staging D1 candidates without mutation
        run: node .github/scripts/ar8c-staging-d1-classification.mjs

      - name: Execute bounded provider credential and configuration handoff
        run: node .github/scripts/ar8c-provider-bootstrap-execution.mjs execute
