name: Encrypted Generation Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: encrypted-generation-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  encrypted-generation-linux:
    name: Encrypted Generation Linux And WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Compile Step 9 policy
        run: python -m py_compile scripts/check-step9-encrypted-generation.py

      - name: Enforce Step 9 encrypted generation boundary
        run: python scripts/check-step9-encrypted-generation.py

      - name: Prove key-output fixture is rejected
        run: |
          if python scripts/check-step9-encrypted-generation.py --root tests/encrypted-generation/fixtures/logs-key; then
            echo "Key-output fixture unexpectedly passed." >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy encrypted generation crate
        run: cargo clippy --locked -p encrypted-generation-domain --all-targets -- -D warnings

      - name: Test encrypted generation lifecycle
        run: cargo test --locked -p encrypted-generation-domain

      - name: Add Workers WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Check pure encrypted generation crate for Workers WASM
        run: cargo check --locked -p encrypted-generation-domain --target wasm32-unknown-unknown

  encrypted-generation-windows:
    name: Encrypted Generation Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source checkout
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -c "import os, subprocess; actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(); expected = os.environ['EXPECTED_SOURCE_SHA']; assert actual == expected, f'expected {expected}, got {actual}'"

      - name: Test encrypted generation lifecycle
        run: cargo test --locked -p encrypted-generation-domain
