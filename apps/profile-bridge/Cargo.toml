[package]
name = "profile-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
default-run = "profile-bridge"
autobins = false

[features]
default = []
synthetic-test-bin = []

[[bin]]
name = "profile-bridge"
path = "src/main.rs"

[[bin]]
name = "profile-bridge-synthetic"
path = "src/bin/profile-bridge-synthetic.rs"
required-features = ["synthetic-test-bin"]

[[test]]
name = "ipc_protocol_failure_matrix"
path = "tests/ipc_protocol_failure_matrix.rs"
required-features = ["synthetic-test-bin"]

[[test]]
name = "operator_flow_acceptance"
path = "tests/operator_flow_acceptance.rs"
required-features = ["synthetic-test-bin"]

[[test]]
name = "runtime_failure_matrix"
path = "tests/runtime_failure_matrix.rs"
required-features = ["synthetic-test-bin"]

[[test]]
name = "synthetic_operator_cli"
path = "tests/synthetic_operator_cli.rs"
required-features = ["synthetic-test-bin"]

[dependencies]
application-ports.workspace = true
bridge-domain.workspace = true
browser-execution-domain.workspace = true
control-plane-contract = { path = "../../crates/control-plane-contract" }
device-domain.workspace = true
encrypted-generation-domain.workspace = true
profile-platform-primitives.workspace = true
runtime-bundle-domain.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
session-domain.workspace = true
sha2.workspace = true
lz4_flex = "=0.14.0"
flate2 = { version = "=1.1.5", default-features = false, features = ["rust_backend"] }
tempfile = "=3.23.0"
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
futures-util = "=0.3.34"
native-tls = "=0.2.18"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "http2", "stream", "system-proxy"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "macros"] }
windows-device-key = { path = "../../platform/windows-device-key" }
windows-desktop-ui = { path = "../../platform/windows-desktop-ui" }
windows-delivery-signature = { path = "../../platform/windows-delivery-signature" }

[lints]
workspace = true





