[package]
name = "windows-device-key"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
path = "src/lib.rs"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
