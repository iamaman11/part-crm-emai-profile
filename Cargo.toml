[workspace]
members = [
    "apps/foundation-check",
    "crates/primitives",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
