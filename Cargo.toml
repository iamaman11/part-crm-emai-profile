[workspace]
members = [
    "apps/control-plane-worker",
    "apps/foundation-check",
    "apps/profile-bridge",
    "crates/application-ports",
    "crates/bridge-domain",
    "crates/client-domain",
    "crates/cloudflare-adapters",
    "crates/contracts",
    "crates/control-plane-contract",
    "crates/identity-access-domain",
    "crates/mailbox-domain",
    "crates/primitives",
    "crates/profile-domain",
    "crates/runtime-bundle-domain",
    "crates/session-domain",
    "crates/use-cases",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
application-ports = { path = "crates/application-ports" }
bridge-domain = { path = "crates/bridge-domain" }
client-domain = { path = "crates/client-domain" }
cloudflare-adapters = { path = "crates/cloudflare-adapters" }
contracts = { path = "crates/contracts" }
identity-access-domain = { path = "crates/identity-access-domain" }
mailbox-domain = { path = "crates/mailbox-domain" }
profile-domain = { path = "crates/profile-domain" }
profile-platform-primitives = { path = "crates/primitives" }
runtime-bundle-domain = { path = "crates/runtime-bundle-domain" }
session-domain = { path = "crates/session-domain" }
wasm-bindgen = "=0.2.126"
worker = { version = "=0.8.5", features = ["d1", "queue"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
