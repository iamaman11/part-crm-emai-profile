[workspace]
members = [
    "apps/control-plane-worker",
    "apps/foundation-check",
    "apps/mailbox-secret-resolver-worker",
    "apps/profile-bridge",
    "crates/application-ports",
    "crates/bridge-domain",
    "crates/browser-execution-domain",
    "crates/certification-domain",
    "crates/client-domain",
    "crates/device-domain",
    "crates/cloudflare-adapters",
    "crates/contracts",
    "crates/control-plane-contract",
    "crates/encrypted-generation-domain",
    "crates/identity-access-domain",
    "crates/mailbox-domain",
    "crates/notification-domain",
    "crates/primitives",
    "crates/profile-domain",
    "crates/runtime-bundle-domain",
    "crates/session-domain",
    "crates/use-cases",
    "crates/use-cases-clients",
    "crates/use-cases-devices",
    "crates/use-cases-identity",
    "crates/use-cases-mailboxes",
    "crates/use-cases-notifications",
    "crates/use-cases-query",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "alloc", "zeroize"] }
application-ports = { path = "crates/application-ports" }
bridge-domain = { path = "crates/bridge-domain" }
browser-execution-domain = { path = "crates/browser-execution-domain" }
certification-domain = { path = "crates/certification-domain" }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
client-domain = { path = "crates/client-domain" }
device-domain = { path = "crates/device-domain" }
cloudflare-adapters = { path = "crates/cloudflare-adapters" }
contracts = { path = "crates/contracts" }
control-plane-contract = { path = "crates/control-plane-contract" }
encrypted-generation-domain = { path = "crates/encrypted-generation-domain" }
hmac = { version = "=0.13.0", default-features = false }
identity-access-domain = { path = "crates/identity-access-domain" }
mailbox-domain = { path = "crates/mailbox-domain" }
notification-domain = { path = "crates/notification-domain" }
profile-domain = { path = "crates/profile-domain" }
profile-platform-primitives = { path = "crates/primitives" }
runtime-bundle-domain = { path = "crates/runtime-bundle-domain" }
session-domain = { path = "crates/session-domain" }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util"] }
use-cases = { path = "crates/use-cases" }
use-cases-clients = { path = "crates/use-cases-clients" }
use-cases-devices = { path = "crates/use-cases-devices" }
use-cases-identity = { path = "crates/use-cases-identity" }
use-cases-mailboxes = { path = "crates/use-cases-mailboxes" }
use-cases-notifications = { path = "crates/use-cases-notifications" }
use-cases-query = { path = "crates/use-cases-query" }
wasm-bindgen = "=0.2.126"
worker = { version = "=0.8.5", features = ["d1", "queue"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
