[workspace]
members = [
    "apps/control-plane-worker",
    "apps/foundation-check",
    "crates/control-plane-contract",
    "crates/primitives",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
worker = { version = "=0.8.5", features = ["d1", "queue"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
